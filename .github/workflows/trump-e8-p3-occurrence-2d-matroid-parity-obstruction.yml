name: TRUMP E8 P3 occurrence 2D matroid-parity obstruction

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P3_OCCURRENCE_2D_MATROID_PARITY_LIFT_OBSTRUCTION_2026-09-30_v2.8.json'
      - 'research/tools/e8_p3_occurrence_2d_matroid_parity_obstruction/checker.py'
      - '.github/workflows/trump-e8-p3-occurrence-2d-matroid-parity-obstruction.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact 2D-subspace obstruction regression
        run: python research/tools/e8_p3_occurrence_2d_matroid_parity_obstruction/checker.py
