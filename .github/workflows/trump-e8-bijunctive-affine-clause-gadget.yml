name: TRUMP E8 Bijunctive-Affine Clause Gadget

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_BIJUNCTIVE_AFFINE_CLAUSE_GADGET_CARRIER_2026-09-30_v4.1.json'
      - 'research/tools/e8_bijunctive_affine_clause_gadget/checker.py'
      - '.github/workflows/trump-e8-bijunctive-affine-clause-gadget.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact bijunctive-affine gadget regression
        run: python research/tools/e8_bijunctive_affine_clause_gadget/checker.py
