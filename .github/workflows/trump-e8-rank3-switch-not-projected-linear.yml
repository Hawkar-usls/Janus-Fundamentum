name: TRUMP E8 Rank3 Switch Not Projected Linear

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RANK3_SWITCH_NOT_PROJECTED_LINEAR_DELTA_MATROID_2026-09-30_v2.8.json'
      - 'research/tools/e8_rank3_switch_not_projected_linear/checker.py'
      - '.github/workflows/trump-e8-rank3-switch-not-projected-linear.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact projected-linearity obstruction checker
        run: python research/tools/e8_rank3_switch_not_projected_linear/checker.py
