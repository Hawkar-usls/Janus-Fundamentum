name: Validate C024 Unshielded Lineage Localization

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_unshielded_lineage_localization.py"
      - ".github/workflows/validate-c024-unshielded-lineage-localization.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_unshielded_lineage_localization.py"
      - ".github/workflows/validate-c024-unshielded-lineage-localization.yml"

permissions:
  contents: read

jobs:
  unshielded-lineage-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Localize singleton-singleton dangerous lineages
        run: python experiments/direct/janus_tear_gt_unshielded_lineage_localization.py
