name: JANUS PIPPI JUXTAPOSE Coldstart v3.2

on:
  push:
    branches:
      - research/janus-keymaster-calibration-pivot-slime-topa-2026-08-28
    paths:
      - 'experiments/mad_lab/adaptive_pippi_juxtapose_coldstart_v3_2.py'
      - '.github/workflows/run-pippi-juxtapose-coldstart-v3-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/TOPA
          ref: 7cd9225d78c881093d8f00df33124d5dba1e8c90
          path: _topa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure PyTorch CPU
        shell: bash
        run: |
          set -euo pipefail
          if ! python -c 'import torch; print(torch.__version__)'; then
            python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          fi
      - name: Compile and exact guards
        run: |
          python -m py_compile \
            experiments/mad_lab/adaptive_pippi_juxtapose_coldstart_v3.py \
            experiments/mad_lab/adaptive_pippi_juxtapose_coldstart_v3_2.py
          python -m experiments.mad_lab.asymmetric_pq_track_relabelled
          python -m experiments.mad_lab.keymaster_scalable_feature_tokens
          python -m experiments.mad_lab.keymaster_scalable_exact_root_labels
          python -m experiments.mad_lab.keymaster_scalable_exact_2cnf_transition
          python -m experiments.mad_lab.keymaster_adviser_governance_v2
          python _topa/tools/topa_spider_attention_ecosystem.py self-test
      - name: Run fresh v3.2 coldstart gauntlet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pippi-coldstart-v3-2
          python -m experiments.mad_lab.adaptive_pippi_juxtapose_coldstart_v3_2 \
            --topa-dir _topa \
            --out-dir artifacts/pippi-coldstart-v3-2 \
            --base-formulas-per-stage 4 \
            --max-recovery-laps 3 \
            --time-budget-seconds 900 \
            | tee /tmp/pippi-coldstart-v3-2.log
      - name: Scientific firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/pippi-coldstart-v3-2/gauntlet-result.json').read_text())
          assert p['schema']=='JANUS/PIPPI/JUXTAPOSE-COLDSTART-GAUNTLET/v3.2.0'
          assert p['status']=='RUTHLESS_GAUNTLET_COMPLETE__EXACT_ROOT_TRANSITIONS_VERIFIED'
          assert p['P_VS_NP']=='OPEN'
          b=p['bootstrap']
          assert b['status']=='WARM_HISTORY_REPLAYED_BEFORE_NEW_EXAM'
          assert b['total_exact_lesson_formulas']==60
          c=p['controlled_change_v3_2']
          assert c['scheduler_only'] is True
          assert c['JGPT_changed'] is False and c['SLIME_changed'] is False
          assert c['M2R_changed'] is False and c['SPIDER_changed'] is False
          assert c['adviser_governance_changed'] is False
          assert c['warm_history_changed'] is False
          assert c['accounting_changed'] is False
          assert c['fresh_seed_namespace']==4900000000
          assert c['v3_1_holdout_imported_as_training'] is False
          fw=p['scientific_firewall']
          assert fw['FRESH_STAGE_SCORED_BEFORE_LEARNING_FROM_IT'] is True
          assert fw['EVERY_COUNTED_ROOT_TRANSITION_EXACT_VERIFIED'] is True
          assert fw['ALL_CLONE_COMPUTE_IS_CHARGED'] is True
          assert fw['V3_2_FRESH_NAMESPACE_DISJOINT_FROM_V3_1_BY_CONSTRUCTION'] is True
          assert fw['HOT_BATCH_TAX_REMOVED'] is True
          assert fw['COLD_FULL_FIELD_REFLEX_PRESERVED'] is True
          assert fw['P_VS_NP']=='OPEN'
          boss=p['boss_250x250']
          assert boss is not None and boss['formula_count']==4
          assert boss['strict_min_raw_cap'] is True
          assert boss['cap_policy']=='EXACT_MIN_RAW_ONLY'
          print('PIPPI_JUXTAPOSE_COLDSTART_V3_2_FIREWALL=PASS')
          print('FRONTIER='+json.dumps(p['official_frontier'],sort_keys=True))
          print('STOP_REASON='+str(p['stop_reason']))
          print('BOSS_SCORE='+str(boss['score']))
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-pippi-juxtapose-coldstart-v3-2
          path: artifacts/pippi-coldstart-v3-2
          if-no-files-found: error
          retention-days: 90
