name: Validate C049.1 B5.4 corrected discovery to C047 rebound

on:
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B5_4_CORRECTED_DISCOVERY_C047_REBOUND_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound.py'
      - 'experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound_verifier.py'
      - '.github/workflows/validate-c049-1-b5-4-corrected-discovery-c047-rebound.yml'
  workflow_dispatch:

jobs:
  b5-4-c047-rebound:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: experiments/direct
      SPEC: experiments/direct/C049_1_B5_4_CORRECTED_DISCOVERY_C047_REBOUND_SPEC_V1.json
      PRODUCER: experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound.py
      VERIFIER: experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound_verifier.py
      B51_SPEC: experiments/direct/C049_1_B5_1_GENERIC_CORRECTED_RUNTIME_TRACE_EXECUTOR_SPEC_V1.json
      B51_PRODUCER: experiments/direct/janus_c049_1_b5_1_generic_corrected_runtime_trace_executor.py
      B51_VERIFIER: experiments/direct/janus_c049_1_b5_1_generic_corrected_runtime_trace_executor_verifier.py
      B52A_SPEC: experiments/direct/C049_1_B5_2A_GENERIC_ALGORITHM2_PROVENANCE_CARRIER_AMENDMENT_V1_1.json
      B52A_PRODUCER: experiments/direct/janus_c049_1_b5_2a_generic_algorithm2_provenance_carrier_v11.py
      B52A_VERIFIER: experiments/direct/janus_c049_1_b5_2a_generic_algorithm2_provenance_carrier_verifier_v11.py
      B52B_SPEC: experiments/direct/C049_1_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_RECONSTRUCTION_SPEC_V1.json
      B52B_PRODUCER: experiments/direct/janus_c049_1_b5_2b_generic_algorithm2_printorder_reconstruction.py
      B52B_VERIFIER: experiments/direct/janus_c049_1_b5_2b_generic_algorithm2_printorder_reconstruction_verifier_v11.py
      B52B_RECEIPT: experiments/direct/audits/C049_1_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_RECONSTRUCTION_ADMISSION_F057B7AF.json
      B53_RECEIPT: experiments/direct/audits/C049_1_B5_3_GENERIC_EMPTY_ROOT_TERMINAL_COMPOSITION_ADMISSION_E9841522.json
      PHASE_CORE: experiments/direct/janus_c049_fpt_integration_core.py
      PHASE_SOLVER: experiments/direct/janus_c049_fpt_integration_solver.py
      PHASE_VERIFIER: experiments/direct/janus_c049_fpt_integration_verifier.py
      PHASE_WRAPPER: experiments/direct/janus_c049_fpt_integration.py
      C047_CORE: experiments/direct/janus_c047_affine_trellis_core.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind B5.4 exact-head bytes and immutable authority surfaces
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then PROOF_HEAD="${{ github.event.pull_request.head.sha }}"; else PROOF_HEAD="$GITHUB_SHA"; fi
          echo "PROOF_HEAD=$PROOF_HEAD" >> "$GITHUB_ENV"
          for f in "$SPEC" "$PRODUCER" "$VERIFIER"; do test "$(git rev-parse "$PROOF_HEAD:$f")" = "$(git hash-object "$f")"; done
          test "$(git hash-object "$B51_SPEC")" = "64f65e4a68cab437392148519af667352fe0665c"
          test "$(git hash-object "$B51_PRODUCER")" = "8be92b8a663e0d05535861c6f216db28094014fb"
          test "$(git hash-object "$B51_VERIFIER")" = "ac40b3f3a370f697e29402e1e1cb3e514b799792"
          test "$(git hash-object "$B52A_SPEC")" = "fda6f7d45d0273f957c13014fa62718bc19b465e"
          test "$(git hash-object "$B52A_PRODUCER")" = "9159ad8fb03b47eab354ae85e6756037818597e8"
          test "$(git hash-object "$B52A_VERIFIER")" = "57c95af433b2b97c53a51132f6d3128884f7f6c9"
          test "$(git hash-object "$B52B_SPEC")" = "02f1fa3926b70d775dc3415240d6d153007d21a8"
          test "$(git hash-object "$B52B_PRODUCER")" = "90a13116ff7999f81a744d56e0bae56eb6af5ed1"
          test "$(git hash-object "$B52B_VERIFIER")" = "5911c566bab0193214c8aa1b11c49d5d205e2f43"
          test "$(git hash-object "$B52B_RECEIPT")" = "5e60eff4a4bd4c87cbf527cd446fc6b23b013774"
          test "$(git hash-object "$B53_RECEIPT")" = "32177caa648290b65c8ec9c10fa4c357652515e6"
          test "$(git hash-object "$PHASE_CORE")" = "5eb806a079343f00622886c448d2bfbfa412cbfe"
          test "$(git hash-object "$PHASE_SOLVER")" = "70c06752890e797bdf3a7c87c2cb41703fade163"
          test "$(git hash-object "$PHASE_VERIFIER")" = "6ae98df69ff53b6157c171cea619865af533c07c"
          test "$(git hash-object "$PHASE_WRAPPER")" = "8894ede26f52c04d903a59ea1c435c6ee23c67da"
          test "$(git hash-object "$C047_CORE")" = "c2905332a83b175eea8bd0a326e1a63555b2130a"
          test "$(git rev-parse a8e1310dc064197a38284f3bdf8c2d58f0649a07:$B52B_RECEIPT)" = "5e60eff4a4bd4c87cbf527cd446fc6b23b013774"
          test "$(git rev-parse a5e8b45f36a45dd5a0bea148af3f7f90fbcd136e:$B53_RECEIPT)" = "32177caa648290b65c8ec9c10fa4c357652515e6"
          echo 'B5_4_EXACT_HEAD_AND_AUTHORITY_BINDING = PASS'

      - name: Compile and enforce independent verifier and no C047 reimplementation
        run: |
          set -euo pipefail
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound.py')
          v=Path('experiments/direct/janus_c049_1_b5_4_corrected_discovery_c047_rebound_verifier.py')
          imports=[]
          for n in ast.walk(ast.parse(v.read_text())):
              if isinstance(n,ast.Import): imports += [a.name for a in n.names]
              elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          assert not any(x.endswith('janus_c049_1_b5_4_corrected_discovery_c047_rebound') for x in imports)
          for path in (p,v):
              text=path.read_text()
              for forbidden in ['def solve_trellis(','def affine_trellis(','P_VS_NP = CLOSED','POLYNOMIAL_RUNTIME = ESTABLISHED','AFFINE_INSTANCE_UNSAT = TRUE','AFFINE_INSTANCE_SAT = TRUE']:
                  assert forbidden not in text,(path,forbidden)
          print('B5_4_INDEPENDENT_VERIFIER_DECOUPLING = PASS')
          print('B5_4_HISTORICAL_C047_REIMPLEMENTATION = FORBIDDEN')
          print('B5_4_STRICT_CLAIM_CEILING = PASS')
          PY

      - name: Build rebound control inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          AFF='janus.c049_1.c047_affine_equations.v1'
          def off(eqs): return {'schema':AFF,'equations':eqs}
          def w(name,x): Path('/tmp/'+name+'.json').write_text(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n')
          caps={'max_boundary_dim':2,'max_k':1,'max_full_set_entries':5000,'max_child_pairs':100000,'max_join_paths':500000}
          sat={'ambient_dim':2,'k':0,'caps':caps,'factors':[{'id':'alpha','normal_space':[1],'affine_offset':off([[1,0]])},{'id':'beta','normal_space':[2],'affine_offset':off([[2,0]])}],'tree':{'root':'root','nodes':[{'id':'root','left':'la','right':'lb'},{'id':'la','factor_id':'alpha'},{'id':'lb','factor_id':'beta'}]}}
          sat_reordered={'ambient_dim':2,'k':0,'caps':caps,'factors':list(reversed(sat['factors'])),'tree':{'root':'root','nodes':list(reversed(sat['tree']['nodes']))}}
          unsat={'ambient_dim':1,'k':1,'caps':caps,'factors':[{'id':'left','normal_space':[1],'affine_offset':off([[1,0]])},{'id':'right','normal_space':[1],'affine_offset':off([[1,1]])}],'tree':{'root':'r','nodes':[{'id':'l','factor_id':'left'},{'id':'r','left':'l','right':'q'},{'id':'q','factor_id':'right'}]}}
          opaque={'ambient_dim':2,'k':0,'caps':caps,'factors':[{'id':'alpha','normal_space':[1],'affine_offset':{'opaque':'A'}},{'id':'beta','normal_space':[2],'affine_offset':{'opaque':'B'}}],'tree':sat['tree']}
          inconsistent={'ambient_dim':2,'k':0,'caps':caps,'factors':[{'id':'alpha','normal_space':[1],'affine_offset':off([[1,0],[1,1]])},{'id':'beta','normal_space':[2],'affine_offset':off([[2,0]])}],'tree':sat['tree']}
          empty={'ambient_dim':1,'k':0,'caps':caps,'factors':[{'id':'left','normal_space':[1],'affine_offset':off([[1,0]])},{'id':'right','normal_space':[1],'affine_offset':off([[1,1]])}],'tree':unsat['tree']}
          opened=json.loads(json.dumps(empty)); opened['caps']['max_boundary_dim']=0
          basis={'ambient_dim':2,'k':0,'caps':caps,'factors':[{'id':'gamma','normal_space':[1,2],'affine_offset':off([[1,0],[2,0]])}],'tree':{'root':'g','nodes':[{'id':'g','factor_id':'gamma'}]}}
          for name,x in [('sat',sat),('sat-reordered',sat_reordered),('unsat',unsat),('opaque',opaque),('inconsistent',inconsistent),('empty',empty),('b5-open',opened),('basis-order',basis)]: w(name,x)
          print('B5_4_CONTROL_INPUTS = 8')
          PY

      - name: Rebuild B5.1 B5.2A B5.2B subjects
        run: |
          set -euo pipefail
          for name in sat sat-reordered unsat opaque inconsistent empty basis-order; do
            python "$B51_PRODUCER" --spec "$B51_SPEC" --input "/tmp/$name.json" --output "/tmp/$name.b51.json" > "/tmp/$name.b51.log"
            python "$B51_VERIFIER" --spec "$B51_SPEC" --input "/tmp/$name.json" --candidate "/tmp/$name.b51.json" > "/tmp/$name.b51v.log"
            grep -F 'CAPABILITY_STATUS = CLOSED_COMPLETE_TRACE' "/tmp/$name.b51.log"
            python "$B52A_PRODUCER" --spec "$B52A_SPEC" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --output "/tmp/$name.carrier.json" > "/tmp/$name.carrier.log"
            python "$B52A_VERIFIER" --spec "$B52A_SPEC" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --candidate "/tmp/$name.carrier.json" > "/tmp/$name.carrierv.log"
            python "$B52B_PRODUCER" --spec "$B52B_SPEC" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --carrier "/tmp/$name.carrier.json" --output "/tmp/$name.b52b.json" > "/tmp/$name.b52b.log"
            python "$B52B_VERIFIER" --spec "$B52B_SPEC" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --carrier "/tmp/$name.carrier.json" --candidate "/tmp/$name.b52b.json" > "/tmp/$name.b52bv.log"
            grep -F 'JANUS_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_INDEPENDENT_VERIFIER_V1_1 = PASS' "/tmp/$name.b52bv.log"
          done
          python "$B51_PRODUCER" --spec "$B51_SPEC" --input /tmp/b5-open.json --output /tmp/b5-open.b51.json > /tmp/b5-open.b51.log
          python "$B51_VERIFIER" --spec "$B51_SPEC" --input /tmp/b5-open.json --candidate /tmp/b5-open.b51.json > /tmp/b5-open.b51v.log
          grep -F 'CAPABILITY_STATUS = OPEN_RUNTIME_CAPABILITY' /tmp/b5-open.b51.log
          cmp /tmp/sat.b51.json /tmp/sat-reordered.b51.json
          cmp /tmp/sat.carrier.json /tmp/sat-reordered.carrier.json
          cmp /tmp/sat.b52b.json /tmp/sat-reordered.b52b.json
          echo 'B5_4_UPSTREAM_DISCOVERY_CHAIN_REBUILD = PASS'

      - name: Run and independently verify B5.4 terminal and branch controls
        run: |
          set -euo pipefail
          for name in sat sat-reordered unsat opaque inconsistent empty basis-order; do
            python "$PRODUCER" --spec "$SPEC" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --carrier "/tmp/$name.carrier.json" --b5-2b-artifact "/tmp/$name.b52b.json" --output "/tmp/$name.b54.json" > "/tmp/$name.b54.log"
            python "$VERIFIER" --spec "$SPEC" --carrier-spec "$B52A_SPEC" --b5-2b-spec "$B52B_SPEC" --b5-2b-admission "$B52B_RECEIPT" --b5-3-admission "$B53_RECEIPT" --input "/tmp/$name.json" --b5-1-artifact "/tmp/$name.b51.json" --carrier "/tmp/$name.carrier.json" --b5-2b-artifact "/tmp/$name.b52b.json" --candidate "/tmp/$name.b54.json" > "/tmp/$name.b54v.log"
            grep -F 'JANUS_B5_4_CORRECTED_DISCOVERY_C047_REBOUND_INDEPENDENT_VERIFIER = PASS' "/tmp/$name.b54v.log"
          done
          python "$PRODUCER" --spec "$SPEC" --input /tmp/sat.json --b5-1-artifact /tmp/sat.b51.json --carrier /tmp/sat.carrier.json --b5-2b-artifact /tmp/sat.b52b.json --trellis-work-cap 0 --output /tmp/hist-open.b54.json > /tmp/hist-open.b54.log
          python "$VERIFIER" --spec "$SPEC" --carrier-spec "$B52A_SPEC" --b5-2b-spec "$B52B_SPEC" --b5-2b-admission "$B52B_RECEIPT" --b5-3-admission "$B53_RECEIPT" --input /tmp/sat.json --b5-1-artifact /tmp/sat.b51.json --carrier /tmp/sat.carrier.json --b5-2b-artifact /tmp/sat.b52b.json --candidate /tmp/hist-open.b54.json --trellis-work-cap 0 > /tmp/hist-open.b54v.log
          python "$PRODUCER" --spec "$SPEC" --input /tmp/b5-open.json --b5-1-artifact /tmp/b5-open.b51.json --output /tmp/b5-open.b54.json > /tmp/b5-open.b54.log
          python "$VERIFIER" --spec "$SPEC" --carrier-spec "$B52A_SPEC" --b5-2b-spec "$B52B_SPEC" --b5-2b-admission "$B52B_RECEIPT" --b5-3-admission "$B53_RECEIPT" --input /tmp/b5-open.json --b5-1-artifact /tmp/b5-open.b51.json --candidate /tmp/b5-open.b54.json > /tmp/b5-open.b54v.log
          cmp /tmp/sat.b54.json /tmp/sat-reordered.b54.json
          python - <<'PY'
          import json
          P=lambda n:json.load(open('/tmp/'+n+'.b54.json'))['proof_payload']
          sat,unsat,opq,inc,empty,opened,basis,hopen=[P(n) for n in ('sat','unsat','opaque','inconsistent','empty','b5-open','basis-order','hist-open')]
          assert sat['c047_result']=='SAT' and sat['historical_phase_a_verifier_pass'] is True
          assert unsat['c047_result']=='UNSAT' and unsat['historical_phase_a_verifier_pass'] is True
          assert str(hopen['c047_result']).startswith('OPEN_') and hopen['rebound_status']=='PHASE_A_C047_REPLAY_OPEN'
          assert opq['rebound_status']=='OPEN_AFFINE_REBOUND_BINDING' and opq['c047_result']=='NOT_ESTABLISHED'
          assert inc['rebound_status']=='OPEN_NONBIJECTIVE_AFFINE_NORMALIZATION' and inc['c047_result']=='NOT_ESTABLISHED'
          assert empty['rebound_status']=='NOT_APPLICABLE_NO_FOUND_LAYOUT' and empty['c047_result']=='NOT_ESTABLISHED_DEFER_TO_B5_3'
          assert opened['rebound_status']=='NOT_APPLICABLE_OPEN_RUNTIME' and opened['c047_result']=='NOT_ESTABLISHED'
          assert len(unsat['phase_a_factor_bijection'])==2 and unsat['phase_a_factor_bijection'][0]['phase_a_input_position']!=unsat['phase_a_factor_bijection'][1]['phase_a_input_position']
          rec=basis['phase_a_factor_bijection'][0]
          assert rec['semantic_normal_space_equal'] is True and rec['raw_list_byte_equal'] is False
          assert sat['authority_policy']['b5_3_no_layout_used_as_c047_unsat_premise'] is False
          print('B5_4_C047_SAT_CONTROL = PASS')
          print('B5_4_C047_UNSAT_CONTROL = PASS')
          print('B5_4_HISTORICAL_OPEN_PROPAGATION = PASS')
          print('B5_4_OPAQUE_OFFSET_OPEN = PASS')
          print('B5_4_INCONSISTENT_AFFINE_OPEN = PASS')
          print('B5_4_EMPTY_ROOT_NOT_APPLICABLE = PASS')
          print('B5_4_B5_OPEN_NOT_APPLICABLE = PASS')
          print('B5_4_DUPLICATE_GEOMETRY_DISTINCT_POSITIONS = PASS')
          print('B5_4_SEMANTIC_NOT_BYTE_NORMAL_SPACE_EQUALITY = PASS')
          print('B5_4_PRESENTATION_ORDER_BYTE_IDENTITY = PASS')
          PY

      - name: Reject 24 repaired-digest rebound and terminal attacks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import janus_c049_1_b5_4_corrected_discovery_c047_rebound_verifier as v
          def L(path): return json.load(open(path))
          def subject(name, rawname=None, caps=None):
              r=rawname or name
              out={'raw':L('/tmp/'+r+'.json'),'b51':L('/tmp/'+r+'.b51.json'),'candidate':L('/tmp/'+name+'.b54.json'),'caps':caps or {'discovery_cap':None,'work_cap':None,'certificate_cap':None,'trellis_work_cap':None,'trellis_certificate_cap':None}}
              if r!='b5-open': out.update({'carrier':L('/tmp/'+r+'.carrier.json'),'b52':L('/tmp/'+r+'.b52b.json')})
              return out
          subjects={
            'sat':subject('sat'),
            'unsat':subject('unsat'),
            'hist_open':subject('hist-open','sat',{'discovery_cap':None,'work_cap':None,'certificate_cap':None,'trellis_work_cap':0,'trellis_certificate_cap':None}),
            'opaque':subject('opaque'),
            'inconsistent':subject('inconsistent'),
            'empty':subject('empty'),
            'b5_open':subject('b5-open'),
            'basis_order':subject('basis-order'),
          }
          rejected,total=v.tamper_suite(subjects,L('experiments/direct/C049_1_B5_4_CORRECTED_DISCOVERY_C047_REBOUND_SPEC_V1.json'),L('experiments/direct/C049_1_B5_2A_GENERIC_ALGORITHM2_PROVENANCE_CARRIER_AMENDMENT_V1_1.json'),L('experiments/direct/C049_1_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_RECONSTRUCTION_SPEC_V1.json'),L('experiments/direct/audits/C049_1_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_RECONSTRUCTION_ADMISSION_F057B7AF.json'),L('experiments/direct/audits/C049_1_B5_3_GENERIC_EMPTY_ROOT_TERMINAL_COMPOSITION_ADMISSION_E9841522.json'),{'discovery_cap':None,'work_cap':None,'certificate_cap':None,'trellis_work_cap':None,'trellis_certificate_cap':None})
          print(f'DIGEST_REPAIRED_TAMPERS_REJECTED = {rejected}/{total}')
          assert (rejected,total)==(24,24)
          PY

      - name: Freeze exact-head B5.4 candidate receipt
        run: |
          set -euo pipefail
          mkdir -p /tmp/b5-4-evidence
          cp /tmp/sat.b54.json /tmp/unsat.b54.json /tmp/hist-open.b54.json /tmp/opaque.b54.json /tmp/inconsistent.b54.json /tmp/empty.b54.json /tmp/b5-open.b54.json /tmp/basis-order.b54.json /tmp/b5-4-evidence/
          cp /tmp/sat.b54v.log /tmp/unsat.b54v.log /tmp/hist-open.b54v.log /tmp/opaque.b54v.log /tmp/inconsistent.b54v.log /tmp/empty.b54v.log /tmp/b5-open.b54v.log /tmp/basis-order.b54v.log /tmp/b5-4-evidence/
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def A(n): return json.load(open('/tmp/'+n+'.b54.json'))
          sat,unsat,hopen,opaque,inc,empty,opened,basis=[A(n) for n in ('sat','unsat','hist-open','opaque','inconsistent','empty','b5-open','basis-order')]
          receipt={'schema':'janus.c049_1.b5_4.corrected_discovery_c047_rebound_exact_head_candidate_receipt.v1','proof_head':os.environ['PROOF_HEAD'],'bindings':{'spec_git_blob':subprocess.check_output(['git','hash-object',os.environ['SPEC']],text=True).strip(),'producer_git_blob':subprocess.check_output(['git','hash-object',os.environ['PRODUCER']],text=True).strip(),'verifier_git_blob':subprocess.check_output(['git','hash-object',os.environ['VERIFIER']],text=True).strip(),'b5_2b_admission_receipt_git_blob':'5e60eff4a4bd4c87cbf527cd446fc6b23b013774','b5_3_admission_receipt_git_blob':'32177caa648290b65c8ec9c10fa4c357652515e6','historical_phase_a_core_git_blob':'5eb806a079343f00622886c448d2bfbfa412cbfe','historical_phase_a_solver_git_blob':'70c06752890e797bdf3a7c87c2cb41703fade163','historical_phase_a_verifier_git_blob':'6ae98df69ff53b6157c171cea619865af533c07c','historical_c047_core_git_blob':'c2905332a83b175eea8bd0a326e1a63555b2130a'},'controls':{'sat':{'sha256':sha('/tmp/sat.b54.json'),'semantic_digest':sat['semantic_digest'],'c047_result':'SAT'},'unsat':{'sha256':sha('/tmp/unsat.b54.json'),'semantic_digest':unsat['semantic_digest'],'c047_result':'UNSAT'},'historical_open':{'sha256':sha('/tmp/hist-open.b54.json'),'semantic_digest':hopen['semantic_digest'],'c047_result':hopen['proof_payload']['c047_result']},'opaque':{'sha256':sha('/tmp/opaque.b54.json'),'semantic_digest':opaque['semantic_digest'],'status':'OPEN_AFFINE_REBOUND_BINDING'},'inconsistent':{'sha256':sha('/tmp/inconsistent.b54.json'),'semantic_digest':inc['semantic_digest'],'status':'OPEN_NONBIJECTIVE_AFFINE_NORMALIZATION'},'empty':{'sha256':sha('/tmp/empty.b54.json'),'semantic_digest':empty['semantic_digest'],'status':'NOT_APPLICABLE_NO_FOUND_LAYOUT'},'b5_open':{'sha256':sha('/tmp/b5-open.b54.json'),'semantic_digest':opened['semantic_digest'],'status':'NOT_APPLICABLE_OPEN_RUNTIME'},'basis_order':{'sha256':sha('/tmp/basis-order.b54.json'),'semantic_digest':basis['semantic_digest'],'semantic_equal':True,'