name: R5 All 1296 Twisted K33 Native SCL27 Exact Proof Classes
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_twisted_k33_1296_exact_gf3_degree_frontier.py'
      - '.github/workflows/r5-k33-1296-twisted-native-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-k33:
    name: All S3 chord-holonomy K33 SCL27 exact source SAT UNSAT and F3 V2/3 proof gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust every K33 source normal form with independent proof replay
        run: python -u experiments/r5_universal_twisted_k33_1296_exact_gf3_degree_frontier.py
