name: TRUMP E8 Graphic Syndrome Critical Problem

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_SYNDROME_CRITICAL_PROBLEM_HASH_BARRIER_2026-09-30_v5.6.json'
      - 'research/tools/e8_graphic_syndrome_critical_problem/checker.py'
      - '.github/workflows/trump-e8-graphic-syndrome-critical-problem.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact syndrome Critical-Problem regression
        run: python research/tools/e8_graphic_syndrome_critical_problem/checker.py
