name: R5 Odd Automorphism Fixed Row Proof
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_odd_symmetry_short_orbit_proof_audit.py'
      - 'experiments/r5_universal_certified_odd_symmetry_adapter.py'
      - 'experiments/r5_universal_odd_automorphism_pc3_snark_probe.py'
      - '.github/workflows/r5-odd-symmetry-fixed-row-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-orbit:
    name: 'PC3 odd automorphism with fixed source clauses and independent no-loss proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed-row K4 SAT and Fano K4 UNSAT independent controls
        run: python -u experiments/r5_universal_odd_symmetry_short_orbit_proof_audit.py
