name: JANUS ESSENCE Gene Bank v0.2 (read-only pilot)

on:
  pull_request:
    paths:
      - '.janus/essence/gene_bank.py'
      - '.janus/essence/legal_sources.json'
      - 'tests/test_essence_gene_bank.py'
      - '.github/workflows/janus-essence-gene-bank-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-gene-proposal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify static Python and archive policy tests
        run: |
          python -m py_compile .janus/essence/gene_bank.py
          python -m unittest discover -s tests -p 'test_essence_gene_bank.py' -v
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          path: external/registry
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          path: external/demiurge
          persist-credentials: false
          fetch-depth: 1
      - name: Build read-only candidate map without loading donor code
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_SHA="$(git -C external/registry rev-parse HEAD)"
          DEMIURGE_SHA="$(git -C external/demiurge rev-parse HEAD)"
          python .janus/essence/gene_bank.py \
            --manifest .janus/essence/manifest.json \
            --catalog .janus/essence/legal_sources.json \
            --registry-root external/registry \
            --archive-root external/demiurge \
            --registry-sha "$REGISTRY_SHA" \
            --archive-sha "$DEMIURGE_SHA" \
            --expected-repo "${{ github.repository }}" \
            --out artifacts/essence/gene-bank.json
          python .janus/essence/gene_bank.py --verify artifacts/essence/gene-bank.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/essence/gene-bank.json'))
          print('ESSENCE',r['gate'], 'genes',r['historical_gene_count'], 'candidates',len(r['proposals']))
          assert r['gate'] == 'RESEARCH_READY_PROPOSAL_ONLY'
          assert r['production_promotion'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-gene-bank-v02-evidence
          path: artifacts/essence/gene-bank.json
          if-no-files-found: warn
          retention-days: 14
