name: R5 ExactOne Universal Kempe Colouring Count Cone Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_exactone_kempe_orbit_count_cone.py'
      - '.github/workflows/r5-exactone-kempe-orbit-count-cone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-orbit-cone:
    name: Audit every admissible Kempe path hypercube and joint colouring multiplicity consistency
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed numerical LP library for exploratory primal search
        run: python -m pip install numpy scipy
      - name: Exact orbit closure and rational source count certificate verification
        run: python -u experiments/r5_universal_exactone_kempe_orbit_count_cone.py
