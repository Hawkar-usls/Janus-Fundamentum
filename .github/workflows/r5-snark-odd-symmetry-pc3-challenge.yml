name: R5 Snark Odd-Symmetry PC3 Global Challenge
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_odd_automorphism_pc3_snark_probe.py'
      - '.github/workflows/r5-snark-odd-symmetry-pc3-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snark-odd-pc3:
    name: J5 and SAT prism exact GF2 PC3 proof-or-obstruction
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verified PC3 group averaging on J5 snark
        run: python -u experiments/r5_universal_odd_automorphism_pc3_snark_probe.py
