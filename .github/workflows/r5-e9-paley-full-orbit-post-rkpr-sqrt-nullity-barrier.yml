name: R5 E9 Paley Full-Orbit Post-RKPR Sqrt-Nullity Barrier

on:
  push:
    paths:
      - 'research/R5_E9_PALEY_FULL_ORBIT_POST_RKPR_SQRT_NULLITY_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_full_orbit_post_rkpr_sqrt_nullity_barrier.py'
      - '.github/workflows/r5-e9-paley-full-orbit-post-rkpr-sqrt-nullity-barrier.yml'
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_FULL_ORBIT_POST_RKPR_SQRT_NULLITY_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_full_orbit_post_rkpr_sqrt_nullity_barrier.py'
      - '.github/workflows/r5-e9-paley-full-orbit-post-rkpr-sqrt-nullity-barrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paley-full-orbit-barrier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run finite exact controls
        run: python experiments/r5_e9_paley_full_orbit_post_rkpr_sqrt_nullity_barrier.py
