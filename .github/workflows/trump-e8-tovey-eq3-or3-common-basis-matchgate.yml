name: TRUMP E8 Tovey EQ3 OR3 common-basis matchgate barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TOVEY_EQ3_OR3_COMMON_BASIS_MATCHGATE_BARRIER_2026-09-30_v2.5.json'
      - 'research/tools/e8_tovey_eq3_or3_common_basis_matchgate/checker.py'
      - '.github/workflows/trump-e8-tovey-eq3-or3-common-basis-matchgate.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact EQ3 OR3 common-basis regression
        run: python research/tools/e8_tovey_eq3_or3_common_basis_matchgate/checker.py
