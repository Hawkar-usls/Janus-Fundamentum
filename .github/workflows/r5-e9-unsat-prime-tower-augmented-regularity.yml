name: R5 E9 UNSAT prime tower augmented regularity

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_UNSAT_PRIME_TOWER_AUGMENTED_REGULARITY_COLLAPSE_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_unsat_prime_tower_augmented_regularity.py'
      - '.github/workflows/r5-e9-unsat-prime-tower-augmented-regularity.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_unsat_prime_tower_augmented_regularity.py
      - name: Replay finite tower controls
        run: python experiments/r5_e9_unsat_prime_tower_augmented_regularity.py
