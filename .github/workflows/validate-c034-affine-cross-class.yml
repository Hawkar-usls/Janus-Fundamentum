name: Validate C034 Affine Cross-Class Composition

on:
  push:
    paths:
      - "experiments/direct/janus_c034_affine_portfolio_composition.py"
      - "docs/C034_AFFINE_AND_CROSS_CLASS_COMPOSITION.md"
      - "proposals/C034-JANUS-AFFINE-CROSS-CLASS-COMPOSITION.json"
      - "proposals/C034-SOURCE-MAP.json"
      - ".github/workflows/validate-c034-affine-cross-class.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c034_affine_portfolio_composition.py"
      - "docs/C034_AFFINE_AND_CROSS_CLASS_COMPOSITION.md"
      - "proposals/C034-JANUS-AFFINE-CROSS-CLASS-COMPOSITION.json"
      - "proposals/C034-SOURCE-MAP.json"
      - ".github/workflows/validate-c034-affine-cross-class.yml"

permissions:
  contents: read

jobs:
  affine-cross-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c034_affine_portfolio_composition.py --self-test
