name: TRUMP E8 EQ3 OR3 Common-Basis Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_EQ3_OR3_COMMON_BASIS_MATCHGATE_BARRIER_2026-09-30_v2.7.json'
      - 'research/tools/e8_eq3_or3_common_basis_barrier/checker.py'
      - '.github/workflows/trump-e8-eq3-or3-common-basis-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact EQ3 OR3 common-basis barrier checker
        run: python research/tools/e8_eq3_or3_common_basis_barrier/checker.py
