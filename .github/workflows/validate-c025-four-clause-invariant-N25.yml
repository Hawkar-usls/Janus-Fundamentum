name: validate-c025-four-clause-invariant-N25

on:
  push:
    branches:
      - research/c025-balanced-pressure-wedge-2026-08-27
    paths:
      - 'research/C025_FOUR_CLAUSE_INVARIANT_AND_NO_CAP_RESCUE_THROUGH_N25_2026-08-27.json'
      - 'experiments/direct/janus_four_clause_invariant_contract.py'
      - '.github/workflows/validate-c025-four-clause-invariant-N25.yml'
  pull_request:
    paths:
      - 'research/C025_FOUR_CLAUSE_INVARIANT_AND_NO_CAP_RESCUE_THROUGH_N25_2026-08-27.json'
      - 'experiments/direct/janus_four_clause_invariant_contract.py'
      - '.github/workflows/validate-c025-four-clause-invariant-N25.yml'

jobs:
  exact-four-clause-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact four-clause contract
        run: python -m experiments.direct.janus_four_clause_invariant_contract
      - name: Verify theorem scope and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/C025_FOUR_CLAUSE_INVARIANT_AND_NO_CAP_RESCUE_THROUGH_N25_2026-08-27.json').read_text())
          assert d['status']=='PROVED_FOUR_CLAUSE_ORDINARY_INVARIANT__PROVED_NO_RAW_CAP_RESCUE_N_LE_25__UNBOUNDED_TOTALITY_OPEN'
          assert d['lemma_four_clause_invariance']['status']=='PROVED_ELEMENTARY_FROM_FROZEN_TRANSITION_SEMANTICS'
          assert d['lemma_four_clause_raw_cap']['status']=='PROVED'
          assert d['N25_application']['status']=='PROVED_FOR_N25_R0_10'
          assert d['range_theorem']['status']=='PROVED'
          assert d['scientific_boundary']['does_not_prove_unbounded_reachable_totality'] is True
          assert d['scientific_boundary']['does_not_prove_P_equals_NP'] is True
          assert d['P_VS_NP']=='OPEN'
          print('FOUR_CLAUSE_INVARIANT_THEOREM=PASS')
          print('NO_RAW_CAP_RESCUE_REQUIRED_THROUGH_N25=PASS')
          print('P_VS_NP=OPEN')
          PY
