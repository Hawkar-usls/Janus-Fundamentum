name: U-PAIR-1J Tseitin source freeze and check

on:
  push:
    branches:
      - research/U-PAIR-1J-tseitin-expander-search-2026-09-18
    paths:
      - '.github/workflows/u-pair-1j-tseitin-source-freeze.yml'

permissions:
  contents: write

jobs:
  source-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/U-PAIR-1J-tseitin-expander-search-2026-09-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen source-check dependency
        run: python -m pip install 'numpy==2.1.1'
      - name: Generate frozen source family
        run: |
          rm -rf research/generated/u_pair_1j_tseitin_expander_source
          python research/tools/u_pair_1j_tseitin_expander/input_generator.py research/generated/u_pair_1j_tseitin_expander_source
      - name: Commit source freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/u_pair_1j_tseitin_expander_source
          git commit -m "U-PAIR-1J freeze Tseitin expander search source inputs"
          git push origin HEAD:research/U-PAIR-1J-tseitin-expander-search-2026-09-18
          echo "SOURCE_FREEZE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Independent source check after freeze
        run: |
          python research/tools/u_pair_1j_tseitin_expander/independent_source_check.py \
            research/generated/u_pair_1j_tseitin_expander_source \
            research/U_PAIR_1J_TSEITIN_EXPANDER_SEARCH_INDEPENDENT_SOURCE_CHECK_2026-09-18_v1.0.json \
            "$SOURCE_FREEZE_SHA"
      - name: Commit independent source-check result
        run: |
          git add research/U_PAIR_1J_TSEITIN_EXPANDER_SEARCH_INDEPENDENT_SOURCE_CHECK_2026-09-18_v1.0.json
          git commit -m "U-PAIR-1J verify frozen Tseitin expander search sources"
          git push origin HEAD:research/U-PAIR-1J-tseitin-expander-search-2026-09-18
