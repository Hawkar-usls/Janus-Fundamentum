name: validate-mad-lab-m2rs-tranception-meet

on:
  push:
    branches:
      - research/janus-mad-lab-m2rs-tranception-meet-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-self-deception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: N58 negative control and mirror selftest
        run: python -m experiments.mad_lab.m2rs_tranception_meet --selftest

  smoke-meet:
    needs: anti-self-deception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bidirectional M2R-S -> DIRECT smoke 58..61
        run: |
          mkdir -p artifacts
          python -m experiments.mad_lab.m2rs_tranception_meet \
            --min 58 --max 61 --meet-window 1 \
            --out artifacts/m2rs_tranception_meet_58_61.json
      - uses: actions/upload-artifact@v4
        with:
          name: m2rs-tranception-meet-smoke
          path: artifacts/m2rs_tranception_meet_58_61.json

  extended-meet:
    needs: smoke-meet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bidirectional M2R-S -> DIRECT stress 58..73
        run: |
          mkdir -p artifacts
          python -m experiments.mad_lab.m2rs_tranception_meet \
            --min 58 --max 73 --meet-window 2 \
            --out artifacts/m2rs_tranception_meet_58_73.json
      - uses: actions/upload-artifact@v4
        with:
          name: m2rs-tranception-meet-58-73
          path: artifacts/m2rs_tranception_meet_58_73.json
