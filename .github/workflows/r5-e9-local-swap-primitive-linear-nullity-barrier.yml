name: R5 E9 Local-Swap Primitive Linear-Nullity Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_LOCAL_SWAP_PRIMITIVE_LINEAR_NULLITY_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_local_swap_primitive_linear_nullity_barrier.py'
      - '.github/workflows/r5-e9-local-swap-primitive-linear-nullity-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact primitive/nullity regression
        run: python experiments/r5_e9_local_swap_primitive_linear_nullity_barrier.py
