name: R5 E9 Kernel-tope greedy local-minimum barrier

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_KERNEL_TOPE_GREEDY_LOCAL_MINIMUM_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_kernel_tope_greedy_local_minimum_barrier.py'
      - '.github/workflows/r5-e9-kernel-tope-greedy-local-minimum-barrier.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_kernel_tope_greedy_local_minimum_barrier.py
      - name: Replay exact PG15 local-minimum certificates
        run: python experiments/r5_e9_kernel_tope_greedy_local_minimum_barrier.py
