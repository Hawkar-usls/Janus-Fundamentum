name: TRUMP observer-effect blind diagnostic v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/TRUMP_OBSERVER_EFFECT_AND_INFORMATION_LEAKAGE_DIAGNOSTIC_V1_PREREGISTRATION_2026-09-17.json'
      - 'research/TRUMP_OBSERVER_EFFECT_DIAGNOSTIC_V1_CONTEXT_RECOVERY_RECEIPT_2026-09-17.json'
      - 'tools/trump_observer_effect_blind_diagnostic_v1.py'
      - 'tools/trump_observer_effect_stage_c_regression_v1.py'
      - '.github/workflows/trump_observer_effect_blind_diagnostic_v1.yml'

jobs:
  calibration-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic masking/coherence self-test
        run: python tools/trump_observer_effect_blind_diagnostic_v1.py --self-test
      - name: Run observer noninterference against historical sealed Stage C candidate
        run: python tools/trump_observer_effect_stage_c_regression_v1.py --run
      - name: Authority ceiling
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_ONLY__HISTORICAL_SEALED_STAGE_C_REGRESSION'
          echo 'CURRENT_CORPUS_NEW_EVIDENCE=FALSE'
          echo 'NEW_SOLVER=FALSE'
          echo 'NEW_CARRIER=FALSE'
          echo 'UNIVERSALITY_PROVED=FALSE'
          echo 'ARBITRARY_UNSEEN_INVARIANT_DISCOVERY=NOT_PROVED'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
          echo 'P_VS_NP=OPEN'
