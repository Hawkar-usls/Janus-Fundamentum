name: TRUMP observer-effect blind diagnostic v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/TRUMP_OBSERVER_EFFECT_AND_INFORMATION_LEAKAGE_DIAGNOSTIC_V1_PREREGISTRATION_2026-09-17.json'
      - 'tools/trump_observer_effect_blind_diagnostic_v1.py'
      - '.github/workflows/trump_observer_effect_blind_diagnostic_v1.yml'

jobs:
  calibration-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run masking/coherence self-test
        run: python tools/trump_observer_effect_blind_diagnostic_v1.py --self-test
