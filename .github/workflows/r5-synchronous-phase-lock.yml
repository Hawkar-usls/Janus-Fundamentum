name: R5 Synchronous Klein-Four Phase Gates

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-synchronous-phase-lock.yml'
      - 'experiments/r5_exactone_synchronous_phase_lock_rank1_gate.py'
      - 'experiments/r5_exactone_seven_fourpole_synchronous_hub_frontier.py'
      - 'experiments/r5_exactone_seven_fourpole_synchronous_hub_exact_three_witness.py'
      - 'experiments/r5_exactone_sevenblock_simple_twoedge_antiphase_gate.py'
      - 'experiments/r5_exactone_sevenblock_simple_all_59_exact_nogo.py'
      - 'experiments/r5_exactone_sevenblock_parallel_3edge_exact_nogo.py'
      - 'experiments/r5_exactone_sevenblock_loopless_full_multigraph_census.cpp'
      - 'experiments/r5_exactone_sevenblock_loopless_multigraph_independent_degree_dp.py'
      - 'experiments/r5_exactone_sevenblock_multigraph_cut2_no_degree2_exact_nogo.py'
      - 'experiments/r5_sixblock_217_loopless_catalogue_for_antiphase.cpp'
      - 'experiments/r5_exactone_antiphase_mandatory_R87_217_envelope.py'
      - 'experiments/r5_exactone_antiphase_R87_fixed_fourpole_class_csp.py'
      - 'experiments/r5_exactone_bridgeless_n28_twobit_constructive.py'
  workflow_dispatch:

jobs:
  exact-sync-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove the exact rank-one phase law, four-port lower bound, and n28 physical colour identity
        run: python -u experiments/r5_exactone_synchronous_phase_lock_rank1_gate.py
      - name: Exhaustively classify 5670 seven-block high-connectivity skeletons and replay fixed-seed exploratory phase hub search
        run: python -u experiments/r5_exactone_seven_fourpole_synchronous_hub_frontier.py
      - name: Prove sevenblock exact all-size no-go using complete 29-orbit 3-witness search
        run: python -u experiments/r5_exactone_seven_fourpole_synchronous_hub_exact_three_witness.py
      - name: Install seven-vertex atlas dependency
        run: python -m pip install networkx==3.4.2
      - name: Audit all 59 sevenblock simple skeletons and exact 11-class two-edge antiphase transfer
        run: python -u experiments/r5_exactone_sevenblock_simple_twoedge_antiphase_gate.py
      - name: Certify complete no-go for ALL 59 simple sevenblock eleven-join skeletons with 480 exact two-edge phase checks
        run: python -u experiments/r5_exactone_sevenblock_simple_all_59_exact_nogo.py
      - name: Certify sevenblock loopless 3-edge-connected multigraph no-go including all three new parallel cases
        run: python -u experiments/r5_exactone_sevenblock_parallel_3edge_exact_nogo.py
      - name: Exhaustively enumerate 5.23M labelled loopless 7fourpole 11join multigraphs and port cut types
        run: |
          g++ -std=c++17 -O2 experiments/r5_exactone_sevenblock_loopless_full_multigraph_census.cpp -o /tmp/r5_sevenmulti
          /tmp/r5_sevenmulti
      - name: Independently certify sevenblock multigraph count by memoized degree multiplicity DP
        run: python -u experiments/r5_exactone_sevenblock_loopless_multigraph_independent_degree_dp.py
      - name: Exclude all 19 two-edge-connected sevenblock parallel skeletons with no degree-two constituent
        run: python -u experiments/r5_exactone_sevenblock_multigraph_cut2_no_degree2_exact_nogo.py
      - name: Build complete independent sixblock loopless 217 skeleton atlas
        run: |
          g++ -std=c++17 -O2 experiments/r5_sixblock_217_loopless_catalogue_for_antiphase.cpp -o /tmp/r5_sixblock_217_catalogue
          /tmp/r5_sixblock_217_catalogue > /tmp/r5_sixblock_217.txt
      - name: Prove exact anti-phase mandatory 87 state right trace and screen all 78120 interface placements
        run: python -u experiments/r5_exactone_antiphase_mandatory_R87_217_envelope.py /tmp/r5_sixblock_217.txt
      - name: Verify nontrivial exact sixblock 11-class antiphase UNSAT fixtures with SAT positive regression
        run: python -u experiments/r5_exactone_antiphase_R87_fixed_fourpole_class_csp.py /tmp/r5_sixblock_217.txt
