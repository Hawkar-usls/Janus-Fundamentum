name: Validate C025 Policy-0B.1 Total Machine

on:
  push:
    paths:
      - "experiments/direct/janus_tear_policy0b1_total_machine.py"
      - "proof_attempts/C025/C025_POLICY0B1_TOTAL_MACHINE_FREEZE.md"
      - ".github/workflows/validate-c025-policy0b1-total-machine.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_policy0b1_total_machine.py"
      - "proof_attempts/C025/C025_POLICY0B1_TOTAL_MACHINE_FREEZE.md"
      - ".github/workflows/validate-c025-policy0b1-total-machine.yml"

permissions:
  contents: read

jobs:
  verify-policy0b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Policy-0B.1 provider replay
        run: python -m py_compile experiments/direct/janus_tear_policy0b1_total_machine.py
      - name: Replay frozen deterministic machine
        run: python experiments/direct/janus_tear_policy0b1_total_machine.py
