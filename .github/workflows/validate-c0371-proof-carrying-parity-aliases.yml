name: Validate C037.1 Proof-Carrying Parity Aliases

on:
  push:
    paths:
      - "experiments/direct/janus_c037_1_proof_carrying_parity_aliases.py"
      - "docs/C037_1_PROOF_CARRYING_PARITY_ALIASES.md"
      - "proposals/C037_1-PROOF-CARRYING-PARITY-ALIASES.json"
      - "registry/c0371-source-map.json"
      - "schemas/c0371-cross-language-negotiation-v1.1.schema.json"
      - "schemas/c0371-negotiation-cache.sql"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c0371-proof-carrying-parity-aliases.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c037_1_proof_carrying_parity_aliases.py"
      - "docs/C037_1_PROOF_CARRYING_PARITY_ALIASES.md"
      - "proposals/C037_1-PROOF-CARRYING-PARITY-ALIASES.json"
      - "registry/c0371-source-map.json"
      - "schemas/c0371-cross-language-negotiation-v1.1.schema.json"
      - "schemas/c0371-negotiation-cache.sql"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c0371-proof-carrying-parity-aliases.yml"

permissions:
  contents: read

jobs:
  parity-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile experiments/direct/janus_c037_1_proof_carrying_parity_aliases.py
      - run: python experiments/direct/janus_c037_1_proof_carrying_parity_aliases.py --self-test
      - run: python -m json.tool proposals/C037_1-PROOF-CARRYING-PARITY-ALIASES.json >/dev/null
      - run: python -m json.tool registry/c0371-source-map.json >/dev/null
      - run: python -m json.tool schemas/c0371-cross-language-negotiation-v1.1.schema.json >/dev/null
      - run: sqlite3 :memory: < schemas/c0371-negotiation-cache.sql
