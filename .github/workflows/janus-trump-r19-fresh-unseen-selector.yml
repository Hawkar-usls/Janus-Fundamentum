name: JANUS TRUMP R19 Fresh Unseen Selector
on:
  push:
    branches: [research/janus-trump-r19-fresh-prospective-unseen-shannon-dag-holdout-2026-09-02]
    paths:
      - 'research/JANUS_TRUMP_R19_FRESH_UNSEEN_WORLD_SELECTOR_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r19_truth_blind_world_selector.py'
      - '.github/workflows/janus-trump-r19-fresh-unseen-selector.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify selector freeze and R18 candidate identity
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.load(open('research/JANUS_TRUMP_R19_FRESH_UNSEEN_WORLD_SELECTOR_PREREGISTRATION_2026-09-02.json'))
          assert p['status']=='FROZEN_BEFORE_R19_WORLD_SELECTION'
          got=subprocess.check_output(['git','hash-object',p['frozen_candidate']['path']],text=True).strip()
          assert got==p['frozen_candidate']['blob_sha']=='afa95321ec6edbb33bef222d8ee7234fe631a599'
          assert p['truth_firewall']=='WORLD_SELECTION_BEFORE_TRUTH__WORLD_SELECTION_BEFORE_CANDIDATE__NO_CHERRY_PICKING_BY_OUTCOME'
          assert p['P_VS_NP']=='OPEN'
          print('R19_SELECTOR_FREEZE_OK',got)
          PY
      - name: Compile selector
        run: PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r19_truth_blind_world_selector.py
      - name: Select ten fresh worlds
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r19_truth_blind_world_selector.py --output artifacts/JANUS_TRUMP_R19_FRESH_UNSEEN_WORLD_SELECTION_RESULT_2026-09-02.json
      - name: Selector integrity gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R19_FRESH_UNSEEN_WORLD_SELECTION_RESULT_2026-09-02.json'))
          assert d['status']=='SELECTOR_PASS',d
          assert d['selected_world_count']==10
          assert d['selector_firewall']['pass'] and d['freshness_pass']
          assert d['truth_accessed'] is False and d['candidate_accessed'] is False
          assert len({w['frame_sha256'] for w in d['selected_worlds']})==10
          assert all(w['frame_type']=='GENERAL_CNF' for w in d['selected_worlds'])
          assert all(6<=w['bridge_variable_count']<=16 for w in d['selected_worlds'])
          assert d['P_VS_NP']=='OPEN'
          print('R19_SELECTOR_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r19-fresh-unseen-world-selection
          path: artifacts/JANUS_TRUMP_R19_FRESH_UNSEEN_WORLD_SELECTION_RESULT_2026-09-02.json
          if-no-files-found: error
