name: R5 E9 Integer Lattice Pair Projection 2SAT Terminal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/R5_E9_INTEGER_LATTICE_PAIR_PROJECTION_2SAT_TERMINAL_2026-09-29_v1.0.md"
      - "experiments/r5_e9_integer_lattice_pair_projection_2sat_terminal.py"
      - ".github/workflows/r5-e9-integer-lattice-pair-projection-2sat-terminal.yml"

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify integer-lattice pair projection terminal
        run: python experiments/r5_e9_integer_lattice_pair_projection_2sat_terminal.py
