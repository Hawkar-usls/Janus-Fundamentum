name: JANUS TIME-SAT-004D2 fair original GF2 vs CryptoMiniSat + CDCL
on:
  push:
    branches:
      - research/time-sat-004d2-cms-fair-20261101
    paths:
      - 'experiments/direct/janus_time_sat_004d2_compare.py'
      - 'tests/test_time_sat_004d2.py'
      - '.github/workflows/validate-time-sat-004d2.yml'
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d2-original-lightsout
  cancel-in-progress: true
jobs:
  original-CNF-six-algorithm-comparison:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original CDCL and independent native-XOR CryptoMiniSat libraries
        run: >-
          python -m pip install --only-binary=:all: --disable-pip-version-check
          'python-sat==1.9.dev17' 'pycryptosat==5.15.0'
      - name: Print actual installed solver versions
        run: |
          python -m pip show python-sat pycryptosat
      - name: Offline independent original-CNF model, source tampering and XOR tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d2.py' -v
      - name: Preserve original C023 standalone certificate verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Isolated same-source five-arm repeated benchmark
        run: >-
          python experiments/direct/janus_time_sat_004d2_compare.py
          --source experiments/time_sat_004_external/lightsout_01d6fa8_verified/original.cnf
          --out evidence/time_sat_004d2
      - name: Preserve all timings, censored verdicts, memory and original source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d2-${{ matrix.runner }}
          path: evidence/time_sat_004d2/benchmark.json
          if-no-files-found: warn
          retention-days: 30
