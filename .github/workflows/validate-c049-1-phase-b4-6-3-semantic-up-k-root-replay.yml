name: Validate C049.1 Phase B4.6.3 semantic up_k root replay

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_independent_semantic_up_k_root_replay.py'
      - 'docs/C049_1_PHASE_B4_6_3_INDEPENDENT_SEMANTIC_UP_K_ROOT_REPLAY.md'
      - 'registry/c049.1-phase-b4.6.3-semantic-up-k-status.json'
      - '.github/workflows/validate-c049-1-phase-b4-6-3-semantic-up-k-root-replay.yml'
      - 'experiments/direct/janus_c049_1_b4_6_2_full_iterative_cycle.py'
      - 'experiments/direct/janus_c049_1_b4_5_bottom_up_scaffold_executor.py'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_independent_semantic_up_k_root_replay.py'
      - 'docs/C049_1_PHASE_B4_6_3_INDEPENDENT_SEMANTIC_UP_K_ROOT_REPLAY.md'
      - 'registry/c049.1-phase-b4.6.3-semantic-up-k-status.json'
      - '.github/workflows/validate-c049-1-phase-b4-6-3-semantic-up-k-root-replay.yml'
      - 'experiments/direct/janus_c049_1_b4_6_2_full_iterative_cycle.py'
      - 'experiments/direct/janus_c049_1_b4_5_bottom_up_scaffold_executor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-semantic-up-k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent semantic verifier
        run: |
          python -m py_compile experiments/direct/janus_c049_1_b4_6_3_independent_semantic_up_k_root_replay.py
      - name: Regenerate complete positive iterative cycle
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-b4-6-3-semantic
          python experiments/direct/janus_c049_1_b4_6_2_full_iterative_cycle.py \
            --output-dir /tmp/c049-b4-6-3-semantic
      - name: Independently replay generator semantics and exact up_k closures
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_independent_semantic_up_k_root_replay.py \
            /tmp/c049-b4-6-3-semantic \
            --output /tmp/c049-b4-6-3-semantic-receipt.json
      - name: Enforce semantic result and strict boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c049-b4-6-3-semantic-receipt.json'))
          assert x['all_rounds_semantically_replayed'] is True
          assert len(x['rounds']) == 2
          assert all(r['semantic_up_k_replay_complete'] for r in x['rounds'])
          assert x['strict_boundary']['inventory_completeness'] is True
          assert x['strict_boundary']['semantic_up_k_replay_complete'] is True
          assert x['strict_boundary']['terminal_completeness_proved'] is False
          assert x['strict_boundary']['found_layout_enabled'] is False
          assert x['strict_boundary']['no_layout_at_cap_enabled'] is False
          assert x['strict_boundary']['current_global_terminal'] == 'OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert x['strict_boundary']['p_vs_np'] == 'OPEN'
          PY
      - name: Export semantic replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-semantic-up-k-root-replay
          path: /tmp/c049-b4-6-3-semantic-receipt.json
          retention-days: 1
