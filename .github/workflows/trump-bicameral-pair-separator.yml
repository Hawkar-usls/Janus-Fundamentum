name: TRUMP Bicameral Pair Separator Explanation

on:
  push:
    branches:
      - research/trump-bicameral-pair-separator-2026-09-15
    paths:
      - 'research/TRUMP_BICAMERAL_PAIR_SEPARATOR_EXPLANATION_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bicameral_pair_separator/**'
      - '.github/workflows/trump-bicameral-pair-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicameral-pair-separator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pair-separator independent checker
        shell: bash
        run: |
          set -euo pipefail
          python -m research.tools.apma_bicameral_pair_separator.independent_checker | tee /tmp/pair-separator.json

      - name: Assert frozen scoped verdict and firewalls
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/pair-separator.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_TWO_VARIABLE_SEPARATOR_EXPLANATION_INDUCTION', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO', sf
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED', sf
          assert sf['GROWING_SEPARATOR_DISCOVERY']=='NOT_PROVED', sf
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Parent single-variable bicameral regression
        run: python -m research.tools.apma_bicameral_explanation.independent_checker

      - name: Parent raw compositional regression
        run: python -m research.tools.apma_unseen_basis.compositional_independent_checker

      - name: Parent raw relation basis regression
        run: python -m research.tools.apma_unseen_basis.independent_checker

      - name: Inverted Pyramid regression
        run: python -m research.tools.apma_inverted_pyramid.independent_checker

      - name: Authority notice
        run: |
          echo 'SCOPED_BICAMERAL_PAIR_SEPARATOR_EXPLANATION_ONLY'
          echo 'SEPARATOR_SIZE=2_FIXED'
          echo 'GROWING_SEPARATOR_DISCOVERY=NOT_PROVED'
          echo 'CONNECTED_MIXED_CORE_SOLVED=NO'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
