name: TRUMP E8 Terminal Rank3 Implication Primitive Normal Form

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TERMINAL_RANK3_IMPLICATION_PRIMITIVE_NORMAL_FORM_2026-09-30_v3.8.json'
      - 'research/tools/e8_terminal_rank3_implication_primitive_normal_form/checker.py'
      - '.github/workflows/trump-e8-terminal-rank3-implication-primitive-normal-form.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact implication-primitive normal-form regression
        run: python research/tools/e8_terminal_rank3_implication_primitive_normal_form/checker.py
