name: R5 E9 Paley19 exact minimum AF3 cover rank6

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PALEY19_EXACT_MINIMUM_COVER_RANK6_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_affine_f3_paley19_exact_minimum_cover_rank6.cpp'
      - '.github/workflows/r5-e9-affine-f3-paley19-exact-minimum-cover-rank6.yml'
  workflow_dispatch:

jobs:
  exact-rank6-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact checker
        run: g++ -O3 -std=c++17 experiments/r5_e9_affine_f3_paley19_exact_minimum_cover_rank6.cpp -o /tmp/paley19_rank6
      - name: Run exact checker
        run: /tmp/paley19_rank6
