name: R5 E9 Rational-Tope Defect Syndrome Projective Filter

on:
  push:
    paths:
      - 'research/R5_E9_RATIONAL_TOPE_DEFECT_SYNDROME_PROJECTIVE_FILTER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rational_tope_defect_syndrome_projective_filter.py'
      - '.github/workflows/r5-e9-rational-tope-defect-syndrome-projective-filter.yml'
  pull_request:
    paths:
      - 'research/R5_E9_RATIONAL_TOPE_DEFECT_SYNDROME_PROJECTIVE_FILTER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rational_tope_defect_syndrome_projective_filter.py'
      - '.github/workflows/r5-e9-rational-tope-defect-syndrome-projective-filter.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact projective-parity filter regression
        run: python experiments/r5_e9_rational_tope_defect_syndrome_projective_filter.py
