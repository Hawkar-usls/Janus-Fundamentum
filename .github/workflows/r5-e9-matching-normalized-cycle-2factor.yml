name: R5 E9 Matching-Normalized Cycle 2-Factor

on:
  push:
    paths:
      - "experiments/r5_e9_matching_normalized_cycle_2factor.py"
      - "research/R5_E9_MATCHING_NORMALIZED_CYCLE_2FACTOR_EXACTONE_2026-09-27_v1.0.md"
      - ".github/workflows/r5-e9-matching-normalized-cycle-2factor.yml"
  pull_request:
    paths:
      - "experiments/r5_e9_matching_normalized_cycle_2factor.py"
      - "research/R5_E9_MATCHING_NORMALIZED_CYCLE_2FACTOR_EXACTONE_2026-09-27_v1.0.md"
      - ".github/workflows/r5-e9-matching-normalized-cycle-2factor.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_matching_normalized_cycle_2factor.py
      - name: Replay exact controls
        run: python experiments/r5_e9_matching_normalized_cycle_2factor.py
