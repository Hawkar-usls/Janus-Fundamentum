name: Validate C049.1 B5 fixed-discovery round binding v1.1

on:
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1_1.json'
      - 'experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_v11.py'
      - 'experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier_v11.py'
      - '.github/workflows/validate-c049-1-b5-fixed-discovery-round-binding-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-discovery-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: experiments/direct
      PYTHONUNBUFFERED: '1'
      PREPROCESSING_V11_HEAD: 6d8ce48c32d635c77f11edf5662982819fc4a869
      PRE_V11: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_v11.py
      PRE_VERIFIER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py
      PRE_SPEC: experiments/direct/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_SPEC_V1.json
      SPEC: experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1_1.json
      PRODUCER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_v11.py
      VERIFIER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier_v11.py
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bind v1.1 preprocessing authority and new implementation bytes
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"; echo "EXACT_HEAD=$HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$PREPROCESSING_V11_HEAD" "$HEAD"
          test "$(git hash-object "$PRE_V11")" = 89cbbae86aec581bfbe992485da914872a18b50b
          test "$(git hash-object "$PRE_VERIFIER")" = 762ace290285fbda9ee219984daaf04866ffc222
          test "$(git hash-object "$SPEC")" = 39c923ab0d7f48d3afc75e1576e3494ba8b0e61a
          test "$(git hash-object "$PRODUCER")" = 599df73075af3e00510b67f24f536be5337ebd35
          test "$(git hash-object "$VERIFIER")" = fd2336e40fd22dbaa0306ef38371882030ecb19e
          echo 'PREPROCESSING_V1_1_HEAD_ANCESTRY = PASS'
          echo 'PREPROCESSING_V1_1_PRODUCER_IDENTITY = PASS'
          echo 'PREPROCESSING_UNCHANGED_VERIFIER_IDENTITY = PASS'
      - name: Enforce independent round verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast
          from pathlib import Path
          v=Path('experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier_v11.py').read_text()
          imports=[]
          for n in ast.walk(ast.parse(v)):
            if isinstance(n,ast.Import): imports += [a.name for a in n.names]
            elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          assert not any('fixed_discovery_round_orchestration_binding_v11' in x for x in imports),imports
          print('ROUND_PRODUCER_IMPORT_IN_VERIFIER = FORBIDDEN_CONFIRMED')
          PY
      - name: Build canonical full-input preprocessing once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixed-v11
          cat > /tmp/fixed-v11/raw.json <<'JSON'
          {"ambient_dim":4,"k":1,"factors":[{"id":"F2","normal_space":[3,5],"affine_offset":[1,0]},{"id":"F0","normal_space":[1,3],"affine_offset":[0,1]},{"id":"F3","normal_space":[6,10],"affine_offset":[1,1]},{"id":"F1","normal_space":[2,6],"affine_offset":[0,0]}]}
          JSON
          python "$PRE_V11" --spec "$PRE_SPEC" --input /tmp/fixed-v11/raw.json --output /tmp/fixed-v11/pre.json | tee /tmp/fixed-v11/pre-producer.log
          python "$PRE_VERIFIER" --spec "$PRE_SPEC" --input /tmp/fixed-v11/raw.json --candidate /tmp/fixed-v11/pre.json | tee /tmp/fixed-v11/pre-verifier.log
          grep -F 'JANUS_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_INDEPENDENT_VERIFIER = PASS' /tmp/fixed-v11/pre-verifier.log
          echo 'FULL_INPUT_CANONICAL_PREPROCESSING_EXACTLY_ONCE = PASS'
      - name: Build and independently verify fixed-discovery plan
        shell: bash
        run: |
          set -euo pipefail
          python "$PRODUCER" --spec "$SPEC" --preprocessing /tmp/fixed-v11/pre.json --output /tmp/fixed-v11/plan.json | tee /tmp/fixed-v11/producer.log
          python "$VERIFIER" --spec "$SPEC" --preprocessing /tmp/fixed-v11/pre.json --candidate /tmp/fixed-v11/plan.json | tee /tmp/fixed-v11/verifier.log
          grep -F 'JANUS_B5_FIXED_DISCOVERY_ROUND_BINDING_V1_1_INDEPENDENT_VERIFIER = PASS' /tmp/fixed-v11/verifier.log
          grep -F 'PREPROCESSING_AUTHORITY_VERSION = V1_1_CANONICAL_RREF' /tmp/fixed-v11/verifier.log
          grep -F 'FIXED_DISCOVERY_CATALOG = BOUND' /tmp/fixed-v11/verifier.log
          grep -F 'ROUND_EXECUTION = NOT_RUN' /tmp/fixed-v11/verifier.log
      - name: Reject digest-repaired orchestration attacks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,hashlib,json,sys
          sys.path.insert(0,'experiments/direct')
          import janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier_v11 as v
          dg=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          spec=json.load(open('experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1_1.json')); pre=json.load(open('/tmp/fixed-v11/pre.json')); base=json.load(open('/tmp/fixed-v11/plan.json'))
          attacks=[]
          def add(n,m):
            c=copy.deepcopy(base); m(c['proof_payload']); c['semantic_digest']=dg(c['proof_payload']); attacks.append((n,c))
          add('T01_PREPROCESSING_V1_DOWNGRADE',lambda p:p.__setitem__('preprocessing_authority_version','V1'))
          add('T02_CATALOG_REBIND',lambda p:p.__setitem__('fixed_discovery_catalog_semantic_digest','0'*64))
          add('T03_SCHEDULE_OMISSION',lambda p:p['schedule_occurrence_indices'].pop())
          add('T04_SCHEDULE_DUPLICATION',lambda p:p['schedule_occurrence_indices'].__setitem__(1,p['schedule_occurrence_indices'][0]))
          add('T05_SCHEDULE_REORDER',lambda p:p['schedule_occurrence_indices'].__setitem__(slice(0,2),list(reversed(p['schedule_occurrence_indices'][:2]))))
          add('T06_PREFIX_REBIND',lambda p:p['rounds'][2].__setitem__('prefix_occurrence_indices',p['rounds'][1]['prefix_occurrence_indices']))
          add('T07_NEXT_FACTOR_REBIND',lambda p:p['rounds'][1].__setitem__('new_occurrence_index',p['rounds'][0]['new_occurrence_index']))
          add('T08_RECORD_REBIND',lambda p:p['rounds'][1].__setitem__('new_fixed_discovery_record_digest','1'*64))
          add('T09_PREFIX_CHAIN_BREAK',lambda p:p['rounds'][1].__setitem__('previous_prefix_semantic_digest','2'*64))
          add('T10_EXECUTION_PROMOTION',lambda p:p.__setitem__('completed_round_execution_count',1))
          add('T11_B5_PROMOTION',lambda p:p['strict_boundary'].__setitem__('b5_complete',True))
          add('T12_C049_PROMOTION',lambda p:p['strict_boundary'].__setitem__('c049_1_complete',True))
          add('T13_PNP_PROMOTION',lambda p:p['strict_boundary'].__setitem__('p_vs_np','CLOSED'))
          rejected=0
          for n,c in attacks:
            try:v.verify(spec,pre,c)
            except Exception: rejected+=1; print(n,'= REJECTED')
            else:raise SystemExit(n+' survived')
          assert rejected==13
          print('DIGEST_REPAIRED_ORCHESTRATION_TAMPERS_REJECTED = 13/13')
          PY
      - name: Freeze exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          blob=lambda p:subprocess.check_output(['git','hash-object',p],text=True).strip()
          plan=Path('/tmp/fixed-v11/plan.json')
          r={'schema':'janus.c049_1.b5.fixed_discovery_round_binding_exact_head_receipt.v1_1','exact_head':os.environ['EXACT_HEAD'],'preprocessing_v1_1_head':os.environ['PREPROCESSING_V11_HEAD'],'bindings':{'preprocessing_v1_1_producer_git_blob':blob(os.environ['PRE_V11']),'unchanged_preprocessing_verifier_git_blob':blob(os.environ['PRE_VERIFIER']),'spec_git_blob':blob(os.environ['SPEC']),'producer_git_blob':blob(os.environ['PRODUCER']),'verifier_git_blob':blob(os.environ['VERIFIER'])},'checks':{'canonical_preprocessing_once':'PASS','fixed_discovery_catalog':'BOUND','canonical_schedule':'PASS','prefix_chain':'PASS','next_factor_binding':'PASS','tamper_rejection':'13/13','round_execution':'NOT_RUN'},'plan_sha256':hashlib.sha256(plan.read_bytes()).hexdigest(),'next_gate':'C049.1_B5_FIXED_DISCOVERY_ROUND_EXECUTION_COMPOSITION','original_order_lift_admission':'NOT_ESTABLISHED_REPLACEMENT_REPLAY_INCOMPLETE','all_input_termination':'NOT_ESTABLISHED','polynomial_runtime':'NOT_ESTABLISHED','b5_complete':False,'c049_1_complete':False,'p_vs_np':'OPEN'}
          raw=(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n').encode(); Path('/tmp/fixed-v11/exact-head-receipt.json').write_bytes(raw)
          print('FIXED_DISCOVERY_ROUND_BINDING_V1_1_RECEIPT = FROZEN'); print('RECEIPT_SHA256 =',hashlib.sha256(raw).hexdigest()); print('NEXT_GATE =',r['next_gate']); print('B5_COMPLETE = FALSE'); print('C049_1_COMPLETE = FALSE'); print('P_VS_NP = OPEN')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c049-b5-fixed-discovery-round-binding-v11-${{ github.run_id }}
          path: /tmp/fixed-v11
          if-no-files-found: error
          retention-days: 90
