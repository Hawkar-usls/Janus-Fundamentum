name: Validate C024 Merged Tail Frontier Localization

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_frontier_localization.py"
      - ".github/workflows/validate-c024-merged-tail-frontier-localization.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_frontier_localization.py"
      - ".github/workflows/validate-c024-merged-tail-frontier-localization.yml"

permissions:
  contents: read

jobs:
  merged-tail-frontier-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Localize merged-tail births relative to n-2 frontier
        run: python experiments/direct/janus_tear_gt_merged_tail_frontier_localization.py
