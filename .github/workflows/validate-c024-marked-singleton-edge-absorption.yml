name: Validate C024 Marked Singleton Edge Absorption

on:
  push:
    paths:
      - "proof_attempts/C024/GT_MARKED_SINGLETON_EDGE_ABSORPTION.md"
      - "experiments/direct/janus_tear_marked_singleton_edge_absorption.py"
      - ".github/workflows/validate-c024-marked-singleton-edge-absorption.yml"
  pull_request:
    paths:
      - "proof_attempts/C024/GT_MARKED_SINGLETON_EDGE_ABSORPTION.md"
      - "experiments/direct/janus_tear_marked_singleton_edge_absorption.py"
      - ".github/workflows/validate-c024-marked-singleton-edge-absorption.yml"

permissions:
  contents: read

jobs:
  marked-singleton-edge-absorption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust marked singleton-edge absorption
        run: python experiments/direct/janus_tear_marked_singleton_edge_absorption.py
