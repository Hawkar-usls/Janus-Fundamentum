name: TRUMP E8 Graphic AF3 Tension Bridge

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_AF3_NOWHERE_ZERO_TENSION_BRIDGE_2026-09-30_v5.2.json'
      - 'research/tools/e8_graphic_af3_tension_bridge/checker.py'
      - '.github/workflows/trump-e8-graphic-af3-tension-bridge.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact graphic AF3 tension regression
        run: python research/tools/e8_graphic_af3_tension_bridge/checker.py
