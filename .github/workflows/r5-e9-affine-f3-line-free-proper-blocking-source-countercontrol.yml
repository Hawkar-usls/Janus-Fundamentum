name: R5 E9 Affine F3 Line-Free Proper Blocking Countercontrol

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_LINE_FREE_PROPER_BLOCKING_SOURCE_COUNTERCONTROL_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_line_free_proper_blocking_source_countercontrol.py'
      - '.github/workflows/r5-e9-affine-f3-line-free-proper-blocking-source-countercontrol.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact line-free proper-blocking hostile control
        run: python experiments/r5_e9_affine_f3_line_free_proper_blocking_source_countercontrol.py
