name: TRUMP E8 P0 principal-transversal coefficient carrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P0_PRINCIPAL_TRANSVERSAL_COEFFICIENT_CARRIER_2026-09-30_v2.8.json'
      - 'research/tools/e8_p0_principal_transversal_carrier/checker.py'
      - '.github/workflows/trump-e8-p0-principal-transversal-carrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact P0 principal-transversal regression
        run: python research/tools/e8_p0_principal_transversal_carrier/checker.py
