name: TRUMP E8 one-core bounded-rank elimination barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_ONE_CORE_BOUNDED_RANK_BOOLEAN_ELIMINATION_BARRIER_2026-09-26_v0.8.json'
      - 'research/tools/e8_one_core_bounded_rank_elimination/checker.py'
      - '.github/workflows/trump-e8-one-core-bounded-rank-elimination.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Symbolic coefficient replay
        run: python research/tools/e8_one_core_bounded_rank_elimination/checker.py
