name: R5 Matched Rank Two Selector Equivalence
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_matched_rank2_selector_exact_witness.py'
      - '.github/workflows/r5-matched-rank2-selector-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-bijection:
    name: Exact two-matchgate selector term equals original Boolean assignment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove fixed selector contraction and finite original count alignment
        run: python -u experiments/r5_universal_matched_rank2_selector_exact_witness.py
