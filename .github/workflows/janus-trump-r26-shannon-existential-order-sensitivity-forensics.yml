name: JANUS TRUMP R26 Shannon Existential Order Sensitivity Forensics

on:
  push:
    branches:
      - research/janus-trump-r26-shannon-existential-order-sensitivity-forensics-2026-09-02
    paths:
      - 'research/JANUS_TRUMP_R26_SHANNON_EXISTENTIAL_ORDER_SENSITIVITY_FORENSICS_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r26_shannon_existential_order_sensitivity_forensics.py'
      - '.github/workflows/janus-trump-r26-shannon-existential-order-sensitivity-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orders:
    name: r26-order (${{ matrix.order }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        order:
          - ORIGINAL_R18_OCCURRENCE
          - R24_CUTSET_FIRST
          - R24_CUTSET_LAST
          - R23_MIN_FILL_INTERNAL
          - R23_MIN_DEGREE_INTERNAL
          - R23_MIN_FILL_REVERSED
          - R23_MIN_DEGREE_REVERSED
          - PRIMAL_DEGREE_DESCENDING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R26 freeze and sealed R18 machine
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/janus_trump_r18_shannon_hashcons_interface_dag_discovery.py)" = "afa95321ec6edbb33bef222d8ee7234fe631a599"
          python - <<'PY'
          import json
          p=json.load(open('research/JANUS_TRUMP_R26_SHANNON_EXISTENTIAL_ORDER_SENSITIVITY_FORENSICS_PREREGISTRATION_2026-09-02.json'))
          assert p['status']=='FROZEN_BEFORE_R26_IMPLEMENTATION_AND_EXECUTION'
          assert p['parent_R25_result_summary_commit']=='c7515c59171326225c5046a0deef8fd6b7e3e5b6'
          assert len(p['frozen_order_family'])==8
          assert p['frozen_machine']['git_blob_sha']=='afa95321ec6edbb33bef222d8ee7234fe631a599'
          assert p['resource_envelope_per_order']['wall_seconds']==120
          assert p['firewall']['semantic_verifier_forbidden'] is True
          assert p['P_VS_NP']=='OPEN'
          print('R26_FREEZE_OK')
          PY
      - name: Install import-only sealed dependency
        run: |
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
          echo 'R26_NOTE: PySAT is installed only because sealed R18 imports its verifier; R26 never calls semantic truth.'
      - name: Compile R26
        run: PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r26_shannon_existential_order_sensitivity_forensics.py
      - name: Run frozen order lane
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r26_shannon_existential_order_sensitivity_forensics.py \
            --order '${{ matrix.order }}' \
            --output 'artifacts/JANUS_TRUMP_R26_ORDER_${{ matrix.order }}_RESULT_2026-09-02.json'
      - name: Per-order scientific gate
        run: |
          ORDER='${{ matrix.order }}' python - <<'PY'
          import json,os
          order=os.environ['ORDER']; p=f'artifacts/JANUS_TRUMP_R26_ORDER_{order}_RESULT_2026-09-02.json'; d=json.load(open(p))
          assert d['order_id']==order
          assert d['candidate_firewall']['pass'] is True,d['candidate_firewall']
          assert d['truth_accessed'] is False and d['semantic_verifier_ran'] is False
          assert d['verdict'] in {'R26_TERMINAL_ORDER_SURVIVOR','R26_ORDER_RESOURCE_OPEN'},d['verdict']
          assert d['P_VS_NP']=='OPEN'
          if d['verdict']=='R26_TERMINAL_ORDER_SURVIVOR':
              assert d['candidate']['status']=='COMPLETE_INTERFACE_DAG'
              assert d['candidate']['completed_quantification_steps']==60
              assert d['terminal_survivor'] is True
          else:
              assert d['candidate']['status']=='OPEN_RESOURCE_LIMIT'
              assert d['terminal_survivor'] is False
          print(order,d['verdict'])
          PY
      - name: Upload immutable order evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r26-${{ matrix.order }}
          path: artifacts/JANUS_TRUMP_R26_ORDER_${{ matrix.order }}_RESULT_2026-09-02.json
          if-no-files-found: error

  aggregate:
    name: r26-aggregate
    needs: orders
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-only sealed dependency
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - uses: actions/download-artifact@v4
        with:
          pattern: janus-trump-r26-*
          path: order-results
          merge-multiple: true
      - name: Aggregate truth-blind order results
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r26_shannon_existential_order_sensitivity_forensics.py \
            --aggregate-dir order-results \
            --output artifacts/JANUS_TRUMP_R26_SHANNON_EXISTENTIAL_ORDER_SENSITIVITY_FORENSICS_AGGREGATE_RESULT_2026-09-02.json
      - name: Aggregate scientific gate
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('artifacts/JANUS_TRUMP_R26_SHANNON_EXISTENTIAL_ORDER_SENSITIVITY_FORENSICS_AGGREGATE_RESULT_2026-09-02.json'))
          allowed={'R26_SHANNON_ORDER_SENSITIVITY_CONFIRMED__TERMINAL_ORDER_SURVIVOR_EXISTS','R26_NO_TERMINAL_ORDER_SURVIVOR_IN_FROZEN_FAMILY__STOP_ORDER_FISHING','R26_FAIL_INTEGRITY'}
          assert d['verdict'] in allowed,d['verdict']
          assert d['order_count']==8 and d['truth_accessed'] is False and d['semantic_verifier_ran'] is False and d['P_VS_NP']=='OPEN'
          if d['verdict']=='R26_FAIL_INTEGRITY': sys.exit(2)
          assert d['integrity_pass'] is True
          print(d['verdict'])
          print('SURVIVORS',d['terminal_survivor_order_ids'])
          PY
      - name: Upload immutable R26 aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r26-aggregate
          path: artifacts/JANUS_TRUMP_R26_SHANNON_EXISTENTIAL_ORDER_SENSITIVITY_FORENSICS_AGGREGATE_RESULT_2026-09-02.json
          if-no-files-found: error
