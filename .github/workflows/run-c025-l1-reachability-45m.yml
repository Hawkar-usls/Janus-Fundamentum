name: run-c025-l1-reachability-45m

on:
  push:
    branches:
      - research/c025-phase5-9-polynomial-pivot-grammar-2026-08-28
    paths:
      - '.github/workflows/run-c025-l1-reachability-45m.yml'
  workflow_dispatch:

jobs:
  frozen-callsite-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay unmodified v0.4 to frozen ordinary callsite
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee c025-l1-reachability-45m.json
          import json
          from experiments.direct import janus_unified_proof_carrying_akinator_jec as base
          from experiments.theorem_extraction import c025_adversarial_delta_pair_search as adv

          source,left,right=adv.build_selector_source(10,90,4,39100)
          product=adv.direct_selector_product(left,right)
          assert base.fingerprint(source)=='bc07cfeb7d1ef62916d7319ed59edc8d2e4a92ce34881a13186d2c47991c66bc'
          assert base.fingerprint(product)=='037cbc224816408ca1c76c65c9bb78ad660d3b612c40ef91d1ac76943c7c79c3'
          assert base.input_size_units(source)==1102
          r=adv.verify_reachable_callsite(source,product)
          out={
            'schema':'JANUS/C025/L1-FROZEN-CALLSITE-REACHABILITY/v1',
            'status':'PASS' if r['reachable_at_frozen_ordinary_callsite'] else 'FAIL',
            'source_fingerprint':base.fingerprint(source),
            'product_fingerprint':base.fingerprint(product),
            'N':base.input_size_units(source),
            'product_units':base.state_units(product),
            'replay':r,
            'unmodified_core_required':True,
            'P_VS_NP':'OPEN'
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          if out['status']!='PASS': raise SystemExit(1)
          PY
      - name: Enforce exact target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c025-l1-reachability-45m.json').read_text())
          assert d['status']=='PASS'
          assert d['source_fingerprint']=='bc07cfeb7d1ef62916d7319ed59edc8d2e4a92ce34881a13186d2c47991c66bc'
          assert d['product_fingerprint']=='037cbc224816408ca1c76c65c9bb78ad660d3b612c40ef91d1ac76943c7c79c3'
          assert d['N']==1102
          assert d['P_VS_NP']=='OPEN'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-l1-reachability-45m
          path: c025-l1-reachability-45m.json
