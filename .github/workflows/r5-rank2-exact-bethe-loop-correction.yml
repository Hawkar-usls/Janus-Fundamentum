name: R5 Rank Two Exact Bethe Loop Correction
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_rank2_exact_bethe_loop_correction.py'
      - '.github/workflows/r5-rank2-exact-bethe-loop-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loops:
    name: Original SCL Fano7 and E61 SAT12 UNSAT12 exact correction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 16 local moments and exhaustive signed generalized-loop proof
        run: python -u experiments/r5_universal_rank2_exact_bethe_loop_correction.py
