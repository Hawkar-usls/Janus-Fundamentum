name: R5 Open Sixpole Exhaustive Boundary Composition Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_open_sixpole_2175_108000_signature_composition.py'
      - '.github/workflows/r5-open-sixpole-boundary-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sixpole:
    name: Petersen 2175 and 108000 exact sixpole relations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive original cubic multipole colour signature replay
        run: python -u experiments/r5_universal_open_sixpole_2175_108000_signature_composition.py
