name: R5 E9 Exact Bidirected Cycle-Kernel Binet Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_BIDIRECTED_CYCLE_KERNEL_BINET_BMATCHING_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exact_bidirected_cycle_kernel_binet_bmatching_router.py'
      - '.github/workflows/r5-e9-exact-bidirected-cycle-kernel-binet-router.yml'
  workflow_dispatch:

jobs:
  bidirected-binet-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact bidirected cycle-kernel / binet router regression
        run: python3 experiments/r5_e9_exact_bidirected_cycle_kernel_binet_bmatching_router.py
