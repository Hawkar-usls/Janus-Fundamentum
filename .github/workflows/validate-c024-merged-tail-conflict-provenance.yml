name: Validate C024 Merged Tail Conflict Provenance

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_unit_conflict_provenance.py"
      - "experiments/direct/janus_tear_gt_merged_tail_state_diagnostic.py"
      - "experiments/direct/janus_tear_gt_merged_tail_extinction_provenance.py"
      - ".github/workflows/validate-c024-merged-tail-conflict-provenance.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_unit_conflict_provenance.py"
      - "experiments/direct/janus_tear_gt_merged_tail_state_diagnostic.py"
      - "experiments/direct/janus_tear_gt_merged_tail_extinction_provenance.py"
      - ".github/workflows/validate-c024-merged-tail-conflict-provenance.yml"

permissions:
  contents: read

jobs:
  merged-tail-conflict-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose actual merged-tail birth states
        run: python experiments/direct/janus_tear_gt_merged_tail_state_diagnostic.py
      - name: Trace split conflict and branch extinction provenance
        run: python experiments/direct/janus_tear_gt_merged_tail_extinction_provenance.py
