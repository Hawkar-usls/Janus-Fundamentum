name: R5 Universal Existential Closure Proof Controls

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-universal-ei-closure-hardness.yml'
      - 'experiments/r5_universal_ei_closure_holyer_npcomplete_separation_rank.py'
      - 'experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py'
      - 'docs/r5_universal_ei_closure_exact_npcomplete_separation_rank_checkpoint_20261014.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  np-complete-native-and-projection-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify GF3 exactness and legacy legal SAT UNSAT matrices
        run: python -u experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py
      - name: Prove native cubic edge-colouring reduction and finite GF3 existential projection separation-rank barrier
        run: python -u experiments/r5_universal_ei_closure_holyer_npcomplete_separation_rank.py
