name: Validate C049.1 B4.6.3 corrected Node-9 residual up_k

on:
  push:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node9-residual-up-k.yml'
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node9-residual-up-k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-node9-residual-up-k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: experiments/direct
      PARENT_RESIDUAL_HEAD: 7a49fbe53b3bb7a775a35905106a5695e95579e8
      UPK_SPEC_SUBJECT: 1107992ce268a5f17bcbfb1f39fe2f83d2469529
      UPK_PRODUCER_SUBJECT: 0134dd99c6bf42d222b0044d216113174b9ebd11
      UPK_VERIFIER_SUBJECT: 6b4f9d3472ac7173c63a5c88f1d45783cedac250
      RESIDUAL_SPEC_SUBJECT: 51cd557386f7e46838116ea144acd961302d349b
      RESIDUAL_PRODUCER_SUBJECT: 6fc069b6525be01dc73fc01cd59cd1d728db29e8
      RESIDUAL_VERIFIER_SUBJECT: 228eb76ebae04d4e675938c6068836a691e819b1
      SCALAR_SPEC_SUBJECT: 0b6a472d43096d4508a217c938a2988a3315bddc
      SCALAR_PRODUCER_SUBJECT: 74d1d6fd02a7c45578b6ba79891ca93796e701b6
      SCALAR_VERIFIER_SUBJECT: b4f0769601d437a0063f5d2cb1e2586d1773c9e5
      NODE8_SUBJECT: 0fcdaa168dde2aef27603d51ff547c07860a9fd1
      LEAF5_SUBJECT: c354d56bf3ac0bb77136b96e869dc95a6b9ba07f
      Q80_SUBJECT: 97a57154b4fdeed8cbc7ba40fa71b2008757c8f1
      STRUCT_SPEC_SUBJECT: f942dffdd5ba1b2c4fa4a61da722e0c7c4a18d15
      STRUCT_PRODUCER_SUBJECT: e31c05c7e85ecda2ebf79aebb504f42f9d14009a
      UPK_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json
      UPK_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py
      UPK_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py
      RESIDUAL_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_COMPACT_FRONTIER_SPEC_V1.json
      RESIDUAL_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_compact_frontier.py
      RESIDUAL_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_compact_frontier_verifier.py
      SCALAR_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_SCALAR_SYMBOLIC_AUTOMATON_SPEC_V1_2.json
      SCALAR_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_scalar_symbolic_automaton.py
      SCALAR_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_scalar_symbolic_automaton_verifier.py
      NODE8_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node8_twenty_generator_up_k.py
      LEAF5: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RIGHT_LEAF5_CANDIDATE_V1.json
      STRUCT_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_PARENT_FRONTIER_STRUCTURAL_COMPRESSION_SPEC_V1.json
      STRUCT_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_parent_frontier_structural_compression.py
      Q80_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_quotient_skeleton_stability_analysis.py
      Q80_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_quotient_skeleton_stability_analysis_verifier.py

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct full bound chain and verify residual up_k
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT_RESIDUAL_HEAD" HEAD
          bind_blob(){ test "$(git rev-parse "$1:$2")" = "$(git hash-object "$2")"; }
          bind_blob "$UPK_SPEC_SUBJECT" "$UPK_SPEC"
          bind_blob "$UPK_PRODUCER_SUBJECT" "$UPK_PRODUCER"
          bind_blob "$UPK_VERIFIER_SUBJECT" "$UPK_VERIFIER"
          bind_blob "$RESIDUAL_SPEC_SUBJECT" "$RESIDUAL_SPEC"
          bind_blob "$RESIDUAL_PRODUCER_SUBJECT" "$RESIDUAL_PRODUCER"
          bind_blob "$RESIDUAL_VERIFIER_SUBJECT" "$RESIDUAL_VERIFIER"
          bind_blob "$SCALAR_SPEC_SUBJECT" "$SCALAR_SPEC"
          bind_blob "$SCALAR_PRODUCER_SUBJECT" "$SCALAR_PRODUCER"
          bind_blob "$SCALAR_VERIFIER_SUBJECT" "$SCALAR_VERIFIER"
          bind_blob "$NODE8_SUBJECT" "$NODE8_PRODUCER"
          bind_blob "$LEAF5_SUBJECT" "$LEAF5"
          bind_blob "$STRUCT_SPEC_SUBJECT" "$STRUCT_SPEC"
          bind_blob "$STRUCT_PRODUCER_SUBJECT" "$STRUCT_PRODUCER"
          bind_blob "$Q80_SUBJECT" "$Q80_PRODUCER"
          bind_blob "$Q80_SUBJECT" "$Q80_VERIFIER"
          python -m py_compile "$UPK_PRODUCER" "$UPK_VERIFIER" "$RESIDUAL_PRODUCER" "$RESIDUAL_VERIFIER" "$SCALAR_PRODUCER" "$SCALAR_VERIFIER" "$Q80_PRODUCER" "$Q80_VERIFIER" "$NODE8_PRODUCER"
          test "$(git hash-object "$UPK_SPEC")" = "f661107212acdca4019dc2d038610e2cdd3beb40"
          test "$(git hash-object "$UPK_PRODUCER")" = "f7082ee031074e6548a49e17227c5c4b410c891d"
          test "$(git hash-object "$UPK_VERIFIER")" = "1c14feb2d04b4dee2c66ff97e43e252d5a38ef80"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py').read_text())
          v=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py').read_text())
          def mods(t):
              out=[]
              for n in ast.walk(t):
                  if isinstance(n,ast.Import): out.extend(a.name for a in n.names)
                  elif isinstance(n,ast.ImportFrom): out.append(n.module or '')
              return out
          assert not any(x.endswith('janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier') for x in mods(p))
          assert not any(x.endswith('janus_c049_1_b4_6_3_corrected_node9_residual_up_k') for x in mods(v))
          print('UP_K_IMPLEMENTATION_DECOUPLING_STATIC_CHECK = PASS')
          PY

          cat experiments/direct/.cn8_frozen_b64/part* | base64 -d > /tmp/pr114-node8.json
          test "$(sha256sum /tmp/pr114-node8.json | cut -d' ' -f1)" = "30329bdb77802016ef3479d37a29fdb8e1fc95c5d534484fc179916a0cfdbb0a"
          python "$NODE8_PRODUCER" /tmp/pr114-node8.json --entry-order original --output /tmp/node8.json > /tmp/node8.log
          test "$(sha256sum /tmp/node8.json | cut -d' ' -f1)" = "80b74b500ae82639e51568a9a6dc70a72668f32991add42bc5ffac05b3f9537f"

          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$Q80_PRODUCER" --spec "$STRUCT_SPEC" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --output "/tmp/q80-$mode.json" --order-mode "$mode" > "/tmp/q80-$mode.log"
          done
          cmp /tmp/q80-ORIGINAL.json /tmp/q80-REVERSED.json && cmp /tmp/q80-ORIGINAL.json /tmp/q80-SEEDED_SHUFFLE.json
          python "$Q80_VERIFIER" --spec "$STRUCT_SPEC" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --artifact /tmp/q80-ORIGINAL.json --producer-source "$Q80_PRODUCER" --peer-artifact /tmp/q80-REVERSED.json --peer-artifact /tmp/q80-SEEDED_SHUFFLE.json --tamper | tee /tmp/q80-verifier.log
          grep -F 'JANUS_NODE9_Q80_INDEPENDENT_VERIFIER = PASS' /tmp/q80-verifier.log

          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$SCALAR_PRODUCER" --spec "$SCALAR_SPEC" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --q80-artifact /tmp/q80-ORIGINAL.json --output "/tmp/scalar-$mode.json" --order-mode "$mode" > "/tmp/scalar-$mode.log"
          done
          cmp /tmp/scalar-ORIGINAL.json /tmp/scalar-REVERSED.json && cmp /tmp/scalar-ORIGINAL.json /tmp/scalar-SEEDED_SHUFFLE.json
          test "$(sha256sum /tmp/scalar-ORIGINAL.json | cut -d' ' -f1)" = "b953c89f95f3deee18fe92080b0988846603a46c17e0f51bcfa2eef50d325aca"
          python "$SCALAR_VERIFIER" --spec "$SCALAR_SPEC" --producer-source "$SCALAR_PRODUCER" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --q80-artifact /tmp/q80-ORIGINAL.json --candidate-original /tmp/scalar-ORIGINAL.json --candidate-reversed /tmp/scalar-REVERSED.json --candidate-seeded-shuffle /tmp/scalar-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/scalar-verifier.log
          grep -F 'JANUS_NODE9_SCALAR_SYMBOLIC_AUTOMATON_INDEPENDENT_VERIFIER = PASS' /tmp/scalar-verifier.log

          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$RESIDUAL_PRODUCER" --spec "$RESIDUAL_SPEC" --scalar-artifact /tmp/scalar-ORIGINAL.json --q80-artifact /tmp/q80-ORIGINAL.json --output "/tmp/residual-$mode.json" --order-mode "$mode" > "/tmp/residual-$mode.log"
          done
          cmp /tmp/residual-ORIGINAL.json /tmp/residual-REVERSED.json && cmp /tmp/residual-ORIGINAL.json /tmp/residual-SEEDED_SHUFFLE.json
          test "$(sha256sum /tmp/residual-ORIGINAL.json | cut -d' ' -f1)" = "4d81196e48b75d0f138e97fc2c72ef8984581cb0bb42ea0fd187dcb881a0b62f"
          python "$RESIDUAL_VERIFIER" --spec "$RESIDUAL_SPEC" --producer-source "$RESIDUAL_PRODUCER" --scalar-artifact /tmp/scalar-ORIGINAL.json --q80-artifact /tmp/q80-ORIGINAL.json --candidate-original /tmp/residual-ORIGINAL.json --candidate-reversed /tmp/residual-REVERSED.json --candidate-seeded-shuffle /tmp/residual-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/residual-verifier.log
          grep -F 'JANUS_NODE9_RESIDUAL_COMPACT_FRONTIER_INDEPENDENT_VERIFIER = PASS' /tmp/residual-verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/residual-verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/residual-verifier.log

          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$UPK_PRODUCER" --spec "$UPK_SPEC" --residual-artifact /tmp/residual-ORIGINAL.json --output "/tmp/upk-$mode.json" --order-mode "$mode" | tee "/tmp/upk-$mode.log"
          done
          cmp /tmp/upk-ORIGINAL.json /tmp/upk-REVERSED.json
          cmp /tmp/upk-ORIGINAL.json /tmp/upk-SEEDED_SHUFFLE.json
          echo 'UP_K_THREE_MODE_BYTE_IDENTITY = PASS'
          echo "UP_K_ARTIFACT_SHA256 = $(sha256sum /tmp/upk-ORIGINAL.json | cut -d' ' -f1)"

          python "$UPK_VERIFIER" --spec "$UPK_SPEC" --producer-source "$UPK_PRODUCER" --residual-artifact /tmp/residual-ORIGINAL.json --candidate-original /tmp/upk-ORIGINAL.json --candidate-reversed /tmp/upk-REVERSED.json --candidate-seeded-shuffle /tmp/upk-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/upk-verifier.log
          grep -F 'JANUS_NODE9_RESIDUAL_UP_K_INDEPENDENT_VERIFIER = PASS' /tmp/upk-verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/upk-verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/upk-verifier.log
          grep -F 'PRODUCER_IMPORT = FORBIDDEN_AND_NOT_USED' /tmp/upk-verifier.log

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          residual=json.loads(Path('/tmp/residual-ORIGINAL.json').read_text())['proof_payload']
          a=json.loads(Path('/tmp/upk-ORIGINAL.json').read_text()); p=a['proof_payload']
          assert hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()==a['semantic_digest']
          assert len(p['input_generators'])==len(residual['global_compact_frontier']['outcomes'])
          assert p['expected_input_count_used'] is False
          assert p['ordered_extension_relation']['expected_edge_count_used'] is False
          assert p['minimization']['expected_retained_count_used'] is False
          assert p['complete_universe']['expected_universe_size_used'] is False
          assert p['closure']['expected_entry_count_used'] is False
          assert p['complete_universe']['supplied_universe_used'] is False
          assert p['closure']['closures_equal'] is True
          assert p['idempotence']['first_second_closure_equal'] is True
          assert p['minimization']['transitive_only_removal_witnesses']==0
          assert p['work_ledger']['supplied_universe_entries_consumed']==0
          b=p['strict_boundary']
          assert b['node9_frontier_candidate_complete'] is True
          assert b['node9_parent_refinement_complete'] is True
          assert b['node9_parent_up_k_complete'] is False
          assert b['node9_integrated_into_bottom_up_executor'] is False
          assert b['repository_failed_domains']==0 and b['repository_successful_domains']==0
          assert b['root_reached'] is False
          assert b['formal_admission']=='BLOCKED' and b['next_gate']=='CLOSED' and b['p_vs_np']=='OPEN'
          print('NON_ORACULAR_UP_K_DERIVATION = PASS')
          print('DERIVED_INPUT_GENERATORS =',len(p['input_generators']))
          print('DERIVED_RELATION_EDGES =',p['ordered_extension_relation']['edge_count'])
          print('DERIVED_RETAINED_GENERATORS =',len(p['minimization']['retained_generators']))
          print('DERIVED_COMPLETE_UNIVERSE =',p['complete_universe']['entry_count'])
          print('DERIVED_CLOSURE_ENTRIES =',p['closure']['entry_count'])
          print('IDEMPOTENT = TRUE')
          print('NODE9_PARENT_UP_K_COMPLETE = FALSE')
          print('FORMAL_ADMISSION = BLOCKED')
          print('NEXT_GATE = CLOSED')
          print('P_VS_NP = OPEN')
          PY

          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "UPK_SPEC_BLOB=$(git hash-object "$UPK_SPEC")"
            echo "UPK_PRODUCER_BLOB=$(git hash-object "$UPK_PRODUCER")"
            echo "UPK_VERIFIER_BLOB=$(git hash-object "$UPK_VERIFIER")"
            echo "RESIDUAL_SHA256=$(sha256sum /tmp/residual-ORIGINAL.json | cut -d' ' -f1)"
            echo "UPK_SHA256=$(sha256sum /tmp/upk-ORIGINAL.json | cut -d' ' -f1)"
            echo "THREE_MODE_BYTE_IDENTITY=PASS"
            echo "INVARIANTS=12/12"
            echo "DIGEST_REPAIRED_TAMPERS_REJECTED=12/12"
            echo "NODE9_PARENT_UP_K_COMPLETE=FALSE"
            echo "FORMAL_ADMISSION=BLOCKED"
            echo "NEXT_GATE=CLOSED"
            echo "P_VS_NP=OPEN"
          } | tee /tmp/upk-exact-head-receipt.txt

      - name: Export residual up_k evidence package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-corrected-node9-residual-up-k
          retention-days: 7
          path: |
            /tmp/upk-exact-head-receipt.txt
            /tmp/residual-ORIGINAL.json
            /tmp/residual-verifier.log
            /tmp/upk-ORIGINAL.json
            /tmp/upk-REVERSED.json
            /tmp/upk-SEEDED_SHUFFLE.json
            /tmp/upk-ORIGINAL.log
            /tmp/upk-REVERSED.log
            /tmp/upk-SEEDED_SHUFFLE.log
            /tmp/upk-verifier.log
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json
            experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py
            experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py
