name: TRUMP SATLIB UF20 Signed Epsilon Residual Bound

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_SIGNED_EPSILON_DETERMINATION_RESIDUAL_BOUND_PREREGISTRATION_2026-09-16.json'
      - 'research/TRUMP_SATLIB_UF20_SIGNED_EPSILON_DETERMINATION_DIRECT_PROOF_2026-09-16.md'
      - 'research/tools/apma_satlib_uf20_signed_epsilon_residual_bound/**'
      - '.github/workflows/trump-satlib-uf20-signed-epsilon-residual-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen proof source and checker bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_EPSILON_DETERMINATION_RESIDUAL_BOUND_PREREGISTRATION_2026-09-16.json)" = "c03520ad0e80341ca518348cafc99d7cbbc2b7c7"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_EPSILON_DETERMINATION_DIRECT_PROOF_2026-09-16.md)" = "adfa4b1dd935109e5593fba7509d37ba5fe0400b"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_AUTOMORPHISM_ADMISSIBILITY_RESULT_2026-09-16.json)" = "6fd65d76651492009af19db0fe4a8d97e15794d1"
          test "$(git hash-object research/source_data/SATLIB_UF20_01_2026-09-16.cnf)" = "8330041b292e0501f8d74c1b1d32ca96c4498864"
          test "$(git hash-object research/source_data/SATLIB_UF20_02_2026-09-16.cnf)" = "f924caaef0d868bf62b1658e83e030ad8daee865"
          test "$(git hash-object research/source_data/SATLIB_UF20_03_2026-09-16.cnf)" = "8f3d15154515457281f49201b843f2a7134dfa9f"
          test "$(git hash-object research/source_data/SATLIB_UF20_04_2026-09-16.cnf)" = "34ced5c169f967b2dc44ef5e42f2ee2c924813e1"
          test "$(git hash-object research/source_data/SATLIB_UF20_05_2026-09-16.cnf)" = "3b04eff26ee37bdd0bc21b1066486974f92a2c9b"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_epsilon_residual_bound/certificate.py)" = "db94e6d783f021fb52997acd28a0457d3b38479e"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_epsilon_residual_bound/independent_checker.py)" = "94d52c5906769046c3bf8b19d34d8a0563c3b807"
      - name: Run residual candidate bound certificate
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_epsilon_residual_bound.certificate | tee /tmp/residual-bound.json
      - name: Run independent residual bound checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_epsilon_residual_bound.independent_checker --candidate-json /tmp/residual-bound.json | tee /tmp/residual-independent.json
      - name: Assert proof counting result and firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/residual-bound.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/residual-independent.json').read_text().strip().splitlines()[-1])
          assert c['verdict']=='PASS_EPSILON_DETERMINATION_AND_RESIDUAL_CANDIDATE_BOUND', c
          assert c['source_guard']['ok'] is True, c['source_guard']
          assert i['verified'] is True and i['certificate_imported'] is False, i
          assert c['total_residual_signed_action_candidates_across_five_sources']==34, c
          expected={'UF20_01':8,'UF20_02':2,'UF20_03':8,'UF20_04':8,'UF20_05':8}
          got={r['source']:r['residual_signed_action_candidates'] for r in c['rows']}
          assert got==expected,(got,expected)
          rr=c['resource_receipt']
          assert rr['global_signed_actions_tested']==0 and rr['exact_signed_formula_transport_tests']==0, rr
          assert rr['solver_invocations']==0 and rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0 and rr['new_group_search_mechanisms']==0 and rr['budget_raise'] is False, rr
          sf=c['scientific_firewall'];assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED',sf
          print(json.dumps({'verdict':c['verdict'],'total':c['total_residual_signed_action_candidates_across_five_sources'],'rows':[{'source':r['source'],'classes':r['unsigned_classes'],'balanced':r['balanced_variables'],'permutations':r['unsigned_respecting_permutation_candidates'],'epsilon_mult':r['epsilon_multiplicity_per_permutation'],'residual':r['residual_signed_action_candidates']} for r in c['rows']],'independent_verified':i['verified']},sort_keys=True))
          PY
      - name: Upload residual bound receipt
        uses: actions/upload-artifact@v4
        with:
          name: satlib-uf20-signed-epsilon-residual-bound-receipt
          path: |
            /tmp/residual-bound.json
            /tmp/residual-independent.json
          if-no-files-found: error
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_PROOF_AND_COUNTING_CERTIFICATE_ONLY__NO_SIGNED_GROUP_SEARCH'
          echo 'GLOBAL_SIGNED_ACTIONS_TESTED=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
