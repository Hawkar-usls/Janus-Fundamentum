name: TRUMP E8 C4 Cycle Holonomy EQ NEQ Jump

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_CYCLE_HOLONOMY_EQ_NEQ_EXPRESSIVE_JUMP_2026-09-30_v7.6.json'
      - 'research/tools/e8_c4_cycle_holonomy_eq_neq_jump/checker.py'
      - '.github/workflows/trump-e8-c4-cycle-holonomy-eq-neq-jump.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_CYCLE_HOLONOMY_EQ_NEQ_EXPRESSIVE_JUMP_2026-09-30_v7.6.json'
      - 'research/tools/e8_c4_cycle_holonomy_eq_neq_jump/checker.py'
      - '.github/workflows/trump-e8-c4-cycle-holonomy-eq-neq-jump.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay C4 cycle-holonomy EQ/NEQ expressive jump
        run: python research/tools/e8_c4_cycle_holonomy_eq_neq_jump/checker.py
