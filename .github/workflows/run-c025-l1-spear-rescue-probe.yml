name: run-c025-l1-spear-rescue-probe

on:
  push:
    branches:
      - research/c025-phase5-9-polynomial-pivot-grammar-2026-08-28
    paths:
      - 'experiments/theorem_extraction/c025_l1_spear_rescue_probe.py'
      - '.github/workflows/run-c025-l1-spear-rescue-probe.yml'
  workflow_dispatch:

jobs:
  spear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact learned-prior spear probe
        run: |
          python experiments/theorem_extraction/c025_l1_spear_rescue_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: c025-l1-spear-rescue-probe
          path: c025-l1-spear-rescue-probe.json
