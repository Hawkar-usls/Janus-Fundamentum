name: KEYMASTER Pivot Calibration + Slime/TOPA bridge

on:
  push:
    branches:
      - research/janus-keymaster-calibration-pivot-slime-topa-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile calibration runners
        run: |
          python -m py_compile \
            experiments/mad_lab/keymaster_pivot_feature_microscope.py \
            experiments/mad_lab/keymaster_m2r_persistent_memory.py \
            experiments/mad_lab/keymaster_learning_gain_journal.py \
            experiments/mad_lab/m2rs_four_front_janus_canonical_core.py \
            experiments/mad_lab/juxtapose_250x250_exact.py \
            experiments/direct/janus_unified_proof_carrying_akinator_jec.py
          python -m experiments.mad_lab.keymaster_m2r_persistent_memory --self-test
          python -m experiments.mad_lab.keymaster_learning_gain_journal self-test

      - name: Run exact structural feature microscope
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.mad_lab.keymaster_pivot_feature_microscope \
            --json-out artifacts/keymaster/keymaster_pivot_feature_microscope.json \
            | tee /tmp/keymaster-microscope.log

      - name: Build persistent M2R-PM memory, Slime training set, and TOPA seeds
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.mad_lab.keymaster_m2r_persistent_memory \
            --microscope artifacts/keymaster/keymaster_pivot_feature_microscope.json \
            --state-out artifacts/keymaster/keymaster_m2r_pm_state.json \
            --training-out artifacts/keymaster/pivot_slime_training.jsonl \
            --topa-out artifacts/keymaster/topa_keymaster_pivot_seeds.jsonl \
            | tee /tmp/keymaster-memory.log

      - name: Seed Learning Gain Journal from exact historical receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.mad_lab.keymaster_learning_gain_journal seed \
            --journal-out artifacts/keymaster/keymaster_learning_gain_journal.jsonl \
            --summary-out artifacts/keymaster/keymaster_learning_gain_summary.json \
            | tee /tmp/keymaster-gain-journal.log

      - name: Validate persistent calibration JSONs, Detective Spider and KLGJ contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          table=json.loads(Path('data/keymaster/KEYMASTER_PIVOT_GRADATION_TABLE_v1.0.json').read_text())
          arch_v1=json.loads(Path('data/keymaster/KEYMASTER_SLIME_M2R_TOPA_ARCHITECTURE_v1.0.json').read_text())
          arch_v11=json.loads(Path('data/keymaster/KEYMASTER_SLIME_M2R_TOPA_ARCHITECTURE_v1.1.json').read_text())
          arch=json.loads(Path('data/keymaster/KEYMASTER_SLIME_M2R_TOPA_ARCHITECTURE_v1.2.json').read_text())
          klgj=json.loads(Path('data/keymaster/KEYMASTER_LEARNING_GAIN_JOURNAL_CONTRACT_v1.0.json').read_text())
          micro=json.loads(Path('artifacts/keymaster/keymaster_pivot_feature_microscope.json').read_text())
          mem=json.loads(Path('artifacts/keymaster/keymaster_m2r_pm_state.json').read_text())
          journal=[json.loads(x) for x in Path('artifacts/keymaster/keymaster_learning_gain_journal.jsonl').read_text().splitlines() if x.strip()]
          gain=json.loads(Path('artifacts/keymaster/keymaster_learning_gain_summary.json').read_text())
          train=[json.loads(x) for x in Path('artifacts/keymaster/pivot_slime_training.jsonl').read_text().splitlines() if x.strip()]
          topa=[json.loads(x) for x in Path('artifacts/keymaster/topa_keymaster_pivot_seeds.jsonl').read_text().splitlines() if x.strip()]
          assert table['scientific_firewall']['P_VS_NP']=='OPEN'
          assert table['scientific_firewall']['pivot_numeric_id_is_not_a_transferable_feature'] is True
          assert len(table['experiments'])==2
          assert table['experiments'][0]['order_space']['orders']==5040
          assert table['experiments'][1]['stress_caps'][0]['safe_orders']==30240
          assert table['experiments'][1]['stress_caps'][0]['overflow_orders']==10080
          assert arch_v1['anti_self_deception_gate']['P_VS_NP']=='OPEN'
          assert arch_v11['preserve_v1_0_as_historical_record'] is True
          c=arch['canonical_topa_contract']
          assert arch['supersedes_for_architecture'].endswith('v1.1.json')
          assert c['default_operational_identity']=='TOPA_DETECTIVE_SPIDER'
          assert c['default_profile']=='DETECTIVE'
          assert c['profiles']['DETECTIVE']=={'topa_core': True, 'spider': True}
          assert arch['components']['JGPT_PIVOT_SLIME_TEACHER']['base']=='AdaptiveTransformer / JGPT1 family'
          assert arch['components']['PIVOT_SLIME_STUDENT']['base']=='MicroGPTSlime_quantized.py / MicroGPTSlime'
          assert arch['components']['KLGJ']['short_name']=='KLGJ'
          assert arch['components']['KLGJ']['proof_authority'] is False
          assert arch['klgj_accounting_contract']['training_cost_is_subtracted'] is True
          assert arch['klgj_accounting_contract']['physical_resource_created_by_learning'] is False
          assert arch['scientific_firewall']['P_VS_NP']=='OPEN'
          assert klgj['short_name']=='KLGJ'
          assert klgj['immutability']['event_log']=='APPEND_ONLY'
          assert klgj['resource_ledger']['resource_balance_statement'].startswith('Report both gross training')
          assert klgj['plateau_detector']['default_window_checkpoints']==5
          assert klgj['plateau_detector']['relative_gain_epsilon']==0.005
          assert micro['P_VS_NP']=='OPEN'
          assert len(micro['cases'])==2
          c25,c250=micro['cases']
          assert c25['best_raw_units']==718 and c25['worst_raw_units']==949
          assert c250['best_raw_units']==10787 and c250['worst_raw_units']==10849
          assert mem['P_VS_NP']=='OPEN'
          assert mem['episode_count']==15
          assert len(train)==15 and len(topa)==15
          assert all('pivot_id_local' not in e['features'] for e in train)
          assert all(r['provider']=='TOPA_REPO' for r in topa)
          assert len(journal)==3
          assert journal[0]['event_type']=='HISTORICAL_BACKFILL'
          assert journal[2]['event_type']=='CALIBRATION_BASELINE'
          assert gain['P_VS_NP']=='OPEN'
          assert gain['event_count']==3
          assert gain['accounting']['physical_resource_created'] is False
          assert gain['accounting']['cumulative_pair_work_saved_where_comparable']==0.0
          assert gain['plateau_watch']['status']=='INSUFFICIENT_HISTORY'
          print('KEYMASTER_CALIBRATION_FIREWALL=PASS')
          print('TOPA_DEFAULT=TOPA_DETECTIVE_SPIDER')
          print('JGPT_TEACHER=PRESENT')
          print('PIVOT_SLIME_STUDENT=PRESENT')
          print('KLGJ_APPEND_ONLY=PASS')
          print('KLGJ_HISTORICAL_EVENTS=3')
          print('KLGJ_GAIN_CLAIM=NOT_YET_MEASURED')
          print('KLGJ_PLATEAU=INSUFFICIENT_HISTORY')
          print('KEYMASTER_M2R_PM_EPISODES=15')
          print('PIVOT_SLIME_TRAINING_ROWS=15')
          print('TOPA_PIVOT_SEEDS=15')
          print('P_VS_NP=OPEN')
          PY

      - name: Upload complete calibration bundle
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-pivot-calibration-bundle
          path: artifacts/keymaster
          if-no-files-found: error
          retention-days: 90
