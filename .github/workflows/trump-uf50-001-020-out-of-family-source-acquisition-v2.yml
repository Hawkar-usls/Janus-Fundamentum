name: TRUMP UF50 001-020 out-of-family source acquisition v2

on:
  push:
    branches:
      - research/trump-uf50-001-020-out-of-family-wl-orbit-falsifier-2026-09-18
    paths:
      - .github/workflows/trump-uf50-001-020-out-of-family-source-acquisition-v2.yml

permissions:
  contents: write

jobs:
  acquire-v2:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify corrected frozen authorities
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'research/TRUMP_UF50_001_020_OUT_OF_FAMILY_WL_ORBIT_FALSIFIER_PANEL_RESERVATION_PREREGISTRATION_2026-09-18_v1.0.json':'cb21ee36a96368ea7f7b8b1e2fdf17788cda8a65',
            'research/TRUMP_UF50_001_020_OUT_OF_FAMILY_SOURCE_ACQUISITION_PREREGISTRATION_2026-09-18_v1.0.json':'19e15c35aef3b1e89fc40fe17daf160923332d2f',
            'research/TRUMP_UF50_001_020_OUT_OF_FAMILY_SOURCE_ACQUISITION_REVIEW_2026-09-18_v1.0.json':'fa67d3aa9e511f9938ec69150523f1f26780fef3',
            'research/TRUMP_UF50_001_020_OUT_OF_FAMILY_SOURCE_ACQUISITION_VERIFICATION_PATH_ERRATUM_2026-09-18_v1.0.json':'862e38d2e0e78e833ae59783201eb2c44e72596d',
            'research/TRUMP_UF50_001_020_OUT_OF_FAMILY_SOURCE_ACQUISITION_VERIFICATION_PATH_ERRATUM_REVIEW_2026-09-18_v1.0.json':'fb9893b2e5c02e02a45dde9465051c787193a436',
            'research/tools/trump_uf50_001_020_out_of_family_source_acquisition/candidate.py':'be1591ecb6b8fa7e7045fc5ddef6d1b4117e31ca',
            'research/tools/trump_uf50_001_020_out_of_family_source_acquisition/candidate_v2.py':'82991d9f429c0f8582189d981920ae1cabc7e866',
            'research/tools/trump_uf50_001_020_out_of_family_source_acquisition/independent_check_v2.py':'a765c4db8437d6acdeee97c90d688ffd34888708',
          }
          def blob(p):
              d=Path(p).read_bytes(); return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          bad={p:(h,blob(p)) for p,h in expected.items() if blob(p)!=h}
          if bad: raise SystemExit(f'AUTHORITY_BINDING_FAILURE {bad}')
          print('CORRECTED_AUTHORITY_BINDINGS_PASS')
          PY

      - name: Execute corrected blind dual-mirror acquisition
        run: |
          python research/tools/trump_uf50_001_020_out_of_family_source_acquisition/candidate_v2.py > /tmp/uf50_candidate_v2.json
          cat /tmp/uf50_candidate_v2.json

      - name: Upload v2 candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: trump-uf50-001-020-acquisition-v2-candidate-${{ github.run_id }}
          path: /tmp/uf50_candidate_v2.json

      - name: Gate v2 candidate verdict
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/uf50_candidate_v2.json'))
          print(x['verdict'])
          if x['verdict']!='PASS_UF50_001_020_DUAL_MIRROR_SOURCE_ACQUISITION_AND_FORMULA_FREEZE': raise SystemExit(1)
          PY

      - name: Independent v2 refetch and verification
        run: |
          python research/tools/trump_uf50_001_020_out_of_family_source_acquisition/independent_check_v2.py --candidate /tmp/uf50_candidate_v2.json > /tmp/uf50_independent_v2.json
          cat /tmp/uf50_independent_v2.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/uf50_independent_v2.json'))
          if x['verdict']!='PASS_INDEPENDENT_UF50_001_020_SOURCE_FREEZE_VERIFICATION_V2': raise SystemExit(1)
          PY

      - name: Build corrected frozen source result
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.load(open('/tmp/uf50_candidate_v2.json'))
          i=json.load(open('/tmp/uf50_independent_v2.json'))
          iv={r['source']:r for r in i['verification_rows']}
          rows=[]
          for row in c['source_receipts']:
              rr=dict(row); v=iv[row['source']]
              rr['committed_git_blob']=v['committed_git_blob']
              rr['computed_committed_git_blob']=v['committed_git_blob']
              rr['independent_verified']=v['pass'] is True
              rr['status']='SOURCE_FROZEN'
              rows.append(rr)
          result={
            'artifact_id':'JANUS-TRUMP-UF50-001-020-OUT-OF-FAMILY-CORRECTED-SOURCE-ACQUISITION-RESULT-2026-09-18-v1.0',
            'date':'2026-09-18',
            'status':'FROZEN_OUT_OF_FAMILY_UF50_SOURCE_PANEL_AFTER_VERIFICATION_PATH_CORRECTION',
            'verdict':'PASS_UF50_001_020_DUAL_MIRROR_SOURCE_ACQUISITION_AND_FORMULA_FREEZE',
            'authorities':{
              'reservation_commit':'02776f7258699390969827a43e259af118a0b540',
              'acquisition_prereg_commit':'c58772d8da942ae8d5b123fd9cebf81a07842683',
              'acquisition_review_commit':'c58471f5022b2e0fdb8ec3949811b7f597902ded',
              'verification_path_erratum_commit':'befb731353d15ffa5b82f081e528839ae1254c9b',
              'verification_path_erratum_review_commit':'85135c1412a68fc0b3fdf7cbdb7462ccf6257ed8',
              'candidate_v2_commit':'f2d58af48adfec16895a6b1e2f63dcc97741f389',
              'candidate_v2_blob':'82991d9f429c0f8582189d981920ae1cabc7e866',
              'independent_checker_v2_commit':'d75640c6689ec2666f412746b488456748775d68',
              'independent_checker_v2_blob':'a765c4db8437d6acdeee97c90d688ffd34888708',
              'workflow_head':os.environ['GITHUB_SHA'],
            },
            'failed_prior_runs':[35275751737,35275944190],
            'implementation_correction':'VERIFICATION_DIRECTORY_BINDING_ONLY__TRAIN_SPLIT_TO_UNSPLIT_UF50_218__ALL_IDENTITIES_REPOS_COMMITS_FORMULA_CONTRACT_AND_SCIENTIFIC_RULES_UNCHANGED',
            'execution':{
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_number':int(os.environ['GITHUB_RUN_NUMBER']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'sources_verified':i['sources_verified'],
              'candidate_imported_by_independent_checker':False,
              'independent_verdict':i['verdict'],
            },
            'source_receipts':rows,
            'blind_barrier_receipt':{
              'projected_raw_computations':0,'pendant_target_computations':0,'wl_computations':0,
              'direct_transposition_checks':0,'full_transposition_searches':0,'portfolio_replays':0,
              'e3_witness_computations':0,'solver_invocations':0,'external_truth_or_metrics_reads':0,
            },
            'claim_ceiling':'SOURCE_PROVENANCE_AND_DUAL_MIRROR_FORMULA_FREEZE_ONLY',
            'next_step':'PREREGISTER_OUT_OF_FAMILY_UF50_WL_FIRST_THEN_FROZEN_E1_E2_E3_GROUND_TRUTH_FALSIFIER_EVALUATION_ON_ALL_TWENTY_WITH_SELECTOR_AND_SCOPE_RULES_UNCHANGED',
            'scientific_firewall':{'WL_SUFFICIENCY_WITHOUT_DIRECT_EXACT_CHECK':'NOT_PROVED','GENERAL_SAT_IN_P':'NOT_PROVED','P_VS_NP':'OPEN'},
          }
          Path('/tmp/uf50_source_result_v2.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'verdict':result['verdict'],'sources_verified':i['sources_verified']}))
          PY

      - name: Upload immutable corrected acquisition receipts
        uses: actions/upload-artifact@v4
        with:
          name: trump-uf50-001-020-source-acquisition-v2-${{ github.run_id }}
          path: |
            /tmp/uf50_candidate_v2.json
            /tmp/uf50_independent_v2.json
            /tmp/uf50_source_result_v2.json

      - name: Freeze corrected source panel
        env:
          BRANCH: research/trump-uf50-001-020-out-of-family-wl-orbit-falsifier-2026-09-18
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          cp /tmp/uf50_source_result_v2.json research/TRUMP_UF50_001_020_OUT_OF_FAMILY_CORRECTED_SOURCE_ACQUISITION_RESULT_2026-09-18_v1.0.json
          git add research/TRUMP_UF50_001_020_OUT_OF_FAMILY_CORRECTED_SOURCE_ACQUISITION_RESULT_2026-09-18_v1.0.json research/source_data/SATLIB_UF50_*_2026-09-18.cnf
          git commit -m 'TRUMP freeze corrected UF50 001-020 dual-mirror source panel'
          git push origin HEAD:"$BRANCH"
