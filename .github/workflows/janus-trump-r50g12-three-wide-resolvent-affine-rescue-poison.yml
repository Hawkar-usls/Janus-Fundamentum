name: JANUS TRUMP R50G12 Three Wide Resolvent Affine Rescue Poison

on:
  pull_request:
    branches:
      - research/r50g11-width4-xor-cycle-all-existing-doors-counterexample-2026-09-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-three-wide-poison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze R50G12 contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/JANUS_TRUMP_R50G12_THREE_WIDE_RESOLVENT_AFFINE_RESCUE_POISON_PREREGISTRATION_2026-09-05.json'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['positive_parents']==[[1,-101,-102,-103],[1,104,-105,-106]]
          assert d['negative_parents']==[[-1,-107,-108],[-1,-104,-105]]
          assert len(d['expected_unique_nontaut_width5_resolvents'])==3
          assert d['reachability_claim']=='NONE_IN_R50G12'
          PY
      - name: Static no-heuristic authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/janus_trump_r50g12_three_wide_resolvent_affine_rescue_poison.py').read_text()
          for x in ['random.choice(', 'random.shuffle(', 'random.random(', 'sklearn', 'torch', 'tensorflow', 'heuristic_score', 'learned_selector']:
              assert x not in p, x
          PY
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g12_three_wide_resolvent_affine_rescue_poison.py
          PYTHONPATH=.:experiments pytest -q tests/test_janus_trump_r50g12_three_wide_resolvent_affine_rescue_poison.py
      - name: Execute exact three-wide-resolvent attack
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g12_three_wide_resolvent_affine_rescue_poison.py --output artifacts/JANUS_TRUMP_R50G12_RESULT.json
      - name: Validate epistemic boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R50G12_RESULT.json'))
          fw=d['firewall']
          assert fw['REACHABILITY_OF_R50G12_WITNESS']=='NOT_ESTABLISHED'
          assert fw['U_MU']=='OPEN'
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          assert fw['TRUMP_finished'] is False
          if d['construction']['construction_valid_for_target']:
              doors=d['all_existing_doors_audit']
              assert len(doors['variables_checked'])==doors['variable_count']
              assert (d['refined_U_mu_step']['kind']=='OPEN_OBSTRUCTION') == doors['all_existing_doors_blocked']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g12-result
          path: artifacts/JANUS_TRUMP_R50G12_RESULT.json
          if-no-files-found: error
