name: JANUS TRUMP R44BX Binary Affine Transport

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R44BX_NONCONSTANT_BINARY_AFFINE_MODEL_TRANSPORT_2026-09-03.json'
      - 'research/janus_trump_r44bx_verify_binary_affine_transport.py'
      - '.github/workflows/janus-trump-r44bx-binary-affine-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-affine-transport-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay JSON-bound binary-affine transport theorem
        run: python research/janus_trump_r44bx_verify_binary_affine_transport.py
      - name: Enforce theorem boundary
        run: |
          grep -q '"TRUMP_finished": false' research/JANUS_TRUMP_R44BX_NONCONSTANT_BINARY_AFFINE_MODEL_TRANSPORT_2026-09-03.json
          grep -q '"SAT_IN_P": "NOT_PROVED"' research/JANUS_TRUMP_R44BX_NONCONSTANT_BINARY_AFFINE_MODEL_TRANSPORT_2026-09-03.json
          grep -q '"P_VS_NP": "OPEN"' research/JANUS_TRUMP_R44BX_NONCONSTANT_BINARY_AFFINE_MODEL_TRANSPORT_2026-09-03.json
