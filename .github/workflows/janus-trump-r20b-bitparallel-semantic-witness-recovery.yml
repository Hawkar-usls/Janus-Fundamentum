name: JANUS TRUMP R20B Bitparallel Semantic Witness Recovery
on:
  push:
    branches: [research/janus-trump-r20b-bitparallel-semantic-witness-recovery-2026-09-02]
    paths:
      - 'research/JANUS_TRUMP_R20B_BITPARALLEL_SEMANTIC_WITNESS_RECOVERY_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r20b_bitparallel_semantic_witness_recovery.py'
      - '.github/workflows/janus-trump-r20b-bitparallel-semantic-witness-recovery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify recovery freeze and candidate blob
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.load(open('research/JANUS_TRUMP_R20B_BITPARALLEL_SEMANTIC_WITNESS_RECOVERY_PREREGISTRATION_2026-09-02.json'));assert p['status']=='FROZEN_BEFORE_R20B_IMPLEMENTATION_AND_EXECUTION';got=subprocess.check_output(['git','hash-object',p['frozen_candidate']['path']],text=True).strip();assert got==p['frozen_candidate']['blob_sha']=='afa95321ec6edbb33bef222d8ee7234fe631a599';assert p['historical_R19_status'].startswith('OPEN_EXECUTION_RESOURCE_LIMIT');assert p['P_VS_NP']=='OPEN';print('R20B_FREEZE_OK',got)
          PY
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Compile and local controls
        run: |
          PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r20b_bitparallel_semantic_witness_recovery.py
          PYTHONPATH=experiments:. python - <<'PY'
          import janus_trump_r20b_bitparallel_semantic_witness_recovery as r
          assert r.observer_firewall()['pass'] is True
          assert r.tiny_control() is True
          print('R20B_CONTROLS_PASS')
          PY
  worlds:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix: {world: [R19-W05,R19-W07,R19-W08,R19-W10]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Recheck frozen R18 candidate
        run: test "$(git hash-object experiments/janus_trump_r18_shannon_hashcons_interface_dag_discovery.py)" = "afa95321ec6edbb33bef222d8ee7234fe631a599"
      - name: Run candidate then recovered full-domain witnesses
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r20b_bitparallel_semantic_witness_recovery.py --world '${{ matrix.world }}' --output 'artifacts/JANUS_TRUMP_R20B_${{ matrix.world }}_RESULT_2026-09-02.json'
      - name: Supplemental scientific gate
        run: |
          WORLD='${{ matrix.world }}' python - <<'PY'
          import json,os,sys
          w=os.environ['WORLD'];d=json.load(open(f'artifacts/JANUS_TRUMP_R20B_{w}_RESULT_2026-09-02.json'));assert d['P_VS_NP']=='OPEN';assert d['historical_R19_verdict'].startswith('OPEN_EXECUTION_RESOURCE_LIMIT');assert d['candidate_firewall']['pass'] and d['observer_firewall']['pass'] and d['tiny_control'];assert d['verdict'] in {'R20B_SUPPLEMENTAL_FULL_DOMAIN_MATCH','R20B_SUPPLEMENTAL_FULL_DOMAIN_MISMATCH','R20B_OPEN_CANDIDATE_RESOURCE_LIMIT','R20B_OPEN_VERIFIER_RESOURCE_LIMIT','R20B_FAIL_INTEGRITY'}
          if d['verdict']=='R20B_SUPPLEMENTAL_FULL_DOMAIN_MATCH':assert d['comparison']['full_domain'] and d['comparison']['allowed_set_equal'] and d['comparison']['false_positive_count']==d['comparison']['false_negative_count']==0 and d['scientific_firewall']['historical_R19_score_unchanged']
          elif d['verdict']=='R20B_SUPPLEMENTAL_FULL_DOMAIN_MISMATCH':assert not d['comparison']['allowed_set_equal']
          elif d['verdict']=='R20B_FAIL_INTEGRITY':sys.exit(2)
          print(w,d['verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-trump-r20b-${{ matrix.world }}
          path: artifacts/JANUS_TRUMP_R20B_${{ matrix.world }}_RESULT_2026-09-02.json
          if-no-files-found: error
