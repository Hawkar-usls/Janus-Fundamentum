name: run-c025-adversarial-delta-pair-dispersion

on:
  push:
    branches:
      - research/c025-phase5-10-adversarial-delta-2026-08-28
    paths:
      - 'research/C025_ADVERSARIAL_DELTA_PAIR_DISPERSION_ATTACK_SPEC_2026-08-28.json'
      - 'experiments/theorem_extraction/c025_adversarial_delta_pair_dispersion_attack.py'
      - '.github/workflows/run-c025-adversarial-delta-pair-dispersion.yml'
  workflow_dispatch:

jobs:
  adversarial-delta-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen adversarial objective
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/C025_ADVERSARIAL_DELTA_PAIR_DISPERSION_ATTACK_SPEC_2026-08-28.json').read_text())
          assert d['status']=='FROZEN_FALSIFICATION_OBJECTIVE__NOT_PROOF'
          assert d['primary_objective']['success_gate']=='DELTA > 0'
          assert d['secondary_objective']['success_gate']=='PAIR_RESCUE_MARGIN < 0'
          assert d['search_contract']['fixed_chassis'] is True
          assert d['scientific_boundary']['final_witness_requires_exact_frozen_core_reachability'] is True
          assert d['P_VS_NP']=='OPEN'
          print('ADVERSARIAL_OBJECTIVE=FROZEN')
          print('P_VS_NP=OPEN')
          PY

      - name: Run JUXTAPOSE adversarial delta search
        shell: bash
        run: |
          set -o pipefail
          python experiments/theorem_extraction/c025_adversarial_delta_pair_dispersion_attack.py \
            --population 18 --generations 30 --seed 26082801 \
            | tee c025-adversarial-delta-pair-dispersion.json

      - name: Enforce fail-closed interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c025-adversarial-delta-pair-dispersion.json').read_text())
          b=d['scientific_boundary']
          assert d['search']['factorized_exact_semantics_selftest']=='PASS'
          assert b['search_score_is_not_proof'] is True
          assert b['factorized_direct_product_is_candidate_generation_only'] is True
          assert b['final_refutation_requires_frozen_core_reachability'] is True
          assert b['absence_of_counterexample_is_not_proof'] is True
          assert b['same_run_theorem_promotion'] is False
          assert b['models_or_heuristics_have_theorem_authority'] is False
          assert b['P2_REACHABLE_PRESERVATION']=='OPEN'
          assert b['P_VS_NP']=='OPEN'
          e=d['best_candidate']['evaluation']
          print('STATUS='+d['status'])
          print('DELTA='+str(e['delta']))
          print('MIN_RAW='+str(e['min_raw_units']))
          print('CAP='+str(e['cap']))
          print('PAIR_MARGIN='+str(e['pair_rescue_margin']))
          print('PAIR_DENSITY_MARGIN='+str(e['pair_density_margin']))
          print('ALL_PIVOT_OVERFLOW='+str(e['all_pivot_overflow']))
          print('PAIR_DISPERSED='+str(e['pair_dispersed']))
          print('L1='+d['candidate_results']['L1_ROOT_PHASE_POLYNOMIAL_GRAMMAR_TOTALITY'])
          print('L1A='+d['candidate_results']['L1A_ALL_PIVOT_OVERFLOW_FORCES_FREQUENT_PAIR'])
          print('L1B='+d['candidate_results']['L1B_ALL_PIVOT_OVERFLOW_FORCES_PAIR_DENSITY'])
          r=d.get('exact_reachability_replay')
          if r is not None:
              print('TARGET_REACHED='+str(r['selector_reaches_target']))
              print('V2_RESCUE='+str(r['v2_rescue_exists']))
          print('P_VS_NP=OPEN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c025-adversarial-delta-pair-dispersion
          path: c025-adversarial-delta-pair-dispersion.json
