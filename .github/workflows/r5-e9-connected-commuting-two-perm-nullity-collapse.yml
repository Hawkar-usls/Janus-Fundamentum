name: R5 E9 Connected Commuting Two-Perm Nullity Collapse

on:
  pull_request:
    paths:
      - 'research/R5_E9_CONNECTED_COMMUTING_TWO_PERM_NULLITY_COLLAPSE_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_connected_commuting_two_perm_nullity_collapse.py'
      - '.github/workflows/r5-e9-connected-commuting-two-perm-nullity-collapse.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact commuting-nullity regression
        run: python experiments/r5_e9_connected_commuting_two_perm_nullity_collapse.py
