name: TRUMP E8 P0 Hall-rank false positive

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P0_HALL_RANK_CRITERION_FALSE_POSITIVE_2026-09-30_v2.9.json'
      - 'research/tools/e8_p0_hall_rank_false_positive/checker.py'
      - '.github/workflows/trump-e8-p0-hall-rank-false-positive.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact P0 Hall-rank false-positive regression
        run: python research/tools/e8_p0_hall_rank_false_positive/checker.py
