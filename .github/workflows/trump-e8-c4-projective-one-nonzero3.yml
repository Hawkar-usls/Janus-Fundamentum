name: TRUMP E8 C4 Projective One-Nonzero3

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_PROJECTIVE_ONE_NONZERO3_NORMAL_FORM_2026-09-30_v5.4.json'
      - 'research/tools/e8_c4_projective_one_nonzero3/checker.py'
      - '.github/workflows/trump-e8-c4-projective-one-nonzero3.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact C4 projective normal-form regression
        run: python research/tools/e8_c4_projective_one_nonzero3/checker.py
