name: JANUS TRUMP R50G21 RUP6 Descended W5 Cannot Survive

on:
  pull_request:
    paths:
      - 'experiments/janus_trump_r50g21_rup6_descended_w5_cannot_survive.py'
      - 'tests/test_janus_trump_r50g21_rup6_descended_w5_cannot_survive.py'
      - 'research/JANUS_TRUMP_R50G21_RUP6_DESCENDED_W5_CANNOT_SURVIVE_PREREGISTRATION_2026-09-05.json'
      - 'research/JANUS_TRUMP_R50G21_RUP6_DESCENDED_W5_CANNOT_SURVIVE_PROOF_NOTE_2026-09-05.md'
      - '.github/workflows/janus-trump-r50g21-rup6-descended-w5-cannot-survive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-or-counterexample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze R50G21 contract
        run: |
          python - <<'PY'
          import json
          p='research/JANUS_TRUMP_R50G21_RUP6_DESCENDED_W5_CANNOT_SURVIVE_PREREGISTRATION_2026-09-05.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['proof_or_counterexample'] is True
          assert d['execution']['source_definition_proof'] is True
          assert d['execution']['finite_controls_are_not_the_universal_proof'] is True
          assert d['firewall']['RUP6_DESCENDED_W5_ELIMINATED_BEFORE_EXECUTION'] is False
          assert d['firewall']['RUP_BEARING_V7_HUB_CYCLE_ELIMINATED'] is False
          assert d['firewall']['ALL_DIRECT5_V7_HUB_CYCLE_ELIMINATED'] is False
          PY

      - name: Static no-heuristic authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/janus_trump_r50g21_rup6_descended_w5_cannot_survive.py').read_text()
          for x in ['random.choice(', 'random.shuffle(', 'random.random(', 'sklearn', 'torch', 'tensorflow', 'heuristic_score', 'learned_selector']:
              assert x not in p, x
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g21_rup6_descended_w5_cannot_survive.py
          PYTHONPATH=.:experiments pytest -q tests/test_janus_trump_r50g21_rup6_descended_w5_cannot_survive.py

      - name: Execute source dichotomy and exact controls
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g21_rup6_descended_w5_cannot_survive.py \
            --output artifacts/JANUS_TRUMP_R50G21_RESULT.json

      - name: Validate epistemic boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R50G21_RESULT.json'))
          fw=d['firewall']
          assert fw['FINITE_CONTROLS_ARE_THE_UNIVERSAL_PROOF'] is False
          assert fw['RUP6_DESCENDED_NOVEL_W5_SURVIVOR']=='ELIMINATED_BY_SOURCE_DICHOTOMY'
          assert fw['RUP6_DROP_HUB_SURVIVING_V7_EDGE_ELIMINATED'] is True
          assert fw['RUP_BEARING_V7_HUB_CYCLE_ELIMINATED'] is True
          assert fw['V7_SURVIVING_HUB_CYCLE_CLASS']=='ALL_DIRECT5_ONLY'
          assert fw['ALL_DIRECT5_V7_HUB_CYCLE_ELIMINATED'] is False
          assert fw['V7_IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['U_MU']=='OPEN'
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          assert fw['TRUMP_finished'] is False
          assert d['r50g18_proper_support_control']['child_one_literal_deletion_rup_valid'] is True
          assert d['opposite_full_twin_dual_support_control']['independent_UP_replay'] is True
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g21-result
          path: artifacts/JANUS_TRUMP_R50G21_RESULT.json
          if-no-files-found: error
