name: R5 E9 Projective F2^4 five-line spread UNSAT terminal

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_PROJECTIVE_F2_4_FIVE_LINE_SPREAD_UNSAT_TERMINAL_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_projective_f2_4_five_line_spread_unsat_terminal.py'
      - '.github/workflows/r5-e9-projective-f2-4-five-line-spread-unsat-terminal.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_projective_f2_4_five_line_spread_unsat_terminal.py
      - name: Replay exact spread controls
        run: python experiments/r5_e9_projective_f2_4_five_line_spread_unsat_terminal.py
