name: TRUMP Bucket Unique-Core Residual Pair Separator
on:
  push:
    branches: [research/trump-bucket-unique-core-residual-pair-separator-2026-09-15]
    paths:
      - 'research/TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_TWO_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bucket_residual_pair_separator/**'
      - '.github/workflows/trump-bucket-unique-core-residual-pair-separator.yml'
  workflow_dispatch:
jobs:
  pair-separator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run independent pair-separator checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_residual_pair_separator.independent_checker | tee /tmp/result.json
      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/result.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_TWO_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['scientific_firewall']['P_VS_NP']=='OPEN'
          assert z['scientific_firewall']['GENERAL_SAT_IN_P']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls']},sort_keys=True))
          PY
      - name: v3.8 single-separator regression
        run: python -m research.tools.apma_bucket_residual_single_separator.independent_checker
      - name: v3.6 residual <=2 regression
        run: python -m research.tools.apma_bucket_residual_le2.independent_checker
      - name: v3.5 conditioned payload regression
        run: python -m research.tools.apma_bucket_conditioned_factorized_payload.independent_checker_v1_2
      - name: Guarded elimination regression
        run: python -m research.tools.apma_guarded_elimination.independent_checker
      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier
      - name: Authority notice
        run: |
          echo 'PAIR_DISCOVERY=O(V^2)'
          echo 'PAIR_BRANCH_ASSIGNMENTS=4'
          echo 'SEPARATOR_SETS_SIZE_GE3=0'
          echo 'THREE_PLUS_JOIN_CHAIN=0'
          echo 'GLOBAL_RESIDUAL_CARTESIAN_PRODUCT=0'
          echo 'P_VS_NP=OPEN'
