    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_holant_all_local_gl2_matchgate_nogo.py'
      - '.github/workflows/r5-holant-edge-local-matchgate-nogo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gauge:
    name: 'All edge-local GL2 matchgate parity no-go with original source audit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
