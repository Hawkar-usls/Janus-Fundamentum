name: TRUMP E8 noncommutative solution-polynomial ABP rank

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_NONCOMMUTATIVE_SOLUTION_POLYNOMIAL_ABP_RANK_BARRIER_2026-09-26_v0.5.json'
      - 'research/tools/e8_noncommutative_solution_abp_rank/checker.py'
      - '.github/workflows/trump-e8-noncommutative-solution-abp-rank.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_noncommutative_solution_abp_rank/checker.py
