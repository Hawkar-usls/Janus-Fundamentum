name: JANUS TIME-SAT-004B independent P-center original CNF DRUP
on:
  push:
    branches: [research/time-sat-004b-bounded-pilot-20261101]
    paths:
      - .github/workflows/verify-time-sat-004b-pcenter.yml
permissions:
  contents: read
concurrency:
  group: time-sat-004b-pcenter-original-proof
  cancel-in-progress: true
jobs:
  source-bound-proof-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact PySAT versions
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Fetch pinned real GBD P-center CNF; generate and independently replay DRUP
        run: python experiments/time_sat_004_external/pcenter_proof.py
      - name: Keep original CNF, original compressed bytes and original proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004b-pcenter-original-drup
          path: evidence/time_sat_004b_pcenter
          retention-days: 30
          if-no-files-found: warn
