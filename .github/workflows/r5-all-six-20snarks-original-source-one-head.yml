name: R5 All Published Twenty Snarks and Native GF3 One HEAD
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_forbes_six_20_snarks_claw_exactone.py'
      - 'experiments/r5_universal_j5_20vertex_snark_star_deletion_sixpole.py'
      - 'research/R5_ALL_SIX_20_SNARKS_INDUCED_CLAWS_EXACTONE_AUDIT_2026-10-13.md'
      - '.github/workflows/r5-all-six-20snarks-original-source-one-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native:
    name: Forbes S1-S6 source-level uncolourability, 1800 physical interfaces and PC decoder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent J5 source construction, complete 20 claws and 300 ports
        run: python -u experiments/r5_universal_j5_20vertex_snark_star_deletion_sixpole.py
      - name: Six Forbes 20-vertex sources, 120 claws, 1800 full physical pair relations
        run: python -u experiments/r5_universal_forbes_six_20_snarks_claw_exactone.py
      - name: GF3 original SCL Boolean equality decoder in degree4
        run: python -u experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py
