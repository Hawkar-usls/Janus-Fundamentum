name: R5 Open Exact-One Sixpole Abstract Kempe Closure Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_open_sixpole_kempe_necessary_closure.py'
      - '.github/workflows/r5-exposed-sixpole-abstract-kempe-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kempe:
    name: Exhaust all 108 physical onehot states and 324 necessary Kempe pair closures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit every full boundary state under all independently switchable Kempe-path pairings
        run: python -u experiments/r5_universal_open_sixpole_kempe_necessary_closure.py
