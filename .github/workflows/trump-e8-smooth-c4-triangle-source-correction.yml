name: TRUMP E8 Smooth C4 Triangle Source Correction

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TRIANGLE_SOURCE_CORRECTION_2026-09-30_v7.6.1.json'
      - 'research/tools/e8_smooth_c4_triangle_source_correction/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-triangle-source-correction.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TRIANGLE_SOURCE_CORRECTION_2026-09-30_v7.6.1.json'
      - 'research/tools/e8_smooth_c4_triangle_source_correction/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-triangle-source-correction.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay smooth-C4 source correction and triangle classification
        run: python research/tools/e8_smooth_c4_triangle_source_correction/checker.py
