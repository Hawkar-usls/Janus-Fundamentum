name: R5 E9 EQ3 Regularizer Linear Nullity UNSAT

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_EQ3_REGULARIZER_LINEAR_GF2_NULLITY_UNSAT_FAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_eq3_regularizer_linear_nullity_unsat_family.py'
      - '.github/workflows/r5-e9-eq3-regularizer-linear-nullity-unsat.yml'
  pull_request:
    paths:
      - 'research/R5_E9_EQ3_REGULARIZER_LINEAR_GF2_NULLITY_UNSAT_FAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_eq3_regularizer_linear_nullity_unsat_family.py'
      - '.github/workflows/r5-e9-eq3-regularizer-linear-nullity-unsat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EQ3 gauge-nullity UNSAT family controls
        run: python experiments/r5_e9_eq3_regularizer_linear_nullity_unsat_family.py
