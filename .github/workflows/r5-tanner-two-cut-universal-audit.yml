name: R5 Universal Tanner Two-Cut and Three-Connectivity Audit
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_connected_scl_tanner_two_cut_proof_audit.py'
      - '.github/workflows/r5-tanner-two-cut-universal-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tanner-topology:
    name: 'Original Tanner graph no bridges and balanced 2-edge cuts'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all-source cut identities on Heawood and connected 2-swap SCL
        run: python -u experiments/r5_universal_connected_scl_tanner_two_cut_proof_audit.py
