name: JANUS TIME-SAT-004D9A offline independent custodian kit test
on:
  push:
    branches: [research/time-sat-004d9a-custodian-offline-kit-20261102]
    paths:
      - experiments/time_sat_004_external/external_custodian_offline_004d9a.py
      - tests/test_time_sat_004d9a_offline_custodian.py
      - .github/workflows/validate-time-sat-004d9a-offline-custodian.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d9a-offline-fixtures-only
  cancel-in-progress: true
jobs:
  independent-custodian-protocol-fixtures:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ed25519 verification dependency
        run: python -m pip install 'cryptography==46.0.3'
      - name: Prove 004D9A OFFLINE ephemeral signing interoperability, forged model/signature rejection
        run: python -m unittest discover -s tests -p 'test_time_sat_004d9a_offline_custodian.py' -v
      - name: Preserve original 004D9 intake adversarial tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d9_external_intake.py' -v
      - name: Preserve original verified SAT model first gate tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d8_sat_gate.py' -v
      - name: Production C023 existing serialized verifier remains valid
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Original D9 policy remains WAITING, zero real sources and admin keys
        run: |
          python experiments/direct/janus_time_sat_004d9_external_intake.py --preflight --out evidence/004d9a/preflight.json
          python - <<'PY'
          import json
          a=json.load(open('evidence/004d9a/preflight.json'))
          assert a['status']=='WAITING_FOR_EXTERNAL_WITNESS'
          assert a['actual_external_SAT_cases_admitted']==0
          assert a['admin_independence']=='NOT_ESTABLISHED'
          assert a['rank_experiment']=='NOT_RUN'
          print('004D9A_OFFLINE_FIXTURES_ONLY_WAITING_EXTERNAL_DATA_PASS')
          PY
      - name: Retain explicit zero-live-data preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d9a-${{ matrix.runner }}
          path: evidence/004d9a/preflight.json
          if-no-files-found: warn
          retention-days: 30
