name: TRUMP E8 Smooth C4 Four-Component Open Twisted Orbit Wire

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_FOURCOMPONENT_OPEN_TWISTED_ORBIT_WIRE_2026-09-30_v7.7.json'
      - 'research/tools/e8_smooth_c4_fourcomponent_open_twisted_wire/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-fourcomponent-open-twisted-wire.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_FOURCOMPONENT_OPEN_TWISTED_ORBIT_WIRE_2026-09-30_v7.7.json'
      - 'research/tools/e8_smooth_c4_fourcomponent_open_twisted_wire/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-fourcomponent-open-twisted-wire.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust four-C4 open twisted-orbit source classification
        run: python research/tools/e8_smooth_c4_fourcomponent_open_twisted_wire/checker.py
