name: TRUMP E8 Alon-Tarsi Central Incomplete Hamiltonian

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_ALON_TARSI_CENTRAL_COEFFICIENT_INCOMPLETE_HAMILTONIAN_CONTROL_2026-09-30_v5.7.json'
      - 'research/tools/e8_alon_tarsi_central_incomplete_hamiltonian/checker.py'
      - '.github/workflows/trump-e8-alon-tarsi-central-incomplete-hamiltonian.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact central-coefficient incompleteness regression
        run: python research/tools/e8_alon_tarsi_central_incomplete_hamiltonian/checker.py
