name: R5 E9 Linear Cubic EQ3 Regularization

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact EQ3 regularizer
        run: python experiments/r5_e9_linear_cubic_eq3_regularization.py
