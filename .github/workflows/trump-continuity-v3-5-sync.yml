name: TRUMP One-Shot v3.5 Continuity Sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trump-continuity-v3-5-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap and manifest without truncating history
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('START_HERE_TRUMP_CONTEXT.md')
          s=p.read_text(encoding='utf-8')
          old_start="""1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json` **first**. This is the latest successor-state anchor and seals the scoped common-core support-intersection / semijoin prefilter PASS, preserving the v1 first failure and v1.1 repair lineage.
2. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.3.json` for Captain Obvious first-overbudget-bucket forensic evidence: raw product `557256278016`, shared 20-variable core, and exact compatibility collapse `3 -> 3 -> 1 -> 0`.
3. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json` for the scoped guarded bounded-output elimination PASS and frozen `L^2` pre-expansion resource envelope."""
          new_start="""1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json` **first**. This is the latest successor-state anchor and seals the scoped unique-common-core conditioned factorized-payload PASS, preserving both v1 and v1.1 failed negative-control lineages plus the v1.2 scope-audit repair.
2. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json` for the common-core support-intersection / semijoin prefilter PASS and its sticky `4^20` residual-payload blocker.
3. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.3.json` for Captain Obvious first-overbudget-bucket forensic evidence: raw product `557256278016`, shared 20-variable core, and exact compatibility collapse `3 -> 3 -> 1 -> 0`.
4. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json` for the scoped guarded bounded-output elimination PASS and frozen `L^2` pre-expansion resource envelope."""
          if old_start not in s:
              raise SystemExit('STARTUP_BLOCK_NOT_FOUND')
          s=s.replace(old_start,new_start,1)
          for old,new in [("4. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.1.json`","5. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.1.json`"),
                          ("5. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.0.json`","6. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.0.json`"),
                          ("6. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.9.json`","7. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.9.json`"),
                          ("7. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.8.json`","8. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.8.json`"),
                          ("8. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.7.json`","9. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.7.json`"),
                          ("9. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.6.json`","10. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.6.json`"),
                          ("10. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.5.json`","11. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.5.json`"),
                          ("11. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.4.json`","12. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.4.json`"),
                          ("12. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.3.json`","13. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.3.json`"),
                          ("13. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.2.json`","14. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.2.json`"),
                          ("14. Read `registry/TRUMP_CURRENT_STATE_2026-09-15.json`","15. Read `registry/TRUMP_CURRENT_STATE_2026-09-15.json`"),
                          ("15. Read historical parent","16. Read historical parent"),
                          ("16. Read `docs/TRUMP_DEVELOPMENT_JOURNAL.md`","17. Read `docs/TRUMP_DEVELOPMENT_JOURNAL.md`"),
                          ("17. Read `registry/TRUMP_CONTEXT_MANIFEST.json`","18. Read `registry/TRUMP_CONTEXT_MANIFEST.json`"),
                          ("18. Search repository history/default-branch code","19. Search repository history/default-branch code"),
                          ("19. Recover indexed external sources when named.","20. Recover indexed external sources when named."),
                          ("20. Build a `CONTEXT_RECOVERY_RECEIPT`","21. Build a `CONTEXT_RECOVERY_RECEIPT`"),
                          ("21. Only then may Captain/Akinator/JUXTAPOSE/TRUMP","22. Only then may Captain/Akinator/JUXTAPOSE/TRUMP")]:
              s=s.replace(old,new,1)
          s=s.replace('Ten downward scoped subproblems are now closed','Eleven downward scoped subproblems are now closed',1)
          marker="""10. **target-component first private overbudget bucket with an exact raw common core**: compute `C = intersection scope(F_i)` and `S = intersection pi_C(F_i)` before materialization. Empty `S` is exact UNSAT; otherwise semijoin-filter original rows by `S`, preserving every non-core coordinate, then reapply the unchanged v3.2 `L^2` guard. v1 first-failure and control-diagnostic history are preserved; v1.1 seals `PASS_SCOPED_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1_1`.
"""
          addition=marker+"""11. **unique exact common-core state with pairwise-disjoint conditioned residual scopes**: condition on the unique `s in S`, derive each factor-local boundary relation independently, retain original-row reconstruction provenance, and store the target boundary as an additive portfolio rather than the `4^20` payload Cartesian product. v1 and v1.1 raw incomplete-coverage control failures are preserved; v1.2 separates theorem scope from a unit-only forged READY-receipt fail-closed guard and seals `PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2`.
"""
          if marker not in s:
              raise SystemExit('MECHANISM_MARKER_NOT_FOUND')
          s=s.replace(marker,addition,1)
          s=s.replace('Do **not** repeat the ten closed mechanisms','Do **not** repeat the eleven closed mechanisms',1)
          old_surface="""Current scoped open surface:

`PREDECESSOR_OPEN_OVERBUDGET_BUCKET_AFTER_EXACT_COMMON_CORE_SEMIJOIN_WITH_NONEMPTY_SUPPORT_AND_FILTERED_PRODUCT_GREATER_THAN_L2_AND_NO_OTHER_SEALED_STRUCTURE`.

The next preferred gate is:

`TRUMP_BICAMERAL_BUCKET_PARTIAL_OVERLAP_FACTOR_OR_CONGRUENCE_FALSIFIER_GATE`.

Captain Obvious' current directive is: **stop multiplying factor-local payloads**. The common-core consistency problem is closed for the scoped v3.4 door. The next unresolved bucket has a nonempty exact common support, but even after semijoin filtering its explicit row product remains above the frozen `L^2` envelope. Search for an exact factorized payload portfolio, bounded-width partial-overlap carrier, finite exact congruence with polynomially many reachable classes, provenance-preserving reverse morph/few-alien escape, or another preregistered pre-materialization representation. Preserve all externally observable payload variables and exact witness reconstruction.

Forbidden shortcuts include raising `L^2`, enumerating the filtered Cartesian product and compressing afterward, dropping non-core payload variables, searching exponentially many orders, treating the sticky OPEN control as negative evidence, or claiming general bucket compression."""
          new_surface="""Current scoped open surface:

`UNIQUE_COMMON_CORE_STICKY_BUCKET_WITH_RESIDUAL_CROSS_COUPLING_OR_MULTIPLE_COMMON_CORE_STATES`.

Captain's nearest blocker is `OPEN_RESIDUAL_CROSS_COUPLING`; `OPEN_NONUNIQUE_COMMON_CORE_SUPPORT` remains a separate secondary blocker.

The next preferred gate is:

`TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_COMPONENT_LE2_FACTORIZED_PAYLOAD_FALSIFIER_GATE`.

Captain Obvious' current directive is: **keep the unique common-core state fixed and componentize only the conditioned residual dependency graph**. Reuse the earlier exact two-relation one-join carrier for residual connected components of size exactly two; singleton components remain direct. Store the resulting component boundary carriers additively. Any conditioned residual component with three or more relations returns `OPEN` without an unbounded join. This is a successor repair / conditional reuse of the old two-relation theorem, not a new generic factorization claim.

Forbidden shortcuts include joining three or more residual factors, enumerating the global residual Cartesian product, raising `L^2`, dropping reconstruction provenance, treating multiple common-core states as already solved, or claiming general conditioned factorization."""
          if old_surface not in s:
              raise SystemExit('OPEN_SURFACE_BLOCK_NOT_FOUND')
          s=s.replace(old_surface,new_surface,1)
          p.write_text(s,encoding='utf-8')

          mp=Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['latest_successor_state']='registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json'
          m['current_scoped_open_surface']={
              'name':'UNIQUE_COMMON_CORE_STICKY_BUCKET_WITH_RESIDUAL_CROSS_COUPLING_OR_MULTIPLE_COMMON_CORE_STATES',
              'nearest_blocker':'OPEN_RESIDUAL_CROSS_COUPLING',
              'secondary_blocker':'OPEN_NONUNIQUE_COMMON_CORE_SUPPORT',
              'next_gate_candidate':'TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_COMPONENT_LE2_FACTORIZED_PAYLOAD_FALSIFIER_GATE',
              'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json'
          }
          mech=m.setdefault('mechanisms',{})
          mech['UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2']={
              'aliases':['conditioned factorized payload','unique-core payload portfolio','conditional factorized feedback'],
              'authority':'PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2',
              'state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json',
              'theorem_seal':'research/TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2_THEOREM_SEAL_2026-09-15.json',
              'anti_loop_classification':'SUCCESSOR_REPAIR__CONDITIONALIZATION_OF_EXISTING_FACTORIZED_FEEDBACK_PORTFOLIO_AFTER_COMMON_CORE_SEMIJOIN'
          }
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY
      - name: Commit continuity sync and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/trump-continuity-v3-5-sync.yml
          git add START_HERE_TRUMP_CONTEXT.md registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/trump-continuity-v3-5-sync.yml
          git commit -m 'TRUMP sync v3.5 bootstrap and manifest'
          git push origin HEAD:main
