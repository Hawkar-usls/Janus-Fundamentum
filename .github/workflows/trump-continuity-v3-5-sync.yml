name: TRUMP One-Shot v3.5 Continuity Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trump-continuity-v3-5-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bootstrap and manifest without truncating history
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('START_HERE_TRUMP_CONTEXT.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = lines.index('## Startup sequence')
          anti = lines.index('## Anti-loop test')
          old_idx = next(i for i in range(start, anti) if 'TRUMP_CURRENT_STATE_2026-09-15_v3.4.json' in lines[i])
          lines[old_idx:old_idx+1] = [
              '1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json` **first**. This is the latest successor-state anchor and seals the scoped unique-common-core conditioned factorized-payload PASS, preserving both v1 and v1.1 failed negative-control lineages plus the v1.2 scope-audit repair.',
              '2. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json` for the common-core support-intersection / semijoin prefilter PASS and its sticky `4^20` residual-payload blocker.'
          ]
          anti = lines.index('## Anti-loop test')
          n = 1
          for i in range(start + 1, anti):
              if re.match(r'^\d+\. ', lines[i]):
                  lines[i] = re.sub(r'^\d+\. ', f'{n}. ', lines[i], count=1)
                  n += 1
          for i,x in enumerate(lines):
              if x == 'Ten downward scoped subproblems are now closed for explicit Boolean raw relation semantics:':
                  lines[i] = 'Eleven downward scoped subproblems are now closed for explicit Boolean raw relation semantics:'
                  break
          item10 = next(i for i,x in enumerate(lines) if x.startswith('10. **target-component first private overbudget bucket'))
          item11 = '11. **unique exact common-core state with pairwise-disjoint conditioned residual scopes**: condition on the unique `s in S`, derive each factor-local boundary relation independently, retain original-row reconstruction provenance, and store the target boundary as an additive portfolio rather than the `4^20` payload Cartesian product. v1 and v1.1 raw incomplete-coverage control failures are preserved; v1.2 separates theorem scope from a unit-only forged READY-receipt fail-closed guard and seals `PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2`.'
          if item11 not in lines:
              lines.insert(item10 + 1, item11)
          lines = [x.replace('Do **not** repeat the ten closed mechanisms','Do **not** repeat the eleven closed mechanisms') for x in lines]
          surface = lines.index('Current scoped open surface:')
          context = lines.index('## Context sources')
          new_surface = [
              'Current scoped open surface:',
              '',
              '`UNIQUE_COMMON_CORE_STICKY_BUCKET_WITH_RESIDUAL_CROSS_COUPLING_OR_MULTIPLE_COMMON_CORE_STATES`.',
              '',
              "Captain's nearest blocker is `OPEN_RESIDUAL_CROSS_COUPLING`; `OPEN_NONUNIQUE_COMMON_CORE_SUPPORT` remains a separate secondary blocker.",
              '',
              'The next preferred gate is:',
              '',
              '`TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_COMPONENT_LE2_FACTORIZED_PAYLOAD_FALSIFIER_GATE`.',
              '',
              "Captain Obvious' current directive is: **keep the unique common-core state fixed and componentize only the conditioned residual dependency graph**. Reuse the earlier exact two-relation one-join carrier for residual connected components of size exactly two; singleton components remain direct. Store the resulting component boundary carriers additively. Any conditioned residual component with three or more relations returns `OPEN` without an unbounded join. This is a successor repair / conditional reuse of the old two-relation theorem, not a new generic factorization claim.",
              '',
              'Forbidden shortcuts include joining three or more residual factors, enumerating the global residual Cartesian product, raising `L^2`, dropping reconstruction provenance, treating multiple common-core states as already solved, or claiming general conditioned factorization.',
              ''
          ]
          lines[surface:context] = new_surface
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          mp = Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          m = json.loads(mp.read_text(encoding='utf-8'))
          m['latest_successor_state'] = 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json'
          m['current_scoped_open_surface'] = {
              'name':'UNIQUE_COMMON_CORE_STICKY_BUCKET_WITH_RESIDUAL_CROSS_COUPLING_OR_MULTIPLE_COMMON_CORE_STATES',
              'nearest_blocker':'OPEN_RESIDUAL_CROSS_COUPLING',
              'secondary_blocker':'OPEN_NONUNIQUE_COMMON_CORE_SUPPORT',
              'next_gate_candidate':'TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_COMPONENT_LE2_FACTORIZED_PAYLOAD_FALSIFIER_GATE',
              'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json'
          }
          m.setdefault('mechanisms',{})['UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2'] = {
              'aliases':['conditioned factorized payload','unique-core payload portfolio','conditional factorized feedback'],
              'authority':'PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2',
              'state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.5.json',
              'theorem_seal':'research/TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_CONDITIONED_FACTORIZED_PAYLOAD_V1_2_THEOREM_SEAL_2026-09-15.json',
              'anti_loop_classification':'SUCCESSOR_REPAIR__CONDITIONALIZATION_OF_EXISTING_FACTORIZED_FEEDBACK_PORTFOLIO_AFTER_COMMON_CORE_SEMIJOIN'
          }
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit continuity sync and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/trump-continuity-v3-5-sync.yml
          git add START_HERE_TRUMP_CONTEXT.md registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/trump-continuity-v3-5-sync.yml
          git commit -m 'TRUMP sync v3.5 bootstrap and manifest'
          git push origin HEAD:main
