name: R5 Frontier Verification

on:
  push:
    branches: [main]
    paths:
      - 'experiments/r5_e17_hardness_kernel_quotient.py'
      - 'experiments/r5_e53_e12_boolean_boundary_quotient.py'
      - 'experiments/r5_e61_two_level_kernel_hoffman_regular_set.py'
      - 'experiments/r5_e62_hypergraph_balanced_odd_cycle_frontier.py'
      - 'experiments/r5_e63_e12_nonaffine_c5_packing_raw_parameter_firewall.py'
      - 'experiments/r5_e64_connected_postquotient_nullity_firewall.py'
      - 'experiments/r5_e65_transpose_asymmetry_quantized_defect.py'
      - 'experiments/r5_e66_optimal_layer_exchange_mobility_firewall.py'
      - 'experiments/r5_e67_dual_moment_delsarte_hierarchy.py'
      - 'experiments/r5_e68_log_level_sdp_tower_firewall.py'
      - 'experiments/r5_e69_nullity_structure_torus_firewall.py'
      - 'experiments/r5_e70_dual_rank_nullity_exact_envelope.py'
      - 'experiments/r5_e71_ternary_prime_rank_nullity_envelope.py'
      - 'experiments/r5_e72_e12_multifield_rank_middle_band_firewall.py'
      - 'experiments/r5_e73_top_shell_crt_ldpc_general_factor_firewall.py'
      - 'experiments/r5_e74_local_delta_matroid_exterior_barrier.py'
      - 'experiments/r5_e75_c4free_cluster_delta_barrier.py'
      - 'experiments/r5_e76_first_nontrivial_delta_cluster_witness.py'
      - 'experiments/r5_e77_source_aligned_delta_composition_frontier.py'
      - 'experiments/r5_e78_linear_delta_equality_gluing_meta_solver.py'
      - 'experiments/r5_e79_binary_reconstruction_matchgate_firewall.py'
      - 'experiments/r5_e80_q10_binary_delta_universality_attack.py'
      - 'research/R5_E17_*'
      - 'research/R5_E53_*'
      - 'research/R5_E61_*'
      - 'research/R5_E62_*'
      - 'research/R5_E63_*'
      - 'research/R5_E64_*'
      - 'research/R5_E65_*'
      - 'research/R5_E66_*'
      - 'research/R5_E67_*'
      - 'research/R5_E68_*'
      - 'research/R5_E69_*'
      - 'research/R5_E70_*'
      - 'research/R5_E71_*'
      - 'research/R5_E72_*'
      - 'research/R5_E73_*'
      - 'research/R5_E74_*'
      - 'research/R5_E75_*'
      - 'research/R5_E76_*'
      - 'research/R5_E77_*'
      - 'research/R5_E78_*'
      - 'research/R5_E79_*'
      - 'research/R5_E80_*'
      - '.github/workflows/r5-frontier-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Replay E17 E53 E61 E62 E63 E64 E65 E66 E67 E68 E69 E70 E71 E72 E73 E74 E75 E76 E77 E78 E79 E80
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: E17 kernel quotient
        run: python experiments/r5_e17_hardness_kernel_quotient.py

      - name: E53 Boolean boundary quotient
        run: python experiments/r5_e53_e12_boolean_boundary_quotient.py

      - name: E61 two-level kernel and Hoffman set
        run: python experiments/r5_e61_two_level_kernel_hoffman_regular_set.py

      - name: E62 balanced hypergraph odd-cycle frontier
        run: python experiments/r5_e62_hypergraph_balanced_odd_cycle_frontier.py

      - name: E63 non-affine C5 packing firewall
        run: python experiments/r5_e63_e12_nonaffine_c5_packing_raw_parameter_firewall.py

      - name: E64 connected post-quotient nullity firewall
        run: python experiments/r5_e64_connected_postquotient_nullity_firewall.py

      - name: E65 transpose asymmetry and quantized defect
        run: python experiments/r5_e65_transpose_asymmetry_quantized_defect.py

      - name: E66 optimal-layer exchange mobility firewall
        run: python experiments/r5_e66_optimal_layer_exchange_mobility_firewall.py

      - name: E67 dual-moment Delsarte hierarchy
        run: python experiments/r5_e67_dual_moment_delsarte_hierarchy.py

      - name: E68 log-level and SDP lift-tower firewall
        run: python experiments/r5_e68_log_level_sdp_tower_firewall.py

      - name: E69 nullity/torus structural firewall
        run: python experiments/r5_e69_nullity_structure_torus_firewall.py

      - name: E70 dual binary-rank/nullity exact envelope
        run: python experiments/r5_e70_dual_rank_nullity_exact_envelope.py

      - name: E71 ternary/fixed-prime rank-nullity exact envelope
        run: python experiments/r5_e71_ternary_prime_rank_nullity_envelope.py

      - name: E72 E12 multi-field rank middle-band firewall
        run: python experiments/r5_e72_e12_multifield_rank_middle_band_firewall.py

      - name: E73 top-shell CRT / LDPC / General-Factor firewall
        run: python experiments/r5_e73_top_shell_crt_ldpc_general_factor_firewall.py

      - name: E74 local delta-matroid / exterior barrier
        run: python experiments/r5_e74_local_delta_matroid_exterior_barrier.py

      - name: E75 C4-free bounded-cluster delta barrier
        run: python experiments/r5_e75_c4free_cluster_delta_barrier.py

      - name: E76 first nontrivial linear-delta cluster witness
        run: python experiments/r5_e76_first_nontrivial_delta_cluster_witness.py

      - name: E77 source-aligned delta composition frontier
        run: python experiments/r5_e77_source_aligned_delta_composition_frontier.py

      - name: E78 linear-delta equality-gluing meta-solver
        run: python experiments/r5_e78_linear_delta_equality_gluing_meta_solver.py

      - name: E79 binary reconstruction and uniform matchgate firewall
        run: python experiments/r5_e79_binary_reconstruction_matchgate_firewall.py

      - name: E80 exact q10 binary-delta universality attack
        run: python experiments/r5_e80_q10_binary_delta_universality_attack.py
