name: R5 E9 AF3 Projective Scaling Invariance

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_PROJECTIVE_SCALING_FULL_SUPPORT_INVARIANCE_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_projective_scaling_full_support_invariance.py'
      - '.github/workflows/r5-e9-af3-projective-scaling-full-support-invariance.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact projective-invariance regression
        run: python experiments/r5_e9_af3_projective_scaling_full_support_invariance.py
