name: TRUMP Bucket Unique-Core Residual Single-Variable Separator
on:
  push:
    branches: [research/trump-bucket-unique-core-residual-single-var-separator-2026-09-15]
    paths:
      - 'research/TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bucket_residual_single_var_separator/**'
      - '.github/workflows/trump-bucket-unique-core-residual-single-variable-separator.yml'
  workflow_dispatch:

jobs:
  residual-single-variable-separator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run independent residual separator checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_residual_single_var_separator.independent_checker | tee /tmp/residual-separator.json
      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/residual-separator.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['scientific_firewall']['P_VS_NP']=='OPEN'
          assert z['scientific_firewall']['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert z['scientific_firewall']['GENERAL_RESIDUAL_SEPARATOR_TRACTABILITY']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'methods':z['independent_methods']},sort_keys=True))
          PY
      - name: v3.7 forensic regression
        run: python -m research.tools.apma_bucket_residual_3plus_forensic.independent_checker
      - name: v3.6 residual LE2 regression
        run: python -m research.tools.apma_bucket_residual_le2.independent_checker
      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier
      - name: Authority notice
        run: |
          echo 'SCOPED_ONLY=YES'
          echo 'RAW_DERIVED_SEPARATOR_ONLY=YES'
          echo 'BRANCH_COUNT=2'
          echo 'THREE_PLUS_JOIN_CHAIN=0'
          echo 'GLOBAL_RESIDUAL_CARTESIAN_PRODUCT=0'
          echo 'GENERAL_RESIDUAL_SEPARATOR_TRACTABILITY=NOT_PROVED'
          echo 'P_VS_NP=OPEN'
