name: TRUMP E8 Color3 Linearly Lean Source Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_COLOR3_LINEARLY_LEAN_FIXED_DEGREE_PC_SOURCE_BARRIER_2026-09-30_v4.9.json'
      - 'research/tools/e8_color3_linearly_lean_source/checker.py'
      - '.github/workflows/trump-e8-color3-linearly-lean-source.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact COLOR3 linearly-lean source regression
        run: python research/tools/e8_color3_linearly_lean_source/checker.py
