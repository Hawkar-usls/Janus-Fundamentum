name: R5 E9 EQ3 Linearized Post-SNF RKPR Pair2 Strict Control

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/R5_E9_EQ3_LINEARIZED_POST_SNF_RKPR_PAIR_PROJECTION_STRICT_CONTROL_2026-09-29_v1.0.md"
      - "experiments/r5_e9_eq3_linearized_post_snf_rkpr_pair_projection_strict_control.py"
      - ".github/workflows/r5-e9-eq3-linearized-post-snf-rkpr-pair2-strict-control.yml"

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify EQ3-linearized strict control
        run: python experiments/r5_e9_eq3_linearized_post_snf_rkpr_pair_projection_strict_control.py
