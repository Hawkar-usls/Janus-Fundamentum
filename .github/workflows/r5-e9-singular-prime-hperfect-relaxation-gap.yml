name: R5 E9 Singular Prime h-Perfect Relaxation Gap

on:
  push:
    paths:
      - 'research/R5_E9_SINGULAR_PRIME_HPERFECT_RELAXATION_GAP_CONTROL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_singular_prime_hperfect_relaxation_gap.py'
      - '.github/workflows/r5-e9-singular-prime-hperfect-relaxation-gap.yml'
  workflow_dispatch:

jobs:
  exact-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_singular_prime_hperfect_relaxation_gap.py
      - name: Run exact hostile control
        run: python experiments/r5_e9_singular_prime_hperfect_relaxation_gap.py
