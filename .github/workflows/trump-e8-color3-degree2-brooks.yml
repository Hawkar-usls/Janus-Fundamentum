name: TRUMP E8 Color3 Degree2 Brooks Terminal

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_COLOR3_DEGREE2_PEEL_BROOKS_TERMINAL_AND_DEG4_BOUNDARY_2026-09-30_v5.0.json'
      - 'research/tools/e8_color3_degree2_brooks/checker.py'
      - '.github/workflows/trump-e8-color3-degree2-brooks.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact COLOR3 degree-2/Brooks regression
        run: python research/tools/e8_color3_degree2_brooks/checker.py
