name: R5 E9 Rooted series-pair syndrome contraction

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_ROOTED_SERIES_PAIR_SYNDROME_CONTRACTION_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rooted_series_pair_syndrome_contraction.py'
      - '.github/workflows/r5-e9-rooted-series-pair-syndrome-contraction.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_rooted_series_pair_syndrome_contraction.py
      - name: Replay exact SAT12 contraction
        run: python experiments/r5_e9_rooted_series_pair_syndrome_contraction.py
