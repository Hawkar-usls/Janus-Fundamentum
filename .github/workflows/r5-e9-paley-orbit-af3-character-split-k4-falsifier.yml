name: R5 E9 Paley orbit AF3 character split and K4 falsifier

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_ORBIT_AF3_CHARACTER_SPLIT_AND_K4_MOTIF_FALSIFIER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley_orbit_af3_character_split_k4_falsifier.py'
      - '.github/workflows/r5-e9-paley-orbit-af3-character-split-k4-falsifier.yml'
  workflow_dispatch:

jobs:
  exact-family-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Paley family checker
        run: python3 experiments/r5_e9_paley_orbit_af3_character_split_k4_falsifier.py
