name: R5 Pinned Loop Algebra Theorem One HEAD Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_pinned_loop_witness_extraction_gate.py'
      - 'experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py'
      - 'research/R5_PINNED_LOOP_CLOSURE_WITNESS_EXTRACTION_AND_GAUGE_2026-10-13.md'
      - '.github/workflows/r5-pinned-loop-one-head-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned:
    name: One-commit original SCL pinned loop correctness, witness and no-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All SCL pinned loop identities plus full SAT9 original witness extraction
        run: python -u experiments/r5_universal_pinned_loop_witness_extraction_gate.py
      - name: Exact reversible H holographic basis and first-order impossible-pin cancellation
        run: python -u experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py
