name: TRUMP E8 Graphic Syndrome Rank2 Projective

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_SYNDROME_RANK2_PROJECTIVE_IMAGE_BARRIER_2026-09-30_v5.8.json'
      - 'research/tools/e8_graphic_syndrome_rank2_projective/checker.py'
      - '.github/workflows/trump-e8-graphic-syndrome-rank2-projective.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rank-two syndrome regression
        run: python research/tools/e8_graphic_syndrome_rank2_projective/checker.py
