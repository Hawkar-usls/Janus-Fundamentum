name: R5 Atomic Holyer Tanner Three-Edge NP-Completeness
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_atomic_holyer_tanner_three_edge_npcomplete.py'
      - '.github/workflows/r5-atomic-holyer-tanner-threeedge-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic:
    name: 'All-G Tanner 3-edge proof and connected cubic NP-hard reduction'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact proof-source finite controls and independently computed min cuts
        run: python -u experiments/r5_universal_atomic_holyer_tanner_three_edge_npcomplete.py
