name: R5 E9 Post-SNF RKPR Pair2 Linear Cubic Completeness Falsifier

on:
  push:
    paths:
      - 'research/R5_E9_POST_SNF_RKPR_PAIR2_LINEAR_CUBIC_COMPLETENESS_FALSIFIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_post_snf_rkpr_pair2_linear_cubic_completeness_falsifier.py'
      - '.github/workflows/r5-e9-post-snf-rkpr-pair2-linear-cubic-completeness-falsifier.yml'
  pull_request:
    paths:
      - 'research/R5_E9_POST_SNF_RKPR_PAIR2_LINEAR_CUBIC_COMPLETENESS_FALSIFIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_post_snf_rkpr_pair2_linear_cubic_completeness_falsifier.py'
      - '.github/workflows/r5-e9-post-snf-rkpr-pair2-linear-cubic-completeness-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact pair2 completeness falsifier checker
        run: python experiments/r5_e9_post_snf_rkpr_pair2_linear_cubic_completeness_falsifier.py
