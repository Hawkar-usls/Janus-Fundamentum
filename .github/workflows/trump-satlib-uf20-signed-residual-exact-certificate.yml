name: TRUMP SATLIB UF20 Signed Residual Exact Certificate

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_SIGNED_RESIDUAL_EXACT_CERTIFICATE_PREREGISTRATION_2026-09-16.json'
      - 'research/tools/apma_satlib_uf20_signed_residual_exact_certificate/**'
      - '.github/workflows/trump-satlib-uf20-signed-residual-exact-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-residual-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen parent source and exact-certificate bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_RESIDUAL_EXACT_CERTIFICATE_PREREGISTRATION_2026-09-16.json)" = "d5e29fc5bdc98f83a8d41ed42146c182cddc8e8c"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_EPSILON_DETERMINATION_RESIDUAL_BOUND_RESULT_2026-09-16.json)" = "022463d966fa6f200a258d10e174218bf6aa4dab"
          test "$(git hash-object research/source_data/SATLIB_UF20_01_2026-09-16.cnf)" = "8330041b292e0501f8d74c1b1d32ca96c4498864"
          test "$(git hash-object research/source_data/SATLIB_UF20_02_2026-09-16.cnf)" = "f924caaef0d868bf62b1658e83e030ad8daee865"
          test "$(git hash-object research/source_data/SATLIB_UF20_03_2026-09-16.cnf)" = "8f3d15154515457281f49201b843f2a7134dfa9f"
          test "$(git hash-object research/source_data/SATLIB_UF20_04_2026-09-16.cnf)" = "34ced5c169f967b2dc44ef5e42f2ee2c924813e1"
          test "$(git hash-object research/source_data/SATLIB_UF20_05_2026-09-16.cnf)" = "3b04eff26ee37bdd0bc21b1066486974f92a2c9b"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_residual_exact_certificate/certificate.py)" = "cae7f3b1713e36c5fda7744e5defb0b9e73db181"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_residual_exact_certificate/independent_checker.py)" = "ebf796ea3c8170e093a3c76590b39564fd5cc2a3"
          test "$(git hash-object research/tools/apma_unseen_basis/raw_relation_basis.py)" = "63490c05ef3e91a4f682f75da26ff2af811839a6"
      - name: Run exact certificate on frozen 34 signed actions
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_residual_exact_certificate.certificate | tee /tmp/signed-exact.json
      - name: Run independent exact signed checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_residual_exact_certificate.independent_checker --candidate-json /tmp/signed-exact.json | tee /tmp/signed-exact-independent.json
      - name: Assert preregistered exact-certificate firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/signed-exact.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/signed-exact-independent.json').read_text().strip().splitlines()[-1])
          allowed={'PASS_SCOPED_SIGNED_GROUP_TRIVIAL_ON_ALL_FIVE','NONIDENTITY_SIGNED_AUTOMORPHISM_WITNESS_FOUND'}
          assert c['verdict'] in allowed, c
          assert c['source_guard']['ok'] is True, c['source_guard']
          assert c['total_actions_tested']==34, c
          assert len(c['rows'])==5 and sum(r['identity_positive_control_pass_count'] for r in c['rows'])==5, c['rows']
          assert i['verified'] is True and i['candidate_imported'] is False, i
          rr=c['resource_receipt']
          assert rr['actions_outside_frozen_residual_set_tested']==0 and rr['group_closure_computation']==0 and rr['quotient_states_enumerated']==0, rr
          assert rr['solver_invocations']==0 and rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0 and rr['new_general_group_search_mechanisms']==0 and rr['budget_raise'] is False, rr
          sf=c['scientific_firewall'];assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED',sf
          print(json.dumps({'verdict':c['verdict'],'total_actions_tested':c['total_actions_tested'],'total_nonidentity_automorphisms':c['total_nonidentity_automorphisms'],'rows':[{'source':r['source'],'candidate_count':r['candidate_count'],'identity_passes':r['identity_positive_control_pass_count'],'nonidentity_count':r['nonidentity_automorphism_count'],'first_witness':r['first_nonidentity_witness']} for r in c['rows']],'independent_verified':i['verified']},sort_keys=True))
          PY
      - name: Upload exact signed certificate receipt
        uses: actions/upload-artifact@v4
        with:
          name: satlib-uf20-signed-residual-exact-certificate-receipt
          path: |
            /tmp/signed-exact.json
            /tmp/signed-exact-independent.json
          if-no-files-found: error
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_FINITE_SOURCE_SCOPED_EXACT_ACTION_CERTIFICATE__NO_GENERAL_GROUP_SEARCH_OR_QUOTIENT'
          echo 'MAX_FROZEN_ACTIONS=34'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
          echo 'NEW_SOLVER_MECHANISMS=0'
          echo 'NEW_CARRIER_MECHANISMS=0'
