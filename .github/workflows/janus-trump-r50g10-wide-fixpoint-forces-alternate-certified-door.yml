name: JANUS TRUMP R50G10 Wide Fixpoint Forces Alternate Certified Door

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R50G10_WIDE_FIXPOINT_FORCES_ALTERNATE_CERTIFIED_DOOR_PREREGISTRATION_2026-09-05.json'
      - 'research/JANUS_TRUMP_R50G10_WIDE_FIXPOINT_FORCES_ALTERNATE_CERTIFIED_DOOR_PROOF_NOTE_2026-09-05.md'
      - 'experiments/janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py'
      - 'tests/test_janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py'
      - '.github/workflows/janus-trump-r50g10-wide-fixpoint-forces-alternate-certified-door.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-or-counterexample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze R50G10 contract
        run: |
          python - <<'PY'
          import json
          p='research/JANUS_TRUMP_R50G10_WIDE_FIXPOINT_FORCES_ALTERNATE_CERTIFIED_DOOR_PREREGISTRATION_2026-09-05.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['proof_or_counterexample'] is True
          assert d['no_new_corpus'] is True
          assert d['no_heuristic_authority'] is True
          assert d['firewall']['IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          PY

      - name: Static no-heuristic authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py').read_text()
          for x in ['random.choice(', 'random.shuffle(', 'random.random(', 'sklearn', 'torch', 'tensorflow', 'heuristic_score', 'learned_selector']:
              assert x not in p, x
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py
          PYTHONPATH=.:experiments pytest -q tests/test_janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py

      - name: Execute exact closed-door reduction and frozen replay
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g10_wide_fixpoint_forces_alternate_certified_door.py \
            --output artifacts/JANUS_TRUMP_R50G10_RESULT.json

      - name: Validate epistemic boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R50G10_RESULT.json'))
          fw=d['firewall']
          assert fw['HEURISTIC_AUTHORITY'] is False
          assert fw['FINITE_SUCCESS_IMPLIES_SUPPORT_FRONTIER_THEOREM'] is False
          assert fw['IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          assert fw['TRUMP_finished'] is False
          if d['reachable_replay']['wide_survivors_without_existing_alternate_door']==0:
              assert fw['REACHABLE_ALTERNATE_DOOR_THEOREM']=='OPEN'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g10-result
          path: artifacts/JANUS_TRUMP_R50G10_RESULT.json
          if-no-files-found: error
