name: TRUMP E8 Rank3 Switch Real-Stability Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RANK3_SWITCH_REAL_STABILITY_BARRIER_2026-09-30_v3.2.json'
      - 'research/tools/e8_rank3_switch_real_stability_barrier/checker.py'
      - '.github/workflows/trump-e8-rank3-switch-real-stability-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact real-stability barrier regression
        run: python research/tools/e8_rank3_switch_real_stability_barrier/checker.py
