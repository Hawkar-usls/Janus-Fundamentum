name: TRUMP E8 PSD Rado Matroid Support Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PSD_RADO_MATROID_SUPPORT_BARRIER_2026-09-30_v3.7.json'
      - 'research/tools/e8_psd_rado_matroid_support_barrier/checker.py'
      - '.github/workflows/trump-e8-psd-rado-matroid-support-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact PSD/Rado support regression
        run: python research/tools/e8_psd_rado_matroid_support_barrier/checker.py
