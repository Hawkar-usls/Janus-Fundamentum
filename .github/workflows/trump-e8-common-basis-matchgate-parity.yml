name: TRUMP E8 common-basis matchgate parity barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_COMMON_BASIS_MATCHGATE_PARITY_BARRIER_2026-09-26_v1.2.json'
      - 'research/tools/e8_common_basis_matchgate_parity/checker.py'
      - '.github/workflows/trump-e8-common-basis-matchgate-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_common_basis_matchgate_parity/checker.py
