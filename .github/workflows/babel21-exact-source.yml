name: BABEL-21 rational source-syzygy reconstruction
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/exact_source_syzygies.py','.github/workflows/babel21-exact-source.yml']
  pull_request:
    paths: ['experiments/babel21/exact_source_syzygies.py','.github/workflows/babel21-exact-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-Q-full-source-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore source proof and exact rational syzygy algebra
        run: |
          mkdir -p /tmp/b21Q
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21Q
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py experiments/babel21/source_kernel_probe.py experiments/babel21/exact_source_syzygies.py /tmp/b21Q/
      - name: Reconstruct 5-dimensional seed37 exact Q cokernel
        working-directory: /tmp/b21Q
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed 37 --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed 37
          python source_koszul.py --base SCL126_flip16 --seed 37
          python equal_source_syzygies.py --base SCL126_flip16 --seed 37
      - name: Reconstruct exact rational missing-source syzygies and replay
        working-directory: /tmp/b21Q
        run: python exact_source_syzygies.py --seed 37 --maxcols 27000 --maxpivots 18000
      - name: Preserve exact Q witnesses, or precisely OPEN diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-seed37-exact-source-syzygies
          path: /tmp/b21Q/babel21_*_exact_source_syzygies.json
          retention-days: 7
