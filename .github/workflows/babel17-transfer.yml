name: BABEL-17 exact seed3 transfer circuit
on:
  push:
    branches: ['research/babel17-*']
    paths: ['experiments/babel17/janus_babel17_transfer.py','.github/workflows/babel17-transfer.yml']
  pull_request:
    paths: ['experiments/babel17/janus_babel17_transfer.py','.github/workflows/babel17-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-seed3-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install arithmetic dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Extract original proof bundles
        run: |
          mkdir -p /tmp/babel17c
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17c
          unzip -q experiments/babel15/BABEL15_SEED1_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17c
          unzip -q experiments/babel16/BABEL16_SEED3_CANONICAL_TRANSFER_BARRIER_20261020.zip -d /tmp/babel17c
          cp experiments/babel17/janus_babel17_*.py /tmp/babel17c/
      - name: Construct exact combined source syzygies
        working-directory: /tmp/babel17c
        run: |
          python janus_babel17_syzygy.py
          python janus_babel17_koszul.py
          python janus_babel17_union.py
      - name: Select coupled integer correction and signed graph circuit
        working-directory: /tmp/babel17c
        run: python janus_babel17_transfer.py
      - name: Archive compact tentative circuit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel17-seed3-compact-transfer-candidate
          path: /tmp/babel17c/babel17_SEED3_TRANSFER_SCHEME.json
          retention-days: 7
