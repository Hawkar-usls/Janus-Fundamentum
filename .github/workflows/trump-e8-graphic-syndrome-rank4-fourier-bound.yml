name: TRUMP E8 Graphic Syndrome Rank4 Fourier Bound

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_SYNDROME_RANK4_FOURIER_HYPERPLANE_BOUND_2026-09-30_v6.2.json'
      - 'research/tools/e8_graphic_syndrome_rank4_fourier_bound/checker.py'
      - '.github/workflows/trump-e8-graphic-syndrome-rank4-fourier-bound.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Fourier hyperplane regression
        run: python research/tools/e8_graphic_syndrome_rank4_fourier_bound/checker.py
