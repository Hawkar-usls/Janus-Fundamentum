name: TRUMP Connected Mixed Post Orbit Obstruction Census

on:
  push:
    branches:
      - research/trump-connected-mixed-post-orbit-obstruction-census-2026-09-16
    paths:
      - 'research/TRUMP_SOURCE_AUTHORIZED_CONNECTED_MIXED_RAW_POST_ORBIT_PORTFOLIO_OBSTRUCTION_CENSUS_PREREGISTRATION_2026-09-16.json'
      - 'research/tools/apma_connected_mixed_post_orbit_obstruction_census/**'
      - '.github/workflows/trump-connected-mixed-post-orbit-obstruction-census.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/TRUMP_SOURCE_AUTHORIZED_CONNECTED_MIXED_RAW_POST_ORBIT_PORTFOLIO_OBSTRUCTION_CENSUS_PREREGISTRATION_2026-09-16.json'
      - 'research/tools/apma_connected_mixed_post_orbit_obstruction_census/**'
      - '.github/workflows/trump-connected-mixed-post-orbit-obstruction-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-mixed-post-orbit-obstruction-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin sealed matching backend for GT2 regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'networkx==3.6.1'

      - name: Assert frozen census and portfolio source bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SOURCE_AUTHORIZED_CONNECTED_MIXED_RAW_POST_ORBIT_PORTFOLIO_OBSTRUCTION_CENSUS_PREREGISTRATION_2026-09-16.json)" = "d5742ab49067f8d842bb8d805254b7cbba6e3f10"
          test "$(git hash-object research/tools/apma_connected_mixed_post_orbit_obstruction_census/census.py)" = "f5aa39804983d49149c976e8367a96397bad888e"
          test "$(git hash-object research/tools/apma_connected_mixed_post_orbit_obstruction_census/independent_checker.py)" = "b780f8990cef3d8d14eac4783b1e16330d17f47d"
          test "$(git hash-object registry/TRUMP_CURRENT_STATE_2026-09-16_v3.22.json)" = "a8cd4e3fe62f4db59cbd43588b877ecfca4c7517"
          test "$(git hash-object research/TRUMP_BICAMERAL_BUCKET_RAW_PREDECESSOR_NONUNIQUE_COMMON_CORE_REACHABILITY_ACQUISITION_CENSUS_PREREGISTRATION_2026-09-16.json)" = "7582086cb996a757f5b004d476c719d6a805e74f"
          test "$(git hash-object research/tools/apma_bucket_raw_predecessor_nonunique_reachability_acquisition_census/census.py)" = "0886fe4b41652e52f76e862a752acab0832a5302"
          test "$(git hash-object research/tools/apma_unseen_basis/raw_relation_basis.py)" = "63490c05ef3e91a4f682f75da26ff2af811839a6"
          test "$(git hash-object research/tools/apma_unseen_basis/compositional_basis.py)" = "fdc83a3368a4ad362f00d3ee8aad958f06f8d264"
          test "$(git hash-object research/tools/apma_unseen_basis/compositional_independent_checker.py)" = "92cec97069aec5871385257bd57f87324d8da0a3"
          test "$(git hash-object research/tools/apma_factorized_feedback/factorized_portfolio.py)" = "ab3cd177eb1e554f5119238c8556f05feb988bb3"
          test "$(git hash-object research/tools/apma_factorized_feedback/independent_checker.py)" = "3758427d476b64ea4afc36538772c90903e9266f"
          test "$(git hash-object research/tools/apma_log_alien_transfer/log_alien_transfer.py)" = "d20cd94fa2e0324e301f55211152c2d410099425"
          test "$(git hash-object research/tools/apma_log_alien_transfer/independent_checker.py)" = "add29458f0485870c1a0312c79d9e219c1d129c3"
          test "$(git hash-object research/TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_GT2_UNADMITTED_RAW_OBSTRUCTION_CENSUS_RESULT_2026-09-16.json)" = "df02fe97ac99c6d930c186680f9440c826c570ee"
          test "$(git hash-object research/tools/apma_bucket_gt2_unadmitted_raw_obstruction_census/census.py)" = "0134c7e654b3bf41b7a43da648b1dbb485495cf4"
          test "$(git hash-object research/tools/apma_bucket_gt2_unadmitted_raw_obstruction_census/independent_checker.py)" = "7cd7acbf59154e7f572460ab595284f6d42ccace"
          test "$(git hash-object research/tools/apma_unseen_local_invariant_orbit_count/candidate.py)" = "a076cfc56d68aad0348415e313705da1f6b9cdcd"
          test "$(git hash-object research/tools/apma_unseen_local_invariant_orbit_count/independent_checker.py)" = "0e12304d843ef0bcce6b6c032fd2af2c68abcd14"
          test "$(git hash-object research/tools/apma_unseen_local_invariant_orbit_count/blind_authority.py)" = "7a1c91e01543591564ff3986f53a9faf2acd322f"
          echo 'CONNECTED_MIXED_CENSUS_SOURCE_BINDINGS=PASS'

      - name: Run candidate source-authorized connected-mixed census
        run: |
          set -euo pipefail
          python -m research.tools.apma_connected_mixed_post_orbit_obstruction_census.census | tee /tmp/connected-mixed-census.json

      - name: Run independent connected-mixed census checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_connected_mixed_post_orbit_obstruction_census.independent_checker --candidate-json /tmp/connected-mixed-census.json | tee /tmp/connected-mixed-independent.json

      - name: Assert preregistered connected-mixed census invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/connected-mixed-census.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/connected-mixed-independent.json').read_text().strip().splitlines()[-1])
          allowed={
            'PASS_DIAGNOSTIC_FIRST_SOURCE_AUTHORIZED_CONNECTED_MIXED_RAW_POST_ORBIT_OBSTRUCTION_FROZEN',
            'PASS_DIAGNOSTIC_NO_CURRENT_SOURCE_AUTHORIZED_CONNECTED_MIXED_RAW_POST_ORBIT_OBSTRUCTION_FOUND',
          }
          assert c['verdict'] in allowed, c['verdict']
          assert i['verified'] is True, i
          assert i['verdict']==c['verdict'], (c['verdict'],i['verdict'])
          assert c['source_guard']['ok'] is True, c['source_guard']
          assert i['source_guard']['ok'] is True, i['source_guard']
          assert i['source_guard']['new_profiler_imported'] is False, i['source_guard']
          assert all(i['checks'].values()), {k:v for k,v in i['checks'].items() if not v}
          assert c['constructor_entry_count']==26, c['constructor_entry_count']
          rr=c['resource_receipt']
          assert rr['new_solver_mechanisms']==0, rr
          assert rr['new_carrier_mechanisms']==0, rr
          assert rr['new_representation_adapters_to_force_old_carriers']==0, rr
          assert rr['full_variable_cube_enumerations']==0, rr
          assert rr['separator_ge3_boolean_branches']==0, rr
          assert rr['size4_boolean_separator_assignments']==0, rr
          assert rr['new_unbounded_recursion']==0, rr
          assert rr['new_three_plus_join_chains']==0, rr
          assert rr['global_residual_cartesian_products_materialized']==0, rr
          assert rr['budget_raise'] is False, rr
          sf=c['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO', sf
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED', sf
          out={
            'verdict':c['verdict'],
            'constructor_entry_count':c['constructor_entry_count'],
            'unique_raw_count':c['unique_raw_count'],
            'rows_evaluated_before_stop':c['rows_evaluated_before_stop'],
            'eligible_connected_mixed_count_before_stop':c['eligible_connected_mixed_count_before_stop'],
            'classification_counts':c['classification_counts'],
            'first_real_post_orbit_obstruction':None if c['first_real_post_orbit_obstruction'] is None else c['first_real_post_orbit_obstruction']['raw_sha256'],
            'independent_checks':i['checks'],
          }
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Sealed compositional-basis regression
        run: |
          set -euo pipefail
          python -m research.tools.apma_unseen_basis.compositional_independent_checker | tee /tmp/compositional-regression.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/compositional-regression.json').read_text().strip().splitlines()[-1])
          assert x['verdict']=='PASS_SCOPED_RAW_COMPOSITIONAL_BASIS_INDUCTION', x
          assert all(x['checks'].values()), {k:v for k,v in x['checks'].items() if not v}
          PY

      - name: Sealed factorized-feedback portfolio regression
        run: |
          set -euo pipefail
          python -m research.tools.apma_factorized_feedback.independent_checker | tee /tmp/factorized-regression.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/factorized-regression.json').read_text().strip().splitlines()[-1])
          assert x['verdict']=='PASS_SCOPED_FACTORIZED_FEEDBACK_INTERFACE_PORTFOLIO', x
          assert all(x['checks'].values()), {k:v for k,v in x['checks'].items() if not v}
          PY

      - name: Sealed log-alien exact-transfer regression
        run: |
          set -euo pipefail
          python -m research.tools.apma_log_alien_transfer.independent_checker | tee /tmp/log-alien-regression.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/log-alien-regression.json').read_text().strip().splitlines()[-1])
          assert x['verdict']=='PASS_SCOPED_LOG_ALIEN_CONSTRAINT_EXACT_TRANSFER', x
          assert all(x['checks'].values()), {k:v for k,v in x['checks'].items() if not v}
          PY

      - name: v3.19 frozen raw-GT2 census regression
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_gt2_unadmitted_raw_obstruction_census.census | tee /tmp/v319-gt2.json
          python -m research.tools.apma_bucket_gt2_unadmitted_raw_obstruction_census.independent_checker --candidate-json /tmp/v319-gt2.json | tee /tmp/v319-gt2-independent.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/v319-gt2.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/v319-gt2-independent.json').read_text().strip().splitlines()[-1])
          assert c['verdict']=='PASS_DIAGNOSTIC_NO_FROZEN_RAW_UNADMITTED_GT2_OBSTRUCTION_FOUND', c
          assert i['verdict']==c['verdict'], i
          assert all(c['checks'].values()), {k:v for k,v in c['checks'].items() if not v}
          assert all(i['checks'].values()), {k:v for k,v in i['checks'].items() if not v}
          PY

      - name: Global APMA V1 frozen blind-pass regression
        run: |
          set -euo pipefail
          mod='research.tools.apma_unseen_local_invariant_orbit_count.blind_authority'
          python -m "$mod" --emit positive > /tmp/v1-positive.raw.json
          python -m "$mod" --emit negative > /tmp/v1-negative.raw.json
          python -m research.tools.apma_unseen_local_invariant_orbit_count.candidate --input-json /tmp/v1-positive.raw.json | tee /tmp/v1-positive.candidate.json
          python -m research.tools.apma_unseen_local_invariant_orbit_count.independent_checker --input-json /tmp/v1-positive.raw.json --candidate-json /tmp/v1-positive.candidate.json | tee /tmp/v1-positive.check.json
          python -m research.tools.apma_unseen_local_invariant_orbit_count.candidate --input-json /tmp/v1-negative.raw.json | tee /tmp/v1-negative.candidate.json
          python -m research.tools.apma_unseen_local_invariant_orbit_count.independent_checker --input-json /tmp/v1-negative.raw.json --candidate-json /tmp/v1-negative.candidate.json | tee /tmp/v1-negative.check.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/v1-positive.candidate.json').read_text().strip().splitlines()[-1])
          pk=json.loads(Path('/tmp/v1-positive.check.json').read_text().strip().splitlines()[-1])
          n=json.loads(Path('/tmp/v1-negative.candidate.json').read_text().strip().splitlines()[-1])
          nk=json.loads(Path('/tmp/v1-negative.check.json').read_text().strip().splitlines()[-1])
          assert p['status']=='ADMIT_ORBIT_COUNT_QUOTIENT_SAT' and p['solver_authority'] is True, p
          assert p['quotient_states_Q']==210, p
          assert sorted(map(len,p['cells']))==[4,5,6], p
          assert pk['verified'] is True, pk
          assert n['status']=='OPEN_NO_NONTRIVIAL_EXCHANGEABILITY' and n['solver_authority'] is False, n
          assert nk['verified'] is True, nk
          print(json.dumps({'global_apma_v1_regression':'PASS','positive_Q':p['quotient_states_Q'],'negative_status':n['status']},sort_keys=True))
          PY

      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_ONLY__EVIDENCE_LOCALIZATION_BEFORE_NEW_MECHANISM_DESIGN'
          echo 'NEW_SOLVER_MECHANISMS=0'
          echo 'NEW_CARRIER_MECHANISMS=0'
          echo 'NEW_REPRESENTATION_ADAPTERS=0'
          echo 'FULL_VARIABLE_CUBE_ENUMERATION=0'
          echo 'SEPARATOR_GE3_BOOLEAN_BRANCHING=0'
          echo 'SIZE4_BOOLEAN_BRANCHING=0'
          echo 'EXTRA_RECURSION=0'
          echo 'NEW_JOIN_CHAINS=0'
          echo 'GLOBAL_RESIDUAL_CARTESIAN_PRODUCT=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
          echo 'CONNECTED_MIXED_CORE_SOLVED=NO'
          echo 'ARBITRARY_UNSEEN_INVARIANT_DISCOVERY=NOT_PROVED'
