name: Validate C049.1 B5 iterative compression preprocessing binding

on:
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding.py'
      - 'experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py'
      - '.github/workflows/validate-c049-1-b5-iterative-compression-preprocessing-binding.yml'
  workflow_dispatch:

jobs:
  preprocessing-binding:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: experiments/direct
      SPEC: experiments/direct/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_SPEC_V1.json
      PRODUCER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding.py
      VERIFIER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py
      WORKFLOW: .github/workflows/validate-c049-1-b5-iterative-compression-preprocessing-binding.yml
      INTERFACE_RECEIPT: experiments/direct/audits/C049_1_B5_INTERFACE_CLOSURE_CURRENT_FRONTIER_ADMISSION_C5F60BF8.json
      B5_CONTRACT_SPEC: experiments/direct/C049_1_B5_GENERAL_RUNTIME_TERMINAL_INTEGRATION_SPEC_V1.json
      B5_CONTRACT_RECEIPT: experiments/direct/audits/C049_1_B5_GENERAL_RUNTIME_TERMINAL_CONTRACT_ADMISSION_CEBBCFF9.json
      B42_PRODUCER: experiments/direct/janus_c049_1_b4_2_3k_scaffold.py
      B42_VERIFIER: experiments/direct/janus_c049_1_b4_2_3k_scaffold_verifier.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind exact-head preprocessing bytes and frozen authorities
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then PROOF_HEAD="${{ github.event.pull_request.head.sha }}"; else PROOF_HEAD="$GITHUB_SHA"; fi
          echo "PROOF_HEAD=$PROOF_HEAD" >> "$GITHUB_ENV"
          for f in "$SPEC" "$PRODUCER" "$VERIFIER" "$WORKFLOW"; do
            test "$(git rev-parse "$PROOF_HEAD:$f")" = "$(git hash-object "$f")"
          done
          test "$(git hash-object "$SPEC")" = "f2508347b7a5a29a6a72127607bc19a9d00f262a"
          test "$(git hash-object "$PRODUCER")" = "5eb99fe911aa828e42f952a176b5f396dfa8f609"
          test "$(git hash-object "$VERIFIER")" = "762ace290285fbda9ee219984daaf04866ffc222"
          test "$(git hash-object "$INTERFACE_RECEIPT")" = "e4a886bbf9090783c592dd11ec80a6efe34b337a"
          test "$(git hash-object "$B5_CONTRACT_SPEC")" = "b192f5e3f884551c29d574f568a8b2275ecc92c5"
          test "$(git hash-object "$B5_CONTRACT_RECEIPT")" = "6103a509bca3e91b1950a58e90e8274b3cc5e4c7"
          test "$(git hash-object "$B42_PRODUCER")" = "57c16c18a14cecb96264a22fea01cd2c2bdaa857"
          test "$(git hash-object "$B42_VERIFIER")" = "106d8d83b7751d23fb685d58ca33015413467462"
          python - <<'PY'
          import json,os
          interface=json.load(open(os.environ['INTERFACE_RECEIPT']))
          contract=json.load(open(os.environ['B5_CONTRACT_SPEC']))
          assert interface['audit_payload']['admission_review_id']==4888481873
          assert interface['semantic_digest']=='f9429a912681772ca8d33cd87163a88828d45ece733ebf2652784064da286ff0'
          assert contract['iterative_compression_contract']['new_reduced_factor_dimension_obligation']=='DIMENSION_AT_MOST_2K_OR_EMIT_THE_SEPARATELY_VERIFIED_LOCAL_NO_LAYOUT_CERTIFICATE'
          assert contract['input_contract']['atomic_layout_unit']=='WHOLE_FACTOR_NORMAL_SPACE_AFTER_BOUND_JKO_PREPROCESSING'
          print('B5_PREPROCESSING_UPSTREAM_AUTHORITY_BINDING = PASS')
          PY

      - name: Compile and enforce producer verifier separation
        run: |
          set -euo pipefail
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast
          from pathlib import Path
          v=Path('experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py')
          imports=[]
          for n in ast.walk(ast.parse(v.read_text())):
              if isinstance(n,ast.Import): imports += [a.name for a in n.names]
              elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          assert not any(x.endswith('janus_c049_1_b5_iterative_compression_preprocessing_binding') for x in imports)
          for path in (Path('experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding.py'),v):
              text=path.read_text()
              for forbidden in ['def solve_phase_a(', 'def solve_trellis(', 'B5_COMPLETE = TRUE', 'P_VS_NP = CLOSED']:
                  assert forbidden not in text
          print('B5_PREPROCESSING_INDEPENDENT_VERIFIER_DECOUPLING = PASS')
          print('B5_ORCHESTRATOR_IMPLEMENTATION_IN_THIS_GATE = FORBIDDEN')
          PY

      - name: Build preprocessing controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          def w(name,x): Path('/tmp/'+name+'.json').write_text(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n')
          aff=lambda tag:{'schema':'test.affine.identity.v1','tag':tag,'payload':[tag,0,1]}
          independent={'ambient_dim':2,'k':0,'factors':[{'id':'alpha','normal_space':[1],'affine_offset':aff('A')},{'id':'beta','normal_space':[2],'affine_offset':aff('B')}]}
          independent_reordered={'ambient_dim':2,'k':0,'factors':list(reversed(independent['factors']))}
          duplicate={'ambient_dim':1,'k':0,'factors':[{'id':'left','normal_space':[1],'affine_offset':aff('L')},{'id':'right','normal_space':[1],'affine_offset':aff('R')}]}
          shrink={'ambient_dim':3,'k':1,'factors':[{'id':'a','normal_space':[1,2,4],'affine_offset':aff('A')},{'id':'b','normal_space':[1],'affine_offset':aff('B')},{'id':'c','normal_space':[2],'affine_offset':aff('C')}]}
          singleton={'ambient_dim':4,'k':0,'factors':[{'id':'solo','normal_space':[8,1],'affine_offset':aff('S')}]}
          empty={'ambient_dim':0,'k':0,'factors':[]}
          for name,x in [('independent',independent),('independent-reordered',independent_reordered),('duplicate',duplicate),('shrink',shrink),('singleton',singleton),('empty',empty)]: w(name,x)
          print('PREPROCESSING_CONTROL_INPUTS = 6')
          PY

      - name: Produce and independently verify all controls
        run: |
          set -euo pipefail
          for name in independent independent-reordered duplicate shrink singleton empty; do
            python "$PRODUCER" --spec "$SPEC" --input "/tmp/$name.json" --output "/tmp/$name.pre.json" > "/tmp/$name.producer.log"
            python "$VERIFIER" --spec "$SPEC" --input "/tmp/$name.json" --candidate "/tmp/$name.pre.json" > "/tmp/$name.verifier.log"
            grep -F 'JANUS_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_INDEPENDENT_VERIFIER = PASS' "/tmp/$name.verifier.log"
          done
          python - <<'PY'
          import json
          P=lambda n:json.load(open('/tmp/'+n+'.pre.json'))['proof_payload']
          independent=P('independent'); reordered=P('independent-reordered'); duplicate=P('duplicate'); shrink=P('shrink'); singleton=P('singleton'); empty=P('empty')
          assert independent['preprocessing_branch']=='PREPROCESSING_BOUND'
          assert [x['original_dimension'] for x in independent['per_factor_reduction_receipts']]==[1,1]
          assert [x['reduced_dimension'] for x in independent['per_factor_reduction_receipts']]==[0,0]
          assert len(independent['discovery_catalog'])==2 and all(x['normal_space']==[] for x in independent['discovery_catalog'])
          assert duplicate['preprocessing_branch']=='LOCAL_NO_LAYOUT_SOURCE_CANDIDATE_PENDING_REVIEW'
          assert [x['reduced_dimension'] for x in duplicate['per_factor_reduction_receipts']]==[1,1]
          assert shrink['preprocessing_branch']=='PREPROCESSING_BOUND'
          assert any(x['original_dimension']>x['reduced_dimension'] for x in shrink['per_factor_reduction_receipts'])
          assert singleton['preprocessing_branch']=='TRIVIAL_SINGLETON_INPUT'
          assert empty['preprocessing_branch']=='TRIVIAL_EMPTY_INPUT'
          assert independent['factor_occurrence_bijection']==reordered['factor_occurrence_bijection']
          assert [x['factor_id'] for x in independent['discovery_catalog']]==[x['factor_id'] for x in reordered['discovery_catalog']]
          print('K0_RAW_DIMENSION_ONE_REDUCES_TO_ZERO = PASS')
          print('K0_DUPLICATE_GEOMETRY_OBSTRUCTION_CANDIDATE = PASS')
          print('NONTRIVIAL_STRICT_REDUCTION = PASS')
          print('ZERO_REDUCED_OCCURRENCES_RETAINED = PASS')
          print('PRESENTATION_REORDER_OCCURRENCE_BINDING = PASS')
          PY

      - name: Verify cut equivalence exhaustively on bounded controls and B4.2 reduced scaffold seam
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,itertools,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('b42',Path('experiments/direct/janus_c049_1_b4_2_3k_scaffold.py'))
          b42=importlib.util.module_from_spec(spec); spec.loader.exec_module(b42)
          def rref(rows,d): return b42.rref(rows,d)
          def width_vector(blocks,order,d): return b42.widths([rref(x,d) for x in blocks],order,d)
          for name in ('independent','duplicate','shrink'):
              raw=json.load(open('/tmp/'+name+'.json')); p=json.load(open('/tmp/'+name+'.pre.json'))['proof_payload']; d=raw['ambient_dim']
              original=[x['normal_space'] for x in p['original_catalog']]; reduced=[x['normal_space'] for x in p['discovery_catalog']]
              for order in itertools.permutations(range(len(original))):
                  assert width_vector(original,order,d)==width_vector(reduced,order,d),(name,order)
          p=json.load(open('/tmp/independent.pre.json'))['proof_payload']
          original=[x['normal_space'] for x in p['original_catalog']]; reduced=[x['normal_space'] for x in p['discovery_catalog']]
          assert len(original[1])==1 and 1>2*0
          scaffold=b42.scaffold(reduced,(0,),1,2,0,[x['affine_offset'] for x in p['discovery_catalog']])
          assert scaffold['terminal']=='SCAFFOLD_3K_CERTIFIED'
          assert scaffold['scaffold_width']==0 and scaffold['three_k_cap']==0
          print('ORIGINAL_REDUCED_ALL_PERMUTATION_WIDTH_VECTORS_CONTROL = PASS')
          print('B4_2_USES_REDUCED_NOT_RAW_DIMENSION_K0_CONTROL = PASS')
          PY

      - name: Reject 20 repaired-digest preprocessing attacks
        run: |
          set -euo pipefail
          python "$VERIFIER" --spec "$SPEC" --input /tmp/shrink.json --candidate /tmp/shrink.pre.json --tamper-suite | tee /tmp/tamper.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 20/20' /tmp/tamper.log

      - name: Freeze exact-head preprocessing candidate receipt
        run: |
          set -euo pipefail
          mkdir -p /tmp/preprocessing-evidence
          cp /tmp/independent.pre.json /tmp/duplicate.pre.json /tmp/shrink.pre.json /tmp/singleton.pre.json /tmp/empty.pre.json /tmp/preprocessing-evidence/
          cp /tmp/independent.verifier.log /tmp/duplicate.verifier.log /tmp/shrink.verifier.log /tmp/tamper.log /tmp/preprocessing-evidence/
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def A(name): return json.load(open('/tmp/'+name+'.pre.json'))
          independent,duplicate,shrink=A('independent'),A('duplicate'),A('shrink')
          receipt={
            'schema':'janus.c049_1.b5.iterative_compression_preprocessing_binding_exact_head_candidate_receipt.v1',
            'proof_head':os.environ['PROOF_HEAD'],
            'bindings':{
              'spec_git_blob':blob(os.environ['SPEC']),
              'producer_git_blob':blob(os.environ['PRODUCER']),
              'verifier_git_blob':blob(os.environ['VERIFIER']),
              'workflow_git_blob':blob(os.environ['WORKFLOW']),
              'b5_interface_closure_receipt_git_blob':'e4a886bbf9090783c592dd11ec80a6efe34b337a',
              'b5_contract_spec_git_blob':'b192f5e3f884551c29d574f568a8b2275ecc92c5',
              'b5_contract_receipt_git_blob':'6103a509bca3e91b1950a58e90e8274b3cc5e4c7',
              'b4_2_producer_git_blob':'57c16c18a14cecb96264a22fea01cd2c2bdaa857',
              'b4_2_verifier_git_blob':'106d8d83b7751d23fb685d58ca33015413467462'
            },
            'source_binding':{
              'arxiv':'1507.02184v4','doi':'10.1109/TIT.2017.2740283','preprocessing':'Subsection 5.1 / Lemma 5.2','iterative_compression':'Subsection 6.1 / Lemma 6.1','theta':'2k'
            },
            'controls':{
              'k0_independent':{'sha256':sha('/tmp/independent.pre.json'),'semantic_digest':independent['semantic_digest'],'raw_dimensions':[1,1],'reduced_dimensions':[0,0],'branch':'PREPROCESSING_BOUND','b4_2_reduced_scaffold_width':0},
              'k0_duplicate':{'sha256':sha('/tmp/duplicate.pre.json'),'semantic_digest':duplicate['semantic_digest'],'reduced_dimensions':[1,1],'branch':'LOCAL_NO_LAYOUT_SOURCE_CANDIDATE_PENDING_REVIEW'},
              'strict_shrink':{'sha256':sha('/tmp/shrink.pre.json'),'semantic_digest':shrink['semantic_digest'],'branch':'PREPROCESSING_BOUND'}
            },
            'checks':{
              'independent_verifier':'PASS','exact_intersection_replay':'PASS','occurrence_bijection':'PASS','affine_offset_identity':'PASS','zero_reduced_occurrence_retained':'PASS','bounded_all_permutation_cut_equivalence':'PASS','raw_dimension_substitution_forbidden':'PASS','b4_2_reduced_scaffold_seam':'PASS','tampers_rejected':'20/20','direct_b5_4_on_reduced_catalog':'FORBIDDEN','original_order_lift':'NOT_ESTABLISHED'
            },
            'formal_admission':'BLOCKED_PENDING_REVIEW',
            'preprocessing_local_no_layout_terminal':'FORBIDDEN_PENDING_REVIEW',
            'iterative_compression_orchestrator':False,
            'b5_complete':False,
            'all_input_termination':'NOT_ESTABLISHED',
            'polynomial_runtime':'NOT_ESTABLISHED',
            'p_vs_np':'OPEN'
          }
          Path('/tmp/preprocessing-evidence/exact-head-receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('B5_PREPROCESSING_EXACT_HEAD_RECEIPT = FROZEN')
          print('PROOF_HEAD =',receipt['proof_head'])
          print('K0_RAW_DIMENSION_SUBSTITUTION = REJECTED_BY_REDUCED_CONTROL')
          print('DIRECT_B5_4_ON_REDUCED_CATALOG = FORBIDDEN')
          print('ORIGINAL_ORDER_LIFT = NOT_ESTABLISHED')
          print('B5_COMPLETE = FALSE')
          print('P_VS_NP = OPEN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c049-1-b5-iterative-compression-preprocessing-binding
          path: /tmp/preprocessing-evidence
          if-no-files-found: error
