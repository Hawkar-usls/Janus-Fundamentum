name: R5 E9 Source-kernel polynomial navigation shell

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_SOURCE_KERNEL_POLYNOMIAL_NAVIGATION_SHELL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_source_kernel_polynomial_navigation_shell.py'
      - '.github/workflows/r5-e9-source-kernel-polynomial-navigation-shell.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_source_kernel_polynomial_navigation_shell.py
      - name: Replay PG15 navigation-shell binding
        run: python experiments/r5_e9_source_kernel_polynomial_navigation_shell.py
