      - 'research/R5_B1B1C5B2B2_E8_K5_MINUS_2K2_BOUNDARY_WIRE_GLUE_TERMINAL_2026-09-30_v6.9.json'
      - 'research/tools/e8_k5_minus_2k2_boundary_wire_glue/checker.py'
      - '.github/workflows/trump-e8-k5-minus-2k2-boundary-wire-glue.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay equality-wire four-cut classification
        run: python research/tools/e8_k5_minus_2k2_boundary_wire_glue/checker.py
