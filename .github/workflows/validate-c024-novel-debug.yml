name: Validate C024 Novel Debug

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_novel_branch_audit.py"
      - "experiments/direct/janus_tear_gt_novel_branch_debug.py"
      - ".github/workflows/validate-c024-novel-debug.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_novel_branch_audit.py"
      - "experiments/direct/janus_tear_gt_novel_branch_debug.py"
      - ".github/workflows/validate-c024-novel-debug.yml"

permissions:
  contents: read

jobs:
  novel-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_tear_gt_novel_branch_debug.py
