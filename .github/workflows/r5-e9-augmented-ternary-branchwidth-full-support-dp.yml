name: R5 E9 Augmented Ternary Branch-Width Full-Support DP

on:
  pull_request:
    paths:
      - 'research/R5_E9_AUGMENTED_TERNARY_BRANCHWIDTH_FULL_SUPPORT_DP_ROUTER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_augmented_ternary_branchwidth_full_support_dp.py'
      - '.github/workflows/r5-e9-augmented-ternary-branchwidth-full-support-dp.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact branch-boundary DP regression
        run: python experiments/r5_e9_augmented_ternary_branchwidth_full_support_dp.py
