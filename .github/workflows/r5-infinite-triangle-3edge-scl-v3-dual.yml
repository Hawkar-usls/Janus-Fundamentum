name: R5 Infinite 3-Edge Connected SCL GF3 Degree Three Dual
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_infinite_3edge_connected_scl_triangle_degree3_dual.py'
      - '.github/workflows/r5-infinite-triangle-3edge-scl-v3-dual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triangle:
    name: Infinite original 3-edge-connected SCL99 SCL108 SCL117 SCL126 and GF3 dual transfer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 3-edge cuts, triangle source rows and inherited F3 degree3 dual against ALL native generators
        run: python -u experiments/r5_universal_infinite_3edge_connected_scl_triangle_degree3_dual.py
