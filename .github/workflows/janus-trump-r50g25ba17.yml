name: JANUS TRUMP R50G25BA17 corrected BA16 quotient width stratification

on:
  push:
    branches:
      - research/r50g25ba17-corrected-ba16-quotient-width-stratification-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration ancestry
        run: |
          git merge-base --is-ancestor 688594a8a450b567603a2abbead7b3b885eff0c0 0a5f24c51f97b3b34e23aaec15e63726c2ae0665
          git merge-base --is-ancestor 688594a8a450b567603a2abbead7b3b885eff0c0 6bfa82457a0b2d28196fd32c9244befcf7c59e9f
          git merge-base --is-ancestor 688594a8a450b567603a2abbead7b3b885eff0c0 de8dc9645c5fffde5939755f24f125341c3cfb46
          test "$(git show --format=%s --no-patch 688594a8a450b567603a2abbead7b3b885eff0c0)" = "preregister R50G25BA17 corrected BA16 quotient width stratification"
      - name: Build exact BA17 width theorem result
        env:
          PYTHONPATH: experiments
        run: |
          mkdir -p artifacts
          python experiments/janus_trump_r50g25ba17_corrected_ba16_quotient_width_stratification.py --out artifacts/JANUS_TRUMP_R50G25BA17_RESULT.json
      - name: Independent mathematical replay
        env:
          PYTHONPATH: experiments
        run: |
          python experiments/verify_janus_trump_r50g25ba17_corrected_ba16_quotient_width_stratification.py --result artifacts/JANUS_TRUMP_R50G25BA17_RESULT.json --out artifacts/JANUS_TRUMP_R50G25BA17_VERIFY.json
      - name: Complete exact 26-name preseal
        env:
          PYTHONPATH: experiments
        run: |
          python experiments/complete_janus_trump_r50g25ba17_preseal_obligations.py --prereg research/JANUS_TRUMP_R50G25BA17_PREREGISTRATION.json --result artifacts/JANUS_TRUMP_R50G25BA17_RESULT.json --verify artifacts/JANUS_TRUMP_R50G25BA17_VERIFY.json --out artifacts/JANUS_TRUMP_R50G25BA17_PRESEAL_COMPLETION.json
      - name: Enforce strict BA17 promotion guard
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=Path('artifacts/JANUS_TRUMP_R50G25BA17_RESULT.json');vp=Path('artifacts/JANUS_TRUMP_R50G25BA17_VERIFY.json');cp=Path('artifacts/JANUS_TRUMP_R50G25BA17_PRESEAL_COMPLETION.json')
          r=json.loads(rp.read_text());v=json.loads(vp.read_text());c=json.loads(cp.read_text())
          assert r['preregistration_commit']=='688594a8a450b567603a2abbead7b3b885eff0c0'
          assert r['parent_BA16_final_meta_commit']=='481c0068ace505305645402e0e27cbf909332dce'
          assert r['historical_immutability']['BA16_status']=='MIXED'
          assert r['historical_immutability']['BA16_F14']=='PRESERVED'
          assert r['historical_immutability']['BA16_QUOTIENT_WIDTH_PASS']==0
          assert r['historical_immutability']['P_BA16_A']==0
          assert r['historical_immutability']['P_BA16_MIXED']==1
          assert r['theorem']['W_Q']=='max(min(n+1,p+r+1),p+n+r-max(p,n,r))'
          assert r['theorem']['piecewise']=='p+r+1 if n>=p+r else p+n+r-max(p,n,r)'
          assert r['theorem']['full_BA4_bounds']=='W_Q <= W_full <= max(13,W_Q)'
          assert r['semantic_status_preserved']['SELF_SUSTAINING_DISTINCT_MULTIPLICATION']=='NOT_CERTIFIED'
          assert r['complexity']['generic_exhaustive_treewidth_search_used'] is False
          assert v['status']=='PASS' and v['error_count']==0 and v['P_BA17']==1 and v['implementation_imported'] is False
          assert c['status']=='PASS' and c['P_BA17_FINAL']==1 and c['required_pass_count']==26 and c['all_required_passes'] is True
          assert len(c['required_pass_names'])==26 and len(set(c['required_pass_names']))==26
          assert all(x==1 for x in c['required_passes'].values())
          assert c['BA16_F14_preserved'] is True and c['P_BA16_A']==0 and c['P_BA16_MIXED']==1
          assert r['next_gate_started'] is False and r['BA18_started'] is False
          assert r['P_VS_NP']=='OPEN' and r['SAT_IN_P']=='NOT_PROVED' and r['TRUMP_finished'] is False
          print('RESULT_SHA256='+hashlib.sha256(rp.read_bytes()).hexdigest())
          print('VERIFY_SHA256='+hashlib.sha256(vp.read_bytes()).hexdigest())
          print('COMPLETION_SHA256='+hashlib.sha256(cp.read_bytes()).hexdigest())
          print('P_BA17_FINAL=1')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba17-result
          path: |
            artifacts/JANUS_TRUMP_R50G25BA17_RESULT.json
            artifacts/JANUS_TRUMP_R50G25BA17_VERIFY.json
            artifacts/JANUS_TRUMP_R50G25BA17_PRESEAL_COMPLETION.json
          if-no-files-found: error
