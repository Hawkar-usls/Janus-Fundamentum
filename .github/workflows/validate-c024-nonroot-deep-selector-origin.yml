name: Validate C024 Nonroot Deep Selector Origin

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_deep_selector_origin.py"
      - "experiments/direct/janus_tear_gt_nonroot_deep_exchange_absorption.py"
      - "experiments/direct/janus_tear_gt_branch_frequency_contribution_profile.py"
      - ".github/workflows/validate-c024-nonroot-deep-selector-origin.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_deep_selector_origin.py"
      - "experiments/direct/janus_tear_gt_nonroot_deep_exchange_absorption.py"
      - "experiments/direct/janus_tear_gt_branch_frequency_contribution_profile.py"
      - ".github/workflows/validate-c024-nonroot-deep-selector-origin.yml"

permissions:
  contents: read

jobs:
  nonroot-deep-selector-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Join deep exchange rows to selector origins
        run: python experiments/direct/janus_tear_gt_nonroot_deep_selector_origin.py
