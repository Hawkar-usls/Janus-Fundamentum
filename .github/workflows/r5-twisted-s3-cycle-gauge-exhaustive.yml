      - 'experiments/r5_universal_twisted_s3_cycle_gauge_normal_forms.py'
      - '.github/workflows/r5-twisted-s3-cycle-gauge-exhaustive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gauge:
    name: Native source S3-tree normalization and exhaust 216 twisted K4 SCL18 PC2 certificates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
