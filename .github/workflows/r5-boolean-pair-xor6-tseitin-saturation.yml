name: R5 Boolean Pair C4 Wire C6 XOR and Tseitin Saturation Falsifier
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_boolean_pair_xor6_tseitin_saturation_falsifier.py'
      - 'research/R5_BOOLEAN_PAIR_ODD_XOR_TSEITIN_SATURATION_2026-10-13.md'
      - '.github/workflows/r5-boolean-pair-xor6-tseitin-saturation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-boolean-gates:
    name: Independently verify C4 Boolean wire C6 odd XOR and global native SAT falsifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact test on original source rows and explicit global SAT witnesses
        run: python -u experiments/r5_universal_boolean_pair_xor6_tseitin_saturation_falsifier.py
