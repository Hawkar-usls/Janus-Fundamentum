name: run-c025-selector-product-tower-depth2

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'research/C025_SELECTOR_PRODUCT_TOWER_DEPTH2_PREREGISTRATION_2026-08-27.json'
      - '.github/workflows/run-c025-selector-product-tower-depth2.yml'
  pull_request:
    paths:
      - 'research/C025_SELECTOR_PRODUCT_TOWER_DEPTH2_PREREGISTRATION_2026-08-27.json'
      - '.github/workflows/run-c025-selector-product-tower-depth2.yml'

jobs:
  selector-product-depth2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen code and preregistration
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p = Path('research/C025_SELECTOR_PRODUCT_TOWER_DEPTH2_PREREGISTRATION_2026-08-27.json')
          data = json.loads(p.read_text())
          assert data['status'] == 'FROZEN_AFTER_DEPTH1_NEGATIVE_CONTROL__BEFORE_DEPTH2_RESULT'
          assert data['frozen_run']['target_depth'] == 2
          assert data['stopping_rule'].startswith('RUN THROUGH DEPTH_2 ONLY')
          for path, expected in (
              (data['frozen_code']['decision_core_path'], data['frozen_code']['decision_core_content_sha']),
              (data['frozen_code']['hostile_probe_path'], data['frozen_code']['hostile_probe_content_sha']),
          ):
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          assert data['scientific_boundary']['HIGH_VOLUME_RESCUE_TOTALITY'] == 'OPEN'
          assert data['P_VS_NP'] == 'OPEN'
          print('SELECTOR_TOWER_DEPTH2_FROZEN_CODE=PASS')
          print('P_VS_NP=OPEN')
          PY

      - name: Execute frozen selector-product through depth 2
        run: |
          python -m experiments.direct.janus_selector_product_tower_hostile_probe \
            --max-depth 2 | tee selector-product-depth2.json

      - name: Verify boundary and expose target depth 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('selector-product-depth2.json').read_text())
          assert len(data['rows']) == 2
          row = data['rows'][1]
          assert row['depth'] == 2
          assert row['known_external_truth'] == 'UNSAT'
          assert row['status'] != 'SAT', 'SOUNDNESS_FAILURE_ON_DEPTH2_K5_SELECTOR_PRODUCT'
          b = data['scientific_boundary']
          assert b['structured_finite_hostile_family_only'] is True
          assert b['family_label_not_supplied_to_decision_core'] is True
          assert b['known_truth_not_used_by_decision_core'] is True
          assert b['absence_of_open_is_not_totality_proof'] is True
          assert b['HIGH_VOLUME_RESCUE_TOTALITY'] == 'OPEN'
          assert b['P_VS_NP'] == 'OPEN'
          print('SELECTOR_DEPTH2_STATUS=' + row['status'])
          print('SELECTOR_DEPTH2_REASON=' + row['reason'])
          print('SELECTOR_DEPTH2_N=' + str(row['N']))
          print('SELECTOR_DEPTH2_MAX_STATE_UNITS=' + str(row['max_state_units']))
          print('SELECTOR_DEPTH2_MAX_VOLUME_RATIO=' + str(row['max_volume_ratio']))
          print('SELECTOR_DEPTH2_ORDINARY=' + str(row['ordinary_elimination_events']))
          print('SELECTOR_DEPTH2_V2=' + str(row['v2_macro_rescue_events']))
          print('SELECTOR_DEPTH2_V3=' + str(row['v3_tail_rescue_events']))
          print('SELECTOR_DEPTH2_EXTENSION_COUNT=' + str(row['extension_count']))
          print('SELECTOR_DEPTH2_MISSING_BRIDGE=' + str(row['missing_bridge']))
          print('P_VS_NP=OPEN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c025-selector-product-tower-depth2
          path: selector-product-depth2.json
