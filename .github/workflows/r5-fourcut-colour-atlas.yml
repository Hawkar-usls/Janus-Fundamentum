name: R5 Kempe Coupled Involutions and Four-Cut Atlas

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-fourcut-colour-atlas.yml'
      - 'experiments/r5_kempe_coupled_involutions_n8_barrier.py'
      - 'experiments/r5_kempe_boundary_only_countermodel.py'
      - 'experiments/r5_kempe_sixpole_saturation_or_forbidden_gate.py'
      - 'experiments/r5_kempe_monodromy_square_rank22.py'
      - 'experiments/r5_kempe_physical_fiveloop_gf4_flow_witness.py'
      - 'experiments/r5_kempe_fixed_port_gf4_linear_envelope.py'
      - 'experiments/r5_kempe_min_port_rank_fibre_obstruction.py'
      - 'experiments/r5_kempe_rank1_pair_domain_firewall.py'
      - 'experiments/r5_kempe_diamond_unbounded_rank_inflation_firewall.py'
      - 'experiments/r5_kempe_six_marked_edge_trace_quotient.py'
      - 'experiments/r5_kempe_fixed_sixport_npcomplete_gadget_gate.py'
      - 'experiments/r5_kempe_allsize_bridge_planar_order_singlebit_gate.py'
      - 'experiments/r5_kempe_n14_goodonly_connected_double_cover.py'
      - 'experiments/r5_exactone_bridge_grammar_two_bit_n10.py'
      - 'experiments/r5_universal_four_cut_11_signature_substitution.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-cut-and-kempe:
    name: Full 108-state abstract model, n8 coupled witness and 11 four-pole signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 108-state Kempe matching taxonomy and n8 3-switch witness
        run: python -u experiments/r5_kempe_coupled_involutions_n8_barrier.py
      - name: Verify complete abstract Kempe countermodel at all switch depths
        run: python -u experiments/r5_kempe_boundary_only_countermodel.py
      - name: Certify universal four-switch 36-state saturation or six-switch forbidden witness
        run: python -u experiments/r5_kempe_sixpole_saturation_or_forbidden_gate.py
      - name: Verify 45 independent Kempe squares and rank-22 monodromy quotient
        run: python -u experiments/r5_kempe_monodromy_square_rank22.py
      - name: Verify physical n8 five-loop holonomy and GF2-squared circulation
        run: python -u experiments/r5_kempe_physical_fiveloop_gf4_flow_witness.py
      - name: Verify fixed-boundary GF4 linear envelope and exact n8 fibre table
        run: python -u experiments/r5_kempe_fixed_port_gf4_linear_envelope.py
      - name: Verify all-n rank-zero rigidity certificates and 1472-case minimum-rank census
        run: python -u experiments/r5_kempe_min_port_rank_fibre_obstruction.py
      - name: Verify GF4 rank-one local pair-domain contradiction and all 160 n8 two-colouring firewalls
        run: python -u experiments/r5_kempe_rank1_pair_domain_firewall.py
      - name: Verify all-size diamond signature invariance and GF4 rank plus four across 729 tuples
        run: python -u experiments/r5_kempe_diamond_unbounded_rank_inflation_firewall.py
      - name: Verify universal six-edge Klein-four trace factorization and nonlinear 87/75/99 countermodels
        run: python -u experiments/r5_kempe_six_marked_edge_trace_quotient.py
      - name: Verify NP-complete fixed six-port tuple reduction at identical trace Q on K4 prism cube Petersen
        run: python -u experiments/r5_kempe_fixed_sixport_npcomplete_gadget_gate.py
      - name: Verify all-size bridge restriction, 52 forbidden planar orders and real n14 singleton-bit gadget
        run: python -u experiments/r5_kempe_allsize_bridge_planar_order_singlebit_gate.py
      - name: Verify physically realised GOOD-only n14 connected double-cover and five-step cross-colour holonomy
        run: python -u experiments/r5_kempe_n14_goodonly_connected_double_cover.py
      - name: Verify real n10 72-state two-bit Exact-One sixpole and all-n 1815-case 3plus3 bridge theorem
        run: python -u experiments/r5_exactone_bridge_grammar_two_bit_n10.py
      - name: Verify universal 11-signature 4-pole atlas and n18 4-cut reductions
        run: python -u experiments/r5_universal_four_cut_11_signature_substitution.py
