name: TRUMP E8 subcubic all-or-none3 general-factor frontier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SUBCUBIC_ALL_OR_NONE3_GENERAL_FACTOR_FRONTIER_2026-09-26_v1.6.json'
      - 'research/tools/e8_subcubic_all_or_none3_general_factor/checker.py'
      - '.github/workflows/trump-e8-subcubic-all-or-none3-general-factor.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_subcubic_all_or_none3_general_factor/checker.py
