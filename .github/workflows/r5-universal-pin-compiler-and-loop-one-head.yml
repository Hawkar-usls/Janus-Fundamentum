name: R5 Universal Pin Compiler and Loop Theory One HEAD
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_scl_pin_to_unpinned_constant_gadget.py'
      - 'experiments/r5_universal_pinned_loop_witness_extraction_gate.py'
      - 'experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py'
      - 'research/R5_ALL_SCL_UNPINNED_PIN_COMPILER_AND_SEARCH_TO_DECISION_2026-10-13.md'
      - '.github/workflows/r5-universal-pin-compiler-and-loop-one-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-proof:
    name: Source pin compiler + unpinned SAT9 witness + conditional loop theorem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original source constant-size 10 and 11 gadget pin compiler and unpinned self reduction
        run: python -u experiments/r5_universal_scl_pin_to_unpinned_constant_gadget.py
      - name: Signed marked-loop source pin theorem and actual affine9 witness replay
        run: python -u experiments/r5_universal_pinned_loop_witness_extraction_gate.py
      - name: Source reversible loop basis and impossible-pin first-order cancellation
        run: python -u experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py
