name: JANUS TRUMP R44B P Equals NP Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R44B_P_EQUALS_NP_BRIDGE_OBLIGATION_2026-09-03.json'
      - 'research/janus_trump_r44b_verify_p_equals_np_bridge.py'
      - '.github/workflows/janus-trump-r44b-p-equals-np-bridge.yml'

permissions:
  contents: read

jobs:
  verify-conditional-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed P equals NP bridge
        run: python research/janus_trump_r44b_verify_p_equals_np_bridge.py
