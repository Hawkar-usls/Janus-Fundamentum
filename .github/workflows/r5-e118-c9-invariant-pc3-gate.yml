name: R5 E118 C9 Invariant PC3 Exact Proof Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_e118_c9_invariant_pc3.py'
      - '.github/workflows/r5-e118-c9-invariant-pc3-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c9-invariant-pc3:
    name: E118 q90 exact C9 invariant PC3 SAT/UNSAT audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-loss GF2 group averaging and exact rank/certificate on E118 90
        run: python -u experiments/r5_universal_e118_c9_invariant_pc3.py
