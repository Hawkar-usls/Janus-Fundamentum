name: TRUMP E8 Smooth C4 Diagonal Switch Frontier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_COLOR3_TRIANGLE_TERMINAL_C4_DIAGONAL_SWITCH_FRONTIER_2026-09-30_v5.3.json'
      - 'research/tools/e8_smooth_c4_diagonal_switch/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-diagonal-switch.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact smooth C4 diagonal-switch regression
        run: python research/tools/e8_smooth_c4_diagonal_switch/checker.py
