name: R5 Cubic Flow and Smith Audit
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_cubic_flow_snf_discriminator.py'
      - 'experiments/r5_universal_cubic_flow_lowmoment_collision_20v.py'
      - 'experiments/r5_universal_pfaffian_cube_k33_cancellation.py'
      - 'research/R5_UNIVERSAL_CUBIC_SCL_SMITH_AND_4FLOW_AUDIT_2026-10-11.md'
      - '.github/workflows/r5-cubic-flow-smith-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-audit:
    name: Exact finite tri-counter and rank audit (NOT universal solver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact cubic flow, matching, colouring and rank checks
        run: python experiments/r5_universal_cubic_flow_snf_discriminator.py
      - name: Exact 20-vertex moment collision SAT/UNSAT audit
        run: python experiments/r5_universal_cubic_flow_lowmoment_collision_20v.py
      - name: K3,3 signed Pfaffian cube false-negative and symbolic repair
        run: python experiments/r5_universal_pfaffian_cube_k33_cancellation.py
