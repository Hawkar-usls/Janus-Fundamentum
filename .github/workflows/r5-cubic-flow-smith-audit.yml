name: R5 Cubic Flow and Smith Audit
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_cubic_flow_snf_discriminator.py'
      - 'experiments/r5_universal_cubic_flow_lowmoment_collision_20v.py'
      - 'experiments/r5_universal_pfaffian_cube_k33_cancellation.py'
      - 'experiments/r5_universal_cubic_three_edge_cut_factorization.py'
      - 'experiments/r5_universal_cubic_nondegenerate_threecut_recognizer.py'
      - 'experiments/r5_universal_modular_flow_count_all_q_no_go.py'
      - 'experiments/r5_universal_full_precision_2adic_decision_frontier.py'
      - 'experiments/r5_universal_2adic_hamiltonian_parity_filtration.py'
      - 'research/R5_UNIVERSAL_CUBIC_SCL_SMITH_AND_4FLOW_AUDIT_2026-10-11.md'
      - '.github/workflows/r5-cubic-flow-smith-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-audit:
    name: Exact finite tri-counter and rank audit (NOT universal solver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact cubic flow, matching, colouring and rank checks
        run: python experiments/r5_universal_cubic_flow_snf_discriminator.py
      - name: Exact 20-vertex moment collision SAT/UNSAT audit
        run: python experiments/r5_universal_cubic_flow_lowmoment_collision_20v.py
      - name: K3,3 signed Pfaffian cube false-negative and symbolic repair
        run: python experiments/r5_universal_pfaffian_cube_k33_cancellation.py
      - name: Three-edge-cut S3 count factor and SAT witness gluing
        run: python experiments/r5_universal_cubic_three_edge_cut_factorization.py
      - name: Polynomial anchored maxflow search for nontrivial 3-cuts
        run: python experiments/r5_universal_cubic_nondegenerate_threecut_recognizer.py
      - name: All-fixed-modulus SAT false-zero arithmetic obstruction
        run: python experiments/r5_universal_modular_flow_count_all_q_no_go.py
      - name: High-precision 2-adic global cubic count frontier
        run: python experiments/r5_universal_full_precision_2adic_decision_frontier.py
      - name: Exact cubic 2-adic Hamiltonian parity filtration
        run: python experiments/r5_universal_2adic_hamiltonian_parity_filtration.py
