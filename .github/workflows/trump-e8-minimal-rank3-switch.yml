name: TRUMP E8 minimal rank-3 switch frontier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_MINIMAL_RANK3_SWITCH_FRONTIER_2026-09-26_v1.4.json'
      - 'research/tools/e8_minimal_rank3_switch/checker.py'
      - '.github/workflows/trump-e8-minimal-rank3-switch.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_minimal_rank3_switch/checker.py
