name: Validate C024 K Normal One Edge Exchange Growth

on:
  push:
    paths:
      - "proof_attempts/C024/GT_K_NORMAL_ONE_EDGE_EXCHANGE_GROWTH.md"
      - "experiments/direct/janus_tear_k_normal_one_edge_exchange_growth.py"
      - ".github/workflows/validate-c024-k-normal-one-edge-exchange-growth.yml"
  pull_request:
    paths:
      - "proof_attempts/C024/GT_K_NORMAL_ONE_EDGE_EXCHANGE_GROWTH.md"
      - "experiments/direct/janus_tear_k_normal_one_edge_exchange_growth.py"
      - ".github/workflows/validate-c024-k-normal-one-edge-exchange-growth.yml"

permissions:
  contents: read

jobs:
  k-normal-one-edge-exchange-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust K-normal exact one-edge exchanges
        run: python experiments/direct/janus_tear_k_normal_one_edge_exchange_growth.py
