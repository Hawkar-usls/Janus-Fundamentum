name: Validate C042 Laminar Affine Cover

on:
  push:
    paths:
      - "experiments/direct/janus_c042_laminar_affine_forbidden_cover.py"
      - "experiments/direct/janus_c042_affine_core.py"
      - "experiments/direct/janus_c042_laminar_solver.py"
      - "experiments/direct/janus_c042_laminar_verifier.py"
      - "docs/C042_LAMINAR_AFFINE_FORBIDDEN_COVER.md"
      - "proposals/C042-JANUS-LAMINAR-AFFINE-FORBIDDEN-COVER.json"
      - "registry/c042-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c042-laminar-affine-cover.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c042_laminar_affine_forbidden_cover.py"
      - "experiments/direct/janus_c042_affine_core.py"
      - "experiments/direct/janus_c042_laminar_solver.py"
      - "experiments/direct/janus_c042_laminar_verifier.py"
      - "docs/C042_LAMINAR_AFFINE_FORBIDDEN_COVER.md"
      - "proposals/C042-JANUS-LAMINAR-AFFINE-FORBIDDEN-COVER.json"
      - "registry/c042-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c042-laminar-affine-cover.yml"

permissions:
  contents: read

jobs:
  laminar-affine-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m py_compile
          experiments/direct/janus_c042_affine_core.py
          experiments/direct/janus_c042_laminar_solver.py
          experiments/direct/janus_c042_laminar_verifier.py
          experiments/direct/janus_c042_laminar_affine_forbidden_cover.py
      - run: python experiments/direct/janus_c042_laminar_affine_forbidden_cover.py --self-test --output /tmp/c042-audit.json
      - run: python -m json.tool /tmp/c042-audit.json >/dev/null
      - run: python -m json.tool proposals/C042-JANUS-LAMINAR-AFFINE-FORBIDDEN-COVER.json >/dev/null
      - run: python -m json.tool registry/c042-source-map.json >/dev/null
