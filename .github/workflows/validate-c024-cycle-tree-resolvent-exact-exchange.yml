name: Validate C024 Cycle Tree Resolvent Exact Exchange

on:
  push:
    paths:
      - "proof_attempts/C024/GT_CYCLE_TREE_RESOLVENT_EXACT_EXCHANGE.md"
      - "experiments/direct/janus_tear_cycle_tree_resolvent_exact_exchange.py"
      - ".github/workflows/validate-c024-cycle-tree-resolvent-exact-exchange.yml"
  pull_request:
    paths:
      - "proof_attempts/C024/GT_CYCLE_TREE_RESOLVENT_EXACT_EXCHANGE.md"
      - "experiments/direct/janus_tear_cycle_tree_resolvent_exact_exchange.py"
      - ".github/workflows/validate-c024-cycle-tree-resolvent-exact-exchange.yml"

permissions:
  contents: read

jobs:
  cycle-tree-resolvent-exact-exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust directed-cycle/tree resolvents
        run: python experiments/direct/janus_tear_cycle_tree_resolvent_exact_exchange.py
