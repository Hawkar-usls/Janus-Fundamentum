name: R5 F3 Quadratic Cut Certificate and GF3 Relaxation Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_triple_cut_degree2_gf3_certificate.py'
      - '.github/workflows/r5-f3-quadratic-cut-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modular-algebra:
    name: GF3 linear collision and degree-two original-source UNSAT proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact sparse GF3 Nullstellensatz identity and source-authenticated SCL21/SCL5376 certificates
        run: python -u experiments/r5_universal_triple_cut_degree2_gf3_certificate.py
