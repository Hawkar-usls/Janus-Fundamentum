name: R5 Rank Two Quotient LP Bethe False Positive Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_rank2_local_lp_bethe_spurious_fixedpoint.py'
      - '.github/workflows/r5-rank2-local-lp-bethe-false-positive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bethe:
    name: Uniform local marginal and homogeneous BP false-positive theorem
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original-source local marginals, exact algebraic Bethe value, UNSAT and high-genus controls
        run: python -u experiments/r5_universal_rank2_local_lp_bethe_spurious_fixedpoint.py
