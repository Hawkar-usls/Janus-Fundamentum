name: Validate C024 Nonroot Deep Exchange Absorption

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_deep_exchange_absorption.py"
      - "experiments/direct/janus_tear_gt_nonroot_tree_exchange_handoff.py"
      - ".github/workflows/validate-c024-nonroot-deep-exchange-absorption.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_deep_exchange_absorption.py"
      - "experiments/direct/janus_tear_gt_nonroot_tree_exchange_handoff.py"
      - ".github/workflows/validate-c024-nonroot-deep-exchange-absorption.yml"

permissions:
  contents: read

jobs:
  nonroot-deep-exchange-absorption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify finite deep exchange absorption
        run: python experiments/direct/janus_tear_gt_nonroot_deep_exchange_absorption.py
