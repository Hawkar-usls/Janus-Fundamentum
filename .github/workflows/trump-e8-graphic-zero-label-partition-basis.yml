name: TRUMP E8 Graphic Zero-Label Partition Basis

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_TENSION_ZERO_LABEL_PARTITION_BASIS_2026-09-30_v5.5.json'
      - 'research/tools/e8_graphic_zero_label_partition_basis/checker.py'
      - '.github/workflows/trump-e8-graphic-zero-label-partition-basis.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact zero-label partition-basis regression
        run: python research/tools/e8_graphic_zero_label_partition_basis/checker.py
