name: TRUMP E8 Rigid NEQ Euler Port Capacity

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RIGID_NEQ_EULER_PORT_CAPACITY_OBSTRUCTION_2026-09-30_v7.4.json'
      - 'research/tools/e8_rigid_neq_euler_port_capacity/checker.py'
      - '.github/workflows/trump-e8-rigid-neq-euler-port-capacity.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RIGID_NEQ_EULER_PORT_CAPACITY_OBSTRUCTION_2026-09-30_v7.4.json'
      - 'research/tools/e8_rigid_neq_euler_port_capacity/checker.py'
      - '.github/workflows/trump-e8-rigid-neq-euler-port-capacity.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay rigid NEQ Euler-port capacity obstruction
        run: python research/tools/e8_rigid_neq_euler_port_capacity/checker.py
