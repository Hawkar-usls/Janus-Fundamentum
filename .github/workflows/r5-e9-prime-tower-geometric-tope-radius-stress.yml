name: R5 E9 Prime-tower geometric tope-radius stress

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_PROJECTIVE_TOPE_BOUNDED_AUGMENTATION_AND_PRIME_TOWER_STRESS_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_prime_tower_geometric_tope_radius_stress.py'
      - '.github/workflows/r5-e9-prime-tower-geometric-tope-radius-stress.yml'

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_prime_tower_geometric_tope_radius_stress.py
      - name: Exhaust exact n30 and n60 arrangements
        run: python experiments/r5_e9_prime_tower_geometric_tope_radius_stress.py
