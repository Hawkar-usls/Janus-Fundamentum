name: Validate C049.1 B4.6.3 corrected Node-7 integration and Node-8 attack bootstrap

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement_verifier.py'
      - 'docs/C049_1_B4_6_3_CORRECTED_NODE7_INTEGRATION_NODE8_PARENT_REFINEMENT.md'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node7-integration-node8-parent-refinement.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement_verifier.py'
      - 'docs/C049_1_B4_6_3_CORRECTED_NODE7_INTEGRATION_NODE8_PARENT_REFINEMENT.md'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node7-integration-node8-parent-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-node7-node8-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact stacked ancestry and syntax
        run: |
          git merge-base --is-ancestor 024afebb322c67953f310af48818d3386fdcfc27 HEAD
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement.py \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement_verifier.py

      - name: Reconstruct corrected Node-7 closure in three orders
        run: |
          producer=experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement.py
          source=experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.frozen.json
          for mode in original reversed seeded-shuffle; do
            python "$producer" "$source" --entry-order "$mode" \
              --output "/tmp/c049-corrected-node8-bootstrap-$mode.json"
          done
          cmp /tmp/c049-corrected-node8-bootstrap-original.json \
              /tmp/c049-corrected-node8-bootstrap-reversed.json
          cmp /tmp/c049-corrected-node8-bootstrap-original.json \
              /tmp/c049-corrected-node8-bootstrap-seeded-shuffle.json

      - name: Independent H/V preflight replay and repaired tamper rejection
        run: |
          python \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement_verifier.py \
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.frozen.json \
            /tmp/c049-corrected-node8-bootstrap-original.json \
            --tamper-self-test

      - name: Enforce strict open boundary
        run: |
          python - <<'PY'
          import json
          p='/tmp/c049-corrected-node8-bootstrap-original.json'
          artifact=json.load(open(p))
          assert artifact['corrected_node7_reconstruction']['closure_entries']==7776
          assert artifact['node8_attack_preflight']['child_pairs']==279936
          assert artifact['node8_attack_preflight']['ordinary_hv_refinements']==70875648
          assert artifact['node8_attack_preflight']['ordinary_join_steps']==[[1,0],[0,1]]
          assert artifact['node8_attack_preflight']['diagonal_join_steps']==0
          boundary=artifact['admission_boundary']
          assert boundary['corrected_node7_executor_integration_implemented'] is False
          assert boundary['corrected_node7_integration_admitted'] is False
          assert boundary['corrected_node8_parent_refinement_started'] is False
          assert boundary['corrected_node8_parent_refinement_complete'] is False
          assert boundary['corrected_node8_parent_up_k_complete'] is False
          assert boundary['found_layout']=='FORBIDDEN'
          assert boundary['no_layout_at_cap']=='FORBIDDEN'
          assert boundary['p_vs_np']=='OPEN'
          assert artifact['next_gate_status']=='CLOSED_PENDING_CURRENT_GATE_EXACT_HEAD_ADMISSION'
          PY

      - name: Export bootstrap proof package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-corrected-node7-integration-node8-attack-bootstrap
          path: |
            /tmp/c049-corrected-node8-bootstrap-original.json
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement.py
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_integration_node8_parent_refinement_verifier.py
            docs/C049_1_B4_6_3_CORRECTED_NODE7_INTEGRATION_NODE8_PARENT_REFINEMENT.md
          retention-days: 1
