name: R5 E9 Affine F3 Parallel-Class Fixed-Point Quotient

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PARALLEL_CLASS_FIXED_POINT_QUOTIENT_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_parallel_class_fixed_point_quotient.py'
      - '.github/workflows/r5-e9-affine-f3-parallel-class-fixed-point.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact affine F3 parallel-class quotient regression
        run: python experiments/r5_e9_affine_f3_parallel_class_fixed_point_quotient.py
