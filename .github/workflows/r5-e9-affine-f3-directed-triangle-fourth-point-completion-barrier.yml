name: R5 E9 AF3 Directed-Triangle Fourth-Point Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_DIRECTED_TRIANGLE_FOURTH_POINT_COMPLETION_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_directed_triangle_fourth_point_completion_barrier.py'
      - 'experiments/r5_e9_affine_f3_rank2_cover_completeness_paley19_falsifier.py'
      - '.github/workflows/r5-e9-affine-f3-directed-triangle-fourth-point-completion-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact fourth-point completion regression
        run: python experiments/r5_e9_affine_f3_directed_triangle_fourth_point_completion_barrier.py
