name: JANUS TIME-SAT-004D4C bounded support-index source-only audit
on:
  push:
    branches: [research/time-sat-004d4c-bounded-support-20261101]
    paths:
      - experiments/direct/janus_time_sat_004d4c_*.py
      - tests/test_time_sat_004d4c_bounded_support.py
      - .github/workflows/validate-time-sat-004d4c-support-fallback.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d4c-no-solver
  cancel-in-progress: true
jobs:
  source-only-proof-coverage:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial and randomized exhaustive finite-support soundness tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4c_bounded_support.py' -v
      - name: Existing 004D4 source partition equivalence regression
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4_mixed_xor.py' -v
      - name: Standalone legacy production C023 serialized verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Exact original four SHA-pinned CNFs, zero SAT-engine calls
        run: >-
          python experiments/direct/janus_time_sat_004d4c_probe.py
          --out evidence/time_sat_004d4c
      - name: Retain original source-only analysis whether pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d4c-${{ matrix.runner }}
          path: evidence/time_sat_004d4c/result.json
          retention-days: 30
          if-no-files-found: warn
