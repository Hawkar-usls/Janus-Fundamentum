name: R5 Certified Original-SCL Symmetry Orbit UNSAT
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_source_symmetry_positive_orbit_unsat.py'
      - '.github/workflows/r5-source-symmetry-positive-orbit-unsat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive-orbit:
    name: 'All-SCL verified positive-orbit theorem and J5 original proof'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original source automorphism and independently nested conditional UNSAT
        run: python -u experiments/r5_universal_source_symmetry_positive_orbit_unsat.py
