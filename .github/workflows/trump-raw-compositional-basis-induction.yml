name: TRUMP Raw Compositional Basis Induction

on:
  push:
    branches:
      - research/trump-raw-compositional-basis-induction-2026-09-15
    paths:
      - 'research/TRUMP_RAW_COMPOSITIONAL_BASIS_INDUCTION_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_unseen_basis/compositional_basis.py'
      - 'research/tools/apma_unseen_basis/compositional_independent_checker.py'
      - '.github/workflows/trump-raw-compositional-basis-induction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-compositional-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent compositional basis checker
        shell: bash
        run: |
          set -euo pipefail
          python -m research.tools.apma_unseen_basis.compositional_independent_checker | tee /tmp/compositional-basis.json

      - name: Assert scoped verdict and firewalls
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/compositional-basis.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_RAW_COMPOSITIONAL_BASIS_INDUCTION', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO', sf
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED', sf
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Raw relation basis parent regression
        run: python -m research.tools.apma_unseen_basis.independent_checker

      - name: Inverted Pyramid regression
        run: python -m research.tools.apma_inverted_pyramid.independent_checker

      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker

      - name: Authority notice
        run: |
          echo 'SCOPED_RAW_COMPOSITIONAL_BASIS_INDUCTION_ONLY'
          echo 'CONNECTED_MIXED_CORE_SOLVED=NO'
          echo 'CARTESIAN_PRODUCT=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
