name: TRUMP E8 Graphic Syndrome Rank3 Distinct K4

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_SYNDROME_RANK3_DISTINCT_K4_CLASSIFICATION_2026-09-30_v5.9.json'
      - 'research/tools/e8_graphic_syndrome_rank3_distinct_k4/checker.py'
      - '.github/workflows/trump-e8-graphic-syndrome-rank3-distinct-k4.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact PG23/K4 rank3 distinct regression
        run: python research/tools/e8_graphic_syndrome_rank3_distinct_k4/checker.py
