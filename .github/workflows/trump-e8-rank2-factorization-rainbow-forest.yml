name: TRUMP E8 Rank2 Factorization Rainbow Forest

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RANK2_FACTORIZATION_RAINBOW_FOREST_BARRIER_2026-09-30_v3.7.json'
      - 'research/tools/e8_rank2_factorization_rainbow_forest/checker.py'
      - '.github/workflows/trump-e8-rank2-factorization-rainbow-forest.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rank2/rainbow-forest regression
        run: python research/tools/e8_rank2_factorization_rainbow_forest/checker.py
