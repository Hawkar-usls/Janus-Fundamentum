name: JANUS TRUMP R50G25BA25 authoritative reconstruction hardened V2

on:
  push:
    branches:
      - research/r50g25ba25-variable-localized-hybrid-factor-graph-fpt-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-ba25-authoritative-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact append-only BA25 hardened ancestry
        shell: bash
        run: |
          set -euo pipefail
          PARENT=187c985d67cdfd896ae58d335635bc73ae02c5ae
          PREREG=466e839107f224cdf6ea7ec5294eef8bd9003cd6
          IMPL=1b7f9be5dd94f346a6ba4102ab6900f541b5c14e
          VERIFY_V1=a7caa09fabab4cbfc1dcb9a7bdb5e260010cc2f5
          PRESEAL_V1=d208790d54b897d79cc12de50a5ac91da9441cbf
          WORKFLOW_V1=2060789ebd89dd0aa75f3901802d4c30a0d61a30
          GAP=a9eb4a65d0fa9c57fc70603ba63037f57ed479cf
          HARD=1ca79fa8078e0428cae669d47df72354e59f06c2
          VERIFY_V2=57649038bd8b35e74464c878c0c15f81f3ff8ad1
          PRESEAL_V2=bf5a2de761caf664a3eca8ba3059e382b1d011ba
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PRESEAL_V2"
          git merge-base --is-ancestor "$PARENT" "$PREREG"
          git merge-base --is-ancestor "$PREREG" "$IMPL"
          git merge-base --is-ancestor "$IMPL" "$VERIFY_V1"
          git merge-base --is-ancestor "$VERIFY_V1" "$PRESEAL_V1"
          git merge-base --is-ancestor "$PRESEAL_V1" "$WORKFLOW_V1"
          git merge-base --is-ancestor "$WORKFLOW_V1" "$GAP"
          git merge-base --is-ancestor "$GAP" "$HARD"
          git merge-base --is-ancestor "$HARD" "$VERIFY_V2"
          git merge-base --is-ancestor "$VERIFY_V2" "$PRESEAL_V2"
          git merge-base --is-ancestor "$PRESEAL_V2" HEAD
          test "$(git show ${PREREG}:research/JANUS_TRUMP_R50G25BA25_PREREGISTRATION.json | python -c 'import json,sys; x=json.load(sys.stdin); print(x["state"])')" = "FROZEN_BEFORE_IMPLEMENTATION"
          test "$(git show ${PREREG}:research/JANUS_TRUMP_R50G25BA25_PREREGISTRATION.json | python -c 'import json,sys; x=json.load(sys.stdin); print(len(x["required_passes"]))')" = "34"
          test "$(python -c 'import json; x=json.load(open("research/JANUS_TRUMP_R50G25BA25_SOURCE_RECONSTRUCTION_EVIDENCE_GAP_RECEIPT.json")); print(str(x["historical_green_run"]["scientific_authority"]).lower())')" = "false"
          test "$(python -c 'import json; x=json.load(open("research/JANUS_TRUMP_R50G25BA25_SOURCE_RECONSTRUCTION_EVIDENCE_GAP_RECEIPT.json")); print(x["historical_green_run"]["scientific_result"])')" = "NOT_PROMOTED"

      - name: Build exact BA25 proof-carrying result
        run: python research/janus_trump_r50g25ba25.py > ba25_result.json

      - name: Independent BA25 theorem replay V1
        run: python research/verify_janus_trump_r50g25ba25.py

      - name: Independent sealed source-reconstruction replay V2
        run: python research/verify_janus_trump_r50g25ba25_v2.py

      - name: Complete hardened BA25 preseal V2
        run: python research/preseal_janus_trump_r50g25ba25_v2.py

      - name: Enforce authoritative BA25 V2 promotion guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          OLD_RUN = 34410959446
          OLD_HEAD = '2060789ebd89dd0aa75f3901802d4c30a0d61a30'
          p=json.load(open('research/JANUS_TRUMP_R50G25BA25_PREREGISTRATION.json'))
          gap=json.load(open('research/JANUS_TRUMP_R50G25BA25_SOURCE_RECONSTRUCTION_EVIDENCE_GAP_RECEIPT.json'))
          r=json.load(open('ba25_result.json'))
          v1=json.load(open('ba25_verify.json'))
          v2=json.load(open('ba25_verify_v2.json'))
          c=json.load(open('ba25_completion_v2.json'))
          run_id=int(os.environ['GITHUB_RUN_ID'])
          head=os.environ['GITHUB_SHA']
          assert run_id != OLD_RUN
          assert head != OLD_HEAD
          assert gap['historical_green_run']['run_id'] == OLD_RUN
          assert gap['historical_green_run']['scientific_authority'] is False
          assert gap['historical_green_run']['scientific_result'] == 'NOT_PROMOTED'
          assert gap['historical_green_run']['must_never_be_retroactively_promoted_to_authoritative'] is True
          names=p['required_passes']
          assert p['state']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert len(names)==34 and len(set(names))==34
          assert r['required']==34 and r['P_BA25_FINAL']==0 and r['falsifiers']==[]
          assert v1['status']=='PASS' and v1['implementation_imported'] is False and v1['falsifiers']==[]
          assert v2['status']=='PASS' and v2['implementation_imported'] is False and v2['falsifiers']==[]
          assert v2['sealed_parent_reconstruction_replay'] is True
          assert int(v2['number_of_replayed_cases']) > 0
          assert int(v2['original_CNF_validation_failures']) == 0
          assert int(v2['parent_reconstruction_formula_mismatches']) == 0
          assert int(v2['abstract_source_validation_failures']) == 0
          assert v2['SOURCE_RECONSTRUCTION_PASS'] is True
          a=v2['assertions']
          assert a['LOCAL_BA25_RECONSTRUCTION_CONTROLS_PASS'] is True
          assert a['SEALED_BA20_BA21_RECONSTRUCTION_EXPLICIT_REPLAY_PASS'] is True
          assert a['DIRECT_ORIGINAL_BA4_CNF_ZERO_BAD_CLAUSES'] is True
          assert a['SOURCE_RECONSTRUCTION_PASS'] is True
          expected={
            'BA20_final_meta': {'commit':'fa0b503233cb873282c0d8317adf89e48223402b','blob':'a09eae8aa44b68530a5d24e542056c13a24ab865'},
            'BA20_result_receipt': {'commit':'ef963eba447b1d88ef13eddc9b888138be4f4565','blob':'ed11ffc951eec1bf1a1c01d60699876f8a408018'},
            'BA20_base_reconstruction': {'commit':'6e895880f2cebeddd0ee72d6b90704d62434bc67','blob':'c3112e59a213bf297d1bd757e251905f64d5900b'},
            'BA20_authoritative_v2_wrapper': {'commit':'ff94c204051d173ca4fabb51ad33e3260d13d7c0','blob':'6c2271f18677cebc9c37eab42c42b8228b41967b'},
            'BA4_carrier_schema': {'blob':'c85eab7d0bb1557bc0c472bbc8c2086b08625a4c'},
            'BA21_final_meta': {'commit':'085bcdec8cd7613ad99e8766894010e6dd3d8fe4','blob':'e5f66732279c1b26b4f9a1fd991d4055eac9209e'},
            'BA21_result_receipt': {'commit':'dd3cd439bffd67dd33790be83e719625310c0726','blob':'d94b91c7ed4b8bb3cce7efb52d02813bb222916a'},
            'BA21_compressed_projection_impl': {'commit':'8da4e0560bdbbc31d94e7e4ab65a098222e5f5c1','blob':'22b891038e34dedcb53b75a74563cbe535c55e21'},
            'hardening': {'commit':'1ca79fa8078e0428cae669d47df72354e59f06c2','blob':'f3f4f8da6240ca061c3085726d9ada1bfe6823df'},
          }
          schema=v2['reconstruction_schema_hash_provenance']
          core={k:schema[k] for k in expected}
          assert core == expected
          expected_hash=hashlib.sha256(json.dumps(core,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert schema['schema_sha256'] == expected_hash
          assert v2['parent_BA20_commit']=='fa0b503233cb873282c0d8317adf89e48223402b'
          assert v2['parent_BA21_commit']=='085bcdec8cd7613ad99e8766894010e6dd3d8fe4'
          assert c['status']=='PRESEAL_V2_PASS_PENDING_NEW_AUTHORITATIVE_WORKFLOW_V2'
          assert c['scientific_authority'] is False
          assert c['P_BA25_FINAL']==1
          assert c['P_BA25_FINAL_authority']=='CANDIDATE_ONLY_UNTIL_NEW_AUTHORITATIVE_WORKFLOW_V2_RUN'
          assert c['SOURCE_RECONSTRUCTION_PASS'] is True
          assert c['sealed_parent_reconstruction_replay'] is True
          assert int(c['number_of_replayed_cases']) == int(v2['number_of_replayed_cases'])
          assert int(c['original_CNF_validation_failures']) == 0
          assert c['passes']==34 and c['required']==34 and c['falsifiers']==[]
          assert set(c['pass_map'])==set(names) and all(c['pass_map'].values())
          assert c['checks']['legacy_verifier_independent_pass'] is True
          assert c['checks']['verifier_v2_independent_pass'] is True
          assert c['checks']['runtime_sealed_parent_replay_true'] is True
          assert c['checks']['runtime_replayed_cases_gt_zero'] is True
          assert c['checks']['runtime_original_cnf_zero_failures'] is True
          assert c['checks']['runtime_parent_formula_zero_mismatches'] is True
          assert c['checks']['runtime_abstract_source_zero_failures'] is True
          assert c['checks']['exact_parent_commit_blob_receipt_schema'] is True
          assert c['nonclaims']['SAT_IN_P']=='NOT_PROVED'
          assert c['nonclaims']['P_VS_NP']=='OPEN'
          assert c['STOP']['BA26_started'] is False
          auth={
            'gate':p['gate'],
            'entry_type':'BA25_AUTHORITATIVE_WORKFLOW_V2_RUNTIME_PROMOTION',
            'scientific_authority':True,
            'P_BA25_FINAL':1,
            'run_id':run_id,
            'workflow_head':head,
            'passes':34,
            'required':34,
            'both_independent_verifier_layers':'PASS',
            'SOURCE_RECONSTRUCTION_PASS':True,
            'sealed_parent_reconstruction_replay':True,
            'number_of_replayed_cases':int(v2['number_of_replayed_cases']),
            'original_CNF_validation_failures':0,
            'parent_reconstruction_formula_mismatches':0,
            'abstract_source_validation_failures':0,
            'parent_BA20_commit':v2['parent_BA20_commit'],
            'parent_BA21_commit':v2['parent_BA21_commit'],
            'reconstruction_schema_hash':schema['schema_sha256'],
            'falsifiers':[],
            'historical_run_34410959446':'UNSEALED_SOURCE_RECONSTRUCTION_EVIDENCE_GAP_NOT_PROMOTED',
            'firewalls':{'SAT_IN_P':'NOT_PROVED','P_VS_NP':'OPEN','BA26_started':False},
            'post_seal_required':['TRUMP_EXTERNAL_LITERATURE_NOVELTY_EQUIVALENCE_AUDIT','TRUMP_GENERAL_SAT_GAP_MAP'],
          }
          open('ba25_authoritative_v2.json','w').write(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          print('P_BA25_FINAL=1')
          print('BA25_AUTHORITATIVE_V2_RUN_ID='+str(run_id))
          print('BA25_AUTHORITATIVE_V2_REPLAYED_CASES='+str(auth['number_of_replayed_cases']))
          print('BA25_AUTHORITATIVE_V2_ORIGINAL_CNF_VALIDATION_FAILURES=0')
          PY

      - name: Hash BA25 authoritative V2 evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            ba25_result.json \
            ba25_verify.json \
            ba25_verify_v2.json \
            ba25_completion_v2.json \
            ba25_authoritative_v2.json \
            > ba25_sha256_v2.txt
          cat ba25_sha256_v2.txt

      - name: Upload BA25 authoritative V2 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba25-authoritative-v2-result
          path: |
            ba25_result.json
            ba25_verify.json
            ba25_verify_v2.json
            ba25_completion_v2.json
            ba25_authoritative_v2.json
            ba25_sha256_v2.txt
          if-no-files-found: error

      - name: Report artifact digest
        shell: bash
        run: |
          echo "BA25_AUTHORITATIVE_V2_ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "BA25_AUTHORITATIVE_V2_ARTIFACT_DIGEST=${{ steps.upload.outputs.artifact-digest }}"
