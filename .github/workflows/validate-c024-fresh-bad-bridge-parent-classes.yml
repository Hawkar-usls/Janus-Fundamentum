name: Validate C024 Fresh Bad Bridge Parent Classes

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_fresh_bad_bridge_parent_class_certificate.py"
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - ".github/workflows/validate-c024-fresh-bad-bridge-parent-classes.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_fresh_bad_bridge_parent_class_certificate.py"
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - ".github/workflows/validate-c024-fresh-bad-bridge-parent-classes.yml"

permissions:
  contents: read

jobs:
  fresh-bad-bridge-parent-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certify finite mixed parent class
        run: python experiments/direct/janus_tear_gt_fresh_bad_bridge_parent_class_certificate.py
