name: JANUS TIME-SAT-004D6 source-only bounded resolution proof replay
on:
  push:
    branches: [research/time-sat-004d6-bounded-source-resolution-20261102]
    paths:
      - experiments/direct/janus_time_sat_004d6_*.py
      - tests/test_time_sat_004d6_resolution.py
      - .github/workflows/validate-time-sat-004d6-resolution.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d6-source-proof
  cancel-in-progress: true
jobs:
  bounded-source-witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source resolution DAG tamper and exhaustive entailment controls
        run: python -m unittest discover -s tests -p 'test_time_sat_004d6_resolution.py' -v
      - name: Previous 004D5 binary witness regression
        run: python -m unittest discover -s tests -p 'test_time_sat_004d5_binary_scc.py' -v
      - name: Previous 004D4D paged parity regression
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4d_paged_support.py' -v
      - name: Existing C023 independent serialized verifier unchanged
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Preregistered four exact public original CNF source-only probe
        run: >-
          python experiments/direct/janus_time_sat_004d6_probe.py
          --out evidence/time_sat_004d6
      - name: Preserve all positive and negative source-original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d6-${{ matrix.os }}
          path: evidence/time_sat_004d6/result.json
          if-no-files-found: warn
          retention-days: 30
