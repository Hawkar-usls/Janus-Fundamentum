name: R5 E9 strong odd-cycle det2 transfer

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_STRONG_ODD_CYCLE_DET2_TRANSFER_NORMAL_FORM_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_strong_odd_cycle_det2_transfer.py'
      - '.github/workflows/r5-e9-strong-odd-cycle-det2-transfer.yml'
  pull_request:
    paths:
      - 'research/R5_E9_STRONG_ODD_CYCLE_DET2_TRANSFER_NORMAL_FORM_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_strong_odd_cycle_det2_transfer.py'
      - '.github/workflows/r5-e9-strong-odd-cycle-det2-transfer.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact transfer replay
        run: python experiments/r5_e9_strong_odd_cycle_det2_transfer.py
