name: R5 Tutte Deficit Local Trap
on:
  push:
    branches:
      - research/r5-tutte-deficit-local-trap-20261014
      - research/r5-cooperative-coverage-20261015
    paths:
      - "experiments/r5_tutte_deficit_local_trap_20261014.py"
      - "docs/r5_tutte_deficit_local_trap_checkpoint_20261014.md"
      - ".github/workflows/r5-tutte-deficit-local-trap.yml"
      - "experiments/r5_tutte_hall_decomposition_20261014.py"
      - "docs/r5_tutte_hall_decomposition_checkpoint_20261014.md"
      - "experiments/r5_global_cut_hall_clause_20261015.py"
      - "docs/r5_global_cut_hall_clause_checkpoint_20261015.md"
      - "experiments/r5_global_quantitative_hall_repair_20261015.py"
      - "docs/r5_global_quantitative_hall_repair_checkpoint_20261015.md"
      - "experiments/r5_static_independent_hall_dual_20261015.py"
      - "docs/r5_static_independent_hall_dual_checkpoint_20261015.md"
      - "experiments/r5_adaptive_gearbox_exact_coloring_20261015.py"
      - "docs/r5_adaptive_gearbox_exact_search_checkpoint_20261015.md"
      - "experiments/r5_polynomial_budget_multi_engine_20261015.py"
      - "docs/r5_polynomial_budget_multi_engine_checkpoint_20261015.md"
      - "experiments/r5_cooperative_scl_coverage_20261015.py"
      - "docs/r5_cooperative_universal_progress_checkpoint_20261015.md"
  pull_request:
    paths:
      - "experiments/r5_tutte_deficit_local_trap_20261014.py"
      - "docs/r5_tutte_deficit_local_trap_checkpoint_20261014.md"
      - ".github/workflows/r5-tutte-deficit-local-trap.yml"
      - "experiments/r5_tutte_hall_decomposition_20261014.py"
      - "docs/r5_tutte_hall_decomposition_checkpoint_20261014.md"
      - "experiments/r5_global_cut_hall_clause_20261015.py"
      - "docs/r5_global_cut_hall_clause_checkpoint_20261015.md"
      - "experiments/r5_global_quantitative_hall_repair_20261015.py"
      - "docs/r5_global_quantitative_hall_repair_checkpoint_20261015.md"
      - "experiments/r5_static_independent_hall_dual_20261015.py"
      - "docs/r5_static_independent_hall_dual_checkpoint_20261015.md"
      - "experiments/r5_adaptive_gearbox_exact_coloring_20261015.py"
      - "docs/r5_adaptive_gearbox_exact_search_checkpoint_20261015.md"
      - "experiments/r5_polynomial_budget_multi_engine_20261015.py"
      - "docs/r5_polynomial_budget_multi_engine_checkpoint_20261015.md"
      - "experiments/r5_cooperative_scl_coverage_20261015.py"
      - "docs/r5_cooperative_universal_progress_checkpoint_20261015.md"
  workflow_dispatch:

jobs:
  finite-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay exact finite deficit certificate
        run: python3 experiments/r5_tutte_deficit_local_trap_20261014.py
      - name: Replay Hall imbalance and global cut-switch certificates
        run: python3 experiments/r5_tutte_hall_decomposition_20261014.py
      - name: Verify global Hall cut certificates and cutspace exchange
        run: python3 experiments/r5_global_cut_hall_clause_20261015.py
      - name: Replay quantitative Hall repair capacity for all finite Hall sets
        run: python3 experiments/r5_global_quantitative_hall_repair_20261015.py
      - name: Replay all-state static Hall dual and Petersen convex integrality gap
        run: python3 experiments/r5_static_independent_hall_dual_20261015.py
      - name: Replay adaptive exact gearbox (3 fixed gears and switching, budget resume)
        run: python3 experiments/r5_adaptive_gearbox_exact_coloring_20261015.py --self-test
      - name: Replay polynomial-budgeted two-engine gearbox (SAT UNSAT UNKNOWN resume)
        run: python3 experiments/r5_polynomial_budget_multi_engine_20261015.py --self-test
      - name: Replay SCL-native cooperative GF2 and cardinality exchange
        run: python3 experiments/r5_cooperative_scl_coverage_20261015.py --self-test
