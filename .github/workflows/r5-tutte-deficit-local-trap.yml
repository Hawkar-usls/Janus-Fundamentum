name: R5 Tutte Deficit Local Trap
on:
  push:
    branches:
      - research/r5-tutte-deficit-local-trap-20261014
    paths:
      - "experiments/r5_tutte_deficit_local_trap_20261014.py"
      - "docs/r5_tutte_deficit_local_trap_checkpoint_20261014.md"
      - ".github/workflows/r5-tutte-deficit-local-trap.yml"
      - "experiments/r5_tutte_hall_decomposition_20261014.py"
      - "docs/r5_tutte_hall_decomposition_checkpoint_20261014.md"
  pull_request:
    paths:
      - "experiments/r5_tutte_deficit_local_trap_20261014.py"
      - "docs/r5_tutte_deficit_local_trap_checkpoint_20261014.md"
      - ".github/workflows/r5-tutte-deficit-local-trap.yml"
      - "experiments/r5_tutte_hall_decomposition_20261014.py"
      - "docs/r5_tutte_hall_decomposition_checkpoint_20261014.md"
  workflow_dispatch:

jobs:
  finite-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay exact finite deficit certificate
        run: python3 experiments/r5_tutte_deficit_local_trap_20261014.py
      - name: Replay Hall imbalance and global cut-switch certificates
        run: python3 experiments/r5_tutte_hall_decomposition_20261014.py
