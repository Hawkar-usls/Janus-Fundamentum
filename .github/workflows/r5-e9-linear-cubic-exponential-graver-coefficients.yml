name: R5 E9 Linear-cubic exponential Graver coefficients

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_LINEAR_CUBIC_EXPONENTIAL_GRAVER_COEFFICIENT_FAMILY_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_linear_cubic_exponential_graver_coefficients.py'
      - '.github/workflows/r5-e9-linear-cubic-exponential-graver-coefficients.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_linear_cubic_exponential_graver_coefficients.py
      - name: Replay exact finite controls
        run: python experiments/r5_e9_linear_cubic_exponential_graver_coefficients.py
