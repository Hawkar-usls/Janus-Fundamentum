name: TRUMP six-positive singleton-constraint corollary

on:
  push:
    branches:
      - research/trump-wl-singleton-constraint-exact-swap-theorem-2026-09-18
    paths-ignore:
      - 'research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_RESULT_2026-09-18_v1.0.json'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen corollary authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_PREREGISTRATION_2026-09-18_v1.0.json':'d0e25c69006f2e54ee8d52e4d3c06ce213e943af',
            'research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_REVIEW_2026-09-18_v1.0.json':'9ac39a874395fd03c920d3a069cafc0dc5fbf1f7',
            'research/TRUMP_WL_SINGLETON_CONSTRAINT_EXACT_SWAP_THEOREM_RESULT_2026-09-18_v1.0.json':'eda86821031e43dad76ff81f7239d3ca27387cc7',
            'research/TRUMP_WL_DIRECT_EXACT_E3_SCOPE_BOUND_THEOREM_RESULT_2026-09-18_v1.0.json':'3cbf05cb0b0249ddf365bc43d176a06ddb7f72af',
            'research/tools/trump_wl_singleton_constraint_six_positive_corollary/candidate.py':'10918864fb1a6d683490faff9b29abf4d0191a29',
            'research/tools/trump_wl_singleton_constraint_six_positive_corollary/independent_check.py':'5aa8a13809f8937232e9bd5746c7f79de7aa0bf3',
          }
          def blob(p):
            d=Path(p).read_bytes()
            return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          bad={p:(h,blob(p)) for p,h in expected.items() if blob(p)!=h}
          if bad: raise SystemExit(f'AUTHORITY_BINDING_FAILURE {bad}')
          print('SIX_POSITIVE_COROLLARY_AUTHORITY_PASS')
          PY

      - name: Execute source-bound corollary measurement
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/trump_wl_singleton_constraint_six_positive_corollary/candidate.py > /tmp/corollary_candidate.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/corollary_candidate.json'))
          print(json.dumps({'verdict':x.get('verdict'),'summary':x.get('summary'),'rows':x.get('rows'),'resource_receipt':x.get('resource_receipt')},indent=2))
          PY

      - name: Independent corollary recomputation
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/trump_wl_singleton_constraint_six_positive_corollary/independent_check.py --candidate /tmp/corollary_candidate.json > /tmp/corollary_independent.json
          python -m json.tool /tmp/corollary_independent.json

      - name: Build frozen corollary result
        shell: bash
        env:
          WORKFLOW_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.load(open('/tmp/corollary_candidate.json'))
          k=json.load(open('/tmp/corollary_independent.json'))
          independent_pass=k.get('verdict')=='PASS_INDEPENDENT_SIX_SOURCE_COROLLARY_RECOMPUTATION'
          summary=k.get('summary') if independent_pass else c.get('summary')
          count=(summary or {}).get('applicability_count')
          if independent_pass and count==6:
            status='ALL_SIX_PROSPECTIVE_POSITIVES_FALL_INSIDE_THE_NO_DIRECT_CHECK_SUBCLASS'
          elif independent_pass and isinstance(count,int) and count>0:
            status='PARTIAL_SOURCE_BOUND_APPLICABILITY_OF_NO_DIRECT_CHECK_SUBCLASS'
          elif independent_pass:
            status='THEOREM_FORMAL_BUT_ZERO_OF_SIX_PROSPECTIVE_POSITIVES_IN_SUBCLASS'
          else:
            status='INDEPENDENT_COROLLARY_RECOMPUTATION_FAILED'
          result={
            'artifact_id':'JANUS-TRUMP-WL-SINGLETON-CONSTRAINT-SIX-POSITIVE-COROLLARY-RESULT-2026-09-18-v1.0',
            'date':'2026-09-18',
            'status':'FROZEN_SIX_POSITIVE_SOURCE_BOUND_COROLLARY_RESULT',
            'scientific_outcome':status,
            'claim_ceiling':'SOURCE_BOUND_APPLICABILITY_COROLLARY_ON_SIX_ALREADY_FROZEN_PROSPECTIVE_POSITIVES_ONLY',
            'authorities':{
              'theorem_commit':'7b3bb517f054312921e1943e235a927c3adbefc2',
              'theorem_blob':'eda86821031e43dad76ff81f7239d3ca27387cc7',
              'preregistration_commit':'d0f028761a8041028bdcbafa556101ca49a6d15d',
              'preregistration_blob':'d0e25c69006f2e54ee8d52e4d3c06ce213e943af',
              'review_commit':'b032d6228474a811b1312c0408315738a13ea1a7',
              'review_blob':'9ac39a874395fd03c920d3a069cafc0dc5fbf1f7',
              'candidate_commit':'bc0b18ccedc54a772059e6100b3a31f058033a37',
              'candidate_blob':'10918864fb1a6d683490faff9b29abf4d0191a29',
              'independent_checker_commit':'7818cf675b9f05a9414fb2426d14b69bb9c375e5',
              'independent_checker_blob':'5aa8a13809f8937232e9bd5746c7f79de7aa0bf3',
              'workflow_head':os.environ['WORKFLOW_HEAD'],
            },
            'execution':{
              'run_id':int(os.environ['RUN_ID']),
              'run_attempt':int(os.environ['RUN_ATTEMPT']),
              'run_number':int(os.environ['RUN_NUMBER']),
              'candidate_verdict':c.get('verdict'),
              'independent_verdict':k.get('verdict'),
              'candidate_imported_by_independent_checker':False,
            },
            'rows':k.get('rows') if independent_pass else c.get('rows'),
            'summary':summary,
            'resource_receipt':{
              'candidate':c.get('resource_receipt'),
              'independent':k.get('resource_receipt'),
              'direct_exact_check_calls_total':0,
              'e3_discovery_calls_total':0,
              'solver_calls_total':0,
            },
            'captain_obvious_readout':{
              'current_status':status,
              'directive':'KEEP_THE_NO_DIRECT_CHECK_LICENSE_SCOPED_TO_THE_FORMAL_SINGLETON_CONSTRAINT_SUBCLASS',
              'nearest_missing_obligation':(
                'IF_COVERAGE_IS_PARTIAL_OR_ZERO_IDENTIFY_A_PREDECLARED_FORMAL_WEAKENING_OF_THE_SINGLETON_CONSTRAINT_PREMISE_RATHER_THAN_RETUNING_TO_THE_SIX_ROWS'
                if count!=6 else
                'INTEGRATE_THE_THEOREM_AS_A_SOUND_FAST_PATH_BEFORE_DIRECT_EXACT_CHECK_WHILE_RETAINING_THE_OLD_CHECK_AS_FALLBACK_OUTSIDE_SCOPE'
              )
            },
            'scientific_firewall':{
              'WL_SUFFICIENCY_WITHOUT_DIRECT_EXACT_CHECK':'PROVED_ONLY_FOR_EXPLICIT_SINGLETON_CONSTRAINT_R000_R111_SUBCLASS',
              'GENERAL_SAT_IN_P':'NOT_PROVED',
              'P_VS_NP':'OPEN',
            },
          }
          Path('research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_RESULT_2026-09-18_v1.0.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'scientific_outcome':status,'summary':summary,'execution':result['execution'],'captain':result['captain_obvious_readout']},indent=2))
          PY

      - name: Upload immutable corollary receipts
        uses: actions/upload-artifact@v4
        with:
          name: singleton-constraint-six-positive-corollary-${{ github.run_id }}
          path: |
            /tmp/corollary_candidate.json
            /tmp/corollary_independent.json
            research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_RESULT_2026-09-18_v1.0.json

      - name: Freeze corollary result with safe fast-forward push
        shell: bash
        env:
          BRANCH: research/trump-wl-singleton-constraint-exact-swap-theorem-2026-09-18
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/TRUMP_WL_SINGLETON_CONSTRAINT_SIX_POSITIVE_COROLLARY_RESULT_2026-09-18_v1.0.json
          git commit -m "TRUMP freeze six-positive singleton-constraint theorem corollary"
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/$BRANCH)" ]; then
            git rebase "origin/$BRANCH"
          fi
          git push origin "HEAD:$BRANCH"
