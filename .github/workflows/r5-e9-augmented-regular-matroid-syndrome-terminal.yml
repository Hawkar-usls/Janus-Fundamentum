name: R5 E9 Augmented regular-matroid syndrome terminal

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_AUGMENTED_REGULAR_MATROID_SYNDROME_POLY_TERMINAL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_augmented_regular_matroid_syndrome_terminal.py'
      - '.github/workflows/r5-e9-augmented-regular-matroid-syndrome-terminal.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_augmented_regular_matroid_syndrome_terminal.py
      - name: Replay exact regular controls
        run: python experiments/r5_e9_augmented_regular_matroid_syndrome_terminal.py
