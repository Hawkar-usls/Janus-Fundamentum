name: R5 E9 Kochen-Specker Theta Countercarrier

on:
  push:
    paths:
      - 'research/R5_E9_KOCHEN_SPECKER_THETA_EQUALITY_COUNTERCARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_kochen_specker_theta_equality_countercarrier.py'
      - '.github/workflows/r5-e9-kochen-specker-theta-countercarrier.yml'
  workflow_dispatch:

jobs:
  exact-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_kochen_specker_theta_equality_countercarrier.py
      - name: Run exact generator and hostile control
        run: python experiments/r5_e9_kochen_specker_theta_equality_countercarrier.py
