name: TRUMP E8 C4 Alternate Path Decomposition Constant Width Control

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_ALTERNATE_PATH_DECOMPOSITION_CONSTANT_WIDTH_CONTROL_2026-10-01_v8.6.1.json'
      - 'research/tools/e8_c4_alternate_path_decomposition_constant_width/checker.py'
      - '.github/workflows/trump-e8-c4-alternate-path-decomposition-constant-width.yml'
  workflow_dispatch:

jobs:
  exact-constant-width-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact alternate path-decomposition checker
        run: python3 research/tools/e8_c4_alternate_path_decomposition_constant_width/checker.py
