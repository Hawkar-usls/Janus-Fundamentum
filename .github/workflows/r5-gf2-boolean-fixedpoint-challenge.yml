name: R5 GF2 Boolean Closure Universal Completeness Challenge
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_gf2_boolean_fixedpoint_closure.py'
      - '.github/workflows/r5-gf2-boolean-fixedpoint-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixpoint:
    name: 'All original GF2 proof ledger plus Boolean Exact-One least fixed point, SAT/UNSAT dual controls'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GF2/Boolean alternating proof replay and connected cubic failure-of-completeness
        run: python -u experiments/r5_universal_certified_gf2_boolean_fixedpoint_closure.py
