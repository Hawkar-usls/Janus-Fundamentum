name: PIPPI 50x50 Cycle1 Resource Reaudit

on:
  push:
    branches:
      - research/janus-keymaster-calibration-pivot-slime-topa-2026-08-28
    paths:
      - 'experiments/mad_lab/pippi_50x50_cycle0_resource_reaudit.py'
      - '.github/workflows/reaudit-50x50-cycle1-resource.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure PyTorch CPU
        shell: bash
        run: |
          set -euo pipefail
          if ! python -c 'import torch; print(torch.__version__)'; then
            python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          fi
      - name: Compile
        run: |
          python -m py_compile \
            experiments/mad_lab/juxtapose_50x50_multiformula_corpus.py \
            experiments/mad_lab/keymaster_50x50_cycle1_teacher_slime.py \
            experiments/mad_lab/pippi_50x50_cycle0_resource_reaudit.py
      - name: Rebuild deterministic 32-formula corpus
        run: |
          mkdir -p artifacts/reaudit
          python -m experiments.mad_lab.juxtapose_50x50_multiformula_corpus \
            --count 32 --train-count 24 --max-seed 5000 \
            --json-out artifacts/reaudit/corpus.json
      - name: Reproduce deterministic Cycle1 model result
        run: |
          python -m experiments.mad_lab.keymaster_50x50_cycle1_teacher_slime \
            --corpus artifacts/reaudit/corpus.json \
            --json-out artifacts/reaudit/cycle1.json \
            --spider-edge-out artifacts/reaudit/spider_train_edge_state.jsonl
      - name: Re-audit implemented cached data-generation cost
        run: |
          python -m experiments.mad_lab.pippi_50x50_cycle0_resource_reaudit \
            --corpus artifacts/reaudit/corpus.json \
            --cycle1 artifacts/reaudit/cycle1.json \
            --out artifacts/reaudit/pippi_resource_reaudit.json
      - name: Accounting firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/reaudit/pippi_resource_reaudit.json').read_text())
          assert r['status']=='PASS__CROSS_FORMULA_CACHE_REUSE_ACCOUNTED'
          assert r['P_VS_NP']=='OPEN'
          imp=r['implemented_cached_generator']
          cf=r['route_equivalent_counterfactual']
          assert imp['unique_transition_computations']==11560
          assert imp['cross_formula_cache_reuse_enabled'] is True
          assert imp['actual_unique_transition_pair_work']==3297784
          assert imp['actual_unique_transition_pair_work'] < cf['exhaustive_pair_work']
          assert r['pair_work_accounting_horizon']['PAIR_WORK_RESOURCE_POSITIVE'] is False
          assert r['global_resource_statement']['GLOBAL_RESOURCE_POSITIVE']=='UNKNOWN'
          assert r['separate_model_training_resource']['pair_work_conversion_declared'] is False
          assert r['firewall']['DO_NOT_ADD_PAIR_WORK_AND_SECONDS'] is True
          print('PIPPI_RESOURCE_REAUDIT=PASS')
          print(json.dumps(r['implemented_cached_generator'],sort_keys=True))
          print(json.dumps(r['pair_work_accounting_horizon'],sort_keys=True))
          print('GLOBAL_RESOURCE_POSITIVE=UNKNOWN')
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pippi-50x50-cycle1-resource-reaudit
          path: artifacts/reaudit
          if-no-files-found: error
          retention-days: 90
