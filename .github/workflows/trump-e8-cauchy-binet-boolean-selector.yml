name: TRUMP E8 Cauchy-Binet Boolean selector

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_CAUCHY_BINET_BOOLEAN_SELECTOR_2026-09-26_v0.3.json'
      - 'research/tools/e8_cauchy_binet_boolean_selector/checker.py'
      - '.github/workflows/trump-e8-cauchy-binet-boolean-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent selector replay
        run: python research/tools/e8_cauchy_binet_boolean_selector/checker.py
