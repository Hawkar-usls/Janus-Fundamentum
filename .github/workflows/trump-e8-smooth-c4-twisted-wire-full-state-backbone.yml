name: TRUMP E8 Smooth C4 Twisted Wire Full-State Backbone

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TWISTED_WIRE_FULL_STATE_PERMUTATION_BACKBONE_2026-09-30_v7.9.json'
      - 'research/tools/e8_smooth_c4_twisted_wire_full_state_backbone/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-twisted-wire-full-state-backbone.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TWISTED_WIRE_FULL_STATE_PERMUTATION_BACKBONE_2026-09-30_v7.9.json'
      - 'research/tools/e8_smooth_c4_twisted_wire_full_state_backbone/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-twisted-wire-full-state-backbone.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay all smooth full-state twisted-wire transports
        run: python research/tools/e8_smooth_c4_twisted_wire_full_state_backbone/checker.py
