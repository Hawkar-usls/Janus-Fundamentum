name: JANUS TRUMP R50G25AY governance pre-seal

on:
  push:
    branches:
      - research/r50g25ay-separator-width-relation-ledger-scaling-2026-09-08
    paths:
      - 'governance/R50G25AY_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25ay-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts ay-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp)
          print('POLICY_SHA256='+got)
          PY
      - name: Download exact AY aggregate artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34177838280
          name: janus-trump-r50g25ay-result
          path: ay-artifact
      - name: Verify exact AY evidence identity and finite scope
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=list(Path('ay-artifact').rglob('JANUS_TRUMP_R50G25AY_RESULT.json'))
          vp=list(Path('ay-artifact').rglob('JANUS_TRUMP_R50G25AY_AGGREGATE_VERIFY.json'))
          assert len(rp)==1,rp; assert len(vp)==1,vp
          rb=rp[0].read_bytes(); vb=vp[0].read_bytes()
          r=json.loads(rb); v=json.loads(vb)
          assert hashlib.sha256(rb).hexdigest()=='ef540f15e8f27e21013d8e79dfe823d7138281a8ac80f7f1b7a25256a1b247a9'
          assert hashlib.sha256(vb).hexdigest()=='99f30d853a82cacb6704cc876c9814d74e1dc2452753d5a26df75db8b8829986'
          assert r['verdict']=='AY_WIDTH_AND_RELATION_LEDGER_WITHIN_L4_ON_FROZEN_LADDER__ASYMPTOTIC_OPEN'
          assert r['frozen_ladder']==[1,2,3,4,6,8]
          assert r['relevant_rung_count']==6
          assert v['status']=='PASS' and v['failures']==[]
          assert r['summary']['maximum_observed_induced_width']==13
          assert r['summary']['maximum_observed_total_materialized_rows']==36612
          for row in r['table']:
              assert row['relevant'] is True, row
              assert row['classification']=='WIDTH_AND_RELATION_LEDGER_WITHIN_L4', row
              assert row['w']==13, row
              assert row['state_bound_2_pow_w']<=row['L4_budget'], row
              assert row['total_materialized_rows']<=row['L4_budget'], row
              assert row['reconstruction_pass'] is True, row
              assert row['source_validation_pass'] is True, row
          compact=[{k:row[k] for k in ('g','V','D','E','L','w','state_bound_2_pow_w','total_materialized_rows','decision')} for row in r['table']]
          print('AY_EVIDENCE_IDENTITY=PASS')
          print(json.dumps(compact,sort_keys=True))
          PY
      - name: Validate AY promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25AY_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25AY_GOVERNANCE_RECEIPT.json
      - name: Verify exact allowed finite-ladder promotions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25AY_GOVERNANCE_RECEIPT.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==4,x
          assert x['promotion_count_passed']==4,x
          got={(q['from'],q['to'],q['scope']) for q in x['passed_promotions']}
          exp={
            ('HYPOTHESIS','EMPIRICAL_PASS','FROZEN_AY_LADDER_G_1_2_3_4_6_8_ONLY'),
            ('UNTESTED','LOCAL_EXACTNESS','FROZEN_AY_LADDER_G_1_2_3_4_6_8_ONLY'),
            ('LOCAL_EXACTNESS','RECONSTRUCTION_VERIFIED','FROZEN_AY_LADDER_G_1_2_3_4_6_8_ONLY'),
            ('NO_COMPLEXITY_CERTIFICATE','LOCAL_POLY_BOUND','FROZEN_AY_L4_RELATION_LEDGER_ON_REGISTERED_LADDER_ONLY'),
          }
          assert got==exp,(got,exp)
          print('AY_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ay-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25AY_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
