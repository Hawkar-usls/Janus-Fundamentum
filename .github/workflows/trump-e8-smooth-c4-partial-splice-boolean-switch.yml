name: TRUMP E8 Smooth C4 Partial-Splice Boolean Switch

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_PARTIAL_SPLICE_BOOLEAN_SWITCH_NORMAL_FORM_2026-09-30_v8.2.json'
      - 'research/tools/e8_smooth_c4_partial_splice_boolean_switch/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-partial-splice-boolean-switch.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_PARTIAL_SPLICE_BOOLEAN_SWITCH_NORMAL_FORM_2026-09-30_v8.2.json'
      - 'research/tools/e8_smooth_c4_partial_splice_boolean_switch/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-partial-splice-boolean-switch.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Boolean switch normal form and OR minimality
        run: python research/tools/e8_smooth_c4_partial_splice_boolean_switch/checker.py
