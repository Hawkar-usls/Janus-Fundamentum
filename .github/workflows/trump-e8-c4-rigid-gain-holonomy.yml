name: TRUMP E8 C4 Rigid Gain Holonomy

# Registered replay trigger after initial workflow creation.
on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_RIGID_GAIN_HOLONOMY_COMPILATION_2026-09-30_v7.2.json'
      - 'research/tools/e8_c4_rigid_gain_holonomy/checker.py'
      - 'research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py'
      - '.github/workflows/trump-e8-c4-rigid-gain-holonomy.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_RIGID_GAIN_HOLONOMY_COMPILATION_2026-09-30_v7.2.json'
      - 'research/tools/e8_c4_rigid_gain_holonomy/checker.py'
      - 'research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py'
      - '.github/workflows/trump-e8-c4-rigid-gain-holonomy.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay v7.1 C4 orbit holonomy barrier
        run: python research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py
      - name: Replay v7.2 rigid gain compilation and finite bundle catalog
        run: python research/tools/e8_c4_rigid_gain_holonomy/checker.py
