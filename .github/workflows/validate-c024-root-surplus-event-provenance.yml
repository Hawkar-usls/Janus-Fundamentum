name: Validate C024 Root Surplus Event Provenance

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_surplus_event_provenance.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-surplus-event-provenance.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_surplus_event_provenance.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-surplus-event-provenance.yml"

permissions:
  contents: read

jobs:
  root-surplus-event-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile accepted root events paying selector surplus
        run: python experiments/direct/janus_tear_gt_root_surplus_event_provenance.py
