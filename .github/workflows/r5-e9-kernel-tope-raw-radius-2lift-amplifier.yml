name: R5 E9 Kernel-tope raw-radius 2-lift amplifier

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_KERNEL_TOPE_RAW_RADIUS_2LIFT_AMPLIFIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_kernel_tope_raw_radius_2lift_amplifier.py'
      - '.github/workflows/r5-e9-kernel-tope-raw-radius-2lift-amplifier.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_kernel_tope_raw_radius_2lift_amplifier.py
      - name: Replay exact lift controls
        run: python experiments/r5_e9_kernel_tope_raw_radius_2lift_amplifier.py
