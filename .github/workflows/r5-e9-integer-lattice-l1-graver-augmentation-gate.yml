name: R5 E9 Integer-lattice L1 Graver augmentation gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_INTEGER_LATTICE_L1_GRAVER_AUGMENTATION_GATE_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_integer_lattice_l1_graver_augmentation_gate.py'
      - '.github/workflows/r5-e9-integer-lattice-l1-graver-augmentation-gate.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_integer_lattice_l1_graver_augmentation_gate.py
      - name: Replay exact L1 controls
        run: python experiments/r5_e9_integer_lattice_l1_graver_augmentation_gate.py
