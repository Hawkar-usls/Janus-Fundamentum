name: TRUMP Uniform Raw-Derived Affine Boundary Factor

on:
  push:
    branches:
      - research/trump-uniform-affine-boundary-factor-v1-2026-09-15
    paths:
      - 'research/TRUMP_BICAMERAL_UNIFORM_RAW_DERIVED_AFFINE_BOUNDARY_FACTOR_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_uniform_affine_boundary/**'
      - '.github/workflows/trump-uniform-affine-boundary-factor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uniform-affine-boundary-factor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent uniform affine boundary checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_uniform_affine_boundary.independent_checker | tee /tmp/uniform-affine-boundary.json

      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/uniform-affine-boundary.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_OVERWIDTH_UNIFORM_RAW_DERIVED_AFFINE_BOUNDARY_FACTOR_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO', sf
          assert sf['GENERAL_UNIFORM_BOUNDARY_ELIMINATION']=='NOT_PROVED', sf
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Parent canonical mincut v1.1 regression
        run: python -m research.tools.apma_bicameral_mincut.independent_checker_v1_1

      - name: Parent cut-support carrier v1.1 regression
        run: python -m research.tools.apma_cut_support_carrier.independent_checker_v1_1

      - name: Parent component join-tree v1.3 regression
        run: python -m research.tools.apma_component_join_carrier.independent_checker_v1_3

      - name: Parent derived two-relation v1.1 regression
        run: python -m research.tools.apma_derived_boundary_factor.independent_checker_v1_1

      - name: Exact interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker

      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker

      - name: Schaefer connected mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier

      - name: Authority notice
        run: |
          echo 'SCOPED_ALL_AFFINE_RAW_COMPONENT_BOUNDARY_ELIMINATION_ONLY'
          echo 'NON_AFFINE_RELATION_MUST_OPEN'
          echo 'RAW_2_TO_K_ENUMERATION=0'
          echo 'MATERIALIZED_RELATION_JOIN=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
