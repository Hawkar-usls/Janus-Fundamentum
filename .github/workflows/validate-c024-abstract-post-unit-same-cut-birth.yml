name: Validate C024 Abstract Post Unit Same Cut Birth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth.py"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth.py"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth.yml"

permissions:
  contents: read

jobs:
  abstract-post-unit-same-cut-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust abstract one-assignment same-cut births
        run: python experiments/direct/janus_tear_abstract_post_unit_same_cut_birth.py
