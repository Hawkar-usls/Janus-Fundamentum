name: Validate C049.1 B4.6.3 hardened Node-9 frontier rebound

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py'
      - 'registry/c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.json'
      - 'docs/C049_1_B4_6_3_NODE9_FRONTIER_COMPRESSION_REBOUND_HARDENED.md'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression_verifier.py'
      - 'registry/c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.json'
      - 'docs/C049_1_B4_6_3_NODE9_FRONTIER_COMPRESSION_REBOUND_HARDENED.md'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-node9-frontier-rebound:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify two-parent proof ancestry
        run: |
          git merge-base --is-ancestor 1d4ab24c487f3508aaea2bcde6dba30493c57c53 HEAD
          git merge-base --is-ancestor 02f877e96026c2844d8b4bb968cc97e148c0100b HEAD
          test "$(git rev-list --parents -n 1 92bc06b884e06c8ceaede709ec7df9e8fdbb3b52)" = \
            "92bc06b884e06c8ceaede709ec7df9e8fdbb3b52 1d4ab24c487f3508aaea2bcde6dba30493c57c53 02f877e96026c2844d8b4bb968cc97e148c0100b"

      - name: Compile complete rebound chain
        run: |
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py \
            experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py

      - name: Regenerate exact frozen prefix through Node-8 preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-negative-prefix
          python experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py \
            --output-dir /tmp/c049-negative-prefix
          python experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            /tmp/c049-negative-prefix --output /tmp/c049-dim2-preorder.json
          test "$(sha256sum /tmp/c049-dim2-preorder.json | cut -d' ' -f1)" = \
            "a68ea1957382bfa89386a09ab501a052057b1cc5de8db7191a6ab3a26e1d2af9"
          mkdir /tmp/c049-node6-integration
          python experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            --output-dir /tmp/c049-node6-integration \
            --parent-pair-cap 10000 --parent-refinement-cap 2000000
          python experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            /tmp/c049-node6-integration/manifest.json \
            --output /tmp/c049-node7-frontier.json --entry-order original
          test "$(sha256sum /tmp/c049-node7-frontier.json | cut -d' ' -f1)" = \
            "6a0748219d829434feeb5de2c5488e1fa3aeb1fab16ecbfee0c5629be90130a9"
          python experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            /tmp/c049-node7-frontier.json \
            --output /tmp/c049-node7-up-k.json --entry-order original
          test "$(sha256sum /tmp/c049-node7-up-k.json | cut -d' ' -f1)" = \
            "c085a3bee4e0c92a01eb22715390079f9858c5704ebcbf8534f9de196087d189"
          mkdir /tmp/c049-node7-integration
          python experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json /tmp/c049-node7-up-k.json \
            --output-dir /tmp/c049-node7-integration \
            --node8-pair-cap 10000 --node8-refinement-cap 2000000
          test "$(wc -c < /tmp/c049-node7-integration/manifest.json)" = "5430371"
          test "$(sha256sum /tmp/c049-node7-integration/manifest.json | cut -d' ' -f1)" = \
            "05a4269be3b15bee40c254f81cc5e668c4903e90777576a9f0d226093892122b"

      - name: Reproduce and independently replay exact Node-8 frontier
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            /tmp/c049-node7-integration/manifest.json \
            --output /tmp/c049-node8-frontier.json --entry-order original
          test "$(wc -c < /tmp/c049-node8-frontier.json)" = "204739"
          test "$(sha256sum /tmp/c049-node8-frontier.json | cut -d' ' -f1)" = \
            "93dcd5610eb9df079823b172a4f824ce1c09859e759c6b771dc95b99af394d34"
          python experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression_verifier.py \
            /tmp/c049-node7-integration/manifest.json /tmp/c049-node8-frontier.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            --tamper-self-test

      - name: Reproduce 16-invariant multiplicity hardening before up_k
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-hardening-original.json --record-order original
          python experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-hardening-reversed.json --record-order reversed
          python experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-hardening-shuffled.json --record-order seeded-shuffle
          cmp /tmp/c049-node8-hardening-original.json /tmp/c049-node8-hardening-reversed.json
          cmp /tmp/c049-node8-hardening-original.json /tmp/c049-node8-hardening-shuffled.json
          test "$(wc -c < /tmp/c049-node8-hardening-original.json)" = "31836"
          test "$(sha256sum /tmp/c049-node8-hardening-original.json | cut -d' ' -f1)" = \
            "e5cca8a4c873f23d53011daa6921008d6577300e22199c869832c2bfe467d5fd"
          python experiments/direct/janus_c049_1_b4_6_3_node8_frontier_multiplicity_hardening_verifier.py \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-hardening-original.json \
            --tamper-self-test

      - name: Reproduce hardened Node-8 up_k closure before integration
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-original.json --entry-order original
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-reversed.json --entry-order reversed
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-shuffled.json --entry-order seeded-shuffle
          cmp /tmp/c049-node8-up-k-original.json /tmp/c049-node8-up-k-reversed.json
          cmp /tmp/c049-node8-up-k-original.json /tmp/c049-node8-up-k-shuffled.json
          test "$(wc -c < /tmp/c049-node8-up-k-original.json)" = "9344591"
          test "$(sha256sum /tmp/c049-node8-up-k-original.json | cut -d' ' -f1)" = \
            "e5202b9eb32ef44b1fdf493c6848ec82f8ce16fa502e623b7fbfdeb6bc735620"
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-up-k-original.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            --tamper-self-test

      - name: Reproduce hardened Node-8 integration and exact Node-9 preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-node8-integration
          python experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json /tmp/c049-node7-up-k.json \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-up-k-original.json \
            --output-dir /tmp/c049-node8-integration \
            --node9-pair-cap 10000 --node9-refinement-cap 2000000
          python experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_verifier.py \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-up-k-original.json \
            /tmp/c049-node8-integration \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight.py \
            --tamper-self-test
          test "$(wc -c < /tmp/c049-node8-integration/manifest.json)" = "15980334"
          test "$(sha256sum /tmp/c049-node8-integration/manifest.json | cut -d' ' -f1)" = \
            "9553263dc70f7a962a7bd95af4d5d4eeea6e1cdab163c616817b97cfcc207d6b"
          python - <<'PY'
          import json
          m=json.load(open('/tmp/c049-node8-integration/manifest.json'))
          assert m['manifest_digest']=='b46e56a20c714806b3475658aacd82f628c909c3b7dc1492db7adb504dcaf868'
          assert m['execution']['processed_internal_node_ids']==[6,7,8]
          stop=m['execution']['stop']
          assert (stop['node_id'],stop['reason'],stop['required'],stop['cap'],stop['no_layout_at_cap'])==(9,'CHILD_PAIR_CAP_EXCEEDED',574128,10000,False)
          n8=next(x for x in m['node_results'] if x['node_id']==8)
          assert n8['output_receipt']['receipt_digest']=='befcbb30de8d70ee9816bdf072b92e597cfd7052c7d7931d48190e8e53854b20'
          PY

      - name: Generate order-independent Node-9 frontier artifacts
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            /tmp/c049-node8-integration/manifest.json \
            --output /tmp/c049-node9-frontier-original.json --entry-order original
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            /tmp/c049-node8-integration/manifest.json \
            --output /tmp/c049-node9-frontier-reversed.json --entry-order reversed
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            /tmp/c049-node8-integration/manifest.json \
            --output /tmp/c049-node9-frontier-shuffled.json --entry-order seeded-shuffle
          cmp /tmp/c049-node9-frontier-original.json /tmp/c049-node9-frontier-reversed.json
          cmp /tmp/c049-node9-frontier-original.json /tmp/c049-node9-frontier-shuffled.json

      - name: Independently replay Node-9 theorem and reject repaired tampers
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py \
            /tmp/c049-node8-integration/manifest.json \
            /tmp/c049-node9-frontier-original.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            --tamper-self-test

      - name: Validate frozen theorem, receipt, and strict boundary
        run: |
          test "$(wc -c < /tmp/c049-node9-frontier-original.json)" = "312448"
          test "$(sha256sum /tmp/c049-node9-frontier-original.json | cut -d' ' -f1)" = \
            "6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890"
          python - <<'PY'
          import json
          a=json.load(open('/tmp/c049-node9-frontier-original.json'))
          assert a['semantic_digest']=='62e9178821fe56cbf094e8512dd20b687796c6fd87e08c0fea8ea833ef6c5e80'
          p=a['proof_payload']
          assert p['invariant_vector']=={f'N9-INV-{i:02d}':'PASS' for i in range(1,11)}
          q=p['quotient_frontier']
          assert q['quotient_path_count']==182
          assert q['successful_quotient_path_count']==118
          assert q['universal_failed_quotient_path_count']==64
          assert q['post_shrink_successful_class_count']==15
          assert q['local_direct_assignment_tests']==13248
          assert q['failed_refinement_partition_complete'] is True
          assert q['transitive_closure_used'] is False
          e=p['exact_frontier']
          assert e['child_pair_count']==574128
          assert e['naive_refinement_count']==1284995408
          assert e['cartesian_child_pairs_materialized']==0
          assert e['fine_lattice_paths_enumerated']==0
          strict=p['strict_boundary']
          assert strict['node9_parent_generator_frontier_complete'] is True
          assert strict['node9_parent_refinement_complete'] is True
          assert strict['node9_parent_up_k_complete'] is False
          assert strict['found_layout_enabled'] is False
          assert strict['no_layout_at_cap_enabled'] is False
          assert strict['current_global_terminal']=='OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert strict['p_vs_np']=='OPEN'
          assert p['next_gate']=='C049.1_B4.6.3_NODE9_FIFTEEN_GENERATOR_UP_K_CLOSURE'
          r=json.load(open('registry/c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.json'))
          assert r['status'] in {'DRAFT_EXACT_HEAD_CI_REQUIRED','IMPLEMENTED_HARDENED_EXACT_HEAD_CI_GREEN'}
          assert r['stack_position']['rebound_merge_commit']=='92bc06b884e06c8ceaede709ec7df9e8fdbb3b52'
          assert r['frozen_frontier_target']['artifact_sha256']=='6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890'
          admitted=r['status']=='IMPLEMENTED_HARDENED_EXACT_HEAD_CI_GREEN'
          assert r['admission_boundary']['node9_parent_generator_frontier_complete'] is admitted
          assert r['admission_boundary']['node9_parent_refinement_complete'] is admitted
          assert r['admission_boundary']['node9_parent_up_k_complete'] is False
          assert r['admission_boundary']['root_reached_on_rebound_chain'] is False
          assert r['admission_boundary']['found_layout_enabled'] is False
          assert r['admission_boundary']['no_layout_at_cap_enabled'] is False
          assert r['admission_boundary']['current_global_terminal']=='OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert r['admission_boundary']['p_vs_np']=='OPEN'
          PY

      - name: Export hardened Node-9 frontier rebound package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-node9-frontier-compression-rebound-hardened
          path: |
            /tmp/c049-node8-hardening-original.json
            /tmp/c049-node8-up-k-original.json
            /tmp/c049-node8-integration/manifest.json
            /tmp/c049-node8-integration/node8-integration-node9-preflight-summary.json
            /tmp/c049-node9-frontier-original.json
            registry/c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.json
          retention-days: 1
