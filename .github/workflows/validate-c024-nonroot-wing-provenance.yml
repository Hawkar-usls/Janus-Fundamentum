name: Validate C024 Nonroot Wing Provenance

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_wing_provenance.py"
      - "experiments/direct/janus_tear_gt_nonroot_unshielded_wing_profile.py"
      - ".github/workflows/validate-c024-nonroot-wing-provenance.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_wing_provenance.py"
      - "experiments/direct/janus_tear_gt_nonroot_unshielded_wing_profile.py"
      - ".github/workflows/validate-c024-nonroot-wing-provenance.yml"

permissions:
  contents: read

jobs:
  nonroot-wing-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace all nonroot tail-wing producer events
        run: python experiments/direct/janus_tear_gt_nonroot_wing_provenance.py
