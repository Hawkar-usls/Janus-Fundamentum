name: TRUMP SATLIB UF20 Signed Automorphism Admissibility

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_SIGNED_AUTOMORPHISM_ADMISSIBILITY_PREREGISTRATION_2026-09-16.json'
      - 'research/TRUMP_SATLIB_UF20_SIGNED_AUTOMORPHISM_ADMISSIBILITY_DIRECT_PROOF_2026-09-16.md'
      - 'research/tools/apma_satlib_uf20_signed_automorphism_admissibility/**'
      - '.github/workflows/trump-satlib-uf20-signed-automorphism-admissibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-admissibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen definition proof source and checker bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_AUTOMORPHISM_ADMISSIBILITY_PREREGISTRATION_2026-09-16.json)" = "90ac18670617bfb29e4a52f63b4c226ed498e5b6"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_SIGNED_AUTOMORPHISM_ADMISSIBILITY_DIRECT_PROOF_2026-09-16.md)" = "e1515e047e53535882913d3764425814290f3334"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_S1_FULL_PERMUTATION_AUTOMORPHISM_CERTIFICATE_RESULT_2026-09-16.json)" = "d804f61fde8a25bea0ad790c79cd40c9e110f646"
          test "$(git hash-object research/source_data/SATLIB_UF20_01_2026-09-16.cnf)" = "8330041b292e0501f8d74c1b1d32ca96c4498864"
          test "$(git hash-object research/source_data/SATLIB_UF20_02_2026-09-16.cnf)" = "f924caaef0d868bf62b1658e83e030ad8daee865"
          test "$(git hash-object research/source_data/SATLIB_UF20_03_2026-09-16.cnf)" = "8f3d15154515457281f49201b843f2a7134dfa9f"
          test "$(git hash-object research/source_data/SATLIB_UF20_04_2026-09-16.cnf)" = "34ced5c169f967b2dc44ef5e42f2ee2c924813e1"
          test "$(git hash-object research/source_data/SATLIB_UF20_05_2026-09-16.cnf)" = "3b04eff26ee37bdd0bc21b1066486974f92a2c9b"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_automorphism_admissibility/admissibility.py)" = "8daae5fe2d625736481e96f8c8b94f3d851b5f46"
          test "$(git hash-object research/tools/apma_satlib_uf20_signed_automorphism_admissibility/independent_checker.py)" = "76d02150ef416c275aa12cdac7af785e3973a333"
      - name: Run signed admissibility proof sanity
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_automorphism_admissibility.admissibility | tee /tmp/signed-admissibility.json
      - name: Run independent signed admissibility checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_signed_automorphism_admissibility.independent_checker --candidate-json /tmp/signed-admissibility.json | tee /tmp/signed-independent.json
      - name: Assert scoped proof result and firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/signed-admissibility.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/signed-independent.json').read_text().strip().splitlines()[-1])
          assert c['verdict']=='PASS_SIGNED_ACTION_SEMANTICS_AND_UNSIGNED_S1_NECESSARY_INVARIANT', c
          assert c['source_guard']['ok'] is True, c['source_guard']
          s=c['finite_proof_sanity']
          assert s['ok'] is True and s['local_action_cases']==384, s
          assert s['forbidden_tuple_checks']==384 and s['satisfaction_membership_checks']==3072 and s['assignment_inverse_checks']==3072, s
          assert len(c['five_source_unsigned_partition_receipt'])==5, c
          assert i['verified'] is True and i['implementation_imported'] is False, i
          rr=c['resource_receipt']
          assert rr['signed_group_elements_enumerated']==0 and rr['global_signed_actions_tested']==0, rr
          assert rr['solver_invocations']==0 and rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0 and rr['new_group_search_mechanisms']==0 and rr['budget_raise'] is False, rr
          sf=c['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          print(json.dumps({'verdict':c['verdict'],'sanity':s,'unsigned_partitions':c['five_source_unsigned_partition_receipt'],'independent_verified':i['verified'],'resources':rr},sort_keys=True))
          PY
      - name: Upload signed admissibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: satlib-uf20-signed-automorphism-admissibility-receipt
          path: |
            /tmp/signed-admissibility.json
            /tmp/signed-independent.json
          if-no-files-found: error
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_DEFINITION_AND_PROOF_SCOPE_ONLY__NO_GROUP_SEARCH_SOLVER_OR_CARRIER'
          echo 'SIGNED_GROUP_SEARCH=NOT_EXECUTED'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
          echo 'NEW_SOLVER_MECHANISMS=0'
          echo 'NEW_CARRIER_MECHANISMS=0'
