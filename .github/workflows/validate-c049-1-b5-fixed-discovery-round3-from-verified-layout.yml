name: Validate C049.1 B5 round3 from verified prefix layout

on:
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND3_FROM_VERIFIED_PREFIX_LAYOUT_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b5_fixed_discovery_round3_from_verified_prefix_layout_verifier.py'
      - '.github/workflows/validate-c049-1-b5-fixed-discovery-round3-from-verified-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round3-from-verified-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: experiments/direct
      PYTHONUNBUFFERED: '1'
      ROUND2_RECONSTRUCTION_HEAD: ae76f809d5fa758ff2d462184e444ca81adda57c
      PRE_SPEC: experiments/direct/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_SPEC_V1.json
      PRE_V11: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_v11.py
      PRE_VERIFIER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py
      PLAN_SPEC: experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1_1.json
      PLAN_PRODUCER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_v11.py
      PLAN_VERIFIER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier_v11.py
      B51_SPEC: experiments/direct/C049_1_B5_1_GENERIC_CORRECTED_RUNTIME_TRACE_EXECUTOR_SPEC_V1.json
      B51_PRODUCER: experiments/direct/janus_c049_1_b5_1_generic_corrected_runtime_trace_executor.py
      B51_VERIFIER: experiments/direct/janus_c049_1_b5_1_generic_corrected_runtime_trace_executor_verifier.py
      B52A_SPEC: experiments/direct/C049_1_B5_2A_GENERIC_ALGORITHM2_PROVENANCE_CARRIER_AMENDMENT_V1_1.json
      B52A_PRODUCER: experiments/direct/janus_c049_1_b5_2a_generic_algorithm2_provenance_carrier_v11.py
      B52A_VERIFIER: experiments/direct/janus_c049_1_b5_2a_generic_algorithm2_provenance_carrier_verifier_v11.py
      B52B_SPEC: experiments/direct/C049_1_B5_2B_GENERIC_ALGORITHM2_PRINTORDER_RECONSTRUCTION_SPEC_V1.json
      B52B_PRODUCER: experiments/direct/janus_c049_1_b5_2b_generic_algorithm2_printorder_reconstruction.py
      B52B_VERIFIER: experiments/direct/janus_c049_1_b5_2b_generic_algorithm2_printorder_reconstruction_verifier_v11.py
      SPEC: experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND3_FROM_VERIFIED_PREFIX_LAYOUT_SPEC_V1.json
      BINDER: experiments/direct/janus_c049_1_b5_fixed_discovery_round3_from_verified_prefix_layout_verifier.py
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bind predecessor and admitted capability bytes
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"; echo "EXACT_HEAD=$HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$ROUND2_RECONSTRUCTION_HEAD" "$HEAD"
          test "$(git hash-object "$PRE_V11")" = 89cbbae86aec581bfbe992485da914872a18b50b
          test "$(git hash-object "$PRE_VERIFIER")" = 762ace290285fbda9ee219984daaf04866ffc222
          test "$(git hash-object "$B51_PRODUCER")" = 8be92b8a663e0d05535861c6f216db28094014fb
          test "$(git hash-object "$B51_VERIFIER")" = ac40b3f3a370f697e29402e1e1cb3e514b799792
          test "$(git hash-object "$B52A_PRODUCER")" = 9159ad8fb03b47eab354ae85e6756037818597e8
          test "$(git hash-object "$B52A_VERIFIER")" = 57c95af433b2b97c53a51132f6d3128884f7f6c9
          test "$(git hash-object "$B52B_PRODUCER")" = 90a13116ff7999f81a744d56e0bae56eb6af5ed1
          test "$(git hash-object "$B52B_VERIFIER")" = 5911c566bab0193214c8aa1b11c49d5d205e2f43
          test "$(git hash-object "$BINDER")" = 2ce9232538643f9f9d2db86f5dbc0a29cdd1e935
          echo 'ROUND2_RECONSTRUCTION_HEAD_ANCESTRY = PASS'
          echo 'ADMITTED_PREPROCESSING_B5_1_B5_2_BYTES = PASS'
      - name: Enforce independent round3 binder architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$BINDER"
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('experiments/direct/janus_c049_1_b5_fixed_discovery_round3_from_verified_prefix_layout_verifier.py').read_text();imports=[]
          for n in ast.walk(ast.parse(s)):
            if isinstance(n,ast.Import):imports += [a.name for a in n.names]
            elif isinstance(n,ast.ImportFrom):imports.append(n.module or '')
          forbidden=('b5_1_generic_corrected_runtime_trace_executor','b5_2a_generic_algorithm2_provenance_carrier','b5_2b_generic_algorithm2_printorder_reconstruction')
          assert not any(any(f in x for f in forbidden) for x in imports),imports
          print('UPSTREAM_PRODUCER_IMPORT_IN_ROUND3_BINDER = FORBIDDEN_CONFIRMED')
          PY
      - name: Preprocess full three-factor input once and freeze schedule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/round3
          cat > /tmp/round3/raw.json <<'JSON'
          {"ambient_dim":2,"k":1,"factors":[{"id":"A","normal_space":[1],"affine_offset":{"tag":"A"}},{"id":"B","normal_space":[1],"affine_offset":{"tag":"B"}},{"id":"C","normal_space":[1],"affine_offset":{"tag":"C"}}]}
          JSON
          python "$PRE_V11" --spec "$PRE_SPEC" --input /tmp/round3/raw.json --output /tmp/round3/pre.json > /tmp/round3/pre-producer.log
          python "$PRE_VERIFIER" --spec "$PRE_SPEC" --input /tmp/round3/raw.json --candidate /tmp/round3/pre.json > /tmp/round3/pre-verifier.log
          python "$PLAN_PRODUCER" --spec "$PLAN_SPEC" --preprocessing /tmp/round3/pre.json --output /tmp/round3/plan.json > /tmp/round3/plan-producer.log
          python "$PLAN_VERIFIER" --spec "$PLAN_SPEC" --preprocessing /tmp/round3/pre.json --candidate /tmp/round3/plan.json > /tmp/round3/plan-verifier.log
          python - <<'PY'
          import json
          p=json.load(open('/tmp/round3/pre.json'))['proof_payload'];q=json.load(open('/tmp/round3/plan.json'))['proof_payload']
          assert q['schedule_occurrence_indices'][:3]==[0,1,2]
          assert [len(x['normal_space']) for x in p['discovery_catalog']]==[1,1,1]
          assert all(x['normal_space']==[1] for x in p['discovery_catalog'])
          print('FULL_INPUT_PREPROCESSING_V1_1_EXACTLY_ONCE = PASS')
          print('FIXED_DISCOVERY_SCHEDULE_PREFIX_3 = [0,1,2]')
          PY
      - name: Reconstruct verified round2 prefix layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          pre=json.load(open('/tmp/round3/pre.json'))['proof_payload'];plan=json.load(open('/tmp/round3/plan.json'))['proof_payload'];by={int(x['occurrence_index']):x for x in pre['discovery_catalog']};s=plan['schedule_occurrence_indices'][:2]
          factors=[{'id':by[i]['factor_id'],'normal_space':by[i]['normal_space'],'affine_offset':by[i]['affine_offset']} for i in s]
          caps={'max_boundary_dim':2,'max_k':1,'max_full_set_entries':1000,'max_child_pairs':10000,'max_join_paths':50000}
          raw={'ambient_dim':2,'k':1,'caps':caps,'factors':factors,'tree':{'root':'r2_root','nodes':[{'id':'r2_root','left':'r2_left','right':'r2_right'},{'id':'r2_left','factor_id':factors[0]['id']},{'id':'r2_right','factor_id':factors[1]['id']}]}}
          open('/tmp/round3/r2-input.json','w').write(json.dumps(raw,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python "$B51_PRODUCER" --spec "$B51_SPEC" --input /tmp/round3/r2-input.json --output /tmp/round3/r2-b51.json > /tmp/round3/r2-b51-producer.log
          python "$B51_VERIFIER" --spec "$B51_SPEC" --input /tmp/round3/r2-input.json --candidate /tmp/round3/r2-b51.json > /tmp/round3/r2-b51-verifier.log
          python "$B52A_PRODUCER" --spec "$B52A_SPEC" --input /tmp/round3/r2-input.json --b5-1-artifact /tmp/round3/r2-b51.json --output /tmp/round3/r2-carrier.json > /tmp/round3/r2-b52a-producer.log
          python "$B52A_VERIFIER" --spec "$B52A_SPEC" --input /tmp/round3/r2-input.json --b5-1-artifact /tmp/round3/r2-b51.json --candidate /tmp/round3/r2-carrier.json > /tmp/round3/r2-b52a-verifier.log
          python "$B52B_PRODUCER" --spec "$B52B_SPEC" --input /tmp/round3/r2-input.json --b5-1-artifact /tmp/round3/r2-b51.json --carrier /tmp/round3/r2-carrier.json --output /tmp/round3/r2-layout.json > /tmp/round3/r2-b52b-producer.log
          python "$B52B_VERIFIER" --spec "$B52B_SPEC" --input /tmp/round3/r2-input.json --b5-1-artifact /tmp/round3/r2-b51.json --carrier /tmp/round3/r2-carrier.json --candidate /tmp/round3/r2-layout.json > /tmp/round3/r2-b52b-verifier.log
          python - <<'PY'
          import json
          b=json.load(open('/tmp/round3/r2-b51.json'))['proof_payload'];q=json.load(open('/tmp/round3/r2-layout.json'))['proof_payload']
          assert b['capability_status']=='CLOSED_COMPLETE_TRACE' and int(b['root_entry_count_if_closed'])>0
          assert q['candidate_found_layout'] is True and q['maximum_cut_width']<=1
          assert len(q['factor_order_ids'])==2
          print('ROUND2_RECONSTRUCTION_REPLAY_VERIFIED = PASS')
          print('ROUND2_VERIFIED_FACTOR_ORDER_IDS =',q['factor_order_ids'])
          print('ROUND2_MAXIMUM_CUT_WIDTH =',q['maximum_cut_width'])
          PY
      - name: Materialize round3 scaffold from verified round2 order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          pre=json.load(open('/tmp/round3/pre.json'))['proof_payload'];plan=json.load(open('/tmp/round3/plan.json'))['proof_payload'];layout=json.load(open('/tmp/round3/r2-layout.json'))['proof_payload'];by={int(x['occurrence_index']):x for x in pre['discovery_catalog']};s=plan['schedule_occurrence_indices'];order=layout['factor_order_ids'];new=by[s[2]]['factor_id']
          factors=[{'id':by[i]['factor_id'],'normal_space':by[i]['normal_space'],'affine_offset':by[i]['affine_offset']} for i in s[:3]]
          caps={'max_boundary_dim':2,'max_k':1,'max_full_set_entries':5000,'max_child_pairs':50000,'max_join_paths':500000}
          raw={'ambient_dim':2,'k':1,'caps':caps,'factors':factors,'tree':{'root':'r3_root','nodes':[{'id':'r3_root','left':'r3_prefix','right':'r3_new'},{'id':'r3_prefix','left':'r3_p0','right':'r3_p1'},{'id':'r3_p0','factor_id':order[0]},{'id':'r3_p1','factor_id':order[1]},{'id':'r3_new','factor_id':new}]}}
          open('/tmp/round3/r3-input.json','w').write(json.dumps(raw,sort_keys=True,separators=(',',':'))+'\n')
          print('ROUND3_LEFT_SUBTREE_ORDER_FROM_B5_2B =',order)
          print('ROUND3_NEW_FIXED_FACTOR =',new)
          PY
      - name: Execute and independently verify round3 B5.1
        shell: bash
        run: |
          set -euo pipefail
          python "$B51_PRODUCER" --spec "$B51_SPEC" --input /tmp/round3/r3-input.json --output /tmp/round3/r3-b51.json | tee /tmp/round3/r3-b51-producer.log
          python "$B51_VERIFIER" --spec "$B51_SPEC" --input /tmp/round3/r3-input.json --candidate /tmp/round3/r3-b51.json | tee /tmp/round3/r3-b51-verifier.log
          python - <<'PY'
          import json
          p=json.load(open('/tmp/round3/r3-b51.json'))['proof_payload']
          assert p['capability_status'] in {'CLOSED_COMPLETE_TRACE','OPEN_RUNTIME_CAPABILITY'}
          print('ROUND3_B5_1_CAPABILITY_STATUS =',p['capability_status'])
          print('ROUND3_ROOT_ENTRY_COUNT_IF_CLOSED =',p['root_entry_count_if_closed'])
          PY
          echo 'ROUND3_B5_1_INDEPENDENT_REPLAY = PASS'
      - name: Bind verified-layout authority into round3 scaffold
        shell: bash
        run: |
          set -euo pipefail
          python "$BINDER" --spec "$SPEC" --preprocessing /tmp/round3/pre.json --plan /tmp/round3/plan.json --round2-layout /tmp/round3/r2-layout.json --round3-input /tmp/round3/r3-input.json --round3-candidate /tmp/round3/r3-b51.json | tee /tmp/round3/binder.log
          grep -F 'JANUS_B5_FIXED_DISCOVERY_ROUND3_FROM_VERIFIED_PREFIX_LAYOUT_VERIFIER = PASS' /tmp/round3/binder.log
          grep -F 'ROUND3_PREFIX_SUBTREE_FROM_VERIFIED_LAYOUT = PASS' /tmp/round3/binder.log
          grep -F 'SCAFFOLD_3K_BOUND = PASS' /tmp/round3/binder.log
          grep -F 'RAW_PREVIOUS_ROOT_STATE_REUSE = FORBIDDEN' /tmp/round3/binder.log
      - name: Reject digest-repaired round3 authority tampers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,hashlib,json,sys
          sys.path.insert(0,'experiments/direct');import janus_c049_1_b5_fixed_discovery_round3_from_verified_prefix_layout_verifier as v
          L=lambda p:json.load(open(p));dg=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          args=[L('experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND3_FROM_VERIFIED_PREFIX_LAYOUT_SPEC_V1.json'),L('/tmp/round3/pre.json'),L('/tmp/round3/plan.json'),L('/tmp/round3/r2-layout.json'),L('/tmp/round3/r3-input.json'),L('/tmp/round3/r3-b51.json')];attacks=[]
          def add(n,i,m):
            x=copy.deepcopy(args[i]);m(x)
            if isinstance(x,dict) and 'proof_payload' in x:x['semantic_digest']=dg(x['proof_payload'])
            attacks.append((n,i,x))
          add('T01_ROUND2_ORDER_REBIND',3,lambda x:x['proof_payload']['factor_order_ids'].__setitem__(slice(0,2),list(reversed(x['proof_payload']['factor_order_ids']))))
          def swap_tree(x):
            nodes=x['tree']['nodes'];a=next(n for n in nodes if n['id']=='r3_p0');b=next(n for n in nodes if n['id']=='r3_p1');a['factor_id'],b['factor_id']=b['factor_id'],a['factor_id']
          add('T02_ROUND3_PREFIX_TREE_REORDER',4,swap_tree)
          add('T03_ROUND3_NEW_FACTOR_REBIND',4,lambda x:next(n for n in x['tree']['nodes'] if n['id']=='r3_new').__setitem__('factor_id','A'))
          add('T04_ROUND3_AFFINE_REBIND',4,lambda x:x['factors'][2].__setitem__('affine_offset',{'tamper':True}))
          add('T05_ROUND3_TERMINAL_PROMOTION',5,lambda x:x['proof_payload'].__setitem__('terminal_promotion','FOUND_LAYOUT'))
          add('T06_PREPROCESSING_AUTHORITY_DOWNGRADE',2,lambda x:x['proof_payload'].__setitem__('preprocessing_authority_version','V1'))
          rejected=0
          for n,i,x in attacks:
            trial=copy.deepcopy(args);trial[i]=x
            try:v.verify(*trial)
            except Exception:rejected+=1;print(n,'= REJECTED')
            else:raise SystemExit(n+' survived')
          assert rejected==6;print('DIGEST_REPAIRED_ROUND3_AUTHORITY_TAMPERS_REJECTED = 6/6')
          PY
      - name: Freeze exact-head round3 receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'experiments/direct');import janus_c049_1_b5_fixed_discovery_round3_from_verified_prefix_layout_verifier as v
          L=lambda p:json.load(open(p));r=v.verify(L(os.environ['SPEC']),L('/tmp/round3/pre.json'),L('/tmp/round3/plan.json'),L('/tmp/round3/r2-layout.json'),L('/tmp/round3/r3-input.json'),L('/tmp/round3/r3-b51.json'))
          receipt={'schema':'janus.c049_1.b5.fixed_discovery_round3_from_verified_prefix_layout_receipt.v1','exact_head':os.environ['EXACT_HEAD'],'round2_reconstruction_head':os.environ['ROUND2_RECONSTRUCTION_HEAD'],'checks':{'verified_round2_layout_to_round3_prefix_subtree':'PASS','next_fixed_factor':'PASS','affine_identity':'PASS','scaffold_3k_bound':'PASS','round3_b5_1_independent_replay':'PASS','raw_previous_root_state_reuse':'FORBIDDEN','tamper_rejection':'6/6'},'verified_round2_factor_order_ids':r['verified_round2_order'],'round3_new_factor_id':r['new_factor_id'],'round3_capability_status':r['round3_capability_status'],'round3_branch':r['round3_branch'],'round3_root_entries':r['round3_root_entries'],'next_gate':r['next_gate'],'round4_execution':'NOT_ESTABLISHED','full_schedule_execution':'NOT_ESTABLISHED','all_input_termination':'NOT_ESTABLISHED','polynomial_runtime':'NOT_ESTABLISHED','original_order_lift_admission':'NOT_ESTABLISHED_REPLACEMENT_REPLAY_INCOMPLETE','b5_complete':False,'c049_1_complete':False,'p_vs_np':'OPEN'}
          raw=(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n').encode();Path('/tmp/round3/exact-head-receipt.json').write_bytes(raw)
          print('ROUND3_FROM_VERIFIED_PREFIX_LAYOUT_RECEIPT = FROZEN');print('RECEIPT_SHA256 =',hashlib.sha256(raw).hexdigest());print('ROUND3_CAPABILITY_STATUS =',r['round3_capability_status']);print('ROUND3_BRANCH =',r['round3_branch']);print('ROUND3_ROOT_ENTRIES =',r['round3_root_entries']);print('NEXT_GATE =',r['next_gate']);print('B5_COMPLETE = FALSE');print('P_VS_NP = OPEN')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c049-b5-round3-from-verified-layout-${{ github.run_id }}
          path: /tmp/round3
          if-no-files-found: error
          retention-days: 90
