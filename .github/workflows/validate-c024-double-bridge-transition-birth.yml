name: Validate C024 Double Bridge Transition Birth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_transition_birth.py"
      - ".github/workflows/validate-c024-double-bridge-transition-birth.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_transition_birth.py"
      - ".github/workflows/validate-c024-double-bridge-transition-birth.yml"

permissions:
  contents: read

jobs:
  double-bridge-transition-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify exact immediate-parent double-bridge births
        run: python experiments/direct/janus_tear_gt_double_bridge_transition_birth.py
