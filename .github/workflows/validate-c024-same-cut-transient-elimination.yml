name: Validate C024 Same Cut Transient Elimination

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_same_cut_transient_elimination.py"
      - ".github/workflows/validate-c024-same-cut-transient-elimination.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_same_cut_transient_elimination.py"
      - ".github/workflows/validate-c024-same-cut-transient-elimination.yml"

permissions:
  contents: read

jobs:
  same-cut-transient-elimination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay raw same-cut transient through next exact key
        run: python experiments/direct/janus_tear_gt_same_cut_transient_elimination.py
