name: JANUS TRUMP R50G25BA4 governance pre-seal

on:
  push:
    branches:
      - research/r50g25ba4-factorized-k-bit-persistent-identity-channel-2026-09-08
    paths:
      - 'governance/R50G25BA4_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25ba4-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts ba4-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest(); exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp); print('POLICY_SHA256='+got)
          PY
      - name: Download exact BA4 scientific artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34217209762
          name: janus-trump-r50g25ba4-result
          path: ba4-artifact
      - name: Verify exact BA4 evidence identity and restricted scope
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=list(Path('ba4-artifact').rglob('JANUS_TRUMP_R50G25BA4_RESULT.json')); vp=list(Path('ba4-artifact').rglob('JANUS_TRUMP_R50G25BA4_VERIFY.json'))
          assert len(rp)==1,rp; assert len(vp)==1,vp
          rb=rp[0].read_bytes(); vb=vp[0].read_bytes()
          assert hashlib.sha256(rb).hexdigest()=='99ff27b15db3c73b7d2117e34014d90f49e4b97ddc3a0d48c67f9b60c1d8a21b'
          assert hashlib.sha256(vb).hexdigest()=='5214cfa68c5941282af9e1776326058825dfa45cd1e58b2dbde9622a8b759400'
          r=json.loads(rb); v=json.loads(vb)
          assert r['outcome']=='BA4-A_FACTORIZED_K_BIT_PERSISTENT_IDENTITY_CHANNEL_CERTIFIED'
          assert r['failure_count']==0 and r['falsifiers']==[]
          assert r['BA4_1_disjoint_lanes']['cross_lane_clauses']==0
          assert r['BA4_1_disjoint_lanes']['shared_internal_variables']==0
          assert r['BA4_2_product_relation']['explicit_2powk_table_materialized'] is False
          assert r['BA4_2_product_relation']['proof_mode']=='COMPONENTWISE_CARTESIAN_PRODUCT_NOT_STATE_ENUMERATION'
          assert r['BA4_3_information']['N_direction(k)']=='2^k'
          assert r['BA4_3_information']['I_direction(k)_bits']=='k'
          assert r['BA4_4_factorized_certificate']['state_table_rows']==0
          assert r['BA4_4_factorized_certificate']['enumerated_boundary_vectors']==0
          assert r['BA4_5_source_preimage']['lane_gate_template']['all_six_pass'] is True
          assert r['BA4_6_constructive_return']['holdout_full_CNF_verification'] is True
          assert r['BA4_7_complexity']['c(g,k)']=='k*(67*g-2)'
          assert r['BA4_7_complexity']['l(g,k)']=='k*(163*g-4)'
          assert r['BA4_7_complexity']['v(g,k)']=='20*g*k'
          assert r['BA4_7_complexity']['n(g,k)']=='k*(250*g-6)'
          assert r['BA4_7_complexity']['representation_state_rows']==0
          assert all(h['pass'] and h['width']['width']==13 for h in r['BA4_9_holdouts'])
          assert r['single_lane_recovery']['pass'] is True
          assert r['BA5_started'] is False and r['arbitrary_CNF_coverage_started'] is False
          assert v['status']=='PASS' and v['error_count']==0
          print('BA4_EVIDENCE_IDENTITY=PASS')
          PY
      - name: Validate BA4 no-global-promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25BA4_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25BA4_GOVERNANCE_RECEIPT.json
      - name: Verify restricted claim did not trigger global promotion
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25BA4_GOVERNANCE_RECEIPT.json'); x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==0,x
          assert x['promotion_count_passed']==0,x
          print('BA4_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba4-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25BA4_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
