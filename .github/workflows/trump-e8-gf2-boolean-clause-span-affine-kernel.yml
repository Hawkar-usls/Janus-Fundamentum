name: TRUMP E8 GF2 Boolean Clause-Span Affine Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GF2_BOOLEAN_CLAUSE_SPAN_AFFINE_KERNEL_2026-09-30_v4.1.json'
      - 'research/tools/e8_gf2_boolean_clause_span_affine_kernel/checker.py'
      - '.github/workflows/trump-e8-gf2-boolean-clause-span-affine-kernel.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact GF2 clause-span regression
        run: python research/tools/e8_gf2_boolean_clause_span_affine_kernel/checker.py
