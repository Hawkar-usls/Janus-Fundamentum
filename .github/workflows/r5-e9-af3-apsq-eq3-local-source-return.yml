name: R5 E9 AF3 APSQ EQ3 Local Source Return

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_APSQ_EQ3_LOCAL_SOURCE_RETURN_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_apsq_eq3_local_source_return_barrier.py'
      - '.github/workflows/r5-e9-af3-apsq-eq3-local-source-return.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AF3 APSQ EQ3 source-return regression
        run: python experiments/r5_e9_af3_apsq_eq3_local_source_return_barrier.py
