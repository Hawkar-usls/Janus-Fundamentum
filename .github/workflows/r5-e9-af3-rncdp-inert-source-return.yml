name: R5 E9 AF3 RNCDP Inert Source Return

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_RNCDP_INERT_SOURCE_RETURN_IDENTITY_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_rncdp_inert_source_return.py'
      - '.github/workflows/r5-e9-af3-rncdp-inert-source-return.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AF3 RNCDP inert source-return regression
        run: python experiments/r5_e9_af3_rncdp_inert_source_return.py
