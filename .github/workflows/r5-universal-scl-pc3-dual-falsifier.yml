name: R5 Universal SCL PC3 Dual Falsifier
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_scl_random_pc3_dual_challenge.py'
      - '.github/workflows/r5-universal-scl-pc3-dual-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-legal-scl:
    name: Full ExactOne vs PC3 and independently checked dual linear witness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic SCL random challenge with full GF2 degree-3 verification
        run: python -u experiments/r5_universal_scl_random_pc3_dual_challenge.py
