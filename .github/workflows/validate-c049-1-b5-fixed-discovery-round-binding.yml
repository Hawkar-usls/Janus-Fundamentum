name: Validate C049.1 B5 fixed-discovery round orchestration binding

on:
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding.py'
      - 'experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier.py'
      - '.github/workflows/validate-c049-1-b5-fixed-discovery-round-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-discovery-round-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: experiments/direct
      PYTHONUNBUFFERED: '1'
      PARENT_EVIDENCE_HEAD: 5be2d6c85a5a7525c08d9975f92ef34344ef9696
      FROZEN_PROOF_HEAD: b47f329e6142e4c2fb80d34deaead081ccf33370
      SPEC: experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1.json
      PRODUCER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding.py
      VERIFIER: experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier.py
      PRE_SPEC: experiments/direct/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_SPEC_V1.json
      PRE_PRODUCER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding.py
      PRE_VERIFIER: experiments/direct/janus_c049_1_b5_iterative_compression_preprocessing_binding_verifier.py
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bind ancestry and upstream preprocessing authority
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          echo "EXACT_HEAD=$HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$FROZEN_PROOF_HEAD" "$HEAD"
          git merge-base --is-ancestor "$PARENT_EVIDENCE_HEAD" "$HEAD"
          test "$(git hash-object "$PRE_PRODUCER")" = 5eb99fe911aa828e42f952a176b5f396dfa8f609
          test "$(git hash-object "$PRE_VERIFIER")" = 762ace290285fbda9ee219984daaf04866ffc222
          test "$(git hash-object experiments/direct/audits/C049_1_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_ADMISSION_8DA1F1DE.json)" = 69a6d709900df80e263c33405ddc0b19a593b27f
          echo 'FROZEN_PROOF_HEAD_ANCESTRY = PASS'
          echo 'PARENT_EVIDENCE_HEAD_ANCESTRY = PASS'
          echo 'PREPROCESSING_AUTHORITY_BYTES = PASS'

      - name: Enforce independent verifier architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast
          from pathlib import Path
          producer=Path('experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding.py').read_text()
          verifier=Path('experiments/direct/janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier.py').read_text()
          imports=[]
          for n in ast.walk(ast.parse(verifier)):
              if isinstance(n,ast.Import): imports += [a.name for a in n.names]
              elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          assert not any('fixed_discovery_round_orchestration_binding' in x for x in imports), imports
          assert 'verifier' not in producer.lower().split('def main')[0]
          assert 'P_VS_NP = CLOSED' not in producer and 'B5_COMPLETE = TRUE' not in producer
          print('PRODUCER_IMPORT_IN_VERIFIER = FORBIDDEN_CONFIRMED')
          print('VERIFIER_IMPORT_IN_PRODUCER = FORBIDDEN_CONFIRMED')
          print('TERMINAL_PROMOTION_IN_PRODUCER = ABSENT')
          PY

      - name: Build and independently verify fixed full-input preprocessing subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixed-round
          cat > /tmp/fixed-round/raw.json <<'JSON'
          {"ambient_dim":4,"k":1,"factors":[{"id":"F2","normal_space":[3,5],"affine_offset":[1,0]},{"id":"F0","normal_space":[1,3],"affine_offset":[0,1]},{"id":"F3","normal_space":[6,10],"affine_offset":[1,1]},{"id":"F1","normal_space":[2,6],"affine_offset":[0,0]}]}
          JSON
          python "$PRE_PRODUCER" --spec "$PRE_SPEC" --input /tmp/fixed-round/raw.json --output /tmp/fixed-round/pre.json | tee /tmp/fixed-round/pre-producer.log
          python "$PRE_VERIFIER" --spec "$PRE_SPEC" --input /tmp/fixed-round/raw.json --candidate /tmp/fixed-round/pre.json | tee /tmp/fixed-round/pre-verifier.log
          grep -F 'JANUS_B5_ITERATIVE_COMPRESSION_PREPROCESSING_BINDING_INDEPENDENT_VERIFIER = PASS' /tmp/fixed-round/pre-verifier.log
          echo 'FULL_INPUT_PREPROCESSING_EXACTLY_ONCE = PASS'

      - name: Build and independently verify fixed-discovery round plan
        shell: bash
        run: |
          set -euo pipefail
          python "$PRODUCER" --spec "$SPEC" --preprocessing /tmp/fixed-round/pre.json --output /tmp/fixed-round/plan.json | tee /tmp/fixed-round/producer.log
          python "$VERIFIER" --spec "$SPEC" --preprocessing /tmp/fixed-round/pre.json --candidate /tmp/fixed-round/plan.json | tee /tmp/fixed-round/verifier.log
          grep -F 'JANUS_B5_FIXED_DISCOVERY_ROUND_BINDING_INDEPENDENT_VERIFIER = PASS' /tmp/fixed-round/verifier.log
          grep -F 'FIXED_DISCOVERY_CATALOG = BOUND' /tmp/fixed-round/verifier.log
          grep -F 'ROUND_EXECUTION = NOT_RUN' /tmp/fixed-round/verifier.log
          grep -F 'B5_COMPLETE = FALSE' /tmp/fixed-round/verifier.log
          grep -F 'P_VS_NP = OPEN' /tmp/fixed-round/verifier.log

      - name: Reject digest-repaired orchestration tampers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,hashlib,json,sys
          sys.path.insert(0,'experiments/direct')
          import janus_c049_1_b5_fixed_discovery_round_orchestration_binding_verifier as v
          def cb(x): return json.dumps(x,sort_keys=True,separators=(',',':')).encode()
          def dg(x): return hashlib.sha256(cb(x)).hexdigest()
          spec=json.load(open('experiments/direct/C049_1_B5_FIXED_DISCOVERY_ROUND_ORCHESTRATION_BINDING_SPEC_V1.json'))
          pre=json.load(open('/tmp/fixed-round/pre.json'))
          base=json.load(open('/tmp/fixed-round/plan.json'))
          attacks=[]
          def add(name,mut):
              c=copy.deepcopy(base); mut(c['proof_payload']); c['semantic_digest']=dg(c['proof_payload']); attacks.append((name,c))
          add('T01_FIXED_DISCOVERY_CATALOG_REBINDING',lambda p:p.__setitem__('fixed_discovery_catalog_semantic_digest','0'*64))
          add('T02_ROUND_SCHEDULE_OMISSION',lambda p:p['schedule_occurrence_indices'].pop())
          add('T03_ROUND_SCHEDULE_DUPLICATION',lambda p:p['schedule_occurrence_indices'].__setitem__(1,p['schedule_occurrence_indices'][0]))
          add('T04_ROUND_SCHEDULE_REORDERING',lambda p:p['schedule_occurrence_indices'].__setitem__(slice(0,2),list(reversed(p['schedule_occurrence_indices'][:2]))))
          add('T05_ROUND_PREFIX_HISTORY_REBINDING',lambda p:p['rounds'][2].__setitem__('prefix_occurrence_indices',p['rounds'][1]['prefix_occurrence_indices']))
          add('T06_ROUND_NEXT_FACTOR_REBINDING',lambda p:p['rounds'][1].__setitem__('new_occurrence_index',p['rounds'][0]['new_occurrence_index']))
          add('T07_ROUND_DISCOVERY_RECORD_REBINDING',lambda p:p['rounds'][1].__setitem__('new_fixed_discovery_record_digest','1'*64))
          add('T08_ROUND_PREFIX_DIGEST_CHAIN_BREAK',lambda p:p['rounds'][1].__setitem__('previous_prefix_semantic_digest','2'*64))
          add('T09_EXECUTION_PROMOTION',lambda p:p.__setitem__('completed_round_execution_count',1))
          add('T10_B5_COMPLETE_PROMOTION',lambda p:p['strict_boundary'].__setitem__('b5_complete',True))
          add('T11_C049_COMPLETE_PROMOTION',lambda p:p['strict_boundary'].__setitem__('c049_1_complete',True))
          add('T12_P_VS_NP_PROMOTION',lambda p:p['strict_boundary'].__setitem__('p_vs_np','CLOSED'))
          rejected=0
          for name,c in attacks:
              try: v.verify(spec,pre,c)
              except Exception:
                  rejected+=1; print(name,'= REJECTED')
              else: raise SystemExit(name+' survived')
          if rejected!=12: raise SystemExit(f'{rejected}/12')
          print('DIGEST_REPAIRED_ORCHESTRATION_TAMPERS_REJECTED = 12/12')
          PY

      - name: Freeze exact-head structural receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def blob(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          plan=Path('/tmp/fixed-round/plan.json')
          receipt={
            'schema':'janus.c049_1.b5.fixed_discovery_round_binding_exact_head_receipt.v1',
            'exact_head':os.environ['EXACT_HEAD'],
            'parent_evidence_head':os.environ['PARENT_EVIDENCE_HEAD'],
            'frozen_proof_head':os.environ['FROZEN_PROOF_HEAD'],
            'bindings':{'spec_git_blob':blob(os.environ['SPEC']),'producer_git_blob':blob(os.environ['PRODUCER']),'verifier_git_blob':blob(os.environ['VERIFIER']),'preprocessing_producer_git_blob':blob(os.environ['PRE_PRODUCER']),'preprocessing_verifier_git_blob':blob(os.environ['PRE_VERIFIER'])},
            'checks':{'full_input_preprocessing_exactly_once':'PASS','fixed_discovery_catalog':'BOUND','canonical_schedule':'PASS','exact_prefix_chain':'PASS','next_factor_binding':'PASS','digest_repaired_tampers_rejected':'12/12','round_execution':'NOT_RUN'},
            'plan_sha256':hashlib.sha256(plan.read_bytes()).hexdigest(),
            'next_gate':'C049.1_B5_FIXED_DISCOVERY_ROUND_EXECUTION_COMPOSITION',
            'original_order_lift_admission':'NOT_ESTABLISHED_REPLACEMENT_REPLAY_INCOMPLETE',
            'all_input_termination':'NOT_ESTABLISHED','polynomial_runtime':'NOT_ESTABLISHED','b5_complete':False,'c049_1_complete':False,'p_vs_np':'OPEN'}
          out=Path('/tmp/fixed-round/exact-head-receipt.json'); out.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('FIXED_DISCOVERY_ROUND_BINDING_EXACT_HEAD_RECEIPT = FROZEN')
          print('NEXT_GATE = C049.1_B5_FIXED_DISCOVERY_ROUND_EXECUTION_COMPOSITION')
          print('ORIGINAL_ORDER_LIFT_ADMISSION = NOT_ESTABLISHED_REPLACEMENT_REPLAY_INCOMPLETE')
          print('B5_COMPLETE = FALSE'); print('C049_1_COMPLETE = FALSE'); print('P_VS_NP = OPEN')
          PY

      - name: Upload structural evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c049-b5-fixed-discovery-round-binding-${{ github.run_id }}
          path: /tmp/fixed-round
          if-no-files-found: error
          retention-days: 90
