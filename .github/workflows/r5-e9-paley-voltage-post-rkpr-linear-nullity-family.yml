name: R5 E9 Paley Voltage Post-RKPR Linear Nullity Family

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/R5_E9_PALEY_VOLTAGE_POST_RKPR_LINEAR_NULLITY_FAMILY_2026-09-29_v1.0.md"
      - "experiments/r5_e9_paley_voltage_post_rkpr_linear_nullity_family.py"
      - ".github/workflows/r5-e9-paley-voltage-post-rkpr-linear-nullity-family.yml"

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify theorem premises
        run: python experiments/r5_e9_paley_voltage_post_rkpr_linear_nullity_family.py
