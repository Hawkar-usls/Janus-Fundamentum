name: R5 E9 EQ3 Gauge-Nullity UNSAT Counterfamily

on:
  push:
    paths:
      - 'research/R5_E9_EQ3_GAUGE_NULLITY_UNSAT_COUNTERFAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_eq3_gauge_nullity_unsat_counterfamily.py'
      - '.github/workflows/r5-e9-eq3-gauge-nullity-unsat-counterfamily.yml'
  pull_request:
    paths:
      - 'research/R5_E9_EQ3_GAUGE_NULLITY_UNSAT_COUNTERFAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_eq3_gauge_nullity_unsat_counterfamily.py'
      - '.github/workflows/r5-e9-eq3-gauge-nullity-unsat-counterfamily.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact regression
        run: python experiments/r5_e9_eq3_gauge_nullity_unsat_counterfamily.py
