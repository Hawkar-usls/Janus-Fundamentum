name: JANUS TRUMP R44BS Connected Backbone Unbounded Support

on:
  pull_request:
    branches:
      - research/r44br-shared-pivot-unbounded-transport-support-2026-09-03
    paths:
      - 'research/JANUS_TRUMP_R44BS_CONNECTED_BACKBONE_UNBOUNDED_SIGNED_TRANSPORT_SUPPORT_2026-09-03.json'
      - 'research/JANUS_TRUMP_R44BS_CONNECTED_BACKBONE_UNBOUNDED_SIGNED_TRANSPORT_SUPPORT_PROOF_2026-09-03.md'
      - 'research/janus_trump_r44bs_verify_connected_backbone_support.py'
      - '.github/workflows/janus-trump-r44bs-connected-backbone-support.yml'
  workflow_dispatch:

jobs:
  exact-connected-backbone-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact connected-backbone premises
        run: python research/janus_trump_r44bs_verify_connected_backbone_support.py
      - name: Enforce theorem boundary
        run: |
          grep -q 'CONNECTED_UNBOUNDED_SUPPORT != SEARCH_HARDNESS' research/JANUS_TRUMP_R44BS_CONNECTED_BACKBONE_UNBOUNDED_SIGNED_TRANSPORT_SUPPORT_2026-09-03.json
          grep -q 'P_VS_NP=OPEN' research/JANUS_TRUMP_R44BS_CONNECTED_BACKBONE_UNBOUNDED_SIGNED_TRANSPORT_SUPPORT_2026-09-03.json
