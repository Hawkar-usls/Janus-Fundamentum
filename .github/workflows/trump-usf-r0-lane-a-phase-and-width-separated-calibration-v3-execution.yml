name: TRUMP USF R0 Lane A phase+width-separated calibration V3 execution only

on:
  push:
    branches:
      - research/trump-universal-structural-funnel-adversarial-family-preregistration-2026-09-10
    paths:
      - .github/workflows/trump-usf-r0-lane-a-phase-and-width-separated-calibration-v3-execution.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CADICAL_PACKAGE_SHA256: d25649a8bb30bede6af5b5d81cc9fce4017197640940863283df722eff88f88d
  LRAT_PACKAGE_SHA256: a2613ed11f3b2ee1a183ed64ba265a7d88b9b892cef1a40a9097132ccabcc31f
  CADICAL_EXECUTABLE_SHA256: d258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39
  LRAT_EXECUTABLE_SHA256: 35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c
  OUT: /tmp/TRUMP_USF_R0_LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3

jobs:
  lane-a-phase-and-width-separated-calibration-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact V3 execution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Assert methodological V3 and frozen scientific identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_USF_R0_LANE_A_INPUT_CLASS_VS_POST_REDUCER_TERMINAL_METHODOLOGICAL_SUCCESSOR_2026-09-10.json)" = "6d8db87c7c0bc36e3e8c08d5df691714aa2448ff"
          test "$(git hash-object research/TRUMP_USF_R0_INCIDENCE_WIDTH_VS_BA25_FACTOR_TD_WIDTH_BINDING_METHODOLOGICAL_SUCCESSOR_2026-09-10.json)" = "9b412cbbef47738ff80fa28355eed42bcd5694c6"
          test "$(git hash-object research/TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY_FAILURE_2026-09-10.json)" = "97b454cefb2be61b6f0ccd021980b06831cab66d"
          test "$(git hash-object research/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2_FAILURE_2026-09-10.json)" = "0e88340237fd6e151ad14fad4f8565c5f1232d86"
          test "$(git hash-object research/trump_usf_r0_lane_a_phase_and_width_separated_calibration_v3.py)" = "80c134d76cc6a5986f8367a0f1eb26167c90bbb5"
          test "$(git hash-object research/verify_trump_usf_r0_lane_a_phase_and_width_separated_calibration_v3.py)" = "64c8bba2f71e0f838d58d8e914739ab1c2e1ba5d"
          test "$(git hash-object research/trump_usf_r0_frozen_generators.py)" = "fe33883dc08e7e1eacadf287093aa0bb1f16c19a"
          test "$(git hash-object research/trump_usf_r0_execution_harness_frozen_entrypoint.py)" = "50e8eedd461b87de37385cc9f3d30ea6224909fb"
          test "$(git hash-object research/trump_usf_r0_execution_harness.py)" = "ed4203bac76349ab377bb97f67bf1054d837bc96"
          test "$(git hash-object experiments/janus_trump_r37b_fixed_certified_portfolio_restart_cycle.py)" = "f37da1c2e1696e35695096a2c748a222af7920cc"
          test "$(git hash-object experiments/janus_trump_r33_certified_safe_reduction_stack_lean_core_forensics.py)" = "c9234a1ef639a009cc6cb4c8a6098fd09bf9affe"
          test "$(git hash-object experiments/janus_trump_r34_affine_xor_terminal_against_tseitin_core.py)" = "7f9bec920fa47af066570d874fe9127dc4b9b968"
          test "$(git hash-object experiments/janus_trump_r35_nonaffine_core_freeze_structure_intake.py)" = "ad237e341d9659d33da0568f134815776c1f95d8"
          test "$(git hash-object experiments/janus_trump_r35b_single_literal_rup_vivification.py)" = "259d2e38947d09b0c058963ad825a57f2e734203"
          test "$(git hash-object experiments/janus_trump_r38_portfolio_fixpoint_freeze_structure_intake.py)" = "816b53c390d78af415e580eaf358acf191796205"
          test "$(git hash-object experiments/trump_r38_fixpoint_to_ba25_factor_graph_diagnostic.py)" = "ea36a6b69f8c6034aa00ae4c4217bbd4d7735750"
          test "$(git hash-object research/janus_trump_r50g25ba25.py)" = "cad9c5f837d9d3c4e1c4bd4abef40976f2bb36ff"
          printf '%s\n' 'V3_ALL_FROZEN_SCIENTIFIC_BLOB_ASSERTIONS_PASS=true'

      - name: Independent synthetic width-binding verification before any Lane A record
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python3 research/verify_trump_usf_r0_lane_a_phase_and_width_separated_calibration_v3.py > "$OUT/V3_PREEXECUTION_INDEPENDENT_VERIFIER.json"
          python3 - "$OUT/V3_PREEXECUTION_INDEPENDENT_VERIFIER.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS'
          assert d['real_lane_a_instance_executed'] is False
          assert d['scheduled_USF_generator_called'] is False
          assert d['covered_incidence_width_cases']==['u_I=-1','u_I=0','u_I=1','u_I>1']
          assert d['old_binding_mechanically_rejected_where_width_differs'] is True
          assert d['construction_lemma_not_used_as_measurement_substitute'] is True
          assert d['static_audit']['factor_width_is_measured_from_independent_validation'] is True
          assert d['static_audit']['claimed_tau_uses_measured_u_F'] is True
          assert d['static_audit']['instance_specific_width_logic_absent'] is True
          rows=d['synthetic_non_USF_fixtures']
          assert [x['INCIDENCE_TD_VERIFIED_UB'] for x in rows]==[-1,0,1,2]
          assert all(x['independent_factor_td_validation']['pass'] for x in rows)
          assert all(x['lift_relation_pass'] for x in rows)
          assert all(x['old_binding_rejected_when_different'] is True for x in rows if x['old_binding_differs'])
          assert not d['LANE_B_EXECUTION_STARTED'] and not d['LANE_C_EXECUTION_STARTED'] and not d['HOLDOUT_EXECUTION_STARTED'] and not d['BA26_STARTED']
          print('V3_PREEXECUTION_SYNTHETIC_WIDTH_BINDING_PASS=true')
          PY

      - name: Inert V3 contract verification
        shell: bash
        run: |
          set -euo pipefail
          python3 research/trump_usf_r0_lane_a_phase_and_width_separated_calibration_v3.py --verify-contract-only > "$OUT/V3_INERT_CONTRACT.json"
          python3 - "$OUT/V3_INERT_CONTRACT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['pins_pass'] is True
          assert d['real_lane_a_instance_executed'] is False
          assert d['phase_separation_active'] and d['width_separation_active']
          assert d['claimed_tau_binding']=='BA25_FACTOR_TD_VERIFIED_WIDTH'
          assert not d['lane_b_authorized'] and not d['lane_c_authorized'] and not d['holdout_authorized'] and not d['BA26_authorized']
          print('V3_INERT_CONTRACT_PASS=true')
          PY

      - name: Install exact pinned truth binaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/usf-r0-lane-a-v3-tools"
          mkdir -p "$ROOT/cad" "$ROOT/lrat"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/c/cadical/cadical_1.7.4-1+b1_amd64.deb' -o "$ROOT/cadical.deb"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/d/drat-trim/drat-trim_0.0~git20240428.effa1dc-2_amd64.deb' -o "$ROOT/lrat.deb"
          printf '%s  %s\n' "$CADICAL_PACKAGE_SHA256" "$ROOT/cadical.deb" | sha256sum -c -
          printf '%s  %s\n' "$LRAT_PACKAGE_SHA256" "$ROOT/lrat.deb" | sha256sum -c -
          dpkg-deb -x "$ROOT/cadical.deb" "$ROOT/cad"
          dpkg-deb -x "$ROOT/lrat.deb" "$ROOT/lrat"
          test "$(sha256sum "$ROOT/cad/usr/bin/cadical" | cut -d' ' -f1)" = "$CADICAL_EXECUTABLE_SHA256"
          test "$(sha256sum "$ROOT/lrat/usr/bin/lrat-check" | cut -d' ' -f1)" = "$LRAT_EXECUTABLE_SHA256"
          sudo install -m 0755 "$ROOT/cad/usr/bin/cadical" /usr/bin/cadical
          sudo install -m 0755 "$ROOT/lrat/usr/bin/lrat-check" /usr/bin/lrat-check
          test "$(sha256sum /usr/bin/cadical | cut -d' ' -f1)" = "$CADICAL_EXECUTABLE_SHA256"
          test "$(sha256sum /usr/bin/lrat-check | cut -d' ' -f1)" = "$LRAT_EXECUTABLE_SHA256"
          printf 'CADICAL_RUNTIME_VERSION=%s\n' "$(/usr/bin/cadical --version)"
          printf '%s\n' 'CADICAL_RUNTIME_VERSION_MISMATCH_CLASSIFICATION=PRESERVED_RUNTIME_VERSION_STRING_MISMATCH_NOT_A_PACKAGE_HASH_FAILURE'

      - name: Execute phase+width-separated frozen Lane A discovery schedule V3 only
        shell: bash
        run: |
          set -euo pipefail
          python3 research/trump_usf_r0_lane_a_phase_and_width_separated_calibration_v3.py --execute-lane-a-v3 --output-dir "$OUT" 2>&1 | tee "$OUT/V3_EXECUTION.log"

      - name: Upload complete Lane A V3 evidence even on calibration failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trump-usf-r0-lane-a-phase-and-width-separated-calibration-v3-${{ github.run_id }}
          path: /tmp/TRUMP_USF_R0_LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3
          if-no-files-found: error
          compression-level: 9
          overwrite: false

      - name: Final fail-closed Lane A V3 acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$OUT/LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3_RESULT.json"
          PRE="$OUT/V3_PREEXECUTION_INDEPENDENT_VERIFIER.json"
          CONTRACT="$OUT/V3_INERT_CONTRACT.json"
          test -f "$RESULT" && test -f "$PRE" && test -f "$CONTRACT"
          python3 - "$RESULT" "$PRE" "$OUT" <<'PY'
          import hashlib,json,pathlib,sys
          result_path=pathlib.Path(sys.argv[1]); pre_path=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          d=json.load(open(result_path)); p=json.load(open(pre_path))
          assert p['status']=='PASS' and p['real_lane_a_instance_executed'] is False
          assert d['LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3_PASSED'] is True, d['failures']
          assert d['completed_lane_a_records']==36 and d['generated_real_USF_instances_this_v3_gate']==35 and d['A5_historical_replay_count']==1
          assert len(d['instances'])==36 and not d['failures']
          required={'SOURCE_CLASS_CALIBRATION_FAILURE','REDUCER_REPLAY_FAILURE','INCIDENCE_WIDTH_AUTHORITY_FAILURE','BA25_FACTOR_TD_BINDING_FAILURE','BA25_DIAGNOSTIC_FAILURE','POST_REDUCER_TERMINAL_CALIBRATION_FAILURE','TRUTH_AUTHORITY_FAILURE','CAUSAL_FIREWALL_FAILURE'}
          assert required <= set(d['failure_domains'])
          raw=[]
          for i,row in enumerate(d['instances']):
              assert row['status']=='PASS'
              f=row['pass_flags']
              if row['family_id']!='A5_HISTORICAL_R38': assert f['SOURCE_CLASS_EXPECTATION_PASS'] is True
              for k in ('REDUCER_CERTIFICATE_REPLAY_PASS','INCIDENCE_WIDTH_AUTHORITY_PASS','BA25_FACTOR_TD_BINDING_PASS','BA25_DIAGNOSTIC_VALID_OR_RESOURCE_GUARDED','POST_REDUCER_TERMINAL_SOUND','TRUTH_AUTHORITY_PASS','CAUSAL_FIREWALL_PASS'): assert f[k] is True
              assert f['SOURCE_CLASS_LABEL_EQUALS_POST_REDUCER_TERMINAL_LABEL_REQUIRED'] is False and f['BARE_CROSS_DOMAIN_TAU_USED'] is False
              assert row['BA25_FACTOR_TD_VALIDATION_PASS'] is True
              assert row['BA25_FACTOR_TD_VERIFIED_WIDTH']==max(row['INCIDENCE_TD_VERIFIED_UB'],1)
              rp=out/'instances'/f'{i:03d}.json'; rb=rp.read_bytes(); assert hashlib.sha256(rb).hexdigest()==row['record_sha256']; raw.append(json.loads(rb))
          a5=[x for x in raw if x.get('instance_identity_frozen_before_solver_output',{}).get('family_id')=='A5_HISTORICAL_R38']; assert len(a5)==1
          a=a5[0]; red=a['reducer']
          assert a['generated_real_instance_increment']==0
          assert red['A5_source_commit']=='0b941a484143aa130bad9f7bdf9ca94fbbff79cb'
          assert red['A5_historical_internal_residual_hash']=='3361190b3fe683457061662dd9244cd37ca79283828139666d35b01b11d2fe95'
          assert a['width_evidence']['interval_before']==[12,19] and a['width_evidence']['interval_after']==[6,8]
          assert a['terminal_recognition']['classification']=='OPEN_CORE'
          assert a['truth_oracle']['truth_state'] in {'SAT_WITNESS_VERIFIED','UNSAT_PROOF_VERIFIED'}
          assert d['LANE_A_EXECUTION_COMPLETE'] is True
          assert not d['LANE_B_EXECUTION_STARTED'] and not d['LANE_C_EXECUTION_STARTED'] and not d['HOLDOUT_EXECUTION_STARTED']
          assert d['PRIMARY_BLOCKER']=='UNIVERSAL_RESIDUAL_STRUCTURAL_FUNNEL_THEOREM'
          assert d['H1']==d['H2']==d['H3']=='OPEN' and d['SAT_IN_P']=='NOT_PROVED' and d['P_VS_NP']=='OPEN' and d['BA26_STARTED'] is False
          assert d['H1_supported_by_this_gate'] is False
          print('LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3_PASSED=true')
          print('STOP_AFTER_LANE_A_PHASE_AND_WIDTH_SEPARATED_CALIBRATION_V3=true')
          PY
