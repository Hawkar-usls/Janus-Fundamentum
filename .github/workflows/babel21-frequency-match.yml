name: BABEL-21 all-source-column Fourier coordinate match
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/frequency_match.py','.github/workflows/babel21-frequency-match.yml']
  pull_request:
    paths: ['experiments/babel21/frequency_match.py','.github/workflows/babel21-frequency-match.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-frequency-match:
    strategy:
      fail-fast: false
      matrix:
        seed: [20,37]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore exact original source algebra
        run: |
          mkdir -p /tmp/b21frequency
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21frequency
          cp experiments/babel21/frequency_match.py /tmp/b21frequency/
      - name: Download independently built exact source-functional
        uses: actions/download-artifact@v4
        with:
          name: babel21-source-phi-seed${{ matrix.seed }}
          run-id: 39643234313
          github-token: ${{ github.token }}
          path: /tmp/b21frequency
      - name: Inspect frozen source Krylov logic for full kernel test
        working-directory: /tmp/b21frequency
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("janus_babel8_krylov_verify.py","janus_babel9_krylov.py","janus_babel10_exact_lower.py"):
              p=Path(name)
              if not p.exists():continue
              s=p.read_text()
              f=[(x.name,[a.arg for a in x.args.args]) for x in ast.parse(s).body if isinstance(x,ast.FunctionDef)]
              print("BABEL21_SOURCE_FUNCTIONS",name,f,flush=True)
              if "krylov" in name:
                  print("BABEL21_SOURCE_CODE",name,s[:16000],flush=True)
          for p in sorted(Path(".").glob("*KRYLOV*.json")):
              print("BABEL21_FROZEN_KRYLOV_JSON",p.name,p.stat().st_size,flush=True)
          PY
      - name: Check against every source row/multiplier equation
        working-directory: /tmp/b21frequency
        run: python frequency_match.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Archive exact matching frequencies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-frequency-match-seed${{ matrix.seed }}
          path: /tmp/b21frequency/babel21_*_frequency_match.json
          retention-days: 7
