      - "proof_attempts/C025/POLICY0B_FAIR_REASON_CALCULUS.md"
      - "proof_attempts/C025/C025_B_CONTEXT_INDEPENDENT_PROOF_CARRYING_REASON.md"
      - "proof_attempts/C025/C025_C_REASON_DISCOVERY_AND_PROOF_SEARCH.md"
      - "proof_attempts/C025/C025_B2_EXTENSION_AWARE_REASON_V0.md"
      - "proof_attempts/C025/C025_E2R_CLASS_COUNT_BARRIER.md"
      - "proof_attempts/C025/C025_E2R_LOCALITY_FRONTIER.md"
      - "proof_attempts/C025/C025_E2R_LOCALITY_LITERATURE_BOUNDARY.md"
      - "proof_attempts/C025/C025_E2R_NW_LOCALITY_TRANSFER_AUDIT.md"
