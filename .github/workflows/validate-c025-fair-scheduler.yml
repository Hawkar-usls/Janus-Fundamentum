name: Validate C025 Fair Scheduler

on:
  push:
    paths:
      - "experiments/direct/janus_tear_policy0b_fair_scheduler.py"
      - "proof_attempts/C025/POLICY0B_FAIR_REASON_CALCULUS.md"
      - ".github/workflows/validate-c025-fair-scheduler.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_policy0b_fair_scheduler.py"
      - "proof_attempts/C025/POLICY0B_FAIR_REASON_CALCULUS.md"
      - ".github/workflows/validate-c025-fair-scheduler.yml"

permissions:
  contents: read

jobs:
  verify-fair-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scheduler
        run: python -m py_compile experiments/direct/janus_tear_policy0b_fair_scheduler.py
      - name: Replay starvation fixture
        run: python experiments/direct/janus_tear_policy0b_fair_scheduler.py
