      - "proof_attempts/C025/C025_E2R_L1E_NW_LOCAL_ER3_LOWER_BOUND.md"
      - "proof_attempts/C025/C025_E2R_L1F_CROSSING_ELIMINATION_TRADEOFF.md"
      - "proof_attempts/C025/C025_E2R_L1G_EXPANSION_ENTROPY_AND_MONOTONE_CROSSING.md"
      - "proof_attempts/C025/C025_E2R_L1G_F2_MACRO_CUT_ELIMINATION.md"
      - ".github/workflows/validate-c025-fair-scheduler.yml"

permissions:
  contents: read

jobs:
  verify-c025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile C025 probes
        run: |
          python -m py_compile experiments/direct/janus_tear_policy0b_fair_scheduler.py
          python -m py_compile experiments/direct/janus_tear_policy0b_proof_carrying_reason.py
          python -m py_compile experiments/direct/janus_tear_policy0b_reason_cache_index.py
          python -m py_compile experiments/direct/janus_tear_policy0b_extension_reason_v0.py
          python -m py_compile experiments/direct/janus_tear_policy0b_extension_reason_negative.py
          python -m py_compile experiments/direct/janus_tear_e2r_class_count_barrier.py
          python -m py_compile experiments/direct/janus_tear_e2r_support_locality.py
          python -m py_compile experiments/direct/janus_tear_e2r_nw_locality_transfer.py
          python -m py_compile experiments/direct/janus_tear_e2r_nw_local_er3_transfer.py
          python -m py_compile experiments/direct/janus_tear_e2r_crossing_elimination_tradeoff.py
          python -m py_compile experiments/direct/janus_tear_e2r_expansion_entropy_monotone.py
          python -m py_compile experiments/direct/janus_tear_e2r_polarity_inversion_budget.py
          python -m py_compile experiments/direct/janus_tear_e2r_macro_cut_elimination_f2.py
          python -m py_compile experiments/direct/janus_tear_e2r_macro_cut_pure_context_f2.py
      - name: Replay starvation fixture
        run: python experiments/direct/janus_tear_policy0b_fair_scheduler.py
      - name: Verify portable proof-carrying reasons
        run: python experiments/direct/janus_tear_policy0b_proof_carrying_reason.py
      - name: Verify exact reason-cache applicability index
        run: python experiments/direct/janus_tear_policy0b_reason_cache_index.py
      - name: Verify C025-B2 extension-aware portable reasons
        run: python experiments/direct/janus_tear_policy0b_extension_reason_v0.py
      - name: Replay C025-B2 adversarial negative suite
        run: python experiments/direct/janus_tear_policy0b_extension_reason_negative.py
      - name: Replay C025-E2R class-count and parity-compression barrier
        run: python experiments/direct/janus_tear_e2r_class_count_barrier.py
      - name: Replay C025-E2R-L1 transitive support locality mechanics
        run: python experiments/direct/janus_tear_e2r_support_locality.py
      - name: Replay C025-E2R-L1C NW-locality transfer boundary
        run: python experiments/direct/janus_tear_e2r_nw_locality_transfer.py
      - name: Replay C025-E2R-L1E direct-CNF functional-encoding transfer mechanics
        run: python experiments/direct/janus_tear_e2r_nw_local_er3_transfer.py
      - name: Replay C025-E2R-L1F crossing-extension elimination mechanics
        run: python experiments/direct/janus_tear_e2r_crossing_elimination_tradeoff.py
      - name: Replay C025-E2R-L1G expansion entropy and monotone-crossing mechanics
        run: python experiments/direct/janus_tear_e2r_expansion_entropy_monotone.py
      - name: Replay C025-E2R-L1G-F1 polarity inversion budget
        run: python experiments/direct/janus_tear_e2r_polarity_inversion_budget.py
      - name: Replay C025-E2R-L1G-F2 macro cut elimination mechanics
        run: python experiments/direct/janus_tear_e2r_macro_cut_elimination_f2.py
      - name: Replay C025-E2R-L1G-F2 pure restriction-lift overlap
        run: python experiments/direct/janus_tear_e2r_macro_cut_pure_context_f2.py
