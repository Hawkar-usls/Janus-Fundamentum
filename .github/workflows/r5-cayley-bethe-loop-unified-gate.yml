name: R5 Cayley Bethe Loop Unified Scientific Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_all_scl_perfect_matching_rank2_network.py'
      - 'experiments/r5_universal_rank2_cayley_linear_genus_obstruction.py'
      - 'experiments/r5_universal_rank2_local_lp_bethe_spurious_fixedpoint.py'
      - 'experiments/r5_universal_rank2_exact_bethe_loop_correction.py'
      - 'research/R5_RANK2_CAYLEY_GENUS_BETHE_FALSE_POSITIVE_AND_EXACT_LOOP_SUM_2026-10-12.md'
      - '.github/workflows/r5-cayley-bethe-loop-unified-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-r5-gates:
    name: Exact same HEAD source audit, genus proof, Bethe and loop distinction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-matched quartic rank-two universal algebra and controls
        run: python -u experiments/r5_universal_all_scl_perfect_matching_rank2_network.py
      - name: Explicit infinite Cayley source genus proof and p29 SCL24360
        run: python -u experiments/r5_universal_rank2_cayley_linear_genus_obstruction.py
      - name: Exact algebraic positive BP and local LP false positives
        run: python -u experiments/r5_universal_rank2_local_lp_bethe_spurious_fixedpoint.py
      - name: Exact signed generalized loop correction SAT12 vs UNSAT12
        run: python -u experiments/r5_universal_rank2_exact_bethe_loop_correction.py
