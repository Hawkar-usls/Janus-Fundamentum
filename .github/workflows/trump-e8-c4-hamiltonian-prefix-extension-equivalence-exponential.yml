name: TRUMP E8 C4 Hamiltonian-Prefix Extension Equivalence Exponential Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_HAMILTONIAN_PREFIX_EXTENSION_EQUIVALENCE_EXPONENTIAL_BARRIER_2026-10-01_v8.6.json'
      - 'research/tools/e8_c4_hamiltonian_prefix_extension_equivalence_exponential/checker.py'
      - '.github/workflows/trump-e8-c4-hamiltonian-prefix-extension-equivalence-exponential.yml'
  workflow_dispatch:

jobs:
  exact-extension-equivalence-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact nonlinear prefix extension-equivalence checker
        run: python3 research/tools/e8_c4_hamiltonian_prefix_extension_equivalence_exponential/checker.py
