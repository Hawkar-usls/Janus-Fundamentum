name: R5 Two-Wire Multipole Exact Parity and Kempe Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_two_wire_multipole_parity_gates.py'
      - 'research/R5_TWO_WIRE_MULTIPOLE_TRANSFER_KEMPE_BARRIER_2026-10-13.md'
      - '.github/workflows/r5-two-wire-multipole-parity-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-multipole:
    name: Exhaust all four/six-pole states and independently replay native SCL36
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact multipole and native-original-source certificate checks
        run: python -u experiments/r5_universal_two_wire_multipole_parity_gates.py
