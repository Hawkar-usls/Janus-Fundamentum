name: TRUMP E8 Explicit Macaulay Degree Escalation Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_EXPLICIT_MACAULAY_DEGREE_ESCALATION_BARRIER_2026-09-30_v4.4.json'
      - 'research/tools/e8_explicit_macaulay_degree_escalation/checker.py'
      - '.github/workflows/trump-e8-explicit-macaulay-degree-escalation.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact explicit Macaulay growth regression
        run: python research/tools/e8_explicit_macaulay_degree_escalation/checker.py
