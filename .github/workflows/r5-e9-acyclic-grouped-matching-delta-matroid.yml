name: R5 E9 Acyclic Grouped Matching Delta-Matroid Barrier

on:
  push:
    paths:
      - 'research/R5_E9_ACYCLIC_GROUPED_MATCHING_DELTA_MATROID_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_acyclic_grouped_matching_delta_matroid_barrier.py'
      - '.github/workflows/r5-e9-acyclic-grouped-matching-delta-matroid.yml'
  pull_request:
    paths:
      - 'research/R5_E9_ACYCLIC_GROUPED_MATCHING_DELTA_MATROID_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_acyclic_grouped_matching_delta_matroid_barrier.py'
      - '.github/workflows/r5-e9-acyclic-grouped-matching-delta-matroid.yml'

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay acyclic grouped matching barrier controls
        run: python experiments/r5_e9_acyclic_grouped_matching_delta_matroid_barrier.py
