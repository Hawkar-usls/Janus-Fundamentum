name: JANUS TIME-SAT-004D9 permanently preserve real absence of external witness
on:
  push:
    branches: [research/time-sat-004d9-external-witness-intake-20261102]
    paths: [.github/workflows/archive-time-sat-004d9-preflight.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-time-sat-004d9-original-waiting-archive
  cancel-in-progress: false
jobs:
  preserve-two-original-untrusted-fixture-preflight-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exact unmodified original preflight ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/janus-time-sat-004d9
          for pair in '13106507731 ubuntu22' '13106751122 ubuntu24'; do
            set -- ${pair}
            curl --fail --silent --show-error --retry 2 --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Hawkar-usls/Janus-Fundamentum/actions/artifacts/${1}/zip" \
              -o "/tmp/janus-time-sat-004d9/${2}.zip"
          done
      - name: Verify exact Github ZIP SHA and zero-real-source status
        run: >-
          python3 experiments/time_sat_004_external/archive_time_sat_004d9_waiting.py
          --zip22 /tmp/janus-time-sat-004d9/ubuntu22.zip
          --zip24 /tmp/janus-time-sat-004d9/ubuntu24.zip
          --out experiments/time_sat_004_external/time_sat_004d9_evidence
      - name: Save original ZIPs and missing-witness checkpoint in research branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = research/time-sat-004d9-external-witness-intake-20261102
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/time_sat_004_external/time_sat_004d9_evidence
          if git diff --cached --quiet; then
            echo 'Same original evidence already permanently preserved'
          else
            git commit -m 'evidence(TIME-SAT-004D9): archive original CI, synthetics only, external witness pending'
            git push origin HEAD:refs/heads/research/time-sat-004d9-external-witness-intake-20261102
          fi
