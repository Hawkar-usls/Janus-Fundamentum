name: Validate C024 Local Bad Bridge Birth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - "experiments/direct/janus_tear_gt_bad_resolvent_survival_filter.py"
      - "experiments/direct/janus_tear_gt_surviving_bad_branch_geometry.py"
      - "experiments/direct/janus_tear_gt_temporal_root_shield_certificate.py"
      - ".github/workflows/validate-c024-local-bad-bridge-birth.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - "experiments/direct/janus_tear_gt_bad_resolvent_survival_filter.py"
      - "experiments/direct/janus_tear_gt_surviving_bad_branch_geometry.py"
      - "experiments/direct/janus_tear_gt_temporal_root_shield_certificate.py"
      - ".github/workflows/validate-c024-local-bad-bridge-birth.yml"

permissions:
  contents: read

jobs:
  local-bad-bridge-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify fresh non-tail bridges at Resolution events
        run: python experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py
      - name: Filter bad resolvents by survival into exact keys
        run: python experiments/direct/janus_tear_gt_bad_resolvent_survival_filter.py
      - name: Certify surviving branch geometry
        run: python experiments/direct/janus_tear_gt_surviving_bad_branch_geometry.py
      - name: Certify temporal root-shield handoff
        run: python experiments/direct/janus_tear_gt_temporal_root_shield_certificate.py
