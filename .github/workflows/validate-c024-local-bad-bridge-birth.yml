name: Validate C024 Local Bad Bridge Birth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth.py"
      - ".github/workflows/validate-c024-local-bad-bridge-birth.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth.py"
      - ".github/workflows/validate-c024-local-bad-bridge-birth.yml"

permissions:
  contents: read

jobs:
  local-bad-bridge-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit fresh bad bridges at Resolution events
        run: python experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth.py
