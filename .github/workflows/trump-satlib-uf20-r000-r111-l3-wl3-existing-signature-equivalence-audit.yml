name: TRUMP SATLIB UF20 R000 R111 L3 WL3 Existing Signature Equivalence Audit

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_R000_R111_L3_WL3_EXISTING_SIGNATURE_EQUIVALENCE_AUDIT_PREREGISTRATION_2026-09-17.json'
      - 'research/TRUMP_SATLIB_UF20_R000_R111_L3_WL3_EXISTING_SIGNATURE_EQUIVALENCE_AUDIT_PREREGISTRATION_REVIEW_2026-09-17.json'
      - 'research/tools/apma_satlib_uf20_r000_r111_l3_wl3_existing_signature_equivalence_audit/**'
      - '.github/workflows/trump-satlib-uf20-r000-r111-l3-wl3-existing-signature-equivalence-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen preregistration authority and implementation bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_L3_WL3_EXISTING_SIGNATURE_EQUIVALENCE_AUDIT_PREREGISTRATION_2026-09-17.json)" = "cc3e3a4b8c8b0a5c00f8558471e7efa451bc0a25"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_L3_WL3_EXISTING_SIGNATURE_EQUIVALENCE_AUDIT_PREREGISTRATION_REVIEW_2026-09-17.json)" = "945dd3009dec8eb768d9224edfe413c80a1b1a43"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_RESIDUAL_LOCAL_INVARIANT_FALSIFIER_RESULT_2026-09-16.json)" = "954893935bee1d46a77c5f635086e0e278b05fac"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_PROJECTED_CORE_EXISTING_SIGNATURE_ABLATION_REPLAY_RESULT_2026-09-16.json)" = "b7ba5bd772c3092e0436dde8bd717dc28985983c"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_projected_signature_ablation/replay.py)" = "2edad57e6017cb34bf797313e4451c1ce014900b"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier/candidate.py)" = "4ec02d6d42e6cad7d91f16b1acfdcbe51dbd65df"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_l3_wl3_existing_signature_equivalence_audit/candidate.py)" = "023864d9007fb6ba99258111ff050307566429d2"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_l3_wl3_existing_signature_equivalence_audit/independent_checker.py)" = "ae02d81bc0dac0eabbd0c42323b2773f9fb275a1"
          test "$(git hash-object research/source_data/SATLIB_UF20_01_2026-09-16.cnf)" = "8330041b292e0501f8d74c1b1d32ca96c4498864"
          test "$(git hash-object research/source_data/SATLIB_UF20_02_2026-09-16.cnf)" = "f924caaef0d868bf62b1658e83e030ad8daee865"
          test "$(git hash-object research/source_data/SATLIB_UF20_03_2026-09-16.cnf)" = "8f3d15154515457281f49201b843f2a7134dfa9f"
          test "$(git hash-object research/source_data/SATLIB_UF20_04_2026-09-16.cnf)" = "34ced5c169f967b2dc44ef5e42f2ee2c924813e1"
          test "$(git hash-object research/source_data/SATLIB_UF20_05_2026-09-16.cnf)" = "3b04eff26ee37bdd0bc21b1066486974f92a2c9b"
      - name: Execute frozen L3 versus S0-S3 partition audit
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_l3_wl3_existing_signature_equivalence_audit.candidate > /tmp/l3-signature-audit.json
      - name: Independently recompute and verify every partition comparison
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_l3_wl3_existing_signature_equivalence_audit.independent_checker --candidate-json /tmp/l3-signature-audit.json > /tmp/l3-signature-audit-independent.json
      - name: Assert frozen outcome space and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/l3-signature-audit.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/l3-signature-audit-independent.json').read_text().strip().splitlines()[-1])
          allowed={
            'PASS_AUDIT_L3_PARTITION_EQUIVALENT_TO_EXISTING_STAGE__NOT_NOVEL',
            'PASS_SCOPED_PARTITION_NOVELTY_L3_NOT_EQUIVALENT_TO_ANY_EXISTING_STAGE'}
          assert c['verdict'] in allowed,c
          assert c['source_guard']['ok'] is True,c['source_guard']
          assert i['verified'] is True and i['candidate_imported'] is False,i
          assert i['verdict']==c['verdict'],(i,c)
          assert i['source_stage_partition_comparisons_verified']==20,i
          assert set(c['stage_summary'])=={'S0','S1','S2','S3'},c['stage_summary']
          rr=c['resource_receipt']
          assert rr['source_count']==5 and rr['existing_stage_count']==4 and rr['source_stage_partition_comparisons']==20,rr
          assert rr['full_assignment_cube_enumerations']==0 and rr['solver_invocations']==0 and rr['group_searches']==0,rr
          assert rr['new_feature_definitions']==0 and rr['new_graph_statistics']==0,rr
          assert rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0 and rr['new_adapters']==0 and rr['new_quotients']==0 and rr['budget_raise'] is False,rr
          sf=c['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED' and sf['CONNECTED_MIXED_CORE_SOLVED']=='NO',sf
          print(json.dumps({
            'verdict':c['verdict'],
            'partition_equivalent_existing_stages':c['partition_equivalent_existing_stages'],
            'scoped_partition_novelty':c['scoped_partition_novelty'],
            'stage_summary':c['stage_summary'],
            'independent_verified':i['verified']
          },sort_keys=True))
          PY
      - name: Upload equivalence-audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: satlib-uf20-r000-r111-l3-wl3-existing-signature-equivalence-audit-receipt
          path: |
            /tmp/l3-signature-audit.json
            /tmp/l3-signature-audit-independent.json
          if-no-files-found: error
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_CROSS_CERTIFICATE_PARTITION_EQUIVALENCE_AUDIT_ONLY'
          echo 'NEW_FEATURE_DEFINITIONS=0'
          echo 'NEW_GRAPH_STATISTICS=0'
          echo 'SOLVER_INVOCATIONS=0'
          echo 'GROUP_SEARCHES=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
