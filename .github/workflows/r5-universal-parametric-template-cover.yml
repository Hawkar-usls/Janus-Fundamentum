name: R5 Universal Parametric Template Cover Barrier

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-universal-parametric-template-cover.yml'
      - 'experiments/r5_universal_parametric_affine_boolean_template_cover_barrier.py'
      - 'docs/r5_universal_parametric_affine_boolean_template_cover_checkpoint_20261014.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-template-frontier:
    name: GRID9 affine-cube parameterized cover theorem and quantified syntax firewall
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full GRID9 covers, affine geometric parallelogram obstruction and all small parameter cube maps
        run: python -u experiments/r5_universal_parametric_affine_boolean_template_cover_barrier.py
