name: TRUMP E8 Graphic AF3 Complement Cycle Arc Signature

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_AF3_COMPLEMENT_CYCLE_ARC_SIGNATURE_BOUNDARY_2026-09-30_v5.3.json'
      - 'research/tools/e8_graphic_af3_complement_cycle_arc_signature/checker.py'
      - '.github/workflows/trump-e8-graphic-af3-complement-cycle-arc-signature.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact complement-cycle signature regression
        run: python research/tools/e8_graphic_af3_complement_cycle_arc_signature/checker.py
