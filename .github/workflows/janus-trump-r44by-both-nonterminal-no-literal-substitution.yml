name: JANUS TRUMP R44BY Both-Nonterminal No Literal Substitution

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R44BY_BOTH_NONTERMINAL_CRITICAL_NO_LITERAL_SUBSTITUTION_2026-09-03.json'
      - 'research/janus_trump_r44by_verify_both_nonterminal_no_literal_substitution.py'
      - '.github/workflows/janus-trump-r44by-both-nonterminal-no-literal-substitution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-counterexample-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay JSON-bound exhaustive both-nonterminal counterexample
        run: python research/janus_trump_r44by_verify_both_nonterminal_no_literal_substitution.py
      - name: Enforce theorem boundary
        run: |
          grep -q '"TRUMP_finished": false' research/JANUS_TRUMP_R44BY_BOTH_NONTERMINAL_CRITICAL_NO_LITERAL_SUBSTITUTION_2026-09-03.json
          grep -q '"SAT_IN_P": "NOT_PROVED"' research/JANUS_TRUMP_R44BY_BOTH_NONTERMINAL_CRITICAL_NO_LITERAL_SUBSTITUTION_2026-09-03.json
          grep -q '"P_VS_NP": "OPEN"' research/JANUS_TRUMP_R44BY_BOTH_NONTERMINAL_CRITICAL_NO_LITERAL_SUBSTITUTION_2026-09-03.json
