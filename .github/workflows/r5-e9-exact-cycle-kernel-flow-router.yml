name: R5 E9 Exact Cycle-Kernel Flow Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_CYCLE_KERNEL_FLOW_SOLVER_AND_NETWORK_RECOGNITION_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exact_cycle_kernel_flow_solver_and_network_recognition_router.py'
      - '.github/workflows/r5-e9-exact-cycle-kernel-flow-router.yml'
  workflow_dispatch:

jobs:
  exact-cycle-kernel-flow-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact cycle-kernel flow router regression
        run: python3 experiments/r5_e9_exact_cycle_kernel_flow_solver_and_network_recognition_router.py
