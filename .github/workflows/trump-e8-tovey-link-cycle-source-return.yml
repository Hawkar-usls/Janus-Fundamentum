name: TRUMP E8 Tovey link-cycle witness source return

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TOVEY_LINK_CYCLE_WITNESS_SOURCE_RETURN_2026-09-30_v2.6.json'
      - 'research/tools/e8_tovey_link_cycle_source_return/checker.py'
      - '.github/workflows/trump-e8-tovey-link-cycle-source-return.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Tovey link-cycle source-return regression
        run: python research/tools/e8_tovey_link_cycle_source_return/checker.py
