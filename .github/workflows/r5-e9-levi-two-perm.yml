name: R5 E9 Levi and Two-Permutation Checks

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
  pull_request:
    paths:
      - 'research/R5_E9_*'
      - 'experiments/r5_e9_levi_two_perm_normal_form.py'
      - 'experiments/r5_e9_primitive_nullity2_falsifier.py'
      - '.github/workflows/r5-e9-levi-two-perm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-normal-form-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Levi / dual / two-permutation normal form
        run: python experiments/r5_e9_levi_two_perm_normal_form.py
      - name: Check primitive nullity-2 falsifier
        run: python experiments/r5_e9_primitive_nullity2_falsifier.py
