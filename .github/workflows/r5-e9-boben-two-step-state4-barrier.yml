name: R5 E9 Boben Two-Step State-4 Barrier

on:
  push:
    paths:
      - 'research/R5_E9_BOBEN_TWO_STEP_STATE4_BARRIER_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_two_step_state4_barrier.py'
      - '.github/workflows/r5-e9-boben-two-step-state4-barrier.yml'
  pull_request:
    paths:
      - 'research/R5_E9_BOBEN_TWO_STEP_STATE4_BARRIER_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_two_step_state4_barrier.py'
      - '.github/workflows/r5-e9-boben-two-step-state4-barrier.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact two-step regression
        run: python experiments/r5_e9_boben_two_step_state4_barrier.py
