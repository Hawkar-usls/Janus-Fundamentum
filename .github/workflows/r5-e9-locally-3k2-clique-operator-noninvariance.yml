name: R5 E9 Locally 3K2 Clique Operator Noninvariance

on:
  pull_request:
    paths:
      - 'research/R5_E9_LOCALLY_3K2_CLIQUE_OPERATOR_EXACTONE_NONINVARIANCE_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_locally_3k2_clique_operator_exactone_noninvariance.py'
      - '.github/workflows/r5-e9-locally-3k2-clique-operator-noninvariance.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact clique-operator noninvariance regression
        run: python experiments/r5_e9_locally_3k2_clique_operator_exactone_noninvariance.py
