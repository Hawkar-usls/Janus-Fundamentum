name: TRUMP E8 Tovey Universal Fractional Barycenter

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TOVEY_UNIVERSAL_FRACTIONAL_MATROID_PARITY_BARYCENTER_BARRIER_2026-09-30_v3.8.json'
      - 'research/tools/e8_tovey_universal_fractional_barycenter/checker.py'
      - '.github/workflows/trump-e8-tovey-universal-fractional-barycenter.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Tovey fractional barycenter regression
        run: python research/tools/e8_tovey_universal_fractional_barycenter/checker.py
