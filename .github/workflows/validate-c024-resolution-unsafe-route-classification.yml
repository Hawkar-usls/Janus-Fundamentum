name: Validate C024 Resolution Unsafe Route Classification

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_resolution_unsafe_route_classification.py"
      - "experiments/direct/janus_tear_gt_spanning_cycle_resolution_closure.py"
      - "proof_attempts/C024/GT_RESOLUTION_UNSAFE_ROUTE_CLASSIFICATION.md"
      - ".github/workflows/validate-c024-resolution-unsafe-route-classification.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_resolution_unsafe_route_classification.py"
      - "experiments/direct/janus_tear_gt_spanning_cycle_resolution_closure.py"
      - "proof_attempts/C024/GT_RESOLUTION_UNSAFE_ROUTE_CLASSIFICATION.md"
      - ".github/workflows/validate-c024-resolution-unsafe-route-classification.yml"

permissions:
  contents: read

jobs:
  resolution-unsafe-route-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust exact unsafe Resolution route
        run: python experiments/direct/janus_tear_gt_resolution_unsafe_route_classification.py
