name: Validate C024 Branch Frequency Certificate

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_profile.py"
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_certificate.py"
      - ".github/workflows/validate-c024-branch-frequency-certificate.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_profile.py"
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_certificate.py"
      - ".github/workflows/validate-c024-branch-frequency-certificate.yml"

permissions:
  contents: read

jobs:
  branch-frequency-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certify exact branch-frequency exclusion
        run: python experiments/direct/janus_tear_gt_surviving_branch_frequency_certificate.py
