name: R5 E9 Paley5419 balanced 4-critical order > 9

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY5419_BALANCED_4CRITICAL_ORDER_GT9_FALSIFIER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py'
      - '.github/workflows/r5-e9-paley5419-balanced-4critical-order-gt9.yml'
  workflow_dispatch:

jobs:
  exact-catalog-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact q5419 critical-catalog replay
        run: python3 experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py
