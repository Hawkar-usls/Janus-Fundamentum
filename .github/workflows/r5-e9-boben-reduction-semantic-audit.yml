name: R5 E9 Boben reduction semantic audit

on:
  push:
    paths:
      - 'research/R5_E9_BOBEN_REDUCTION_EXACTONE_SEMANTIC_AUDIT_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_reduction_semantic_audit.py'
      - '.github/workflows/r5-e9-boben-reduction-semantic-audit.yml'
  pull_request:
    paths:
      - 'research/R5_E9_BOBEN_REDUCTION_EXACTONE_SEMANTIC_AUDIT_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_reduction_semantic_audit.py'
      - '.github/workflows/r5-e9-boben-reduction-semantic-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Boben semantic counterexamples
        run: python experiments/r5_e9_boben_reduction_semantic_audit.py
