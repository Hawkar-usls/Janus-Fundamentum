name: TRUMP E8 Boolean q Direct Fanout Seven-Edge Capacity

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_DIRECT_FANOUT_SEVEN_EDGE_CAPACITY_BARRIER_2026-09-30_v8.3.json'
      - 'research/tools/e8_boolean_q_direct_fanout_seven_edge_capacity/checker.cpp'
      - '.github/workflows/trump-e8-boolean-q-direct-fanout-seven-edge-capacity.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_DIRECT_FANOUT_SEVEN_EDGE_CAPACITY_BARRIER_2026-09-30_v8.3.json'
      - 'research/tools/e8_boolean_q_direct_fanout_seven_edge_capacity/checker.cpp'
      - '.github/workflows/trump-e8-boolean-q-direct-fanout-seven-edge-capacity.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact fanout search
        run: g++ -O3 -std=c++17 research/tools/e8_boolean_q_direct_fanout_seven_edge_capacity/checker.cpp -o /tmp/e8_q_fanout
      - name: Replay direct fanout minimality and capacity barrier
        run: /tmp/e8_q_fanout
