name: TRUMP E8 OR2 XOR3 Edge-Gauge Composite Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_OR2_XOR3_EDGE_GAUGE_COMPOSITE_BARRIER_2026-09-30_v4.3.json'
      - 'research/tools/e8_or2_xor3_edge_gauge_composite/checker.py'
      - '.github/workflows/trump-e8-or2-xor3-edge-gauge-composite.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic checker dependency
        run: python -m pip install sympy
      - name: Run exact weighted composite edge-gauge regression
        run: python research/tools/e8_or2_xor3_edge_gauge_composite/checker.py
