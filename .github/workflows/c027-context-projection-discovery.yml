name: C027 Context Projection Discovery

on:
  push:
    paths:
      - "experiments/direct/janus_context_projection_discovery.py"
      - "proposals/C027-JANUS-CONTEXT-PROJECTION-DISCOVERY.json"
      - "docs/C027_JANUS_CONTEXT_PROJECTION_DISCOVERY.md"
      - ".github/workflows/c027-context-projection-discovery.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_context_projection_discovery.py"
      - "proposals/C027-JANUS-CONTEXT-PROJECTION-DISCOVERY.json"
      - "docs/C027_JANUS_CONTEXT_PROJECTION_DISCOVERY.md"
      - ".github/workflows/c027-context-projection-discovery.yml"

permissions:
  contents: read

jobs:
  context-projection-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run context projection discovery audit
        run: python experiments/direct/janus_context_projection_discovery.py
