name: BABEL-17 source lower-degree witness inspection
on:
  push:
    branches: ['research/babel17-*']
    paths: ['experiments/babel17/lower_probe.py','.github/workflows/babel17-lower-probe.yml']
  pull_request:
    paths: ['experiments/babel17/lower_probe.py','.github/workflows/babel17-lower-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-frozen-lower-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect exact original degree1 kernel witness
        run: python experiments/babel17/lower_probe.py
