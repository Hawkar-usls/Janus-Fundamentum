name: TRUMP E8 Complement Cycle S3 Orbit Gauge

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_COMPLEMENT_CYCLE_S3_ORBIT_GAUGE_QUOTIENT_CARRIER_2026-09-30_v5.3.json'
      - 'research/tools/e8_complement_cycle_s3_orbit_gauge/checker.py'
      - '.github/workflows/trump-e8-complement-cycle-s3-orbit-gauge.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact S3 orbit-gauge regression
        run: python research/tools/e8_complement_cycle_s3_orbit_gauge/checker.py
