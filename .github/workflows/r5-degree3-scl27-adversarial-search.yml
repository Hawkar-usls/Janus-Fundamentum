name: R5 Degree Three Source SCL27 Adversarial Search
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_degree3_adversarial_scl27_search.py'
      - '.github/workflows/r5-degree3-scl27-adversarial-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    name: Exact original SCL27 UNSAT DAG vs cubic GF3 dual certificates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic legal 2-switch search and source-replayed exact dual tests
        run: python -u experiments/r5_universal_gf3_degree3_adversarial_scl27_search.py
