name: BABEL-19 independent cross-source rank2 transfer stress test
on:
  push:
    branches: ['research/babel19-scout-*']
    paths: ['experiments/babel19-scout/crossbase_rank2.py','experiments/babel19-scout/crossbase_verify.py','.github/workflows/babel19-crossbase-rank2.yml']
  pull_request:
    paths: ['experiments/babel19-scout/crossbase_rank2.py','experiments/babel19-scout/crossbase_verify.py','.github/workflows/babel19-crossbase-rank2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-source-rank2-stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install SCL source dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack exact frozen source and rank utilities
        run: |
          mkdir -p /tmp/babel19-crossbase
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel19-crossbase
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel19-scout/crossbase_verify.py /tmp/babel19-crossbase/
      - name: Stress exact rank for a new SCL63 cover with extra kernel rank two
        working-directory: /tmp/babel19-crossbase
        run: python crossbase_rank2.py --base-name SCL63 --seed 7 --passes 6
      - name: Stress exact rank for a new SCL126 flip16 cover
        working-directory: /tmp/babel19-crossbase
        run: python crossbase_rank2.py --base-name SCL126_flip16 --seed 5 --passes 6
      - name: Stress exact rank for a new SCL126 flip68 cover
        working-directory: /tmp/babel19-crossbase
        run: python crossbase_rank2.py --base-name SCL126_flip68 --seed 16 --passes 6
      - name: Independently verify selected source-zero columns and exact ranks
        working-directory: /tmp/babel19-crossbase
        run: |
          python crossbase_verify.py \
            babel19_SCL63_seed7_modular_pivots.json.gz \
            babel19_SCL126_flip16_seed5_modular_pivots.json.gz \
            babel19_SCL126_flip68_seed16_modular_pivots.json.gz
      - name: Archive independent cross-source rank witnesses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel19-diverse-geometry-rank2-transfer-witnesses
          path: |
            /tmp/babel19-crossbase/babel19_*_rank.json
            /tmp/babel19-crossbase/babel19_*_modular_pivots.json.gz
            /tmp/babel19-crossbase/babel18b_independent_rank_verdicts.json
          retention-days: 7
