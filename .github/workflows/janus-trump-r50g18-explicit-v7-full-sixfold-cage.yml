name: JANUS TRUMP R50G18 Explicit V7 Full Sixfold Cage

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R50G18_EXPLICIT_V7_FULL_SIXFOLD_CAGE_ANCESTRY_PREREGISTRATION_2026-09-05.json'
      - 'research/JANUS_TRUMP_R50G18_EXPLICIT_V7_FULL_SIXFOLD_CAGE_ANCESTRY_PROOF_NOTE_2026-09-05.md'
      - 'experiments/janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py'
      - 'tests/test_janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py'
      - '.github/workflows/janus-trump-r50g18-explicit-v7-full-sixfold-cage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-or-counterexample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze R50G18 contract
        run: |
          python - <<'PY'
          import json
          p='research/JANUS_TRUMP_R50G18_EXPLICIT_V7_FULL_SIXFOLD_CAGE_ANCESTRY_PREREGISTRATION_2026-09-05.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['proof_or_counterexample'] is True
          assert d['execution']['single_fixed_source_not_search'] is True
          assert d['firewall']['FULL_CAGE_REALIZER_IMPLIES_REACHABLE_COUNTEREXAMPLE'] is False
          PY

      - name: Static no-heuristic authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py').read_text()
          for x in ['random.choice(', 'random.shuffle(', 'random.random(', 'sklearn', 'torch', 'tensorflow', 'heuristic_score', 'learned_selector']:
              assert x not in p, x
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py
          PYTHONPATH=.:experiments pytest -q tests/test_janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py

      - name: Execute fixed construction and frozen door audit
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g18_explicit_v7_full_sixfold_cage_ancestry_door_audit.py \
            --output artifacts/JANUS_TRUMP_R50G18_RESULT.json

      - name: Validate epistemic boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R50G18_RESULT.json'))
          fw=d['firewall']
          assert d['construction']['source_pre_bve_clean'] is True
          assert d['construction']['first_microstep']['status'] == 'IMMEDIATE_BVE_W4_ESCAPE'
          assert d['construction']['sixfold_cage']['all_six_variables_bve_blocked'] is True
          assert fw['FULL_CAGE_REALIZER_IMPLIES_REACHABLE_COUNTEREXAMPLE'] is False
          assert fw['RUP_BEARING_V7_HUB_CYCLE_ELIMINATED'] is False
          assert fw['V7_IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['U_MU']=='OPEN'
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          assert fw['TRUMP_finished'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g18-result
          path: artifacts/JANUS_TRUMP_R50G18_RESULT.json
          if-no-files-found: error
