name: Validate C024 Nonroot Tree Exchange

on:
  push:
    branches:
      - research/c024-gt-local-resolution-robustness
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_transitivity_tree_exchange.py"
      - "proof_attempts/C024/GT_NONROOT_TRANSITIVITY_TREE_EXCHANGE_LEMMA.md"
      - ".github/workflows/validate-c024-nonroot-tree-exchange.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_transitivity_tree_exchange.py"
      - "proof_attempts/C024/GT_NONROOT_TRANSITIVITY_TREE_EXCHANGE_LEMMA.md"
      - ".github/workflows/validate-c024-nonroot-tree-exchange.yml"

permissions:
  contents: read

jobs:
  nonroot-tree-exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay transitivity tree-exchange certificates
        run: python experiments/direct/janus_tear_gt_nonroot_transitivity_tree_exchange.py
