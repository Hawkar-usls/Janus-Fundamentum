name: R5 Signed Loop Integer Gap and Approximation Barrier
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_signed_integer_gap_certificate.py'
      - '.github/workflows/r5-loop-integer-gap-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-loop-arithmetic:
    name: All SCL loop numerator divisibility and additive gap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-audit signed loop numerator, huge divisibility and exact additive rounding
        run: python -u experiments/r5_universal_loop_signed_integer_gap_certificate.py
