name: R5 Near-SAT SCL PC3 Completeness Challenge
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_scl_near_sat_incidence_surgery_pc3.py'
      - '.github/workflows/r5-near-sat-scl-pc3-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  near-sat-pc3-falsifier:
    name: Toroidal/cyclic SAT-nearby exact SCL 2-switch PC3 dual challenge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact SAT oracle and PC3 dual on legal near-SAT matrices
        run: python -u experiments/r5_universal_scl_near_sat_incidence_surgery_pc3.py
