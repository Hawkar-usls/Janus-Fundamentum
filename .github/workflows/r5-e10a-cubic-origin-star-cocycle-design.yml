name: R5 E10A Cubic Origin Star Cocycle Design

on:
  pull_request:
  workflow_dispatch:

jobs:
  star-cocycle-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cubic-origin star-cocycle controls
        run: python experiments/r5_e10a_cubic_origin_star_cocycle_design.py
