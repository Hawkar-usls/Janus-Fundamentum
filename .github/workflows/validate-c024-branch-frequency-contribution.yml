name: Validate C024 Branch Frequency Contribution

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_branch_frequency_contribution_profile.py"
      - ".github/workflows/validate-c024-branch-frequency-contribution.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_branch_frequency_contribution_profile.py"
      - ".github/workflows/validate-c024-branch-frequency-contribution.yml"

permissions:
  contents: read

jobs:
  branch-frequency-contribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decompose selected-versus-tail frequency advantages
        run: python experiments/direct/janus_tear_gt_branch_frequency_contribution_profile.py
