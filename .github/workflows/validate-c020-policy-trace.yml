name: Validate C022 Policy Lower-Bound Bridge

on:
  push:
    paths:
      - "experiments/direct/janus_tear_policy0t_trace_certificate.py"
      - "experiments/direct/janus_tear_policy0t_root_resolution_certificate.py"
      - "experiments/direct/janus_tear_policy0t_recursive_trace_translator.py"
      - "experiments/direct/janus_tear_policy0t_recursive_translator_fuzz.py"
      - "experiments/direct/janus_tear_policy0t_proof_bound_audit.py"
      - "experiments/direct/janus_tear_maj3_nonaffine_family_audit.py"
      - "experiments/direct/janus_tear_policy0t_affine_resolution_obstruction.py"
      - ".github/workflows/validate-c020-policy-trace.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_policy0t_trace_certificate.py"
      - "experiments/direct/janus_tear_policy0t_root_resolution_certificate.py"
      - "experiments/direct/janus_tear_policy0t_recursive_trace_translator.py"
      - "experiments/direct/janus_tear_policy0t_recursive_translator_fuzz.py"
      - "experiments/direct/janus_tear_policy0t_proof_bound_audit.py"
      - "experiments/direct/janus_tear_maj3_nonaffine_family_audit.py"
      - "experiments/direct/janus_tear_policy0t_affine_resolution_obstruction.py"
      - ".github/workflows/validate-c020-policy-trace.yml"

permissions:
  contents: read

jobs:
  verify-policy-lower-bound-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Policy-0T transition trace
        run: python experiments/direct/janus_tear_policy0t_trace_certificate.py

      - name: Verify branch-aligned root Resolution certificate
        run: python experiments/direct/janus_tear_policy0t_root_resolution_certificate.py

      - name: Translate the non-affine trace recursively
        run: python experiments/direct/janus_tear_policy0t_recursive_trace_translator.py

      - name: Fuzz recursive translator terminal classes
        run: python experiments/direct/janus_tear_policy0t_recursive_translator_fuzz.py

      - name: Audit explicit proof size and depth bounds
        run: python experiments/direct/janus_tear_policy0t_proof_bound_audit.py

      - name: Verify parity-of-MAJ3 local relations are non-affine
        run: python experiments/direct/janus_tear_maj3_nonaffine_family_audit.py

      - name: Audit affine shortcut obstruction to ordinary Resolution
        run: python experiments/direct/janus_tear_policy0t_affine_resolution_obstruction.py
