name: JANUS TRUMP R50G25BA2 governance pre-seal

on:
  push:
    branches:
      - research/r50g25ba2-persistent-endpoint-correlation-channel-2026-09-08
    paths:
      - 'governance/R50G25BA2_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25ba2-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts ba2-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest(); exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp); print('POLICY_SHA256='+got)
          PY
      - name: Download exact BA2 scientific artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34190887038
          name: janus-trump-r50g25ba2-result-v2
          path: ba2-artifact
      - name: Verify exact BA2 evidence identity and restricted scope
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=list(Path('ba2-artifact').rglob('JANUS_TRUMP_R50G25BA2_RESULT.json')); vp=list(Path('ba2-artifact').rglob('JANUS_TRUMP_R50G25BA2_VERIFY.json'))
          assert len(rp)==1,rp; assert len(vp)==1,vp
          rb=rp[0].read_bytes(); vb=vp[0].read_bytes()
          assert hashlib.sha256(rb).hexdigest()=='ea76d49f07b27f0ca8a12259d1429328b12200c578e29175237c326b2261d8b0'
          assert hashlib.sha256(vb).hexdigest()=='a729fab80be362ae2b3c47ac8ba1ce0d05b1f66efb73f148b65868ad78578e25'
          r=json.loads(rb); v=json.loads(vb)
          assert r['outcome']=='BA2-A_PERSISTENT_ONE_POLARITY_CHANNEL_CERTIFIED'
          assert r['failure_count']==0 and r['falsifiers']==[]
          assert all(r['source_preimage_realizability_gate'].values())
          assert r['BA2_2_persistence']['idempotent'] is True
          assert r['BA2_3_equality_control']['expected_local_copy_then_reset'] is True
          assert r['BA2_6_xor_control']['same_transport_semantics'] is True
          assert r['minimality_pass'] is True
          assert r['information_accounting']['persistent_directional_bits']==1.0
          assert r['information_accounting']['two_polarity_channel_claimed'] is False
          assert r['BA2_10_complexity']['width_upper_bound']==13
          assert r['interpretation']['arbitrary_CNF_coverage_started'] is False and r['interpretation']['BA3_started'] is False
          assert v['status']=='PASS' and v['failure_count']==0
          print('BA2_EVIDENCE_IDENTITY=PASS')
          PY
      - name: Validate BA2 no-global-promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25BA2_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25BA2_GOVERNANCE_RECEIPT.json
      - name: Verify restricted claim did not trigger global promotion
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25BA2_GOVERNANCE_RECEIPT.json'); x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==0,x
          assert x['promotion_count_passed']==0,x
          print('BA2_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba2-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25BA2_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
