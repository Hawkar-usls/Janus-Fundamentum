name: R5 Universal GF3 Boolean Fibre Research Gate

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-universal-f3-boolean-fibre.yml'
      - 'experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py'
      - 'docs/r5_universal_f3_boolean_exactification_connected_high_nullity_checkpoint_20261014.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f3-exact-boolean-countermodels:
    name: All-input GF3 exactification, matched SAT UNSAT and connected high-corank witness family
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native cubic-linear source legality, GF3 exactness, two rank-11 instances and infinite family finite controls
        run: python -u experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py
