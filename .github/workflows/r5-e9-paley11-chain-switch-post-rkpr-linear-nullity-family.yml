name: R5 E9 Paley11 Chain-Switch Post-RKPR Linear Nullity Family

on:
  push:
    paths:
      - 'research/R5_E9_PALEY11_CHAIN_SWITCH_POST_RKPR_LINEAR_NULLITY_FAMILY_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley11_chain_switch_post_rkpr_linear_nullity_family.py'
      - '.github/workflows/r5-e9-paley11-chain-switch-post-rkpr-linear-nullity-family.yml'
  pull_request:
    paths:
      - 'research/R5_E9_PALEY11_CHAIN_SWITCH_POST_RKPR_LINEAR_NULLITY_FAMILY_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley11_chain_switch_post_rkpr_linear_nullity_family.py'
      - '.github/workflows/r5-e9-paley11-chain-switch-post-rkpr-linear-nullity-family.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Verify theorem family and RKPR behavior
        run: python experiments/r5_e9_paley11_chain_switch_post_rkpr_linear_nullity_family.py
