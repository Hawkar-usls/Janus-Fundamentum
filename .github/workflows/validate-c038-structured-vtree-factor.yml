name: Validate C038 Structured Vtree Factor Alignment

on:
  push:
    paths:
      - "experiments/direct/janus_c038_structured_vtree_factor_alignment.py"
      - "docs/C038_STRUCTURED_VTREE_FACTOR_ALIGNMENT.md"
      - "proposals/C038-JANUS-STRUCTURED-VTREE-FACTOR-ALIGNMENT.json"
      - "registry/c038-source-map.json"
      - ".github/workflows/validate-c038-structured-vtree-factor.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c038_structured_vtree_factor_alignment.py"
      - "docs/C038_STRUCTURED_VTREE_FACTOR_ALIGNMENT.md"
      - "proposals/C038-JANUS-STRUCTURED-VTREE-FACTOR-ALIGNMENT.json"
      - "registry/c038-source-map.json"
      - ".github/workflows/validate-c038-structured-vtree-factor.yml"

permissions:
  contents: read

jobs:
  structured-vtree-factor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c038_structured_vtree_factor_alignment.py --self-test
