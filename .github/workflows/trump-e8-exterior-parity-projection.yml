name: TRUMP E8 Exterior Parity Projection

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_EXTERIOR_PARITY_PROJECTION_IDENTITY_2026-09-30_v2.5.json'
      - 'research/tools/e8_exterior_parity_projection/checker.py'
      - '.github/workflows/trump-e8-exterior-parity-projection.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact exterior parity-projection checker
        run: python research/tools/e8_exterior_parity_projection/checker.py
