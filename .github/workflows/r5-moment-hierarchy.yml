name: R5 Certified Moment Hierarchy
on:
  push:
    branches:
      - research/r5-moment-hierarchy-20261015
    paths:
      - "experiments/r5_fixed_degree_moment_expert_20261015.py"
      - "experiments/r5_moment_cooperative_solver_20261015.py"
      - "experiments/r5_cooperative_scl_coverage_20261015.py"
      - "docs/r5_fixed_degree_moment_checkpoint_20261015.md"
      - ".github/workflows/r5-moment-hierarchy.yml"
  pull_request:
    paths:
      - "experiments/r5_fixed_degree_moment_expert_20261015.py"
      - "experiments/r5_cooperative_scl_coverage_20261015.py"
      - "docs/r5_fixed_degree_moment_checkpoint_20261015.md"
      - ".github/workflows/r5-moment-hierarchy.yml"
  workflow_dispatch:

jobs:
  exact-dual-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: R5 SCL native baseline
        run: python3 experiments/r5_cooperative_scl_coverage_20261015.py --self-test
      - name: Exact degree-1-2-3 moment dual, all Petersen splits, LOG_KERNEL
        run: python3 experiments/r5_fixed_degree_moment_expert_20261015.py --self-test
      - name: Integrated moment and LOG_KERNEL cooperative frontier regression
        run: python3 experiments/r5_moment_cooperative_solver_20261015.py --self-test
