name: JANUS TRUMP R50G25AW governance pre-seal

on:
  push:
    branches:
      - research/r50g25aw-defect-component-decomposition-2026-09-08
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts aw-result
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got == exp, (got, exp)
          print('POLICY_SHA256='+got)
          PY

      - name: Download exact historical AW scientific artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34168914653
          name: janus-trump-r50g25aw-result
          path: aw-result

      - name: Verify AW evidence identity and scope
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('aw-result/JANUS_TRUMP_R50G25AW_RESULT.json')
          assert p.exists(), list(Path('aw-result').glob('*'))
          raw=p.read_bytes(); x=json.loads(raw)
          got=hashlib.sha256(raw).hexdigest()
          exp='d78a6d38d45f008ca171620976b6ea2f65b46f7c51864ecd461b792051c5790a'
          assert got == exp, (got, exp)
          assert x['preregistration_commit'] == '0ae90542aea7198149c88cc1455e5553d473ea60'
          assert x['verdict'] == 'REACHABLE_DEFECT_COMPONENT_COST_EXCEEDS_L4'
          assert x['failure_count'] == 0, x['failures']
          w=x['first_component_obstruction']
          assert w['residual_hash'] == 'cfbe4a9b4d4fbe5ec09ad3aa1c1ad8fe633e358b4d8744c92890133b6fa8056b'
          assert w['ledger']['B_component'] > w['ledger']['L4_budget']
          assert w['ledger']['budget_slack'] < 0
          assert x['scientific_scope']['component_factorization_on_frozen_domain'] == 'FALSIFIED'
          assert x['scientific_scope']['recursive_separator_or_treewidth_compression'] == 'NOT_TESTED_REQUIRES_NEW_PREREGISTRATION'
          assert x['firewall']['P_VS_NP'] == 'OPEN'
          assert x['firewall']['SAT_IN_P'] == 'NOT_PROVED'
          assert x['firewall']['TRUMP_finished'] is False
          print('AW_RESULT_SHA256='+got)
          PY

      - name: Validate claim promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25AW_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25AW_GOVERNANCE_RECEIPT.json

      - name: Verify governance receipt exact allowed scope
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25AW_GOVERNANCE_RECEIPT.json')
          x=json.loads(p.read_text())
          assert x['status'] == 'PASS', x
          assert x['violation_count'] == 0, x
          assert x['promotion_count_requested'] == 2, x
          assert x['promotion_count_passed'] == 2, x
          got={(p['from'],p['to'],p['scope']) for p in x['passed_promotions']}
          expected={
            ('HYPOTHESIS','COUNTEREXAMPLE_FOUND','FROZEN_REACHABLE_AW_COMPONENT_FACTORIZATION_CANDIDATE'),
            ('COUNTEREXAMPLE_FOUND','CLAIM_REFUTED','FROZEN_REACHABLE_AW_COMPONENT_FACTORIZATION_CANDIDATE'),
          }
          assert got == expected, (got, expected)
          print('AW_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25aw-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25AW_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
