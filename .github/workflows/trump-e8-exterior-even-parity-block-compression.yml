name: TRUMP E8 exterior even-parity block compression

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_EXTERIOR_EVEN_PARITY_BLOCK_COMPRESSION_2026-09-30_v2.5.json'
      - 'research/tools/e8_exterior_even_parity_block_compression/checker.py'
      - '.github/workflows/trump-e8-exterior-even-parity-block-compression.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact exterior parity compression regression
        run: python research/tools/e8_exterior_even_parity_block_compression/checker.py
