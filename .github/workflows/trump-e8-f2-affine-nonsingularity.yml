name: TRUMP E8 F2 affine nonsingularity decision reduction

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_F2_AFFINE_NONSINGULARITY_DECISION_REDUCTION_2026-09-26_v1.3.json'
      - 'research/tools/e8_f2_affine_nonsingularity/checker.py'
      - '.github/workflows/trump-e8-f2-affine-nonsingularity.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent GF2 finite replay
        run: python research/tools/e8_f2_affine_nonsingularity/checker.py
