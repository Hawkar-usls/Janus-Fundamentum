name: R5 Atomic GF4 Cycle Cut Fourier Duality
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_atomic_gf4_cycle_cut_fourier_duality.py'
      - '.github/workflows/r5-atomic-gf4-cycle-cut-duality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fourier:
    name: 'Independent GF4 flow, anchored Potts, FK, and verified bridge gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check three integer count representations and exact source bridge proof
        run: python -u experiments/r5_universal_atomic_gf4_cycle_cut_fourier_duality.py
