name: R5 E9 Paley-Orbit Gradient Kernel Infinite Family

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_ORBIT_GRADIENT_KERNEL_INFINITE_POST_RKPR_FAMILY_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_orbit_gradient_kernel_infinite_family.py'
      - '.github/workflows/r5-e9-paley-orbit-gradient-kernel-infinite-family.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley-orbit family regression
        run: python experiments/r5_e9_paley_orbit_gradient_kernel_infinite_family.py
