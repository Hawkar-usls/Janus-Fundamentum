name: TRUMP Bucket Common-Core Semijoin Prefilter v1.1
on:
  push:
    branches: [main]
    paths:
      - 'research/TRUMP_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1_1_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bucket_common_core/common_core_semijoin_prefilter_v1_1.py'
      - 'research/tools/apma_bucket_common_core/independent_checker_v1_1.py'
      - '.github/workflows/trump-bucket-common-core-semijoin-prefilter-v1-1.yml'
  workflow_dispatch:
jobs:
  v11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run v1.1 independent checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_common_core.independent_checker_v1_1 | tee /tmp/v11.json
      - name: Assert v1.1 scoped verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/v11.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1_1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['scientific_firewall']['P_VS_NP']=='OPEN'
          assert z['scientific_firewall']['GENERAL_SAT_IN_P']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls']},sort_keys=True))
          PY
      - name: Guarded elimination v3.2 regression
        run: python -m research.tools.apma_guarded_elimination.independent_checker
      - name: Captain forensic regression
        run: python -m research.tools.apma_bucket_forensic.independent_checker
      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier
      - name: Authority notice
        run: |
          echo 'V1_FIRST_FAILURE_PRESERVED'
          echo 'REPAIR=TARGET_COMPONENT_FIRST_BUCKET_ADMISSION_ONLY'
          echo 'NO_BUDGET_RAISE'
          echo 'NO_RAW_BUCKET_CARTESIAN_PREFILTER'
          echo 'P_VS_NP=OPEN'
