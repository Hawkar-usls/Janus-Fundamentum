name: R5 E9 Paley331 character Moser balanced 4-critical cover

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY331_CHARACTER_MOSER_MINIMAL_BALANCED_4CRITICAL_COVER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley331_character_moser_balanced_4critical_cover.py'
      - '.github/workflows/r5-e9-paley331-character-moser-balanced-4critical-cover.yml'
  workflow_dispatch:

jobs:
  exact-q331-moser-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact q331 Moser replay
        run: python3 experiments/r5_e9_paley331_character_moser_balanced_4critical_cover.py
