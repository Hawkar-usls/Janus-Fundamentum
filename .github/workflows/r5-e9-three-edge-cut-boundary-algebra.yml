name: R5 E9 Three-Edge-Cut Boundary Algebra

on:
  pull_request:
    paths:
      - 'research/R5_E9_THREE_EDGE_CUT_BOUNDARY_ALGEBRA_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_three_edge_cut_boundary_algebra.py'
      - '.github/workflows/r5-e9-three-edge-cut-boundary-algebra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 3-cut boundary algebra
        run: python experiments/r5_e9_three_edge_cut_boundary_algebra.py
