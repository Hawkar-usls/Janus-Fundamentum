name: R5 Portfolio Polynomial Budget Coverage Ladder
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_portfolio_poly_budget_ladder.py'
      - '.github/workflows/r5-portfolio-poly-budget-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    name: '11 frozen SCL controls with guarded 0,n,n squared states'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic bounded exact coverage matrix
        run: python -u experiments/r5_universal_certified_portfolio_poly_budget_ladder.py
