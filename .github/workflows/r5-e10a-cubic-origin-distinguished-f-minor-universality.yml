name: R5 E10A Cubic-Origin Distinguished-f Minor Universality

on:
  pull_request:
    paths:
      - "experiments/r5_e10a_cubic_origin_distinguished_f_minor_universalization.py"
      - "research/R5_E10A_CUBIC_ORIGIN_DISTINGUISHED_F_MINOR_UNIVERSALIZATION_2026-09-25_v1.0.md"
      - "registry/JANUS_P_VS_NP_R5_E10A_CUBIC_ORIGIN_DISTINGUISHED_F_MINOR_UNIVERSALIZATION_2026-09-25_v1.0.json"
      - ".github/workflows/r5-e10a-cubic-origin-distinguished-f-minor-universality.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run distinguished-f minor universalization controls
        run: python experiments/r5_e10a_cubic_origin_distinguished_f_minor_universalization.py
