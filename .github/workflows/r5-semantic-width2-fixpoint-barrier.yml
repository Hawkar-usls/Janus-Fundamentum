name: R5 Width2 Semantic Fixedpoint Completeness Barrier
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_semantic_width2_fixpoint_barrier.py'
      - '.github/workflows/r5-semantic-width2-fixpoint-barrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-width2:
    name: 'All exact models and strongest semantic pair closure cannot force SAT witness'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustively audit width2 oracle limit on legal K33 SCL
        run: python -u experiments/r5_universal_semantic_width2_fixpoint_barrier.py
