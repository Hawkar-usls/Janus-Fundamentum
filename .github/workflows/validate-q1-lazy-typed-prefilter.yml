name: validate-q1-lazy-typed-prefilter

on:
  pull_request:
    paths:
      - 'experiments/direct/janus_tear_policy0a_q1_lazy_typed_prefilter_probe.py'
      - 'experiments/direct/janus_tear_policy0a_q1_lazy_typed_prefilter_selftest.py'
      - '.github/workflows/validate-q1-lazy-typed-prefilter.yml'
  workflow_dispatch:

jobs:
  q1-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Q1 probes
        run: |
          python -m py_compile experiments/direct/janus_tear_policy0a_q1_lazy_typed_prefilter_probe.py
          python -m py_compile experiments/direct/janus_tear_policy0a_q1_lazy_typed_prefilter_selftest.py
      - name: Q1 versus Q0 frozen calibration equivalence
        working-directory: experiments/direct
        run: python janus_tear_policy0a_q1_lazy_typed_prefilter_selftest.py
      - name: Q1 detailed calibration ledger
        working-directory: experiments/direct
        run: python janus_tear_policy0a_q1_lazy_typed_prefilter_probe.py --orders 3,4,5,6,7,8,9
