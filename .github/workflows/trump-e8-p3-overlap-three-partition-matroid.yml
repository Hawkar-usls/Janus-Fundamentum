name: TRUMP E8 P3-overlap three-partition carrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P3_OVERLAP_THREE_PARTITION_MATROID_CARRIER_2026-09-30_v2.4.json'
      - 'research/tools/e8_p3_overlap_three_partition_matroid/checker.py'
      - '.github/workflows/trump-e8-p3-overlap-three-partition-matroid.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact P3-overlap carrier regression
        run: python research/tools/e8_p3_overlap_three_partition_matroid/checker.py
