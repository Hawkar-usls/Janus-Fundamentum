name: Validate C024 Root All Variable Handoff

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_all_variable_handoff.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-all-variable-handoff.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_all_variable_handoff.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-all-variable-handoff.yml"

permissions:
  contents: read

jobs:
  root-all-variable-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test every root branch variable through GT_12
        run: python experiments/direct/janus_tear_gt_root_all_variable_handoff.py
