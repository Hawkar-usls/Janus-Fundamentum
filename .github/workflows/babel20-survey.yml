name: BABEL-20 exact rank-2 sample survey
on:
  push:
    branches: ['research/babel20-*']
  pull_request:
    paths: ['experiments/babel20/**','.github/workflows/babel20-survey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank2-study:
    strategy:
      fail-fast: false
      matrix:
        base: [SCL63, SCL126_flip16, SCL126_flip68]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack frozen proofs
        run: |
          mkdir -p /tmp/b20
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b20
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel19-scout/crossbase_verify.py experiments/babel20/survey.py /tmp/b20/
      - name: Calculate exact rank certificates
        working-directory: /tmp/b20
        run: python survey.py --base ${{ matrix.base }}
      - name: Save evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel20-sample-${{ matrix.base }}
          path: /tmp/b20/babel20_*.json
          retention-days: 7
