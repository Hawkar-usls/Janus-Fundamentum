name: R5 E9 Two-Edge-Twist 2-Lift Exact Contraction Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_TWO_EDGE_TWIST_2LIFT_EXACT_CONTRACTION_RECOGNITION_ROUTER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_two_edge_twist_2lift_exact_contraction_recognition_router.py'
      - '.github/workflows/r5-e9-two-edge-twist-2lift-exact-contraction-recognition-router.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact two-edge-twist contraction regression
        run: python experiments/r5_e9_two_edge_twist_2lift_exact_contraction_recognition_router.py
