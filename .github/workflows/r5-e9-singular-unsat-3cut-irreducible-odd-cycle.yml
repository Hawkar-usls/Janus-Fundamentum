name: R5 E9 singular UNSAT 3-cut-irreducible odd-cycle control

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_SINGULAR_UNSAT_3CUT_IRREDUCIBLE_ODD_CYCLE_CONTROL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_singular_unsat_3cut_irreducible_odd_cycle.py'
      - '.github/workflows/r5-e9-singular-unsat-3cut-irreducible-odd-cycle.yml'
  pull_request:
    paths:
      - 'research/R5_E9_SINGULAR_UNSAT_3CUT_IRREDUCIBLE_ODD_CYCLE_CONTROL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_singular_unsat_3cut_irreducible_odd_cycle.py'
      - '.github/workflows/r5-e9-singular-unsat-3cut-irreducible-odd-cycle.yml'

permissions:
