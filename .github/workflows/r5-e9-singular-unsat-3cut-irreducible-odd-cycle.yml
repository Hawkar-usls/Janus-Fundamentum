    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact hostile-control replay
        run: python experiments/r5_e9_singular_unsat_3cut_irreducible_odd_cycle.py
