name: JANUS TIME-SAT-004D9B external review package synthetic checks
on:
  push:
    branches:
      - research/time-sat-004d9b-independent-review-package-20261114
    paths:
      - .github/workflows/validate-time-sat-004d9b-external-review-package.yml
      - experiments/time_sat_004_external/time_sat_004d9b_*
      - experiments/time_sat_004_external/TIME_SAT_004D9B_DEVELOPMENT_BENCHMARK_PROTOCOL.json
      - tests/test_time_sat_004d9b_reviewer_package.py
      - docs/TIME_SAT_004D9B_INDEPENDENT_REVIEW_PACKAGE_20261114.md
permissions:
  contents: read
concurrency:
  group: janus-004d9b-synthetic-review-replay
  cancel-in-progress: false
jobs:
  offline-synthetic-review:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed no-paid SAT and crypto dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          'cryptography==46.0.3'
          'pycryptosat==5.15.0'
          'python-sat==1.9.dev17'
      - name: Ensure old 004D9 empty policy remains byte-for-byte frozen
        run: >-
          test "$(git hash-object experiments/time_sat_004_external/PREREGISTERED_004D9_EXTERNAL_WITNESS_INTAKE_20261102.json)"
          = '83f17049fdcc663dd8acc8f878e0ca9bc73623cf'
      - name: Independent brute-force math + malicious trust-lock + protocol tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d9b_reviewer_package.py' -v
      - name: Produce SHA-bound positive, dependent and negative math examples
        run: >-
          python experiments/time_sat_004_external/time_sat_004d9b_science_demo.py
          --out evidence/004d9b/math.json
      - name: Confirm no external laboratory or automatic trust-root admission
        run: >-
          python experiments/time_sat_004_external/time_sat_004d9b_trust_gate.py
          --preflight --out evidence/004d9b/trust-gate.json
      - name: Run all 4 solver arms and 3 cold paired repetitions on toy sources
        run: >-
          python experiments/time_sat_004_external/time_sat_004d9b_benchmark.py
          --out evidence/004d9b/benchmark.json
      - name: Preserve both positive and negative results, including censored arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 004d9b-synthetic-review-${{ matrix.host }}-${{ github.run_id }}
          path: evidence/004d9b/
          retention-days: 90
          if-no-files-found: warn
