name: JANUS TRUMP R44E Fixed Backdoor Machine Mining

on:
  push:
    branches:
      - research/r44-exact-representation-switchboard-coverage-counterexample-2026-09-03
  pull_request:
    paths:
      - 'research/janus_trump_r44_exact_representation_switchboard.py'
      - 'research/janus_trump_r44d_obstruction_consumption.py'
      - 'research/janus_trump_r44e_fixed_backdoor_machine_mining.py'
      - 'research/JANUS_TRUMP_R44E_FIXED_BACKDOOR_MACHINE_MINING_2026-09-03.json'
      - '.github/workflows/janus-trump-r44e-fixed-backdoor-machine-mining.yml'
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mine fixed-k exact backdoor machine
        run: python research/janus_trump_r44e_fixed_backdoor_machine_mining.py
