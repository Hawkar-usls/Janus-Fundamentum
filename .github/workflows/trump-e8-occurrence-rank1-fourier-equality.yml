name: TRUMP E8 occurrence-rank1 Fourier equality reduction

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_OCCURRENCE_RANK1_FOURIER_EQUALITY_REDUCTION_2026-09-26_v1.0.json'
      - 'research/tools/e8_occurrence_rank1_fourier_equality/checker.py'
      - '.github/workflows/trump-e8-occurrence-rank1-fourier-equality.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact small-formula replay
        run: python research/tools/e8_occurrence_rank1_fourier_equality/checker.py
