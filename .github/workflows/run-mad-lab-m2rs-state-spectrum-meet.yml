name: MAD-LAB M2R-S state-spectrum meet

on:
  push:
    branches:
      - research/janus-mad-lab-m2rs-state-spectrum-meet-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-spectrum-meet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile audit runners
        run: |
          python -m py_compile \
            experiments/mad_lab/m2rs_state_spectrum_meet.py \
            experiments/mad_lab/m2rs_prime_regression_59_97.py \
            experiments/mad_lab/m2rs_tranception_meet.py

      - name: Run theorem-safe state spectrum
        run: |
          python -m experiments.mad_lab.m2rs_state_spectrum_meet \
            --skip-primes \
            --out artifacts/mad_lab/m2rs_state_spectrum_meet.json \
            | tee /tmp/m2rs-state-spectrum.log

      - name: Run prime-only frozen-interface regression 59..97
        run: |
          python -m experiments.mad_lab.m2rs_prime_regression_59_97 \
            --out artifacts/mad_lab/m2rs_prime_regression_59_97.json \
            | tee /tmp/m2rs-primes.log

      - name: Verify anti-self-deception invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/mad_lab/m2rs_state_spectrum_meet.json').read_text())
          q = json.loads(Path('artifacts/mad_lab/m2rs_prime_regression_59_97.json').read_text())
          assert p['P_VS_NP'] == 'OPEN'
          assert q['P_VS_NP'] == 'OPEN'
          cur = p['current_door']
          old = p['historic_descendant']
          assert cur['direct_target']['B'] == 3433
          assert cur['direct_target']['verdict'] == 'OPEN'
          assert cur['theorem_verdict'] == 'OPEN_REPAIR_REQUIRED'
          assert old['theorem_verdict'] == 'OPEN_REPAIR_REQUIRED'
          assert not cur['anti_self_deception_gate']['pivot_availability_proved']
          assert not old['anti_self_deception_gate']['pivot_availability_proved']
          assert cur['meet']['exact_inverse_witness_replay']
          assert old['meet']['exact_inverse_witness_replay']
          assert not q['theorem_credit_allowed']
          for row in q['rows']:
              assert row['P_VS_NP'] == 'OPEN'
              assert not row['theorem_credit_allowed']
          print('ANTI_SELF_DECEPTION_GATE=PASS')
          PY

      - name: Upload JSON audits
        uses: actions/upload-artifact@v4
        with:
          name: m2rs-state-spectrum-meet-audit
          path: |
            artifacts/mad_lab/m2rs_state_spectrum_meet.json
            artifacts/mad_lab/m2rs_prime_regression_59_97.json
          if-no-files-found: error
