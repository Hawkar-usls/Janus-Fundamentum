name: R5 E9 Paley Orbit Canonical Diamond Cycle AF3 Cover

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_PALEY_ORBIT_CANONICAL_DIAMOND_CYCLE_AF3_POLYSIZE_COVER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley_orbit_canonical_diamond_cycle_af3_cover.py'
      - '.github/workflows/r5-e9-paley-orbit-canonical-diamond-cycle-af3-cover.yml'
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_ORBIT_CANONICAL_DIAMOND_CYCLE_AF3_POLYSIZE_COVER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley_orbit_canonical_diamond_cycle_af3_cover.py'
      - '.github/workflows/r5-e9-paley-orbit-canonical-diamond-cycle-af3-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-family-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_paley_orbit_canonical_diamond_cycle_af3_cover.py
      - name: Run canonical-diamond family regression
        run: python experiments/r5_e9_paley_orbit_canonical_diamond_cycle_af3_cover.py
