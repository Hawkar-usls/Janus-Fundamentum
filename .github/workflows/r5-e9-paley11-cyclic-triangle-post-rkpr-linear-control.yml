name: R5 E9 Paley11 Cyclic Triangle Post-RKPR Linear Control

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY11_CYCLIC_TRIANGLE_POST_RKPR_LINEAR_CONTROL_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley11_cyclic_triangle_post_rkpr_linear_control.py'
      - '.github/workflows/r5-e9-paley11-cyclic-triangle-post-rkpr-linear-control.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley11 control
        run: python experiments/r5_e9_paley11_cyclic_triangle_post_rkpr_linear_control.py
