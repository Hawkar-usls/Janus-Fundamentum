name: Validate C024 Nonroot Arborescence Exchange Census

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_arborescence_exchange_census.py"
      - ".github/workflows/validate-c024-nonroot-arborescence-exchange-census.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_arborescence_exchange_census.py"
      - ".github/workflows/validate-c024-nonroot-arborescence-exchange-census.yml"

permissions:
  contents: read

jobs:
  nonroot-arborescence-exchange-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Census all nonroot transitivity-arborescence exchanges
        run: python experiments/direct/janus_tear_gt_nonroot_arborescence_exchange_census.py
