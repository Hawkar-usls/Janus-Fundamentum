name: Validate C049.1 Phase B4.2 3k Scaffold
on:
  push:
    paths:
      - "experiments/direct/janus_c049_1_b4_2_3k_scaffold.py"
      - "experiments/direct/janus_c049_1_b4_2_3k_scaffold_verifier.py"
      - ".github/workflows/validate-c049-1-phase-b4-2-3k-scaffold.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c049_1_b4_2_3k_scaffold.py"
      - "experiments/direct/janus_c049_1_b4_2_3k_scaffold_verifier.py"
      - ".github/workflows/validate-c049-1-phase-b4-2-3k-scaffold.yml"
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c049_1_b4_2_3k_scaffold.py --output /tmp/c049-b4-2.json
      - run: python experiments/direct/janus_c049_1_b4_2_3k_scaffold_verifier.py /tmp/c049-b4-2.json
