name: R5 All-Odd Cyclic PC2 Four-Orbit Exact Proof
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_all_odd_cyclic_pc2_four_orbit_identity.py'
      - '.github/workflows/r5-all-odd-cyclic-pc2-four-orbit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-orbit:
    name: 'Exact all-odd cyclic legal SCL PC2 polynomial identity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute full Boolean ring identity, including n divisible by 3
        run: python -u experiments/r5_universal_all_odd_cyclic_pc2_four_orbit_identity.py
