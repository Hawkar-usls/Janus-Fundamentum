name: JANUS TIME-SAT-004E1 bounded longer full-process SAT cost comparison
on:
  push:
    branches: [research/time-sat-004e1-binary-tree-full-cost-20261102]
    paths:
      - experiments/direct/janus_time_sat_004e1_full_cost.py
      - tests/test_time_sat_004e1_full_cost.py
      - .github/workflows/validate-time-sat-004e1-full-cost.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004e1-fixed-public-single-instance
  cancel-in-progress: true
jobs:
  binary-tree-four-engines-real-long-budget:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only frozen peer-reviewed comparison engine pins
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          'python-sat==1.9.dev17' 'pycryptosat==5.15.0'
      - name: Check original source sha, model replay, fixed arms and exact parity cover
        run: python -m unittest discover -s tests -p 'test_time_sat_004e1_full_cost.py' -v
      - name: Original 004D4 mathematical synthetic tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4_mixed_xor.py' -v
      - name: Preserve original independent production C023 serialized checker
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Cold end-to-end original source and four engines, 2 repeats per host, 30 CPU second budget
        run: >-
          python experiments/direct/janus_time_sat_004e1_full_cost.py
          --out evidence/time_sat_004e1
      - name: Retain all completed and CPU-censored original outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004e1-${{ matrix.runner }}
          path: evidence/time_sat_004e1/comparison.json
          retention-days: 30
          if-no-files-found: warn
