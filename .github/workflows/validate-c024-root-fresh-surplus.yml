name: Validate C024 Root Fresh Surplus

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_fresh_surplus_profile.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-fresh-surplus.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_fresh_surplus_profile.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-fresh-surplus.yml"

permissions:
  contents: read

jobs:
  root-fresh-surplus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decompose root frequency gaps into fresh resolvent surplus
        run: python experiments/direct/janus_tear_gt_root_fresh_surplus_profile.py
