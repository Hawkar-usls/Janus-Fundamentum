name: JANUS TRUMP R47AA Frontier Minimum Additive Envelope Slack Profile

on:
  push:
    branches:
      - research/r47aa-frontier-minimum-additive-envelope-slack-profile-2026-09-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r47aa-frontier-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen parent and preregistration
        run: |
          python - <<'PY'
          import json, subprocess
          parent='01fb5e705967a00a4cc1444d9d33ac469a9b263a'
          prereg='e66dddfa0b4f2e2e8aaf48e153a8b412d1f9ae59'
          for c in (parent, prereg):
              subprocess.run(['git','merge-base','--is-ancestor',c,'HEAD'], check=True)
          d=json.load(open('research/JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE_PREREGISTRATION_2026-09-04.json'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['parent']['commit']==parent
          assert d['parent']['R47X_target_minimum_delta']==4
          assert d['frozen_frontier']['center_original_hash']=='eb13be26c29c106cf172db0be435aaf852d1e1248fced151c5356791f70024da'
          assert d['frozen_frontier']['ordinal_window']=='1_THROUGH_64_INCLUSIVE'
          assert d['frozen_frontier']['do_not_stop_at_first_obstruction'] is True
          assert d['frozen_search']['selection']=='FIRST_ENVELOPE_PRESERVING_CERTIFIED_PIVOT_IN_CANONICAL_VARIABLE_ORDER'
          assert d['frozen_search']['sequence_enumeration'] is False
          assert d['interpretation_ceiling']['finite_frontier_bounded_slack_proves_universal_polynomial_envelope'] is False
          assert d['epistemic_firewall']['UNIVERSAL_POLYNOMIAL_ENVELOPE_COVERAGE']=='OPEN'
          assert d['epistemic_firewall']['O4_UNIVERSAL_COVERAGE']=='OPEN'
          assert d['epistemic_firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['epistemic_firewall']['P_VS_NP']=='OPEN'
          assert d['epistemic_firewall']['TRUMP_finished'] is False
          PY

      - name: Compile frozen executor
        run: python -m py_compile experiments/janus_trump_r47aa_frontier_minimum_additive_envelope_slack_profile.py

      - name: Execute frozen frontier profile
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r47aa_frontier_minimum_additive_envelope_slack_profile.py \
            --output artifacts/JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE_RESULT_2026-09-04.json \
            | tee /tmp/r47aa.json
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE_RESULT_2026-09-04.json'))
          assert d['gate']=='JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE'
          assert d['verdict'] in {
              'FRONTIER_MAXIMUM_MINIMUM_SLACK_MEASURED__FINITE_ONLY',
              'EXPLICIT_ROOT_WITH_NO_RESCUE_FOR_DELTA_LE_V0_FOUND',
          }
          assert d['frozen_frontier']['ordinal_window']==[1,64]
          assert d['R47Z_regression']['target_hash']=='ed330049538dc3fb487019c71bb49bde65494dc88453e50bed73b49d4ee17ca6'
          assert d['R47Z_regression']['minimum_delta']==4
          assert d['R47Z_regression']['pass'] is True
          assert d['metrics']['unique_reachable_fixpoints_profiled']==len(d['roots'])
          assert d['profile_summary']['rescued_root_count'] + d['profile_summary']['unrescued_root_count'] == len(d['roots'])
          for r in d['roots']:
              assert r['attempt_count']==len(r['delta_ladder'])
              assert r['delta_ladder'][0]['delta']==0
              if r['minimum_delta'] is not None:
                  assert r['rescued_within_delta_le_V0'] is True
                  assert r['minimum_delta'] <= r['V0']
                  assert r['minimum_B']==r['C0']+r['minimum_delta']
                  assert r['delta_ladder'][-1]['covered'] is True
                  assert all(not x['covered'] for x in r['delta_ladder'][:-1])
              else:
                  assert r['rescued_within_delta_le_V0'] is False
                  assert len(r['delta_ladder'])==r['V0']+1
                  assert all(not x['covered'] for x in r['delta_ladder'])
          if d['first_unrescued_root'] is None:
              assert d['verdict']=='FRONTIER_MAXIMUM_MINIMUM_SLACK_MEASURED__FINITE_ONLY'
              assert d['profile_summary']['unrescued_root_count']==0
          else:
              assert d['verdict']=='EXPLICIT_ROOT_WITH_NO_RESCUE_FOR_DELTA_LE_V0_FOUND'
              assert d['profile_summary']['unrescued_root_count']>=1
          assert d['interpretation']['finite_maximum_delta_is_not_asymptotic_bound'] is True
          assert d['interpretation']['bounded_frontier_does_not_prove_universal_polynomial_envelope'] is True
          assert d['firewall']['UNIVERSAL_POLYNOMIAL_ENVELOPE_COVERAGE']=='OPEN'
          assert d['firewall']['O4_UNIVERSAL_COVERAGE']=='OPEN'
          assert d['firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['firewall']['P_EQ_NP']=='NOT_PROVED'
          assert d['firewall']['P_NE_NP']=='NOT_PROVED'
          assert d['firewall']['P_VS_NP']=='OPEN'
          assert d['firewall']['TRUMP_finished'] is False
          print('R47AA_GATE=PASS')
          print('R47AA_VERDICT=',d['verdict'])
          print('R47AA_METRICS=',json.dumps(d['metrics'],sort_keys=True))
          print('R47AA_PROFILE=',json.dumps(d['profile_summary'],sort_keys=True))
          if d['hardest_rescued_root'] is not None:
              h=d['hardest_rescued_root']
              print('R47AA_HARDEST=',json.dumps({'root_hash':h['root_hash'],'root_CLV':h['root_CLV'],'minimum_delta':h['minimum_delta'],'minimum_B':h['minimum_B'],'provenance':h['provenance']},sort_keys=True))
          if d['first_unrescued_root'] is not None:
              u=d['first_unrescued_root']
              print('R47AA_UNRESCUED=',json.dumps({'root_hash':u['root_hash'],'root_CLV':u['root_CLV'],'V0':u['V0'],'provenance':u['provenance'],'last_obstruction':u['last_obstruction_if_unrescued']},sort_keys=True))
          PY

      - name: Upload full scientific result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE_RESULT
          path: artifacts/JANUS_TRUMP_R47AA_FRONTIER_MINIMUM_ADDITIVE_ENVELOPE_SLACK_PROFILE_RESULT_2026-09-04.json
          if-no-files-found: error
          retention-days: 90
