name: Validate C024 Resolution Output Double Bridge Creation

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_resolution_output_double_bridge_creation.py"
      - ".github/workflows/validate-c024-resolution-output-double-bridge-creation.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_resolution_output_double_bridge_creation.py"
      - ".github/workflows/validate-c024-resolution-output-double-bridge-creation.yml"

permissions:
  contents: read

jobs:
  resolution-output-double-bridge-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit raw Resolution-output double-bridge creation
        run: python experiments/direct/janus_tear_gt_resolution_output_double_bridge_creation.py
