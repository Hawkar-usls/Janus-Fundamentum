name: R5 Connected Mod3 Loop Obstruction One HEAD Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_triple_fano_connected_divisible_high_girth_unsat.py'
      - 'experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py'
      - 'research/R5_CONNECTED_DIVISIBLE_HIGH_GIRTH_UNSAT_AND_MATCHED_SAT_PAIR_2026-10-13.md'
      - '.github/workflows/r5-connected-mod3-loop-one-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-theorems:
    name: Original connected SCL21 pair and SCL5376 high-girth UNSAT plus boundary rank
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All-source cyclic triple glue, high-girth Fano cover and matched source SAT controls
        run: python -u experiments/r5_universal_triple_fano_connected_divisible_high_girth_unsat.py
      - name: Source-verified 3-power free boundary rank and same-size SAT/UNSAT controls
        run: python -u experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py
