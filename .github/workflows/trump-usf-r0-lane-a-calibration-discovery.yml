name: TRUMP USF R0 Lane A calibration discovery only

on:
  push:
    branches:
      - research/trump-universal-structural-funnel-adversarial-family-preregistration-2026-09-10
    paths:
      - .github/workflows/trump-usf-r0-lane-a-calibration-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-a-calibration-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Assert sealed harness and source identities before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_USF_R0_EXECUTION_HARNESS_FREEZE_2026-09-10.json)" = "cc740bf5076934e1ca8d6bb1af30589a46073996"
          test "$(git hash-object research/trump_usf_r0_execution_harness_frozen_entrypoint.py)" = "50e8eedd461b87de37385cc9f3d30ea6224909fb"
          test "$(git hash-object research/trump_usf_r0_execution_harness.py)" = "ed4203bac76349ab377bb97f67bf1054d837bc96"
          test "$(git hash-object research/trump_usf_r0_frozen_generators.py)" = "fe33883dc08e7e1eacadf287093aa0bb1f16c19a"
          test "$(git hash-object experiments/janus_trump_r37b_fixed_certified_portfolio_restart_cycle.py)" = "f37da1c2e1696e35695096a2c748a222af7920cc"
          test "$(git hash-object experiments/janus_trump_r33_certified_safe_reduction_stack_lean_core_forensics.py)" = "c9234a1ef639a009cc6cb4c8a6098fd09bf9affe"
          test "$(git hash-object experiments/janus_trump_r34_affine_xor_terminal_against_tseitin_core.py)" = "7f9bec920fa47af066570d874fe9127dc4b9b968"
          test "$(git hash-object experiments/janus_trump_r35_nonaffine_core_freeze_structure_intake.py)" = "ad237e341d9659d33da0568f134815776c1f95d8"
          test "$(git hash-object experiments/janus_trump_r35b_single_literal_rup_vivification.py)" = "259d2e38947d09b0c058963ad825a57f2e734203"
          test "$(git hash-object experiments/janus_trump_r38_portfolio_fixpoint_freeze_structure_intake.py)" = "816b53c390d78af415e580eaf358acf191796205"
          test "$(git hash-object experiments/trump_r38_fixpoint_to_ba25_factor_graph_diagnostic.py)" = "ea36a6b69f8c6034aa00ae4c4217bbd4d7735750"
          test "$(git hash-object research/janus_trump_r50g25ba25.py)" = "cad9c5f837d9d3c4e1c4bd4abef40976f2bb36ff"
          printf '%s\n' 'SEALED_HARNESS_AND_ALL_FROZEN_SOURCE_BLOBS_PASS=true'

      - name: Install exact pinned truth binaries
        shell: bash
        env:
          CADICAL_PACKAGE_SHA256: d25649a8bb30bede6af5b5d81cc9fce4017197640940863283df722eff88f88d
          LRAT_PACKAGE_SHA256: a2613ed11f3b2ee1a183ed64ba265a7d88b9b892cef1a40a9097132ccabcc31f
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/usf-r0-lane-a-tools"
          mkdir -p "$ROOT/cad" "$ROOT/lrat"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/c/cadical/cadical_1.7.4-1+b1_amd64.deb' -o "$ROOT/cadical.deb"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/d/drat-trim/drat-trim_0.0~git20240428.effa1dc-2_amd64.deb' -o "$ROOT/lrat.deb"
          printf '%s  %s\n' "$CADICAL_PACKAGE_SHA256" "$ROOT/cadical.deb" | sha256sum -c -
          printf '%s  %s\n' "$LRAT_PACKAGE_SHA256" "$ROOT/lrat.deb" | sha256sum -c -
          dpkg-deb -x "$ROOT/cadical.deb" "$ROOT/cad"
          dpkg-deb -x "$ROOT/lrat.deb" "$ROOT/lrat"
          test "$(sha256sum "$ROOT/cad/usr/bin/cadical" | cut -d' ' -f1)" = "d258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39"
          test "$(sha256sum "$ROOT/lrat/usr/bin/lrat-check" | cut -d' ' -f1)" = "35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c"
          sudo install -m 0755 "$ROOT/cad/usr/bin/cadical" /usr/bin/cadical
          sudo install -m 0755 "$ROOT/lrat/usr/bin/lrat-check" /usr/bin/lrat-check
          test "$(sha256sum /usr/bin/cadical | cut -d' ' -f1)" = "d258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39"
          test "$(sha256sum /usr/bin/lrat-check | cut -d' ' -f1)" = "35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c"
          printf 'CADICAL_RUNTIME_VERSION=%s\n' "$(/usr/bin/cadical --version)"
          printf '%s\n' 'CADICAL_RUNTIME_VERSION_MISMATCH_CLASSIFICATION=PRESERVED_RUNTIME_VERSION_STRING_MISMATCH_NOT_A_PACKAGE_HASH_FAILURE'

      - name: Execute frozen Lane A discovery schedule only
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY"
          export OUT
          mkdir -p "$OUT/instances"
          python3 research/trump_usf_r0_execution_harness_frozen_entrypoint.py --print-schedule --output "$OUT/FROZEN_SCHEDULE.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys

          root = pathlib.Path('.').resolve()
          out = pathlib.Path(os.environ['OUT'])
          entry = root / 'research/trump_usf_r0_execution_harness_frozen_entrypoint.py'
          schedule = json.loads((out/'FROZEN_SCHEDULE.json').read_text())
          lane_a = [x for x in schedule['discovery_order'] if x.startswith('USF-R0|DISCOVERY|A|')]
          if len(lane_a) != 36:
              raise SystemExit(f'FROZEN_LANE_A_SCHEDULE_COUNT_DRIFT:{len(lane_a)}')
          if any('|B|' in x or '|C|' in x or '|HOLDOUT|' in x for x in lane_a):
              raise SystemExit('LANE_SCOPE_VIOLATION_BEFORE_EXECUTION')

          failures=[]; compact=[]; generated_real=0; completed=0
          allowed_truth={'SAT_WITNESS_VERIFIED','UNSAT_PROOF_VERIFIED'}

          def fail(i, reason, detail=None):
              failures.append({'scheduled_instance_id': i, 'reason': reason, 'detail': detail})

          for idx, instance_id in enumerate(lane_a):
              path = out/'instances'/f'{idx:03d}.json'
              cp = subprocess.run([sys.executable, str(entry), '--run-scheduled', instance_id, '--output', str(path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if cp.returncode != 0:
                  (out/'instances'/f'{idx:03d}.stderr.txt').write_text(cp.stderr, encoding='utf-8')
                  fail(instance_id, 'FROZEN_ENTRYPOINT_EXECUTION_FAILURE', {'returncode':cp.returncode,'stderr':cp.stderr[-4000:]})
                  break
              rec=json.loads(path.read_text())
              completed += 1
              generated_real += int(rec.get('generated_real_instance_increment',0))
              ident=rec.get('instance_identity_frozen_before_solver_output',{})
              fam=ident.get('family_id')
              terminal=rec.get('terminal_recognition',{})
              truth=rec.get('truth_oracle',{}).get('truth_state')
              before=rec.get('width_evidence',{}).get('before',{})
              after=rec.get('width_evidence',{}).get('after',{})
              reasons=[]
              if ident.get('scheduled_instance_id') != instance_id or ident.get('lane') != 'A': reasons.append('INSTANCE_IDENTITY_OR_LANE_DRIFT')
              if rec.get('canonical_entrypoint') != 'trump_usf_r0_execution_harness_frozen_entrypoint.py': reasons.append('ENTRYPOINT_DRIFT')
              if rec.get('finite_experiment_is_asymptotic_authority') is not False: reasons.append('ASYMPTOTIC_FIREWALL_DRIFT')
              if rec.get('truth_may_influence_generation_reducer_width_terminal_retention_or_later_seed') is not False: reasons.append('CAUSAL_FIREWALL_DRIFT')
              if rec.get('retained') is not True: reasons.append('RETENTION_FAILURE')
              if truth not in allowed_truth: reasons.append('TRUTH_AUTHORITY_FAILURE:'+str(truth))
              for label,w in [('before',before),('after',after)]:
                  td=w.get('independent_td_validation',{})
                  dg=w.get('independent_degeneracy_replay',{})
                  mm=w.get('independent_minor_min_width_replay',{})
                  if not td.get('pass'): reasons.append('WIDTH_TD_VALIDATION_FAILURE:'+label)
                  if not dg.get('pass'): reasons.append('WIDTH_DEGENERACY_REPLAY_FAILURE:'+label)
                  if not mm.get('pass'): reasons.append('WIDTH_MMW_REPLAY_FAILURE:'+label)
                  interval=w.get('treewidth_interval')
                  if not isinstance(interval,list) or len(interval)!=2 or interval[0]>interval[1]: reasons.append('WIDTH_INTERVAL_INVALID:'+label)
                  if w.get('exact_treewidth') is not None and interval and interval[0]!=interval[1]: reasons.append('EXACT_TREEWIDTH_WITHOUT_LB_EQ_UB:'+label)
              t=terminal.get('terminal')
              cls=terminal.get('classification')
              if fam=='A1_2SAT_EQUIVALENCE_RING' and not (cls=='TERMINAL_MEMBER' and t=='2CNF'): reasons.append('A1_REQUIRED_2CNF_RECOGNIZER_MISMATCH')
              elif fam=='A2_HORN_FORWARD_CHAIN' and not (cls=='TERMINAL_MEMBER' and t in {'HORN','EMPTY_CNF_SAT','EMPTY_CLAUSE_UNSAT'}): reasons.append('A2_REQUIRED_HORN_OR_EARLIER_TERMINAL_MISMATCH')
              elif fam=='A3_RENAMABLE_HORN_FLIPPED_WIDTH3' and not (cls=='TERMINAL_MEMBER' and t=='RENAMABLE_HORN'): reasons.append('A3_REQUIRED_RENAMABLE_HORN_MISMATCH')
              elif fam=='A4_AFFINE_TSEITIN_CIRCULAR_LADDER' and not (cls=='TERMINAL_MEMBER' and t=='AFFINE_XOR_COMPLETE_CNF_BUNDLE'): reasons.append('A4_REQUIRED_AFFINE_RECOGNIZER_MISMATCH')
              elif fam=='A5_HISTORICAL_R38':
                  red=rec.get('reducer',{})
                  if red.get('A5_source_commit')!='0b941a484143aa130bad9f7bdf9ca94fbbff79cb': reasons.append('A5_SOURCE_COMMIT_DRIFT')
                  if red.get('A5_historical_internal_residual_hash')!='3361190b3fe683457061662dd9244cd37ca79283828139666d35b01b11d2fe95': reasons.append('A5_RESIDUAL_HASH_DRIFT')
                  if rec.get('generated_real_instance_increment')!=0: reasons.append('A5_COUNTED_AS_NEW_GENERATED_INSTANCE')
                  if rec.get('width_evidence',{}).get('interval_before') != [12,19]: reasons.append('A5_BEFORE_WIDTH_INTERVAL_DRIFT')
                  if rec.get('width_evidence',{}).get('interval_after') != [6,8]: reasons.append('A5_AFTER_WIDTH_INTERVAL_DRIFT')
                  if cls!='OPEN_CORE': reasons.append('A5_FROZEN_CATALOGUE_EXPECTED_OPEN_CORE_MISMATCH')
              else:
                  if fam not in {'A1_2SAT_EQUIVALENCE_RING','A2_HORN_FORWARD_CHAIN','A3_RENAMABLE_HORN_FLIPPED_WIDTH3','A4_AFFINE_TSEITIN_CIRCULAR_LADDER','A5_HISTORICAL_R38'}:
                      reasons.append('UNEXPECTED_LANE_A_FAMILY')
              compact.append({
                  'scheduled_instance_id':instance_id,'family_id':fam,'variant':ident.get('variant'),'frozen_size_parameter':ident.get('frozen_size_parameter'),
                  'original_sha256':rec.get('original_canonical_dimacs_sha256'),'original_CLV':[ident.get('clause_count'),ident.get('literal_count'),ident.get('variable_count')],
                  'residual_sha256':rec.get('residual_canonical_dimacs_sha256'),'residual_CLV':rec.get('reducer',{}).get('residual_CLV'),
                  'terminal':terminal,'width_before':rec.get('width_evidence',{}).get('interval_before'),'width_after':rec.get('width_evidence',{}).get('interval_after'),
                  'strict_width_drop_certified':rec.get('discovery_metrics_diagnostic_only',{}).get('width_drop_certificate_condition_LBbefore_gt_UBafter'),
                  'BA25_status':rec.get('BA25_diagnostic',{}).get('status'),'truth_state':truth,'record_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'calibration_reasons':reasons
              })
              if reasons:
                  fail(instance_id,'LANE_A_CALIBRATION_FAILURE',reasons)
                  break

          passed=(not failures and completed==len(lane_a) and generated_real==35)
          summary={
              'schema':'TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY_RESULT','version':'1.0','scientific_role':'PIPELINE_CALIBRATION_ONLY_NOT_H1_EVIDENCE',
              'harness_freeze_commit':'816a428c348d52290728442b0dd5c47cea29daea','harness_freeze_receipt_blob':'cc740bf5076934e1ca8d6bb1af30589a46073996',
              'canonical_entrypoint_blob':'50e8eedd461b87de37385cc9f3d30ea6224909fb','workflow_commit':os.environ.get('GITHUB_SHA'),'run_id':int(os.environ['GITHUB_RUN_ID']),
              'scheduled_lane_a_discovery_count':len(lane_a),'completed_lane_a_records':completed,'generated_real_USF_instances_this_gate':generated_real,
              'A5_historical_replay_count':sum(1 for x in compact if x['family_id']=='A5_HISTORICAL_R38'),
              'LANE_A_CALIBRATION_PASSED':passed,'calibration_failures':failures,'instances':compact,
              'USF_DISCOVERY_EXECUTION_STARTED': completed>0,'LANE_A_EXECUTION_COMPLETE':passed,'LANE_B_EXECUTION_STARTED':False,'LANE_C_EXECUTION_STARTED':False,'HOLDOUT_EXECUTION_STARTED':False,
              'finite_experiment_is_asymptotic_authority':False,'H1':'OPEN','H2':'OPEN','H3':'OPEN','SAT_IN_P':'NOT_PROVED','P_VS_NP':'OPEN','BA26_STARTED':False,
              'stop':'STOP_AFTER_LANE_A_CALIBRATION_DISCOVERY_NO_LANE_B_C_NO_HOLDOUT_NO_BA26'
          }
          text=json.dumps(summary,indent=2,sort_keys=True)+'\n'
          (out/'LANE_A_RESULT.json').write_text(text,encoding='utf-8')
          (out/'LANE_A_RESULT.sha256').write_text(hashlib.sha256(text.encode()).hexdigest()+'  LANE_A_RESULT.json\n')
          print('LANE_A_RESULT_SHA256='+hashlib.sha256(text.encode()).hexdigest())
          print('LANE_A_COMPLETED='+str(completed))
          print('GENERATED_REAL_USF_INSTANCES_THIS_GATE='+str(generated_real))
          print('LANE_A_CALIBRATION_PASSED='+str(passed).lower())
          PY

      - name: Upload complete Lane A evidence even on calibration failure
        if: always()
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trump-usf-r0-lane-a-calibration-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY
          if-no-files-found: error
          compression-level: 9

      - name: Final fail-closed Lane A gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY/LANE_A_RESULT.json"
          test -f "$RESULT"
          python3 - "$RESULT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['LANE_A_CALIBRATION_PASSED'] is True, d['calibration_failures']
          assert d['completed_lane_a_records']==36
          assert d['generated_real_USF_instances_this_gate']==35
          assert d['A5_historical_replay_count']==1
          assert d['USF_DISCOVERY_EXECUTION_STARTED'] is True
          assert d['LANE_A_EXECUTION_COMPLETE'] is True
          assert d['LANE_B_EXECUTION_STARTED'] is False
          assert d['LANE_C_EXECUTION_STARTED'] is False
          assert d['HOLDOUT_EXECUTION_STARTED'] is False
          assert d['H1']==d['H2']==d['H3']=='OPEN'
          assert d['SAT_IN_P']=='NOT_PROVED' and d['P_VS_NP']=='OPEN' and d['BA26_STARTED'] is False
          print('LANE_A_CALIBRATION_PASSED=true')
          print('STOP_AFTER_LANE_A_CALIBRATION_DISCOVERY=true')
          PY
