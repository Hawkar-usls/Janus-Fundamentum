name: BABEL-20 exact source Koszul repair rank
on:
  push:
    branches: ['research/babel20-*']
    paths: ['experiments/babel20/source_koszul.py','.github/workflows/babel20-koszul.yml']
  pull_request:
    paths: ['experiments/babel20/source_koszul.py','.github/workflows/babel20-koszul.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-correction-rank:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {base: SCL63, seed: 38}
          - {base: SCL126_flip16, seed: 14}
          - {base: SCL126_flip16, seed: 20}
          - {base: SCL126_flip16, seed: 37}
          - {base: SCL126_flip68, seed: 16}
          - {base: SCL126_flip68, seed: 20}
          - {base: SCL126_flip68, seed: 28}
          - {base: SCL126_flip68, seed: 47}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore immutable source and exact rank utilities
        run: |
          mkdir -p /tmp/b20s
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b20s
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py /tmp/b20s/
      - name: Recreate the exact modular pivot candidates
        working-directory: /tmp/b20s
        run: python crossbase_rank2.py --base-name ${{ matrix.base }} --seed ${{ matrix.seed }} --prime 65521 --passes 4
      - name: Independently verify complete exact Q kerT cokernel
        working-directory: /tmp/b20s
        run: python exact_cokernel.py --base ${{ matrix.base }} --seed ${{ matrix.seed }}
      - name: Evaluate all reached legal source Koszul syzygies
        working-directory: /tmp/b20s
        run: python source_koszul.py --base ${{ matrix.base }} --seed ${{ matrix.seed }}
      - name: Archive exact rational response
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel20-syzygy-${{ matrix.base }}-${{ matrix.seed }}
          path: /tmp/b20s/babel20_*_koszul.json
          retention-days: 7
