name: JANUS TRUMP R50G1 R33 W4 Domain Escape Guarded Replay

on:
  workflow_dispatch:
  push:
    branches:
      - research/r50g1-r33-w4-domain-escape-guarded-replay-2026-09-05
  pull_request:
    branches:
      - research/r50g-dual-u-proof-smallest-deadcore-2026-09-05

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze post-observation guarded-replay contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/JANUS_TRUMP_R50G1_R33_W4_DOMAIN_ESCAPE_GUARDED_REPLAY_PREREGISTRATION_2026-09-05.json'))
          assert d['status']=='FROZEN_AFTER_R50G_DOMAIN_ESCAPE_OBSERVED__BEFORE_GUARDED_REPLAY'
          assert d['trigger']['R50G_run']==33922653414
          assert d['trigger']['observed_exception']=='R50A_R33_WIDTH4_PERSISTENCE_FAIL'
          assert d['frozen_repair']['new_semantic_inference_rule_added'] is False
          assert d['firewall']['GUARDED_U']=='OPEN'
          assert d['firewall']['P_VS_NP']=='OPEN'
          PY
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g1_r33_w4_domain_escape_guarded_replay.py
          PYTHONPATH=experiments pytest -q tests/test_janus_trump_r50g1_r33_w4_domain_escape_guarded_replay.py
      - name: Replay all frozen n10 worker4 roots with guarded R33 authority
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g1_r33_w4_domain_escape_guarded_replay.py \
            --output artifacts/JANUS_TRUMP_R50G1_R33_W4_DOMAIN_ESCAPE_GUARDED_REPLAY_RESULT.json
      - name: Validate result firewall
        run: |
          python - <<'PY'
          import json
          p='artifacts/JANUS_TRUMP_R50G1_R33_W4_DOMAIN_ESCAPE_GUARDED_REPLAY_RESULT.json'
          d=json.load(open(p))
          assert d['gate']=='JANUS_TRUMP_R50G1_R33_W4_DOMAIN_ESCAPE_GUARDED_REPLAY'
          assert d['metrics']['domain_escape_events']>0
          fw=d['firewall']
          assert fw['CURRENT_R50A_TOTALITY']=='REFUTED_BY_REPRODUCED_DOMAIN_ESCAPE'
          assert fw['FINITE_REPAIR_SUCCESS_PROVES_U'] is False
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          print('R50G1_VERDICT=', d['verdict'])
          print('R50G1_METRICS=', json.dumps(d['metrics'], sort_keys=True))
          if d['first_reachable_sat_open'] is not None:
              print('R50G1_REACHABLE_SAT_OPEN_HASH=', d['first_reachable_sat_open']['hash'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g1-domain-escape-guarded-replay
          path: artifacts/JANUS_TRUMP_R50G1_R33_W4_DOMAIN_ESCAPE_GUARDED_REPLAY_RESULT.json
          if-no-files-found: error
