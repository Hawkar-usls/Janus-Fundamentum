name: R5 Independent Spectral Information and High-Girth
on:
  push:
    branches: [research/r5-independent-info-highgirth-20261015]
    paths:
      - "experiments/r5_discriminant_audit_split_20261015.py"
      - "experiments/r5_high_girth_adversarial_gate_20261015.py"
      - "experiments/r5_information_twins_20261015.py"
      - "docs/r5_independent_info_highgirth_checkpoint_20261015.md"
      - ".github/workflows/r5-independent-info-highgirth.yml"
  pull_request:
    paths:
      - "experiments/r5_discriminant_audit_split_20261015.py"
      - "experiments/r5_high_girth_adversarial_gate_20261015.py"
      - "experiments/r5_information_twins_20261015.py"
      - "docs/r5_independent_info_highgirth_checkpoint_20261015.md"
      - ".github/workflows/r5-independent-info-highgirth.yml"
  workflow_dispatch:
jobs:
  exact-e4-3:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact Pless triangular moment reconstruction and core audit split
        run: python3 experiments/r5_discriminant_audit_split_20261015.py --self-test
