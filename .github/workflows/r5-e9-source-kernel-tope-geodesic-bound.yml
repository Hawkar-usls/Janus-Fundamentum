name: R5 E9 Source-kernel tope geodesic bound

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_SOURCE_KERNEL_TOPE_GEODESIC_AUGMENTING_PATH_BOUND_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_source_kernel_tope_geodesic_bound.py'
      - '.github/workflows/r5-e9-source-kernel-tope-geodesic-bound.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_source_kernel_tope_geodesic_bound.py
      - name: Replay PG15 geodesic binding
        run: python experiments/r5_e9_source_kernel_tope_geodesic_bound.py
