name: TRUMP E8 OR2 XOR3 Common-Basis Matchgate Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_OR2_XOR3_COMMON_BASIS_MATCHGATE_BARRIER_2026-09-30_v4.2.json'
      - 'research/tools/e8_or2_xor3_common_basis_matchgate/checker.py'
      - '.github/workflows/trump-e8-or2-xor3-common-basis-matchgate.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic checker dependency
        run: python -m pip install sympy
      - name: Run exact OR2/XOR3 common-basis regression
        run: python research/tools/e8_or2_xor3_common_basis_matchgate/checker.py
