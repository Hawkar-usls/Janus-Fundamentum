name: JANUS TIME-SAT-004D1 archive original XOR SAT model
on:
  push:
    branches: [research/time-sat-004d1-exact-xor-20261101]
    paths:
      - .github/workflows/archive-time-sat-004d1-original.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-time-sat-004d1-one-shot-original-archive
  cancel-in-progress: false
jobs:
  original-two-host-model-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact two original GitHub Actions ZIP artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/time-sat-004d1-original
          for spec in '13092711788 ubuntu22' '13092945914 ubuntu24'; do
            set -- ${spec}
            curl --fail --silent --show-error --retry 2 --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Hawkar-usls/Janus-Fundamentum/actions/artifacts/${1}/zip" \
              -o "/tmp/time-sat-004d1-original/${2}.zip"
          done
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path('/tmp/time-sat-004d1-original')
          expected={
              'ubuntu22.zip':'5a59326d3a308b23099e8fd7892da89b712e92173ac5459e940dad3dcd6383d7',
              'ubuntu24.zip':'4ccb7036b48941db7ca56a8d931373c31f18e7b42a2cee8b0eb4c5dc2bfe8aa1',
          }
          for filename,expected_sha in expected.items():
              assert sha256((p/filename).read_bytes()).hexdigest()==expected_sha,filename
          print('EXACT_ORIGINAL_TWO_ZIP_SHA_PASS')
          PY
      - name: Preserve original CNF and independently verify both source-bound SAT models
        run: >-
          python3 experiments/direct/janus_time_sat_004d1_archive.py
          --zip22 /tmp/time-sat-004d1-original/ubuntu22.zip
          --zip24 /tmp/time-sat-004d1-original/ubuntu24.zip
          --out experiments/time_sat_004_external/lightsout_01d6fa8_verified
      - name: Commit source, model and original ZIP to research branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = research/time-sat-004d1-exact-xor-20261101
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/time_sat_004_external/lightsout_01d6fa8_verified
          if git diff --cached --quiet; then
            echo "Source-bound model already archived."
          else
            git commit -m "evidence(TIME-SAT-004D1): preserve original GBD Lights-out and dual-worker SAT models"
            git push origin HEAD:refs/heads/research/time-sat-004d1-exact-xor-20261101
          fi
