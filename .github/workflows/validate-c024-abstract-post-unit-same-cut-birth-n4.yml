name: Validate C024 Abstract Post Unit Same Cut Birth N4

on:
  push:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_n4.py"
      - "proof_attempts/C024/GT_POST_UNIT_SAME_CUT_BIRTH_DICHOTOMY.md"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth-n4.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_n4.py"
      - "proof_attempts/C024/GT_POST_UNIT_SAME_CUT_BIRTH_DICHOTOMY.md"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth-n4.yml"

permissions:
  contents: read

jobs:
  abstract-post-unit-same-cut-birth-n4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust one-assignment same-cut births through four vertices
        run: python experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_n4.py
