name: JANUS TIME-SAT-004D5 permanently preserve exact negative original SCC evidence
on:
  push:
    branches: [research/time-sat-004d5-witnessed-binary-equivalence-20261101]
    paths: [.github/workflows/archive-time-sat-004d5-original.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-time-sat-004d5-original-archive-once
  cancel-in-progress: false
jobs:
  preserve-exact-original-dual-worker-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact original worker ZIP byte streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/time-sat-004d5-original
          for pair in '13101080422 ubuntu22' '13100636511 ubuntu24'; do
            set -- ${pair}
            curl --fail --silent --show-error --retry 2 --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Hawkar-usls/Janus-Fundamentum/actions/artifacts/${1}/zip" \
              -o "/tmp/time-sat-004d5-original/${2}.zip"
          done
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('/tmp/time-sat-004d5-original')
          expected={
            'ubuntu22.zip':'dad7459020a6b791b5a55003e34eb14f018153316f0cc32a310d8cee4a8c1d3a',
            'ubuntu24.zip':'3459ff3f9f14f7abc63d55c207172fb2a7f6e43f2377c124a38e7e3a130de65d',
          }
          for name,got in expected.items():
              assert sha256((root/name).read_bytes()).hexdigest()==got,name
          print('TIME_SAT_004D5_ORIGINAL_DUAL_ZIPS_SHA_PASS')
          PY
      - name: Reconcile original results and prior original source CNF SHA
        run: >-
          python3 experiments/time_sat_004_external/archive_time_sat_004d5_original.py
          --zip22 /tmp/time-sat-004d5-original/ubuntu22.zip
          --zip24 /tmp/time-sat-004d5-original/ubuntu24.zip
          --out experiments/time_sat_004_external/time_sat_004d5_evidence
      - name: Append original results to research branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = research/time-sat-004d5-witnessed-binary-equivalence-20261101
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/time_sat_004_external/time_sat_004d5_evidence
          if git diff --cached --quiet; then
            echo 'Original evidence already durable'
          else
            git commit -m 'evidence(TIME-SAT-004D5): archive exact original binary SCC pilot negative outcomes'
            git push origin HEAD:refs/heads/research/time-sat-004d5-witnessed-binary-equivalence-20261101
          fi
