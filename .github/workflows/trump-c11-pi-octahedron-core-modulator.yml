name: TRUMP C11 PI Octahedron Core Modulator Gate

on:
  pull_request:
    branches:
      - research/general-sat-universal-coverage-map-2026-09-19
    paths:
      - 'research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_RUN_TRIGGER_2026-09-20_v1.0.json'
      - 'research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json'
      - 'research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_QUANTIFIER_BINDING_2026-09-20_v1.0.json'
      - 'research/tools/c11_pi_octahedron_core_modulator/**'
      - '.github/workflows/trump-c11-pi-octahedron-core-modulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modulator-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind frozen authority
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            0d0060c8c2924a1b58fe691b7b1535f4e0068a7c \
            4bb20b10f235d6b607269981a139d25351a6c508 \
            af30580fd250426f2aba343fbed92a8047444075 \
            73417328da7092b9b152a3bbce8111586f10182c \
            7a6c7127b4ebe16c61000b3e49809fad85aaf33a \
            a93e96eb80186c0ca466e43b4d477cf3fdfdbf40 \
            abb201ad2c70729a66982753bdfbe44f3285f01f \
            cc6cdb2278971d5ad5377e90b6d716f555e442a4
          do
            git merge-base --is-ancestor "$sha" HEAD
          done
          test "$(git rev-parse 0d0060c8c2924a1b58fe691b7b1535f4e0068a7c:research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_PREREG_2026-09-20_v1.0.json)" = "09132719fe1da6a329d83a06d94ecdc37d3a2166"
          test "$(git rev-parse 4bb20b10f235d6b607269981a139d25351a6c508:research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_QUANTIFIER_BINDING_2026-09-20_v1.0.json)" = "43771ac28214118dedfbac9f5b49d6165dc9a27b"
          python -m py_compile \
            research/tools/c11_pi_octahedron_core_modulator/terminal_checker.py \
            research/tools/c11_pi_octahedron_core_modulator/independent_verifier.py

      - name: Run frozen strong-O2 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p octgate
          python research/tools/c11_pi_octahedron_core_modulator/terminal_checker.py \
            --prereg research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_PREREG_2026-09-20_v1.0.json \
            --binding research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_QUANTIFIER_BINDING_2026-09-20_v1.0.json \
            --freeze research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json \
            --current-control research/TRUMP_C11_X2_OCTAHEDRON_CORE_MODULATOR_CONTROL_RESULT_2026-09-20_v1.0.json \
            --out octgate/run \
            | tee octgate/candidate.stdout

      - name: Independent replay
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/c11_pi_octahedron_core_modulator/independent_verifier.py \
            --candidate octgate/run/candidate_result.json \
            --freeze research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json \
            --out octgate/independent.json \
            | tee octgate/independent.stdout

      - name: Assemble scientific manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path("octgate")
          cand=json.loads((root/"run/candidate_result.json").read_text())
          indep=json.loads((root/"independent.json").read_text())
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()

          assert cand["primary_outcome"]=="O2_OCTAHEDRON_ATTACHMENT_ESCAPE"
          assert cand["O1"]["status"]=="FALSIFIED_BY_STRONG_O2_AUTHORITATIVE_RESIDUAL"
          assert cand["O2"]["status"]=="VERIFIED"
          assert cand["O2"]["GOOD_C"] is False
          assert cand["Oct_C_complete_audit"]["literal_core_count"]==6
          assert cand["Oct_C_complete_audit"]["complete_set_matches_freeze"] is True
          assert cand["Oct_C_complete_audit"]["every_core_accounted_once"] is True
          assert cand["LOCAL_CORE_ESCAPE_COUNT"]==6
          assert cand["current_authoritative_X2_control"]["pass"] is True
          assert cand["quantifier_controls"]["TWO_CORE_MIXED_CONTROL"]["pass"] is True
          assert cand["quantifier_controls"]["EMPTY_CORE_COLORING_CONTROL"]["pass"] is True
          assert indep["verdict"]=="INDEPENDENT_STRONG_O2_FORALL_LITERAL_OCTAHEDRA_ESCAPE_VERIFIED"
          assert cand["repair_attempted"] is False
          assert cand["successor_autoactivated"] is False
          assert cand["stop"] is True

          manifest={
            "schema":"janus.trump.c11_pi_octahedron_core_modulator.scientific_manifest.v1",
            "workflow_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "frozen_preregistration":{
              "commit":"0d0060c8c2924a1b58fe691b7b1535f4e0068a7c",
              "content_blob":"09132719fe1da6a329d83a06d94ecdc37d3a2166"
            },
            "quantifier_binding":{
              "commit":"4bb20b10f235d6b607269981a139d25351a6c508",
              "content_blob":"43771ac28214118dedfbac9f5b49d6165dc9a27b"
            },
            "execution_freeze_commit":"a93e96eb80186c0ca466e43b4d477cf3fdfdbf40",
            "implementation_commits":{
              "candidate_checker":"abb201ad2c70729a66982753bdfbe44f3285f01f",
              "independent_verifier":"cc6cdb2278971d5ad5377e90b6d716f555e442a4"
            },
            "outcome":"O2_OCTAHEDRON_ATTACHMENT_ESCAPE",
            "authority_checks":cand["authority_checks"],
            "route34":cand["route34"],
            "Oct_C_complete_audit":cand["Oct_C_complete_audit"],
            "current_authoritative_X2_control":cand["current_authoritative_X2_control"],
            "quantifier_controls":cand["quantifier_controls"],
            "O1":cand["O1"],"O2":cand["O2"],"O3":cand["O3"],
            "independent_replay":{
              "verdict":indep["verdict"],
              "receipt_sha256":sha(root/"independent.json")
            },
            "candidate_receipt_sha256":sha(root/"run/candidate_result.json"),
            "source_digests":{
              "candidate_checker_sha256":sha("research/tools/c11_pi_octahedron_core_modulator/terminal_checker.py"),
              "independent_verifier_sha256":sha("research/tools/c11_pi_octahedron_core_modulator/independent_verifier.py"),
              "execution_freeze_sha256":sha("research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json"),
              "quantifier_binding_sha256":sha("research/TRUMP_C11_PI_OCTAHEDRON_CORE_MODULATOR_QUANTIFIER_BINDING_2026-09-20_v1.0.json")
            },
            "oracle_use":cand["oracle_use"],
            "scientific_ceiling":cand["scientific_ceiling"],
            "forbidden_interpretations":cand["forbidden_interpretations"],
            "repair_attempted":False,
            "successor_autoactivated":False,
            "stop":True
          }
          (root/"scientific_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
            "outcome":"O2_OCTAHEDRON_ATTACHMENT_ESCAPE",
            "Oct_C":6,
            "forall_H_exists_escape":True,
            "independent":indep["verdict"]
          },sort_keys=True))
          PY

      - name: Assert ceiling and stop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open("octgate/scientific_manifest.json"))
          assert m["outcome"]=="O2_OCTAHEDRON_ATTACHMENT_ESCAPE"
          assert m["scientific_ceiling"]["TW4"]=="NOT_OPENED"
          assert m["scientific_ceiling"]["BACKDOOR_SIZE_2"]=="NOT_OPENED"
          assert m["scientific_ceiling"]["REPAIR"]=="NOT_STARTED"
          assert m["scientific_ceiling"]["NEW_DESCRIPTOR"]=="NOT_DEFINED"
          assert m["scientific_ceiling"]["LEMMA11_P7_LIFT"]=="OPEN"
          assert m["scientific_ceiling"]["P7_FREE_4_COLOR_IN_P"]=="NOT_PROVED"
          assert m["scientific_ceiling"]["P_VS_NP"]=="OPEN"
          assert m["repair_attempted"] is False
          assert m["successor_autoactivated"] is False
          assert m["stop"] is True
          print("STOP_CEILING_PASS")
          PY

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: trump-c11-pi-octahedron-core-modulator-gate-v1
          path: octgate/
          if-no-files-found: error
          retention-days: 90
