name: JANUS TRUMP R50G25AX governance pre-seal

on:
  push:
    branches:
      - research/r50g25ax-within-component-separator-affine-quotient-2026-09-08
    paths:
      - 'governance/R50G25AX_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25ax-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts relation-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp)
          print('POLICY_SHA256='+got)
          PY
      - name: Download exact hardened AX relation artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34174223971
          name: janus-trump-r50g25ax-relation-hardened
          path: relation-artifact
      - name: Verify hardened evidence identity and local scope
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hp=list(Path('relation-artifact').rglob('JANUS_TRUMP_R50G25AX_RELATION_HARDENING.json'))
          sp=list(Path('relation-artifact').rglob('JANUS_TRUMP_R50G25AX_RESULT.json'))
          assert len(hp)==1,hp; assert len(sp)==1,sp
          hb=hp[0].read_bytes(); h=json.loads(hb)
          sb=sp[0].read_bytes(); s=json.loads(sb)
          assert hashlib.sha256(hb).hexdigest()=='5824f14d918a2f4defb31e9f9e171469a1d6cce0fa4ca5381c8ef6ed380391f6'
          assert hashlib.sha256(sb).hexdigest()=='14625269ad9730164ad9739a91d3c8562a4d6270e06624bbaba7354ffdad4bf8'
          assert h['status']=='PASS' and h['relation_pass'] is True and h['failures']==[]
          assert all(h['relation_contract'].values())
          assert h['actual_relation_dp']['decision']=='SAT'
          assert h['actual_relation_dp']['reconstruction_pass'] is True
          assert h['actual_relation_dp']['source_validation_pass'] is True
          assert h['actual_relation_dp']['certified_relation_rows_with_parity_charge']==11350
          assert h['actual_relation_dp']['max_generated_scope']==13
          assert s['separator']['induced_width']==13 and s['separator']['state_bound_2_pow_w']==8192
          print('AX_HARDENED_EVIDENCE_IDENTITY=PASS')
          PY
      - name: Validate AX promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25AX_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25AX_GOVERNANCE_RECEIPT.json
      - name: Verify exact allowed local promotions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25AX_GOVERNANCE_RECEIPT.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==4,x
          assert x['promotion_count_passed']==4,x
          got={(q['from'],q['to'],q['scope']) for q in x['passed_promotions']}
          exp={
            ('HYPOTHESIS','EMPIRICAL_PASS','EXACT_FROZEN_AW_SHIFTED_Y_COMPONENT_ONLY'),
            ('UNTESTED','LOCAL_EXACTNESS','EXACT_FROZEN_AW_SHIFTED_Y_COMPONENT_ONLY'),
            ('LOCAL_EXACTNESS','RECONSTRUCTION_VERIFIED','EXACT_FROZEN_AW_SHIFTED_Y_COMPONENT_ONLY'),
            ('NO_COMPLEXITY_CERTIFICATE','LOCAL_POLY_BOUND','FROZEN_AX_RELATION_LEDGER_ON_EXACT_AW_WITNESS_ONLY'),
          }
          assert got==exp,(got,exp)
          print('AX_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ax-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25AX_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
