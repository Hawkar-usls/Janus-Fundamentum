name: Validate C024 Root Unsafe Structural Characterization

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_unsafe_structural_characterization.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-unsafe-structural.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_unsafe_structural_characterization.py"
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - ".github/workflows/validate-c024-root-unsafe-structural.yml"

permissions:
  contents: read

jobs:
  root-unsafe-structural-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Characterize unsafe root variables and extend structural gap
        run: python experiments/direct/janus_tear_gt_root_unsafe_structural_characterization.py
