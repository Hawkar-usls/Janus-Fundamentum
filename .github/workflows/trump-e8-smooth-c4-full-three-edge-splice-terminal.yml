name: TRUMP E8 Smooth C4 Full Three-Edge Splice Path-Cycle Terminal

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_FULL_THREE_EDGE_SPLICE_PATH_CYCLE_TERMINAL_2026-09-30_v8.1.json'
      - 'research/tools/e8_smooth_c4_full_three_edge_splice_terminal/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-full-three-edge-splice-terminal.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_FULL_THREE_EDGE_SPLICE_PATH_CYCLE_TERMINAL_2026-09-30_v8.1.json'
      - 'research/tools/e8_smooth_c4_full_three_edge_splice_terminal/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-full-three-edge-splice-terminal.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay full three-edge splice finite semigroup terminal
        run: python research/tools/e8_smooth_c4_full_three_edge_splice_terminal/checker.py
