name: Validate C024 Abstract Merged Tail Origin

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_abstract_merged_tail_origin_counterexample.py"
      - ".github/workflows/validate-c024-abstract-merged-tail-origin.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_abstract_merged_tail_origin_counterexample.py"
      - ".github/workflows/validate-c024-abstract-merged-tail-origin.yml"

permissions:
  contents: read

jobs:
  abstract-merged-tail-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search abstract signed-clause counterexamples
        run: python experiments/direct/janus_tear_gt_abstract_merged_tail_origin_counterexample.py
