name: R5 Forbes Six 20-Vertex Snarks Claw ExactOne Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_forbes_six_20_snarks_claw_exactone.py'
      - 'experiments/r5_universal_j5_20vertex_snark_star_deletion_sixpole.py'
      - '.github/workflows/r5-forbes-six-20snarks-claws.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-original-source:
    name: Exact all six published 20-vertex snarks, 120 claws,1800 physical port pairings
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify six source graph edge lists / uncolourable cubic graphs and all 1800 boundary colour relations
        run: python -u experiments/r5_universal_forbes_six_20_snarks_claw_exactone.py
