name: BABEL-17 exact Koszul compatibility
on:
  push:
    branches: ['research/babel17-*']
    paths: ['experiments/babel17/**','.github/workflows/babel17-koszul.yml']
  pull_request:
    paths: ['experiments/babel17/**','.github/workflows/babel17-koszul.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-koszul-seven-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Extract frozen BABEL source and controls
        run: |
          mkdir -p /tmp/babel17k
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17k
          unzip -q experiments/babel15/BABEL15_SEED1_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17k
          unzip -q experiments/babel16/BABEL16_SEED3_CANONICAL_TRANSFER_BARRIER_20261020.zip -d /tmp/babel17k
          cp experiments/babel17/janus_babel17_syzygy.py experiments/babel17/janus_babel17_koszul.py /tmp/babel17k/
      - name: Exact zero-source Koszul compatibility
        working-directory: /tmp/babel17k
        run: python janus_babel17_koszul.py
      - name: Archive exact compatibility evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel17-koszul-seven-frequency-witness
          path: /tmp/babel17k/babel17_SEED3_KOSZUL_COMPATIBILITY.json
          retention-days: 7
