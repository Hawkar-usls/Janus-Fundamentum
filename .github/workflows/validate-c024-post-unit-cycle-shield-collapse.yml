name: Validate C024 Post Unit Cycle Shield Collapse

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_post_unit_cycle_shield_collapse.py"
      - "proof_attempts/C024/GT_POST_UNIT_CYCLE_SHIELD_ROUTE_CLASSIFICATION.md"
      - ".github/workflows/validate-c024-post-unit-cycle-shield-collapse.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_post_unit_cycle_shield_collapse.py"
      - "proof_attempts/C024/GT_POST_UNIT_CYCLE_SHIELD_ROUTE_CLASSIFICATION.md"
      - ".github/workflows/validate-c024-post-unit-cycle-shield-collapse.yml"

permissions:
  contents: read

jobs:
  post-unit-cycle-shield-collapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay reachable post-unit cycle-shield collapses
        run: python experiments/direct/janus_tear_gt_post_unit_cycle_shield_collapse.py
