name: BABEL-17 exact degree1 exclusion for seed3
on:
  push:
    branches: ['research/babel17-*']
    paths: ['experiments/babel17/janus_babel17_lower.py','.github/workflows/babel17-min-degree.yml']
  pull_request:
    paths: ['experiments/babel17/janus_babel17_lower.py','.github/workflows/babel17-min-degree.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lifted-source-lower-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact verification dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack frozen source and lower-bound code
        run: |
          mkdir -p /tmp/babel17lower
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17lower
          unzip -q experiments/babel15/BABEL15_SEED1_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17lower
          cp experiments/babel17/janus_babel17_lower.py /tmp/babel17lower/
      - name: Verify exact lower source functional and lifted homomorphism
        working-directory: /tmp/babel17lower
        run: python janus_babel17_lower.py
      - name: Preserve exact instance minimum-degree audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel17-seed3-minimum-degree4-evidence
          path: /tmp/babel17lower/babel17_SEED3_MINIMUM_DEGREE_PASS.json
          retention-days: 7
