name: Validate C024 Root Schedule Asymptotic Probe

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_schedule_asymptotic_probe.py"
      - ".github/workflows/validate-c024-root-schedule-asymptotic.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_schedule_asymptotic_probe.py"
      - ".github/workflows/validate-c024-root-schedule-asymptotic.yml"

permissions:
  contents: read

jobs:
  root-schedule-asymptotic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact root frozen schedule through GT_40
        run: python experiments/direct/janus_tear_gt_root_schedule_asymptotic_probe.py
