name: Validate C024 Double Bridge Root Owner Provenance

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_root_owner_provenance.py"
      - ".github/workflows/validate-c024-double-bridge-root-owner-provenance.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_root_owner_provenance.py"
      - ".github/workflows/validate-c024-double-bridge-root-owner-provenance.yml"

permissions:
  contents: read

jobs:
  double-bridge-root-owner-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay exact root provenance of double-bridge pairs
        run: python experiments/direct/janus_tear_gt_double_bridge_root_owner_provenance.py
