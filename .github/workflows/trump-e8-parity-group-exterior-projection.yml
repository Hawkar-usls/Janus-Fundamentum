name: TRUMP E8 parity-group exterior projection

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PARITY_GROUP_EXTERIOR_ALL_OR_NONE_PROJECTION_2026-09-30_v2.6.json'
      - 'research/tools/e8_parity_group_exterior_projection/checker.py'
      - '.github/workflows/trump-e8-parity-group-exterior-projection.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact exterior projection regression
        run: python research/tools/e8_parity_group_exterior_projection/checker.py
