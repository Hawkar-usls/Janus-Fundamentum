name: R5 E9 Paley87211 Ore13 character-gain positive control

on:
  pull_request:
    paths:
      - "research/R5_E9_PALEY87211_ORE13_CHARACTER_GAIN_POSITIVE_CONTROL_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley87211_ore13_character_gain_positive_control.py"
      - ".github/workflows/r5-e9-paley87211-ore13-character-gain.yml"
  push:
    paths:
      - "research/R5_E9_PALEY87211_ORE13_CHARACTER_GAIN_POSITIVE_CONTROL_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley87211_ore13_character_gain_positive_control.py"
      - ".github/workflows/r5-e9-paley87211-ore13-character-gain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ore13-positive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact Ore13 gain witnesses
        run: python experiments/r5_e9_paley87211_ore13_character_gain_positive_control.py
