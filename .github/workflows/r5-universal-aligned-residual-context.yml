name: R5 Universal Aligned Residual Context Barrier

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-universal-aligned-residual-context.yml'
      - 'experiments/r5_universal_aligned_residual_context_3power_n_barrier.py'
      - 'experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py'
      - 'docs/r5_universal_aligned_residual_context_3power_n_checkpoint_20261014.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fixed-frontier-states:
    name: Real GRID9 GF3 E_z, exponential aligned contextual states, symbolic affine orbit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all-input GF3 source regressions
        run: python -u experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py
      - name: Verify exact native GRID9 projection and all 3^k coordinate-aligned contextual states for k 1 through 6
        run: python -u experiments/r5_universal_aligned_residual_context_3power_n_barrier.py
