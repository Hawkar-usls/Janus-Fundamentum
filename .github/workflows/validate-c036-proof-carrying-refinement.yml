name: Validate C036 Proof-Carrying Partition Refinement

on:
  push:
    paths:
      - "experiments/direct/janus_c036_proof_carrying_partition_refinement.py"
      - "docs/C036_PROOF_CARRYING_PARTITION_REFINEMENT.md"
      - "proposals/C036-JANUS-PROOF-CARRYING-PARTITION-REFINEMENT.json"
      - "registry/c036-source-map.json"
      - ".github/workflows/validate-c036-proof-carrying-refinement.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c036_proof_carrying_partition_refinement.py"
      - "docs/C036_PROOF_CARRYING_PARTITION_REFINEMENT.md"
      - "proposals/C036-JANUS-PROOF-CARRYING-PARTITION-REFINEMENT.json"
      - "registry/c036-source-map.json"
      - ".github/workflows/validate-c036-proof-carrying-refinement.yml"

permissions:
  contents: read

jobs:
  refinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c036_proof_carrying_partition_refinement.py --self-test
