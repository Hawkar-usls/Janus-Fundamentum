name: TRUMP E8 Boolean q One-Hidden Fanout Seven-Edge Search

on:
  push:
    paths:
      - 'research/tools/e8_boolean_q_one_hidden_fanout_seven_edge/checker.cpp'
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_ONE_HIDDEN_FANOUT_SEVEN_EDGE_2026-10-01_v8.4.json'
      - '.github/workflows/trump-e8-boolean-q-one-hidden-fanout-seven-edge.yml'
  pull_request:
    paths:
      - 'research/tools/e8_boolean_q_one_hidden_fanout_seven_edge/checker.cpp'
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_ONE_HIDDEN_FANOUT_SEVEN_EDGE_2026-10-01_v8.4.json'
      - '.github/workflows/trump-e8-boolean-q-one-hidden-fanout-seven-edge.yml'
  workflow_dispatch:

jobs:
  exact-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact one-hidden fanout search
        run: g++ -O3 -march=native -std=c++17 research/tools/e8_boolean_q_one_hidden_fanout_seven_edge/checker.cpp -o /tmp/e8_q_one_hidden
      - name: Search exact bounded v8.4 language
        run: /tmp/e8_q_one_hidden
