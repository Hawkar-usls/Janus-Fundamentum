name: Validate C024 Bridge Shield Paths

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_bridge_shield_path_witness.py"
      - "experiments/direct/janus_tear_gt_root_nonminimality_bridge_shield.py"
      - "experiments/direct/janus_tear_gt_root_shield_strength_certificate.py"
      - ".github/workflows/validate-c024-bridge-shield-paths.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_bridge_shield_path_witness.py"
      - "experiments/direct/janus_tear_gt_root_nonminimality_bridge_shield.py"
      - "experiments/direct/janus_tear_gt_root_shield_strength_certificate.py"
      - ".github/workflows/validate-c024-bridge-shield-paths.yml"

permissions:
  contents: read

jobs:
  bridge-shield-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract pivot-avoiding path witnesses
        run: python experiments/direct/janus_tear_gt_bridge_shield_path_witness.py
      - name: Verify canonical root non-minimality shields
        run: python experiments/direct/janus_tear_gt_root_nonminimality_bridge_shield.py
      - name: Certify untouched root shields
        run: python experiments/direct/janus_tear_gt_root_shield_strength_certificate.py
