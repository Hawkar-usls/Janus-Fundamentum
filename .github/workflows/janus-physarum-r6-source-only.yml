name: JANUS Physarum R6 source-only precommit
on:
  push:
    branches:
      - research/time-sat-physarum-juxtapose-r6-20261115
    paths:
      - experiments/time_sat_004_external/janus_physarum_r6_new_sources.py
      - .github/workflows/janus-physarum-r6-source-only.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Precommit 120 original CNF source SHA before Physarum evaluates
        run: >-
          python experiments/time_sat_004_external/janus_physarum_r6_new_sources.py
          --out evidence/physarum-r6-sources/MANIFEST.json
      - name: Save source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: Physarum-R6-source-only-${{ github.run_id }}
          path: evidence/physarum-r6-sources/MANIFEST.json
          retention-days: 90
