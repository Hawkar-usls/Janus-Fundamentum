name: Validate C040 Portfolio-Guided Semantic Vtree Contract

on:
  push:
    paths:
      - "experiments/direct/janus_c040_portfolio_guided_vtree_contract.py"
      - "docs/C040_PORTFOLIO_GUIDED_SEMANTIC_VTREE_DISCOVERY.md"
      - "proposals/C040-PORTFOLIO-GUIDED-SEMANTIC-VTREE-DISCOVERY.json"
      - "registry/c040-vtree-source-map.json"
      - "schemas/c040-semantic-vtree-discovery-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c040-portfolio-guided-vtree.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c040_portfolio_guided_vtree_contract.py"
      - "docs/C040_PORTFOLIO_GUIDED_SEMANTIC_VTREE_DISCOVERY.md"
      - "proposals/C040-PORTFOLIO-GUIDED-SEMANTIC-VTREE-DISCOVERY.json"
      - "registry/c040-vtree-source-map.json"
      - "schemas/c040-semantic-vtree-discovery-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c040-portfolio-guided-vtree.yml"

permissions:
  contents: read

jobs:
  semantic-vtree-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile experiments/direct/janus_c040_portfolio_guided_vtree_contract.py
      - run: python experiments/direct/janus_c040_portfolio_guided_vtree_contract.py --self-test
      - run: python -m json.tool proposals/C040-PORTFOLIO-GUIDED-SEMANTIC-VTREE-DISCOVERY.json >/dev/null
      - run: python -m json.tool registry/c040-vtree-source-map.json >/dev/null
      - run: python -m json.tool schemas/c040-semantic-vtree-discovery-v1.schema.json >/dev/null
