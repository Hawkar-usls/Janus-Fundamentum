name: Validate C041 Laminar Affine Subspace Avoidance

on:
  push:
    paths:
      - "experiments/direct/janus_c041_laminar_affine_subspace_avoidance.py"
      - "docs/C041_LAMINAR_AFFINE_SUBSPACE_AVOIDANCE.md"
      - "proposals/C041-JANUS-LAMINAR-AFFINE-SUBSPACE-AVOIDANCE.json"
      - "registry/c041-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c041-laminar-affine-subspace.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c041_laminar_affine_subspace_avoidance.py"
      - "docs/C041_LAMINAR_AFFINE_SUBSPACE_AVOIDANCE.md"
      - "proposals/C041-JANUS-LAMINAR-AFFINE-SUBSPACE-AVOIDANCE.json"
      - "registry/c041-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c041-laminar-affine-subspace.yml"

permissions:
  contents: read

jobs:
  c041-laminar-affine-subspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c041_laminar_affine_subspace_avoidance.py --self-test
      - run: python -m json.tool proposals/C041-JANUS-LAMINAR-AFFINE-SUBSPACE-AVOIDANCE.json >/dev/null
      - run: python -m json.tool registry/c041-source-map.json >/dev/null
