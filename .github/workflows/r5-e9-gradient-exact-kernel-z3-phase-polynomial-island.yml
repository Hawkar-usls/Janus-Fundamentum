name: R5 E9 Gradient-Exact Kernel Z3 Phase Polynomial Island

on:
  push:
    paths:
      - 'research/R5_E9_GRADIENT_EXACT_KERNEL_Z3_PHASE_POLYNOMIAL_ISLAND_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_gradient_exact_kernel_z3_phase_polynomial_island.py'
      - '.github/workflows/r5-e9-gradient-exact-kernel-z3-phase-polynomial-island.yml'
  pull_request:
    paths:
      - 'research/R5_E9_GRADIENT_EXACT_KERNEL_Z3_PHASE_POLYNOMIAL_ISLAND_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_gradient_exact_kernel_z3_phase_polynomial_island.py'
      - '.github/workflows/r5-e9-gradient-exact-kernel-z3-phase-polynomial-island.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact gradient-phase checker
        run: python experiments/r5_e9_gradient_exact_kernel_z3_phase_polynomial_island.py
