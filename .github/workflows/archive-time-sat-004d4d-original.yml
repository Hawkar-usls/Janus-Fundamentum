name: JANUS TIME-SAT-004D4D preserve exact paged-XOR negative evidence
on:
  push:
    branches: [research/time-sat-004d4d-paged-full-support-20261101]
    paths: [.github/workflows/archive-time-sat-004d4d-original.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-time-sat-004d4d-original-archive-one-shot
  cancel-in-progress: false
jobs:
  archive-original-two-worker-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch SHA-pinned exact original Actions artifact ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/janus-time-sat-004d4d
          for pair in '13099787705 ubuntu22' '13100130974 ubuntu24'; do
            set -- ${pair}
            curl --fail --silent --show-error --retry 2 --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Hawkar-usls/Janus-Fundamentum/actions/artifacts/${1}/zip" \
              -o "/tmp/janus-time-sat-004d4d/${2}.zip"
          done
      - name: Verify frozen source CI, ZIP SHA, all original SHA and both worker receipts
        run: >-
          python3 experiments/time_sat_004_external/archive_004d4d_original.py
          --zip22 /tmp/janus-time-sat-004d4d/ubuntu22.zip
          --zip24 /tmp/janus-time-sat-004d4d/ubuntu24.zip
          --out experiments/time_sat_004_external/time_sat_004d4d_evidence
      - name: Commit append-only evidence to research branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = research/time-sat-004d4d-paged-full-support-20261101
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/time_sat_004_external/time_sat_004d4d_evidence
          if git diff --cached --quiet; then
            echo 'Original 004D4D archive already saved'
          else
            git commit -m 'evidence(004D4D): original 2-worker full support scan with zero new linear XOR'
            git push origin HEAD:refs/heads/research/time-sat-004d4d-paged-full-support-20261101
          fi
