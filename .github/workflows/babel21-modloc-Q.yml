name: BABEL-21 bounded exact reconstruction of modular source syzygies
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/modloc_exactQ.py','.github/workflows/babel21-modloc-Q.yml']
  pull_request:
    paths: ['experiments/babel21/modloc_exactQ.py','.github/workflows/babel21-modloc-Q.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct-modular-candidates-over-Q:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 37, columns: 25000, pivots: 14500}
          - {seed: 20, columns: 42000, pivots: 18000}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Recreate frozen Q cokernel and source syzygies
        run: |
          mkdir -p /tmp/b21modloc
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21modloc
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py experiments/babel21/source_kernel_probe.py experiments/babel21/modloc_exactQ.py experiments/babel21/independent_source_verify.py /tmp/b21modloc/
      - name: Generate exact Q source-functionals
        working-directory: /tmp/b21modloc
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed ${{ matrix.seed }} --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python source_koszul.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python equal_source_syzygies.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Independently validate bounded-Q candidate after modular locator
        working-directory: /tmp/b21modloc
        run: python modloc_exactQ.py --seed ${{ matrix.seed }} --maxcols ${{ matrix.columns }} --maxpivots ${{ matrix.pivots }} --bound 512
      - name: Independent exact-Q source and cover response replay
        working-directory: /tmp/b21modloc
        run: python independent_source_verify.py --seed ${{ matrix.seed }}
      - name: Archive new rational syzygies or no-candidate status
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-modloc-Q-seed${{ matrix.seed }}
          path: |
            /tmp/b21modloc/babel21_*_modloc_exactQ.json
            /tmp/b21modloc/babel21_*_independent_Q_replay.json
          retention-days: 7
