name: Validate C029 Occurrence Splitting Minor

on:
  push:
    paths:
      - "experiments/direct/janus_c029_occurrence_splitting_minor.py"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR.md"
      - "proposals/C029-JANUS-CONNECTED-OCCURRENCE-SPLITTING-MINOR.json"
      - ".github/workflows/validate-c029-occurrence-splitting-minor.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c029_occurrence_splitting_minor.py"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR.md"
      - "proposals/C029-JANUS-CONNECTED-OCCURRENCE-SPLITTING-MINOR.json"
      - ".github/workflows/validate-c029-occurrence-splitting-minor.yml"

permissions:
  contents: read

jobs:
  verify-minor-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c029_occurrence_splitting_minor.py --self-test
