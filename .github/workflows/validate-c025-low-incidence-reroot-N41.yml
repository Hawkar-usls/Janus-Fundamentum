name: validate-c025-low-incidence-reroot-N41

on:
  push:
    branches:
      - research/c025-balanced-pressure-wedge-2026-08-27
    paths:
      - 'research/C025_LOW_INCIDENCE_REROOT_INDUCTION_AND_NO_CAP_RESCUE_THROUGH_N41_2026-08-27.json'
      - 'experiments/direct/janus_low_incidence_reroot_N41_certificate.py'
      - '.github/workflows/validate-c025-low-incidence-reroot-N41.yml'
  pull_request:
    paths:
      - 'research/C025_LOW_INCIDENCE_REROOT_INDUCTION_AND_NO_CAP_RESCUE_THROUGH_N41_2026-08-27.json'
      - 'experiments/direct/janus_low_incidence_reroot_N41_certificate.py'
      - '.github/workflows/validate-c025-low-incidence-reroot-N41.yml'

jobs:
  low-incidence-reroot-N41:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact arithmetic regression
        run: python -m experiments.direct.janus_low_incidence_reroot_N41_certificate
      - name: Verify theorem scope and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('research/C025_LOW_INCIDENCE_REROOT_INDUCTION_AND_NO_CAP_RESCUE_THROUGH_N41_2026-08-27.json').read_text())
          assert d['status'] == 'PROVED_EXISTING_LOW_INCIDENCE_COMPOSITION__PROVED_NO_RAW_CAP_RESCUE_N_LE_41'
          assert d['P_VS_NP'] == 'OPEN'
          assert d['frozen_grammar_changed'] is False
          assert d['theorem_runtime_heuristics'] == 'FORBIDDEN'
          assert d['low_incidence_reroot_corollary']['status'] == 'PROVED_BY_COMPOSITION_OF_EXISTING_LEMMAS'
          assert d['inductive_partition']['status'] == 'PROVED'
          assert d['theorem']['status'] == 'PROVED'
          assert d['N42_frontier']['status'] == 'UNCERTIFIED_BY_THIS_SUFFICIENT_COMPOSITION__NOT_A_FAILURE'
          assert d['scientific_boundary']['does_not_prove_P_equals_NP'] is True
          assert d['scientific_boundary']['does_not_prove_unbounded_reachable_totality'] is True
          print('N41_LOW_INCIDENCE_REROOT_SCOPE=PASS')
          print('N42_FRONTIER_FROZEN=PASS')
          print('THEOREM_RUNTIME_HEURISTICS=FORBIDDEN')
          print('P_VS_NP=OPEN')
          PY
