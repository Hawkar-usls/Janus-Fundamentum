name: R5 N18 Structural Port-Free Small Cut Kernel Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_n18_portfree_smallcut_structural_filter.py'
      - '.github/workflows/r5-n18-portfree-smallcut-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-structural:
    name: Polynomial edge-cut structural filter on constructed n10 n14 n16 n18 source sixpoles
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect all port-free cuts of size <=3 without SAT/colouring enumeration
        run: python -u experiments/r5_universal_n18_portfree_smallcut_structural_filter.py
