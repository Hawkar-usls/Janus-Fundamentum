name: Validate C024 Local Obstruction Certificate

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_c024_local_obstruction_certificate.py"
      - "experiments/direct/janus_tear_gt_frozen_parent_unsafe_pair_search.py"
      - "experiments/direct/janus_tear_gt_bridge_endpoint_profile.py"
      - "experiments/direct/janus_tear_gt_non_tail_bridge_blockers.py"
      - "experiments/direct/janus_tear_gt_root_nonminimality_bridge_shield.py"
      - "experiments/direct/janus_tear_gt_bad_resolvent_survival_filter.py"
      - "experiments/direct/janus_tear_gt_surviving_bad_branch_geometry.py"
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_profile.py"
      - "experiments/direct/janus_tear_gt_merged_tail_extinction_provenance.py"
      - ".github/workflows/validate-c024-local-obstruction-certificate.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_c024_local_obstruction_certificate.py"
      - "experiments/direct/janus_tear_gt_frozen_parent_unsafe_pair_search.py"
      - "experiments/direct/janus_tear_gt_bridge_endpoint_profile.py"
      - "experiments/direct/janus_tear_gt_non_tail_bridge_blockers.py"
      - "experiments/direct/janus_tear_gt_root_nonminimality_bridge_shield.py"
      - "experiments/direct/janus_tear_gt_bad_resolvent_survival_filter.py"
      - "experiments/direct/janus_tear_gt_surviving_bad_branch_geometry.py"
      - "experiments/direct/janus_tear_gt_surviving_branch_frequency_profile.py"
      - "experiments/direct/janus_tear_gt_merged_tail_extinction_provenance.py"
      - ".github/workflows/validate-c024-local-obstruction-certificate.yml"

permissions:
  contents: read

jobs:
  local-obstruction-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute the complete finite C024 local obstruction package
        run: python experiments/direct/janus_tear_gt_c024_local_obstruction_certificate.py
