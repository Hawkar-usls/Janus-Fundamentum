name: TRUMP E8 Boolean q Two-Hidden Fanout State Codec

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_TWO_HIDDEN_FANOUT_STATE_CODEC_2026-10-01_v8.5.json'
      - 'research/tools/e8_boolean_q_two_hidden_fanout_state_codec/checker.cpp'
      - '.github/workflows/trump-e8-boolean-q-two-hidden-fanout-state-codec.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_BOOLEAN_Q_TWO_HIDDEN_FANOUT_STATE_CODEC_2026-10-01_v8.5.json'
      - 'research/tools/e8_boolean_q_two_hidden_fanout_state_codec/checker.cpp'
      - '.github/workflows/trump-e8-boolean-q-two-hidden-fanout-state-codec.yml'
  workflow_dispatch:

jobs:
  state-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile v8.5 state codec checker
        run: g++ -O3 -std=c++17 research/tools/e8_boolean_q_two_hidden_fanout_state_codec/checker.cpp -o /tmp/e8_q_two_hidden_codec
      - name: Replay v8.5 exact state codec constants
        run: /tmp/e8_q_two_hidden_codec
