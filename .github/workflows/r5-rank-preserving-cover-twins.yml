name: R5 Rank Preserving Cover Twins
on:
  push:
    branches: [research/r5-rank-preserving-cover-twins-20261015]
    paths:
      - "experiments/r5_rank_preserving_cover_twins_20261015.py"
      - "docs/r5_rank_preserving_cover_twins_checkpoint_20261015.md"
      - ".github/workflows/r5-rank-preserving-cover-twins.yml"
  pull_request:
    paths:
      - "experiments/r5_rank_preserving_cover_twins_20261015.py"
      - "docs/r5_rank_preserving_cover_twins_checkpoint_20261015.md"
      - ".github/workflows/r5-rank-preserving-cover-twins.yml"
  workflow_dispatch:
jobs:
  cover-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact integer ternary lift and rank obstruction with gauge checks
        run: python3 experiments/r5_rank_preserving_cover_twins_20261015.py --self-test
