name: Validate C024 Nonroot Wing Recursive Ancestry

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_wing_recursive_ancestry.py"
      - ".github/workflows/validate-c024-nonroot-wing-recursive-ancestry.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_wing_recursive_ancestry.py"
      - ".github/workflows/validate-c024-nonroot-wing-recursive-ancestry.yml"

permissions:
  contents: read

jobs:
  nonroot-wing-recursive-ancestry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay recursive ancestry of all nonroot wing parents
        run: python experiments/direct/janus_tear_gt_nonroot_wing_recursive_ancestry.py
