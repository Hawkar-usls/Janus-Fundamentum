name: TRUMP E8 C4 F3 Holographic Flattening Rank

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_f3_holographic_flattening_rank_barrier/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_F3_HOLOGRAPHIC_FLATTENING_RANK_BARRIER_2026-10-01_v8.5.6.json'
      - '.github/workflows/trump-e8-c4-f3-holographic-flattening-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-flattening-rank-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact F3 holographic flattening-rank checker
        run: python3 research/tools/e8_c4_f3_holographic_flattening_rank_barrier/checker.py
