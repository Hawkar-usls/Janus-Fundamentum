name: TRUMP E8 projected-linear relaxation barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PROJECTED_LINEAR_RELAXATION_BARRIER_2026-09-26_v1.7.json'
      - 'research/tools/e8_projected_linear_relaxation_barrier/checker.py'
      - '.github/workflows/trump-e8-projected-linear-relaxation-barrier.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent structural replay
        run: python research/tools/e8_projected_linear_relaxation_barrier/checker.py
