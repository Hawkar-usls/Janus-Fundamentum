name: run-c025-signed-regular-balanced-delta-fast

on:
  push:
    branches:
      - research/c025-phase5-11-signed-regular-delta-2026-08-28
    paths:
      - 'experiments/theorem_extraction/c025_signed_regular_balanced_delta_attack_fast.py'
      - '.github/workflows/run-c025-signed-regular-balanced-delta-fast.yml'
  workflow_dispatch:

jobs:
  signed-regular-delta-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run compute-optimized signed-regular JUXTAPOSE coverage
        shell: bash
        run: |
          set -o pipefail
          python experiments/theorem_extraction/c025_signed_regular_balanced_delta_attack_fast.py \
            --leaf-pool 1200 --pair-samples 120000 --seed 26082811 \
            | tee c025-signed-regular-balanced-delta-fast.json

      - name: Enforce exact-equivalence and fail-closed interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('c025-signed-regular-balanced-delta-fast.json').read_text())
          s=d['search']; b=d['scientific_boundary']; e=d['best_candidate']['evaluation']
          assert s['fixed_N']==614 and s['fixed_cap']==376996
          assert s['fixed_N_runtime_verification']=='PASS'
          assert s['predecessor_factorization_selftest']=='PASS'
          assert s['fast_vs_exact_factorized_equivalence']=='PASS'
          assert s['champion_independent_factorized_confirmation']=='PASS'
          assert b['same_scientific_objective_as_signed_regular_predecessor'] is True
          assert b['only_inner_loop_compute_was_optimized'] is True
          assert b['coverage_search_has_no_theorem_authority'] is True
          assert b['final_refutation_requires_exact_frozen_core_reachability'] is True
          assert b['absence_of_counterexample_is_not_proof'] is True
          assert b['same_run_theorem_promotion'] is False
          assert b['P2_REACHABLE_PRESERVATION']=='OPEN'
          assert b['P_VS_NP']=='OPEN'
          print('STATUS='+d['status'])
          print('DELTA='+str(e['delta']))
          print('MIN_RAW='+str(e['min_raw_units']))
          print('CAP='+str(e['cap']))
          print('PAIR_MARGIN='+str(e['pair_rescue_margin']))
          print('PAIR_DENSITY_MARGIN='+str(e['pair_density_margin']))
          print('ALL_PIVOT_OVERFLOW='+str(e['all_pivot_overflow']))
          print('PAIR_DISPERSED='+str(e['pair_dispersed']))
          print('SAMPLES='+str(s['pair_samples_executed']))
          print('L1='+d['candidate_results']['L1_ROOT_PHASE_POLYNOMIAL_GRAMMAR_TOTALITY'])
          print('L1A='+d['candidate_results']['L1A_ALL_PIVOT_OVERFLOW_FORCES_FREQUENT_PAIR'])
          print('L1B='+d['candidate_results']['L1B_ALL_PIVOT_OVERFLOW_FORCES_PAIR_DENSITY'])
          r=d.get('exact_reachability_replay')
          if r is not None:
              print('TARGET_REACHED='+str(r['selector_reaches_target']))
              print('TARGET_AT_CALLSITE='+str(r['target_seen_at_ordinary_callsite']))
              print('TARGET_ALL_OVERFLOW='+str(r['all_ordinary_pivots_overflow_at_target']))
              print('V2_CALLED='+str(r['v2_called_on_target']))
              print('V2_RESCUE='+str(r['v2_rescue_exists']))
          print('P_VS_NP=OPEN')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c025-signed-regular-balanced-delta-fast
          path: c025-signed-regular-balanced-delta-fast.json
