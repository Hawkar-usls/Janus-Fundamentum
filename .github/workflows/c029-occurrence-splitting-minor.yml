name: C029 Occurrence Splitting Minor

on:
  push:
    paths:
      - "experiments/direct/janus_c029_occurrence_splitting_minor.py"
      - "experiments/direct/janus_c029_occurrence_splitting_minor_holdout.py"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR.md"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR_REFERENCES.md"
      - "proposals/C029-JANUS-CONNECTED-OCCURRENCE-SPLITTING-MINOR.json"
      - ".github/workflows/c029-occurrence-splitting-minor.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c029_occurrence_splitting_minor.py"
      - "experiments/direct/janus_c029_occurrence_splitting_minor_holdout.py"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR.md"
      - "docs/C029_CONNECTED_OCCURRENCE_SPLITTING_MINOR_REFERENCES.md"
      - "proposals/C029-JANUS-CONNECTED-OCCURRENCE-SPLITTING-MINOR.json"
      - ".github/workflows/c029-occurrence-splitting-minor.yml"

permissions:
  contents: read

jobs:
  occurrence-splitting-minor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run C029 minor audit
        run: python experiments/direct/janus_c029_occurrence_splitting_minor.py --self-test

      - name: Run forgotten-occurrence holdout
        run: python experiments/direct/janus_c029_occurrence_splitting_minor_holdout.py
