name: C035 Value-Blind Mucosal Schema Probe

on:
  push:
    branches: [main]
    paths:
      - 'experiments/C035_MUCOSAL_SITE_HYSTERESIS_LOOP_REPLICATION_PREREG_v1.json'
      - 'experiments/c035_schema_probe.py'
      - '.github/workflows/c035-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Verify prereg
        run: |
          python - <<'PY'
          import json
          p=json.load(open('experiments/C035_MUCOSAL_SITE_HYSTERESIS_LOOP_REPLICATION_PREREG_v1.json'))
          assert p['status']=='FROZEN_BEFORE_UNDERLYING_WORKBOOK_VALUE_INSPECTION'
          assert p['target']['expected_md5']=='0aa6236431794c44815c9bfb3d6301d5'
          print('C035_PREREG=PASS')
          PY
      - name: Probe schema only
        shell: bash
        run: |
          set -euo pipefail
          python experiments/c035_schema_probe.py | tee schema.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c035-schema-only
          path: |
            out/C035_SCHEMA.json
            schema.log
          if-no-files-found: warn
          retention-days: 30
