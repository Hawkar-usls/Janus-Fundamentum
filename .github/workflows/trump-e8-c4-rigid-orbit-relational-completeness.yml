name: TRUMP E8 C4 Rigid Orbit Relational Completeness

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_RIGID_ORBIT_RELATIONAL_COMPLETENESS_BARRIER_2026-09-30_v7.3.json'
      - 'research/tools/e8_c4_rigid_orbit_relational_completeness/checker.py'
      - '.github/workflows/trump-e8-c4-rigid-orbit-relational-completeness.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_RIGID_ORBIT_RELATIONAL_COMPLETENESS_BARRIER_2026-09-30_v7.3.json'
      - 'research/tools/e8_c4_rigid_orbit_relational_completeness/checker.py'
      - '.github/workflows/trump-e8-c4-rigid-orbit-relational-completeness.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay rigid C4 orbit relational completeness
        run: python research/tools/e8_c4_rigid_orbit_relational_completeness/checker.py
