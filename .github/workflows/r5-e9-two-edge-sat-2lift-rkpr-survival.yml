name: R5 E9 Two-Edge SAT 2-Lift RKPR Survival

on:
  push:
    paths:
      - 'research/R5_E9_TWO_EDGE_SAT_2LIFT_RKPR_SURVIVAL_LINEAR_NULLITY_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_two_edge_sat_2lift_rkpr_survival.py'
      - '.github/workflows/r5-e9-two-edge-sat-2lift-rkpr-survival.yml'
  pull_request:
    paths:
      - 'research/R5_E9_TWO_EDGE_SAT_2LIFT_RKPR_SURVIVAL_LINEAR_NULLITY_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_two_edge_sat_2lift_rkpr_survival.py'
      - '.github/workflows/r5-e9-two-edge-sat-2lift-rkpr-survival.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact RKPR-survival regression
        run: python experiments/r5_e9_two_edge_sat_2lift_rkpr_survival.py
