name: R5 Global Coverage Pinned Torus Quadratic Budget Challenge
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_global_coverage_pinned_torus_poly_attack.py'
      - '.github/workflows/r5-global-pinned-torus-poly-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toroidal-hard:
    name: 'Proven pinned UNSAT L9 L12 L15 versus guarded n and n² budgets'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Target globally hard legal toroidal SCL sources
        run: python -u experiments/r5_universal_global_coverage_pinned_torus_poly_attack.py
