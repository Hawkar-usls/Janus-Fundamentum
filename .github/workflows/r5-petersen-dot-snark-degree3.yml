name: R5 Petersen Dot Snark Native SCL81 GF3 Degree Three Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_petersen_dot_snark_gf3_degree3_dual.py'
      - '.github/workflows/r5-petersen-dot-snark-degree3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-dot-snark:
    name: Independent source UNSAT DAG + exact cubic GF3 dual on 18 vertex dot snarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real cubic dot products, source legality, exact UNSAT proof and degree3 dual
        run: python -u experiments/r5_universal_petersen_dot_snark_gf3_degree3_dual.py
