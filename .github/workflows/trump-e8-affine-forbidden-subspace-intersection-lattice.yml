name: TRUMP E8 Affine Forbidden Subspace Intersection Lattice Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_AFFINE_FORBIDDEN_SUBSPACE_INTERSECTION_LATTICE_BARRIER_2026-09-30_v4.4.json'
      - 'research/tools/e8_affine_forbidden_subspace_intersection_lattice/checker.py'
      - '.github/workflows/trump-e8-affine-forbidden-subspace-intersection-lattice.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact affine intersection-lattice regression
        run: python research/tools/e8_affine_forbidden_subspace_intersection_lattice/checker.py
