name: Validate C024 Total Component Collapse Reason Profile

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_total_component_collapse_reason_profile.py"
      - ".github/workflows/validate-c024-total-component-collapse-reason-profile.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_total_component_collapse_reason_profile.py"
      - ".github/workflows/validate-c024-total-component-collapse-reason-profile.yml"

permissions:
  contents: read

jobs:
  total-component-collapse-reason-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile exact reasons for all post-unit 2-to-1 collapses
        run: python experiments/direct/janus_tear_gt_total_component_collapse_reason_profile.py
