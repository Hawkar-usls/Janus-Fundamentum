name: Validate C033 Tractable Portfolio

on:
  push:
    paths:
      - "experiments/direct/janus_c033_tractable_portfolio.py"
      - "docs/C033_PROOF_CARRYING_TRACTABLE_PORTFOLIO.md"
      - "proposals/C033-JANUS-PROOF-CARRYING-TRACTABLE-PORTFOLIO.json"
      - "registry/references-c033.json"
      - ".github/workflows/validate-c033-tractable-portfolio.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c033_tractable_portfolio.py"
      - "docs/C033_PROOF_CARRYING_TRACTABLE_PORTFOLIO.md"
      - "proposals/C033-JANUS-PROOF-CARRYING-TRACTABLE-PORTFOLIO.json"
      - "registry/references-c033.json"
      - ".github/workflows/validate-c033-tractable-portfolio.yml"

permissions:
  contents: read

jobs:
  tractable-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c033_tractable_portfolio.py --self-test
