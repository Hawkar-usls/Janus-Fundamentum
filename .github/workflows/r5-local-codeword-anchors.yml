name: R5 Local Codeword Anchors
on:
  push:
    branches:
      - research/r5-local-codeword-anchors-20261015
    paths:
      - "experiments/r5_local_codeword_anchors_20261015.py"
      - "experiments/r5_anchored_moment_lp_20261015.py"
      - "experiments/r5_gate_e3_20261015.py"
      - "docs/r5_local_codeword_anchors_checkpoint_20261015.md"
      - ".github/workflows/r5-local-codeword-anchors.yml"
  pull_request:
    paths:
      - "experiments/r5_local_codeword_anchors_20261015.py"
      - "experiments/r5_anchored_moment_lp_20261015.py"
      - "experiments/r5_gate_e3_20261015.py"
      - "docs/r5_local_codeword_anchors_checkpoint_20261015.md"
      - ".github/workflows/r5-local-codeword-anchors.yml"
  workflow_dispatch:

jobs:
  exact-local-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Local A4 A6 and partial-cube anchor oracle tests
        run: python3 experiments/r5_local_codeword_anchors_20261015.py --self-test
