name: U-PAIR-1J implicit majority blind hostile source freeze

on:
  push:
    branches:
      - research/U-PAIR-1J-majority-blind-synthesis-2026-09-18
    paths:
      - .github/workflows/u-pair-1j-majority-blind-source-freeze.yml

permissions:
  contents: write

concurrency:
  group: u-pair-1j-majority-blind-source-freeze
  cancel-in-progress: false

jobs:
  source-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: research/U-PAIR-1J-majority-blind-synthesis-2026-09-18
      OUT_DIR: research/generated/u_pair_1j_majority_blind_inputs
      CHECK_OUT: research/U_PAIR_1J_IMPLICIT_MAJORITY_HOSTILE_INPUT_INDEPENDENT_CHECK_2026-09-18_v1.0.json

    steps:
      - name: Checkout exact blind source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen blind source authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            "research/U_PAIR_1J_IMPLICIT_MAJORITY_BLIND_SYNTHESIS_PREREGISTRATION_2026-09-18.json":"49272b132238fc05a4afc11928b094a358424095",
            "research/tools/u_pair_1j_majority_blind/hostile_input_builder.py":"22ec19e71c483eed9aaaffbc828a687c3863c32a",
            "research/tools/u_pair_1j_majority_blind/hostile_input_check.py":"d54f0a153066fa7649ed0a2272595bbb09e5bc97",
          }
          def blob(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          bad={p:(h,blob(p)) for p,h in expected.items() if blob(p)!=h}
          if bad: raise SystemExit(f"BLIND_SOURCE_AUTHORITY_BIND_FAILURE:{bad}")
          print("BLIND_SOURCE_AUTHORITIES_OK")
          PY

      - name: Generate opaque hostile inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python research/tools/u_pair_1j_majority_blind/hostile_input_builder.py "$OUT_DIR"

      - name: Verify hostile inputs independently
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/u_pair_1j_majority_blind/hostile_input_check.py "$OUT_DIR" "$CHECK_OUT"

      - name: Upload blind source receipt
        uses: actions/upload-artifact@v4
        with:
          name: u-pair-1j-majority-blind-source-${{ github.run_id }}
          path: |
            research/generated/u_pair_1j_majority_blind_inputs/
            research/U_PAIR_1J_IMPLICIT_MAJORITY_HOSTILE_INPUT_INDEPENDENT_CHECK_2026-09-18_v1.0.json
          if-no-files-found: error
          retention-days: 90

      - name: Freeze blind source inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR" "$CHECK_OUT"
          git commit -m "U-PAIR-1J freeze opaque implicit-majority hostile inputs"
          git push origin "HEAD:$BRANCH"

      - name: Enforce source freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ["CHECK_OUT"]))
          assert x["verdict"]=="PASS_INDEPENDENT_IMPLICIT_MAJORITY_HOSTILE_INPUT_FREEZE"
          assert [r["n"] for r in x["rows"]]==[5,9,17,33,65]
          assert x["reference_branch_imported"] is False
          print("IMPLICIT_MAJORITY_HOSTILE_SOURCE_FREEZE_PASS")
          PY
