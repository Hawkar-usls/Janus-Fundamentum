name: TRUMP E8 Smooth C4 Rigid Transducer Physical Splice Branching

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_RIGID_TRANSDUCER_PHYSICAL_SPLICE_BRANCHING_2026-09-30_v8.0.json'
      - 'research/tools/e8_smooth_c4_rigid_transducer_physical_splice/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-rigid-transducer-physical-splice.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_RIGID_TRANSDUCER_PHYSICAL_SPLICE_BRANCHING_2026-09-30_v8.0.json'
      - 'research/tools/e8_smooth_c4_rigid_transducer_physical_splice/checker.py'
