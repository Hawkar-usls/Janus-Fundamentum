  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay physical three-edge splice branching
        run: python research/tools/e8_smooth_c4_rigid_transducer_physical_splice/checker.py
