name: C028 Mixed Cone Invariants

on:
  push:
    paths:
      - "experiments/direct/janus_mixed_cone_invariants_ci.py"
      - "proposals/C028-JANUS-MIXED-CONE-INVARIANTS.json"
      - "docs/C028_JANUS_MIXED_CONE_INVARIANTS.md"
      - ".github/workflows/c028-mixed-cone-invariants.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_mixed_cone_invariants_ci.py"
      - "proposals/C028-JANUS-MIXED-CONE-INVARIANTS.json"
      - "docs/C028_JANUS_MIXED_CONE_INVARIANTS.md"
      - ".github/workflows/c028-mixed-cone-invariants.yml"

permissions:
  contents: read

jobs:
  mixed-cone-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run compact mixed-cone invariant audit
        run: python experiments/direct/janus_mixed_cone_invariants_ci.py
