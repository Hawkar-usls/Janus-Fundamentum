name: TRUMP E8 C4 Orbit Pairwise Gauge Holonomy

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_ORBIT_PAIRWISE_GAUGE_HOLONOMY_BARRIER_2026-09-30_v7.1.json'
      - 'research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py'
      - '.github/workflows/trump-e8-c4-orbit-pairwise-gauge-holonomy.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_ORBIT_PAIRWISE_GAUGE_HOLONOMY_BARRIER_2026-09-30_v7.1.json'
      - 'research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py'
      - '.github/workflows/trump-e8-c4-orbit-pairwise-gauge-holonomy.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay C4 orbit gauge holonomy control
        run: python research/tools/e8_c4_orbit_pairwise_gauge_holonomy/checker.py
