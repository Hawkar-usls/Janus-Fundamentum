name: R5 ExactOne Kempe Integer Orbit Partition Proof
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_exactone_kempe_integral_partition_proof.py'
      - '.github/workflows/r5-exactone-kempe-integer-partition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-integer:
    name: Enumerate and verify exact all-108 boundary-state Kempe hypercube tilings
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent pure integer exact-cover hypercube proof
        run: python -u experiments/r5_universal_exactone_kempe_integral_partition_proof.py
