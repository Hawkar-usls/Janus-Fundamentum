name: TRUMP E8 fixed auxiliary principal-minor projector barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_FIXED_AUXILIARY_PRINCIPAL_MINOR_PROJECTOR_BARRIER_2026-09-26_v1.1.json'
      - 'research/tools/e8_fixed_auxiliary_principal_minor_projector/checker.py'
      - '.github/workflows/trump-e8-fixed-auxiliary-principal-minor-projector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_fixed_auxiliary_principal_minor_projector/checker.py
