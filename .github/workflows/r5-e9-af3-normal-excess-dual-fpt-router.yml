name: R5 E9 AF3 Normal-Excess Dual FPT Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_NORMAL_EXCESS_DUAL_FPT_ROUTER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_normal_excess_dual_fpt_router.py'
      - '.github/workflows/r5-e9-af3-normal-excess-dual-fpt-router.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact AF3 normal-excess dual router regression
        run: python experiments/r5_e9_af3_normal_excess_dual_fpt_router.py
