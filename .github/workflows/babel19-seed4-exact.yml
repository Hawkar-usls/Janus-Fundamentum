name: BABEL-19 exact rational coefficient recovery seed4
on:
  push:
    branches: ['research/babel19-*']
    paths:
      - 'experiments/babel19/**'
      - '.github/workflows/babel19-seed4-exact.yml'
  pull_request:
    paths:
      - 'experiments/babel19/**'
      - '.github/workflows/babel19-seed4-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-and-seed4-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen JANUS dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore frozen base proof, rank and new rational solver
        run: |
          mkdir -p /tmp/babel19
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel19
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel18b/iterative_kerT.py experiments/babel19/*.py /tmp/babel19/
      - name: Exact synthetic DAG inverse regressions
        working-directory: /tmp/babel19
        run: python rational_dag_inverse.py
      - name: Generate frozen independent pivot witnesses
        working-directory: /tmp/babel19
        run: python iterative_kerT.py --seed 4 --passes 6
      - name: Reconstruct full seed4 exact rational identity
        working-directory: /tmp/babel19
        run: python recover_cover.py --seed 4
      - name: Independently check all cover Fourier frequencies
        working-directory: /tmp/babel19
        run: python recover_cover.py --seed 4 --verify-only
      - name: Preserve exact integer certificate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel19-seed4-exact-full-rational-fourier-certificate
          path: |
            /tmp/babel19/babel19_seed4_full_integer_identity.json.gz
            /tmp/babel19/babel18b_seed4_independent_modular_pivots.json.gz
          retention-days: 7
