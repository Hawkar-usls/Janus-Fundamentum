name: Validate C045 Joint Basis Discovery

on:
  pull_request:
    paths:
      - 'experiments/direct/janus_c045_*.py'
      - 'experiments/direct/C045-JANUS-JOINT-AFFINE-BASIS-DISCOVERY.frozen.json'
      - 'docs/C045_JOINT_AFFINE_BASIS_DISCOVERY.md'
      - 'proposals/C045-JANUS-JOINT-AFFINE-BASIS-DISCOVERY.json'
      - 'registry/c045-source-map.json'
      - 'docs/ACTIVE_PROOF_ROUTE_MATRIX.md'
      - '.github/workflows/validate-c045-joint-basis-discovery.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C045 modules
        run: |
          python -m py_compile experiments/direct/janus_c045_basis_portfolio_core.py
          python -m py_compile experiments/direct/janus_c045_basis_portfolio_solver.py
          python -m py_compile experiments/direct/janus_c045_basis_portfolio_verifier.py
          python -m py_compile experiments/direct/janus_c045_joint_basis_discovery.py
      - name: Run deterministic C045 self-test
        run: |
          PYTHONPATH=experiments/direct python experiments/direct/janus_c045_joint_basis_discovery.py --self-test --output /tmp/c045.json
          cat /tmp/c045.json
      - name: Enforce frozen deterministic audit
        run: |
          cmp /tmp/c045.json experiments/direct/C045-JANUS-JOINT-AFFINE-BASIS-DISCOVERY.frozen.json
      - name: Validate machine-readable files
        run: |
          python -m json.tool proposals/C045-JANUS-JOINT-AFFINE-BASIS-DISCOVERY.json >/dev/null
          python -m json.tool registry/c045-source-map.json >/dev/null
