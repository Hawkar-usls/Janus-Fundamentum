name: Validate C042 Bounded Affine Intersection Support

on:
  pull_request:
    paths:
      - 'experiments/direct/janus_c042_bounded_affine_intersection_support*.py'
      - 'docs/C042_BOUNDED_AFFINE_INTERSECTION_SUPPORT.md'
      - 'proposals/C042-JANUS-BOUNDED-AFFINE-INTERSECTION-SUPPORT.json'
      - 'registry/c042-source-map.json'
      - 'docs/ACTIVE_PROOF_ROUTE_MATRIX.md'
      - '.github/workflows/validate-c042-bounded-affine-intersection-support.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C042 modules
        run: |
          python -m py_compile experiments/direct/janus_c042_bounded_affine_intersection_support_core.py
          python -m py_compile experiments/direct/janus_c042_bounded_affine_intersection_support.py
      - name: Run deterministic C042 self-test
        run: |
          python experiments/direct/janus_c042_bounded_affine_intersection_support.py --self-test --output /tmp/c042-frozen.json
          cat /tmp/c042-frozen.json
      - name: Validate machine-readable files
        run: |
          python -m json.tool proposals/C042-JANUS-BOUNDED-AFFINE-INTERSECTION-SUPPORT.json >/dev/null
          python -m json.tool registry/c042-source-map.json >/dev/null
