name: validate-c025-degree3-boundary-N42

on:
  push:
    branches:
      - research/c025-balanced-pressure-wedge-2026-08-27
    paths:
      - 'research/C025_DEGREE3_BOUNDARY_AND_NO_CAP_RESCUE_THROUGH_N42_2026-08-27.json'
      - 'experiments/direct/janus_degree3_boundary_N42_certificate.py'
      - '.github/workflows/validate-c025-degree3-boundary-N42.yml'
  pull_request:
    paths:
      - 'research/C025_DEGREE3_BOUNDARY_AND_NO_CAP_RESCUE_THROUGH_N42_2026-08-27.json'
      - 'experiments/direct/janus_degree3_boundary_N42_certificate.py'
      - '.github/workflows/validate-c025-degree3-boundary-N42.yml'

jobs:
  degree3-boundary-N42:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact arithmetic regression
        run: python -m experiments.direct.janus_degree3_boundary_N42_certificate
      - name: Verify theorem scope and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('research/C025_DEGREE3_BOUNDARY_AND_NO_CAP_RESCUE_THROUGH_N42_2026-08-27.json').read_text())
          assert d['status'] == 'PROVED_EXISTING_DEGREE3_BOUNDARY_COMPOSITION__PROVED_NO_RAW_CAP_RESCUE_N_LE_42'
          assert d['P_VS_NP'] == 'OPEN'
          assert d['frozen_grammar_changed'] is False
          assert d['theorem_runtime_heuristics'] == 'FORBIDDEN'
          assert d['N42_partition']['status'] == 'PROVED'
          assert d['unique_r9_cell']['status'] == 'PROVED'
          assert d['degree3_boundary']['status'] == 'PROVED'
          assert d['degree3_raw_bound']['status'] == 'PROVED_BY_EXISTING_GENERIC_RAW_LEMMA'
          assert d['post_first_step_tail']['status'] == 'PROVED_BY_EXISTING_RECURRENCE'
          assert d['theorem']['status'] == 'PROVED'
          assert d['scientific_boundary']['does_not_prove_P_equals_NP'] is True
          assert d['scientific_boundary']['does_not_prove_unbounded_reachable_totality'] is True
          print('N42_DEGREE3_BOUNDARY_SCOPE=PASS')
          print('THEOREM_RUNTIME_HEURISTICS=FORBIDDEN')
          print('P_VS_NP=OPEN')
          PY
