name: BABEL-18B independently verified exact rational rank
on:
  push:
    branches: ['research/babel18b-*']
    paths:
      - 'experiments/babel18b/iterative_kerT.py'
      - 'experiments/babel18b/full_kerT_sparse.py'
      - 'experiments/babel18b/independent_rank_verify.py'
      - '.github/workflows/babel18b-certified-rank.yml'
  pull_request:
    paths:
      - 'experiments/babel18b/iterative_kerT.py'
      - 'experiments/babel18b/full_kerT_sparse.py'
      - 'experiments/babel18b/independent_rank_verify.py'
      - '.github/workflows/babel18b-certified-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-certified-full-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Setup dependencies for frozen instance construction
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack fixed JANUS Fourier source and rank2 geometry
        run: |
          mkdir -p /tmp/babel18b-proof
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel18b-proof
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/*.py /tmp/babel18b-proof/
      - name: Construct full sparse pivot witness for both seeds
        working-directory: /tmp/babel18b-proof
        run: python iterative_kerT.py --passes 6
      - name: Verify all modular pivots with independent source-zero checker
        working-directory: /tmp/babel18b-proof
        run: |
          python independent_rank_verify.py \
            babel18b_seed0_independent_modular_pivots.json.gz \
            babel18b_seed4_independent_modular_pivots.json.gz
      - name: Archive complete rank evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel18b-independent-exact-rational-antisector-rank
          path: |
            /tmp/babel18b-proof/babel18b_seed0_independent_modular_pivots.json.gz
            /tmp/babel18b-proof/babel18b_seed4_independent_modular_pivots.json.gz
            /tmp/babel18b-proof/babel18b_independent_rank_verdicts.json
            /tmp/babel18b-proof/babel18b_iterated_antisector_rank.json
          retention-days: 7
