name: R5 E9 Graphic Kernel Z3 Phase Exact Solver Island

on:
  pull_request:
    paths:
      - 'research/R5_E9_GRAPHIC_KERNEL_Z3_PHASE_EXACT_SOLVER_ISLAND_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_graphic_kernel_z3_phase_exact_solver_island.py'
      - '.github/workflows/r5-e9-graphic-kernel-z3-phase-exact-solver-island.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run graphic-kernel Z3 phase regression
        run: python experiments/r5_e9_graphic_kernel_z3_phase_exact_solver_island.py
