name: JANUS TRUMP R30 Consuming Fused Existential Restriction Control

on:
  push:
    branches:
      - research/janus-trump-r30-consuming-fused-existential-restriction-control-2026-09-02
    paths:
      - 'research/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_PREREGISTRATION_2026-09-02.json'
      - 'research/JANUS_TRUMP_R29_BUCKET_MESSAGE_COMPLEXITY_FORENSICS_RESULT_2026-09-02.json'
      - 'experiments/janus_trump_r18_shannon_hashcons_interface_dag_discovery.py'
      - 'experiments/janus_trump_r27_local_bucket_factored_shannon_elimination_discovery.py'
      - 'experiments/janus_trump_r30_consuming_fused_existential_restriction_control.py'
      - '.github/workflows/janus-trump-r30-consuming-fused-existential-restriction-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r30-consuming-fused-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify preregistration and frozen lineage
        run: |
          set -euo pipefail
          test "$(git hash-object research/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_PREREGISTRATION_2026-09-02.json)" = "532eb887079988cff4e0372a3609dbb14e813278"
          test "$(git hash-object experiments/janus_trump_r27_local_bucket_factored_shannon_elimination_discovery.py)" = "ff1139a4da7e9eaf43945995db95a6d22fb45dbe"
          test "$(git hash-object experiments/janus_trump_r18_shannon_hashcons_interface_dag_discovery.py)" = "afa95321ec6edbb33bef222d8ee7234fe631a599"
          test "$(git hash-object research/JANUS_TRUMP_R29_BUCKET_MESSAGE_COMPLEXITY_FORENSICS_RESULT_2026-09-02.json)" = "7c88481aaf4b308b6bfd12004f9e257d4b495315"
          python - <<'PY'
          import json
          path='research/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_PREREGISTRATION_2026-09-02.json'
          p=json.load(open(path,encoding='utf-8'))
          assert p['status']=='FROZEN_BEFORE_R30_IMPLEMENTATION_AND_EXECUTION'
          assert p['parent_R29_sealed_result_commit']=='1f1ca71c4a7a23dcca463fde5e3787772bbeac8e'
          assert p['new_operator_contract']['output_must_be_fully_materialized'] is True
          assert p['new_operator_contract']['lazy_EXISTS_node_forbidden'] is True
          assert p['new_operator_contract']['SAT_solver_forbidden'] is True
          assert p['new_operator_contract']['assignment_enumeration_forbidden'] is True
          assert p['resource_envelope']['MAX_ACTIVE_DAG_NODES']==1000000
          assert p['resource_envelope']['WALL_SECONDS']==120.0
          assert p['resource_envelope']['cap_increase_for_candidate_forbidden'] is True
          assert p['theorem_firewall']['TRUMP_finished'] is False
          assert p['theorem_firewall']['SAT_IN_P']=='NOT_PROVED'
          assert p['theorem_firewall']['P_VS_NP']=='OPEN'
          print('R30_PREREG_AND_LINEAGE_OK')
          PY

      - name: Install import-only sealed dependency
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'

      - name: Compile R30 candidate and controls
        run: PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r30_consuming_fused_existential_restriction_control.py

      - name: Execute exposed W05 consuming fused control
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r30_consuming_fused_existential_restriction_control.py \
            --output artifacts/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_RESULT_2026-09-02.json

      - name: R30 scientific integrity gate
        if: always()
        run: |
          python - <<'PY'
          import json,os,sys
          path='artifacts/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_RESULT_2026-09-02.json'
          assert os.path.exists(path)
          d=json.load(open(path,encoding='utf-8'))
          allowed={
              'R30_FAIL_INTEGRITY',
              'R30_OPEN_RESOURCE_LIMIT__NO_SEMANTIC_VERDICT',
              'R30_EXPOSED_W05_FUSED_FULL_DOMAIN_SEMANTIC_MATCH',
              'R30_EXPOSED_W05_FUSED_SEMANTIC_MISMATCH',
          }
          assert d['verdict'] in allowed
          assert d['candidate_firewall']['pass'] is True
          assert d['tiny_factor_identity_control']['pass'] is True
          assert d['tiny_protected_shared_subgraph_control']['pass'] is True
          assert d['deterministic_small_operator_equivalence_suite']['pass'] is True
          assert d['deterministic_small_operator_equivalence_suite']['cases']==128
          assert d['deterministic_small_operator_equivalence_suite']['checked_assignments']==2048
          assert d['TRUMP_finished'] is False
          assert d['SAT_IN_P']=='NOT_PROVED'
          assert d['P_VS_NP']=='OPEN'
          if d['verdict']=='R30_FAIL_INTEGRITY':
              sys.exit(2)
          candidate=d['candidate']
          assert isinstance(candidate.get('trajectory'),list)
          if d['verdict']=='R30_OPEN_RESOURCE_LIMIT__NO_SEMANTIC_VERDICT':
              assert d['truth_accessed'] is False
              assert d['verifier']['not_run'] is True
              assert candidate['status']=='OPEN_RESOURCE_LIMIT'
              assert candidate['reason'] in {'NODE_CAP','HARD_DEADLINE','RESTRICT_CALL_CAP'}
          else:
              assert candidate['status']=='COMPLETE_FACTORED_BRIDGE_INTERFACE'
              assert d['truth_accessed'] is True
              assert d['verifier']['started_after_candidate_terminal'] is True
              assert d['comparison']['full_domain'] is True
          print(json.dumps({
              'verdict':d['verdict'],
              'candidate_status':candidate.get('status'),
              'completed_quantification_steps':candidate.get('completed_quantification_steps'),
              'phase_at_open':candidate.get('phase_at_open'),
              'partial_open_step':candidate.get('partial_open_step'),
              'comparison':d.get('comparison'),
              'TRUMP_finished':d['TRUMP_finished'],
              'SAT_IN_P':d['SAT_IN_P'],
              'P_VS_NP':d['P_VS_NP'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload immutable R30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r30-consuming-fused-existential-restriction-control
          path: artifacts/JANUS_TRUMP_R30_CONSUMING_FUSED_EXISTENTIAL_RESTRICTION_CONTROL_RESULT_2026-09-02.json
          if-no-files-found: error
