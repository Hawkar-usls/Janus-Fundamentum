name: TRUMP SATLIB UF20 Corrected Reduced Raw Existing Route Reevaluation v1.1

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_2026-09-17_v1.1.json'
      - 'research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_REVIEW_2026-09-17_v1.1.json'
      - 'research/tools/apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation/**'
      - '.github/workflows/trump-satlib-uf20-r000-r111-raw-bound-pendant-reduced-existing-route-reevaluation-v1-1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  corrected-reduced-route-reevaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
      ARTIFACT_NAME: satlib-uf20-r000-r111-corrected-reduced-existing-route-reevaluation-v1-1-receipt
      RESULT_PATH: research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_RESULT_2026-09-17_v1.1.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert frozen corrected authority chain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blob(p):
              d=Path(p).read_bytes();return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          pre='research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_2026-09-17_v1.1.json'
          rev='research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_REVIEW_2026-09-17_v1.1.json'
          par='research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_EXACT_SIMULTANEOUS_ONE_ROUND_REDUCTION_RESULT_2026-09-17_v1.1.json'
          cand='research/tools/apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation/candidate.py'
          chk='research/tools/apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation/independent_checker.py'
          assert blob(pre)=='70d68119c3b61703d2b559f07de16a3f9920a2d6'
          assert blob(rev)=='71cab68e3aadd862dd8b3f29a60adf0f709759a1'
          assert blob(par)=='d91cb675e3d06fed92f97d96d6b3a0733f8be5df'
          assert blob(cand)=='9a3f5568e1625aa6620b39d348b9cc2fc56a4456'
          assert blob(chk)=='f458d41848cd320ea0de6bb38e651a4cc5867544'
          P=json.loads(Path(pre).read_text());R=json.loads(Path(rev).read_text());X=json.loads(Path(par).read_text())
          assert P['status']=='FROZEN_BEFORE_ANY_POST_REDUCTION_ROUTE_REEVALUATION_VALUE_COMPUTATION'
          assert R['verdict']=='PASS_PREREGISTRATION_CLEAN__AUTHORIZED_TO_IMPLEMENT_AND_EXECUTE_ONCE'
          assert X['verdict']=='PASS_EXACT_SIMULTANEOUS_ONE_ROUND_REDUCTION'
          assert list(P['target_reduced_raw_identities'])==['UF20_02','UF20_03','UF20_04','UF20_05']
          assert P['fresh_holdout_firewall']['values_may_be_read_or_computed'] is False
          PY

      - name: Execute corrected frozen reevaluation once
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation.candidate > /tmp/candidate.json

      - name: Independently reconstruct and verify
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation.independent_checker --candidate-json /tmp/candidate.json > /tmp/independent.json

      - name: Assert outcome and firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/candidate.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/independent.json').read_text().strip().splitlines()[-1])
          allowed={'EXISTING_ROUTE_NEWLY_CLOSES_AT_LEAST_ONE_REDUCED_RAW','NO_EXISTING_ROUTE_NEWLY_CLOSES__POST_REDUCTION_RESIDUAL_BLOCKERS_FROZEN'}
          assert c['verdict'] in allowed,c
          assert i['verified'] is True and i['candidate_imported'] is False and i['verdict']==c['verdict'],i
          assert len(c['rows'])==4
          rr=c['resource_receipt']
          assert rr['target_sources']==4 and rr['reduction_rounds']==0 and rr['post_round_target_discoveries']==0
          assert rr['new_relations_added']==0 and rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0
          assert rr['new_representation_adapters']==0 and rr['new_action_families']==0 and rr['new_signed_action_tests']==0
          assert rr['new_group_searches']==0 and rr['fresh_holdout_values_read']==0 and rr['budget_raise'] is False
          sf=c['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED' and sf['CONNECTED_MIXED_CORE_SOLVED']=='NO'
          print(json.dumps({'verdict':c['verdict'],'closed_sources':c['closed_sources'],'rows':c['rows'],'independent_verified':i['verified']},sort_keys=True))
          PY

      - name: Upload machine receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/candidate.json
            /tmp/independent.json
          if-no-files-found: error

      - name: Freeze verified corrected reevaluation result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time,urllib.request
          from pathlib import Path
          c=json.loads(Path('/tmp/candidate.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/independent.json').read_text().strip().splitlines()[-1])
          assert i['verified'] is True and i['verdict']==c['verdict']
          repo=os.environ['GITHUB_REPOSITORY'];run_id=int(os.environ['GITHUB_RUN_ID']);token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Janus-Fundamentum-corrected-route-reeval/1.1'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
          jj=[j for j in jobs if j.get('name')=='corrected-reduced-route-reevaluation'];assert len(jj)==1,jobs
          art=None
          for _ in range(20):
              aa=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
              xs=[a for a in aa if a.get('name')==os.environ['ARTIFACT_NAME']]
              if len(xs)==1:art=xs[0];break
              time.sleep(2)
          assert art is not None
          def h(p):return subprocess.check_output(['git','hash-object',p],text=True).strip()
          verdict=c['verdict']
          if verdict=='EXISTING_ROUTE_NEWLY_CLOSES_AT_LEAST_ONE_REDUCED_RAW':
              current='AT_LEAST_ONE_OF_THE_FOUR_EXACT_CORRECTED_ONE_ROUND_REDUCED_RAWS_NOW_ENTERS_AN_ALREADY_FROZEN_EXISTING_ROUTE;NO_NEW_ROUTE_OR_MECHANISM_WAS_INTRODUCED'
              missing='RETURN_TO_CAPTAIN_WITH_THE_EXACT_PER_SOURCE_EXISTING_ROUTE_CLOSURE_RECEIPTS;DISTINGUISH_ROUTE_ADMISSION_ONLY_FROM_SOLVER_AUTHORITY_AND_DO_NOT_GENERALIZE_OR_ADD_A_NEW_MECHANISM'
              next_gate='TRUMP_SATLIB_UF20_R000_R111_CORRECTED_REDUCED_EXISTING_ROUTE_CLOSURE_CAPTAIN_REVIEW_GATE'
          else:
              current='ALL_FOUR_EXACT_CORRECTED_ONE_ROUND_REDUCED_RAWS_REMAIN_UNCLOSED_BY_THE_REEVALUATED_PREEXISTING_FROZEN_ROUTE_FAMILIES'
              missing='RETURN_TO_CAPTAIN_WITH_THE_FROZEN_PER_SOURCE_POST_REDUCTION_RESIDUAL_BLOCKERS_BEFORE_ANY_NEW_FEATURE_SOLVER_CARRIER_ADAPTER_QUOTIENT_GROUP_OR_SECOND_REDUCTION_DESIGN'
              next_gate='TRUMP_SATLIB_UF20_R000_R111_CORRECTED_POST_REDUCTION_RESIDUAL_BLOCKER_CAPTAIN_REVIEW_GATE'
          result={
            'artifact_id':'JANUS-TRUMP-SATLIB-UF20-R000-R111-RAW-BOUND-PENDANT-REDUCED-EXISTING-ROUTE-REEVALUATION-RESULT-2026-09-17-v1.1',
            'date':'2026-09-17',
            'status':'FROZEN_VERIFIED_CORRECTED_REDUCED_EXISTING_ROUTE_REEVALUATION_RESULT',
            'authority':'DIAGNOSTIC_EXISTING_FROZEN_ROUTE_REEVALUATION_ONLY__NO_NEW_FEATURE_SOLVER_CARRIER_ADAPTER_QUOTIENT_GROUP_OR_SECOND_REDUCTION',
            'preregistration':{'commit':'11911db72f84cc897eda16de4b60884d9a11f260','blob':h('research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_2026-09-17_v1.1.json')},
            'preregistration_review':{'commit':'1d935d4baca1f98238f9338896588bb233575f33','blob':h('research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_REDUCED_EXISTING_ROUTE_REEVALUATION_PREREGISTRATION_REVIEW_2026-09-17_v1.1.json')},
            'parent_corrected_reduction':{'commit':'65b1248d8a67185dc41c10fb1021301350173519','blob':h('research/TRUMP_SATLIB_UF20_R000_R111_RAW_BOUND_PENDANT_EXACT_SIMULTANEOUS_ONE_ROUND_REDUCTION_RESULT_2026-09-17_v1.1.json'),'verdict':'PASS_EXACT_SIMULTANEOUS_ONE_ROUND_REDUCTION'},
            'implementation':{'candidate_commit':'c03681bde161829b84cb8b8b4b0a225b9b556e6e','candidate_blob':h('research/tools/apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation/candidate.py'),'independent_checker_commit':'286ac8ed1cf2d13fc2edaeb549d2cffd0132ec81','independent_checker_blob':h('research/tools/apma_satlib_uf20_r000_r111_raw_bound_pendant_reduced_existing_route_reevaluation/independent_checker.py'),'workflow_head_commit':os.environ['GITHUB_SHA'],'workflow_blob':h('.github/workflows/trump-satlib-uf20-r000-r111-raw-bound-pendant-reduced-existing-route-reevaluation-v1-1.yml')},
            'execution':{'run_id':run_id,'job_id':int(jj[0]['id']),'conclusion':'success','artifact_id':int(art['id']),'artifact_name':art['name'],'artifact_digest':art.get('digest',''),'independent_verified':True,'candidate_imported_by_independent_checker':False},
            'verdict':verdict,
            'source_receipts':c['rows'],
            'closed_source_count':c['closed_source_count'],
            'closed_sources':c['closed_sources'],
            'licensed_fact':{'statement':'ONLY_THE_RECORDED_EXISTING_FROZEN_ROUTE_STATUS_ON_THE_FOUR_EXACT_CORRECTED_ONE_ROUND_REDUCED_RAWS_IS_LICENSED','scope':'FOUR_FROZEN_REDUCED_RAW_IDENTITIES_ONLY'},
            'not_licensed':['ITERATE_PENDANT_REDUCTION','GENERALIZE_TO_FRESH_HOLDOUT_OR_ARBITRARY_INSTANCES','NEW_FEATURE_OR_ACTION_FAMILY','NEW_SOLVER_OR_CARRIER','NEW_ADAPTER_OR_QUOTIENT','GENERAL_SAT_IN_P','GENERAL_SAT_NOT_IN_P','P_EQUALS_NP','P_NOT_EQUALS_NP'],
            'resource_receipt':c['resource_receipt'],
            'scientific_firewall':c['scientific_firewall'],
            'captain_obvious_readout':{'current_source_line_status':current,'nearest_missing_obligation':missing,'next_gate':next_gate,'next_gate_class':'CAPTAIN_REVIEW_OF_FROZEN_CORRECTED_POST_REDUCTION_EXISTING_ROUTE_EVIDENCE_ONLY','next_gate_status':'CAPTAIN_REVIEW_REQUIRED','directive':'PIN_THIS_RESULT_AND_ALL_FOUR_REDUCED_SHA256_IDENTITIES;DO_NOT_ITERATE_REDUCTION;DO_NOT_TOUCH_UF20_011_TO_UF20_015;DO_NOT_ADD_ANY_NEW_MECHANISM_UNTIL_CAPTAIN_REVIEWS_THIS_FROZEN_RESULT'}
          }
          Path(os.environ['RESULT_PATH']).write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'verdict':verdict,'closed_sources':c['closed_sources'],'result_path':os.environ['RESULT_PATH'],'artifact_id':art['id'],'artifact_digest':art.get('digest','')},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'TRUMP freeze corrected reduced-raw existing-route reevaluation result v1.1'
          git push origin "HEAD:$BRANCH"

      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_EXISTING_FROZEN_ROUTE_REEVALUATION_ONLY'
          echo 'TARGET_REDUCED_RAWS=4'
          echo 'REDUCTION_ROUNDS=0'
          echo 'NEW_MECHANISMS=0'
          echo 'NEW_SIGNED_ACTION_TESTS=0'
          echo 'FRESH_HOLDOUT_VALUES_READ=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
