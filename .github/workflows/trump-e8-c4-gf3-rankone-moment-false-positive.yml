name: TRUMP E8 C4 GF3 Rank-One Moment False Positive

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_GF3_RANKONE_MOMENT_RELAXATION_FALSE_POSITIVE_2026-09-30_v5.6.json'
      - 'research/tools/e8_c4_gf3_rankone_moment_false_positive/checker.py'
      - '.github/workflows/trump-e8-c4-gf3-rankone-moment-false-positive.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rank-one moment false-positive regression
        run: python research/tools/e8_c4_gf3_rankone_moment_false_positive/checker.py
