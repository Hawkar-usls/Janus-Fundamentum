name: R5 Exact GF3 Boolean Degree Three Petersen Frontier
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_boolean_degree3_pc_probe.py'
      - '.github/workflows/r5-gf3-degree3-petersen-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  degree3:
    name: Complete or resource-limited original SCL Petersen degree3 polynomial calculus
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source degree3 dual proof or explicit resource guard
        run: python -u experiments/r5_universal_gf3_boolean_degree3_pc_probe.py
