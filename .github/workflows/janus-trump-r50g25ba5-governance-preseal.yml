name: JANUS TRUMP R50G25BA5 governance pre-seal

on:
  push:
    branches:
      - research/r50g25ba5-minimal-nonfactorizing-coupling-transport-2026-09-08
    paths:
      - 'governance/R50G25BA5_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25ba5-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts ba5-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest(); exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp); print('POLICY_SHA256='+got)
          PY
      - name: Download exact BA5 scientific artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34227319811
          name: janus-trump-r50g25ba5-result
          path: ba5-artifact
      - name: Verify exact BA5 evidence identity and strict guard
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=list(Path('ba5-artifact').rglob('JANUS_TRUMP_R50G25BA5_RESULT.json'))
          vp=list(Path('ba5-artifact').rglob('JANUS_TRUMP_R50G25BA5_VERIFY.json'))
          assert len(rp)==1,rp; assert len(vp)==1,vp
          rb=rp[0].read_bytes(); vb=vp[0].read_bytes()
          assert hashlib.sha256(rb).hexdigest()=='bf4694567ef631c4a32e76db0490af41c2b613a965a374d1479673fa2922e468'
          assert hashlib.sha256(vb).hexdigest()=='db7c4e09185c485691bc2e11b2b9f9339d1204951cffd52b017f1f382931d2d1'
          r=json.loads(rb); v=json.loads(vb)
          assert r['outcome']=='BA5-A_SINGLE_NONFACTORIZING_BINARY_COUPLING_TRANSPORT_CERTIFIED'
          assert r['failure_count']==0 and r['falsifiers']==[]
          assert r['BA5_boundary_kernel']['final_formula']==[[3,6]]
          assert r['BA5_boundary_kernel']['semantic_allowed_output']==['01','10','11']
          assert r['BA5_boundary_kernel']['semantic_leak']==0
          assert r['BA5_boundary_kernel']['manual_future_insertion']==0
          assert r['BA5_boundary_kernel']['R_peak']==1
          assert r['BA5_boundary_kernel']['B_peak']==1
          assert r['BA5_boundary_kernel']['W_peak_boundary_kernel']==2
          assert r['BA5_boundary_kernel']['dispersion_class']=='NO_DISPERSION'
          pre=r['strict_promotion_guard_pre_independent_verify']
          assert pre['all_closed_pre_independent_verify'] is True
          assert pre['x_no_unclassified_exception']==1
          assert pre['v_independent_verifier']==0 and pre['P_BA5']==0
          assert len(pre['obligations'])==11 and all(x==1 for x in pre['obligations'].values())
          assert v['status']=='PASS' and v['error_count']==0
          assert v['x_no_unclassified_exception']==1
          assert v['v_independent_verifier']==1
          assert len(v['obligations'])==11 and all(x==1 for x in v['obligations'].values())
          assert v['P_BA5']==1 and v['message_state']=='VERIFIED'
          assert r['arbitrary_CNF_coverage_started'] is False and r['next_gate_started'] is False
          print('BA5_EVIDENCE_IDENTITY=PASS')
          PY
      - name: Validate BA5 no-global-promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25BA5_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25BA5_GOVERNANCE_RECEIPT.json
      - name: Verify restricted claim did not trigger global promotion
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25BA5_GOVERNANCE_RECEIPT.json'); x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==0,x
          assert x['promotion_count_passed']==0,x
          print('BA5_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba5-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25BA5_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
