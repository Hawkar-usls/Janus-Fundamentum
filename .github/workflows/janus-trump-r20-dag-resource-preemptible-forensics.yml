name: JANUS TRUMP R20 DAG Resource Preemptible Forensics
on:
  push:
    branches: [research/janus-trump-r20-dag-resource-preemptible-forensics-2026-09-02]
    paths:
      - 'research/JANUS_TRUMP_R20_DAG_RESOURCE_PREEMPTIBLE_FORENSICS_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r20_dag_resource_preemptible_forensics.py'
      - '.github/workflows/janus-trump-r20-dag-resource-preemptible-forensics.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify forensic freeze and frozen R18 blob
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.load(open('research/JANUS_TRUMP_R20_DAG_RESOURCE_PREEMPTIBLE_FORENSICS_PREREGISTRATION_2026-09-02.json'))
          assert p['status']=='FROZEN_BEFORE_R20_IMPLEMENTATION_AND_EXECUTION';assert p['target_worlds']==['R19-W05','R19-W07','R19-W08','R19-W10'];got=subprocess.check_output(['git','hash-object',p['frozen_scientific_candidate']['path']],text=True).strip();assert got==p['frozen_scientific_candidate']['blob_sha']=='afa95321ec6edbb33bef222d8ee7234fe631a599';assert p['P_VS_NP']=='OPEN';print('R20_FREEZE_OK',got)
          PY
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Compile diagnostic mirror
        run: PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r20_dag_resource_preemptible_forensics.py
      - name: Diagnostic firewall
        run: |
          PYTHONPATH=experiments:. python - <<'PY'
          import janus_trump_r20_dag_resource_preemptible_forensics as r
          assert r.diagnostic_firewall()['pass'] is True
          print('R20_DIAGNOSTIC_FIREWALL_PASS')
          PY
  worlds:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix: {world: [R19-W05,R19-W07,R19-W08,R19-W10]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Recheck frozen scientific candidate blob
        run: test "$(git hash-object experiments/janus_trump_r18_shannon_hashcons_interface_dag_discovery.py)" = "afa95321ec6edbb33bef222d8ee7234fe631a599"
      - name: Run preemptible diagnostic mirror
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r20_dag_resource_preemptible_forensics.py --world '${{ matrix.world }}' --output 'artifacts/JANUS_TRUMP_R20_${{ matrix.world }}_FORENSIC_RESULT_2026-09-02.json'
      - name: Forensic gate
        run: |
          WORLD='${{ matrix.world }}' python - <<'PY'
          import json,os,sys
          w=os.environ['WORLD'];d=json.load(open(f'artifacts/JANUS_TRUMP_R20_{w}_FORENSIC_RESULT_2026-09-02.json'));assert d['P_VS_NP']=='OPEN';assert d['truth_accessed'] is False;assert d['diagnostic_firewall']['pass'] is True;assert d['status'] in {'FORENSIC_COMPLETE_ONLY__DO_NOT_UPGRADE_R19','FORENSIC_PREEMPTED_WITH_CHECKPOINT'};print(w,d['status'],d['checkpoint'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r20-${{ matrix.world }}
          path: artifacts/JANUS_TRUMP_R20_${{ matrix.world }}_FORENSIC_RESULT_2026-09-02.json
          if-no-files-found: error
