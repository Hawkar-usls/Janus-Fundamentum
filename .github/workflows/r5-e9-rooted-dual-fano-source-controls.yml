name: R5 E9 Rooted dual-Fano source controls

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_SINGLE_ODD_ROOTED_DUAL_FANO_POLY_TERMINAL_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rooted_dual_fano_source_controls.py'
      - '.github/workflows/r5-e9-rooted-dual-fano-source-controls.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_rooted_dual_fano_source_controls.py
      - name: Replay exact rooted dual-Fano controls
        run: python experiments/r5_e9_rooted_dual_fano_source_controls.py
