name: R5 Infinite Connected Degree Three No-Go One HEAD
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_infinite_connected_scl_degree3_dual_two_edge_sum.py'
      - 'experiments/r5_universal_infinite_3edge_connected_scl_triangle_degree3_dual.py'
      - 'experiments/r5_j5_degree3_frozen_dual_standalone_source_verifier.py'
      - 'research/R5_INFINITE_CONNECTED_BRIDGELESS_SCL_NO_GF3_DEGREE3_RETRACTION_2026-10-13.md'
      - 'research/R5_INFINITE_3EDGE_CONNECTED_NATIVE_SCL_NO_GF3_DEGREE3_TRIANGLE_RETRACTION_2026-10-13.md'
      - '.github/workflows/r5-infinite-connected-no-v3-one-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-proof:
    name: Frozen root plus two source-valid infinite connected no-V3 families
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify frozen J5 base dual against all native source generators
        run: python -u experiments/r5_j5_degree3_frozen_dual_standalone_source_verifier.py
      - name: Infinite connected bridgeless 2-edge-sum source retraction theorem
        run: python -u experiments/r5_universal_infinite_connected_scl_degree3_dual_two_edge_sum.py
      - name: Stronger infinite 3-edge-connected triangle inflation source retraction theorem
        run: python -u experiments/r5_universal_infinite_3edge_connected_scl_triangle_degree3_dual.py
