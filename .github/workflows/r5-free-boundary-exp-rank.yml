name: R5 Universal Exponential Free Boundary Rank Obstruction
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py'
      - '.github/workflows/r5-free-boundary-exp-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rank:
    name: Exact rank-kron source cell 3^ceil(n/5) and real SCL1134 audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-checked independent quartic cells and exact boundary tensor ranks
        run: python -u experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py
