name: R5 Four Node Grouped Matchgate Rank Rigidity
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_grouped_four_node_matchgate_rankrigidity_nogo.py'
      - '.github/workflows/r5-four-node-grouped-matchgate-rankrigidity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-node-rank:
    name: Six-wire rank rigidity across all 720 cyclic orders and 729 gauges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original source 4-node path, exact tensor, rank profiles and full ordering proof
        run: python -u experiments/r5_universal_grouped_four_node_matchgate_rankrigidity_nogo.py
