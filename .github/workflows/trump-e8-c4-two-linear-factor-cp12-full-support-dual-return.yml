name: TRUMP E8 C4 Two-Linear Factor CP12 Full-Support Dual Return

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_two_linear_factor_cp12_full_support_dual_return/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_TWO_LINEAR_FACTOR_CP12_FULL_SUPPORT_DUAL_RETURN_2026-10-01_v8.5.8.json'
      - '.github/workflows/trump-e8-c4-two-linear-factor-cp12-full-support-dual-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-two-linear-factor-dual-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact CP12 and full-support dual-return checker
        run: python3 research/tools/e8_c4_two_linear_factor_cp12_full_support_dual_return/checker.py
