name: JANUS TIME-SAT-004E10 preserve source-original 14 ZIPs, 12 VMs and 144 cold children
on:
  push:
    branches: [research/time-sat-004e10-ood-families-12vm-20261102]
    paths: [.github/workflows/archive-time-sat-004e10-original.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: janus-004e10-exact-original-source-one-shot-archive
  cancel-in-progress: false
jobs:
  permanent-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse archiving anything except completed and successful pinned original E10 research CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            result="$(gh api repos/Hawkar-usls/Janus-Fundamentum/actions/runs/41468961992 --jq '.status + ":" + (.conclusion // "pending")')"
            if [ "$result" = completed:success ]; then break; fi
            if [[ "$result" == completed:* ]]; then echo "Frozen E10 science failed: $result"; exit 1; fi
            sleep 5
          done
          test "$(gh api repos/Hawkar-usls/Janus-Fundamentum/actions/runs/41468961992 --jq '.status + ":" + (.conclusion // "pending")')" = completed:success
      - name: Authenticate original 14 GitHub ZIP digests and independently recompute original 144 child audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python experiments/time_sat_004_external/archive_time_sat_004e10_original.py
          --out experiments/time_sat_004_external/time_sat_004e10_evidence
      - name: Preserve all raw original worker receipts and source lock only on research branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/time-sat-004e10-ood-families-12vm-20261102
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/time_sat_004_external/time_sat_004e10_evidence
          if git diff --cached --quiet; then
            echo 'Source original E10 evidence already preserved'
          else
            git commit -m 'evidence(004E10): all source-verified E9-model OOD 12-VM 144-cold synthetic family results'
            git fetch origin research/time-sat-004e10-ood-families-12vm-20261102
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/research/time-sat-004e10-ood-families-12vm-20261102
          fi
