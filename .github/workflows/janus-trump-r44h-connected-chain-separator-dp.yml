name: JANUS TRUMP R44H Connected Chain Separator DP

on:
  push:
    branches:
      - research/r44-exact-representation-switchboard-coverage-counterexample-2026-09-03
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R44H_CONNECTED_CHAIN_SEPARATOR_DP_2026-09-03.json'
      - 'research/janus_trump_r44h_connected_chain_separator_dp.py'
      - '.github/workflows/janus-trump-r44h-connected-chain-separator-dp.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay R44H
        run: python research/janus_trump_r44h_connected_chain_separator_dp.py
