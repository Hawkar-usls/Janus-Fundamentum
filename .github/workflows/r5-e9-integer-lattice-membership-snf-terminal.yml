name: R5 E9 Integer Lattice Membership SNF Terminal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/R5_E9_INTEGER_LATTICE_MEMBERSHIP_SNF_TERMINAL_2026-09-29_v1.0.md"
      - "experiments/r5_e9_integer_lattice_membership_snf_terminal.py"
      - "experiments/r5_e9_paley_voltage_post_rkpr_linear_nullity_family.py"
      - ".github/workflows/r5-e9-integer-lattice-membership-snf-terminal.yml"

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify Smith/Hermite terminal controls
        run: python experiments/r5_e9_integer_lattice_membership_snf_terminal.py
