name: TRUMP E8 Cauchy-Binet Diagonal Projector Rank Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_CAUCHY_BINET_DIAGONAL_PROJECTOR_RANK_BARRIER_2026-09-30_v3.5.json'
      - 'research/tools/e8_cauchy_binet_diagonal_projector_rank_barrier/checker.py'
      - '.github/workflows/trump-e8-cauchy-binet-diagonal-projector-rank-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact diagonal-projector regression
        run: python research/tools/e8_cauchy_binet_diagonal_projector_rank_barrier/checker.py
