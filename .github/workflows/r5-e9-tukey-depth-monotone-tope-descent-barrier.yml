name: R5 E9 Tukey-depth monotone tope-descent barrier

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_TUKEY_DEPTH_MONOTONE_TOPE_DESCENT_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_tukey_depth_monotone_tope_descent_barrier.py'
      - '.github/workflows/r5-e9-tukey-depth-monotone-tope-descent-barrier.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_tukey_depth_monotone_tope_descent_barrier.py
      - name: Replay exact PG15 countercontrol
        run: python experiments/r5_e9_tukey_depth_monotone_tope_descent_barrier.py
