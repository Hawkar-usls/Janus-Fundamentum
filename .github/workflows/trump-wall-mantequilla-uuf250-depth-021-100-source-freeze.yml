name: TRUMP WALL Mantequilla UUF250 depth 021-100 source freeze

on:
  push:
    branches:
      - research/TRUMP_WALL-MANTEQUILLA-UUF250-depth-extension-021-100-2026-09-18
    paths:
      - .github/workflows/trump-wall-mantequilla-uuf250-depth-021-100-source-freeze.yml

permissions:
  contents: write

concurrency:
  group: trump-wall-mantequilla-uuf250-depth-021-100-source-freeze
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    env:
      BRANCH: research/TRUMP_WALL-MANTEQUILLA-UUF250-depth-extension-021-100-2026-09-18
      ARCHIVE_URL: https://www.cs.ubc.ca/~hoos/SATLIB/Benchmarks/SAT/RND3SAT/uuf250-1065.tar.gz
      ARCHIVE_SHA1: 138484766c966e3f18395db92cf6d69d3c442a3e
      MANIFEST: research/TRUMP_WALL_MANTEQUILLA_UUF250_DEPTH_021_100_SOURCE_FREEZE_AUTHORITY_2026-09-18_v1.0.json

    steps:
      - name: Checkout exact acquisition head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify acquisition authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            "research/TRUMP_WALL_MANTEQUILLA_UUF250_DEPTH_EXTENSION_PREREG_V1_2026-09-18.json":"eb9e602eb0fc092989dbd468f64a937c600a2b48",
            "research/TRUMP_WALL_MANTEQUILLA_UUF250_DEPTH_021_100_SOURCE_ACQUISITION_REVIEW_2026-09-18_v1.0.json":"dbe2b4e10c5e3933b3d71bd28dc9a8f01516d41a",
          }
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          bad={p:{"expected":h,"observed":blob(p)} for p,h in expected.items() if blob(p)!=h}
          if bad:
              raise SystemExit(f"UUF250_DEPTH_ACQUISITION_AUTHORITY_BIND_FAILURE:{bad}")
          print("UUF250_DEPTH_ACQUISITION_AUTHORITIES_OK")
          PY

      - name: Download and verify canonical SATLIB archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uuf250depth
          curl -L --fail --retry 3 --connect-timeout 20 "$ARCHIVE_URL" -o /tmp/uuf250depth/uuf250-1065.tar.gz
          OBS="$(sha1sum /tmp/uuf250depth/uuf250-1065.tar.gz | awk '{print $1}')"
          echo "archive_sha1=$OBS"
          test "$OBS" = "$ARCHIVE_SHA1"
          mkdir -p /tmp/uuf250depth/extract
          tar -xzf /tmp/uuf250depth/uuf250-1065.tar.gz -C /tmp/uuf250depth/extract

      - name: Freeze exact 021-100 raw sources and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/source_data
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path("/tmp/uuf250depth/extract")
          outdir=Path("research/source_data")
          archive=Path("/tmp/uuf250depth/uuf250-1065.tar.gz")

          def git_blob_bytes(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          def parse_dimacs(path):
              nvars=nclauses=None; clauses=[]; buf=[]; terminated=False
              for raw in path.read_text(encoding="ascii").splitlines():
                  s=raw.strip()
                  if not s or s.startswith("c"): continue
                  if terminated: continue
                  if s=="%": terminated=True; continue
                  if s.startswith("p "):
                      parts=s.split()
                      if len(parts)!=4 or parts[:2]!=["p","cnf"]:
                          raise ValueError(f"BAD_HEADER:{path.name}:{s}")
                      nvars,nclauses=int(parts[2]),int(parts[3]); continue
                  if s=="0" and not buf and nclauses is not None and len(clauses)==nclauses:
                      terminated=True; continue
                  for z in map(int,s.split()):
                      if z==0:
                          if not buf: raise ValueError(f"EMPTY_CLAUSE_OR_BAD_TERMINATOR:{path.name}")
                          clauses.append(tuple(buf)); buf=[]
                      else: buf.append(z)
              if buf or (nvars,nclauses)!=(250,1065) or len(clauses)!=1065:
                  raise ValueError(f"BAD_SHAPE:{path.name}:{nvars}:{nclauses}:{len(clauses)}")
              for c in clauses:
                  if len(c)!=3 or len({abs(x) for x in c})!=3 or any(abs(x)<1 or abs(x)>250 for x in c):
                      raise ValueError(f"NON_CANONICAL_3CNF:{path.name}:{c}")
              canonical="".join(" ".join(map(str,c))+" 0\n" for c in clauses).encode("ascii")
              return hashlib.sha256(canonical).hexdigest()

          by_index={}
          rx=re.compile(r"^uuf250-(\d+)\.cnf$",re.I)
          for p in root.rglob("*.cnf"):
              m=rx.match(p.name)
              if not m: continue
              idx=int(m.group(1))
              if 21<=idx<=100:
                  by_index.setdefault(idx,[]).append(p)

          missing=[i for i in range(21,101) if len(by_index.get(i,[]))!=1]
          if missing:
              raise SystemExit(f"DEPTH_SOURCE_INDEX_RESOLUTION_FAILURE:{[(i,len(by_index.get(i,[]))) for i in missing]}")

          receipts=[]
          for idx in range(21,101):
              src=by_index[idx][0]
              data=src.read_bytes()
              internal=f"SATLIB_UUF250_{idx:03d}_2026-09-18.cnf"
              dest=outdir/internal
              dest.write_bytes(data)
              receipts.append({
                  "source":f"UUF250_{idx:03d}",
                  "satlib_basename":src.name,
                  "archive_member":str(src.relative_to(root)),
                  "committed_path":str(dest),
                  "raw_sha256":hashlib.sha256(data).hexdigest(),
                  "git_blob":git_blob_bytes(data),
                  "canonical_formula_sha256":parse_dimacs(src),
                  "variables":250,"clauses":1065,"clause_width":3
              })

          manifest={
            "artifact_id":"JANUS-TRUMP-WALL-MANTEQUILLA-UUF250-DEPTH-021-100-SOURCE-FREEZE-AUTHORITY-2026-09-18-v1.0",
            "version":"v1.0","date":"2026-09-18","family":"SATLIB_UUF250.1065.100",
            "depth_prereg_authority":{"commit":"d0ad4c16dcb050985a3f33e82c70230ec8bee910","blob":"eb9e602eb0fc092989dbd468f64a937c600a2b48"},
            "panel_ranges":["021..040","041..060","061..080","081..100"],
            "panel":[f"UUF250_{i:03d}" for i in range(21,101)],
            "archive":{
              "url":os.environ["ARCHIVE_URL"],
              "sha1":hashlib.sha1(archive.read_bytes()).hexdigest(),
              "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "expected_sha1":os.environ["ARCHIVE_SHA1"]
            },
            "source_receipts":receipts,
            "acquisition_scope":{
              "structural_metrics_read":False,"WL_run":False,"symmetry_detection_run":False,
              "local_boundary_read":False,"Mantequilla_run":False,"SAT_solver_invocations":0
            },
            "verdict":"PASS_UUF250_DEPTH_021_100_CANONICAL_SATLIB_SOURCE_ACQUISITION"
          }
          Path(os.environ["MANIFEST"]).write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({"verdict":manifest["verdict"],"source_count":len(receipts),"archive_sha1":manifest["archive"]["sha1"]},sort_keys=True))
          PY

      - name: Independent source freeze verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          failures=[]
          expected=[f"UUF250_{i:03d}" for i in range(21,101)]
          if m.get("panel")!=expected: failures.append({"check":"panel"})
          if len(m.get("source_receipts",[]))!=80: failures.append({"check":"source_count","observed":len(m.get("source_receipts",[]))})
          seen={}
          for i,r in zip(range(21,101),m.get("source_receipts",[])):
              if r.get("source")!=f"UUF250_{i:03d}": failures.append({"check":"source_id","i":i})
              p=Path(r["committed_path"]); data=p.read_bytes()
              raw=hashlib.sha256(data).hexdigest()
              blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if raw!=r.get("raw_sha256"): failures.append({"check":"raw_sha256","source":r.get("source")})
              if blob!=r.get("git_blob"): failures.append({"check":"git_blob","source":r.get("source")})
              if (r.get("variables"),r.get("clauses"),r.get("clause_width"))!=(250,1065,3):
                  failures.append({"check":"shape","source":r.get("source")})
              h=r.get("canonical_formula_sha256")
              if h in seen: failures.append({"check":"duplicate_formula","source":r.get("source"),"duplicate_of":seen[h]})
              seen[h]=r.get("source")
          if len(seen)!=80: failures.append({"check":"unique_hash_count","observed":len(seen)})
          if failures:
              print(json.dumps({"verdict":"FAIL_INDEPENDENT_UUF250_DEPTH_SOURCE_FREEZE_VERIFICATION","failures":failures},sort_keys=True))
              raise SystemExit(1)
          m["independent_verification"]="PASS_INDEPENDENT_UUF250_DEPTH_021_100_SOURCE_FREEZE_VERIFICATION"
          Path(os.environ["MANIFEST"]).write_text(json.dumps(m,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(m["independent_verification"])
          PY

      - name: Upload acquisition receipt
        uses: actions/upload-artifact@v4
        with:
          name: trump-wall-mantequilla-uuf250-depth-source-freeze-${{ github.run_id }}
          path: |
            research/TRUMP_WALL_MANTEQUILLA_UUF250_DEPTH_021_100_SOURCE_FREEZE_AUTHORITY_2026-09-18_v1.0.json
            research/source_data/SATLIB_UUF250_*_2026-09-18.cnf
          if-no-files-found: error
          retention-days: 90

      - name: Freeze raw sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" research/source_data/SATLIB_UUF250_0[2-9][0-9]_2026-09-18.cnf research/source_data/SATLIB_UUF250_100_2026-09-18.cnf
          git commit -m "TRUMP WALL freeze UUF250 depth 021-100 SATLIB sources"
          git push origin "HEAD:$BRANCH"

      - name: Enforce acquisition PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          assert x["verdict"]=="PASS_UUF250_DEPTH_021_100_CANONICAL_SATLIB_SOURCE_ACQUISITION"
          assert x["independent_verification"]=="PASS_INDEPENDENT_UUF250_DEPTH_021_100_SOURCE_FREEZE_VERIFICATION"
          assert len(x["source_receipts"])==80
          print("UUF250_DEPTH_SOURCE_FREEZE_PASS")
          PY
