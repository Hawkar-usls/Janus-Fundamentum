name: R5 E8 6I Induced Algebra B4 Killer Test

on:
  pull_request:
    paths:
      - 'research/tools/r5_e8_6i_induced_algebra_b4_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_B4_INDUCED_ALGEBRA_KILLER_TEST_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_INDUCED_ALGEBRA_SOURCE_ADMISSION_AUDIT_2026-09-22_v1.0.md'
      - 'research/R5_B1B1C5B2B2_E8_6I_CONSTANT_ALGEBRA_HIDDEN_CHOICE_CONTROL_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_full_boolean_single_ternary_catalogue_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_FULL_BOOLEAN_SINGLE_TERNARY_CATALOGUE_BLOCKER_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_FULL_BOOLEAN_SINGLE_TERNARY_CATALOGUE_BLOCKER_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_boolean_multisorted_fano_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_MULTISORTED_FANO_BLOCKER_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_MULTISORTED_FANO_BLOCKER_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_a3_sbm_majority_lift_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_A3_SBM_MAJORITY_LIFT_POSITIVE_CONTROL_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_A3_SBM_MAJORITY_LIFT_POSITIVE_CONTROL_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_boolean_occurrence_sync_barrier.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_OCCURRENCE_SYNC_BARRIER_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_OCCURRENCE_SYNCHRONIZATION_CONJUGATION_THEOREM_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_b4_ternary_functional_gate_classifier.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_B4_TERNARY_FUNCTIONAL_GATE_CLASSIFICATION_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_ARBITRARY_ARITY_B4_FUNCTIONAL_GRAPH_CLASSIFICATION_THEOREM_2026-09-22_v1.0.md'
      - '.github/workflows/r5-e8-6i-induced-algebra-b4-killer-test.yml'
  push:
    branches:
      - 'codex/r5-e8-direct-contract-20260921-82493a57'
    paths:
      - 'research/tools/r5_e8_6i_induced_algebra_b4_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_B4_INDUCED_ALGEBRA_KILLER_TEST_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_INDUCED_ALGEBRA_SOURCE_ADMISSION_AUDIT_2026-09-22_v1.0.md'
      - 'research/R5_B1B1C5B2B2_E8_6I_CONSTANT_ALGEBRA_HIDDEN_CHOICE_CONTROL_2026-09-22_v1.0.md'
      - 'research/tools/r5_e8_6i_full_boolean_single_ternary_catalogue_checker.py'
      - 'research/R5_B1B1C5B2B2_E8_6I_FULL_BOOLEAN_SINGLE_TERNARY_CATALOGUE_BLOCKER_2026-09-22_v1.0.json'
      - 'research/R5_B1B1C5B2B2_E8_6I_FULL_BOOLEAN_SINGLE_TERNARY_CATALOGUE_BLOCKER_2026-09-22_v1.0.md'
      - '.github/workflows/r5-e8-6i-induced-algebra-b4-killer-test.yml'

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact checker
        run: python -m py_compile research/tools/r5_e8_6i_induced_algebra_b4_checker.py
      - name: Replay all fixed B4 preservation obligations
        run: |
          set -euo pipefail
          python research/tools/r5_e8_6i_induced_algebra_b4_checker.py > /tmp/actual.json
          python - <<'PY'
          import json
          from pathlib import Path

          actual=json.loads(Path('/tmp/actual.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_B4_INDUCED_ALGEBRA_KILLER_TEST_2026-09-22_v1.0.json').read_text())

          assert actual == frozen
          assert actual['status']=='PASS_EXACT_B4_FALSIFIER'
          assert actual['two_clause_witness']['original_formula_satisfiable'] is True
          assert actual['two_clause_witness']['common_assignment_count']==0
          assert actual['template_bridge']['count']==0
          assert actual['firewall']['P_VS_NP']=='OPEN'
          assert actual['firewall']['D1']=='EMPTY'
          assert actual['firewall']['SUCCESSOR_ALGORITHM']=='LOCKED'
          print('R5_E8_6I_B4_EXACT_REPLAY=PASS')
          PY

      - name: Replay NAE3 local-consistency barrier
        run: |
          set -euo pipefail
          python research/tools/r5_e8_6i_nae3_local_consistency_b4_barrier.py > /tmp/nae_actual.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/nae_actual.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_NAE3_LOCAL_CONSISTENCY_B4_BARRIER_2026-09-22_v1.0.json').read_text())
          assert actual == frozen
          assert actual['status']=='PASS_EXACT_SCOPED_BARRIER'
          assert actual['local_consistency']['all_partial_assignments_of_size_at_most_2_extend'] is True
          assert actual['local_consistency']['strong_3_consistent'] is True
          assert actual['induced_algebra']['preserving_label_triple_count']==0
          assert actual['firewall']['P_VS_NP']=='OPEN'
          print('R5_E8_6I_NAE3_LOCAL_CONSISTENCY_BARRIER=PASS')
          PY

      - name: Replay full Boolean single-ternary tractable catalogue blocker
        run: |
          set -euo pipefail
          python research/tools/r5_e8_6i_full_boolean_single_ternary_catalogue_checker.py > /tmp/full.json
          python - <<'PY'
          import json
          from pathlib import Path

          actual=json.loads(Path('/tmp/full.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_FULL_BOOLEAN_SINGLE_TERNARY_CATALOGUE_BLOCKER_2026-09-22_v1.0.json').read_text())

          assert actual == frozen
          assert actual['status']=='PASS_EXACT_FULL_CATALOGUE_BLOCKER'
          assert actual['catalogue']['tractable_single_operation_labels']==250
          assert actual['exhaustive_result']['surviving_ordered_label_triples']==1494
          assert actual['exhaustive_result']['by_number_of_constant_labels']=={'0':0,'1':0,'2':1488,'3':6}
          assert actual['exhaustive_result']['all_nonconstant_triple_exists'] is False
          assert actual['prototype_core']['homomorphic_equivalence_to_NAE'] is True
          assert actual['firewall']['P_VS_NP']=='OPEN'
          assert actual['firewall']['D1']=='EMPTY'
          assert actual['firewall']['SUCCESSOR_ALGORITHM']=='LOCKED'
          print('R5_E8_6I_FULL_SINGLE_TERNARY_CATALOGUE=PASS')
          PY

      - name: Replay Boolean multi-sorted Fano blocker
        run: |
          set -euo pipefail
          python -m py_compile research/tools/r5_e8_6i_boolean_multisorted_fano_checker.py
          python research/tools/r5_e8_6i_boolean_multisorted_fano_checker.py > /tmp/fano.json
          python - <<'PY'
          import json
          from pathlib import Path

          actual=json.loads(Path('/tmp/fano.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_MULTISORTED_FANO_BLOCKER_2026-09-22_v1.0.json').read_text())

          assert actual == frozen
          assert actual['status']=='PASS_EXACT_BOOLEAN_MULTISORTED_BLOCKER'
          assert actual['paired_relation']['surviving_mixed_operation_triples']==1533
          assert actual['fano']['boolean_NAE_colourings']==0
          assert actual['fano']['global_preserving_assignment_count']==3
          assert all(v==0 for v in actual['fano']['tractable_target_assignment_count_by_vertex'].values())
          assert actual['firewall']['P_VS_NP']=='OPEN'
          assert actual['firewall']['D1']=='EMPTY'
          assert actual['firewall']['SUCCESSOR_ALGORITHM']=='LOCKED'
          print('R5_E8_6I_BOOLEAN_MULTISORTED_FANO=PASS')
          PY

      - name: Replay A3 SBM majority-lift positive control
        run: |
          set -euo pipefail
          python -m py_compile research/tools/r5_e8_6i_a3_sbm_majority_lift_checker.py
          python research/tools/r5_e8_6i_a3_sbm_majority_lift_checker.py > /tmp/a3.json
          python - <<'PY'
          import json
          from pathlib import Path

          actual=json.loads(Path('/tmp/a3.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_A3_SBM_MAJORITY_LIFT_POSITIVE_CONTROL_2026-09-22_v1.0.json').read_text())

          assert actual == frozen
          assert actual['status']=='PASS_EXACT_POLYNOMIAL_LIFT_POSITIVE_CONTROL'
          assert actual['enumeration']['subalgebra_count']==2833
          assert actual['enumeration']['exact_lift_decoder_triples_per_signed_clause']==108
          assert actual['decoder_characterization']['equivalent_2SAT']=='(l1 OR l2) AND (l1 OR l3) AND (l2 OR l3)'
          assert actual['lifecycle']['hidden_SAT_oracle'] is False
          assert actual['strictness_control']['A3_majority_lift_coarse_solution_count']==0
          assert actual['firewall']['UNIVERSAL_3SAT_COVERAGE'] is False
          assert actual['firewall']['P_VS_NP']=='OPEN'
          assert actual['firewall']['D1']=='EMPTY'
          assert actual['firewall']['SUCCESSOR_ALGORITHM']=='LOCKED'
          print('R5_E8_6I_A3_SBM_MAJORITY_LIFT=PASS')
          PY

      - name: Replay Boolean occurrence synchronization barrier
        run: |
          set -euo pipefail
          python research/tools/r5_e8_6i_boolean_occurrence_sync_barrier.py > /tmp/occ_actual.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/occ_actual.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_BOOLEAN_OCCURRENCE_SYNC_BARRIER_2026-09-22_v1.0.json').read_text())
          assert actual == frozen
          assert actual['status']=='PASS_EXACT_GENERAL_IDENTITY_PLUS_NAE_CONTROL'
          assert actual['exhaustive_checks']['conjugation_equivalences_checked']==4096
          assert actual['exhaustive_checks']['nae_split_prototype_count']==0
          assert actual['consequence']['BOOLEAN_OCCURRENCE_SPLITTING_WITH_EQ_NEQ_AND_ID_NOT_RENAMING_CAN_RESCUE_B4'] is False
          assert actual['firewall']['P_VS_NP']=='OPEN'
          print('R5_E8_6I_OCCURRENCE_SYNC_BARRIER=PASS')
          PY

      - name: Replay all 256 ternary Boolean functional gates
        run: |
          set -euo pipefail
          python research/tools/r5_e8_6i_b4_ternary_functional_gate_classifier.py > /tmp/gates_actual.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('/tmp/gates_actual.json').read_text())
          frozen=json.loads(Path('research/R5_B1B1C5B2B2_E8_6I_B4_TERNARY_FUNCTIONAL_GATE_CLASSIFICATION_2026-09-22_v1.0.json').read_text())
          assert actual == frozen
          assert actual['status']=='PASS_EXHAUSTIVE_ALL_256_TERNARY_BOOLEAN_FUNCTIONS'
          assert actual['compatible_tuple_count_histogram']=={'0':200,'1':18,'4':30,'64':6,'256':2}
          assert actual['essential_arity_3_compatible_count']==18
          assert actual['consequence']['ARITY_LE_3_BOOLEAN_FUNCTIONAL_AUXILIARIES_CREATE_NEW_B4_ALGEBRA_TYPE_ROUTER'] is False
          assert actual['firewall']['P_VS_NP']=='OPEN'
          print('R5_E8_6I_TERNARY_FUNCTIONAL_GATE_CLASSIFIER=PASS')
          PY
