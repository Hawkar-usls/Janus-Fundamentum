name: Validate C024 Root Unshielded Handoff

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-unshielded-handoff.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-unshielded-handoff.yml"

permissions:
  contents: read

jobs:
  root-unshielded-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact root handoff through GT_12
        run: python experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py
