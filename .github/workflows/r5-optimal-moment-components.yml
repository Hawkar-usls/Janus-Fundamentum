name: R5 Optimal Moment LP And Components
on:
  push:
    branches:
      - research/r5-optimal-moment-lp-components-20261015
    paths:
      - "experiments/r5_optimal_moment_lp_20261015.py"
      - "experiments/r5_component_factor_20261015.py"
      - "experiments/r5_connected_coverage_breaker_20261015.py"
      - "experiments/r5_optimal_moment_gates_20261015.py"
      - "docs/r5_optimal_moment_components_checkpoint_20261015.md"
      - ".github/workflows/r5-optimal-moment-components.yml"
  pull_request:
    paths:
      - "experiments/r5_optimal_moment_lp_20261015.py"
      - "experiments/r5_component_factor_20261015.py"
      - "experiments/r5_connected_coverage_breaker_20261015.py"
      - "experiments/r5_optimal_moment_gates_20261015.py"
      - "docs/r5_optimal_moment_components_checkpoint_20261015.md"
      - ".github/workflows/r5-optimal-moment-components.yml"
  workflow_dispatch:
jobs:
  exact-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact rational primal-dual LP self-tests
        run: python3 experiments/r5_optimal_moment_lp_20261015.py --self-test
