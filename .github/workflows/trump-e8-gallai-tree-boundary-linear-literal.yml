name: TRUMP E8 Gallai Tree Boundary Linear Literal

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact Gallai boundary controls
        run: python research/tools/e8_gallai_tree_boundary_linear_literal/checker.py
