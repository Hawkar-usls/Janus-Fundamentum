name: R5 E9 Local-Swap Primitive Linear Nullity

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_LOCAL_SWAP_PRIMITIVE_LINEAR_NULLITY_FAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_local_swap_primitive_linear_nullity.py'
      - '.github/workflows/r5-e9-local-swap-primitive-linear-nullity.yml'
  pull_request:
    paths:
      - 'research/R5_E9_LOCAL_SWAP_PRIMITIVE_LINEAR_NULLITY_FAMILY_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_local_swap_primitive_linear_nullity.py'
      - '.github/workflows/r5-e9-local-swap-primitive-linear-nullity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify primitive local-swap family controls
        run: python experiments/r5_e9_local_swap_primitive_linear_nullity.py
