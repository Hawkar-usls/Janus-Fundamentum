name: R5 Native Flower Snark GF3 Degree Three Dual Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_flower_snark_gf3_degree3_dual_attack.py'
      - '.github/workflows/r5-flower-gf3-degree3-dual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flower-native:
    name: Isaacs flower J5 J7 original SCL degree3 dual or guarded failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-verify snark witness obstruction and exhaustive GF3 cubic row span
        run: python -u experiments/r5_universal_flower_snark_gf3_degree3_dual_attack.py
