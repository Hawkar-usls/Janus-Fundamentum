name: R5 GF3 Equality Decoder and Signed C6 Charge Gauge
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py'
      - '.github/workflows/r5-gf3-pair-decoder-charge-gauge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-gf3:
    name: Native source polynomial identity and all coherent gauges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay degree-four polynomial identity and signed-charge no-go
        run: python -u experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py
