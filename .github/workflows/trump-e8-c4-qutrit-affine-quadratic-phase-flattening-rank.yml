name: TRUMP E8 C4 Qutrit Affine Quadratic Phase Flattening Rank

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_qutrit_affine_quadratic_phase_flattening_rank/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_QUTRIT_AFFINE_QUADRATIC_PHASE_FLATTENING_RANK_BARRIER_2026-10-01_v8.5.7.json'
      - '.github/workflows/trump-e8-c4-qutrit-affine-quadratic-phase-flattening-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-qutrit-affine-quadratic-phase-rank-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact qutrit affine quadratic-phase cut-rank certificate
        run: python3 research/tools/e8_c4_qutrit_affine_quadratic_phase_flattening_rank/checker.py
