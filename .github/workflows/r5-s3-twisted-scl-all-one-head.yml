name: R5 All S3 Twisted SCL Proofs One HEAD
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_twisted_cubic_edge_coloring_native_scl_degree_gate.py'
      - 'experiments/r5_universal_twisted_s3_cycle_gauge_normal_forms.py'
      - 'experiments/r5_universal_twisted_k33_1296_exact_gf3_degree_frontier.py'
      - 'research/R5_UNBOUNDED_GF3_SOURCE_DEGREE_S3_TWISTED_GAUGE_FRONTIER_2026-10-13.md'
      - '.github/workflows/r5-s3-twisted-scl-all-one-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-native-proof:
    name: All-source S3 gauge and exhaustive 1512 K4+K33 holonomy/PC2 checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Random S3 source semantic independent controls
        run: python -u experiments/r5_universal_twisted_cubic_edge_coloring_native_scl_degree_gate.py
      - name: Source isomorphism and all 216 K4 canonical S3 holonomies
        run: python -u experiments/r5_universal_twisted_s3_cycle_gauge_normal_forms.py
      - name: All 1296 K33 normal forms exact original SAT/UNSAT and PC2
        run: python -u experiments/r5_universal_twisted_k33_1296_exact_gf3_degree_frontier.py
