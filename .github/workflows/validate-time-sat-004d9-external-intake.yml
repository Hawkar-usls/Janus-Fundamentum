name: JANUS TIME-SAT-004D9 fail-closed external SAT witness intake
on:
  push:
    branches: [research/time-sat-004d9-external-witness-intake-20261102]
    paths:
      - experiments/direct/janus_time_sat_004d9_external_intake.py
      - tests/test_time_sat_004d9_external_intake.py
      - .github/workflows/validate-time-sat-004d9-external-intake.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d9-intake-fixtures-only
  cancel-in-progress: true
jobs:
  precommit-identity-and-model-before-rank:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Ed25519 verification dependency with pinned version
        run: |
          python -m pip install --only-binary=:all: cryptography==46.0.3
      - name: Original-source signed receipt and model adversarial fixture tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d9_external_intake.py' -v
      - name: Preserve original 004D8 SAT-model gate regression tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d8_sat_gate.py' -v
      - name: Run original independent C023 verifier unchanged
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Fail-closed preflight cannot claim independent witness with empty custodian
        run: |
          python experiments/direct/janus_time_sat_004d9_external_intake.py \
            --preflight --out evidence/time_sat_004d9/preflight.json
          python - <<'PY'
          import json
          a=json.load(open("evidence/time_sat_004d9/preflight.json"))
          assert a["status"]=="WAITING_FOR_EXTERNAL_WITNESS"
          assert a["actual_external_SAT_cases_admitted"]==0
          assert a["rank_experiment"]=="NOT_RUN"
          assert a["admin_independence"]=="NOT_ESTABLISHED"
          print("004D9_FAIL_CLOSED_WITNESS_GATE_PASS",a["status"])
          PY
      - name: Retain explicit WAITING and fixture-test receipt, not fabricated real results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d9-${{ matrix.os }}
          path: evidence/time_sat_004d9/preflight.json
          if-no-files-found: warn
          retention-days: 30
