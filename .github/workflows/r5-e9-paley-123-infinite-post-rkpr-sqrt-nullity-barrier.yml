name: R5 E9 Paley 123 Infinite Post-RKPR Sqrt-Nullity Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_123_INFINITE_POST_RKPR_SQRT_NULLITY_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_paley_123_infinite_post_rkpr_sqrt_nullity_barrier.py'
      - '.github/workflows/r5-e9-paley-123-infinite-post-rkpr-sqrt-nullity-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact infinite Paley barrier regression
        run: python experiments/r5_e9_paley_123_infinite_post_rkpr_sqrt_nullity_barrier.py
