name: BABEL-18 exact lower bound and rank2 orbit decomposition
on:
  push:
    branches: ['research/babel18-*']
    paths: ['experiments/babel18/lower_orbits.py','.github/workflows/babel18-lower-orbits.yml']
  pull_request:
    paths: ['experiments/babel18/lower_orbits.py','.github/workflows/babel18-lower-orbits.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-lifted-degree1-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact replay prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack frozen source methods
        run: |
          mkdir -p /tmp/babel18lower
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel18lower
          cp experiments/babel18/rank2_geometry.py experiments/babel18/lower_orbits.py /tmp/babel18lower/
      - name: Verify lower degree and four-element orbit statistics
        working-directory: /tmp/babel18lower
        run: python lower_orbits.py
      - name: Preserve exact rank2 orbit checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel18-seed0-seed4-lower-and-orbits
          path: /tmp/babel18lower/babel18_lower_orbit_checkpoint.json
          retention-days: 7
