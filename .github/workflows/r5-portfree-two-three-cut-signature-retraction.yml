name: R5 Port-Free Two Three Edge Cut Full Physical Retraction Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_portfree_two_three_edge_cut_exact_signature_retraction.py'
      - '.github/workflows/r5-portfree-two-three-cut-signature-retraction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-cuts:
    name: Independently replay physical 6-port signatures before/after colourable k2/k3 block cuts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check full physical port states of diamond, double diamond, triangle and 5-vertex 3pole
        run: python -u experiments/r5_universal_portfree_two_three_edge_cut_exact_signature_retraction.py
