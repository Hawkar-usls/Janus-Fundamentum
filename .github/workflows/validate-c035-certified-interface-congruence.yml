name: Validate C035 Certified Interface Congruence

on:
  push:
    paths:
      - "experiments/direct/janus_c035_certified_interface_congruence.py"
      - "docs/C035_CERTIFIED_INTERFACE_CONGRUENCE.md"
      - "proposals/C035-JANUS-CERTIFIED-INTERFACE-CONGRUENCE.json"
      - "registry/c035-source-map.json"
      - ".github/workflows/validate-c035-certified-interface-congruence.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c035_certified_interface_congruence.py"
      - "docs/C035_CERTIFIED_INTERFACE_CONGRUENCE.md"
      - "proposals/C035-JANUS-CERTIFIED-INTERFACE-CONGRUENCE.json"
      - "registry/c035-source-map.json"
      - ".github/workflows/validate-c035-certified-interface-congruence.yml"

permissions:
  contents: read

jobs:
  certified-interface-congruence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c035_certified_interface_congruence.py --self-test
