name: R5 E9 Paley orbit exact F3 constant-gradient kernel

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_ORBIT_EXACT_F3_CONSTANT_GRADIENT_KERNEL_AFFINE_CHART_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley_orbit_exact_f3_constant_gradient_kernel.py'
      - '.github/workflows/r5-e9-paley-orbit-exact-f3-constant-gradient-kernel.yml'
  workflow_dispatch:

jobs:
  exact-f3-kernel-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact F3 kernel replay
        run: python3 experiments/r5_e9_paley_orbit_exact_f3_constant_gradient_kernel.py
