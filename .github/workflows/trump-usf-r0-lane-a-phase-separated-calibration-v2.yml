name: TRUMP USF R0 Lane A phase-separated calibration V2 only

on:
  push:
    branches:
      - research/trump-universal-structural-funnel-adversarial-family-preregistration-2026-09-10
    paths:
      - .github/workflows/trump-usf-r0-lane-a-phase-separated-calibration-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-a-phase-separated-calibration-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact V2 execution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Assert methodological and frozen scientific identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_USF_R0_LANE_A_INPUT_CLASS_VS_POST_REDUCER_TERMINAL_METHODOLOGICAL_SUCCESSOR_2026-09-10.json)" = "6d8db87c7c0bc36e3e8c08d5df691714aa2448ff"
          test "$(git hash-object research/TRUMP_USF_R0_LANE_A_CALIBRATION_DISCOVERY_FAILURE_2026-09-10.json)" = "97b454cefb2be61b6f0ccd021980b06831cab66d"
          test "$(git hash-object research/trump_usf_r0_lane_a_phase_separated_calibration_v2.py)" = "4a1cb6460c8c5ef21e3f7bd658e08a30d9522348"
          test "$(git hash-object research/verify_trump_usf_r0_lane_a_phase_separated_calibration_v2.py)" = "3919b006c0861f2aac803f253838f780626bfb78"
          test "$(git hash-object research/trump_usf_r0_frozen_generators.py)" = "fe33883dc08e7e1eacadf287093aa0bb1f16c19a"
          test "$(git hash-object research/trump_usf_r0_execution_harness_frozen_entrypoint.py)" = "50e8eedd461b87de37385cc9f3d30ea6224909fb"
          test "$(git hash-object research/trump_usf_r0_execution_harness.py)" = "ed4203bac76349ab377bb97f67bf1054d837bc96"
          test "$(git hash-object experiments/janus_trump_r37b_fixed_certified_portfolio_restart_cycle.py)" = "f37da1c2e1696e35695096a2c748a222af7920cc"
          test "$(git hash-object experiments/janus_trump_r33_certified_safe_reduction_stack_lean_core_forensics.py)" = "c9234a1ef639a009cc6cb4c8a6098fd09bf9affe"
          test "$(git hash-object experiments/janus_trump_r34_affine_xor_terminal_against_tseitin_core.py)" = "7f9bec920fa47af066570d874fe9127dc4b9b968"
          test "$(git hash-object experiments/janus_trump_r35_nonaffine_core_freeze_structure_intake.py)" = "ad237e341d9659d33da0568f134815776c1f95d8"
          test "$(git hash-object experiments/janus_trump_r35b_single_literal_rup_vivification.py)" = "259d2e38947d09b0c058963ad825a57f2e734203"
          test "$(git hash-object experiments/janus_trump_r38_portfolio_fixpoint_freeze_structure_intake.py)" = "816b53c390d78af415e580eaf358acf191796205"
          test "$(git hash-object experiments/trump_r38_fixpoint_to_ba25_factor_graph_diagnostic.py)" = "ea36a6b69f8c6034aa00ae4c4217bbd4d7735750"
          test "$(git hash-object research/janus_trump_r50g25ba25.py)" = "cad9c5f837d9d3c4e1c4bd4abef40976f2bb36ff"
          printf '%s\n' 'V2_ALL_FROZEN_SCIENTIFIC_BLOB_ASSERTIONS_PASS=true'

      - name: Independent anti-post-hoc phase-separation verification before execution
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2"
          mkdir -p "$OUT"
          python3 research/verify_trump_usf_r0_lane_a_phase_separated_calibration_v2.py > "$OUT/INDEPENDENT_PREEXECUTION_VERIFICATION.json"
          python3 - "$OUT/INDEPENDENT_PREEXECUTION_VERIFICATION.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['ANTI_POST_HOC_MECHANICAL_VERIFICATION_PASS'] is True
          assert d['real_instance_executed_by_verifier'] is False
          assert d['executor_imported_by_verifier'] is False
          assert d['scientific_modules_imported_by_verifier'] is False
          assert d['expected_lane_a_records']==36
          assert d['lane_b_authorized'] is False and d['lane_c_authorized'] is False
          assert d['holdout_authorized'] is False and d['BA26_authorized'] is False
          print('ANTI_POST_HOC_MECHANICAL_VERIFICATION_PASS=true')
          PY

      - name: Inert V2 contract verification
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2"
          python3 research/trump_usf_r0_lane_a_phase_separated_calibration_v2.py --verify-contract-only > "$OUT/V2_INERT_CONTRACT_VERIFICATION.json"
          python3 - "$OUT/V2_INERT_CONTRACT_VERIFICATION.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['pins_pass'] is True
          assert d['source_post_terminal_label_equality_required'] is False
          assert d['expected_lane_a_records']==36
          assert d['real_instance_executed'] is False
          assert d['lane_b_authorized'] is False and d['lane_c_authorized'] is False
          assert d['holdout_authorized'] is False and d['BA26_authorized'] is False
          print('V2_INERT_CONTRACT_VERIFICATION_PASS=true')
          PY

      - name: Install exact pinned truth binaries
        shell: bash
        env:
          CADICAL_PACKAGE_SHA256: d25649a8bb30bede6af5b5d81cc9fce4017197640940863283df722eff88f88d
          LRAT_PACKAGE_SHA256: a2613ed11f3b2ee1a183ed64ba265a7d88b9b892cef1a40a9097132ccabcc31f
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/usf-r0-lane-a-v2-tools"
          mkdir -p "$ROOT/cad" "$ROOT/lrat"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/c/cadical/cadical_1.7.4-1+b1_amd64.deb' -o "$ROOT/cadical.deb"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/d/drat-trim/drat-trim_0.0~git20240428.effa1dc-2_amd64.deb' -o "$ROOT/lrat.deb"
          printf '%s  %s\n' "$CADICAL_PACKAGE_SHA256" "$ROOT/cadical.deb" | sha256sum -c -
          printf '%s  %s\n' "$LRAT_PACKAGE_SHA256" "$ROOT/lrat.deb" | sha256sum -c -
          dpkg-deb -x "$ROOT/cadical.deb" "$ROOT/cad"
          dpkg-deb -x "$ROOT/lrat.deb" "$ROOT/lrat"
          test "$(sha256sum "$ROOT/cad/usr/bin/cadical" | cut -d' ' -f1)" = "d258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39"
          test "$(sha256sum "$ROOT/lrat/usr/bin/lrat-check" | cut -d' ' -f1)" = "35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c"
          sudo install -m 0755 "$ROOT/cad/usr/bin/cadical" /usr/bin/cadical
          sudo install -m 0755 "$ROOT/lrat/usr/bin/lrat-check" /usr/bin/lrat-check
          test "$(sha256sum /usr/bin/cadical | cut -d' ' -f1)" = "d258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39"
          test "$(sha256sum /usr/bin/lrat-check | cut -d' ' -f1)" = "35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c"
          printf 'CADICAL_RUNTIME_VERSION=%s\n' "$(/usr/bin/cadical --version)"
          printf '%s\n' 'CADICAL_RUNTIME_VERSION_MISMATCH_CLASSIFICATION=PRESERVED_RUNTIME_VERSION_STRING_MISMATCH_NOT_A_PACKAGE_HASH_FAILURE'

      - name: Execute phase-separated frozen Lane A discovery schedule V2 only
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2"
          python3 research/trump_usf_r0_lane_a_phase_separated_calibration_v2.py \
            --execute-lane-a-v2 --output-dir "$OUT" 2>&1 | tee "$OUT/V2_EXECUTION.log"

      - name: Upload complete Lane A V2 evidence even on calibration failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trump-usf-r0-lane-a-phase-separated-calibration-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2
          if-no-files-found: error
          compression-level: 9

      - name: Final fail-closed Lane A V2 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2/LANE_A_PHASE_SEPARATED_CALIBRATION_V2_RESULT.json"
          PRE="$RUNNER_TEMP/TRUMP_USF_R0_LANE_A_PHASE_SEPARATED_CALIBRATION_V2/INDEPENDENT_PREEXECUTION_VERIFICATION.json"
          test -f "$RESULT"
          test -f "$PRE"
          python3 - "$RESULT" "$PRE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); p=json.load(open(sys.argv[2]))
          assert p['ANTI_POST_HOC_MECHANICAL_VERIFICATION_PASS'] is True
          assert d['source_post_terminal_label_equality_required'] is False
          assert d['LANE_A_PHASE_SEPARATED_CALIBRATION_V2_PASSED'] is True, d['failures']
          assert d['completed_lane_a_records']==36
          assert d['generated_real_USF_instances_this_v2_gate']==35
          assert d['A5_historical_replay_count']==1
          assert len(d['instances'])==36 and not d['failures']
          assert all(x.get('pass_flags',{}).get('SOURCE_CLASS_LABEL_EQUALS_POST_REDUCER_TERMINAL_LABEL_REQUIRED') is False for x in d['instances'])
          for x in d['instances']:
              if x.get('family_id')!='A5_HISTORICAL_R38':
                  f=x['pass_flags']
                  assert f['SOURCE_CLASS_EXPECTATION_PASS'] is True
                  assert f['REDUCER_CERTIFICATE_REPLAY_PASS'] is True
                  assert f['TRUTH_AUTHORITY_PASS'] is True
                  assert f['WIDTH_AUTHORITY_PASS'] is True
                  assert f['CAUSAL_FIREWALL_PASS'] is True
                  assert f['POST_REDUCER_TERMINAL_SOUND'] is True
              else:
                  assert x['pass_flags']['A5_HISTORICAL_REPLAY_PASS'] is True
          assert d['LANE_A_EXECUTION_COMPLETE'] is True
          assert d['LANE_B_EXECUTION_STARTED'] is False
          assert d['LANE_C_EXECUTION_STARTED'] is False
          assert d['HOLDOUT_EXECUTION_STARTED'] is False
          assert d['PRIMARY_BLOCKER']=='UNIVERSAL_RESIDUAL_STRUCTURAL_FUNNEL_THEOREM'
          assert d['H1']==d['H2']==d['H3']=='OPEN'
          assert d['SAT_IN_P']=='NOT_PROVED' and d['P_VS_NP']=='OPEN'
          assert d['BA26_STARTED'] is False
          assert d['universal_structural_funnel_supported_by_this_gate'] is False
          print('LANE_A_PHASE_SEPARATED_CALIBRATION_V2_PASSED=true')
          print('STOP_AFTER_LANE_A_PHASE_SEPARATED_CALIBRATION_V2=true')
          PY
