name: R5 Holyer Tanner Cubic Minor Linear Treewidth Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_holyer_tanner_linear_treewidth_obstruction.py'
      - '.github/workflows/r5-holyer-tanner-linear-treewidth-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minor:
    name: Authenticate source Tanner topological minors and forged hint tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent original source induced minor verification
        run: python -u experiments/r5_universal_holyer_tanner_linear_treewidth_obstruction.py
