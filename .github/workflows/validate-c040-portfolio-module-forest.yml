name: Validate C040 Portfolio Module Forest

on:
  push:
    paths:
      - "experiments/direct/janus_c040_portfolio_module_forest.py"
      - "docs/C040_PORTFOLIO_GUIDED_MODULE_FOREST.md"
      - "proposals/C040-PORTFOLIO-GUIDED-MODULE-FOREST.json"
      - "registry/c040-source-map.json"
      - "schemas/c040-portfolio-module-forest-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c040-portfolio-module-forest.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c040_portfolio_module_forest.py"
      - "docs/C040_PORTFOLIO_GUIDED_MODULE_FOREST.md"
      - "proposals/C040-PORTFOLIO-GUIDED-MODULE-FOREST.json"
      - "registry/c040-source-map.json"
      - "schemas/c040-portfolio-module-forest-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c040-portfolio-module-forest.yml"

permissions:
  contents: read

jobs:
  portfolio-module-forest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c040_portfolio_module_forest.py --self-test
      - run: python -m py_compile experiments/direct/janus_c040_portfolio_module_forest.py
      - run: python -m json.tool proposals/C040-PORTFOLIO-GUIDED-MODULE-FOREST.json >/dev/null
      - run: python -m json.tool registry/c040-source-map.json >/dev/null
      - run: python -m json.tool schemas/c040-portfolio-module-forest-v1.schema.json >/dev/null
