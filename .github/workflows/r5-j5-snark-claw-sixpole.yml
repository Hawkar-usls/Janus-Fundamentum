name: R5 J5 Twenty-Vertex Snark Claw Deletions
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_j5_20vertex_snark_star_deletion_sixpole.py'
      - '.github/workflows/r5-j5-snark-claw-sixpole.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-j5:
    name: Exhaust 20 star deletions and 300 full physical sixpole colour interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source exact original J5 uncolourability and 300 sixpole colour relations
        run: python -u experiments/r5_universal_j5_20vertex_snark_star_deletion_sixpole.py
