name: R5 E9 Two-Edge UNSAT Tower F3 Three-Offset Certificate

on:
  pull_request:
    paths:
      - 'research/R5_E9_TWO_EDGE_UNSAT_TOWER_F3_THREE_OFFSET_CERTIFICATE_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_two_edge_unsat_tower_f3_three_offset_certificate.py'
      - '.github/workflows/r5-e9-two-edge-unsat-tower-f3-three-offset-certificate.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run persistent F3 UNSAT certificate regression
        run: python experiments/r5_e9_two_edge_unsat_tower_f3_three_offset_certificate.py
