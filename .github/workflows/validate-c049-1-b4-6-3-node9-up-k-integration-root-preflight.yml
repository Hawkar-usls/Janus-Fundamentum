name: Validate C049.1 B4.6.3 node-9 up_k integration and root preflight

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-up-k-integration-root-preflight.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-up-k-integration-root-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node9-up-k-integration-root-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile integration gate and frozen proof chain
        run: |
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py

      - name: Regenerate exact frozen negative prefix
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-negative-prefix
          python experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py \
            --output-dir /tmp/c049-negative-prefix

      - name: Reproduce admitted node-6 hardening and integration
        env:
          PYTHONPATH: experiments/direct
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            /tmp/c049-negative-prefix --output /tmp/c049-dim2-preorder.json
          test "$(sha256sum /tmp/c049-dim2-preorder.json | cut -d' ' -f1)" = \
            "a68ea1957382bfa89386a09ab501a052057b1cc5de8db7191a6ab3a26e1d2af9"
          mkdir /tmp/c049-node6-integration
          python experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            --output-dir /tmp/c049-node6-integration \
            --parent-pair-cap 10000 --parent-refinement-cap 2000000
          python - <<'PY'
          import json
          value=json.load(open('/tmp/c049-node6-integration/manifest.json'))
          assert value['manifest_digest']=='2ca2b0bc7566fb2e24f62e9df44499044843fa08388d8573fb74221dfab80512'
          assert value['execution']['processed_internal_node_ids']==[6]
          assert value['execution']['stop']['node_id']==7
          PY

      - name: Reproduce admitted node-7 proof layers
        env:
          PYTHONPATH: experiments/direct
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            /tmp/c049-node6-integration/manifest.json \
            --output /tmp/c049-node7-frontier.json --entry-order original
          test "$(sha256sum /tmp/c049-node7-frontier.json | cut -d' ' -f1)" = \
            "6a0748219d829434feeb5de2c5488e1fa3aeb1fab16ecbfee0c5629be90130a9"
          python experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            /tmp/c049-node7-frontier.json \
            --output /tmp/c049-node7-up-k.json --entry-order original
          test "$(sha256sum /tmp/c049-node7-up-k.json | cut -d' ' -f1)" = \
            "c085a3bee4e0c92a01eb22715390079f9858c5704ebcbf8534f9de196087d189"
          mkdir /tmp/c049-node7-integration
          python experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json /tmp/c049-node7-up-k.json \
            --output-dir /tmp/c049-node7-integration \
            --node8-pair-cap 10000 --node8-refinement-cap 2000000
          test "$(sha256sum /tmp/c049-node7-integration/manifest.json | cut -d' ' -f1)" = \
            "05a4269be3b15bee40c254f81cc5e668c4903e90777576a9f0d226093892122b"

      - name: Reproduce admitted node-8 proof layers and node-9 preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            /tmp/c049-node7-integration/manifest.json \
            --output /tmp/c049-node8-frontier.json --entry-order original
          test "$(sha256sum /tmp/c049-node8-frontier.json | cut -d' ' -f1)" = \
            "93dcd5610eb9df079823b172a4f824ce1c09859e759c6b771dc95b99af394d34"
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k.json --entry-order original
          test "$(sha256sum /tmp/c049-node8-up-k.json | cut -d' ' -f1)" = \
            "e5202b9eb32ef44b1fdf493c6848ec82f8ce16fa502e623b7fbfdeb6bc735620"
          mkdir /tmp/c049-node8-integration
          python experiments/direct/janus_c049_1_b4_6_3_node8_up_k_integration_node9_preflight_v2.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json /tmp/c049-node7-up-k.json \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-up-k.json \
            --output-dir /tmp/c049-node8-integration \
            --node9-pair-cap 10000 --node9-refinement-cap 2000000
          test "$(sha256sum /tmp/c049-node8-integration/manifest.json | cut -d' ' -f1)" = \
            "9553263dc70f7a962a7bd95af4d5d4eeea6e1cdab163c616817b97cfcc207d6b"

      - name: Reproduce and independently verify admitted node-9 frontier and up_k
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            /tmp/c049-node8-integration/manifest.json \
            --output /tmp/c049-node9-frontier.json --entry-order original
          test "$(sha256sum /tmp/c049-node9-frontier.json | cut -d' ' -f1)" = \
            "6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890"
          python experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py \
            /tmp/c049-node8-integration/manifest.json /tmp/c049-node9-frontier.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py \
            --tamper-self-test
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            /tmp/c049-node9-frontier.json \
            --output /tmp/c049-node9-up-k.json --entry-order original
          test "$(sha256sum /tmp/c049-node9-up-k.json | cut -d' ' -f1)" = \
            "c6e369099ea2fdf6572409dab7ce6f5172d40543388b366ec37a821262c506e4"
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py \
            /tmp/c049-node9-frontier.json /tmp/c049-node9-up-k.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            --tamper-self-test

      - name: Integrate certified node-9 closure and reach exact root preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-node9-integration
          python experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight.py \
            /tmp/c049-negative-prefix /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json /tmp/c049-node7-up-k.json \
            /tmp/c049-node8-frontier.json /tmp/c049-node8-up-k.json \
            /tmp/c049-node9-frontier.json /tmp/c049-node9-up-k.json \
            --output-dir /tmp/c049-node9-integration \
            --root-pair-cap 10000 --root-refinement-cap 2000000

      - name: Independently replay node-9 handoff and reject tamper attacks
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight_verifier.py \
            /tmp/c049-node9-frontier.json /tmp/c049-node9-up-k.json \
            /tmp/c049-node9-integration \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node9_up_k_integration_root_preflight.py \
            --tamper-self-test

      - name: Report candidate root-preflight byte boundary
        run: |
          wc -c /tmp/c049-node9-integration/manifest.json
          sha256sum /tmp/c049-node9-integration/manifest.json
          wc -c /tmp/c049-node9-integration/node9-integration-root-preflight-summary.json
          sha256sum /tmp/c049-node9-integration/node9-integration-root-preflight-summary.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/c049-node9-integration/manifest.json'))
          s=json.load(open('/tmp/c049-node9-integration/node9-integration-root-preflight-summary.json'))
          n9=next(x for x in m['node_results'] if x['node_id']==9)
          print('MANIFEST_DIGEST =',m['manifest_digest'])
          print('TRANSCRIPT_ROOT_DIGEST =',m['chunking']['transcript_root_digest'])
          print('NODE9_OUTPUT_RECEIPT =',n9['output_receipt']['receipt_digest'])
          print('SUMMARY_SEMANTIC_DIGEST =',s['semantic_digest'])
          assert m['execution']['processed_internal_node_ids']==[6,7,8,9]
          assert m['execution']['stop']['node_id']==10
          assert m['execution']['stop']['reason']=='REFINEMENT_CAP_EXCEEDED'
          assert m['execution']['stop']['required']==4954128
          assert s['root_preflight']['child_pair_count']==9072
          assert s['root_preflight']['naive_refinement_count']==4954128
          assert s['strict_boundary']['root_reached'] is True
          assert s['strict_boundary']['negative_root_reached'] is False
          assert s['strict_boundary']['p_vs_np']=='OPEN'
          PY

      - name: Export node-9 integration proof package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-node9-up-k-integration-root-preflight
          path: |
            /tmp/c049-node9-integration/manifest.json
            /tmp/c049-node9-integration/node9-integration-root-preflight-summary.json
          retention-days: 1
