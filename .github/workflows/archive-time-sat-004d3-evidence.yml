name: JANUS TIME-SAT-004D3 archive exact original 9-source dual-worker receipts
on:
  push:
    branches: [research/time-sat-004d3-public-multifamily-20261101]
    paths:
      - .github/workflows/archive-time-sat-004d3-evidence.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-time-sat-004d3-durable-archive-once
  cancel-in-progress: false
jobs:
  original-original-nine-receipt-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact original dual-worker GitHub ZIP artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/time-sat-004d3-orig
          for pair in '13093662320 ubuntu22' '13093028948 ubuntu24'; do
            set -- ${pair}
            curl --fail --silent --show-error --retry 2 --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Hawkar-usls/Janus-Fundamentum/actions/artifacts/${1}/zip" \
              -o "/tmp/time-sat-004d3-orig/${2}.zip"
          done
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path('/tmp/time-sat-004d3-orig')
          wanted={
            'ubuntu22.zip':'444d63b2a082a11102d5b96bb40a3f055b8473ad47ac69dbc46fbda7e263d5f3',
            'ubuntu24.zip':'46fb0f78b1330dedef3666864ecdbd21c66b5dfb609aef059830f79dd3550f1a'
          }
          for f,expected in wanted.items():
              assert sha256((p/f).read_bytes()).hexdigest()==expected,f
          print('004D3_ORIGINAL_EXACT_ACTIONS_ZIP_SHAS_PASS')
          PY
      - name: Validate original sources and independently replay source-bound models
        run: >-
          python3 experiments/direct/janus_time_sat_004d3_archive.py
          --zip22 /tmp/time-sat-004d3-orig/ubuntu22.zip
          --zip24 /tmp/time-sat-004d3-orig/ubuntu24.zip
          --out experiments/time_sat_004_external/time_sat_004d3_evidence
      - name: Commit original SHA-pinned evidence in research branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = research/time-sat-004d3-public-multifamily-20261101
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/time_sat_004_external/time_sat_004d3_evidence
          if git diff --cached --quiet; then
            echo '004D3 original evidence already archived.'
          else
            git commit -m 'evidence(TIME-SAT-004D3): original dual-worker 9 CNF receipts and 2 real XOR SAT/UNSAT inputs'
            git push origin HEAD:refs/heads/research/time-sat-004d3-public-multifamily-20261101
          fi
