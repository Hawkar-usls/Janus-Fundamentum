name: TRUMP Bucket Unique-Core Fixed-Depth 1-2-2
on:
  push:
    branches:
      - research/trump-bucket-unique-core-residual-fixed-depth-1-2-2-2026-09-15
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-depth-122:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent fixed-depth checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_fixed_depth_122.independent_checker | tee /tmp/result.json
      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/result.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_FIXED_DEPTH_1_2_2_SEPARATOR_PORTFOLIO_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['scientific_firewall']['P_VS_NP']=='OPEN'
          assert z['scientific_firewall']['GENERAL_SAT_IN_P']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls']},sort_keys=True))
          PY
      - name: v3.13 remainder forensic regression
        run: python -m research.tools.apma_bucket_remainder_forensic.independent_checker
      - name: v3.10 pair-separator regression
        run: python -m research.tools.apma_bucket_residual_pair_separator.independent_checker
      - name: v3.6 residual le2 regression
        run: python -m research.tools.apma_bucket_residual_le2.independent_checker
      - name: Guarded elimination regression
        run: python -m research.tools.apma_guarded_elimination.independent_checker
      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier
      - name: Authority notice
        run: |
          echo 'MAX_LOGICAL_LEAVES=32'
          echo 'SEPARATOR_DEPTH=3_FIXED'
          echo 'UNBOUNDED_RECURSION=0'
          echo 'SEPARATOR_SETS_SIZE_GE3=0'
          echo 'THREE_PLUS_JOIN_CHAIN=0'
          echo 'GLOBAL_RESIDUAL_CARTESIAN_PRODUCT=0'
          echo 'P_VS_NP=OPEN'
