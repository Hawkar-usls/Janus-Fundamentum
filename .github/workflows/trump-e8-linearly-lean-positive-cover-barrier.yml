name: TRUMP E8 Linearly Lean Positive Cover Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_LINEARLY_LEAN_BALANCE_DUAL_AND_POSITIVE_EXACT_COVER_BARRIER_2026-09-30_v4.8.json'
      - 'research/tools/e8_linearly_lean_positive_cover_barrier/checker.py'
      - '.github/workflows/trump-e8-linearly-lean-positive-cover-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact linearly-lean positive-cover regression
        run: python research/tools/e8_linearly_lean_positive_cover_barrier/checker.py
