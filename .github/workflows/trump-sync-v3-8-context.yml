name: TRUMP one-shot v3.8 context sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trump-sync-v3-8-context.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch continuity without truncation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          start = Path('START_HERE_TRUMP_CONTEXT.md')
          s = start.read_text(encoding='utf-8')
          old = "1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json` **first**. This is the latest successor-state anchor and records the diagnostic-only residual-3+ forensic PASS: the first real GT2 residual component is a K3 over `orig:4/5/6`, every overlap is exactly variable `47`, relation articulations are empty, variable articulation is `[47]`, running-intersection passes, and semijoin reaches the unchanged `[4,4,4]` fixed point.\n1. Then read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.6.json` for the sealed residual-component-<=2 factorized-payload PASS."
          new = "1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.8.json` **first**. This is the latest successor-state anchor and records the scoped residual single-variable separator PASS: raw-derived separator `47`, exactly two Boolean branches, reuse of only sealed residual <=2 carriers, exact SAT/UNSAT branch authority, and zero 3plus join-chain/global residual Cartesian materialization.\n2. Then read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json` for the diagnostic-only residual-3+ forensic PASS: K3 over `orig:4/5/6`, every overlap exactly variable `47`, running-intersection PASS, and unchanged semijoin fixed point `[4,4,4]`.\n3. Then read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.6.json` for the sealed residual-component-<=2 factorized-payload PASS."
          if old not in s:
              raise SystemExit('STARTUP_MARKER_NOT_FOUND')
          s = s.replace(old, new, 1)
          s = s.replace('Twelve downward scoped subproblems are now closed for explicit Boolean raw relation semantics:', 'Thirteen downward scoped subproblems are now closed for explicit Boolean raw relation semantics:', 1)
          item12 = "12. **unique exact common-core state with conditioned residual overlap components of size at most two**: derive the exact residual relation-overlap graph. Singleton components remain direct projections; every two-relation component receives exactly one natural join over all shared residual variables followed by boundary projection. Store component carriers additively, never as a global residual Cartesian product. A residual component of size 3+ returns `OPEN_RESIDUAL_COMPONENT_GT2` before any join chain. Candidate union-find/nested pair loop and independent BFS/hash-index implementations seal `PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_COMPONENT_LE2_FACTORIZED_PAYLOAD_V1`."
          item13 = item12 + "\n13. **unique exact common-core state with a raw-derived single Boolean residual articulation variable whose two exact branches reduce to residual components of size at most two (or exact branch UNSAT)**: condition exactly on `0/1`, recompute residual components independently in each branch, reuse only the sealed v3.6 singleton/one-pair carriers, and require full original-row witness replay for SAT. Exact UNSAT requires both branch certificates. No articulation or any branch remaining GT2 returns OPEN before any 3plus join. Candidate union-find and independent BFS separator discovery seal `PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_V1`."
          if item12 not in s:
              raise SystemExit('ITEM12_MARKER_NOT_FOUND')
          s = s.replace(item12, item13, 1)
          s = s.replace('Do **not** repeat the twelve closed mechanisms as the current blocker.', 'Do **not** repeat the thirteen closed mechanisms as the current blocker.', 1)
          a = s.index('Current scoped open surface:')
          b = s.index('## Context sources', a)
          replacement = '''Current scoped open surface:\n\n`UNIQUE_COMMON_CORE_CONDITIONED_RESIDUAL_GT2_WITH_NO_ADMISSIBLE_SINGLE_BOOLEAN_SEPARATOR_OR_WITH_ANY_SINGLE_SEPARATOR_BRANCH_REMAINING_GT2__PLUS_MULTIPLE_COMMON_CORE_STATES`.\n\nThe v3.8 scoped theorem closes only the case where a raw-derived single Boolean residual articulation variable exists and both exact `0/1` branches reduce to sealed residual <=2 carriers (or exact branch UNSAT). It does not prove general residual separator tractability.\n\nCaptain's nearest blocker is now **the structure of the frozen OPEN controls where no admissible single-variable separator exists or a candidate branch remains GT2**. `OPEN_NONUNIQUE_COMMON_CORE_SUPPORT` remains a separate secondary blocker.\n\nThe next preferred action is diagnostic only:\n\n`TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_NO_SINGLE_SEPARATOR_STRUCTURE_FORENSIC`.\n\nCaptain Obvious' directive: **do not jump directly to pair/multi-variable branching or a general join-tree theorem**. Profile the frozen no-articulation and branch-still-GT2 controls first: exact residual scopes/overlap graph, minimum raw variable-cut size under a small preregistered diagnostic cap, running-intersection status, and branch-specific structural changes after one conditioning. Only then choose a pair separator, verified join-tree, bounded-width DP, finite congruence, or OPEN.\n\nForbidden shortcuts include unpreregistered enumeration of separator sets, 3+ join chains, global residual Cartesian products, budget raises, exponentially many separator/order trials, treating multiple common-core states as solved, or treating OPEN as negative evidence.\n\n'''
          s = s[:a] + replacement + s[b:]
          start.write_text(s, encoding='utf-8')

          mp = Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          m = json.loads(mp.read_text(encoding='utf-8'))
          m['latest_successor_state'] = 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.8.json'
          m['current_scoped_open_surface'] = {
            'name': 'UNIQUE_COMMON_CORE_CONDITIONED_RESIDUAL_GT2_WITH_NO_ADMISSIBLE_SINGLE_BOOLEAN_SEPARATOR_OR_WITH_ANY_SINGLE_SEPARATOR_BRANCH_REMAINING_GT2__PLUS_MULTIPLE_COMMON_CORE_STATES',
            'nearest_blocker': 'NO_ADMISSIBLE_RAW_DERIVED_SINGLE_BOOLEAN_RESIDUAL_SEPARATOR_TO_LE2_BRANCHES',
            'secondary_blocker': 'OPEN_NONUNIQUE_COMMON_CORE_SUPPORT',
            'next_gate_candidate': 'TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_NO_SINGLE_SEPARATOR_STRUCTURE_FORENSIC',
            'next_gate_class': 'DIAGNOSTIC_ONLY_AFTER_SCOPED_V3_8_PASS',
            'latest_state': 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.8.json'
          }
          m.setdefault('mechanisms', {})['BICAMERAL_RESIDUAL_SINGLE_VARIABLE_SEPARATOR'] = {
            'aliases': [
              'Unique-core residual single-variable separator factorized payload',
              'TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_FALSIFIER_GATE'
            ],
            'role': 'After an exact unique common-core state, derive one Boolean residual articulation variable from raw residual scopes, branch exactly on 0/1, recompute each branch dependency graph, and reuse only sealed residual <=2 carriers. SAT requires original witness replay; UNSAT requires both exact branch certificates.',
            'classification': 'SUCCESSOR_REPAIR',
            'fundamentum_binding': {
              'latest_state': 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.8.json',
              'preregistration_commit': '913cbe32145df5931f282fdd7403adc620f0e5d2',
              'candidate_commit': '86678c8d725d9355fe6638c8e02d88791a302baa',
              'candidate_blob': 'cd17292b7451b03b966dbcf62d1b6e4c767f7ac0',
              'independent_checker_commit': 'deabafaf0861f796d19dc0ecf8a2ccaae42ddeb1',
              'actions_run': 34993184716,
              'actions_job': 104462750297,
              'verdict': 'PASS_SCOPED_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_V1',
              'pull_request': 459,
              'merge_commit': '98301a0d09301f5a0a628b33d097bb5aa9be9cc7'
            },
            'closed_scope': 'Unique common-core predecessor plus one raw-derived Boolean residual articulation variable whose exact two branches reduce to residual <=2 carriers or exact branch UNSAT.',
            'known_open': 'No admissible single-variable separator, any separator branch remaining GT2, and multiple exact common-core states.',
            'firewall': 'No 3plus join chain, no global residual Cartesian product, no L2 budget raise, no general residual separator tractability claim.'
          }
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/trump-sync-v3-8-context.yml').unlink()
          PY
      - name: Commit synchronized context
        run: |
          git config user.name 'janus-trump-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add START_HERE_TRUMP_CONTEXT.md registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/trump-sync-v3-8-context.yml
          git commit -m 'TRUMP sync v3.8 bootstrap and context manifest'
          git push origin HEAD:main
