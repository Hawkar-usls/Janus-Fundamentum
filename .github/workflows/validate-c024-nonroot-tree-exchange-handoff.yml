name: Validate C024 Nonroot Tree Exchange Handoff

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_tree_exchange_handoff.py"
      - ".github/workflows/validate-c024-nonroot-tree-exchange-handoff.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_tree_exchange_handoff.py"
      - ".github/workflows/validate-c024-nonroot-tree-exchange-handoff.yml"

permissions:
  contents: read

jobs:
  nonroot-tree-exchange-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace exact nonroot tree exchanges into child keys
        run: python experiments/direct/janus_tear_gt_nonroot_tree_exchange_handoff.py
