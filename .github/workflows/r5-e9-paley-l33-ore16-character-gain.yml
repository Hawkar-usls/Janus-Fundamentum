name: R5 E9 Paley L33 Ore16 character-gain positive control

on:
  pull_request:
    paths:
      - "research/R5_E9_PALEY_L33_ORE16_CHARACTER_GAIN_POSITIVE_CONTROL_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley_l33_ore16_character_gain_positive_control.py"
      - ".github/workflows/r5-e9-paley-l33-ore16-character-gain.yml"
  push:
    paths:
      - "research/R5_E9_PALEY_L33_ORE16_CHARACTER_GAIN_POSITIVE_CONTROL_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley_l33_ore16_character_gain_positive_control.py"
      - ".github/workflows/r5-e9-paley-l33-ore16-character-gain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l33-ore16-positive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact two-prime L33 Ore16 controls
        run: python experiments/r5_e9_paley_l33_ore16_character_gain_positive_control.py
