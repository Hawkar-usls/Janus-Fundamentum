name: Validate C049.1 B4.6.3 hardened Node-9 up_k rebound

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'registry/c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.json'
      - 'registry/c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.json'
      - 'docs/C049_1_B4_6_3_NODE9_UP_K_CLOSURE_REBOUND_HARDENED.md'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.yml'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node9_parent_frontier_structural_compression_verifier.py'
      - 'registry/c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.json'
      - 'docs/C049_1_B4_6_3_NODE9_UP_K_CLOSURE_REBOUND_HARDENED.md'
      - '.github/workflows/validate-c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-node9-up-k-rebound:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify two-parent proof ancestry
        run: |
          git merge-base --is-ancestor 78b59bf447702146190070619fa03732481633f4 HEAD
          git merge-base --is-ancestor 7b537512fe45ef01f50912c22365716a41e0275f HEAD
          test "$(git rev-list --parents -n 1 4a2fa5acfd6bc97de3a94e1784a159c5a737ae8d)" = \
            "4a2fa5acfd6bc97de3a94e1784a159c5a737ae8d 78b59bf447702146190070619fa03732481633f4 7b537512fe45ef01f50912c22365716a41e0275f"

      - name: Compile rebound driver, producer, and independent verifier
        run: |
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py

      - name: Replay every executable shell gate from admitted PR 102
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py \
            .github/workflows/validate-c049-1-b4-6-3-node9-frontier-compression-rebound-hardened.yml
          test -f /tmp/c049-node9-frontier-original.json
          test "$(wc -c < /tmp/c049-node9-frontier-original.json)" = "312448"
          test "$(sha256sum /tmp/c049-node9-frontier-original.json | cut -d' ' -f1)" = \
            "6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890"

      - name: Generate order-independent hardened Node-9 up_k artifacts
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            /tmp/c049-node9-frontier-original.json \
            --output /tmp/c049-node9-up-k-original.json --entry-order original
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            /tmp/c049-node9-frontier-original.json \
            --output /tmp/c049-node9-up-k-reversed.json --entry-order reversed
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            /tmp/c049-node9-frontier-original.json \
            --output /tmp/c049-node9-up-k-shuffled.json --entry-order seeded-shuffle
          cmp /tmp/c049-node9-up-k-original.json /tmp/c049-node9-up-k-reversed.json
          cmp /tmp/c049-node9-up-k-original.json /tmp/c049-node9-up-k-shuffled.json

      - name: Independently replay closure and reject digest-repaired tampers
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure_verifier.py \
            /tmp/c049-node9-frontier-original.json \
            /tmp/c049-node9-up-k-original.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node9_fifteen_generator_up_k_closure.py \
            --tamper-self-test

      - name: Validate frozen closure, work ledger, receipt, and strict boundary
        run: |
          test "$(wc -c < /tmp/c049-node9-up-k-original.json)" = "555527"
          test "$(sha256sum /tmp/c049-node9-up-k-original.json | cut -d' ' -f1)" = \
            "c6e369099ea2fdf6572409dab7ce6f5172d40543388b366ec37a821262c506e4"
          python - <<'PY'
          import json
          artifact=json.load(open('/tmp/c049-node9-up-k-original.json'))
          assert artifact['semantic_digest']=='f90aa04716ca2fa9019449e19b5866ac443cf545253bb41ae212dd3c68212713'
          payload=artifact['proof_payload']
          assert payload['invariant_vector']=={f'N9U-INV-{i:02d}':'PASS' for i in range(1,11)}
          assert payload['source']['frontier_artifact_sha256']=='6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890'
          assert payload['source']['frontier_semantic_digest']=='62e9178821fe56cbf094e8512dd20b687796c6fd87e08c0fea8ea833ef6c5e80'
          assert payload['input_generator_family']['generator_count']==15
          preorder=payload['direct_preorder']
          assert preorder['ordered_pair_tests']==225
          assert preorder['relation_edge_count']==55
          assert preorder['self_relation_edge_count']==15
          assert preorder['cross_relation_edge_count']==40
          assert preorder['equivalent_cross_pair_count']==0
          minimization=payload['minimization']
          assert minimization['retained_generator_count']==2
          assert minimization['direct_removal_count']==13
          assert [x['source_class_id'] for x in minimization['retained_generators']]==['N9-S02','N9-S07']
          assert minimization['every_removal_has_direct_retained_witness'] is True
          assert minimization['transitive_closure_used_for_removal'] is False
          scalar=payload['scalar_typical_relation']
          assert scalar['typical_pattern_catalog']==['0','01','010','1','10','101']
          assert scalar['relation_edge_count']==20
          assert scalar['transitivity_checks']==50
          closure=payload['reachable_closure']
          assert closure['complete_reachable_catalog']==252
          assert closure['reachable_entry_count']==252
          assert closure['every_entry_has_direct_retained_witness'] is True
          assert closure['global_compact_universe_enumerated'] is False
          assert closure['global_compact_universe_entry_count']==0
          assert {x['source_class_id']:x['reachable_entry_count'] for x in minimization['retained_generators']}=={'N9-S02':216,'N9-S07':36}
          idem=payload['idempotence']
          assert idem['idempotent'] is True
          assert idem['first_closure_entry_count']==252
          assert idem['second_closure_entry_count']==252
          assert idem['repeated_closure_checks']==8400
          work=payload['work_ledger']
          assert work=={
            'input_generators_read':15,
            'ordered_generator_pairs_tested':225,
            'direct_relation_edges_retained':55,
            'blockwise_reachable_entries_materialized':252,
            'repeated_blockwise_checks':8400,
            'global_compact_universe_enumerated':False,
          }
          strict=payload['strict_boundary']
          assert strict['node9_parent_up_k_complete'] is True
          assert strict['node9_integrated_into_bottom_up_executor'] is False
          assert strict['root_reached'] is False
          assert strict['root_parent_refinement_started'] is False
          assert strict['negative_root_reached'] is False
          assert strict['terminal_completeness_proved'] is False
          assert strict['found_layout_enabled'] is False
          assert strict['no_layout_at_cap_enabled'] is False
          assert strict['current_global_terminal']=='OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert strict['p_vs_np']=='OPEN'
          assert payload['next_gate']=='C049.1_B4.6.3_NODE9_UP_K_INTEGRATION_AND_ROOT_PARENT_REFINEMENT'

          receipt=json.load(open('registry/c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.json'))
          assert receipt['status'] in {'DRAFT_EXACT_HEAD_CI_REQUIRED','IMPLEMENTED_HARDENED_EXACT_HEAD_CI_GREEN'}
          assert receipt['stack_position']['rebound_merge_commit']=='4a2fa5acfd6bc97de3a94e1784a159c5a737ae8d'
          assert receipt['frozen_hardened_source']['node9_frontier_artifact_sha256']=='6eefd8e31ba4808e5587475c2faa2c000fd0093da4de2c488db42d103c059890'
          assert receipt['frozen_up_k_target']['artifact_sha256']=='c6e369099ea2fdf6572409dab7ce6f5172d40543388b366ec37a821262c506e4'
          assert receipt['proof_contract']['total_digest_repaired_tampers']==60
          admitted=receipt['status']=='IMPLEMENTED_HARDENED_EXACT_HEAD_CI_GREEN'
          assert receipt['admission_boundary']['node9_parent_up_k_complete'] is admitted
          assert receipt['admission_boundary']['node9_integrated_into_bottom_up_executor'] is False
          assert receipt['admission_boundary']['root_reached_on_rebound_chain'] is False
          assert receipt['admission_boundary']['root_parent_refinement_started'] is False
          assert receipt['admission_boundary']['found_layout_enabled'] is False
          assert receipt['admission_boundary']['no_layout_at_cap_enabled'] is False
          assert receipt['admission_boundary']['current_global_terminal']=='OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert receipt['admission_boundary']['p_vs_np']=='OPEN'
          PY

      - name: Export hardened Node-9 up_k rebound package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-node9-up-k-closure-rebound-hardened
          path: |
            /tmp/c049-node9-frontier-original.json
            /tmp/c049-node9-up-k-original.json
            registry/c049-1-b4-6-3-node9-up-k-closure-rebound-hardened.json
          retention-days: 1
