name: TRUMP E8 Pair-Conditioned Hyperimplication Binary Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PAIR_CONDITIONED_HYPERIMPLICATION_BINARY_KERNEL_2026-09-30_v4.0.json'
      - 'research/tools/e8_pair_conditioned_hyperimplication_binary_kernel/checker.py'
      - '.github/workflows/trump-e8-pair-conditioned-hyperimplication-binary-kernel.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact pair-conditioned hyperimplication regression
        run: python research/tools/e8_pair_conditioned_hyperimplication_binary_kernel/checker.py
