name: R5 E9 perfect-code and A-irreducible controls

on:
  push:
    paths:
      - 'research/R5_E9_TWO_PERM_DIRECTED_PERFECT_CODE_NORMAL_FORM_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_directed_perfect_code_normal_form.py'
      - 'research/R5_E9_A_IRREDUCIBLE_BOUNDED_WIDTH_TERMINAL_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_a_irreducible_terminal_controls.py'
      - '.github/workflows/r5-e9-perfect-code-a-irreducible.yml'
  pull_request:
    paths:
      - 'research/R5_E9_TWO_PERM_DIRECTED_PERFECT_CODE_NORMAL_FORM_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_directed_perfect_code_normal_form.py'
      - 'research/R5_E9_A_IRREDUCIBLE_BOUNDED_WIDTH_TERMINAL_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_a_irreducible_terminal_controls.py'
      - '.github/workflows/r5-e9-perfect-code-a-irreducible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify directed perfect-code normal form
        run: python experiments/r5_e9_directed_perfect_code_normal_form.py
      - name: Verify A-irreducible terminal controls
        run: python experiments/r5_e9_a_irreducible_terminal_controls.py
