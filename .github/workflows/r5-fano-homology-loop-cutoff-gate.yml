name: R5 All SCL Fano Homology High Girth Loop Cutoff No-Go
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_high_girth_fano_homology_cover_nogo.py'
      - '.github/workflows/r5-fano-homology-loop-cutoff-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-homology:
    name: Certified SCL1792 Fano 2-group homology cover and fixed-loop cutoff counterexample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently source-replay regular covering, girth and original UNSAT certificate
        run: python -u experiments/r5_universal_loop_high_girth_fano_homology_cover_nogo.py
