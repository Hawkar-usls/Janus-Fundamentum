name: Validate superseded diagonal-inclusive root diagnostic

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression_verifier.py'
      - 'registry/c049-1-b4-6-3-root-parent-frontier-structural-compression.json'
      - '.github/workflows/validate-c049-1-b4-6-3-root-parent-frontier-structural-compression.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression_verifier.py'
      - 'registry/c049-1-b4-6-3-root-parent-frontier-structural-compression.json'
      - '.github/workflows/validate-c049-1-b4-6-3-root-parent-frontier-structural-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supersession-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile retained diagnostic sources
        run: |
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_root_parent_frontier_structural_compression_verifier.py
      - name: Enforce superseded non-admission boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('registry/c049-1-b4-6-3-root-parent-frontier-structural-compression.json'))
          assert r['status']=='SUPERSEDED_BY_PR105_JOIN_PATH_DOMAIN_OBSTRUCTION'
          assert r['diagnostic_only']['admissible_as_root_theorem'] is False
          assert r['decisive_correction']['source_pr']==105
          assert r['decisive_correction']['defect']=='B3_JOIN_PATH_DOMAIN_INCORRECTLY_INCLUDES_DIAGONAL_STEP'
          assert r['decisive_correction']['extension_preorder_path_steps']==['10','01','11']
          assert r['decisive_correction']['join_interleaving_path_steps']==['10','01']
          assert r['decisive_correction']['root_structural_compression_admitted'] is False
          b=r['admission_boundary']
          assert b['root_parent_generator_frontier_complete'] is False
          assert b['root_parent_refinement_complete'] is False
          assert b['root_parent_up_k_complete'] is False
          assert b['root_full_set_computed'] is False and b['root_empty_proved'] is False
          assert b['found_layout_enabled'] is False and b['no_layout_at_cap_enabled'] is False
          assert b['current_global_terminal']=='OPEN_TRAJECTORY_ENGINE_INCOMPLETE'
          assert b['p_vs_np']=='OPEN'
          assert r['next_gate']=='C049.1_B4.6.3_JOIN_PATH_DOMAIN_CORRECTION'
          PY
