name: MK BCEG R3C-W Choice Preserving Human Authority

on:
  push:
    branches:
      - research/mk-bceg-r3c-w-choice-preserving-human-contract-2026-08-30
  workflow_dispatch:

jobs:
  r3c_w:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_PREREGISTRATION_2026-08-30.json'))
          c=json.load(open('research/JANUS_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_CONTRACT_2026-08-30.json'))
          assert p['status']=='FROZEN_BEFORE_EXECUTION'
          assert c['separation']['law'].startswith('Gamma_L != W_t')
          assert p['scientific_boundary']['P_VS_NP']=='OPEN'
          print('R3C_W_PREREG_FROZEN')
          PY
      - name: Run executable choice-preserving admission gate
        run: |
          mkdir -p artifacts
          python experiments/mk_bceg_r3c_w_choice_preserving_human_authority.py \
            --output artifacts/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_RESULT_2026-08-30.json \
            --journal artifacts/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_JOURNAL_2026-08-30.jsonl
      - name: Frozen scientific gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_RESULT_2026-08-30.json'))
          assert d['verdict']=='FINITE_CHOICE_PRESERVING_AUTHORITY_GATE_SURVIVOR_NOT_THEOREM'
          assert all(d['gates'].values())
          assert d['summary']['cases']==15
          assert d['summary']['expected_terminals_matched']==15
          assert d['scientific_boundary']['TRUMP_finished'] is False
          assert d['scientific_boundary']['P_VS_NP']=='OPEN'
          print('R3C_W_VERDICT', d['verdict'], d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mk-bceg-r3c-w-choice-preserving-human-authority
          path: |
            artifacts/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_RESULT_2026-08-30.json
            artifacts/MK_BCEG_R3C_W_CHOICE_PRESERVING_HUMAN_AUTHORITY_JOURNAL_2026-08-30.jsonl
