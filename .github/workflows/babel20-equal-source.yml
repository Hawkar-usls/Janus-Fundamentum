name: BABEL-20 exact equal-column source syzygy completion
on:
  push:
    branches: ['research/babel20-*']
    paths: ['experiments/babel20/equal_source_syzygies.py','.github/workflows/babel20-equal-source.yml']
  pull_request:
    paths: ['experiments/babel20/equal_source_syzygies.py','.github/workflows/babel20-equal-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-additional-source-relations:
    strategy:
      fail-fast: false
      matrix:
        seed: [20, 37]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore source and exact rank code
        run: |
          mkdir -p /tmp/b20e
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b20e
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py /tmp/b20e/
      - name: Generate rational full-column left null witnesses
        working-directory: /tmp/b20e
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed ${{ matrix.seed }} --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Verify exact Koszul source response
        working-directory: /tmp/b20e
        run: python source_koszul.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Search exact equal-source-column relations
        working-directory: /tmp/b20e
        run: python equal_source_syzygies.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Preserve exact combined source-syzygy verdict
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel20-combined-source-seed-${{ matrix.seed }}
          path: /tmp/b20e/babel20_*_combined_syzygies.json
          retention-days: 7
