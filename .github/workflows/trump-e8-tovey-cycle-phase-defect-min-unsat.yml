name: TRUMP E8 Tovey cycle phase defect equals Min-UNSAT

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TOVEY_CYCLE_PHASE_DEFECT_EQUALS_MIN_UNSAT_2026-09-30_v2.9.json'
      - 'research/tools/e8_tovey_cycle_phase_defect_min_unsat/checker.py'
      - '.github/workflows/trump-e8-tovey-cycle-phase-defect-min-unsat.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Tovey phase-defect regression
        run: python research/tools/e8_tovey_cycle_phase_defect_min_unsat/checker.py
