name: JANUS TIME-SAT-004D4B public original mixed-CNF SHA and cost pilot
on:
  push:
    branches: [research/time-sat-004d4b-real-mixed-cnf-20261101]
    paths:
      - experiments/direct/janus_time_sat_004d4b_real_pilot.py
      - tests/test_time_sat_004d4b_real.py
      - .github/workflows/validate-time-sat-004d4b-public-mixed.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d4b-sha-frozen-public-mixed
  cancel-in-progress: true
jobs:
  frozen-real-public-cnf-and-matched-cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent native XOR and CaDiCaL baseline libraries
        run: >-
          python -m pip install --only-binary=:all: --disable-pip-version-check
          'python-sat==1.9.dev17' 'pycryptosat==5.15.0'
      - name: Show installed solver versions
        run: python -m pip show python-sat pycryptosat
      - name: Original 004D4 synthetic correctness regression
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4_mixed_xor.py' -v
      - name: Offline preregistered four-source and mixed original-equivalence guards
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4b_real.py' -v
      - name: Preserve independent C023 legacy serialized verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Bounded exact original four-source SHA and conditional cost comparison
        run: >-
          python experiments/direct/janus_time_sat_004d4b_real_pilot.py
          --out evidence/time_sat_004d4b
      - name: Retain all source/solver/no-benefit receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d4b-${{ matrix.os }}
          path: evidence/time_sat_004d4b/result.json
          retention-days: 30
          if-no-files-found: warn
