name: Validate C049.1 B4.6.3 general expand semantic bijection

on:
  push:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_GENERAL_EXPAND_SEMANTIC_BIJECTION_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-general-expand-semantic-bijection.yml'
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_GENERAL_EXPAND_SEMANTIC_BIJECTION_SPEC_V1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-general-expand-semantic-bijection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-expand-semantic-bijection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPEC_SUBJECT: 6028463821ebb6069c8cecf38cf15f9b208e6845
      PRODUCER_SUBJECT: 0549a66d21197dfd5bdd5485243b1446209fdcc7
      VERIFIER_SUBJECT: 33a4093f1ed08483bb23249e71d1f7b95116279b
      O1_EVIDENCE_SUBJECT: aa48c5652916b65fe15562ab7603ee1335a31c2b
      SPEC: experiments/direct/C049_1_B4_6_3_GENERAL_EXPAND_SEMANTIC_BIJECTION_SPEC_V1.json
      PRODUCER: experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection.py
      VERIFIER: experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier.py
      O1_AUDIT: experiments/direct/audits/C049_1_B4_6_3_GENERAL_LEAF_SEMANTIC_BIJECTION_INDEPENDENT_SOURCE_AUDIT_C5D43F68.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind theorem subject and immutable semantic interfaces
        run: |
          set -euo pipefail
          bind_blob(){ test "$(git rev-parse "$1:$2")" = "$(git hash-object "$2")"; }
          bind_blob "$SPEC_SUBJECT" "$SPEC"
          bind_blob "$PRODUCER_SUBJECT" "$PRODUCER"
          bind_blob "$VERIFIER_SUBJECT" "$VERIFIER"
          bind_blob "$O1_EVIDENCE_SUBJECT" "$O1_AUDIT"
          test "$(git hash-object "$SPEC")" = "1b75c3665c911521d012ed28116f2e592a760ca5"
          test "$(git hash-object "$PRODUCER")" = "31e0a581828d17d1ea14fbd9c48e13cb354efd13"
          test "$(git hash-object "$VERIFIER")" = "57dc06fea89fce3d20f1e3666e868a76c7492e54"
          test "$(git hash-object "$O1_AUDIT")" = "5c7ab15e3333afbf124bcfcc5c4a307f27c9ef89"
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection.py').read_text())
          v=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier.py').read_text())
          def mods(t):
              z=[]
              for n in ast.walk(t):
                  if isinstance(n,ast.Import): z.extend(a.name for a in n.names)
                  elif isinstance(n,ast.ImportFrom): z.append(n.module or '')
              return z
          assert not any(x.endswith('janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier') for x in mods(p))
          assert not any(x.endswith('janus_c049_1_b4_6_3_general_expand_semantic_bijection') for x in mods(v))
          print('EXPAND_SEMANTIC_BIJECTION_IMPLEMENTATION_DECOUPLING_STATIC_CHECK = PASS')
          PY
          materialize(){ git cat-file -e "$1^{blob}"; git cat-file blob "$1" > "$2"; test "$(git hash-object "$2")" = "$1"; }
          materialize a7c5a7a65dfd9839711967f1039a96ba20ad6443 /tmp/b2-doc.md
          materialize 3b66fa2b45702f11ee7a62657754c16800fa90f3 /tmp/b2-core.py
          materialize 786f4cc657335f31ca8696167bc2bde66d53180b /tmp/b3-doc.md
          materialize 443566c4b79bf67ec1613413130169cab12ebb0f /tmp/b3-core.py

      - name: Build conditional universal expand theorem binder twice
        run: |
          set -euo pipefail
          python "$PRODUCER" --spec "$SPEC" --o1-audit "$O1_AUDIT" --b2-doc /tmp/b2-doc.md --b2-core /tmp/b2-core.py --b3-doc /tmp/b3-doc.md --b3-core /tmp/b3-core.py --output /tmp/expand-a.json | tee /tmp/producer-a.log
          python "$PRODUCER" --b3-core /tmp/b3-core.py --b3-doc /tmp/b3-doc.md --b2-core /tmp/b2-core.py --b2-doc /tmp/b2-doc.md --o1-audit "$O1_AUDIT" --spec "$SPEC" --output /tmp/expand-b.json | tee /tmp/producer-b.log
          cmp /tmp/expand-a.json /tmp/expand-b.json
          echo 'GENERAL_EXPAND_THEOREM_BINDER_BYTE_IDENTITY = PASS'
          echo "GENERAL_EXPAND_THEOREM_ARTIFACT_SHA256=$(sha256sum /tmp/expand-a.json | cut -d' ' -f1)"

      - name: Independent expand theorem binding replay and tamper rejection
        run: |
          set -euo pipefail
          python "$VERIFIER" --spec "$SPEC" --producer-source "$PRODUCER" --o1-audit "$O1_AUDIT" --b2-doc /tmp/b2-doc.md --b2-core /tmp/b2-core.py --b3-doc /tmp/b3-doc.md --b3-core /tmp/b3-core.py --candidate-a /tmp/expand-a.json --candidate-b /tmp/expand-b.json --tamper-suite | tee /tmp/verifier.log
          grep -F 'JANUS_GENERAL_EXPAND_SEMANTIC_BIJECTION_INDEPENDENT_VERIFIER = PASS' /tmp/verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/verifier.log
          grep -F 'PUBLISHED_RESULT = JKO_PROPOSITION_4_2' /tmp/verifier.log
          grep -F 'CALLER_PRECONDITION_CERTIFICATE_REQUIRED = TRUE' /tmp/verifier.log
          grep -F 'LOCAL_EXPAND_PROVES_SPAN_PRECONDITION = FALSE' /tmp/verifier.log

      - name: Non-oracular conditional theorem scope audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          x=json.loads(Path('/tmp/expand-a.json').read_text()); p=x['proof_payload']; q=p['quantifiers']; pre=p['precondition']; b=p['strict_boundary']
          assert hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()==x['semantic_digest']
          assert q['concrete_dimension_used'] is False and q['concrete_arrangement_used'] is False and q['concrete_k_used'] is False
          assert p['published_theorem']['result']=='Proposition 4.2'
          assert p['published_theorem']['normalized_formula']=='FS_k(Varr,Bprime)=up_k(FS_k(Varr,B),Bprime)'
          assert pre['B_le_Bprime'] is True and pre['span_Varr_inter_Bprime_le_B'] is True
          assert pre['caller_certificate_required'] is True and pre['local_expand_proves_span_precondition'] is False
          assert p['dependency_ceiling']['paper_mathematics_independently_reproved_by_repo'] is False
          assert p['dependency_ceiling']['caller_expand_precondition_automatically_established'] is False
          assert b['o2_expand_preservation_and_reflection'] is False and b['general_expand_semantic_bijection_receipt'] is False
          assert b['caller_expand_precondition_automatically_established'] is False
          assert b['general_semantic_theorems_established']==1 and b['remaining_general_semantic_theorems']==6
          assert b['o3_o7_established'] is False and b['structural_induction_proved'] is False and b['terminal_completeness_proved'] is False
          assert b['global_engine_no_layout_at_cap']=='FORBIDDEN' and b['p_vs_np']=='OPEN'
          print('GENERAL_EXPAND_NON_ORACULAR_SCOPE = PASS')
          print('THEOREM_FORMULA = FS_k(Varr,Bprime)=up_k(FS_k(Varr,B),Bprime)')
          print('CALLER_PRECONDITION_CERTIFICATE_REQUIRED = TRUE')
          print('GENERAL_EXPAND_SEMANTIC_BIJECTION_RECEIPT = FALSE')
          print('P_VS_NP = OPEN')
          PY

      - name: Build exact-head expand theorem receipt
        run: |
          set -euo pipefail
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GENERAL_EXPAND_THEOREM_ARTIFACT_SHA256=$(sha256sum /tmp/expand-a.json | cut -d' ' -f1)"
            echo "GENERAL_EXPAND_THEOREM_SEMANTIC_DIGEST=$(python -c 'import json;print(json.load(open("/tmp/expand-a.json"))["semantic_digest"])')"
            echo 'PUBLISHED_RESULT=JKO_PROPOSITION_4_2'
            echo 'QUANTIFICATION=UNIVERSAL_SYMBOLIC_GF2'
            echo 'CALLER_PRECONDITION_CERTIFICATE_REQUIRED=TRUE'
            echo 'LOCAL_EXPAND_PROVES_SPAN_PRECONDITION=FALSE'
            echo 'LOCAL_SEMANTIC_MAPPING=PASS'
            echo 'BYTE_IDENTITY=PASS'
            echo 'INVARIANTS=12/12'
            echo 'DIGEST_REPAIRED_TAMPERS_REJECTED=12/12'
            echo 'PAPER_MATHEMATICS_INDEPENDENTLY_REPROVED_BY_REPO=FALSE'
            echo 'GENERAL_EXPAND_SEMANTIC_BIJECTION_RECEIPT=FALSE'
            echo 'TERMINAL_COMPLETENESS_PROVED=FALSE'
            echo 'P_VS_NP=OPEN'
          } | tee /tmp/exact-head-receipt.txt

      - name: Export general expand theorem evidence
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-general-expand-semantic-bijection
          retention-days: 7
          compression-level: 9
          path: |
            /tmp/exact-head-receipt.txt
            /tmp/expand-a.json
            /tmp/expand-b.json
            /tmp/producer-a.log
            /tmp/producer-b.log
            /tmp/verifier.log
            experiments/direct/C049_1_B4_6_3_GENERAL_EXPAND_SEMANTIC_BIJECTION_SPEC_V1.json
            experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection.py
            experiments/direct/janus_c049_1_b4_6_3_general_expand_semantic_bijection_verifier.py
