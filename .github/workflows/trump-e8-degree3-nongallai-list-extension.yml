name: TRUMP E8 Degree3 NonGallai List Extension

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_DEGREE3_NONGALLAI_LIST_EXTENSION_KERNEL_2026-09-30_v6.4.json'
      - 'research/tools/e8_degree3_nongallai_list_extension/checker.py'
      - '.github/workflows/trump-e8-degree3-nongallai-list-extension.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run non-Gallai list-extension replay
        run: python research/tools/e8_degree3_nongallai_list_extension/checker.py
