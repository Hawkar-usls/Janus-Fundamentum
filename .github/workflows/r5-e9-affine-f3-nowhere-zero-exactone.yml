name: R5 E9 Affine F3 Nowhere-Zero Exact-One

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_NOWHERE_ZERO_EXACTONE_NORMAL_FORM_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_nowhere_zero_exactone.py'
      - '.github/workflows/r5-e9-affine-f3-nowhere-zero-exactone.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact affine F3 nowhere-zero regression
        run: python experiments/r5_e9_affine_f3_nowhere_zero_exactone.py
