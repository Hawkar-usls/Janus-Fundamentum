name: C024 Fracture Channel Core

on:
  push:
    paths:
      - "experiments/direct/janus_fracture_channel_core.py"
      - "proposals/C024-JANUS-FRACTURE-CHANNEL-CORE.json"
      - "docs/C024_JANUS_FRACTURE_CHANNEL_CORE.md"
      - ".github/workflows/c024-fracture-channel-core.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_fracture_channel_core.py"
      - "proposals/C024-JANUS-FRACTURE-CHANNEL-CORE.json"
      - "docs/C024_JANUS_FRACTURE_CHANNEL_CORE.md"
      - ".github/workflows/c024-fracture-channel-core.yml"

permissions:
  contents: read

jobs:
  fracture-channel-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact fracture-star normalization audit
        run: python experiments/direct/janus_fracture_channel_core.py --self-test
