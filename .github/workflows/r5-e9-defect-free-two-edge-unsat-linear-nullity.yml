name: R5 E9 Defect-Free Two-Edge UNSAT Linear Nullity

on:
  push:
    paths:
      - "research/R5_E9_DEFECT_FREE_TWO_EDGE_UNSAT_LINEAR_NULLITY_FAMILY_2026-09-28_v1.0.md"
      - "experiments/r5_e9_defect_free_two_edge_unsat_linear_nullity.py"
      - ".github/workflows/r5-e9-defect-free-two-edge-unsat-linear-nullity.yml"
  pull_request:
    paths:
      - "research/R5_E9_DEFECT_FREE_TWO_EDGE_UNSAT_LINEAR_NULLITY_FAMILY_2026-09-28_v1.0.md"
      - "experiments/r5_e9_defect_free_two_edge_unsat_linear_nullity.py"
      - ".github/workflows/r5-e9-defect-free-two-edge-unsat-linear-nullity.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_defect_free_two_edge_unsat_linear_nullity.py
      - name: Replay exact bootstrap and recurrence controls
        run: python experiments/r5_e9_defect_free_two_edge_unsat_linear_nullity.py
