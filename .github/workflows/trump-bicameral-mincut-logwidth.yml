name: TRUMP Bicameral Canonical Mincut Logwidth Explanation

on:
  push:
    branches:
      - research/trump-bicameral-mincut-logwidth-2026-09-15
    paths:
      - 'research/TRUMP_BICAMERAL_MINCUT_LOGWIDTH_EXPLANATION_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bicameral_mincut/**'
      - '.github/workflows/trump-bicameral-mincut-logwidth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicameral-mincut-logwidth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run mincut log-width independent checker
        shell: bash
        run: |
          set -euo pipefail
          python -m research.tools.apma_bicameral_mincut.independent_checker | tee /tmp/mincut-logwidth.json

      - name: Assert frozen scoped verdict and firewalls
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/mincut-logwidth.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_CANONICAL_MINCUT_LOGWIDTH_EXPLANATION_INDUCTION', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO', sf
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED', sf
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Parent pair-separator regression
        run: python -m research.tools.apma_bicameral_pair_separator.independent_checker

      - name: Parent single-variable bicameral regression
        run: python -m research.tools.apma_bicameral_explanation.independent_checker

      - name: Parent raw compositional regression
        run: python -m research.tools.apma_unseen_basis.compositional_independent_checker

      - name: Parent raw relation basis regression
        run: python -m research.tools.apma_unseen_basis.independent_checker

      - name: Authority notice
        run: |
          echo 'SCOPED_CANONICAL_MINCUT_LOGWIDTH_EXPLANATION_ONLY'
          echo 'DISCOVERY=POLYNOMIAL_MAXFLOW_NOT_SUBSET_ENUMERATION'
          echo 'BRANCH_BUDGET=2^K_LE_L_BEFORE_ENUMERATION'
          echo 'CONNECTED_MIXED_CORE_SOLVED=NO'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
