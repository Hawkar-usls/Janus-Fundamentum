name: R5 J5 SCL90 Frozen Degree Three Dual Proof
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'research/certificates/R5_J5_SCL90_GF3_V3_ORBIT_DUAL_2026-10-13.b64z'
      - 'experiments/r5_j5_degree3_frozen_dual_standalone_source_verifier.py'
      - 'research/R5_J5_SCL90_UNSAT_GF3_DEGREE3_DUAL_COUNTEREXAMPLE_PROVED_2026-10-13.md'
      - '.github/workflows/r5-j5-scl90-frozen-degree3-dual-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-original-source:
    name: Independent fixed 6656 byte source proof, 27state UNSAT, all 368640 generator duals
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently check original J5 UNSAT and frozen GF3 degree3 dual without Gaussian elimination
        run: python -u experiments/r5_j5_degree3_frozen_dual_standalone_source_verifier.py
