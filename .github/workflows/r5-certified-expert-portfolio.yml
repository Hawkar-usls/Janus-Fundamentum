name: R5 JANUS Certified Expert Portfolio
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_expert_portfolio.py'
      - '.github/workflows/r5-certified-expert-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-portfolio:
    name: SCL cooperative exact experts and independent proof replay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded/total modes without claiming P=NP
        run: python -u experiments/r5_universal_certified_expert_portfolio.py
