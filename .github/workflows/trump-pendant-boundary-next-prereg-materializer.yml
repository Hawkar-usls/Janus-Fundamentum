name: TRUMP Pendant Boundary Next Prereg Materializer

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - '.github/workflows/trump-pendant-boundary-next-prereg-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-next-prereg:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BRANCH: research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
      RESULT: research/TRUMP_SATLIB_UF20_R000_R111_PENDANT_SINGLETON_EXISTENTIAL_BOUNDARY_PROJECTION_RESULT_2026-09-17_v1.1.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Materialize only the Captain-authorized next preregistration
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          result_path=Path('research/TRUMP_SATLIB_UF20_R000_R111_PENDANT_SINGLETON_EXISTENTIAL_BOUNDARY_PROJECTION_RESULT_2026-09-17_v1.1.json')
          r=json.loads(result_path.read_text())
          assert r['status']=='FROZEN_REPAIRED_EXECUTION_SCIENTIFIC_RESULT',r
          assert r['execution']['conclusion']=='success' and r['execution']['independent_verified'] is True,r
          result_blob=subprocess.check_output(['git','hash-object',str(result_path)],text=True).strip()
          verdict=r['verdict']
          if verdict=='ALL_ELEVEN_UNIVERSAL':
              assert r['local_semantics_theorem']['symbolic_projection_equivalence_verified'] is True,r
              out=Path('research/TRUMP_SATLIB_UF20_R000_R111_PENDANT_SINGLETON_DELETION_DEPENDENCY_AUDIT_PREREGISTRATION_2026-09-17.json')
              prereg={
                'artifact_id':'JANUS-TRUMP-SATLIB-UF20-R000-R111-PENDANT-SINGLETON-DELETION-DEPENDENCY-AUDIT-PREREGISTRATION-2026-09-17-v1.0',
                'date':'2026-09-17','status':'FROZEN_BEFORE_ANY_INTER_ATTACHMENT_DEPENDENCY_VALUE_COMPUTATION',
                'authority':'DIAGNOSTIC_FROZEN_LEAF_TO_GATEWAY_DEPENDENCY_AUDIT_ONLY__NO_DELETION_BOUNDARY_RECOMPUTATION_SOLVER_ACTION_AUTOMORPHISM_GROUP_SEARCH_CARRIER_ADAPTER_OR_QUOTIENT',
                'parent_boundary_result':{'path':str(result_path),'blob':result_blob,'verdict':'ALL_ELEVEN_UNIVERSAL'},
                'target_attachments':'EXACTLY_THE_11_FROZEN_ATTACHMENTS_IN_parent_boundary_result.source_receipts',
                'dependency_graph_definition':{
                  'nodes':'ONE_NODE_PER_FROZEN_ATTACHMENT_IDENTIFIED_BY_[source,constraint_id,leaf_variable]',
                  'cross_source_edges_forbidden':True,
                  'directed_edge':'A_TO_B_IFF_A_AND_B_ARE_DISTINCT_ATTACHMENTS_IN_THE_SAME_SOURCE_AND_B.leaf_variable_IS_IN_A.gateway_order',
                  'meaning':'A_RECONSTRUCTION_REQUIRES_B_LEAF_VALUE_TO_BE_AVAILABLE_WHEN_B_IS_A_GATEWAY_OF_A',
                  'canonical_node_order':'SOURCE_ORDER_UF20_02_UF20_03_UF20_04_UF20_05_THEN_LEXICOGRAPHIC_constraint_id_THEN_leaf_variable',
                  'canonical_edge_order':'LEXICOGRAPHIC_BY_CANONICAL_SOURCE_NODE_ORDER',
                },
                'required_receipts':[
                  'EXACT_11_NODE_LIST_COPIED_FROM_FROZEN_PARENT_MAPPINGS_WITHOUT_RECOMPUTING_BOUNDARY_RELATIONS',
                  'DIRECTED_EDGE_LIST_PER_SOURCE',
                  'INDEGREE_AND_OUTDEGREE_PER_NODE',
                  'WEAKLY_CONNECTED_COMPONENTS_PER_SOURCE',
                  'DIRECTED_CYCLES_IF_ANY_IN_CANONICAL_NODE_ORDER',
                  'DETERMINISTIC_KAHN_TOPOLOGICAL_ELIMINATION_ORDER_IF_ACYCLIC_USING_CANONICAL_NODE_ORDER_AS_TIE_BREAK',
                  'REVERSE_TOPOLOGICAL_RECONSTRUCTION_ORDER_IF_ACYCLIC'
                ],
                'outcome_rules':{
                  'NO_INTER_ATTACHMENT_DEPENDENCIES':'EDGE_COUNT_EQUALS_0',
                  'ACYCLIC_INTER_ATTACHMENT_DEPENDENCIES':'EDGE_COUNT_GT_0_AND_GRAPH_HAS_NO_DIRECTED_CYCLE',
                  'CYCLIC_INTER_ATTACHMENT_DEPENDENCIES':'AT_LEAST_ONE_DIRECTED_CYCLE_EXISTS'
                },
                'semantic_interpretation_if_acyclic':{
                  'licensed_only_after_execution':'THE_ALREADY_PROVED_SINGLE_ATTACHMENT_EXISTENTIAL_ELIMINATIONS_CAN_BE_COMPOSED_IN_TOPOLOGICAL_ELIMINATION_ORDER_WITH_RECONSTRUCTION_IN_REVERSE_TOPOLOGICAL_ORDER_BECAUSE_EACH_TARGET_GATEWAY_LEAF_DEPENDENCY_REMAINS_AVAILABLE_UNTIL_ITS_DEPENDENTS_HAVE_BEEN_ELIMINATED',
                  'deletion_applied_in_this_gate':False,
                  'simultaneous_deletion_licensed_in_this_gate':False
                },
                'fresh_holdout_firewall':{'sources':['UF20_011','UF20_012','UF20_013','UF20_014','UF20_015'],'values_may_be_read_or_computed':False},
                'forbidden':['RECOMPUTE_ANY_BOUNDARY_RELATION','DELETE_ANY_LEAF_OR_CONSTRAINT','MODIFY_ANY_PROJECTED_RAW','RUN_ANY_SOLVER_OR_COMPONENT_SOLVER','DEFINE_ANY_NEW_FEATURE_OR_GRAPH_STATISTIC','READ_OR_COMPUTE_ANY_VALUE_ON_UF20_011_TO_UF20_015','PROMOTE_TO_TRACTABILITY_HARDNESS_GENERAL_SAT_OR_P_VS_NP'],
                'resource_constraints':{'nodes':11,'fresh_holdout_values_read':0,'boundary_relation_recomputations':0,'attachment_deletions':0,'projected_raw_modifications':0,'solver_invocations':0,'component_solution_attempts':0},
                'scientific_firewall':{'P_VS_NP':'OPEN','GENERAL_SAT_IN_P':'NOT_PROVED','CONNECTED_MIXED_CORE_SOLVED':'NO','ACYCLIC_DEPENDENCIES_IMPLY_GLOBAL_TRACTABILITY':False},
                'next_action':'RETURN_TO_CAPTAIN_FOR_CLEAN_PREREGISTRATION_REVIEW_BEFORE_COMPUTING_ANY_DEPENDENCY_EDGE'
              }
          else:
              assert verdict in {'MIXED_OR_PROPER','AT_LEAST_ONE_EMPTY'},r
              out=Path('research/TRUMP_SATLIB_UF20_R000_R111_PENDANT_SINGLETON_NONUNIVERSAL_BOUNDARY_LOCALIZATION_PREREGISTRATION_2026-09-17.json')
              prereg={
                'artifact_id':'JANUS-TRUMP-SATLIB-UF20-R000-R111-PENDANT-SINGLETON-NONUNIVERSAL-BOUNDARY-LOCALIZATION-PREREGISTRATION-2026-09-17-v1.0',
                'date':'2026-09-17','status':'FROZEN_BEFORE_NONUNIVERSAL_RECEIPT_SYNTHESIS',
                'authority':'DIAGNOSTIC_READ_ONLY_FROZEN_BOUNDARY_RECEIPT_LOCALIZATION_ONLY__NO_DELETION_SOLVER_COMPONENT_SOLVING_OR_NEW_BOUNDARY_COMPUTATION',
                'parent_boundary_result':{'path':str(result_path),'blob':result_blob,'verdict':verdict},
                'contract':'READ_ONLY_THE_ALREADY_FROZEN_11_ATTACHMENT_OUTCOMES_BOUNDARY_RELATIONS_AND_CANONICAL_WITNESSES;GROUP_BY_UNIVERSAL_PROPER_EMPTY_AND_RECORD_EXACT_SOURCE_CONSTRAINT_LEAF_GATEWAY_IDENTITIES_WITHOUT_RECOMPUTATION',
                'fresh_holdout_firewall':{'sources':['UF20_011','UF20_012','UF20_013','UF20_014','UF20_015'],'values_may_be_read_or_computed':False},
                'forbidden':['RECOMPUTE_ANY_BOUNDARY_RELATION','DELETE_ANYTHING','RUN_ANY_SOLVER','DEFINE_NEW_FEATURE_OR_BOUNDARY_RULE','READ_OR_COMPUTE_ANY_VALUE_ON_UF20_011_TO_UF20_015'],
                'scientific_firewall':{'P_VS_NP':'OPEN','GENERAL_SAT_IN_P':'NOT_PROVED','CONNECTED_MIXED_CORE_SOLVED':'NO'},
                'next_action':'RETURN_TO_CAPTAIN_FOR_CLEAN_PREREGISTRATION_REVIEW_BEFORE_LOCALIZATION_SYNTHESIS'
              }
          assert not out.exists(),out
          out.write_text(json.dumps(prereg,indent=2)+'\n')
          print(json.dumps({'parent_verdict':verdict,'parent_result_blob':result_blob,'created':str(out)},sort_keys=True))
          PY
      - name: Commit next preregistration only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/TRUMP_SATLIB_UF20_R000_R111_PENDANT_SINGLETON_*_PREREGISTRATION_2026-09-17.json
          git diff --cached --quiet && { echo 'NO_NEW_PREREG'; exit 0; }
          git commit -m 'TRUMP materialize next pendant-boundary Captain preregistration'
          git push origin "HEAD:$BRANCH"
