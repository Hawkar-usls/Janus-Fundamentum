name: BABEL-21G exact Gram kernel-image theorem regression
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/gram_kernel_rank.py','.github/workflows/babel21-gram-rank.yml']
  pull_request:
    paths: ['experiments/babel21/gram_kernel_rank.py','.github/workflows/babel21-gram-rank.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rational-gram-kernel-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Prepare four frozen legal SCL21 constructions
        run: |
          mkdir -p /tmp/b21gram
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21gram
          cp experiments/babel20/noncover_scout.py experiments/babel21/gram_kernel_rank.py /tmp/b21gram/
      - name: Check direct Fourier ranks against sparse-Gram ranks over Q
        working-directory: /tmp/b21gram
        run: python gram_kernel_rank.py
      - name: Archive exact Q dual-rank regression
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-gram-rank-kernel-image-theorem-regression
          path: /tmp/b21gram/babel21_rank_difference_gram_regression.json
          retention-days: 7
