name: JANUS TRUMP R50G25BA4 factorized k-bit identity channel

on:
  push:
    branches:
      - research/r50g25ba4-factorized-k-bit-persistent-identity-channel-2026-09-08
  workflow_dispatch:

jobs:
  ba4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen BA4 scientific audit
        working-directory: experiments
        run: |
          python janus_trump_r50g25ba4_factorized_k_bit_persistent_identity_channel.py --out ../JANUS_TRUMP_R50G25BA4_RESULT.json
      - name: Independent fail-closed verification
        working-directory: experiments
        run: |
          python verify_janus_trump_r50g25ba4_factorized_k_bit_persistent_identity_channel.py --result ../JANUS_TRUMP_R50G25BA4_RESULT.json --out ../JANUS_TRUMP_R50G25BA4_VERIFY.json
      - name: Print immutable identities
        run: |
          sha256sum JANUS_TRUMP_R50G25BA4_RESULT.json JANUS_TRUMP_R50G25BA4_VERIFY.json
          python - <<'PY'
          import json
          x=json.load(open('JANUS_TRUMP_R50G25BA4_RESULT.json'))
          v=json.load(open('JANUS_TRUMP_R50G25BA4_VERIFY.json'))
          assert x['outcome']=='BA4-A_FACTORIZED_K_BIT_PERSISTENT_IDENTITY_CHANNEL_CERTIFIED'
          assert x['failure_count']==0 and not x['falsifiers']
          assert x['BA4_2_product_relation']['explicit_2powk_table_materialized'] is False
          assert x['BA4_4_factorized_certificate']['state_table_rows']==0
          assert x['BA4_4_factorized_certificate']['enumerated_boundary_vectors']==0
          assert x['BA4_7_complexity']['representation_state_rows']==0
          assert all(h['pass'] for h in x['BA4_9_holdouts'])
          assert x['single_lane_recovery']['pass'] is True
          assert x['BA5_started'] is False and x['arbitrary_CNF_coverage_started'] is False
          assert v['status']=='PASS' and v['error_count']==0
          print('BA4 fail-closed identity PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba4-result
          path: |
            JANUS_TRUMP_R50G25BA4_RESULT.json
            JANUS_TRUMP_R50G25BA4_VERIFY.json
          if-no-files-found: error
