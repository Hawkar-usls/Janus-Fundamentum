name: JANUS TRUMP R50G25BA7 generic path fill recurrence

on:
  push:
    branches:
      - research/r50g25ba7-generic-touching-coupling-path-fill-recurrence-2026-09-08
    paths:
      - 'experiments/janus_trump_r50g25ba7_generic_touching_coupling_path_fill_recurrence.py'
      - 'experiments/verify_janus_trump_r50g25ba7_generic_touching_coupling_path_fill_recurrence.py'
      - '.github/workflows/janus-trump-r50g25ba7.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scientific:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact BA7 result from frozen source
        env:
          PYTHONPATH: experiments
        run: |
          mkdir -p artifacts
          python experiments/janus_trump_r50g25ba7_generic_touching_coupling_path_fill_recurrence.py \
            --out artifacts/JANUS_TRUMP_R50G25BA7_RESULT.json
      - name: Independent mathematical replay
        env:
          PYTHONPATH: experiments
        run: |
          python experiments/verify_janus_trump_r50g25ba7_generic_touching_coupling_path_fill_recurrence.py \
            --result artifacts/JANUS_TRUMP_R50G25BA7_RESULT.json \
            --out artifacts/JANUS_TRUMP_R50G25BA7_VERIFY.json
      - name: Enforce strict BA7 obligation-product promotion guard
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rp=Path('artifacts/JANUS_TRUMP_R50G25BA7_RESULT.json')
          vp=Path('artifacts/JANUS_TRUMP_R50G25BA7_VERIFY.json')
          r=json.loads(rp.read_text()); v=json.loads(vp.read_text())
          assert r['preregistration_commit']=='d258c8088d12437180d11f20e38b5d0c4afe12b7'
          assert r['indexing_hardening_commit']=='cdfefc5bcf12ce0fb8bc95e3d5f11855dfec1338'
          assert r['methodology_firewall_commit']=='b52b4ab0a8ba21f6b41a9a0c5c7c2774d95e5e72'
          assert r['failure_count']==0 and r['falsifiers']==[]
          assert r['outcome']=='BA7-A_GENERIC_TOUCHING_COUPLING_PATH_FILL_RECURRENCE_CERTIFIED'
          assert r['BA7_1_generic_residual_invariant']['induction_step_domain']=='0<=j<=m-2'
          assert r['BA7_2_terminal_projection']['endpoint_relation']==['01','10','11']
          assert r['BA7_3_generic_reconstruction']['map']=='q_i := NOT q_0 for every 1<=i<m'
          assert r['BA7_6_fill_graph_recurrence']['edge_count']=='|E_j|=m-j'
          assert r['BA7_7_transient_edge_peak']['E_peak']=='m+1'
          assert r['BA7_8_local_resolution_productivity']['abstract']['productive_binary_resolvents_per_step']==1
          raw=r['BA7_8_local_resolution_productivity']['carrier_diagnostic']
          assert raw['BA6_m2_replay_raw_total']==12
          assert raw['m3_raw_total']!=12
          assert raw['BA6_constant_12_generalizes'] is False
          assert raw['used_for_BA7_promotion'] is False
          assert r['BA7_9_width']['W_peak']==13
          assert r['BA7_10_certificate_recurrence']['generic_state_table_rows']==0
          assert r['BA7_11_total_time']['T_total_n']=='O(n log n)'
          assert r['BA7_12_no_hidden_state_enumeration']['boundary_vectors_enumerated']==0
          pre=r['strict_promotion_guard_pre_independent_verify']
          assert pre['all_closed_pre_independent_verify'] is True
          assert pre['x_no_unclassified_exception']==1
          assert pre['v_independent_verifier']==0 and pre['P_BA7']==0
          assert v['status']=='PASS' and v['error_count']==0
          assert v['v_independent_verifier']==1 and v['P_BA7']==1
          assert len(v['obligations'])==14 and all(z==1 for z in v['obligations'].values())
          assert v['message_state']=='VERIFIED'
          assert r['arbitrary_CNF_coverage_started'] is False
          assert r['cycle_gate_started'] is False
          assert r['branching_graph_gate_started'] is False
          assert r['next_gate_started'] is False
          assert r['P_VS_NP']=='OPEN' and r['SAT_IN_P']=='NOT_PROVED' and r['TRUMP_finished'] is False
          print('RESULT_SHA256='+hashlib.sha256(rp.read_bytes()).hexdigest())
          print('VERIFY_SHA256='+hashlib.sha256(vp.read_bytes()).hexdigest())
          print('P_BA7=1')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba7-result
          path: |
            artifacts/JANUS_TRUMP_R50G25BA7_RESULT.json
            artifacts/JANUS_TRUMP_R50G25BA7_VERIFY.json
          if-no-files-found: error
