name: R5 Double-Switch SCL PC3 Dual Challenge
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_scl_double_switch_pc3_dual.py'
      - '.github/workflows/r5-scl-double-switch-pc3-dual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-two-switch:
    name: Two legal swaps breaking 3 exact witnesses, then PC3/dual
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact SAT/UNSAT challenge and independent GF2 PC3 certificate
        run: python -u experiments/r5_universal_scl_double_switch_pc3_dual.py
