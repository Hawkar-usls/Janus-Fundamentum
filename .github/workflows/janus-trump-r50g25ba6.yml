name: JANUS TRUMP R50G25BA6 shared-variable interaction

on:
  push:
    branches:
      - research/r50g25ba6-minimal-shared-variable-coupling-interaction-2026-09-08
    paths:
      - 'research/JANUS_TRUMP_R50G25BA6_PREREGISTRATION.json'
      - 'research/JANUS_TRUMP_R50G25BA6_PREREGISTRATION_POLARITY_DOMAIN_HARDENING.json'
      - 'experiments/janus_trump_r50g25ba6_minimal_shared_variable_coupling_interaction.py'
      - 'experiments/verify_janus_trump_r50g25ba6_minimal_shared_variable_coupling_interaction.py'
      - '.github/workflows/janus-trump-r50g25ba6.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scientific:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact BA6 result from frozen source
        env:
          PYTHONPATH: experiments
        run: |
          mkdir -p artifacts
          python experiments/janus_trump_r50g25ba6_minimal_shared_variable_coupling_interaction.py \
            --out artifacts/JANUS_TRUMP_R50G25BA6_RESULT.json
      - name: Independent mathematical replay
        env:
          PYTHONPATH: experiments
        run: |
          python experiments/verify_janus_trump_r50g25ba6_minimal_shared_variable_coupling_interaction.py \
            --result artifacts/JANUS_TRUMP_R50G25BA6_RESULT.json \
            --out artifacts/JANUS_TRUMP_R50G25BA6_VERIFY.json
      - name: Enforce strict BA6 obligation-product promotion guard
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rp=Path('artifacts/JANUS_TRUMP_R50G25BA6_RESULT.json')
          vp=Path('artifacts/JANUS_TRUMP_R50G25BA6_VERIFY.json')
          r=json.loads(rp.read_text())
          v=json.loads(vp.read_text())
          assert r['preregistration_commit']=='7eedb1ffd275c63906b8309a1e2c6e5b8a9924be'
          assert r['polarity_domain_hardening_commit']=='75df83126fd57dc2e9cadcbf3643cac9b7c2572d'
          assert r['methodology_firewall_commit']=='b52b4ab0a8ba21f6b41a9a0c5c7c2774d95e5e72'
          assert r['failure_count']==0 and r['falsifiers']==[]
          assert r['outcome']=='BA6-A_MINIMAL_SHARED_VARIABLE_RESOLUTION_INTERACTION_CERTIFIED'
          assert r['BA6_1_exact_source_relation']['satisfying_set']==['011','100','101','111']
          assert r['BA6_2_interaction_projection']['projected_set']==['01','10','11']
          assert r['BA6_2_interaction_projection']['resolution_exact_target'] is True
          assert r['BA6_3_constructive_return']['pass'] is True
          assert r['BA6_4_materialization']['actual_projection_exact'] is True
          assert r['BA6_5_transport_kernel']['K12_next_present'] is True
          assert r['BA6_5_transport_kernel']['K23_next_present'] is True
          assert r['BA6_5_transport_kernel']['R13_fill_present'] is True
          assert r['BA6_5_transport_kernel']['manual_future_insertion']==0
          assert r['BA6_6_interaction_graph']['E_source']==[[1,2],[2,3]]
          assert r['BA6_6_interaction_graph']['E_derived']==[[1,3]]
          assert r['BA6_7_complexity']['R_peak']==3
          assert r['BA6_7_complexity']['B_peak']==3
          assert r['BA6_7_complexity']['E_peak']==3
          assert r['BA6_7_complexity']['temporary_boundary_kernel_width']==3
          assert r['BA6_7_complexity']['W_peak']==13
          assert r['BA6_7_complexity']['raw_resolvents_per_rung']==12
          assert r['BA6_9_complete_polarity_audit']['complete_assignment_count']==16
          assert r['BA6_9_complete_polarity_audit']['partition_counts']=={
            'TAUTOLOGICAL_PROJECTION':8,
            'UNARY_PROJECTION':0,
            'BINARY_DERIVED_COUPLING':8,
            'CONTRADICTION_IF_ANY':0,
          }
          pre=r['strict_promotion_guard_pre_independent_verify']
          assert pre['all_closed_pre_independent_verify'] is True
          assert pre['x_no_unclassified_exception']==1
          assert pre['v_independent_verifier']==0 and pre['P_BA6']==0
          assert v['status']=='PASS' and v['error_count']==0
          assert v['v_independent_verifier']==1 and v['P_BA6']==1
          assert len(v['obligations'])==12 and all(z==1 for z in v['obligations'].values())
          assert v['message_state']=='VERIFIED'
          assert r['arbitrary_CNF_coverage_started'] is False
          assert r['next_gate_started'] is False
          assert r['P_VS_NP']=='OPEN' and r['SAT_IN_P']=='NOT_PROVED'
          print('RESULT_SHA256='+hashlib.sha256(rp.read_bytes()).hexdigest())
          print('VERIFY_SHA256='+hashlib.sha256(vp.read_bytes()).hexdigest())
          print('P_BA6=1')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba6-result
          path: |
            artifacts/JANUS_TRUMP_R50G25BA6_RESULT.json
            artifacts/JANUS_TRUMP_R50G25BA6_VERIFY.json
          if-no-files-found: error
