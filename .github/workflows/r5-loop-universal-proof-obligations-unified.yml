name: R5 All Source Loop Proof Obligations Unified
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_high_girth_fano_homology_cover_nogo.py'
      - 'experiments/r5_universal_loop_signed_integer_gap_certificate.py'
      - 'research/R5_LOOP_UNBOUNDED_GIRTH_AND_INTEGER_GAP_PROOF_2026-10-13.md'
      - '.github/workflows/r5-loop-universal-proof-obligations-unified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem:
    name: One HEAD all-source loop truncation and integer gap proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact first Fano homology cover and infinite tower proof controls
        run: python -u experiments/r5_universal_loop_high_girth_fano_homology_cover_nogo.py
      - name: Exact all-SCL signed-loop numerator divisibility and output lattice gap
        run: python -u experiments/r5_universal_loop_signed_integer_gap_certificate.py
