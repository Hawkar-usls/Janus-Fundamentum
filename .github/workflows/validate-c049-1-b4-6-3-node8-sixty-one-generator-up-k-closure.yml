name: Validate C049.1 B4.6.3 node-8 sixty-one-generator up_k closure

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py'
      - 'experiments/direct/janus_c049_1_b4_5_bottom_up_scaffold_executor.py'
      - '.github/workflows/validate-c049-1-b4-6-3-node8-sixty-one-generator-up-k-closure.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py'
      - 'experiments/direct/janus_c049_1_b4_5_bottom_up_scaffold_executor.py'
      - '.github/workflows/validate-c049-1-b4-6-3-node8-sixty-one-generator-up-k-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node8-sixty-one-generator-up-k-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile closure producer, verifier, and frozen prerequisites
        run: |
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py

      - name: Regenerate exact frozen negative prefix
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-negative-prefix
          python experiments/direct/janus_c049_1_b4_6_3_negative_root_engine_replay.py \
            --output-dir /tmp/c049-negative-prefix

      - name: Reproduce admitted node-6 hardening
        env:
          PYTHONPATH: experiments/direct
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_dimension_two_preorder_hardening.py \
            /tmp/c049-negative-prefix \
            --output /tmp/c049-dim2-preorder.json
          test "$(sha256sum /tmp/c049-dim2-preorder.json | cut -d' ' -f1)" = \
            "a68ea1957382bfa89386a09ab501a052057b1cc5de8db7191a6ab3a26e1d2af9"

      - name: Reproduce node-6 integration and node-7 preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-node6-integration
          python experiments/direct/janus_c049_1_b4_6_3_node6_up_k_integration_parent_refinement.py \
            /tmp/c049-negative-prefix \
            /tmp/c049-dim2-preorder.json \
            --output-dir /tmp/c049-node6-integration \
            --parent-pair-cap 10000 \
            --parent-refinement-cap 2000000
          python - <<'PY'
          import json
          value=json.load(open('/tmp/c049-node6-integration/manifest.json'))
          assert value['manifest_digest']=='2ca2b0bc7566fb2e24f62e9df44499044843fa08388d8573fb74221dfab80512'
          assert value['execution']['processed_internal_node_ids']==[6]
          assert value['execution']['stop']['node_id']==7
          PY

      - name: Reproduce admitted node-7 frontier and up_k closure
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node7_parent_frontier_structural_compression.py \
            /tmp/c049-node6-integration/manifest.json \
            --output /tmp/c049-node7-frontier.json \
            --entry-order original
          test "$(sha256sum /tmp/c049-node7-frontier.json | cut -d' ' -f1)" = \
            "6a0748219d829434feeb5de2c5488e1fa3aeb1fab16ecbfee0c5629be90130a9"
          python experiments/direct/janus_c049_1_b4_6_3_node7_thirteen_generator_up_k_closure.py \
            /tmp/c049-node7-frontier.json \
            --output /tmp/c049-node7-up-k.json \
            --entry-order original
          test "$(sha256sum /tmp/c049-node7-up-k.json | cut -d' ' -f1)" = \
            "c085a3bee4e0c92a01eb22715390079f9858c5704ebcbf8534f9de196087d189"

      - name: Reproduce admitted node-7 integration and exact node-8 preflight
        env:
          PYTHONPATH: experiments/direct
        run: |
          mkdir /tmp/c049-node7-integration
          python experiments/direct/janus_c049_1_b4_6_3_node7_up_k_integration_node8_preflight.py \
            /tmp/c049-negative-prefix \
            /tmp/c049-dim2-preorder.json \
            /tmp/c049-node7-frontier.json \
            /tmp/c049-node7-up-k.json \
            --output-dir /tmp/c049-node7-integration \
            --node8-pair-cap 10000 \
            --node8-refinement-cap 2000000
          test "$(wc -c < /tmp/c049-node7-integration/manifest.json)" = "5430371"
          test "$(sha256sum /tmp/c049-node7-integration/manifest.json | cut -d' ' -f1)" = \
            "05a4269be3b15bee40c254f81cc5e668c4903e90777576a9f0d226093892122b"

      - name: Reproduce admitted node-8 frontier compression
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_parent_frontier_structural_compression.py \
            /tmp/c049-node7-integration/manifest.json \
            --output /tmp/c049-node8-frontier.json \
            --entry-order original
          test "$(wc -c < /tmp/c049-node8-frontier.json)" = "204739"
          test "$(sha256sum /tmp/c049-node8-frontier.json | cut -d' ' -f1)" = \
            "93dcd5610eb9df079823b172a4f824ce1c09859e759c6b771dc95b99af394d34"

      - name: Produce original, reversed, and seeded-shuffled node-8 closure artifacts
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-original.json \
            --entry-order original
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-reversed.json \
            --entry-order reversed
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            /tmp/c049-node8-frontier.json \
            --output /tmp/c049-node8-up-k-shuffled.json \
            --entry-order seeded-shuffle
          cmp /tmp/c049-node8-up-k-original.json /tmp/c049-node8-up-k-reversed.json
          cmp /tmp/c049-node8-up-k-original.json /tmp/c049-node8-up-k-shuffled.json

      - name: Independently replay closure, idempotence, and tamper rejection
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure_verifier.py \
            /tmp/c049-node8-frontier.json \
            /tmp/c049-node8-up-k-original.json \
            --producer-source experiments/direct/janus_c049_1_b4_6_3_node8_sixty_one_generator_up_k_closure.py \
            --tamper-self-test

      - name: Match frozen byte, semantic, closure, and strict boundary
        run: |
          test "$(wc -c < /tmp/c049-node8-up-k-original.json)" = "9344591"
          test "$(sha256sum /tmp/c049-node8-up-k-original.json | cut -d' ' -f1)" = \
            "e5202b9eb32ef44b1fdf493c6848ec82f8ce16fa502e623b7fbfdeb6bc735620"
          python - <<'PY'
          import json
          value=json.load(open('/tmp/c049-node8-up-k-original.json'))
          assert value['semantic_digest']=='cf4794e6ccc4591e9bf57ccb4256a42c20bca8fba86658350f762f21f1019090'
          proof=value['proof_payload']
          assert proof['admit'] is True
          assert len(proof['invariant_vector'])==10
          assert set(proof['invariant_vector'].values())=={'PASS'}
          mini=proof['preorder_minimization']
          assert mini['ordered_pair_tests']==3721
          assert mini['relation_edges']==104
          assert mini['cross_relation_edges']==43
          assert mini['retained_generator_count']==28
          assert mini['direct_removal_count']==33
          assert mini['retained_family_digest']=='ed1e5ce272bc3202a8e3203fdb108dcbb9ef1dfe9f355e1f8229ba9bf498d298'
          assert mini['all_removals_direct'] is True
          assert mini['transitive_closure_used'] is False
          closure=proof['reachable_closure']
          assert closure['complete_reachable_catalog']==15948
          assert closure['reachable_entry_count']==15948
          assert closure['reachable_entries_digest']=='1f37d96c5c16684057253ad109db9488e726bb4aed65745c966af520d13ac609'
          assert closure['reachable_stream_sha256']=='3cde1e7ef5274cdc3e94179533546263e4e0223050225560860adeb7e3a28483'
          assert closure['all_entries_have_direct_witness'] is True
          assert closure['global_compact_universe_enumerated'] is False
          assert closure['global_universe_entries_enumerated']==0
          assert proof['idempotence']['proved'] is True
          strict=proof['strict_boundary']
          assert strict['node8_parent_up_k_complete'] is True
          assert strict['node8_integrated_into_bottom_up_executor'] is False
          assert strict['node9_parent_refinement_started'] is False
          assert strict['negative_root_reached'] is False
          assert strict['found_layout_enabled'] is False
          assert strict['no_layout_at_cap_enabled'] is False
          assert strict['p_vs_np']=='OPEN'
          assert proof['next_gate']=='C049.1_B4.6.3_NODE8_UP_K_INTEGRATION_AND_NODE9_PARENT_REFINEMENT'
          PY

      - name: Export node-8 up_k closure proof package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-node8-sixty-one-generator-up-k-closure
          path: |
            /tmp/c049-node8-frontier.json
            /tmp/c049-node8-up-k-original.json
          retention-days: 1
