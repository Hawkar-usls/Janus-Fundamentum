name: Validate C049.1 B4.6.4 actual-engine composition authority closure

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier.py'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_SPEC_V1.json'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_AUTHORITY_HARDENING_V1.json'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_AUTHORITY_GAP_LEDGER_V1.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_TRACE_PREFLIGHT_INDEPENDENT_AUDIT_1914CA89.json'
      - 'experiments/direct/audits/C049_1_B4_6_3_CORRECTED_NODE8_TWENTY_GENERATOR_UP_K_AUTHORITY_CLOSURE_0FCDAA16.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_REPLAY_AUDIT_A8ECC1CF.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_AUTHORITY_CLOSURE_0AB040E0.json'
      - '.github/workflows/validate-c049-1-b4-6-4-actual-engine-composition-authority-closure.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure.py'
      - 'experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier.py'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_SPEC_V1.json'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_AUTHORITY_HARDENING_V1.json'
      - 'experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_AUTHORITY_GAP_LEDGER_V1.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_TRACE_PREFLIGHT_INDEPENDENT_AUDIT_1914CA89.json'
      - 'experiments/direct/audits/C049_1_B4_6_3_CORRECTED_NODE8_TWENTY_GENERATOR_UP_K_AUTHORITY_CLOSURE_0FCDAA16.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_REPLAY_AUDIT_A8ECC1CF.json'
      - 'experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_AUTHORITY_CLOSURE_0AB040E0.json'
      - '.github/workflows/validate-c049-1-b4-6-4-actual-engine-composition-authority-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: experiments/direct
  SPEC: experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_SPEC_V1.json
  HARDENING: experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_COMPOSITION_AUTHORITY_HARDENING_V1.json
  LEDGER: experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_AUTHORITY_GAP_LEDGER_V1.json
  PREFLIGHT_AUDIT: experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_TRACE_PREFLIGHT_INDEPENDENT_AUDIT_1914CA89.json
  NODE8_AUDIT: experiments/direct/audits/C049_1_B4_6_3_CORRECTED_NODE8_TWENTY_GENERATOR_UP_K_AUTHORITY_CLOSURE_0FCDAA16.json
  Q80_AUDIT: experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_REPLAY_AUDIT_A8ECC1CF.json
  Q80_AUTHORITY: experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_AUTHORITY_CLOSURE_0AB040E0.json
  PRODUCER: experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure.py
  VERIFIER: experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier.py
  CORRECTED_JOIN: experiments/direct/janus_c049_1_b3_join_path_domain_corrected.py
  NODE6: experiments/direct/janus_c049_1_b4_6_3_corrected_replay_first_internal_join.py
  NODE7: experiments/direct/janus_c049_1_b4_6_3_corrected_node7_parent_frontier_compression.py
  NODE8_MANIFEST: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_INTEGRATION_NODE8_PARENT_REFINEMENT.manifest.json
  SCALAR: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_SCALAR_SYMBOLIC_AUTOMATON_SPEC_V1_2.json
  RESIDUAL: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_COMPACT_FRONTIER_SPEC_V1.json
  NODE9_UPK: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json
  ROOT: experiments/direct/C049_1_B4_6_3_CORRECTED_ROOT_FULL_REFINEMENT_SPEC_V1.json
  ROOT_EMPTY: experiments/direct/C049_1_B4_6_3_CORRECTED_ROOT_EMPTY_UP_K_SPEC_V1.json

jobs:
  actual-engine-composition-authority-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind immutable authorities, proof pair, and engine carriers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$SPEC")" = "8221d8ec7561b5d8ca11ca01d218fd60536352f6"
          test "$(git hash-object "$HARDENING")" = "560fbef764a03555d76802c21f08e8337e501f17"
          test "$(git hash-object "$LEDGER")" = "78271f98bbb5e2912ac392b6ba16ab767205c4d6"
          test "$(git hash-object "$PREFLIGHT_AUDIT")" = "b5df4741dfe481680ab2c22c971d1c5242a7ed48"
          test "$(git hash-object "$NODE8_AUDIT")" = "b04124490df9737c0799ed856fd7819b37477208"
          test "$(git hash-object "$Q80_AUDIT")" = "7004d0ede69b240d36e59ea3349453ea74b8804f"
          test "$(git hash-object "$Q80_AUTHORITY")" = "d34166085f454d4d480656cb763d68bf39c7e53a"
          test "$(git hash-object "$PRODUCER")" = "fc51a9dea4ff4fc9748c229c58e36b1c76c818f6"
          test "$(git hash-object "$VERIFIER")" = "008d5b658904e7d95a9ccc6d83be978e7e09f712"
          python -m py_compile "$PRODUCER" "$VERIFIER"
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure.py').read_text())
          v=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier.py').read_text())
          def mods(t):
              out=[]
              for n in ast.walk(t):
                  if isinstance(n,ast.Import): out.extend(a.name for a in n.names)
                  elif isinstance(n,ast.ImportFrom): out.append(n.module or '')
              return out
          assert not any(x.endswith('janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier') for x in mods(p))
          assert not any(x.endswith('janus_c049_1_b4_6_4_actual_engine_composition_authority_closure') for x in mods(v))
          q=json.load(open('experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_AUTHORITY_CLOSURE_0AB040E0.json'))
          assert q['semantic_digest']=='3438a254675753c8a886e508a085046edbc861aadd718720a0fe195352f725cf'
          assert q['audit_payload']['review_id']==4888103958
          assert q['audit_payload']['node8_authority']['final_admission_review_id']==4888054139
          assert q['audit_payload']['admission']['q80_composition_replay_complete'] is True
          assert q['audit_payload']['admission']['q80_downstream_scalar_handoff']=='ADMITTED_FOR_ACTUAL_ENGINE_COMPOSITION'
          print('CANONICAL_Q80_AUTHORITY_CLOSURE_BINDING = PASS')
          print('ACTUAL_COMPOSITION_IMPLEMENTATION_DECOUPLING = PASS')
          PY
          bind_blob(){ test "$(git rev-parse "$1:$2")" = "$(git hash-object "$2")"; }
          bind_blob ddd18da87fd6c2721deb6b729acdea0af7cf5b6e "$CORRECTED_JOIN"
          bind_blob 243b841f1a3023f0acfb3d8b1e381798f369921b "$NODE6"
          bind_blob 796ad144de65906c702e29928f683e6d53e3529c "$NODE7"
          bind_blob ee3ca0c90aff2aaca3b3f3a820dc94c2f3c94539 "$NODE8_MANIFEST"
          bind_blob 65faf26f3063e2824f907ce0ecfa9ec737b3e809 "$SCALAR"
          bind_blob 7a49fbe53b3bb7a775a35905106a5695e95579e8 "$RESIDUAL"
          bind_blob 72921dac892146493204e4529da3e3849adeb1c5 "$NODE9_UPK"
          bind_blob 93db6d068a6b5ca443acd2576710d11df27b82d8 "$ROOT"
          bind_blob 824a0eede4435584f9d2ff2f9272b7ee5dc69280 "$ROOT_EMPTY"

      - name: Build composition candidate under three ledger traversal orders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, random
          from pathlib import Path
          x=json.load(open('experiments/direct/C049_1_B4_6_4_GENERAL_STRUCTURAL_INDUCTION_AUTHORITY_GAP_LEDGER_V1.json'))
          def save(y,p): Path(p).write_text(json.dumps(y,sort_keys=True,separators=(',',':'))+'\n')
          save(x,'/tmp/ledger-ORIGINAL.json')
          y=json.loads(json.dumps(x)); y['entries']=list(reversed(y['entries'])); save(y,'/tmp/ledger-REVERSED.json')
          z=json.loads(json.dumps(x)); random.Random(0xC049164C).shuffle(z['entries']); save(z,'/tmp/ledger-SEEDED_SHUFFLE.json')
          PY
          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$PRODUCER" \
              --spec "$SPEC" --hardening "$HARDENING" --ledger "/tmp/ledger-$mode.json" \
              --preflight-audit "$PREFLIGHT_AUDIT" --node8-audit "$NODE8_AUDIT" --q80-audit "$Q80_AUDIT" \
              --corrected-join "$CORRECTED_JOIN" --node6-source "$NODE6" --node7-source "$NODE7" \
              --node8-manifest "$NODE8_MANIFEST" --scalar-spec "$SCALAR" --residual-spec "$RESIDUAL" \
              --node9-upk-spec "$NODE9_UPK" --root-spec "$ROOT" --root-empty-spec "$ROOT_EMPTY" \
              --output "/tmp/composition-$mode.json" | tee "/tmp/producer-$mode.log"
          done
          cmp /tmp/composition-ORIGINAL.json /tmp/composition-REVERSED.json
          cmp /tmp/composition-ORIGINAL.json /tmp/composition-SEEDED_SHUFFLE.json
          echo 'ACTUAL_COMPOSITION_THREE_MODE_BYTE_IDENTITY = PASS'

      - name: Independently verify authority DAG, actual trace, and repaired tampers
        shell: bash
        run: |
          set -euo pipefail
          python "$VERIFIER" \
            --spec "$SPEC" --hardening "$HARDENING" --ledger "$LEDGER" \
            --preflight-audit "$PREFLIGHT_AUDIT" --node8-audit "$NODE8_AUDIT" --q80-audit "$Q80_AUDIT" \
            --corrected-join "$CORRECTED_JOIN" --node6-source "$NODE6" --node7-source "$NODE7" \
            --node8-manifest "$NODE8_MANIFEST" --scalar-spec "$SCALAR" --residual-spec "$RESIDUAL" \
            --node9-upk-spec "$NODE9_UPK" --root-spec "$ROOT" --root-empty-spec "$ROOT_EMPTY" \
            --candidate /tmp/composition-ORIGINAL.json --tamper-suite | tee /tmp/verifier.log
          grep -F 'JANUS_ACTUAL_ENGINE_COMPOSITION_AUTHORITY_CLOSURE_INDEPENDENT_VERIFIER = PASS' /tmp/verifier.log
          grep -F 'INVARIANTS = 18/18' /tmp/verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 18/18' /tmp/verifier.log
          grep -F 'GF2_CALLER_PREMISE_NODES = 5/5' /tmp/verifier.log
          grep -F 'ALL_STAGE_AUTHORITY_EDGES_CLOSED = TRUE' /tmp/verifier.log
          grep -F 'Q80_PARTITION_FINE_LANGUAGE_CONSERVATION = PASS' /tmp/verifier.log
          grep -F 'Q80_SCALAR_HANDOFF_IDENTITY = PASS' /tmp/verifier.log
          grep -F 'POSITIVE_NONVACUITY_CONTROL = PASS' /tmp/verifier.log
          grep -F 'ROOT_EMPTY_CONSUMED_AS_COMPOSITION_PREMISE = FALSE' /tmp/verifier.log
          grep -F 'ENGINE_ROOT_FULL_SET_EQUALS_FS_K_V_ZERO_CANDIDATE = TRUE' /tmp/verifier.log
          grep -F 'FORMAL_ADMISSION = BLOCKED_PENDING_REVIEW' /tmp/verifier.log

      - name: Enforce review-only promotion ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          x=json.load(open('/tmp/composition-ORIGINAL.json')); p=x['proof_payload']; c=p['composition']; b=p['strict_boundary']
          assert hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()==x['semantic_digest']
          assert c['actual_trace_satisfies_complete_algorithm1_contract_candidate'] is True
          assert c['candidate_derives_engine_root_full_set_equals_fs_k_v_zero'] is True
          assert c['root_empty_consumed_as_composition_premise'] is False
          assert c['zero_root_successes_consumed_as_composition_premise'] is False
          assert c['historical_counts_consumed_as_acceptance_oracles'] is False
          assert b['composition_candidate_ready_for_reviewer_admission'] is True
          assert b['actual_corrected_engine_complete_algorithm1_trace_established'] is False
          assert b['engine_root_full_set_equals_fs_k_v_zero'] is False
          assert b['structural_induction_proved'] is False
          assert b['terminal_completeness_proved'] is False
          assert b['no_layout_at_cap']=='FORBIDDEN' and b['found_layout']=='FORBIDDEN'
          assert b['formal_admission']=='BLOCKED' and b['p_vs_np']=='OPEN'
          print('ACTUAL_COMPOSITION_REVIEW_ONLY_PROMOTION_CEILING = PASS')
          PY

      - name: Freeze exact-head composition candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then PROOF_HEAD="${{ github.event.pull_request.head.sha }}"; else PROOF_HEAD="$GITHUB_SHA"; fi
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "PROOF_HEAD=$PROOF_HEAD"
            echo "SPEC_BLOB=$(git hash-object "$SPEC")"
            echo "HARDENING_BLOB=$(git hash-object "$HARDENING")"
            echo "LEDGER_BLOB=$(git hash-object "$LEDGER")"
            echo "PREFLIGHT_AUDIT_BLOB=$(git hash-object "$PREFLIGHT_AUDIT")"
            echo "NODE8_AUDIT_BLOB=$(git hash-object "$NODE8_AUDIT")"
            echo "Q80_AUDIT_BLOB=$(git hash-object "$Q80_AUDIT")"
            echo "Q80_AUTHORITY_BLOB=$(git hash-object "$Q80_AUTHORITY")"
            echo "PRODUCER_BLOB=$(git hash-object "$PRODUCER")"
            echo "VERIFIER_BLOB=$(git hash-object "$VERIFIER")"
            echo "CANDIDATE_SHA256=$(sha256sum /tmp/composition-ORIGINAL.json | cut -d' ' -f1)"
            echo "CANDIDATE_SEMANTIC_DIGEST=$(python -c 'import json; print(json.load(open("/tmp/composition-ORIGINAL.json"))["semantic_digest"])')"
            echo 'THREE_MODE_BYTE_IDENTITY=PASS'
            echo 'INVARIANTS=18/18'
            echo 'DIGEST_REPAIRED_TAMPERS_REJECTED=18/18'
            echo 'CANONICAL_Q80_AUTHORITY_REVIEW=4888103958'
            echo 'ALL_STAGE_AUTHORITY_EDGES_CLOSED=TRUE'
            echo 'ACTUAL_TRACE_COMPLETE_CANDIDATE=TRUE'
            echo 'ENGINE_ROOT_FULL_SET_EQUALS_FS_K_V_ZERO_CANDIDATE=TRUE'
            echo 'ROOT_EMPTY_CONSUMED_AS_COMPOSITION_PREMISE=FALSE'
            echo 'FORMAL_ADMISSION=BLOCKED_PENDING_REVIEW'
            echo 'TERMINAL_COMPLETENESS_PROVED=FALSE'
            echo 'NO_LAYOUT_AT_CAP=FORBIDDEN'
            echo 'P_VS_NP=OPEN'
          } | tee /tmp/exact-head-receipt.txt

      - name: Export actual-engine composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-4-actual-engine-composition-authority-closure
          retention-days: 7
          compression-level: 9
          path: |
            /tmp/composition-ORIGINAL.json
            /tmp/composition-REVERSED.json
            /tmp/composition-SEEDED_SHUFFLE.json
            /tmp/producer-ORIGINAL.log
            /tmp/producer-REVERSED.log
            /tmp/producer-SEEDED_SHUFFLE.log
            /tmp/verifier.log
            /tmp/exact-head-receipt.txt
            experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure.py
            experiments/direct/janus_c049_1_b4_6_4_actual_engine_composition_authority_closure_verifier.py
            experiments/direct/audits/C049_1_B4_6_4_ACTUAL_ENGINE_Q80_COMPOSITION_AUTHORITY_CLOSURE_0AB040E0.json
