name: TRUMP sync v3.7 context
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trump-sync-v3-7-context.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch bootstrap and manifest without truncating history
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          p=Path('START_HERE_TRUMP_CONTEXT.md')
          s=p.read_text(encoding='utf-8')
          old="1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.6.json` **first**. This is the latest successor-state anchor and seals the scoped unique-core residual-component-<=2 factorized-payload PASS: residual singleton components are direct, two-relation residual components use exactly one natural join, and residual components of size 3+ remain OPEN."
          new="1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json` **first**. This is the latest successor-state anchor and records the diagnostic-only residual-3+ forensic PASS: the first real GT2 residual component is a K3 over `orig:4/5/6`, every overlap is exactly variable `47`, relation articulations are empty, variable articulation is `[47]`, running-intersection passes, and semijoin reaches the unchanged `[4,4,4]` fixed point.\n1. Then read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.6.json` for the sealed residual-component-<=2 factorized-payload PASS."
          if old not in s: raise SystemExit('startup anchor not found')
          s=s.replace(old,new,1)
          pattern=r"Current scoped open surface:\n\n.*?(?=## Context sources)"
          replacement="""Current scoped open surface:\n\n`UNIQUE_COMMON_CORE_CONDITIONED_RESIDUAL_GT2_WITH_RAW_DERIVED_SINGLE_VARIABLE_ARTICULATION_OR_NO_SUCH_SEPARATOR__PLUS_MULTIPLE_COMMON_CORE_STATES`.\n\nThe v3.7 forensic is diagnostic only, not a theorem promotion. It establishes for the first frozen GT2 control that factors `orig:4/5/6` form K3, every pair overlaps only on residual variable `47`, there is no relation articulation, `47` is the unique variable articulation, running-intersection passes, each pair has 8 compatible of 16 row pairs, and pairwise semijoin does not shrink `[4,4,4]`. No 3+ join chain was materialized.\n\nCaptain's nearest blocker is therefore no longer generic `RESIDUAL_COMPONENT_GT2`; it is **exact conditioning on a raw-derived single Boolean residual articulation variable, followed by reuse of sealed residual <=2 carriers**. `OPEN_NONUNIQUE_COMMON_CORE_SUPPORT` remains a separate secondary blocker.\n\nThe next preferred gate is:\n\n`TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_FALSIFIER_GATE`.\n\nCaptain Obvious' directive: **do not generalize to a 3-factor join**. Discover the separator from the raw residual overlap graph, branch exactly on `0/1`, recompute each branch dependency graph, and admit only if every branch reduces to sealed <=2 component carriers. If there is no single-variable articulation or a branch remains GT2, return OPEN.\n\nForbidden shortcuts include trusted separator labels, 3+ join chains, global residual Cartesian products, budget raises, alternative-order search, treating multiple common-core states as solved, or generalizing this diagnostic K3 pattern to arbitrary partial-overlap components.\n\n"""
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'current surface replacement count={n}')
          p.write_text(s2,encoding='utf-8')

          mpath=Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['latest_successor_state']='registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json'
          m['current_scoped_open_surface']={
            'name':'UNIQUE_COMMON_CORE_CONDITIONED_RESIDUAL_GT2_WITH_RAW_DERIVED_SINGLE_VARIABLE_ARTICULATION_OR_NO_SUCH_SEPARATOR__PLUS_MULTIPLE_COMMON_CORE_STATES',
            'nearest_blocker':'RAW_DERIVED_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_TO_TWO_EXACT_BRANCH_PORTFOLIOS',
            'secondary_blocker':'OPEN_NONUNIQUE_COMMON_CORE_SUPPORT',
            'next_gate_candidate':'TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_SINGLE_VARIABLE_SEPARATOR_FACTORIZED_PAYLOAD_FALSIFIER_GATE',
            'next_gate_class':'SCOPED_EXACT_SUCCESSOR_AFTER_DIAGNOSTIC_V3_7',
            'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json'
          }
          mechs=m.setdefault('mechanisms',{})
          mechs['BICAMERAL_RESIDUAL_3PLUS_STRUCTURE_FORENSIC']={
            'aliases':['Residual 3plus forensic','TRUMP_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_3PLUS_STRUCTURE_FORENSIC'],
            'role':'Diagnostic-only exact structural profile of the first residual component >2 after unique-core conditioning; no solver authority.',
            'classification':'DIAGNOSTIC_ONLY',
            'fundamentum_binding':{
              'preregistration_commit':'fbf7a2caa5fce54465782415bd0520907ce05494',
              'profiler_commit':'b443d9888c6d66cfed7c976ab94c0682dbd1ecb0',
              'independent_checker_commit':'cbd2a528b0a1965fd7ee12cde6b552f94d4c1073',
              'actions_run':34982303998,
              'actions_job':104425422440,
              'result_commit':'6490129c78ea8635aefd99176ada300c3cd28867',
              'journal_commit':'abc189361520d682e3fc53a6b7310a0428918a14',
              'merge_commit':'a144087ccf3d42f56833622e8a3a3cd34a28e0cb',
              'verdict':'PASS_DIAGNOSTIC_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_3PLUS_STRUCTURE_FORENSIC',
              'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.7.json'
            },
            'receipt':{'target_factors':['orig:4','orig:5','orig:6'],'overlap_graph':'K3','shared_overlap_variable':47,'relation_articulations':[],'variable_articulations':[47],'running_intersection':True,'semijoin_fixed_point':[4,4,4]},
            'firewall':'DIAGNOSTIC_PATTERN_IS_NOT_GENERAL_PARTIAL_OVERLAP_TRACTABILITY'
          }
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          Path('.github/workflows/trump-sync-v3-7-context.yml').unlink()
          PY
          git config user.name 'janus-trump-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add START_HERE_TRUMP_CONTEXT.md registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/trump-sync-v3-7-context.yml
          git commit -m 'TRUMP sync v3.7 bootstrap and context manifest'
          git push origin HEAD:main
