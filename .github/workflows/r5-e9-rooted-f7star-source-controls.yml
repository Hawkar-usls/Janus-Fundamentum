name: R5 E9 Rooted F7star source controls

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_ROOTED_F7STAR_SOURCE_CONTROLS_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rooted_f7star_source_controls.py'
      - '.github/workflows/r5-e9-rooted-f7star-source-controls.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_rooted_f7star_source_controls.py
      - name: Replay exact finite controls
        run: python experiments/r5_e9_rooted_f7star_source_controls.py
