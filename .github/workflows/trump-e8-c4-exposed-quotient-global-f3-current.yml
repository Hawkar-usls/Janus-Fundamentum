name: TRUMP E8 C4 Exposed Quotient Global F3 Current

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_exposed_quotient_global_fourier_current/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_EXPOSED_QUOTIENT_GLOBAL_F3_CURRENT_2026-10-01_v8.5.2.json'
      - '.github/workflows/trump-e8-c4-exposed-quotient-global-f3-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-global-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact quotient and Fourier-current checker
        run: python3 research/tools/e8_c4_exposed_quotient_global_fourier_current/checker.py
