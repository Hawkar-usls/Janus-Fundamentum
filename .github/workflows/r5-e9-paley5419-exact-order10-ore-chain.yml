name: R5 E9 Paley5419 exact minimum balanced 4-critical order10

on:
  pull_request:
    paths:
      - "research/R5_E9_PALEY5419_EXACT_MINIMUM_BALANCED_4CRITICAL_ORDER10_ORE_CHAIN_2026-10-01_v1.0.md"
      - "research/R5_E9_PALEY5419_BALANCED_4CRITICAL_ORDER_GT9_FALSIFIER_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley5419_exact_minimum_balanced_4critical_order10.py"
      - "experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py"
      - ".github/workflows/r5-e9-paley5419-exact-order10-ore-chain.yml"
  push:
    paths:
      - "research/R5_E9_PALEY5419_EXACT_MINIMUM_BALANCED_4CRITICAL_ORDER10_ORE_CHAIN_2026-10-01_v1.0.md"
      - "experiments/r5_e9_paley5419_exact_minimum_balanced_4critical_order10.py"
      - ".github/workflows/r5-e9-paley5419-exact-order10-ore-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-minimum-order10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reprove lower bound greater than 9
        run: python experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py
      - name: Verify order-10 witness and Ore decomposition
        run: python experiments/r5_e9_paley5419_exact_minimum_balanced_4critical_order10.py
