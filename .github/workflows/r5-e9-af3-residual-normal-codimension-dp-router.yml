name: R5 E9 AF3 Residual Normal Codimension DP Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_RESIDUAL_NORMAL_CODIMENSION_DP_ROUTER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_residual_normal_codimension_dp_router.py'
      - '.github/workflows/r5-e9-af3-residual-normal-codimension-dp-router.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run residual-normal codimension DP regression
        run: python experiments/r5_e9_af3_residual_normal_codimension_dp_router.py
