name: R5 All SCL Pinned Signed Loop Witness Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_pinned_loop_witness_extraction_gate.py'
      - '.github/workflows/r5-pinned-loop-witness-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditioned-extract:
    name: Original-source pinned-loop exactness and n+1 conditional search-to-decision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay all 16 local pinned moments and finite E61/Fano signed loops
        run: python -u experiments/r5_universal_pinned_loop_witness_extraction_gate.py
