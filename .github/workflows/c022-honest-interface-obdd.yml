name: C022 Honest Interface OBDD

on:
  push:
    paths:
      - "experiments/direct/janus_honest_interface_obdd.py"
      - "proposals/C022-JANUS-HONEST-INTERFACE-OBDD.json"
      - "docs/C022_JANUS_HONEST_INTERFACE_OBDD.md"
      - ".github/workflows/c022-honest-interface-obdd.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_honest_interface_obdd.py"
      - "proposals/C022-JANUS-HONEST-INTERFACE-OBDD.json"
      - "docs/C022_JANUS_HONEST_INTERFACE_OBDD.md"
      - ".github/workflows/c022-honest-interface-obdd.yml"

permissions:
  contents: read

jobs:
  honest-interface-obdd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and attack proof-carrying interface OBDDs
        run: python experiments/direct/janus_honest_interface_obdd.py
