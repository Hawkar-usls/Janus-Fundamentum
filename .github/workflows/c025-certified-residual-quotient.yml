name: C025 Certified Residual Quotient

on:
  push:
    paths:
      - "experiments/direct/janus_certified_residual_quotient.py"
      - "experiments/direct/janus_c025_core.py"
      - "experiments/direct/janus_c025_families.py"
      - "proposals/C025-JANUS-CERTIFIED-RESIDUAL-QUOTIENT.json"
      - "docs/C025_JANUS_CERTIFIED_RESIDUAL_QUOTIENT.md"
      - ".github/workflows/c025-certified-residual-quotient.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_certified_residual_quotient.py"
      - "experiments/direct/janus_c025_core.py"
      - "experiments/direct/janus_c025_families.py"
      - "proposals/C025-JANUS-CERTIFIED-RESIDUAL-QUOTIENT.json"
      - "docs/C025_JANUS_CERTIFIED_RESIDUAL_QUOTIENT.md"
      - ".github/workflows/c025-certified-residual-quotient.yml"

permissions:
  contents: read

jobs:
  certified-residual-quotient:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run certified residual quotient audit
        run: python experiments/direct/janus_certified_residual_quotient.py --self-test
