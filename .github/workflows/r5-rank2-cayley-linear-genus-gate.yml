name: R5 Rank Two Quartic Cayley Linear Genus Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_rank2_cayley_linear_genus_obstruction.py'
      - '.github/workflows/r5-rank2-cayley-linear-genus-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cayley-genus:
    name: Original source group Cayley quotient girth and linear orientable genus proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all reduced short relations, group SCL legality, quotient and genus lower bound
        run: python -u experiments/r5_universal_rank2_cayley_linear_genus_obstruction.py
