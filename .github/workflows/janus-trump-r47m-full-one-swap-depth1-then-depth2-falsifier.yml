name: JANUS TRUMP R47M Full One Swap Depth1 Then Depth2 Falsifier

on:
  push:
    branches:
      - research/r47m-full-one-swap-depth1-then-depth2-falsifier-2026-09-03

jobs:
  r47m-full-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration
        run: |
          python - <<'PY'
          import json, subprocess
          parent='9df9cdd1f3f2fe32614d8f9bd5112c00bcc4d240'
          subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'], check=True)
          d=json.load(open('research/JANUS_TRUMP_R47M_FULL_ONE_SWAP_DEPTH1_THEN_DEPTH2_FALSIFIER_PREREGISTRATION_2026-09-03.json'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['parent']['commit']==parent
          assert d['sealed_inherited_prefix']['continuation_starts_at_frontier_ordinal']==56
          assert d['sealed_inherited_prefix']['position_55']['depth2_first_accepted_pair']==[11,20]
          assert d['depth2_authority']['fixed_depth']==2
          assert d['epistemic_firewall']['O4_UNIVERSAL_COVERAGE_FOR_FIXED_DEPTH2_GRAMMAR']=='OPEN'
          assert d['epistemic_firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['epistemic_firewall']['P_VS_NP']=='OPEN'
          assert d['epistemic_firewall']['TRUMP_finished'] is False
          PY
      - name: Compile
        run: python -m py_compile experiments/janus_trump_r47m_full_one_swap_depth1_then_depth2_falsifier.py
      - name: Execute inherited-prefix plus continuation falsifier
        run: |
          PYTHONPATH=experiments python experiments/janus_trump_r47m_full_one_swap_depth1_then_depth2_falsifier.py | tee /tmp/r47m.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r47m.json'))
          assert d['gate']=='JANUS_TRUMP_R47M_FULL_ONE_SWAP_DEPTH1_THEN_DEPTH2_FALSIFIER'
          assert d['verdict'] in {
              'EXPLICIT_REACHABLE_COUNTEREXAMPLE_TO_FIXED_DEPTH2_GRAMMAR_FOUND',
              'FULL_FROZEN_ONE_SWAP_FRONTIER_COVERED_BY_DEPTH1_OR_DEPTH2__O4_STILL_OPEN',
          }
          o55=d['inherited_integrity']['ordinal55']
          assert o55['residual_hash']=='9a84c02f1570e752ac0c017037b8a4a40c2599b53faf51bcd6d957f40aa81dde'
          assert o55['depth1_covered'] is False
          assert o55['depth2_selected_pair']==[11,20]
          assert d['metrics']['inherited_prefix_positions_1_54']==54
          assert d['metrics']['ordinal55_depth2_regression_covered'] is True
          assert d['firewall']['O4_UNIVERSAL_COVERAGE_FOR_FIXED_DEPTH2_GRAMMAR']=='OPEN'
          assert d['firewall']['UNBOUNDED_DEPTH_POLYNOMIAL']=='NOT_PROVED'
          assert d['firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['firewall']['P_VS_NP']=='OPEN'
          if d['first_counterexample'] is not None:
              c=d['first_counterexample']
              assert d['metrics']['continuation_depth2_dead']>=1
              assert c['all_depth2_failed_pairs']
              assert not any(x['accepted'] for x in c['all_depth2_failed_pairs'])
              assert c['mutated_original_formula'] and c['fixpoint_formula']
          print('R47M_GATE=PASS')
          print('R47M_VERDICT=',d['verdict'])
          print('R47M_METRICS=',json.dumps(d['metrics'],sort_keys=True))
          if d['first_counterexample'] is not None:
              print('R47M_COUNTEREXAMPLE=',json.dumps(d['first_counterexample'],sort_keys=True))
          else:
              print('R47M_HARDEST_DEPTH2_RESCUE=',json.dumps(d['hardest_depth2_rescue_if_no_counterexample'],sort_keys=True))
          PY
