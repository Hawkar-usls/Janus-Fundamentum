name: C023 Boolean Polymorphism Gate

on:
  push:
    paths:
      - "experiments/direct/janus_c023_primitives.py"
      - "experiments/direct/janus_c023_affine.py"
      - "experiments/direct/janus_c023_basis.py"
      - "experiments/direct/janus_c023_polymorphism_core.py"
      - "experiments/direct/janus_c023_polymorphism_dispatch.py"
      - "experiments/direct/janus_c023_polymorphism_fixtures.py"
      - "experiments/direct/janus_c023_polymorphism_gate.py"
      - "proposals/C023-JANUS-BOOLEAN-POLYMORPHISM-GATE.json"
      - "docs/C023_JANUS_BOOLEAN_POLYMORPHISM_GATE.md"
      - ".github/workflows/c023-polymorphism-gate.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c023_primitives.py"
      - "experiments/direct/janus_c023_affine.py"
      - "experiments/direct/janus_c023_basis.py"
      - "experiments/direct/janus_c023_polymorphism_core.py"
      - "experiments/direct/janus_c023_polymorphism_dispatch.py"
      - "experiments/direct/janus_c023_polymorphism_fixtures.py"
      - "experiments/direct/janus_c023_polymorphism_gate.py"
      - "proposals/C023-JANUS-BOOLEAN-POLYMORPHISM-GATE.json"
      - "docs/C023_JANUS_BOOLEAN_POLYMORPHISM_GATE.md"
      - ".github/workflows/c023-polymorphism-gate.yml"

permissions:
  contents: read

jobs:
  polymorphism-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Boolean polymorphism gate
        run: python experiments/direct/janus_c023_polymorphism_gate.py --self-test
