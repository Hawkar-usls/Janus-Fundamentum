name: R5 E9 Projective fractional-support exact closure

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_PROJECTIVE_FRACTIONAL_SUPPORT_EXACT_CLOSURE_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_projective_fractional_support_exact_closure.py'
      - '.github/workflows/r5-e9-projective-fractional-support-exact-closure.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_projective_fractional_support_exact_closure.py
      - name: Replay exact frozen controls
        run: python experiments/r5_e9_projective_fractional_support_exact_closure.py
