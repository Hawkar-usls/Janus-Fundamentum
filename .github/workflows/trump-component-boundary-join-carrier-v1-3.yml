name: TRUMP Component Boundary Join Carrier v1.3

on:
  push:
    branches:
      - research/trump-component-boundary-join-carrier-v1-3-2026-09-15
  workflow_dispatch:

jobs:
  component-boundary-join-carrier-v1-3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.3 independent checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_component_join_carrier.independent_checker_v1_3 | tee /tmp/component-join-v13.json
      - name: Assert v1.3 scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/component-join-v13.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_OVERWIDTH_COMPONENT_JOIN_TREE_BOUNDARY_CARRIER_V1_3', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN'
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO'
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED'
          assert sf['GENERAL_MULTI_RELATION_BOUNDARY_COMPRESSION']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY
      - name: Parent canonical mincut v1.1 regression
        run: python -m research.tools.apma_bicameral_mincut.independent_checker_v1_1
      - name: Parent cut-support carrier v1.1 regression
        run: python -m research.tools.apma_cut_support_carrier.independent_checker_v1_1
      - name: Exact interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker
      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker
      - name: Authority notice
        run: |
          echo 'V1_FAILURE_PRESERVED'
          echo 'V1_1_DIAGNOSTIC_PRESERVED'
          echo 'V1_2_CONTROL_FAILURE_PRESERVED'
          echo 'RAW_2_TO_K_ENUMERATION=0'
          echo 'FULL_JOIN_MATERIALIZATION=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
