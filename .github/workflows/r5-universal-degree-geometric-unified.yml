name: R5 Universal Degree Theorem Geometry Unified Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_geometric_cover_degree3_stress.py'
      - 'research/R5_GF3_UNIVERSAL_DEGREE_THEOREM_GEOMETRIC_STRESS_AND_COMPLEXITY_GATE_2026-10-13.md'
      - '.github/workflows/r5-universal-degree-geometric-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometric-degree:
    name: Native SCL15 symplectic and SCL30 SCL45 source cubic certificates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source girth at least8, cyclic cover witnesses, and two independently checked degree3 UNSAT identities
        run: python -u experiments/r5_universal_gf3_geometric_cover_degree3_stress.py
