name: Validate C024 Double Bridge Local Creation

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_local_creation.py"
      - "experiments/direct/janus_tear_gt_double_bridge_local_creation_v2.py"
      - ".github/workflows/validate-c024-double-bridge-local-creation.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_double_bridge_local_creation.py"
      - "experiments/direct/janus_tear_gt_double_bridge_local_creation_v2.py"
      - ".github/workflows/validate-c024-double-bridge-local-creation.yml"

permissions:
  contents: read

jobs:
  double-bridge-local-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify raw post-output and local double-bridge creation
        run: python experiments/direct/janus_tear_gt_double_bridge_local_creation_v2.py
