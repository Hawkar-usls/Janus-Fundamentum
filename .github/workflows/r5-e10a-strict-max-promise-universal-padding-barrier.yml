name: R5 E10A Strict-Max Promise Universal Padding Barrier

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E10A_GF2_SQUARED_STRICT_MAX_PROMISE_UNIVERSAL_PADDING_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e10a_strict_max_promise_universal_padding_barrier.py'
      - '.github/workflows/r5-e10a-strict-max-promise-universal-padding-barrier.yml'
  pull_request:
    paths:
      - 'research/R5_E10A_GF2_SQUARED_STRICT_MAX_PROMISE_UNIVERSAL_PADDING_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e10a_strict_max_promise_universal_padding_barrier.py'
      - '.github/workflows/r5-e10a-strict-max-promise-universal-padding-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact strict-max padding barrier checker
        run: python experiments/r5_e10a_strict_max_promise_universal_padding_barrier.py
