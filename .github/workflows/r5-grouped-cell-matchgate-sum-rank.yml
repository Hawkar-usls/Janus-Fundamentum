name: R5 Grouped Cell Exact Matchgate SUM Compression
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_grouped_cell_matchgate_sum_rank.py'
      - '.github/workflows/r5-grouped-cell-matchgate-sum-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matchgate-sum:
    name: Certified two and four node exact matchgate sum ranks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct original Holant cells and replay every quadratic MGI
        run: python -u experiments/r5_universal_grouped_cell_matchgate_sum_rank.py
