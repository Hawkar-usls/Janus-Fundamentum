name: TRUMP E8 edge-dependent EQ3 OR3 matchgate gauge barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_EDGE_DEPENDENT_EQ3_OR3_MATCHGATE_GAUGE_BARRIER_2026-09-30_v2.7.json'
      - 'research/tools/e8_edge_dependent_eq3_or3_matchgate_gauge_barrier/checker.py'
      - '.github/workflows/trump-e8-edge-dependent-eq3-or3-matchgate-gauge-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact edge-dependent gauge regression
        run: python research/tools/e8_edge_dependent_eq3_or3_matchgate_gauge_barrier/checker.py
