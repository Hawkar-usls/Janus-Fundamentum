name: TRUMP E8 full-nonzero syndrome hash barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_FULL_NONZERO_SYNDROME_HASH_BARRIER_2026-09-26_v1.9.json'
      - 'research/tools/e8_full_nonzero_syndrome_hash_barrier/checker.py'
      - '.github/workflows/trump-e8-full-nonzero-syndrome-hash-barrier.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exhaustive replay
        run: python research/tools/e8_full_nonzero_syndrome_hash_barrier/checker.py
