name: C021-C022 Cognitive Portfolio Search

on:
  push:
    paths:
      - "experiments/direct/janus_cognitive_portfolio_search.py"
      - "experiments/direct/janus_definitional_circuit_unmasking.py"
      - "proposals/C021-JANUS-COGNITIVE-PORTFOLIO-SEARCH.json"
      - "proposals/C022-JANUS-DEFINITIONAL-CIRCUIT-UNMASKING.json"
      - "docs/C021_JANUS_COGNITIVE_PORTFOLIO_SEARCH.md"
      - "docs/C022_JANUS_DEFINITIONAL_CIRCUIT_UNMASKING.md"
      - ".github/workflows/c021-cognitive-portfolio.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_cognitive_portfolio_search.py"
      - "experiments/direct/janus_definitional_circuit_unmasking.py"
      - "proposals/C021-JANUS-COGNITIVE-PORTFOLIO-SEARCH.json"
      - "proposals/C022-JANUS-DEFINITIONAL-CIRCUIT-UNMASKING.json"
      - "docs/C021_JANUS_COGNITIVE_PORTFOLIO_SEARCH.md"
      - "docs/C022_JANUS_DEFINITIONAL_CIRCUIT_UNMASKING.md"
      - ".github/workflows/c021-cognitive-portfolio.yml"

permissions:
  contents: read

jobs:
  cognitive-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run typed heterogeneous portfolio search
        run: python experiments/direct/janus_cognitive_portfolio_search.py --self-test

      - name: Run definitional circuit unmasking
        run: python experiments/direct/janus_definitional_circuit_unmasking.py --self-test
