name: R5 Loop Holographic Backtransform and Pin Failure
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py'
      - '.github/workflows/r5-loop-backtransform-pin-failure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-is-gauge:
    name: Verify exact GL2 backtransform and original-source incompatible pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact local tensor gauge, ranks, pinned false first-order edge term
        run: python -u experiments/r5_universal_loop_holographic_backtransform_and_pin_obstruction.py
