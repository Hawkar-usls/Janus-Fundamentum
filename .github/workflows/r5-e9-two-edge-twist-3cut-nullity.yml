name: R5 E9 Two-Edge-Twist 3-Cut Nullity

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_TWO_EDGE_TWIST_3CUT_IRREDUCIBLE_LINEAR_NULLITY_FAMILY_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_two_edge_twist_3cut_irreducible_nullity.py'
      - '.github/workflows/r5-e9-two-edge-twist-3cut-nullity.yml'
  pull_request:
    paths:
      - 'research/R5_E9_TWO_EDGE_TWIST_3CUT_IRREDUCIBLE_LINEAR_NULLITY_FAMILY_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_two_edge_twist_3cut_irreducible_nullity.py'
      - '.github/workflows/r5-e9-two-edge-twist-3cut-nullity.yml'

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay arbitrary-n theorem controls
        run: python experiments/r5_e9_two_edge_twist_3cut_irreducible_nullity.py
