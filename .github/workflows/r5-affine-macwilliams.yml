name: R5 Affine MacWilliams Soundness
on:
  push:
    branches: [research/r5-affine-macwilliams-soundness-20261015]
    paths:
      - "experiments/r5_affine_macwilliams_soundness_20261015.py"
      - "experiments/r5_affine_macwilliams_cooperative_20261015.py"
      - "docs/r5_affine_macwilliams_checkpoint_20261015.md"
      - ".github/workflows/r5-affine-macwilliams.yml"
  pull_request:
    paths:
      - "experiments/r5_affine_macwilliams_soundness_20261015.py"
      - "experiments/r5_affine_macwilliams_cooperative_20261015.py"
      - "docs/r5_affine_macwilliams_checkpoint_20261015.md"
      - ".github/workflows/r5-affine-macwilliams.yml"
  workflow_dispatch:

jobs:
  proof-carrying-affine-mac:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact affine signed dual coset transform and LP witnesses
        run: python3 experiments/r5_affine_macwilliams_soundness_20261015.py --self-test
