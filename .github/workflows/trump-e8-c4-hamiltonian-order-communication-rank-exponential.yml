name: TRUMP E8 C4 Hamiltonian-Order Communication Rank Exponential Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_HAMILTONIAN_ORDER_COMMUNICATION_RANK_EXPONENTIAL_BARRIER_2026-10-01_v8.5.9.json'
      - 'research/tools/e8_c4_hamiltonian_order_communication_rank_exponential/checker.py'
      - '.github/workflows/trump-e8-c4-hamiltonian-order-communication-rank-exponential.yml'
  workflow_dispatch:

jobs:
  exact-communication-rank-barrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact smooth-C4 Hamiltonian-cut rank checker
        run: python3 research/tools/e8_c4_hamiltonian_order_communication_rank_exponential/checker.py
