name: JANUS TIME-SAT-004B capped public SATComp2026 pilot
on:
  push:
    branches: [research/time-sat-004b-bounded-pilot-20261101]
    paths:
      - experiments/direct/janus_time_sat_004b_*.py
      - tests/test_time_sat_004b.py
      - .github/workflows/validate-time-sat-004b.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004b-pilot
  cancel-in-progress: true
jobs:
  fetch-verify-and-raw-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline malicious DIMACS and source guard tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004b.py' -v
      - name: Enforce exact frozen preregistration Git blob
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/time_sat_004_external/PREREGISTERED_SATCOMP2026_PILOT_20261101.json)" = dc658d57453813bb306aa20f45b3385571f1fe3d
      - name: Pin strong SAT solver versions
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Bounded original GBD HTTPS transfers and strict SHA/DIMACS validation
        run: >-
          python experiments/direct/janus_time_sat_004b_acquire.py
          --out evidence/time_sat_004b
      - name: Exact source CNF raw-CDCL CaDiCaL195 and Glucose4 in memory/CPU-limited children
        run: >-
          python experiments/direct/janus_time_sat_004b_baselines.py
          --out evidence/time_sat_004b
      - name: Save scientific receipts including failures (not large input bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004b-first-public-baseline-screen
          path: |
            evidence/time_sat_004b/acquisition.json
            evidence/time_sat_004b/screen.json
          retention-days: 30
          if-no-files-found: warn
