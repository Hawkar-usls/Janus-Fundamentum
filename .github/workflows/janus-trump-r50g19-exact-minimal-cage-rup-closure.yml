name: JANUS TRUMP R50G19 Exact-Minimal Cage RUP Closure

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R50G19_EXACT_MINIMAL_CAGE_RUP_CLOSURE_OR_CLOSED_CORE_PREREGISTRATION_2026-09-05.json'
      - 'research/JANUS_TRUMP_R50G19_EXACT_MINIMAL_CAGE_RUP_CLOSURE_OR_CLOSED_CORE_PROOF_NOTE_2026-09-05.md'
      - 'experiments/janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py'
      - 'tests/test_janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py'
      - '.github/workflows/janus-trump-r50g19-exact-minimal-cage-rup-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-or-counterexample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze R50G19 contract
        run: |
          python - <<'PY'
          import json
          p='research/JANUS_TRUMP_R50G19_EXACT_MINIMAL_CAGE_RUP_CLOSURE_OR_CLOSED_CORE_PREREGISTRATION_2026-09-05.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['proof_or_counterexample'] is True
          assert d['execution']['source_definition_reduction'] is True
          assert d['firewall']['PROPER_CLOSED_CORE_IMPOSSIBLE'] is False
          PY

      - name: Static no-heuristic authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py').read_text()
          for x in ['random.choice(', 'random.shuffle(', 'random.random(', 'sklearn', 'torch', 'tensorflow', 'heuristic_score', 'learned_selector']:
              assert x not in p, x
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile experiments/janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py
          PYTHONPATH=.:experiments pytest -q tests/test_janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py

      - name: Execute exact closure dichotomy and independent RUP control
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments python experiments/janus_trump_r50g19_exact_minimal_cage_rup_closure_or_closed_core.py \
            --output artifacts/JANUS_TRUMP_R50G19_RESULT.json

      - name: Validate epistemic boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R50G19_RESULT.json'))
          fw=d['firewall']
          assert d['r50g18_full_cage_control']['outcome'] == 'FULL_RUP_CLOSURE_WITNESS'
          assert d['r50g18_full_cage_control']['certificate']['independent_UP_replay'] is True
          assert fw['FULL_CLOSURE_ON_R50G18_IMPLIES_ALL_EXACT_MINIMAL_CAGES_RUP_REDUCIBLE'] is False
          assert fw['PROPER_CLOSED_CORE_IMPOSSIBLE'] is False
          assert fw['RUP_BEARING_V7_HUB_CYCLE_ELIMINATED'] is False
          assert fw['V7_IMMEDIATE_BVE_CASE_ELIMINATED'] is False
          assert fw['U_MU']=='OPEN'
          assert fw['SAT_IN_P']=='NOT_PROVED'
          assert fw['P_VS_NP']=='OPEN'
          assert fw['TRUMP_finished'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g19-result
          path: artifacts/JANUS_TRUMP_R50G19_RESULT.json
          if-no-files-found: error
