name: R5 E9 Boben local bond dimension

on:
  push:
    paths:
      - 'research/R5_E9_BOBEN_LOCAL_BOND_DIMENSION_BARRIER_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_local_bond_dimension.py'
      - '.github/workflows/r5-e9-boben-local-bond-dimension.yml'
  pull_request:
    paths:
      - 'research/R5_E9_BOBEN_LOCAL_BOND_DIMENSION_BARRIER_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_boben_local_bond_dimension.py'
      - '.github/workflows/r5-e9-boben-local-bond-dimension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify local semantic state lower bound
        run: python experiments/r5_e9_boben_local_bond_dimension.py
