name: TRUMP Bucket Unique-Core Residual No-Pair Forensic
on:
  push:
    branches:
      - research/trump-bucket-unique-core-residual-no-pair-forensic-2026-09-15
permissions:
  contents: read
jobs:
  no-pair-forensic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent no-pair forensic checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_residual_no_pair_forensic.independent_checker | tee /tmp/result.json
      - name: Assert diagnostic verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/result.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_DIAGNOSTIC_BICAMERAL_BUCKET_UNIQUE_CORE_RESIDUAL_NO_PAIR_SEPARATOR_STRUCTURE_FORENSIC', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['scientific_firewall']['P_VS_NP']=='OPEN'
          assert z['scientific_firewall']['GENERAL_SAT_IN_P']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'candidate_summary':z['candidate_summary'],'independent_summary':z['independent_summary']},sort_keys=True))
          PY
      - name: v3.10 pair-separator regression
        run: python -m research.tools.apma_bucket_residual_pair_separator.independent_checker
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_ONLY'
          echo 'CUT_CAP=3'
          echo 'SEPARATOR_SIZE_GE4_ENUMERATION=0'
          echo 'THREE_PLUS_JOIN_CHAIN=0'
          echo 'GLOBAL_RESIDUAL_CARTESIAN_PRODUCT=0'
          echo 'P_VS_NP=OPEN'
