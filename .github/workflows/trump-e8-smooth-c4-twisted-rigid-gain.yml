name: TRUMP E8 Smooth C4 Twisted Rigid Gain Transducer

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TWISTED_ORBIT_RIGID_GAIN_TRANSDUCER_2026-09-30_v7.9.json'
      - 'research/tools/e8_smooth_c4_twisted_rigid_gain/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-twisted-rigid-gain.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_TWISTED_ORBIT_RIGID_GAIN_TRANSDUCER_2026-09-30_v7.9.json'
      - 'research/tools/e8_smooth_c4_twisted_rigid_gain/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-twisted-rigid-gain.yml'
  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay rigid S3 gain lift and order-six transducer
        run: python research/tools/e8_smooth_c4_twisted_rigid_gain/checker.py
