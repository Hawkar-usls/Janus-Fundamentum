name: R5 Matched Rank Two Quotient Treewidth Lift
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_matched_rank2_quotient_treewidth_lift.py'
      - '.github/workflows/r5-matched-rank2-treewidth-lift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lift:
    name: 'Original Tanner treewidth bound from quartic matching quotient'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove and independently replay quotient-to-original lifted tree decompositions
        run: python -u experiments/r5_universal_matched_rank2_quotient_treewidth_lift.py
