name: Validate C025 F3 Frontier Width Depth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_e2r_frontier_width_depth_f3.py"
      - "proof_attempts/C025/C025_E2R_L1G_F3_FRONTIER_WIDTH_DEPTH.md"
      - ".github/workflows/validate-c025-f3-frontier.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_e2r_frontier_width_depth_f3.py"
      - "proof_attempts/C025/C025_E2R_L1G_F3_FRONTIER_WIDTH_DEPTH.md"
      - ".github/workflows/validate-c025-f3-frontier.yml"

permissions:
  contents: read

jobs:
  verify-f3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile F3 probe
        run: python -m py_compile experiments/direct/janus_tear_e2r_frontier_width_depth_f3.py
      - name: Replay F3 frontier-width x depth mechanics
        run: python experiments/direct/janus_tear_e2r_frontier_width_depth_f3.py
