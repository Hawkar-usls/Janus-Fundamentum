name: R5 Affine Signed Identities And Branch Twins
on:
  push:
    branches: [research/r5-affine-identities-branch-twins-20261015]
    paths:
      - "experiments/r5_affine_signed_spectrum_identities_20261015.py"
      - "experiments/r5_branch_stable_spectral_twins_20261015.py"
      - "experiments/r5_affine_macwilliams_cooperative_20261015.py"
      - "docs/r5_affine_signed_identities_branch_twins_checkpoint_20261015.md"
      - ".github/workflows/r5-affine-signed-identities-branch-twins.yml"
  pull_request:
    paths:
      - "experiments/r5_affine_signed_spectrum_identities_20261015.py"
      - "experiments/r5_branch_stable_spectral_twins_20261015.py"
      - "experiments/r5_affine_macwilliams_cooperative_20261015.py"
      - "docs/r5_affine_signed_identities_branch_twins_checkpoint_20261015.md"
      - ".github/workflows/r5-affine-signed-identities-branch-twins.yml"
  workflow_dispatch:
jobs:
  exact-identities-and-twins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all 4 signed spectral identities against complete finite cosets
        run: python3 experiments/r5_affine_signed_spectrum_identities_20261015.py --self-test
      - name: Permutation-invariant branch profiles, exact rational LP and finite SAT UNSAT search
        run: python3 experiments/r5_branch_stable_spectral_twins_20261015.py --self-test
      - name: Safe min parent children bound and signed affine cooperative DFS
        run: python3 experiments/r5_affine_macwilliams_cooperative_20261015.py --self-test
