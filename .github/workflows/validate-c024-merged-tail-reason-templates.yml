name: Validate C024 Merged Tail Reason Templates

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_reason_template_profile.py"
      - "experiments/direct/janus_tear_gt_merged_tail_reason_template_certificate.py"
      - ".github/workflows/validate-c024-merged-tail-reason-templates.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_merged_tail_reason_template_profile.py"
      - "experiments/direct/janus_tear_gt_merged_tail_reason_template_certificate.py"
      - ".github/workflows/validate-c024-merged-tail-reason-templates.yml"

permissions:
  contents: read

jobs:
  merged-tail-reason-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certify compact merged-tail reason templates
        run: python experiments/direct/janus_tear_gt_merged_tail_reason_template_certificate.py
