name: JANUS TIME-SAT-004E2 fixed four-family adaptive cost-gate calibration
on:
  push:
    branches: [research/time-sat-004e2-multifamily-gate-calibration-20261102]
    paths:
      - experiments/direct/janus_time_sat_004e2_adaptive_gate.py
      - tests/test_time_sat_004e2_adaptive_gate.py
      - .github/workflows/validate-time-sat-004e2-adaptive.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004e2-four-preseen-public-cases
  cancel-in-progress: true
jobs:
  multifamily-gate-and-noop-raw-controls:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact locked public source gate and negative-control dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          'python-sat==1.9.dev17' 'pycryptosat==5.15.0'
      - name: Negative, forged-partition and exact four-family SHA policy tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004e2_adaptive_gate.py' -v
      - name: Previous fixed 004E1 source and verified SAT-model tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004e1_full_cost.py' -v
      - name: Original 004D4 exact-source parity equivalence tests
        run: python -m unittest discover -s tests -p 'test_time_sat_004d4_mixed_xor.py' -v
      - name: Independent legacy C023 serialized verifier remains unchanged
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Frozen 4 cases times 5 arms times 2 repeats (40 cold trials per host)
        run: >-
          python experiments/direct/janus_time_sat_004e2_adaptive_gate.py
          --out evidence/time_sat_004e2
      - name: Preserve ALL outcomes for honest scientific reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004e2-${{ matrix.runner }}
          path: evidence/time_sat_004e2/comparison.json
          retention-days: 30
          if-no-files-found: warn
