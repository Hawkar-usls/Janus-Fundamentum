name: Validate Fundamentum evidence strength and two-class pathwidth

on:
  pull_request:
    paths:
      - 'research_targets/FUNDAMENTUM_EVIDENCE_STRENGTH_SCALE_V1.json'
      - 'research_targets/FUNDAMENTUM_TARGET_EVIDENCE_TABLE_V1.json'
      - 'research_targets/priority_records/A3_DUPLICATE_SUBSPACE_PATHWIDTH_PRIORITY_RECORD_V1.json'
      - 'research_targets/A3_TWO_CLASS_REPEATED_SUBSPACE_PATHWIDTH_THEOREM_V1.json'
      - 'experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_v1.py'
      - 'experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_verifier_v1.py'
      - '.github/workflows/validate-fundamentum-evidence-strength-and-two-class-pathwidth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate evidence strength and priority provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('research_targets/FUNDAMENTUM_EVIDENCE_STRENGTH_SCALE_V1.json'))
          assert [x['level'] for x in s['evidence_strength_levels']]==[f'ES{i}' for i in range(8)]
          assert [x['level'] for x in s['novelty_axis']]==[f'N{i}' for i in range(5)]
          t=json.load(open('research_targets/FUNDAMENTUM_TARGET_EVIDENCE_TABLE_V1.json'))
          rows={x['id']:x for x in t['targets']}
          assert rows['A0_P_VS_NP']['evidence_strength']=='ES1'
          assert rows['A3_MATROID_TRELLIS_RANK_WIDTH']['evidence_strength']=='ES4'
          assert rows['A3_MATROID_TRELLIS_RANK_WIDTH']['novelty']=='N1'
          p=json.load(open('research_targets/priority_records/A3_DUPLICATE_SUBSPACE_PATHWIDTH_PRIORITY_RECORD_V1.json'))
          assert p['recorded_date_utc']=='2026-08-08'
          assert p['explicit_identical_statement_found_in_searched_primary_corpus'] is False
          assert p['universal_absence_claimed'] is False
          assert p['historical_priority_claimed'] is False
          print('EVIDENCE_STRENGTH_SCALE = PASS')
          print('PRIORITY_PROVENANCE_RECORD = PASS')
          PY

      - name: Compile theorem producer and independent verifier
        run: |
          python -m py_compile experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_v1.py
          python -m py_compile experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_verifier_v1.py

      - name: Build two-class theorem certificate
        run: |
          python experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_v1.py \
            --out /tmp/two_class.json --max-n 4 --max-mult 3 | tee /tmp/producer.log
          grep -Fx 'A3_TWO_CLASS_SYMBOLIC_DERIVATION = PASS' /tmp/producer.log
          grep -Fx 'A3_TWO_CLASS_EXHAUSTIVE_GF2_CONTROLS = PASS' /tmp/producer.log
          grep -Fx 'COUNTEREXAMPLES = 0' /tmp/producer.log
          grep -Fx 'P_VS_NP = OPEN' /tmp/producer.log

      - name: Independently replay theorem and tamper suite
        run: |
          python experiments/direct/janus_a3_two_class_repeated_subspace_pathwidth_theorem_verifier_v1.py \
            --certificate /tmp/two_class.json --max-n 4 --max-mult 3 --tamper-test | tee /tmp/verifier.log
          grep -Fx 'A3_TWO_CLASS_INDEPENDENT_REPLAY = PASS' /tmp/verifier.log
          grep -Fx 'COUNTEREXAMPLES = 0' /tmp/verifier.log
          grep -Fx 'DIGEST_REPAIRED_TAMPERS_REJECTED = 16/16' /tmp/verifier.log
          grep -Fx 'WORLD_NOVEL_THEOREM_CLAIM = FORBIDDEN_PENDING_AUDIT' /tmp/verifier.log
          grep -Fx 'P_VS_NP = OPEN' /tmp/verifier.log

      - name: Freeze exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          c=json.load(open('/tmp/two_class.json'))
          r={'schema':'janus.fundamentum.a3.two_class_pathwidth_exact_head_receipt.v1','exact_head':git('rev-parse','HEAD'),'semantic_digest':c['semantic_digest'],'subspace_pairs':c['exhaustive_controls']['subspace_pairs'],'multiplicity_cases':c['exhaustive_controls']['multiplicity_cases'],'class_pattern_layouts':c['exhaustive_controls']['class_pattern_layouts'],'cut_evaluations':c['exhaustive_controls']['cut_evaluations'],'counterexamples':0,'tamper_rejections':'16/16','literature_novelty':'NOT_ESTABLISHED','p_vs_np':'OPEN'}
          pathlib.Path('/tmp/two_class_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('EXACT_HEAD_RECEIPT = BUILT')
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundamentum-two-class-pathwidth-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/two_class.json
            /tmp/two_class_receipt.json
            /tmp/producer.log
            /tmp/verifier.log
          if-no-files-found: error
