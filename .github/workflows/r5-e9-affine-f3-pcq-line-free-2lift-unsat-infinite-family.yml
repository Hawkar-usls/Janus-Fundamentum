name: R5 E9 AF3 PCQ-Fixed Line-Free 2-Lift UNSAT Family

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PCQ_LINE_FREE_2LIFT_UNSAT_INFINITE_FAMILY_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_pcq_line_free_2lift_unsat_infinite_family.py'
      - '.github/workflows/r5-e9-affine-f3-pcq-line-free-2lift-unsat-infinite-family.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact AF3 PCQ-fixed line-free 2-lift regression
        run: python experiments/r5_e9_affine_f3_pcq_line_free_2lift_unsat_infinite_family.py
