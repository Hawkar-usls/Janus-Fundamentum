name: R5 E9 Linear Cubic Trace Rank Nullity Bound

on:
  pull_request:
    paths:
      - 'research/R5_E9_LINEAR_CUBIC_TRACE_RANK_NULLITY_BOUND_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_linear_cubic_trace_rank_nullity_bound.py'
      - '.github/workflows/r5-e9-linear-cubic-trace-rank-nullity-bound.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact linear-cubic trace/rank regression
        run: python experiments/r5_e9_linear_cubic_trace_rank_nullity_bound.py
