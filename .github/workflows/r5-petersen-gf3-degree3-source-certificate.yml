name: R5 Independent Petersen GF3 Degree Three Source Certificate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_degree3_petersen_source_certificate.py'
      - '.github/workflows/r5-petersen-gf3-degree3-source-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-proof:
    name: Unwind exact degree3 Gaussian DAG and independently verify original source identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original Boolean GF3 source proof and deliberately forged coefficient rejection
        run: python -u experiments/r5_universal_gf3_degree3_petersen_source_certificate.py
