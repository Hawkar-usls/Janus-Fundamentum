name: R5 Solver Portfolio Cross-Family Coverage Audit
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_portfolio_coverage_matrix.py'
      - '.github/workflows/r5-solver-portfolio-coverage-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: 'Adversarial SAT/UNSAT ground truth versus poly-only experts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe EXACT controls from disparate Fundamentum families
        run: python -u experiments/r5_universal_certified_portfolio_coverage_matrix.py
