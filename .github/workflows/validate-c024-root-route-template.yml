name: Validate C024 Root Route Template

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_route_template_profile.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-route-template.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_route_template_profile.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-root-route-template.yml"

permissions:
  contents: read

jobs:
  root-route-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify root route geometry through GT_12
        run: python experiments/direct/janus_tear_gt_root_route_template_profile.py
