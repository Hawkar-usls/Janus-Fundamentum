name: TRUMP E8 Z3 Gain Normalized Cycle Type

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_Z3_GAIN_NORMALIZED_CYCLE_TYPE_CARRIER_2026-09-30_v5.4.json'
      - 'research/tools/e8_z3_gain_normalized_cycle_type/checker.py'
      - '.github/workflows/trump-e8-z3-gain-normalized-cycle-type.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Z3 gain carrier regression
        run: python research/tools/e8_z3_gain_normalized_cycle_type/checker.py
