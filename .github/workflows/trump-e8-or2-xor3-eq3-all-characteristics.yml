name: TRUMP E8 OR2 XOR3 EQ3 All-Characteristics Closure

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_OR2_XOR3_EQ3_ALL_CHARACTERISTICS_COMMON_BASIS_CLOSURE_2026-09-30_v4.5.json'
      - 'research/tools/e8_or2_xor3_eq3_all_characteristics/checker.py'
      - '.github/workflows/trump-e8-or2-xor3-eq3-all-characteristics.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact finite-field exceptional-basis regression
        run: python research/tools/e8_or2_xor3_eq3_all_characteristics/checker.py
