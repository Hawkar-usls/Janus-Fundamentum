name: Validate C024 Transitive Cycle Pair Reachability

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_transitive_cycle_pair_reachability.py"
      - ".github/workflows/validate-c024-transitive-cycle-pair-reachability.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_transitive_cycle_pair_reachability.py"
      - ".github/workflows/validate-c024-transitive-cycle-pair-reachability.yml"

permissions:
  contents: read

jobs:
  transitive-cycle-pair-reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit reachable transitive-cycle witness pairs
        run: python experiments/direct/janus_tear_gt_transitive_cycle_pair_reachability.py
