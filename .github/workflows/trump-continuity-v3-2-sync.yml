name: TRUMP One-Shot v3.2 Manifest Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trump-continuity-v3-2-sync.yml'

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manifest without truncating history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          d = json.loads(p.read_text(encoding='utf-8'))

          d['latest_successor_state'] = 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json'
          d['current_scoped_open_surface'] = {
              'name': 'PREDECESSOR_OPEN_MIXED_3PLUS_RELATION_OVERWIDTH_COMPONENT_WITH_FIRST_FROZEN_ORDER_BUCKET_PRODUCT_GREATER_THAN_L2_AND_NO_OTHER_SEALED_STRUCTURE',
              'next_gate_candidate': 'TRUMP_BICAMERAL_EFFECTIVE_BUCKET_FACTOR_OR_CONGRUENCE_INDUCTION_FALSIFIER_GATE',
              'latest_state': 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json',
          }

          mechanisms = d.setdefault('mechanisms', {})
          mechanisms['UNIFORM_RAW_AFFINE_3PLUS_SUPERSEDED_ROUTE'] = {
              'aliases': [
                  'Uniform raw-derived affine boundary factor',
                  'TRUMP_BICAMERAL_COMPONENT_UNIFORM_RAW_DERIVED_AFFINE_BOUNDARY_FACTOR_FALSIFIER_GATE'
              ],
              'role': 'Anti-loop diagnostic showing that all-affine 3+ raw inputs are already captured by the earlier raw/compositional basis layer before mincut discovery; do not repair or reintroduce as a current frontier gate.',
              'classification': 'SUPERSEDED_ROUTE',
              'fundamentum_binding': {
                  'v1_preregistration_commit': '8d8d88e90d612ebd60f02b88833f5c8d74e28175',
                  'v1_candidate_commit': 'e89aae1e7db219094e5cefb12d304142420bec2e',
                  'v1_candidate_blob': '336c58c059fecba49c7fbfba9018a95761f8fc24',
                  'v1_first_run': 34920916569,
                  'v1_first_job': 104228640727,
                  'diagnostic_preregistration_commit': '9de3118c8245fcea58cdeabeadd2385275546662',
                  'diagnostic_runner_commit': '41a1e29ae2e0273c36bf3a5804468cdca54a38c9',
                  'diagnostic_run': 34921076606,
                  'diagnostic_job': 104229133484,
                  'diagnostic_result_commit': '8df4c668878eba7fa50760c542254be9390a53cd',
                  'diagnostic_journal_commit': '4bce2dda0b796df9e5f312bc1e2fd7226f483d62',
                  'merge_commit': '4ca33e555e5e5c70dd01ed70e3fd4d98641335e6',
                  'latest_state': 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.1.json'
              },
              'machine_conclusion': {
                  'all_raw_relations_affine': True,
                  'global_basis_status': 'ADMIT_COMPOSITIONAL_BASIS_PORTFOLIO',
                  'parent_mincut_status': 'OUT_OF_SCOPE_GLOBAL_OR_DISCONNECTED_BASIS_ALREADY_EXISTS',
                  'parent_has_cut_receipt': False
              },
              'forbidden_repeat': 'DO_NOT_REPAIR_OR_PROMOTE_THIS_SUPERSEDED_ALL_AFFINE_ROUTE'
          }

          mechanisms['BICAMERAL_GUARDED_BOUNDED_OUTPUT_ELIMINATION'] = {
              'aliases': [
                  'Guarded bounded-output elimination',
                  'L2 pre-expansion bucket guard',
                  'TRUMP_BICAMERAL_COMPONENT_GUARDED_BOUNDED_OUTPUT_ELIMINATION_FALSIFIER_GATE'
              ],
              'role': 'For predecessor-open mixed/non-affine 3+ relation overwidth components, perform exact existential bucket elimination in one frozen canonical order only when each current explicit bucket row-product is <= L^2 before expansion; otherwise return OPEN before enumerating the failed bucket.',
              'classification': 'SUCCESSOR_REPAIR_OF_R27_R29_LOCAL_BUCKET_ELIMINATION_LINE',
              'historical_sources': {
                  'R27_result_commit': '55c18e317d7a8081dc5ce6c20ee11e7d59f71cb8',
                  'R29_result_commit': '1f1ca71c4a7a23dcca463fde5e3787772bbeac8e'
              },
              'fundamentum_binding': {
                  'preregistration_commit': 'f09752f5361f15249d0ecdd1d11757efb6c96105',
                  'candidate_commit': '91dccbaed1c4693253549d3e917333084a7e4811',
                  'candidate_blob': '314034bac990e524d1db7743aef0aebd3b4565c1',
                  'independent_checker_commit': 'f12acae6950800adb431d9bc8f3dc31f01ce5d03',
                  'workflow_head': '9537c1764f0a97ee5edf47eb371253944e86659b',
                  'actions_run': 34921796167,
                  'actions_job': 104231342652,
                  'theorem_seal_commit': 'edc4b6961999337cd5f1585aee22f764bf43d6a9',
                  'result_commit': 'a875972caeca26d23bf28ff612c6aa679a884b75',
                  'journal_commit': '35b64025524fc6430b4da12d7cbde0ce7073f96b',
                  'merge_commit': 'c77422b6404824e70b2ad06c23db4c2620cc207e',
                  'verdict': 'PASS_SCOPED_BICAMERAL_GUARDED_BOUNDED_OUTPUT_ELIMINATION_V1',
                  'latest_state': 'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json'
              },
              'closed_scope': 'Predecessor-open mixed/non-affine 3+ relation components for which every bucket in the single frozen elimination order has pre-expansion row product <= L^2. Exact natural join/projection, reverse witness replay and original tuple verification remain within one fixed polynomial envelope.',
              'complexity': {
                  'per_bucket_combination_cap': 'L^2',
                  'per_bucket_output_cap': 'L^2_ROWS',
                  'conservative_total_lifecycle': 'O(L^6)',
                  'polynomial_degree_depends_on_relation_count': False,
                  'raw_2_to_k_enumeration': 0,
                  'alternative_order_retries': 0
              },
              'negative_authority': 'Overbudget bucket returns OPEN_BUCKET_PRODUCT_BUDGET before failed-bucket enumeration; OPEN is not negative evidence.',
              'current_successor_blocker': 'Reduce exact effective complexity of the first canonical overbudget bucket before materialization, without raising the budget exponent or exponential order search.'
          }

          never = d.setdefault('anti_loop_contract', {}).setdefault('never', [])
          for item in [
              'repair or promote the superseded all-affine 3+ boundary gate',
              'repeat guarded L^2 bucket elimination as if overbudget buckets were solved',
              'raise the L^2 bucket budget exponent without a new structural theorem',
              'enumerate an overbudget bucket and compress it afterward',
              'treat OPEN_BUCKET_PRODUCT_BUDGET as negative evidence'
          ]:
              if item not in never:
                  never.append(item)

          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python -m json.tool registry/TRUMP_CONTEXT_MANIFEST.json >/dev/null
          rm .github/workflows/trump-continuity-v3-2-sync.yml

      - name: Commit continuity sync and remove one-shot workflow
        run: |
          git config user.name 'Hawkar-usls'
          git config user.email 'hawkarlol@gmail.com'
          git add registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/trump-continuity-v3-2-sync.yml
          git commit -m 'TRUMP sync v3.2 context manifest'
          git push origin HEAD:main
