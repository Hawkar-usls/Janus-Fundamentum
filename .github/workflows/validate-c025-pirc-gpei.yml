name: validate-c025-pirc-gpei

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'experiments/direct/janus_matching_hall_escape.py'
      - 'experiments/direct/janus_pirc_theorem_mode_v0_1.py'
      - 'experiments/direct/janus_open3_stage4_scaling_ladder_runner.py'
      - 'research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json'
      - '.github/workflows/validate-c025-pirc-gpei.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_matching_hall_escape.py'
      - 'experiments/direct/janus_pirc_theorem_mode_v0_1.py'
      - 'experiments/direct/janus_open3_stage4_scaling_ladder_runner.py'
      - 'research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json'

jobs:
  exact-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Matching Hall escape self-test
        run: python -m experiments.direct.janus_matching_hall_escape
      - name: Frozen PIRC theorem-mode path self-test
        run: python -m experiments.direct.janus_pirc_theorem_mode_v0_1
      - name: Execute full preregistered OPEN3 Stage4 scaling ladder
        run: |
          python -m experiments.direct.janus_open3_stage4_scaling_ladder_runner \
            | tee open3-stage4-scaling-ladder-reverse-pass.json
      - name: Verify ladder scientific boundary and print rung summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('open3-stage4-scaling-ladder-reverse-pass.json').read_text())
          boundary = data['scientific_boundary']
          assert boundary['bounded_finite_ladder_only'] is True
          assert boundary['absence_of_barrier_is_not_totality_proof'] is True
          assert boundary['universal_OPEN3_move_availability'] == 'OPEN'
          assert boundary['universal_GPEI_preservation'] == 'OPEN'
          assert boundary['P_VS_NP'] == 'OPEN'
          print('LADDER_STATUS=' + data['status'])
          for rung in data['rungs_executed']:
              totals = rung['totals']
              print(
                  f"{rung['id']}: connected={totals['connected_examined']} "
                  f"open3={totals['open3']} stage4_progress={totals['stage4_progress']} "
                  f"open_after_stage4={totals['open_after_stage4']}"
              )
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-open3-stage4-scaling-ladder-reverse-pass
          path: open3-stage4-scaling-ladder-reverse-pass.json
      - name: Verify claim ceiling remains open
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['P_VS_NP'] == 'OPEN'
          assert data['current_status']['UNIVERSAL_GPEI_PRESERVATION'] == 'OPEN'
          print('CLAIM_CEILING_FIREWALL=PASS')
          print('P_VS_NP=OPEN')
          PY
