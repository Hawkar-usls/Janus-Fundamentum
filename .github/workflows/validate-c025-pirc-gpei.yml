name: validate-c025-pirc-gpei

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'experiments/direct/janus_matching_hall_escape.py'
      - 'experiments/direct/janus_pirc_theorem_mode_v0_1.py'
      - 'research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json'
      - '.github/workflows/validate-c025-pirc-gpei.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_matching_hall_escape.py'
      - 'experiments/direct/janus_pirc_theorem_mode_v0_1.py'
      - 'research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json'

jobs:
  exact-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Matching Hall escape self-test
        run: python -m experiments.direct.janus_matching_hall_escape
      - name: Frozen PIRC theorem-mode path self-test
        run: python -m experiments.direct.janus_pirc_theorem_mode_v0_1
      - name: Run preregistered OPEN3 R1 reverse-pass probe
        run: |
          python -m experiments.direct.janus_open3_stage4_bounded_coverage_probe \
            --nvars 4 \
            --clauses 5 \
            --min-width 3 \
            --max-width 3 \
            --cap-exponent 2 \
            --limit 5000 | tee open3-r1-reverse-pass.json
      - name: Verify R1 scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('open3-r1-reverse-pass.json').read_text())
          assert data['scientific_boundary']['bounded_finite_probe_only'] is True
          assert data['scientific_boundary']['absence_of_counterexample_is_not_totality_proof'] is True
          assert data['scientific_boundary']['P_VS_NP'] == 'OPEN'
          print('R1_SCIENTIFIC_BOUNDARY=PASS')
          print('R1_STATUS=' + data['status'])
          print('R1_OPEN3=' + str(data['totals']['open3']))
          print('R1_OPEN_AFTER_STAGE4=' + str(data['totals']['open_after_stage4']))
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-open3-r1-reverse-pass
          path: open3-r1-reverse-pass.json
      - name: Verify claim ceiling remains open
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/C025_PIRC_GPEI_COMPOSITION_BRIDGE_2026-08-27.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['P_VS_NP'] == 'OPEN'
          assert data['current_status']['UNIVERSAL_GPEI_PRESERVATION'] == 'OPEN'
          print('CLAIM_CEILING_FIREWALL=PASS')
          print('P_VS_NP=OPEN')
          PY
