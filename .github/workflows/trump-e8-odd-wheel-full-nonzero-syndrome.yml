name: TRUMP E8 Odd Wheel Full Nonzero Syndrome

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_ODD_WHEEL_FULL_NONZERO_SYNDROME_NO_LINEAR_COMPRESSION_2026-09-30_v6.3.json'
      - 'research/tools/e8_odd_wheel_full_nonzero_syndrome/checker.py'
      - '.github/workflows/trump-e8-odd-wheel-full-nonzero-syndrome.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run odd-wheel syndrome regression
        run: python research/tools/e8_odd_wheel_full_nonzero_syndrome/checker.py
