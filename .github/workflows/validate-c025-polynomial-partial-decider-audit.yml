name: validate-c025-polynomial-partial-decider-audit

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'experiments/direct/janus_theorem_input_normal_form.py'
      - 'experiments/direct/janus_full_trajectory_frozen_open3_probe.py'
      - 'research/C025_FIXED_ENGINE_POLYNOMIAL_PARTIAL_DECIDER_AUDIT_2026-08-27.json'
      - '.github/workflows/validate-c025-polynomial-partial-decider-audit.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_theorem_input_normal_form.py'
      - 'experiments/direct/janus_full_trajectory_frozen_open3_probe.py'
      - 'research/C025_FIXED_ENGINE_POLYNOMIAL_PARTIAL_DECIDER_AUDIT_2026-08-27.json'
      - '.github/workflows/validate-c025-polynomial-partial-decider-audit.yml'

jobs:
  theorem-firewalls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dense theorem-input normal form self-test
        run: python -m experiments.direct.janus_theorem_input_normal_form

      - name: Focused full-trajectory frozen OPEN3 regression
        run: |
          python -m experiments.direct.janus_full_trajectory_frozen_open3_probe \
            | tee frozen-open3-full-trajectory.json

      - name: Verify finite-trajectory scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('frozen-open3-full-trajectory.json').read_text())
          b = data['scientific_boundary']
          assert b['bounded_finite_probe_only'] is True
          assert b['absence_of_open_is_not_totality_proof'] is True
          assert b['universal_GPEI_preservation'] == 'OPEN'
          assert b['arbitrary_CNF_totality'] == 'OPEN'
          assert b['P_VS_NP'] == 'OPEN'
          print('FOCUSED_FULL_TRAJECTORY_STATUS=' + data['status'])
          print('P_VS_NP=OPEN')
          PY

      - name: Verify polynomial partial-decider audit ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/C025_FIXED_ENGINE_POLYNOMIAL_PARTIAL_DECIDER_AUDIT_2026-08-27.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] == 'POLYNOMIAL_PARTIAL_DECIDER_BOUND_DERIVED__UNIVERSAL_TOTALITY_OPEN'
          assert data['P_VS_NP'] == 'OPEN'
          assert data['remaining_central_theorem']['status'] == 'OPEN_CENTRAL'
          assert data['decision_vs_witness_correction']['required_implementation_status'] == 'DECISION_CORE_REFACTOR_PENDING'
          assert data['theorem_consequence_if_closed']['current_status'] == 'CONDITIONAL_ONLY'
          print('POLYNOMIAL_PARTIAL_DECIDER_AUDIT=PASS')
          print('REACHABLE_MOVE_OR_TERMINAL_TOTALITY=OPEN_CENTRAL')
          print('P_VS_NP=OPEN')
          PY
