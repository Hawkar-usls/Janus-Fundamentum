name: R5 E9 Affine F3 Rank2 Cover Completeness Paley19 Falsifier

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_RANK2_COVER_COMPLETENESS_PALEY19_FALSIFIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_rank2_cover_completeness_paley19_falsifier.py'
      - '.github/workflows/r5-e9-affine-f3-rank2-cover-completeness-paley19-falsifier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley19 rank-2 completeness falsifier
        run: python experiments/r5_e9_affine_f3_rank2_cover_completeness_paley19_falsifier.py
