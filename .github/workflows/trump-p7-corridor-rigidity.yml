name: TRUMP P7 Corridor Rigidity Proof-Carrying Gate

on:
  push:
    branches:
      - research/general-sat-universal-coverage-map-2026-09-19
    paths:
      - 'research/TRUMP_P7_CORRIDOR_RIGIDITY_EXECUTION_PREREGISTRATION_2026-09-19_v1.0.json'
      - 'research/tools/p7_corridor_rigidity/**'
      - '.github/workflows/trump-p7-corridor-rigidity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rigidity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5d525a328c1e97f705d82a9a87646017a6ca38a2 HEAD
          git merge-base --is-ancestor c28d052a4d4904ef8ce589492faa0f71ed7e17a1 HEAD
          git merge-base --is-ancestor 6ea59399a47aa6889a5dd77d945776c81d30715a HEAD
          git merge-base --is-ancestor debc0d3e100f79694cf162b59d0bbc30e1bfd905 HEAD
          git merge-base --is-ancestor 0d8fff297e7795b235a7a509f872eab42872d6c7 HEAD
          python -m py_compile             research/tools/p7_corridor_rigidity/kernel_replay.py             research/tools/p7_corridor_rigidity/instance_checker.py             research/tools/p7_corridor_rigidity/independent_checker.py

      - name: Replay universal theorem kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p7rigidity
          python research/tools/p7_corridor_rigidity/kernel_replay.py             research/TRUMP_P7_CORRIDOR_RIGIDITY_EXECUTION_PREREGISTRATION_2026-09-19_v1.0.json             p7rigidity/theorem_kernel.receipt.json             | tee p7rigidity/theorem_kernel.stdout

      - name: Run candidate instance checker and preregistered controls
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/p7_corridor_rigidity/instance_checker.py             --run-suite p7rigidity/suite             | tee p7rigidity/instance_checker.stdout

      - name: Independent replay
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/p7_corridor_rigidity/independent_checker.py             p7rigidity/suite             p7rigidity/theorem_kernel.receipt.json             p7rigidity/independent_replay.json             | tee p7rigidity/independent_checker.stdout

      - name: Assemble proof-carrying scientific manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path("p7rigidity")
          prereg=pathlib.Path("research/TRUMP_P7_CORRIDOR_RIGIDITY_EXECUTION_PREREGISTRATION_2026-09-19_v1.0.json")
          kernel=json.loads((root/"theorem_kernel.receipt.json").read_text())
          suite=json.loads((root/"suite/suite_summary.json").read_text())
          indep=json.loads((root/"independent_replay.json").read_text())
          pos=json.loads((root/"suite/POS_CANONICAL_P6_CORRIDOR.receipt.json").read_text())
          p7neg=json.loads((root/"suite/NEG_THREE_INTERNAL_SEED.receipt.json").read_text())

          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()

          mandatory={
            "theorem_kernel_replay_pass":kernel["verdict"]=="THEOREM_KERNEL_REPLAY_PASS",
            "formal_theorem_not_claimed":kernel["formal_theorem_pass"] is False,
            "candidate_controls_match_prereg":suite["all_controls_match"] is True,
            "independent_replay_pass":indep["verdict"]=="INDEPENDENT_REPLAY_PASS",
            "positive_instance_pass":pos["verdict"]=="PASS_P7_CORRIDOR_RIGIDITY",
            "positive_p7_recognition":pos["p7_recognition"]["result"]=="P7_FREE",
            "positive_induced_p6":pos["corridor_certificate"]["induced_P6_verified"] is True,
            "positive_all_15_pairs":len(pos["corridor_certificate"]["all_15_pairs"])==15,
            "positive_five_edges":pos["corridor_certificate"]["five_edges_verified"] is True,
            "positive_ten_nonedges":pos["corridor_certificate"]["ten_nonedges_verified"] is True,
            "three_internal_control_rejected_as_not_p7_free":p7neg["verdict"]=="FAIL_NOT_P7_FREE",
            "three_internal_control_has_ordered_p7_witness":len(p7neg["p7_recognition"]["witness"] or [])==7
          }
          assert all(mandatory.values()), {k:v for k,v in mandatory.items() if not v}

          manifest={
            "schema":"janus.trump.p7_corridor_rigidity.scientific_manifest.v1",
            "gate":"P7_CORRIDOR_RIGIDITY",
            "workflow_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "frozen_parent":"5d525a328c1e97f705d82a9a87646017a6ca38a2",
            "preregistration_commit":"c28d052a4d4904ef8ce589492faa0f71ed7e17a1",
            "implementation_commits":{
              "kernel_replay":"6ea59399a47aa6889a5dd77d945776c81d30715a",
              "instance_checker":"debc0d3e100f79694cf162b59d0bbc30e1bfd905",
              "independent_checker":"0d8fff297e7795b235a7a509f872eab42872d6c7"
            },
            "theorem_authority":{
              "mode":kernel["mode"],
              "verdict":kernel["verdict"],
              "formal_theorem_pass":False,
              "receipt_sha256":sha(root/"theorem_kernel.receipt.json")
            },
            "instance_checker":{
              "verdict":"INSTANCE_SUITE_PASS",
              "implementation_sha256":sha("research/tools/p7_corridor_rigidity/instance_checker.py"),
              "summary_sha256":sha(root/"suite/suite_summary.json")
            },
            "independent_replay":{
              "verdict":indep["verdict"],
              "implementation_sha256":sha("research/tools/p7_corridor_rigidity/independent_checker.py"),
              "receipt_sha256":sha(root/"independent_replay.json")
            },
            "p7_recognition":{
              "method":"exhaustive_constant_size_7_vertex_induced_subgraph_search",
              "positive_result":pos["p7_recognition"]["result"],
              "negative_control_witness":p7neg["p7_recognition"]["witness"]
            },
            "corridor_certificate":{
              "shortest_path":pos["shortest_seed_path"],
              "corridor":pos["corridor_certificate"]["order"],
              "all_15_pairs_verified":True,
              "five_edges_verified":True,
              "ten_nonedges_verified":True,
              "positive_receipt_sha256":sha(root/"suite/POS_CANONICAL_P6_CORRIDOR.receipt.json")
            },
            "controls":{
              "all_preregistered_expected_verdicts_observed":True,
              "summary_sha256":sha(root/"suite/suite_summary.json")
            },
            "mandatory_checks":mandatory,
            "scientific_gate":{
              "verdict":"PASS_P7_CORRIDOR_RIGIDITY_VERIFIED",
              "scope":"P7_CORRIDOR_RIGIDITY_ONLY"
            },
            "claim_ceiling":{
              "FORMAL_THEOREM_PASS":"NOT_CLAIMED",
              "LEMMA11_P7_LIFT":"OPEN",
              "SUBGATE_A":"NOT_STARTED",
              "SUBGATE_B":"NOT_STARTED",
              "P7_FREE_4_COLOR_IN_P":"NOT_PROVED",
              "P_VS_NP":"OPEN"
            },
            "successor_gate_autoactivated":False,
            "next_allowed_action":"SEPARATE_PREREGISTRATION_FOR_COMMON_Z_SEMANTIC_DEPENDENCY_LEDGER_ONLY",
            "source_digests":{
              "preregistration_sha256":sha(prereg),
              "kernel_replay_py_sha256":sha("research/tools/p7_corridor_rigidity/kernel_replay.py"),
              "instance_checker_py_sha256":sha("research/tools/p7_corridor_rigidity/instance_checker.py"),
              "independent_checker_py_sha256":sha("research/tools/p7_corridor_rigidity/independent_checker.py")
            }
          }
          (root/"scientific_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"scientific_gate":manifest["scientific_gate"],"mandatory_checks":mandatory,"claim_ceiling":manifest["claim_ceiling"]},sort_keys=True))
          PY

      - name: Assert frozen authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          z=json.load(open("p7rigidity/scientific_manifest.json"))
          assert z["scientific_gate"]["verdict"]=="PASS_P7_CORRIDOR_RIGIDITY_VERIFIED"
          assert z["theorem_authority"]["mode"]=="KERNEL_REPLAY"
          assert z["theorem_authority"]["formal_theorem_pass"] is False
          assert z["successor_gate_autoactivated"] is False
          assert z["claim_ceiling"]["FORMAL_THEOREM_PASS"]=="NOT_CLAIMED"
          assert z["claim_ceiling"]["LEMMA11_P7_LIFT"]=="OPEN"
          assert z["claim_ceiling"]["SUBGATE_A"]=="NOT_STARTED"
          assert z["claim_ceiling"]["SUBGATE_B"]=="NOT_STARTED"
          assert z["claim_ceiling"]["P_VS_NP"]=="OPEN"
          print("AUTHORITY_CEILING_PASS")
          PY

      - name: Upload immutable proof-carrying artifact
        uses: actions/upload-artifact@v4
        with:
          name: trump-p7-corridor-rigidity-v1
          path: p7rigidity/
          if-no-files-found: error
          retention-days: 90
