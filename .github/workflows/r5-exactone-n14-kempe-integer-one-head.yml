name: R5 Open ExactOne N14 and Exact Kempe Orbit One HEAD
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_exposed_exactone_n14_anchored_rejection.py'
      - 'experiments/r5_universal_n14_anchor_rejection_independent_control.py'
      - 'experiments/r5_universal_exactone_kempe_integral_partition_proof.py'
      - 'experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py'
      - 'research/R5_EXPOSED_EXACTONE_N14_KEMPE_INTEGER_ORBIT_FRONTIER_2026-10-13.md'
      - '.github/workflows/r5-exactone-n14-kempe-integer-one-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-head:
    name: Exhaust all 69602 n14 interiors then verify physical source and 108-state integer Kempe witness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph6 isomorphism-free enumerator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nauty
          command -v nauty-geng
      - name: Exact nonisomorphic n14 physical 6-pole census with source-level early-rejection semantics
        run: python -u experiments/r5_universal_exposed_exactone_n14_anchored_rejection.py
      - name: Independent unanchored physical-state source cross-control on distinct n14 topologies
        run: python -u experiments/r5_universal_n14_anchor_rejection_independent_control.py
      - name: Exact pure-integer Kempe orbit partition proof for all 108 states
        run: python -u experiments/r5_universal_exactone_kempe_integral_partition_proof.py
      - name: Independently replay native GF3 degree-four Boolean equality-bit decoder certificate
        run: python -u experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py
