name: R5 Certified Failed Literal Polynomial Boolean Closure
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_failed_literal_boolean_closure.py'
      - 'experiments/r5_universal_certified_expert_portfolio.py'
      - '.github/workflows/r5-certified-failed-literal-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failed-literal:
    name: 'Polynomial GF2 ExactOne failed literals vs atomic SAT and UNSAT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent source certificate replay including forged branch proof
        run: python -u experiments/r5_universal_certified_failed_literal_boolean_closure.py
      - name: Common original-input JANUS portfolio with bounded failed-literal integration
        run: python -u experiments/r5_universal_certified_expert_portfolio.py
