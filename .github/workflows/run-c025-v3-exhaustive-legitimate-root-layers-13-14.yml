name: run-c025-v3-exhaustive-legitimate-root-layers-13-14

on:
  push:
    branches:
      - research/c025-balanced-pressure-wedge-2026-08-27
    paths:
      - 'experiments/direct/janus_v3_exhaustive_legitimate_root_layers_13_14.py'
      - '.github/workflows/run-c025-v3-exhaustive-legitimate-root-layers-13-14.yml'

jobs:
  exhaustive-N13-N14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exhaustive forward census N13-N14
        run: |
          python -m experiments.direct.janus_v3_exhaustive_legitimate_root_layers_13_14 \
            | tee c025-v3-exhaustive-N13-N14.json
      - name: Verify finite claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('c025-v3-exhaustive-N13-N14.json').read_text())
          assert [x['N'] for x in d['layers']] == [13,14]
          b = d['scientific_boundary']
          assert b['exhaustive_only_for_listed_finite_layers'] is True
          assert b['order_preserving_variable_renaming_only'] is True
          assert b['finite_totality_does_not_imply_asymptotic_totality'] is True
          assert b['no_open_does_not_prove_universal_availability'] is True
          assert b['heuristic_or_predictive_layer_has_theorem_authority'] is False
          assert b['P_VS_NP'] == 'OPEN'
          for row in d['layers']:
              assert sum(row['counts_by_root_var_count'].values()) == row['total_roots']
              print('N%d_ROOTS=%d' % (row['N'], row['total_roots']))
              print('N%d_OPEN=%d' % (row['N'], row['status_counts'].get('OPEN',0)))
              print('N%d_V2=%d' % (row['N'], row['roots_using_v2_macro_restore']))
              print('N%d_V3=%d' % (row['N'], row['roots_using_v3_tail']))
          print('SCAN_STATUS=' + d['status'])
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-v3-exhaustive-legitimate-root-layers-13-14
          path: c025-v3-exhaustive-N13-N14.json
