name: R5 Infinite Connected SCL Degree Three Dual Transport
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_infinite_connected_scl_degree3_dual_two_edge_sum.py'
      - '.github/workflows/r5-infinite-connected-scl-v3-dual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-homomorphism:
    name: Original connected bridgeless SCL108 SCL126 SCL144 with frozen J5 dual and 2-edge sum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck original native Holyer rows, bridgeless gluing, and all dual generator constraints
        run: python -u experiments/r5_universal_infinite_connected_scl_degree3_dual_two_edge_sum.py
