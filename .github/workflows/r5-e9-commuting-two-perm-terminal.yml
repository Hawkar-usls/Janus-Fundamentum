name: R5 E9 commuting two-permutation terminal

on:
  push:
    paths:
      - 'research/R5_E9_COMMUTING_TWO_PERM_EXACT_TERMINAL_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_commuting_two_perm_terminal.py'
      - '.github/workflows/r5-e9-commuting-two-perm-terminal.yml'
  pull_request:
    paths:
      - 'research/R5_E9_COMMUTING_TWO_PERM_EXACT_TERMINAL_2026-09-27_v1.0.md'
      - 'experiments/r5_e9_commuting_two_perm_terminal.py'
      - '.github/workflows/r5-e9-commuting-two-perm-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify commuting two-permutation exact terminal
        run: python experiments/r5_e9_commuting_two_perm_terminal.py
