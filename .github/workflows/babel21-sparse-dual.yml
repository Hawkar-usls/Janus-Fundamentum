name: BABEL-21 exact sparse source-rowspace dual search
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/sparse_source_dual.py','.github/workflows/babel21-sparse-dual.yml']
  pull_request:
    paths: ['experiments/babel21/sparse_source_dual.py','.github/workflows/babel21-sparse-dual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sparse-source-dual-test:
    strategy:
      fail-fast: false
      matrix:
        seed: [20,37]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup frozen proof dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore exact legacy source and current rational solvers
        run: |
          mkdir -p /tmp/b21dual
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21dual
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py experiments/babel21/source_kernel_probe.py experiments/babel21/sparse_source_dual.py /tmp/b21dual/
      - name: Rebuild rational cokernel and source syzygy remainder
        working-directory: /tmp/b21dual
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed ${{ matrix.seed }} --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python source_koszul.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python equal_source_syzygies.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Exact Q source rowspace test and all-cover-column replay if solved
        working-directory: /tmp/b21dual
        run: python sparse_source_dual.py --seed ${{ matrix.seed }} --maxcandidates 900
      - name: Archive exact full-cover dual or honest OPEN outcome
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-sparse-Q-dual-${{ matrix.seed }}
          path: /tmp/b21dual/babel21_*_sparse_dual_Q.json
          retention-days: 7
