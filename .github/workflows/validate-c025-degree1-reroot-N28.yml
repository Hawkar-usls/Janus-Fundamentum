name: validate-c025-degree1-reroot-N28

on:
  push:
    branches:
      - research/c025-balanced-pressure-wedge-2026-08-27
    paths:
      - 'research/C025_DEGREE1_REROOT_AND_NO_CAP_RESCUE_THROUGH_N28_2026-08-27.json'
      - 'experiments/direct/janus_degree1_reroot_N28_certificate.py'
      - '.github/workflows/validate-c025-degree1-reroot-N28.yml'
  pull_request:
    paths:
      - 'research/C025_DEGREE1_REROOT_AND_NO_CAP_RESCUE_THROUGH_N28_2026-08-27.json'
      - 'experiments/direct/janus_degree1_reroot_N28_certificate.py'
      - '.github/workflows/validate-c025-degree1-reroot-N28.yml'

jobs:
  degree1-reroot-N28:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact arithmetic regression
        run: python -m experiments.direct.janus_degree1_reroot_N28_certificate
      - name: Verify theorem scope and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('research/C025_DEGREE1_REROOT_AND_NO_CAP_RESCUE_THROUGH_N28_2026-08-27.json').read_text())
          assert d['status'] == 'PROVED_DEGREE1_REROOT_CORRIDOR__PROVED_NO_RAW_CAP_RESCUE_N_LE_28'
          assert d['P_VS_NP'] == 'OPEN'
          assert d['frozen_grammar_changed'] is False
          assert d['theorem_runtime_heuristics'] == 'FORBIDDEN'
          assert d['N28_legitimate_root_range']['status'] == 'PROVED'
          assert d['low_r_combined_recurrence']['status'] == 'PROVED_BY_EXISTING_RECURRENCE'
          assert d['high_r_degree1_corridor']['status'] == 'PROVED'
          assert d['degree1_elimination_reroot']['status'] == 'PROVED'
          assert d['cap_monotonicity']['status'] == 'PROVED'
          assert d['theorem']['status'] == 'PROVED'
          assert d['scientific_boundary']['does_not_prove_P_equals_NP'] is True
          assert d['scientific_boundary']['does_not_prove_unbounded_reachable_totality'] is True
          print('N28_DEGREE1_REROOT_SCOPE=PASS')
          print('THEOREM_RUNTIME_HEURISTICS=FORBIDDEN')
          print('P_VS_NP=OPEN')
          PY
