name: JANUS TRUMP R47K Extended Normalization Closure One Swap Falsifier

on:
  push:
    branches:
      - research/r47k-extended-normalization-closure-one-swap-falsifier-2026-09-03
  pull_request:
    branches:
      - research/r47j-normalization-fixpoint-restart-v25-gap-2026-09-03

jobs:
  r47k-falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration
        run: |
          python - <<'PY'
          import json, subprocess
          parent='d35af7abd27bfcef6f88cd96fb3fbc46ef8f8ba9'
          subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'], check=True)
          p='research/JANUS_TRUMP_R47K_EXTENDED_NORMALIZATION_CLOSURE_ONE_SWAP_FALSIFIER_PREREGISTRATION_2026-09-03.json'
          d=json.load(open(p))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['parent']['commit']==parent
          assert d['baseline']['R47J_extended_grammar_must_cover_R47I_counterexample'] is True
          assert d['baseline']['R47J_expected_accepted_pivots']==[13,25,28,29]
          assert d['epistemic_firewall']['O4_UNIVERSAL_COVERAGE_FOR_EXTENDED_GRAMMAR']=='OPEN'
          assert d['epistemic_firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['epistemic_firewall']['P_VS_NP']=='OPEN'
          assert d['epistemic_firewall']['TRUMP_finished'] is False
          PY
      - name: Compile
        run: python -m py_compile experiments/janus_trump_r47k_extended_normalization_closure_one_swap_falsifier.py
      - name: Execute full frozen one-swap falsifier
        run: |
          PYTHONPATH=experiments python experiments/janus_trump_r47k_extended_normalization_closure_one_swap_falsifier.py | tee /tmp/r47k.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r47k.json'))
          assert d['gate']=='JANUS_TRUMP_R47K_EXTENDED_NORMALIZATION_CLOSURE_ONE_SWAP_FALSIFIER'
          assert d['verdict'] in {
              'EXPLICIT_REACHABLE_COUNTEREXAMPLE_TO_R47J_EXTENDED_FIXPOINT_CLOSURE_GRAMMAR_FOUND',
              'NO_COUNTEREXAMPLE_IN_FULL_FROZEN_ONE_SWAP_FRONTIER__EXTENDED_O4_STILL_OPEN',
          }
          r=d['regression']
          assert r['base_fixpoint_hash']=='3130377ee52a6d6abf01f44fdc5f1a96cf83d701e30f70debea26cd347b7a495'
          assert r['R47I_fixpoint_hash']=='c379fb11374c4259a736545f6652a417b6d98d016e9dcaed62d44d3740b71adb'
          assert r['old_R45A_accepted_pivots']==[]
          assert r['R47J_extended_accepted_pivots']==[13,25,28,29]
          assert d['firewall']['O4_UNIVERSAL_COVERAGE_FOR_EXTENDED_GRAMMAR']=='OPEN'
          assert d['firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['firewall']['P_VS_NP']=='OPEN'
          if d['first_counterexample'] is not None:
              assert d['metrics']['extended_macro_dead_fixpoints'] >= 1
              assert d['first_counterexample']['all_extended_macro_rows']
              assert not any(row.get('accepted',False) for row in d['first_counterexample']['all_extended_macro_rows'])
              assert d['first_counterexample']['mutated_original_formula']
              assert d['first_counterexample']['fixpoint_formula']
          else:
              assert d['metrics']['frontier_positions'] > 0
              assert d['hardest_covered'] is not None or d['metrics']['unique_reachable_fixpoints']==0
          print('R47K_GATE=PASS')
          print('R47K_VERDICT=', d['verdict'])
          print('R47K_METRICS=', json.dumps(d['metrics'], sort_keys=True))
          if d['first_counterexample'] is not None:
              print('R47K_COUNTEREXAMPLE=', json.dumps(d['first_counterexample'], sort_keys=True))
          else:
              print('R47K_HARDEST=', json.dumps(d['hardest_covered'], sort_keys=True))
          PY
