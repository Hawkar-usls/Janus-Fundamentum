          s=re.sub(r'## Startup sequence\n.*?\n## Anti-loop test',startup+'\n## Anti-loop test',s,flags=re.S)
          s=s.replace('Nine downward scoped subproblems are now closed','Ten downward scoped subproblems are now closed')
          needle='9. **predecessor-open mixed/non-affine 3+ relation components under one frozen guarded elimination order**: before every bucket expansion, require the explicit row-count product to be `<= L^2`. Only admitted buckets are natural-joined and existentially projected. Successful output is `<= L^2` rows; overbudget buckets return `OPEN_BUCKET_PRODUCT_BUDGET` before enumeration. Candidate and an independent hash-join checker seal `PASS_SCOPED_BICAMERAL_GUARDED_BOUNDED_OUTPUT_ELIMINATION_V1` with a conservative fixed `O(L^6)` lifecycle/certificate envelope whose exponent is independent of relation count.\n'
          add='10. **target-component first private overbudget bucket with an exact raw common core**: compute `C = intersection scope(F_i)` and `S = intersection pi_C(F_i)` before materialization. Empty `S` is exact UNSAT; otherwise semijoin-filter original rows by `S`, preserving every non-core coordinate, then reapply the unchanged v3.2 `L^2` guard. v1 first-failure and control-diagnostic history are preserved; v1.1 seals `PASS_SCOPED_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1_1`.\n'
          if add not in s: s=s.replace(needle,needle+add)
          s=s.replace('Do **not** repeat the nine closed mechanisms as the current blocker.','Do **not** repeat the ten closed mechanisms as the current blocker.')
          blocker='''Current scoped open surface:\n\n`PREDECESSOR_OPEN_OVERBUDGET_BUCKET_AFTER_EXACT_COMMON_CORE_SEMIJOIN_WITH_NONEMPTY_SUPPORT_AND_FILTERED_PRODUCT_GREATER_THAN_L2_AND_NO_OTHER_SEALED_STRUCTURE`.\n\nThe next preferred gate is:\n\n`TRUMP_BICAMERAL_BUCKET_PARTIAL_OVERLAP_FACTOR_OR_CONGRUENCE_FALSIFIER_GATE`.\n\nCaptain Obvious' current directive is: **stop multiplying factor-local payloads**. The common-core consistency problem is closed for the scoped v3.4 door. The next unresolved bucket has a nonempty exact common support, but even after semijoin filtering its explicit row product remains above the frozen `L^2` envelope. Search for an exact factorized payload portfolio, bounded-width partial-overlap carrier, finite exact congruence with polynomially many reachable classes, provenance-preserving reverse morph/few-alien escape, or another preregistered pre-materialization representation. Preserve all externally observable payload variables and exact witness reconstruction.\n\nForbidden shortcuts include raising `L^2`, enumerating the filtered Cartesian product and compressing afterward, dropping non-core payload variables, searching exponentially many orders, treating the sticky OPEN control as negative evidence, or claiming general bucket compression.\n\n'''
          s=re.sub(r'Current scoped open surface:\n.*?\n## Context sources',blocker+'## Context sources',s,flags=re.S)
          sp.write_text(s,encoding='utf-8')
          PY
