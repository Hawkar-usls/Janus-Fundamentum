    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch START_HERE and manifest without truncating history
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          # Manifest: mutate existing complete JSON in place.
          mp=Path('registry/TRUMP_CONTEXT_MANIFEST.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
