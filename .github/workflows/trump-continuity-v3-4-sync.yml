            'next_gate_candidate':'TRUMP_BICAMERAL_BUCKET_PARTIAL_OVERLAP_FACTOR_OR_CONGRUENCE_FALSIFIER_GATE',
            'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json'
          }
          m.setdefault('mechanisms',{})['BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER']={
            'aliases':['Common-core semijoin prefilter','Exact common-core support intersection','TRUMP_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_FALSIFIER_GATE'],
            'role':'Before materializing an overbudget target-component bucket, derive the raw common variable core C, intersect explicit projection supports on C, reject exact empty support, otherwise semijoin-filter original rows while preserving all non-core coordinates and hand off to the unchanged sealed v3.2 L^2 guarded engine.',
            'classification':'SUCCESSOR_REPAIR_OF_V3_2_GUARDED_ELIMINATION_DRIVEN_BY_V3_3_CAPTAIN_FORENSIC',
            'fundamentum_binding':{
              'v1_preregistration_commit':'3052c66fa2a95871ebf4cd7f145e9582e71a6c24',
              'v1_candidate_commit':'196a5594b8b0fc2ac225cb456e8936315cda7458',
              'v1_candidate_blob':'f103bf9b14e3b208200f429b75d0858c4963fa7c',
              'v1_first_failure_run':34972555416,
              'v1_first_failure_job':104392129868,
              'v1_first_failure_commit':'2fd0d96823fc7f752808f0d7bd4204dba4f255e0',
              'v1_control_diagnostic_run':34972746081,
              'v1_control_diagnostic_job':104392774692,
              'v1_control_diagnostic_result_commit':'471f30b519c6c42648e28dd98ca1a69005702980',
              'v1_1_preregistration_commit':'2aaaf5c8cdea020a36bdd1a7ecb86ce65015bfae',
              'v1_1_wrapper_commit':'223f04ff99893fd326f75c8ee51691800ab342bc',
              'v1_1_independent_checker_commit':'3a1c38a6ec3bdf472e8311ce8c42bf351e1bcf17',
              'v1_1_run':34973121868,
              'v1_1_job':104394027076,
              'theorem_seal_commit':'a71c37f1fa80bfb168cdb8206b2e431faefb6a39',
              'result_commit':'77dd5dfa9f8fc37052ec1615d67147152d2adc10',
              'journal_commit':'fe75d1c72b88251b2ead6c98934c6cb2a5fd8f7d',
              'verdict':'PASS_SCOPED_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1_1',
              'latest_state':'registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json'
            },
            'closed_scope':'Target-component first private overbudget buckets of original explicit relation factors where exact common-core support intersection is empty, or semijoin filtering reduces the explicit bucket product sufficiently for the sealed v3.2 guarded engine to admit. No non-core payload variable is projected away.',
            'negative_authority':'A sticky control retains nonempty common support but filtered product 1099511627776 > L^2 and remains OPEN with zero failed-bucket enumeration.',
            'current_successor_blocker':'After exact common-core semijoin, nonempty support remains but factor-local/partial-overlap multiplicity keeps the filtered bucket product above L^2.'
          }
          m.setdefault('anti_loop_contract',{}).setdefault('never',[])
          for x in [
            'rediscover common-core projection-support intersection semijoin as if new after v3.4',
            'project away factor-local payload variables merely because they are outside the common core',
            'treat sticky common-core OPEN as negative complexity evidence'
          ]:
            if x not in m['anti_loop_contract']['never']: m['anti_loop_contract']['never'].append(x)
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          # START_HERE: regenerate startup block, append closed item 10, replace active blocker section.
          sp=Path('START_HERE_TRUMP_CONTEXT.md')
          s=sp.read_text(encoding='utf-8')
          startup='''## Startup sequence\n\n1. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.4.json` **first**. This is the latest successor-state anchor and seals the scoped common-core support-intersection / semijoin prefilter PASS, preserving the v1 first failure and v1.1 repair lineage.\n2. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.3.json` for Captain Obvious first-overbudget-bucket forensic evidence: raw product `557256278016`, shared 20-variable core, and exact compatibility collapse `3 -> 3 -> 1 -> 0`.\n3. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.2.json` for the scoped guarded bounded-output elimination PASS and frozen `L^2` pre-expansion resource envelope.\n4. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.1.json` for the immutable all-affine diagnostic and `SUPERSEDED_ROUTE` conclusion.\n5. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v3.0.json` for the two-relation no-full-cut-anchor derived boundary-factor PASS.\n6. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.9.json` for the full-cut-anchor multi-relation join-tree PASS.\n7. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.8.json` for the overwidth cut-support intersection carrier PASS.\n8. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.7.json` for canonical min-variable-cut log-width PASS and its immutable first failure.\n9. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.6.json` for the fixed-size two-variable separator PASS.\n10. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.5.json` for the single-variable Hrain/iNaiHR bicameral explanation PASS.\n11. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.4.json` for scoped raw compositional basis induction.\n12. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.3.json` for label-blind fixed-library raw relation basis induction.\n13. Read `registry/TRUMP_CURRENT_STATE_2026-09-15_v2.2.json` for the Inverted-Pyramid / admission-before-transfer diagnostic.\n14. Read `registry/TRUMP_CURRENT_STATE_2026-09-15.json` for the wide-inter