name: BABEL-17 combined exact seven-frequency compatibility
on:
  push:
    branches: ['research/babel17-*']
    paths: ['experiments/babel17/janus_babel17_union.py','.github/workflows/babel17-union.yml']
  pull_request:
    paths: ['experiments/babel17/janus_babel17_union.py','.github/workflows/babel17-union.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-source-syzygy-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact calculation dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Expand frozen source and controls
        run: |
          mkdir -p /tmp/babel17u
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17u
          unzip -q experiments/babel15/BABEL15_SEED1_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel17u
          unzip -q experiments/babel16/BABEL16_SEED3_CANONICAL_TRANSFER_BARRIER_20261020.zip -d /tmp/babel17u
          cp experiments/babel17/janus_babel17_*.py /tmp/babel17u/
      - name: Compute exact equal-column compatibility
        working-directory: /tmp/babel17u
        run: python janus_babel17_syzygy.py
      - name: Compute exact Koszul compatibility
        working-directory: /tmp/babel17u
        run: python janus_babel17_koszul.py
      - name: Verify combined exact source-zero compatibility
        working-directory: /tmp/babel17u
        run: python janus_babel17_union.py
      - name: Archive reproducible exact combined compatibility
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel17-combined-seven-coordinate-compatibility
          path: /tmp/babel17u/babel17_SEED3_COMBINED_COMPATIBILITY.json
          retention-days: 7
