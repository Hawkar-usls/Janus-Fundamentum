name: R5 Universal Legal SCL Constant Pin Gadget
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_scl_pin_to_unpinned_constant_gadget.py'
      - '.github/workflows/r5-universal-scl-pin-compiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    name: SCL10 SCL11 source transfer, affine SCL9 pin multiplicity and hard source legality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact constant gadget matrices and original square-cubic-linear pin compiler
        run: python -u experiments/r5_universal_scl_pin_to_unpinned_constant_gadget.py
