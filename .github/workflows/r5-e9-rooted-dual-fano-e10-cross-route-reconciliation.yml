name: R5 E9 Rooted dual-Fano E10 reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_ROOTED_DUAL_FANO_E10_CROSS_ROUTE_RECONCILIATION_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_rooted_dual_fano_e10_cross_route_reconciliation.py'
      - '.github/workflows/r5-e9-rooted-dual-fano-e10-cross-route-reconciliation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_rooted_dual_fano_e10_cross_route_reconciliation.py
      - name: Replay exact control
        run: python experiments/r5_e9_rooted_dual_fano_e10_cross_route_reconciliation.py
