name: Validate C032 PS-width Alignment

on:
  push:
    paths:
      - "experiments/direct/janus_c032_ps_width_alignment.py"
      - "docs/C032_PS_WIDTH_ALIGNMENT.md"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - "proposals/C032-JANUS-PS-WIDTH-ALIGNMENT.json"
      - "registry/references-c032.json"
      - ".github/workflows/validate-c032-ps-width-alignment.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c032_ps_width_alignment.py"
      - "docs/C032_PS_WIDTH_ALIGNMENT.md"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - "proposals/C032-JANUS-PS-WIDTH-ALIGNMENT.json"
      - "registry/references-c032.json"
      - ".github/workflows/validate-c032-ps-width-alignment.yml"

permissions:
  contents: read

jobs:
  ps-width-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c032_ps_width_alignment.py --self-test
