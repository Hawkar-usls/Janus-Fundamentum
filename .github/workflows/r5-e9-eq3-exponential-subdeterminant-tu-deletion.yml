name: R5 E9 EQ3 subdeterminant and TU-deletion barrier

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_EQ3_EXPONENTIAL_SUBDETERMINANT_AND_LINEAR_TU_DELETION_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_eq3_exponential_subdeterminant_tu_deletion.py'
      - '.github/workflows/r5-e9-eq3-exponential-subdeterminant-tu-deletion.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_eq3_exponential_subdeterminant_tu_deletion.py
      - name: Replay determinant packing controls
        run: python experiments/r5_e9_eq3_exponential_subdeterminant_tu_deletion.py
