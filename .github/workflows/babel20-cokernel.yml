name: BABEL-20 exact all-column rational cokernel audit
on:
  push:
    branches: ['research/babel20-*']
    paths: ['experiments/babel20/exact_cokernel.py','.github/workflows/babel20-cokernel.yml']
  pull_request:
    paths: ['experiments/babel20/exact_cokernel.py','.github/workflows/babel20-cokernel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rational-quotient-audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {base: SCL63, seed: 38}
          - {base: SCL126_flip16, seed: 14}
          - {base: SCL126_flip16, seed: 20}
          - {base: SCL126_flip16, seed: 37}
          - {base: SCL126_flip68, seed: 16}
          - {base: SCL126_flip68, seed: 20}
          - {base: SCL126_flip68, seed: 28}
          - {base: SCL126_flip68, seed: 47}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen scientific prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Unpack frozen source constructors
        run: |
          mkdir -p /tmp/b20q
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b20q
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py /tmp/b20q/
      - name: Build legal independent modular pivots
        working-directory: /tmp/b20q
        run: python crossbase_rank2.py --base-name ${{ matrix.base }} --seed ${{ matrix.seed }} --prime 65521 --passes 4
      - name: Reconstruct exact Q rank and rational all-column cokernel
        working-directory: /tmp/b20q
        run: python exact_cokernel.py --base ${{ matrix.base }} --seed ${{ matrix.seed }}
      - name: Preserve exact quotient diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel20-cokernel-${{ matrix.base }}-${{ matrix.seed }}
          path: /tmp/b20q/babel20_*.json.gz
          retention-days: 7
