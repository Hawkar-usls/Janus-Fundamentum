name: JANUS TIME-SAT-PARTIAL-002 selective admission versus strong CDCL

on:
  push:
    paths:
      - 'experiments/direct/janus_time_sat_partial_002*.py'
      - 'tests/test_time_sat_partial_002.py'
      - 'docs/TIME_SAT_PARTIAL_002_RESEARCH.md'
      - '.github/workflows/validate-time-sat-partial-002.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_time_sat_partial_002*.py'
      - 'tests/test_time_sat_partial_002.py'
      - 'docs/TIME_SAT_PARTIAL_002_RESEARCH.md'
      - '.github/workflows/validate-time-sat-partial-002.yml'

permissions:
  contents: read

concurrency:
  group: time-sat-002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strong-sat-admission-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 12
    steps:
      - name: Checkout SHA-pinned JANUS research
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact third-party CDCL dependency
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Test four-arm gate, false hints and interrupted probe safety
        run: python -m unittest discover -s tests -p 'test_time_sat_partial_002.py' -v
      - name: Preserve TIME-SAT-PARTIAL-001 correctness and Exact-One encoding
        run: python -m unittest discover -s tests -p 'test_time_sat_partial_001.py' -v
      - name: Preserve independent legacy C023 proof verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Same 65 public cases + three mechanism controls, actual CaDiCaL and Glucose
        run: >-
          python experiments/direct/janus_time_sat_partial_002_benchmark.py
          --out evidence/time-sat-partial-002-${{ matrix.os }}.json
      - name: Preserve per-case samples, CI and all null/negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-partial-002-${{ matrix.os }}
          path: evidence/time-sat-partial-002-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 30
