name: TRUMP E8 minimal 3D occurrence linear lift

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_MINIMAL_3D_OCCURRENCE_LINEAR_LIFT_2026-09-30_v2.9.json'
      - 'research/tools/e8_minimal_3d_occurrence_linear_lift/checker.py'
      - '.github/workflows/trump-e8-minimal-3d-occurrence-linear-lift.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact sparse 3D lift regression
        run: python research/tools/e8_minimal_3d_occurrence_linear_lift/checker.py
