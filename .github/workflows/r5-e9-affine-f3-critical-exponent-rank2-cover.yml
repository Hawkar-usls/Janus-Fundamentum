name: R5 E9 Affine F3 Critical Exponent Rank2 Cover

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_CRITICAL_EXPONENT_RANK2_COVER_TERMINAL_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_critical_exponent_rank2_cover_terminal.py'
      - '.github/workflows/r5-e9-affine-f3-critical-exponent-rank2-cover.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact critical exponent / rank-2 cover regression
        run: python experiments/r5_e9_affine_f3_critical_exponent_rank2_cover_terminal.py
