name: TRUMP E8 Two-Blade Nondecomposability

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TWO_BLADE_NONDECOMPOSABILITY_BARRIER_2026-09-30_v2.6.json'
      - 'research/tools/e8_two_blade_nondecomposability/checker.py'
      - '.github/workflows/trump-e8-two-blade-nondecomposability.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact two-blade nondecomposability checker
        run: python research/tools/e8_two_blade_nondecomposability/checker.py
