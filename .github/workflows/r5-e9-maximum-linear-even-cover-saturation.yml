name: R5 E9 Maximum linear even-cover saturation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_MAXIMUM_LINEAR_EVEN_COVER_SATURATION_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_maximum_linear_even_cover_saturation.py'
      - '.github/workflows/r5-e9-maximum-linear-even-cover-saturation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_maximum_linear_even_cover_saturation.py
      - name: Replay finite controls
        run: python experiments/r5_e9_maximum_linear_even_cover_saturation.py
