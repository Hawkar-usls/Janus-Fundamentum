name: R5 E9 Two-Edge Unique-Model F3 Parallel Collapse

on:
  pull_request:
    paths:
      - 'research/R5_E9_TWO_EDGE_UNIQUE_MODEL_F3_PARALLEL_COLLAPSE_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_two_edge_unique_model_f3_parallel_collapse.py'
      - '.github/workflows/r5-e9-two-edge-unique-model-f3-parallel-collapse.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact tower collapse regression
        run: python experiments/r5_e9_two_edge_unique_model_f3_parallel_collapse.py
