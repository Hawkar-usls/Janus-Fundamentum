name: R5 E9 Affine F3 Four-Hyperplane Cover Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PROJECTIVELY_DISTINCT_FOUR_HYPERPLANE_COVER_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_projectively_distinct_four_hyperplane_cover_barrier.py'
      - '.github/workflows/r5-e9-affine-f3-projectively-distinct-four-hyperplane-cover-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact F3 cover regression
        run: python experiments/r5_e9_affine_f3_projectively_distinct_four_hyperplane_cover_barrier.py
