name: R5 All SCL Rank Two Matched Holant
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_all_scl_perfect_matching_rank2_network.py'
      - '.github/workflows/r5-all-scl-rank-two-matched-holant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-scl-ranked:
    name: 'Source-authenticated universal rank2 quartic network and independent finite controls'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Hall pairing, source witness bijection, exact local matchgate sums and tamper resistance
        run: python -u experiments/r5_universal_all_scl_perfect_matching_rank2_network.py
