name: TRUMP E8 projected-linear pair decomposition three-way barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PROJECTED_LINEAR_PAIR_DECOMPOSITION_THREEWAY_BARRIER_2026-09-26_v2.0.json'
      - 'research/tools/e8_projected_linear_pair_threeway/checker.py'
      - '.github/workflows/trump-e8-projected-linear-pair-threeway.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_projected_linear_pair_threeway/checker.py
