name: R5 E9 AF3 EQ3 Global APSQ Factorization

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_EQ3_GLOBAL_APSQ_FACTORIZATION_SOURCE_RETURN_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_eq3_global_apsq_factorization.py'
      - '.github/workflows/r5-e9-af3-eq3-global-apsq-factorization.yml'
  workflow_dispatch:

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact global AF3 EQ3 APSQ factorization regression
        run: python experiments/r5_e9_af3_eq3_global_apsq_factorization.py
