name: R5 Universal Boolean PC Degree3 Global Attack
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_boolean_pc_degree3_global_attack.py'
      - '.github/workflows/r5-universal-boolean-pc3-global-attack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc3-exact-unsat-certificate:
    name: GF2 Boolean PC3 linear certificate, NOT P=NP proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact degree-2 and degree-3 polynomial calculus on legal SCL SAT and UNSAT
        run: python -u experiments/r5_universal_boolean_pc_degree3_global_attack.py
