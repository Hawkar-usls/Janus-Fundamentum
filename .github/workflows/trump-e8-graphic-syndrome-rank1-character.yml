name: TRUMP E8 Graphic Syndrome Rank1 Character

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GRAPHIC_SYNDROME_RANK1_CHARACTER_SURJECTIVITY_BARRIER_2026-09-30_v5.7.json'
      - 'research/tools/e8_graphic_syndrome_rank1_character/checker.py'
      - '.github/workflows/trump-e8-graphic-syndrome-rank1-character.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rank-one syndrome regression
        run: python research/tools/e8_graphic_syndrome_rank1_character/checker.py
