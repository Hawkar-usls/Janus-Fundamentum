name: Validate C024 Component Merges

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_novel_branch_audit_v2.py"
      - "experiments/direct/janus_tear_gt_component_merge_accounting.py"
      - "experiments/direct/janus_tear_gt_component_merge_sources.py"
      - "experiments/direct/janus_tear_gt_unit_merge_timing.py"
      - "experiments/direct/janus_tear_gt_target_frontier_collision.py"
      - "experiments/direct/janus_tear_gt_unit_merge_root_ancestry.py"
      - "experiments/direct/janus_tear_gt_pre_unit_parent_provenance.py"
      - "experiments/direct/janus_tear_gt_pre_unit_recursive_provenance.py"
      - "experiments/direct/janus_tear_gt_pre_unit_novel_charge.py"
      - "experiments/direct/janus_tear_gt_global_clause_shrink_census.py"
      - ".github/workflows/validate-c024-component-merges.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_novel_branch_audit_v2.py"
      - "experiments/direct/janus_tear_gt_component_merge_accounting.py"
      - "experiments/direct/janus_tear_gt_component_merge_sources.py"
      - "experiments/direct/janus_tear_gt_unit_merge_timing.py"
      - "experiments/direct/janus_tear_gt_target_frontier_collision.py"
      - "experiments/direct/janus_tear_gt_unit_merge_root_ancestry.py"
      - "experiments/direct/janus_tear_gt_pre_unit_parent_provenance.py"
      - "experiments/direct/janus_tear_gt_pre_unit_recursive_provenance.py"
      - "experiments/direct/janus_tear_gt_pre_unit_novel_charge.py"
      - "experiments/direct/janus_tear_gt_global_clause_shrink_census.py"
      - ".github/workflows/validate-c024-component-merges.yml"

permissions:
  contents: read

jobs:
  component-merges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Hasse-component merge resources
        run: python experiments/direct/janus_tear_gt_component_merge_accounting.py
      - name: Verify exact source clauses for unit merges
        run: python experiments/direct/janus_tear_gt_component_merge_sources.py
      - name: Locate unit merges relative to novelty target
        run: python experiments/direct/janus_tear_gt_unit_merge_timing.py
      - name: Test exact-cache collisions on target frontier
        run: python experiments/direct/janus_tear_gt_target_frontier_collision.py
      - name: Classify direct root ancestry of pre-unit merges
        run: python experiments/direct/janus_tear_gt_unit_merge_root_ancestry.py
      - name: Trace pre-unit merges to parent clause provenance
        run: python experiments/direct/janus_tear_gt_pre_unit_parent_provenance.py
      - name: Recursively trace inherited pre-unit clauses
        run: python experiments/direct/janus_tear_gt_pre_unit_recursive_provenance.py
      - name: Charge inherited units to novel branches
        run: python experiments/direct/janus_tear_gt_pre_unit_novel_charge.py
      - name: Census all pre-frontier clause shrink events
        run: python experiments/direct/janus_tear_gt_global_clause_shrink_census.py
