name: R5 E9 PG15 Augmented Ternary Support-7 Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_PG15_AUGMENTED_TERNARY_FUNDAMENTAL_SUPPORT7_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_pg15_augmented_ternary_fundamental_support7_barrier.py'
      - '.github/workflows/r5-e9-pg15-augmented-ternary-fundamental-support7-barrier.yml'
  workflow_dispatch:

jobs:
  exact-basis-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact PG15 augmented-ternary basis census
        run: python experiments/r5_e9_pg15_augmented_ternary_fundamental_support7_barrier.py
