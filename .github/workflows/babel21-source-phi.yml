name: BABEL-21 exact residual source functional
on:
  push:
    branches: ['research/babel21-*']
    paths: ['experiments/babel21/source_phi.py','.github/workflows/babel21-source-phi.yml']
  pull_request:
    paths: ['experiments/babel21/source_phi.py','.github/workflows/babel21-source-phi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-functional:
    strategy:
      fail-fast: false
      matrix:
        seed: [20,37]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen scientific code prerequisites
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore exact source and Fourier quotient
        run: |
          mkdir -p /tmp/b21
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py experiments/babel21/source_phi.py /tmp/b21/
      - name: Reproduce independent source-zero quotient and syzygies
        working-directory: /tmp/b21
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed ${{ matrix.seed }} --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python source_koszul.py --base SCL126_flip16 --seed ${{ matrix.seed }}
          python equal_source_syzygies.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Extract the exact remaining source-functional
        working-directory: /tmp/b21
        run: python source_phi.py --base SCL126_flip16 --seed ${{ matrix.seed }}
      - name: Persist source module kernel query
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-source-phi-seed${{ matrix.seed }}
          path: /tmp/b21/babel21_*.json.gz
          retention-days: 7
