name: R5 E9 Paley Minus2 Orbit Post-RKPR Sqrt Nullity Family

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_MINUS2_ORBIT_POST_RKPR_SQRT_NULLITY_FAMILY_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_minus2_orbit_post_rkpr_sqrt_nullity_family.py'
      - '.github/workflows/r5-e9-paley-minus2-orbit-post-rkpr-sqrt-nullity-family.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Paley minus-two family regression
        run: python experiments/r5_e9_paley_minus2_orbit_post_rkpr_sqrt_nullity_family.py
