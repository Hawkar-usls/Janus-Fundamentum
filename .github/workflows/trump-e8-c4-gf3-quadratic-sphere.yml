name: TRUMP E8 C4 GF3 Quadratic Sphere

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_GF3_QUADRATIC_SPHERE_CARRIER_2026-09-30_v5.5.json'
      - 'research/tools/e8_c4_gf3_quadratic_sphere/checker.py'
      - '.github/workflows/trump-e8-c4-gf3-quadratic-sphere.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact GF3 quadratic sphere regression
        run: python research/tools/e8_c4_gf3_quadratic_sphere/checker.py
