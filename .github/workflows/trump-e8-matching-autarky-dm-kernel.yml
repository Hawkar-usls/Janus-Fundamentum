name: TRUMP E8 Matching Autarky DM Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_MATCHING_AUTARKY_DM_KERNEL_AND_TOVEY_LEAN_BARRIER_2026-09-30_v4.6.json'
      - 'research/tools/e8_matching_autarky_dm_kernel/checker.py'
      - '.github/workflows/trump-e8-matching-autarky-dm-kernel.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact matching-autarky DM regression
        run: python research/tools/e8_matching_autarky_dm_kernel/checker.py
