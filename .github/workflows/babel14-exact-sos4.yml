name: BABEL-14 exact rational SOS4 seed2 replay

on:
  pull_request:
    paths:
      - 'experiments/babel14/**'
      - '.github/workflows/babel14-exact-sos4.yml'
  push:
    branches:
      - 'research/babel14-*'
    paths:
      - 'experiments/babel14/**'
      - '.github/workflows/babel14-exact-sos4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Expand source and proof bundle
        run: |
          mkdir -p /tmp/babel14-proof
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel14-proof
      - name: Independently verify frozen source rational Krylov identity
        working-directory: /tmp/babel14-proof
        run: |
          python janus_babel8_krylov_verify.py \
            babel9_BALANCED_BIT68_DEGREE4_KRYLOV.json \
            --output babel14_SEED2_SOURCE_KRYLOV_REPLAY.json
      - name: Verify compact 425+19 anti-sector transfer
        working-directory: /tmp/babel14-proof
        run: |
          python janus_babel14_exact_transfer.py \
            --verify babel14_SEED2_EXACT_RATIONAL_TRANSFER_CIRCUIT.json
      - name: Reconstruct full exact rational certificate
        working-directory: /tmp/babel14-proof
        run: |
          python janus_babel14_expand_exact.py \
            --report babel14_SEED2_EXPLICIT_RATIONAL_SOS4_PASS.json
      - name: Independently verify all Fourier frequencies
        working-directory: /tmp/babel14-proof
        run: |
          python janus_babel14_expand_exact.py --verify-only \
            --report babel14_SEED2_INDEPENDENT_FOURIER_REPLAY.json
          python -m unittest test_janus_babel14.py -v
      - name: Archive regenerated complete integer certificate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel14-seed2-full-rational-identity
          path: |
            /tmp/babel14-proof/babel14_SEED2_EXPLICIT_INTEGER_IDENTITY.json.gz
            /tmp/babel14-proof/babel14_SEED2_EXPLICIT_RATIONAL_SOS4_PASS.json
            /tmp/babel14-proof/babel14_SEED2_INDEPENDENT_FOURIER_REPLAY.json
            /tmp/babel14-proof/babel14_SEED2_SOURCE_KRYLOV_REPLAY.json
          retention-days: 7
