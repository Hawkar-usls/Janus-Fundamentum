name: R5 GF3 Algebraic Zero Frontier Unified Source Proof
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_triple_cut_degree2_gf3_certificate.py'
      - 'experiments/r5_universal_gf3_boolean_degree2_pc_frontier.py'
      - 'experiments/r5_universal_gf3_boolean_degree3_pc_probe.py'
      - 'experiments/r5_universal_gf3_degree3_petersen_source_certificate.py'
      - 'experiments/r5_universal_gf3_degree3_adversarial_scl27_search.py'
      - 'research/R5_GF3_POLYNOMIAL_CALCULUS_SOURCE_CERTIFICATE_FRONTIER_2026-10-13.md'
      - '.github/workflows/r5-gf3-algebraic-zero-unified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra-proof:
    name: All original source GF3 degree2 dual and Petersen degree3 cert
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fano covers large girth degree2 source Nullstellensatz
        run: python -u experiments/r5_universal_triple_cut_degree2_gf3_certificate.py
      - name: Exact degree2 original-source certificates and independent dual
        run: python -u experiments/r5_universal_gf3_boolean_degree2_pc_frontier.py
      - name: Original-source Petersen degree3 certificate and forgery rejection
        run: python -u experiments/r5_universal_gf3_degree3_petersen_source_certificate.py
      - name: Deterministic original SCL27 adversarial source search and degree3 fence
        run: python -u experiments/r5_universal_gf3_degree3_adversarial_scl27_search.py
