name: TRUMP E8 local valuated matching penalty barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_LOCAL_VALUATED_MATCHING_PENALTY_BARRIER_2026-09-30_v2.8.json'
      - 'research/tools/e8_local_valuated_matching_penalty_barrier/checker.py'
      - '.github/workflows/trump-e8-local-valuated-matching-penalty-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact local valuated penalty regression
        run: python research/tools/e8_local_valuated_matching_penalty_barrier/checker.py
