name: Validate C024 Branch Bridge Exposure Profile

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_branch_bridge_exposure_profile.py"
      - ".github/workflows/validate-c024-branch-bridge-exposure-profile.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_branch_bridge_exposure_profile.py"
      - ".github/workflows/validate-c024-branch-bridge-exposure-profile.yml"

permissions:
  contents: read

jobs:
  branch-bridge-exposure-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile rare bridge exposures and inherited transient extinction
        run: python experiments/direct/janus_tear_gt_branch_bridge_exposure_profile.py
