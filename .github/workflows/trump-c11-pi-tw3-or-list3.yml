name: TRUMP C11 PI Treewidth3 or List3 Terminal Gate

on:
  pull_request:
    branches:
      - research/general-sat-universal-coverage-map-2026-09-19
    paths:
      - 'research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_RUN_TRIGGER_2026-09-20_v1.0.json'
      - 'research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json'
      - 'research/tools/c11_pi_tw3_or_list3/**'
      - '.github/workflows/trump-c11-pi-tw3-or-list3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind frozen authority
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            74aa6d527fc621aeb1074e1b78230b03ff4a9a03 \
            7a6c7127b4ebe16c61000b3e49809fad85aaf33a \
            d2d698ba741fba5d1ccfb31378be1024de4179dc \
            660675dba90f7fea51518be0514cc722b15a89a2 \
            e74f22afac7f124a7917dfd22e2641c3a92dfa32 \
            cf5208892c3a7af31e55a5d124171a9e07a53c45
          do
            git merge-base --is-ancestor "$sha" HEAD
          done
          test "$(git rev-parse 74aa6d527fc621aeb1074e1b78230b03ff4a9a03:research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_PREREG_2026-09-20_v1.0.json)" = "a3efd8187bb917a2b2b058bdd6f2ae5cd2e208ba"
          python -m py_compile \
            research/tools/c11_pi_tw3_or_list3/terminal_checker.py \
            research/tools/c11_pi_tw3_or_list3/independent_verifier.py

      - name: Run frozen X2 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tw3gate
          python research/tools/c11_pi_tw3_or_list3/terminal_checker.py \
            --prereg research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_PREREG_2026-09-20_v1.0.json \
            --freeze research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json \
            --tw3-terminal research/TRUMP_TREEWIDTH3_LIST_COLORING_TERMINAL_RESULT_2026-09-20_v1.0.json \
            --out tw3gate/run \
            | tee tw3gate/candidate.stdout

      - name: Independent replay
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/c11_pi_tw3_or_list3/independent_verifier.py \
            --candidate tw3gate/run/candidate_result.json \
            --freeze research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json \
            --out tw3gate/independent.json \
            | tee tw3gate/independent.stdout

      - name: Assemble scientific manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path("tw3gate")
          cand=json.loads((root/"run/candidate_result.json").read_text())
          indep=json.loads((root/"independent.json").read_text())
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()

          assert cand["primary_outcome"]=="X2_TW3_FORBIDDEN_MINOR_FOUR_COLOR_RESIDUAL"
          assert cand["X1"]["status"]=="FALSIFIED_BY_AUTHORITATIVE_X2_COMPONENT"
          assert cand["X2"]["status"]=="VERIFIED"
          assert cand["X2"]["selected_forbidden_minor"]=="OCTAHEDRON"
          assert cand["positive_K4_TW3_control"]["pass"] is True
          assert all(x["pass"] for x in cand["forbidden_minor_classifier_controls"].values())
          assert indep["verdict"]=="INDEPENDENT_X2_TW3_FORBIDDEN_MINOR_RESIDUAL_VERIFIED"
          assert cand["repair_attempted"] is False
          assert cand["successor_autoactivated"] is False
          assert cand["stop"] is True

          manifest={
            "schema":"janus.trump.c11_pi_tw3_or_list3.scientific_manifest.v1",
            "workflow_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "frozen_preregistration":{
              "commit":"74aa6d527fc621aeb1074e1b78230b03ff4a9a03",
              "content_blob":"a3efd8187bb917a2b2b058bdd6f2ae5cd2e208ba"
            },
            "execution_freeze_commit":"660675dba90f7fea51518be0514cc722b15a89a2",
            "implementation_commits":{
              "candidate_checker":"e74f22afac7f124a7917dfd22e2641c3a92dfa32",
              "independent_verifier":"cf5208892c3a7af31e55a5d124171a9e07a53c45"
            },
            "outcome":"X2_TW3_FORBIDDEN_MINOR_FOUR_COLOR_RESIDUAL",
            "authority_checks":cand["authority_checks"],
            "route34":cand["route34"],
            "positive_K4_TW3_control":cand["positive_K4_TW3_control"],
            "forbidden_minor_classifier_controls":cand["forbidden_minor_classifier_controls"],
            "X1":cand["X1"],"X2":cand["X2"],"X3":cand["X3"],
            "minimization":cand["minimization"],
            "independent_replay":{
              "verdict":indep["verdict"],
              "receipt_sha256":sha(root/"independent.json")
            },
            "candidate_receipt_sha256":sha(root/"run/candidate_result.json"),
            "source_digests":{
              "candidate_checker_sha256":sha("research/tools/c11_pi_tw3_or_list3/terminal_checker.py"),
              "independent_verifier_sha256":sha("research/tools/c11_pi_tw3_or_list3/independent_verifier.py"),
              "execution_freeze_sha256":sha("research/TRUMP_C11_PI_TREEWIDTH3_OR_LIST3_TERMINAL_GATE_EXECUTION_FREEZE_2026-09-20_v1.0.json")
            },
            "oracle_use":cand["oracle_use"],
            "scientific_ceiling":cand["scientific_ceiling"],
            "forbidden_interpretations":cand["forbidden_interpretations"],
            "repair_attempted":False,
            "successor_autoactivated":False,
            "stop":True
          }
          (root/"scientific_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
            "outcome":"X2_TW3_FORBIDDEN_MINOR_FOUR_COLOR_RESIDUAL",
            "minor":"OCTAHEDRON",
            "X1":"FALSIFIED_BY_COUNTERCOMPONENT",
            "independent":indep["verdict"]
          },sort_keys=True))
          PY

      - name: Assert ceiling and stop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open("tw3gate/scientific_manifest.json"))
          assert m["outcome"]=="X2_TW3_FORBIDDEN_MINOR_FOUR_COLOR_RESIDUAL"
          assert m["scientific_ceiling"]["TW4"]=="NOT_OPENED"
          assert m["scientific_ceiling"]["BACKDOOR_SIZE_2"]=="NOT_OPENED"
          assert m["scientific_ceiling"]["REPAIR"]=="NOT_STARTED"
          assert m["scientific_ceiling"]["NEW_DESCRIPTOR"]=="NOT_DEFINED"
          assert m["scientific_ceiling"]["LEMMA11_P7_LIFT"]=="OPEN"
          assert m["scientific_ceiling"]["P7_FREE_4_COLOR_IN_P"]=="NOT_PROVED"
          assert m["scientific_ceiling"]["P_VS_NP"]=="OPEN"
          assert m["repair_attempted"] is False
          assert m["successor_autoactivated"] is False
          assert m["stop"] is True
          print("STOP_CEILING_PASS")
          PY

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: trump-c11-pi-tw3-or-list3-terminal-gate-v1
          path: tw3gate/
          if-no-files-found: error
          retention-days: 90
