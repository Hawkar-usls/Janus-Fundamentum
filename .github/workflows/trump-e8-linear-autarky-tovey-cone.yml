name: TRUMP E8 Linear Autarky Tovey Cone

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_LINEAR_AUTARKY_LP_KERNEL_AND_TOVEY_CONE_SOURCE_RETURN_2026-09-30_v4.7.json'
      - 'research/tools/e8_linear_autarky_tovey_cone/checker.py'
      - '.github/workflows/trump-e8-linear-autarky-tovey-cone.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact linear-autarky Tovey cone regression
        run: python research/tools/e8_linear_autarky_tovey_cone/checker.py
