name: R5 Petersen Sixpole Boolean Gate Native SCL72
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_petersen_6pole_boolean_atmostone_exact_source.py'
      - '.github/workflows/r5-petersen-sixpole-boolean-atmostone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-sixpole:
    name: Petersen at-most-one and C6 XOR exact source SAT witness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every open boundary and all closed native SCL72 witnesses
        run: python -u experiments/r5_universal_petersen_6pole_boolean_atmostone_exact_source.py
