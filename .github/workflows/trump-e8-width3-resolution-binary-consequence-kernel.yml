name: TRUMP E8 Width3 Resolution Binary Consequence Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_WIDTH3_RESOLUTION_BINARY_CONSEQUENCE_KERNEL_2026-09-30_v3.9.json'
      - 'research/tools/e8_width3_resolution_binary_consequence_kernel/checker.py'
      - 'research/tools/e8_terminal_rank3_implication_primitive_normal_form/checker.py'
      - '.github/workflows/trump-e8-width3-resolution-binary-consequence-kernel.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact width-3 resolution kernel regression
        run: python research/tools/e8_width3_resolution_binary_consequence_kernel/checker.py
