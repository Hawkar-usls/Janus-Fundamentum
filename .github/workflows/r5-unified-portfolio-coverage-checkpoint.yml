name: R5 Unified Portfolio Coverage Checkpoint
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'research/R5_JOINT_EXPERT_GLOBAL_COVERAGE_STRIKE_2026-10-12.md'
      - 'research/R5_GLOBAL_CONNECTED_SCL_TANNER_TWO_CUT_MOD3_BOUNDARY_PROOF_2026-10-12.md'
      - 'research/R5_UNIVERSAL_TWO_PORT_SIGNATURE_ALGEBRA_ATOMIC_NP_HARD_GATE_2026-10-12.md'
      - 'research/R5_ATOMIC_TANNER_3EDGE_CONNECTED_NP_COMPLETE_GATE_2026-10-12.md'
      - 'research/R5_ATOMIC_GF4_WALSH_POTTS_DUAL_AND_BRIDGE_CERT_GATE_2026-10-12.md'
      - 'experiments/r5_universal_atomic_gf4_cycle_cut_fourier_duality.py'
      - 'experiments/r5_universal_atomic_holyer_tanner_three_edge_npcomplete.py'
      - 'experiments/r5_universal_certified_two_port_signature_algebra.py'
      - 'experiments/r5_universal_two_port_atomic_signature_nphard_graft.py'
      - 'experiments/r5_universal_connected_scl_tanner_two_cut_proof_audit.py'
      - 'experiments/r5_universal_certified_expert_portfolio.py'
      - '.github/workflows/r5-unified-portfolio-coverage-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-head-replay:
    name: One HEAD proof-state + portfolio + full finite coverage replay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certified expert portfolio including original UNSAT proof replay
        run: python -u experiments/r5_universal_certified_expert_portfolio.py
      - name: Shared chronological PC3 ANDOR provenance and fixpoint replay
        run: python -u experiments/r5_universal_certified_shared_proof_state.py
      - name: Independent 11-family exact coverage matrix
        run: python -u experiments/r5_universal_certified_portfolio_coverage_matrix.py
      - name: Guarded state limits 0 n and n-squared
        run: python -u experiments/r5_universal_certified_portfolio_poly_budget_ladder.py
      - name: Strongest semantic width-two SAT witness obstruction
        run: python -u experiments/r5_universal_semantic_width2_fixpoint_barrier.py
      - name: All-input Tanner bridges two-cuts and exact source boundary pin derivation
        run: python -u experiments/r5_universal_connected_scl_tanner_two_cut_proof_audit.py
      - name: Exact two-port signatures with SAT glue and independently replayed UNSAT proofs
        run: python -u experiments/r5_universal_certified_two_port_signature_algebra.py
      - name: Original connected SCL to atomic two-port NP-hard graft preservation
        run: python -u experiments/r5_universal_two_port_atomic_signature_nphard_graft.py
      - name: Connected cubic graph to 3-edge-connected atomic Tanner SCL universal hardness gate
        run: python -u experiments/r5_universal_atomic_holyer_tanner_three_edge_npcomplete.py
      - name: Exact GF4 primal/dual Fourier/Tutte counts and bridge-certified atomic core
        run: python -u experiments/r5_universal_atomic_gf4_cycle_cut_fourier_duality.py
