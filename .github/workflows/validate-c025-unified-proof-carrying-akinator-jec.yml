name: Validate C025 Unified Proof-Carrying Akinator JEC

on:
  push:
    branches:
      - research/c025-unified-proof-carrying-akinator-jec
  pull_request:
    paths:
      - 'experiments/direct/janus_unified_proof_carrying_akinator_jec.py'
      - 'experiments/direct/janus_unified_family_probe.py'
      - 'tests/test_c025_unified_proof_carrying_akinator_jec.py'
      - 'research/C025_UNIFIED_PROOF_CARRYING_AKINATOR_JEC.md'
      - '.github/workflows/validate-c025-unified-proof-carrying-akinator-jec.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed unified selftest
        run: python experiments/direct/janus_unified_proof_carrying_akinator_jec.py
      - name: Compile check
        run: python -m py_compile experiments/direct/janus_unified_proof_carrying_akinator_jec.py experiments/direct/janus_unified_family_probe.py tests/test_c025_unified_proof_carrying_akinator_jec.py
      - name: Run adversarial exactness tests
        run: python tests/test_c025_unified_proof_carrying_akinator_jec.py
      - name: Run combined adversarial family probe
        run: python experiments/direct/janus_unified_family_probe.py
