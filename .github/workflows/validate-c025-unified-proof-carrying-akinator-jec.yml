name: Validate C025 Unified Proof-Carrying Akinator JEC

on:
  push:
    branches:
      - research/c025-unified-proof-carrying-akinator-jec
  pull_request:
    paths:
      - 'experiments/direct/janus_unified_proof_carrying_akinator_jec.py'
      - 'experiments/direct/janus_unified_family_probe.py'
      - 'experiments/direct/janus_unified_jec_ablation.py'
      - 'experiments/direct/janus_unified_macro_restore_v2.py'
      - 'experiments/direct/janus_unified_macro_restore_v3.py'
      - 'experiments/direct/janus_php54_macro_restore_attack.py'
      - 'experiments/direct/janus_php54_barrier_diagnostic.py'
      - 'experiments/direct/janus_php54_extension_tail_v3_attack.py'
      - 'tests/test_c025_unified_proof_carrying_akinator_jec.py'
      - 'research/C025_UNIFIED_PROOF_CARRYING_AKINATOR_JEC.md'
      - '.github/workflows/validate-c025-unified-proof-carrying-akinator-jec.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed unified selftest
        run: python experiments/direct/janus_unified_proof_carrying_akinator_jec.py
      - name: Compile check
        run: python -m py_compile experiments/direct/janus_unified_proof_carrying_akinator_jec.py experiments/direct/janus_unified_family_probe.py experiments/direct/janus_unified_jec_ablation.py experiments/direct/janus_unified_macro_restore_v2.py experiments/direct/janus_unified_macro_restore_v3.py experiments/direct/janus_php54_macro_restore_attack.py experiments/direct/janus_php54_barrier_diagnostic.py experiments/direct/janus_php54_extension_tail_v3_attack.py tests/test_c025_unified_proof_carrying_akinator_jec.py
      - name: Run adversarial exactness tests
        run: python tests/test_c025_unified_proof_carrying_akinator_jec.py
      - name: Run combined adversarial family probe
        run: python experiments/direct/janus_unified_family_probe.py
      - name: Run JEC causal ablation control
        run: python experiments/direct/janus_unified_jec_ablation.py
      - name: Run heuristic-free MACRO_RESTORE_CAP v2 selftest
        run: python experiments/direct/janus_unified_macro_restore_v2.py
      - name: Attack frozen PHP_5_4_C1 with exhaustive OR-pair JEC
        run: python experiments/direct/janus_php54_macro_restore_attack.py
      - name: Diagnose exact final PHP_5_4_C1 OPEN residual
        run: python experiments/direct/janus_php54_barrier_diagnostic.py
      - name: Run fixed-depth extension-tail v3 selftest
        run: python experiments/direct/janus_unified_macro_restore_v3.py
      - name: Attack frozen PHP_5_4_C1 extension tail with v3
        run: python experiments/direct/janus_php54_extension_tail_v3_attack.py
