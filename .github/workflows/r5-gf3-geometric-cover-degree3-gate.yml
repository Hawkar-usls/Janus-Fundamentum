name: R5 GF3 Symplectic Cover and Degree Three Adversarial Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_geometric_cover_degree3_stress.py'
      - '.github/workflows/r5-gf3-geometric-cover-degree3-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometric-source:
    name: Symplectic source SCL15 and original-source degree3 proof controls SCL30 SCL45
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-verify all witnesses, UNSAT DAGs, exact GF3 cubic identities
        run: python -u experiments/r5_universal_gf3_geometric_cover_degree3_stress.py
