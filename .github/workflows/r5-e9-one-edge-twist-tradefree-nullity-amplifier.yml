name: R5 E9 One-Edge-Twist Trade-Free Nullity Amplifier

on:
  push:
    paths:
      - "experiments/r5_e9_one_edge_twist_tradefree_nullity_amplifier.py"
      - "research/R5_E9_ONE_EDGE_TWIST_2LIFT_DISSOCIATED_NULLITY_AMPLIFIER_2026-09-27_v1.0.md"
      - "governance/audits/2026-09-27_one_edge_twist_tradefree_nullity_amplifier_source_audit.md"
      - "governance/JANUS_P_VS_NP_PREMATH_SUPPLEMENT_2026-09-27_v1.6.json"
      - "tools/validate_premath_gate.py"
      - "tools/validate_premath_gate_overlay.py"
      - ".github/workflows/r5-e9-one-edge-twist-tradefree-nullity-amplifier.yml"
  pull_request:
    paths:
      - "experiments/r5_e9_one_edge_twist_tradefree_nullity_amplifier.py"
      - "research/R5_E9_ONE_EDGE_TWIST_2LIFT_DISSOCIATED_NULLITY_AMPLIFIER_2026-09-27_v1.0.md"
      - "governance/audits/2026-09-27_one_edge_twist_tradefree_nullity_amplifier_source_audit.md"
      - "governance/JANUS_P_VS_NP_PREMATH_SUPPLEMENT_2026-09-27_v1.6.json"
      - "tools/validate_premath_gate.py"
      - "tools/validate_premath_gate_overlay.py"
      - ".github/workflows/r5-e9-one-edge-twist-tradefree-nullity-amplifier.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_one_edge_twist_tradefree_nullity_amplifier.py
      - name: Replay amplifier regression
        run: |
          python experiments/r5_e9_one_edge_twist_tradefree_nullity_amplifier.py > /tmp/oet.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/oet.json'))
          assert x['status']=='PASS_ONE_EDGE_TWIST_TRADEFREE_NULLITY_AMPLIFIER_REGRESSION'
          assert x['seed']['nullity_Q']==2
          assert x['seed']['signed_trade_free'] is True
          assert [z['n'] for z in x['levels']]==[18,36,72]
          assert [z['nullity_Q'] for z in x['levels']]==[2,3,5]
          assert all(z['trade_free'] for z in x['levels'])
          assert x['arbitrary_n_theorem']['route_A_trade_free_O_log_n']=='FALSIFIED'
          assert x['E8_D1']=='EMPTY'
          assert x['P_VS_NP']=='OPEN'
          print('R5_E9_ONE_EDGE_TWIST_AMPLIFIER=PASS')
          PY
      - name: Validate pre-math gate
        run: python tools/validate_premath_gate_overlay.py
