name: TRUMP E8 Char2 EQ3 Hyperdet Matchgate Gauge Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_CHAR2_EQ3_HYPERDETERMINANT_MATCHGATE_GAUGE_BARRIER_2026-09-30_v3.9.json'
      - 'research/tools/e8_char2_eq3_hyperdet_matchgate_gauge_barrier/checker.py'
      - '.github/workflows/trump-e8-char2-eq3-hyperdet-matchgate-gauge-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact characteristic-two hyperdet regression
        run: python research/tools/e8_char2_eq3_hyperdet_matchgate_gauge_barrier/checker.py
