name: R5 Exact GF3 Boolean Degree Two Proof Frontier
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_gf3_boolean_degree2_pc_frontier.py'
      - '.github/workflows/r5-gf3-boolean-degree2-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polynomial-calculus:
    name: Exact original-source multilinear degree-two F3 proof and obstruction audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and replay source degree2 certificates, plus Petersen and E61 atomic tests
        run: python -u experiments/r5_universal_gf3_boolean_degree2_pc_frontier.py
