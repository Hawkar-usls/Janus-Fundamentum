name: Validate C037 Explicit Residual OBDD Alignment

on:
  push:
    paths:
      - "experiments/direct/janus_c037_explicit_residual_obdd_alignment.py"
      - "docs/C037_EXPLICIT_RESIDUAL_OBDD_ALIGNMENT.md"
      - "proposals/C037-JANUS-EXPLICIT-RESIDUAL-OBDD-ALIGNMENT.json"
      - "registry/c037-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c037-explicit-residual-obdd.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c037_explicit_residual_obdd_alignment.py"
      - "docs/C037_EXPLICIT_RESIDUAL_OBDD_ALIGNMENT.md"
      - "proposals/C037-JANUS-EXPLICIT-RESIDUAL-OBDD-ALIGNMENT.json"
      - "registry/c037-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c037-explicit-residual-obdd.yml"

permissions:
  contents: read

jobs:
  explicit-residual-obdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c037_explicit_residual_obdd_alignment.py --self-test
