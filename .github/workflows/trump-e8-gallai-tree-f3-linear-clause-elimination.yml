name: TRUMP E8 Gallai-tree single F3 linear clause elimination

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GALLAI_TREE_BOUNDARY_SINGLE_F3_LINEAR_CLAUSE_ELIMINATION_2026-09-30_v6.6.json'
      - 'research/tools/e8_gallai_tree_f3_linear_clause_elimination/checker.py'
      - '.github/workflows/trump-e8-gallai-tree-f3-linear-clause-elimination.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GALLAI_TREE_BOUNDARY_SINGLE_F3_LINEAR_CLAUSE_ELIMINATION_2026-09-30_v6.6.json'
      - 'research/tools/e8_gallai_tree_f3_linear_clause_elimination/checker.py'
      - '.github/workflows/trump-e8-gallai-tree-f3-linear-clause-elimination.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Gallai boundary single-clause elimination
        run: python research/tools/e8_gallai_tree_f3_linear_clause_elimination/checker.py
