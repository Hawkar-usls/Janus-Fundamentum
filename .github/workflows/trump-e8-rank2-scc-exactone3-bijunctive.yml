name: TRUMP E8 Rank2 SCC and ExactOne3 Bijunctive Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RANK2_SCC_TERMINAL_AND_EXACTONE3_BIJUNCTIVE_BARRIER_2026-09-30_v3.4.json'
      - 'research/tools/e8_rank2_scc_exactone3_bijunctive/checker.py'
      - '.github/workflows/trump-e8-rank2-scc-exactone3-bijunctive.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SCC/bijunctive regression
        run: python research/tools/e8_rank2_scc_exactone3_bijunctive/checker.py
