name: Validate C025 C2G Disjoint Cube Charge

on:
  push:
    paths:
      - "experiments/direct/janus_tear_policy0b_c2g_disjoint_cube_charge.py"
      - "proof_attempts/C025/C025_C2G_DISJOINT_CUBE_CHARGE.md"
      - ".github/workflows/validate-c025-c2g-disjoint-cube-charge.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_policy0b_c2g_disjoint_cube_charge.py"
      - "proof_attempts/C025/C025_C2G_DISJOINT_CUBE_CHARGE.md"
      - ".github/workflows/validate-c025-c2g-disjoint-cube-charge.yml"

permissions:
  contents: read

jobs:
  verify-c2g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile C2G replay
        run: python -m py_compile experiments/direct/janus_tear_policy0b_c2g_disjoint_cube_charge.py
      - name: Replay disjoint cube charge mechanics
        run: python experiments/direct/janus_tear_policy0b_c2g_disjoint_cube_charge.py
