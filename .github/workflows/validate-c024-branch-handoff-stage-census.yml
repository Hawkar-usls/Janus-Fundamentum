name: Validate C024 Branch Handoff Stage Census

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_branch_handoff_stage_census.py"
      - ".github/workflows/validate-c024-branch-handoff-stage-census.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_branch_handoff_stage_census.py"
      - ".github/workflows/validate-c024-branch-handoff-stage-census.yml"

permissions:
  contents: read

jobs:
  branch-handoff-stage-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Census P to raw branch child to next exact key
        run: python experiments/direct/janus_tear_gt_branch_handoff_stage_census.py
