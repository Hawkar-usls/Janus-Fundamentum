  workflow_dispatch:

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay C4 source-capacity tree EQ/NEQ barrier
        run: python research/tools/e8_c4_source_capacity_tree_eq_neq/checker.py
