    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_SOURCE_CAPACITY_TREE_EQ_NEQ_BARRIER_2026-09-30_v7.5.json'
      - 'research/tools/e8_c4_source_capacity_tree_eq_neq/checker.py'
      - '.github/workflows/trump-e8-c4-source-capacity-tree-eq-neq.yml'
  pull_request:
