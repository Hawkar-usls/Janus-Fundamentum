name: R5 E9 Affine F3 Parallel Saturation Quotient

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PARALLEL_SATURATION_QUOTIENT_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_parallel_saturation_quotient.py'
      - '.github/workflows/r5-e9-affine-f3-parallel-saturation-quotient.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run affine F3 parallel-saturation regression
        run: python experiments/r5_e9_affine_f3_parallel_saturation_quotient.py
