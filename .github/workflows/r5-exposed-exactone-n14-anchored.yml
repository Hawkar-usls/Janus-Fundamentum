name: R5 N14 Exact Open-Sixpole Onehot Finite Census
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_exposed_exactone_n14_anchored_rejection.py'
      - '.github/workflows/r5-exposed-exactone-n14-anchored.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n14-exact:
    name: Exhaust all simple connected n14 sixpole interiors, full physical port truth, 15 pairings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact canonical graph enumerator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nauty
          command -v nauty-geng
      - name: Exhaustive source-colouring and bit-relation rejection on n14
        run: python -u experiments/r5_universal_exposed_exactone_n14_anchored_rejection.py
