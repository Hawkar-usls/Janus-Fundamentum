name: JANUS TRUMP R47M Compact Scientific Receipt

on:
  push:
    branches:
      - research/r47m-compact-scientific-receipt-2026-09-04

jobs:
  compact-r47m-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scientific parent and compile
        run: |
          python - <<'PY'
          import subprocess
          parent='11302552fdc17f6d07a2f93bafa44fa8ddecabd3'
          subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'], check=True)
          PY
          python -m py_compile experiments/janus_trump_r47m_compact_scientific_receipt.py
      - name: Re-execute frozen R47M and emit compact scientific receipt
        run: |
          PYTHONPATH=experiments python experiments/janus_trump_r47m_compact_scientific_receipt.py | tee /tmp/r47m-compact.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r47m-compact.json'))
          assert d['source_science']=='BYTE_FOR_BYTE_FROZEN_R47M_RUN'
          assert d['verdict'] in {
              'EXPLICIT_REACHABLE_COUNTEREXAMPLE_TO_FIXED_DEPTH2_GRAMMAR_FOUND',
              'FULL_FROZEN_ONE_SWAP_FRONTIER_COVERED_BY_DEPTH1_OR_DEPTH2__O4_STILL_OPEN',
          }
          assert d['counterexample_found'] == (d['counterexample'] is not None)
          assert d['firewall']['O4_UNIVERSAL_COVERAGE_FOR_FIXED_DEPTH2_GRAMMAR']=='OPEN'
          assert d['firewall']['UNBOUNDED_DEPTH_POLYNOMIAL']=='NOT_PROVED'
          assert d['firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['firewall']['P_VS_NP']=='OPEN'
          print('R47M_COMPACT_GATE=PASS')
          print('R47M_COMPACT_VERDICT='+d['verdict'])
          print('R47M_COMPACT_COUNTEREXAMPLE_FOUND='+str(d['counterexample_found']))
          print('R47M_COMPACT_METRICS='+json.dumps(d['metrics'],sort_keys=True))
          if d['counterexample'] is not None:
              c=d['counterexample']
              print('R47M_COMPACT_WITNESS='+json.dumps({
                  'frontier_ordinal':c['frontier_ordinal'],
                  'phase':c['phase'],
                  'source_clause':c['source_clause'],
                  'replacement_clause':c['replacement_clause'],
                  'mutated_original_hash':c['mutated_original_hash'],
                  'mutated_original_CLV':c['mutated_original_CLV'],
                  'fixpoint_hash':c['fixpoint_hash'],
                  'fixpoint_CLV':c['fixpoint_CLV'],
                  'depth1_row_count':c['depth1_row_count'],
                  'depth2_tested_pair_count':c['depth2_tested_pair_count'],
                  'depth1_rows_sha256':c['depth1_rows_sha256'],
                  'all_depth2_failed_pairs_sha256':c['all_depth2_failed_pairs_sha256'],
                  'best_depth2_failure':c['best_depth2_failure'],
              },sort_keys=True))
          else:
              print('R47M_COMPACT_HARDEST='+json.dumps(d['hardest_depth2_rescue_if_no_counterexample'],sort_keys=True))
          PY
