name: R5 ExactOne Three Heterochromatic Closures Theorem
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_exactone_heterochromatic_triple_closure.py'
      - '.github/workflows/r5-exactone-three-heterochromatic-closures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closures:
    name: Exhaust 94065 native sixpole port interfaces and prove triple closure equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nauty
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nauty
      - name: Classify all n4 through n12 colourable sixpoles by three heterochromatic closures
        run: python -u experiments/r5_universal_exactone_heterochromatic_triple_closure.py
