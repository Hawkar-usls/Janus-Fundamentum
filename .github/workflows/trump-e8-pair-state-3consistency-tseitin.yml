name: TRUMP E8 Pair-State 3-Consistency Tseitin Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_PAIR_STATE_3CONSISTENCY_TSEITIN_BARRIER_2026-09-30_v4.0.json'
      - 'research/tools/e8_pair_state_3consistency_tseitin/checker.py'
      - '.github/workflows/trump-e8-pair-state-3consistency-tseitin.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact K4 Tseitin pair-state regression
        run: python research/tools/e8_pair_state_3consistency_tseitin/checker.py
