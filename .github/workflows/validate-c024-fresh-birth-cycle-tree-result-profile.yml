name: Validate C024 Fresh Birth Cycle Tree Result Profile

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_fresh_birth_cycle_tree_result_profile.py"
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - ".github/workflows/validate-c024-fresh-birth-cycle-tree-result-profile.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_fresh_birth_cycle_tree_result_profile.py"
      - "experiments/direct/janus_tear_gt_local_resolution_bad_bridge_birth_v2.py"
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - ".github/workflows/validate-c024-fresh-birth-cycle-tree-result-profile.yml"

permissions:
  contents: read

jobs:
  fresh-birth-cycle-tree-result-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile fresh births by Gate-A hypotheses
        run: python experiments/direct/janus_tear_gt_fresh_birth_cycle_tree_result_profile.py
