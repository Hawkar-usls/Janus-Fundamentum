name: TRUMP E8 GF2 Degree3 Macaulay Parity Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GF2_DEGREE3_MACAULAY_PARITY_KERNEL_2026-09-30_v4.1.json'
      - 'research/tools/e8_gf2_degree3_macaulay_parity/checker.py'
      - '.github/workflows/trump-e8-gf2-degree3-macaulay-parity.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact GF2 degree-3 Macaulay regression
        run: python research/tools/e8_gf2_degree3_macaulay_parity/checker.py
