name: R5 E9 Exact TU-Rowspace Boolean LP Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_TU_ROWSPACE_BOOLEAN_LP_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exact_tu_rowspace_boolean_lp_router.py'
      - '.github/workflows/r5-e9-exact-tu-rowspace-boolean-lp-router.yml'
  workflow_dispatch:

jobs:
  tu-rowspace-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact TU-rowspace router regression
        run: python3 experiments/r5_e9_exact_tu_rowspace_boolean_lp_router.py
