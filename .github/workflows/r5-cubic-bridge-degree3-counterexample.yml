name: R5 Native Cubic Bridge GF3 Degree Three Counterexample
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_bridge_cubic_graph_gf3_degree3_counterexample_gate.py'
      - '.github/workflows/r5-cubic-bridge-degree3-counterexample.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-gf3:
    name: Original SCL bridge-parity UNSAT proof vs exact F3 degree3 dual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original graph-cut certificate plus GF3 dual or bounded UNKNOWN
        run: python -u experiments/r5_universal_bridge_cubic_graph_gf3_degree3_counterexample_gate.py
