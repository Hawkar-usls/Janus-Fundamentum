name: R5 Flower J5 Symmetry Compressed GF3 Degree Three Dual
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_flower_j5_gf3_degree3_symmetry_dual.py'
      - '.github/workflows/r5-flower-j5-degree3-orbit-dual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-flower-orbit:
    name: G=C5xC2 invertible F3 averaging and independent source-exhaustive dual verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original 27state UNSAT and solve all invariant degree3 moment equations
        run: python -u experiments/r5_universal_flower_j5_gf3_degree3_symmetry_dual.py
