name: TRUMP E8 global GF2 group-constrained factor reduction

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_GLOBAL_GF2_GROUP_CONSTRAINED_FACTOR_REDUCTION_2026-09-26_v1.8.json'
      - 'research/tools/e8_global_gf2_group_constrained_factor/checker.py'
      - '.github/workflows/trump-e8-global-gf2-group-constrained-factor.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_global_gf2_group_constrained_factor/checker.py
