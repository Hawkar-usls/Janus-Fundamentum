name: R5 Native SCL Port-Free Two Three Cut DegreeOne PC Gate
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_portfree_two_three_edge_cut_exact_signature_retraction.py'
      - 'experiments/r5_universal_native_scl_two_three_cut_pc_degree1_retraction.py'
      - '.github/workflows/r5-native-2cut-3cut-pc-degree1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    name: Complete physical port colour and every original Holyer SCL row under degree-one block retraction
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2/3 port-free blocks and all ordered full physical six-port colour signatures
        run: python -u experiments/r5_universal_portfree_two_three_edge_cut_exact_signature_retraction.py
      - name: Independently replay all original closed cubic source rows and Boolean axioms under literal PC degree-one map
        run: python -u experiments/r5_universal_native_scl_two_three_cut_pc_degree1_retraction.py
