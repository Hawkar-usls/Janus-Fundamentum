name: Validate C024 Frozen Fresh Side Barrier

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_frozen_fresh_side_barrier.py"
      - "proof_attempts/C024/GT_FROZEN_FRESH_SIDE_BARRIER.md"
      - ".github/workflows/validate-c024-frozen-fresh-side-barrier.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_frozen_fresh_side_barrier.py"
      - "proof_attempts/C024/GT_FROZEN_FRESH_SIDE_BARRIER.md"
      - ".github/workflows/validate-c024-frozen-fresh-side-barrier.yml"

permissions:
  contents: read

jobs:
  frozen-fresh-side-barrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen parent-universe assumptions and fresh-side barrier
        run: python experiments/direct/janus_tear_gt_frozen_fresh_side_barrier.py
