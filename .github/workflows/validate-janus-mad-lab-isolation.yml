name: validate-janus-mad-lab-isolation

on:
  push:
    branches:
      - research/janus-mad-lab-prime-probes-2026-08-28
    paths:
      - 'experiments/mad_lab/**'
      - '.github/workflows/validate-janus-mad-lab-isolation.yml'
  pull_request:
    paths:
      - 'experiments/mad_lab/**'
      - '.github/workflows/validate-janus-mad-lab-isolation.yml'

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate M2R pre-action jump gate
        run: python -m experiments.mad_lab.m2r_jump_counter

      - name: Validate proof-gated M2R Surgeon
        run: python -m experiments.mad_lab.m2r_self_repair

      - name: Validate Spider frozen-precommit gate
        run: python -m experiments.mad_lab.spider_method_gate

      - name: Validate reverse-prime historical scheduler
        run: python -m experiments.mad_lab.reverse_prime_probe

      - name: Validate ascending-prime runner smoke test
        run: python -m experiments.mad_lab.prime_stress_ascending --min 2 --max 61 --out /tmp/prime_smoke.json

      - name: Validate MAD-LAB policy and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('experiments/mad_lab/POLICY.json').read_text())
          assert p['lane']=='JANUS_MAD_LAB'
          assert p['status']=='EXPERIMENTAL_NOT_THEOREM'
          assert p['P_VS_NP']=='OPEN'
          assert p['theorem_runtime_heuristics']=='FORBIDDEN'
          assert p['automatic_promotion'] is False
          for rule in (
              'NO_PROMOTION_WITHOUT_PROOF',
              'M2R_PREFLIGHT_BEFORE_ACTION',
              'M2R_HAS_VETO_NOT_TRUTH_POWER',
              'SELF_REPAIR_MAY_USE_ONLY_ALREADY_PROVED_EXACT_PROVIDERS',
              'SAME_RUN_NEW_LEMMA_USE_IS_FORBIDDEN',
              'UNPROVED_REPAIR_ROLLS_BACK_AND_STAYS_OPEN',
              'SPIDER_FREEZE_BEFORE_EVALUATE',
              'DISCOVERY_PRIMES_CANNOT_CONFIRM_THEIR_OWN_PATTERN',
          ):
              assert rule in p['rules'], rule
          g=p['m2r_jump_gate']
          assert g['enabled'] is True and g['truth_power'] is False and g['veto_power'] is True
          s=p['m2r_self_repair']
          assert s['enabled'] is True
          assert s['may_use_generated_same_run_lemma'] is False
          assert s['rollback_on_unproved_repair'] is True
          sp=p['spider_method_gate']
          assert sp['enabled'] is True
          assert sp['imports_methodology_only'] is True
          assert sp['physical_retrocausality_promoted'] is False
          asc=p['ascending_prime_stress']
          assert asc['enabled'] is True
          assert asc['start']==2 and asc['default_stop']==937
          assert asc['direction']=='ASCENDING' and asc['numbers']=='PRIMES_ONLY'
          assert asc['same_run_repair_invention_allowed'] is False
          assert asc['proves_each_prime_N'] is False
          print('MAD_LAB_POLICY=PASS')
          print('M2R_SURGEON_POLICY=PASS')
          print('SPIDER_METHOD_POLICY=PASS')
          print('ASCENDING_PRIME_POLICY=PASS')
          print('P_VS_NP=OPEN')
          PY

      - name: Prove theorem runtime does not import MAD-LAB
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for f in Path('.').rglob('*.py'):
              s=f.as_posix()
              if s.startswith('experiments/mad_lab/'):
                  continue
              text=f.read_text(errors='ignore')
              if 'from experiments.mad_lab' in text or 'import experiments.mad_lab' in text:
                  bad.append(s)
          assert not bad, f'theorem-side MAD-LAB imports forbidden: {bad}'
          print('NO_THEOREM_RUNTIME_IMPORT_FROM_MAD_LAB=PASS')
          PY

      - name: Reject theorem claims inside MAD-LAB
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden=(
              'P_VS_NP = "PROVED_EQUAL"',
              "P_VS_NP = 'PROVED_EQUAL'",
              'P_VS_NP=PROVED_EQUAL',
              'SAT_IN_P = PROVED',
          )
          bad=[]
          for f in Path('experiments/mad_lab').rglob('*'):
              if not f.is_file():
                  continue
              text=f.read_text(errors='ignore')
              if any(x in text for x in forbidden):
                  bad.append(f.as_posix())
          assert not bad, f'forbidden theorem claims in MAD-LAB: {bad}'
          print('MAD_LAB_CLAIM_CEILING=PASS')
          print('AUTOMATIC_PROMOTION=false')
          PY
