name: TRUMP Log Alien Constraint Exact Transfer

on:
  push:
    branches:
      - research/trump-log-alien-constraint-exact-transfer-2026-09-15
    paths:
      - 'research/TRUMP_LOG_ALIEN_CONSTRAINT_EXACT_TRANSFER_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_log_alien_transfer/**'
      - '.github/workflows/trump-log-alien-constraint-exact-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log-alien-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent logarithmic alien-transfer checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_log_alien_transfer.independent_checker | tee /tmp/log-alien-transfer.json

      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/log-alien-transfer.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_LOG_ALIEN_CONSTRAINT_EXACT_TRANSFER', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          assert z['control_oracle']['p1_incidence_cycle_rank'] >= 2, z['control_oracle']
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['UNRESTRICTED_CONNECTED_MIXED_CARRIER']=='SCHAEFER_NP_COMPLETE_BARRIER_REMAINS', sf
          assert sf['GLOBAL_APMA_FRONTIER_ADVANCE']=='NONE', sf
          print(json.dumps({'verdict':z['verdict'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier

      - name: Factorized feedback-interface regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker

      - name: Affine wide-interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker

      - name: Authority notice
        run: |
          echo 'SCOPED_LOG_ALIEN_CONSTRAINT_TRANSFER__NO_GLOBAL_PROMOTION'
          echo 'CASE_A=4^k<=L OVER EVEN_XOR3 ALIENS ON OR2 BASE'
          echo 'CASE_B=3^k<=L OVER OR2 ALIENS ON AFFINE BASE'
          echo 'UNRESTRICTED_CONNECTED_MIXED_CARRIER_BARRIER=UNCHANGED'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
