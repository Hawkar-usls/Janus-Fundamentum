name: R5 E9 AF3 One-Zero Exact Minus2 Augmentation

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_ONE_ZERO_EXACT_MINUS2_BINARY_AUGMENTATION_THEOREM_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_one_zero_exact_minus2_binary_augmentation.py'
      - '.github/workflows/r5-e9-af3-one-zero-exact-minus2-binary-augmentation.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one-zero augmentation regression
        run: python experiments/r5_e9_af3_one_zero_exact_minus2_binary_augmentation.py
