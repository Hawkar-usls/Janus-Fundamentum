name: Validate C024 Bad Bridge Birth

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_bad_bridge_birth_lifecycle.py"
      - ".github/workflows/validate-c024-bad-bridge-birth.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_bad_bridge_birth_lifecycle.py"
      - ".github/workflows/validate-c024-bad-bridge-birth.yml"

permissions:
  contents: read

jobs:
  bad-bridge-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace first non-tail bridge births
        run: python experiments/direct/janus_tear_gt_bad_bridge_birth_lifecycle.py
