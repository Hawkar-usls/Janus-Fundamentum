name: TRUMP E8 C4 U24 Mixed Cycle Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_U24_LOCAL_TENSION_AND_MIXED_CYCLE_BARRIER_2026-09-30_v5.3.json'
      - 'research/tools/e8_c4_u24_mixed_cycle/checker.py'
      - '.github/workflows/trump-e8-c4-u24-mixed-cycle.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact C4 U2,4 mixed-cycle regression
        run: python research/tools/e8_c4_u24_mixed_cycle/checker.py
