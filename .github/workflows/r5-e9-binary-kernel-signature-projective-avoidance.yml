name: R5 E9 Binary kernel-signature projective avoidance

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_BINARY_KERNEL_SIGNATURE_SERIES_PROJECTIVE_AVOIDANCE_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_binary_kernel_signature_series_projective_avoidance.py'
      - '.github/workflows/r5-e9-binary-kernel-signature-projective-avoidance.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_binary_kernel_signature_series_projective_avoidance.py
      - name: Replay exact PG(3,2) controls
        run: python experiments/r5_e9_binary_kernel_signature_series_projective_avoidance.py
