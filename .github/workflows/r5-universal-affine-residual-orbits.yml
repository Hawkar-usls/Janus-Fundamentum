name: R5 Universal Affine Residual Orbits and Zero Recognition

on:
  push:
    branches:
      - research/r5-kempe-coupled-involutions-20261013
    paths:
      - '.github/workflows/r5-universal-affine-residual-orbits.yml'
      - 'experiments/r5_universal_affine_residual_orbit_zero_canonicalization_gate.py'
      - 'experiments/r5_universal_ei_closure_holyer_npcomplete_separation_rank.py'
      - 'experiments/r5_universal_f3_boolean_exactification_connected_nullity_barrier.py'
      - 'docs/r5_universal_affine_residual_orbit_zero_canonicalization_checkpoint_20261014.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-affine-orbits:
    name: All-depth Holyer residual classes, full AGL2 action, Petersen local-vs-global
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Holyer native SCL and exact GF3 Boolean affine fibres
        run: python -u experiments/r5_universal_ei_closure_holyer_npcomplete_separation_rank.py
      - name: Verify all Holyer residual-function depth counts, 432 affine symmetries and Petersen 386 local constraints
        run: python -u experiments/r5_universal_affine_residual_orbit_zero_canonicalization_gate.py
