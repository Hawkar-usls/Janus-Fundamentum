name: Validate C049.1 B4.6.3 corrected Node-7 six-generator up_k hardening

on:
  push:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py'
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.*'
      - 'docs/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K_HARDENING.md'
      - 'registry/c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.json'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py'
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.*'
      - 'docs/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K_HARDENING.md'
      - 'registry/c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.json'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-node7-six-generator-up-k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: experiments/direct
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact ancestry and verifier independence
        run: |
          git merge-base --is-ancestor 796ad144de65906c702e29928f683e6d53e3529c HEAD
          python -m py_compile \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k.py \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py \
            experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py
          ! grep -E '^from .*corrected_node7_six_generator_up_k|^import .*corrected_node7_six_generator_up_k' \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py
          ! grep -E '^from .*janus_c049_1_b[12]_.*core|^import .*janus_c049_1_b[12]_.*core' \
            experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py

      - name: Replay admitted PR 112 exactly
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_replay_workflow_run_steps.py \
            .github/workflows/validate-c049-1-b4-6-3-corrected-node7-parent-frontier-compression.yml
          source=/tmp/c049-corrected-node7-frontier-compression.json
          test "$(wc -c < "$source")" = "26583"
          test "$(sha256sum "$source" | cut -d' ' -f1)" = \
            "b0d8d4e51be21f21218fd9ee63a367e3236ff2a53d9d5f29980e1c93340867ca"

      - name: Build deterministic frozen candidate
        run: |
          source=/tmp/c049-corrected-node7-frontier-compression.json
          producer=experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k.py
          for mode in original reversed seeded-shuffle; do
            python "$producer" "$source" \
              --entry-order "$mode" \
              --output "/tmp/c049-node7-up-k-$mode.json"
          done
          cmp /tmp/c049-node7-up-k-original.json /tmp/c049-node7-up-k-reversed.json
          cmp /tmp/c049-node7-up-k-original.json /tmp/c049-node7-up-k-seeded-shuffle.json
          cmp /tmp/c049-node7-up-k-original.json \
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.frozen.json
          sha256sum -c \
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.manifest.sha256

      - name: Independent replay and repaired tamper rejection
        run: |
          python experiments/direct/janus_c049_1_b4_6_3_corrected_node7_six_generator_up_k_verifier.py \
            /tmp/c049-corrected-node7-frontier-compression.json \
            /tmp/c049-node7-up-k-original.json \
            --tamper-self-test

      - name: Validate strict pending boundary
        run: |
          python - <<'PY'
          import json
          artifact=json.load(open('/tmp/c049-node7-up-k-original.json'))
          assert artifact['certificate_bytes']==5983
          assert artifact['semantic_digest']=='d5ad79fc8ec336cd64ecb9f10ec327507ef4b6a485495f1d8c558569fefc4124'
          assert artifact['preorder']['pair_count']==36
          assert artifact['preorder']['relation_count']==6
          assert len(artifact['preorder']['retained_generator_ids'])==6
          assert artifact['preorder']['direct_removals']==[]
          assert artifact['reachable_closure']['entry_count']==7776
          assert artifact['reachable_closure']['entries_digest']=='b7ffb31c984a2181b8c174ba4c5f1765305796ca19a17d5919d467656c6476a6'
          assert artifact['reachable_closure']['idempotent'] is True
          assert artifact['invariant_vector']=={f'CN7U-INV-{i:02d}':'PASS' for i in range(1,11)}
          receipt=json.load(open('registry/c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.json'))
          assert receipt['status']=='DRAFT_EXACT_HEAD_CI_REQUIRED'
          boundary=receipt['admission_boundary']
          assert boundary['corrected_node7_six_generator_up_k_admitted'] is False
          assert boundary['corrected_node7_parent_refinement_complete'] is True
          assert boundary['corrected_node7_parent_up_k_complete'] is False
          assert boundary['found_layout_enabled'] is False
          assert boundary['no_layout_at_cap_enabled'] is False
          assert boundary['p_vs_np']=='OPEN'
          PY

      - name: Export candidate proof package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-corrected-node7-six-generator-up-k-hardening
          path: |
            /tmp/c049-node7-up-k-original.json
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.frozen.json
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.manifest.json
            experiments/direct/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K.manifest.sha256
            registry/c049-1-b4-6-3-corrected-node7-six-generator-up-k-hardening.json
            docs/C049_1_B4_6_3_CORRECTED_NODE7_SIX_GENERATOR_UP_K_HARDENING.md
          retention-days: 1
