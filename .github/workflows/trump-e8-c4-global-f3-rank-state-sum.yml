name: TRUMP E8 C4 Global F3 Rank-State Sum

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_global_f3_rank_state_sum/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_GLOBAL_F3_PARTITION_RANK_STATE_SUM_2026-10-01_v8.5.3.json'
      - '.github/workflows/trump-e8-c4-global-f3-rank-state-sum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rank-state-sum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact GF3 rank-state checker
        run: python3 research/tools/e8_c4_global_f3_rank_state_sum/checker.py
