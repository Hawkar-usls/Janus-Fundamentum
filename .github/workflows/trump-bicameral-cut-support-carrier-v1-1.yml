name: TRUMP Bicameral Overwidth Cut Support Carrier v1.1

on:
  push:
    branches:
      - research/trump-bicameral-cut-support-carrier-v1-1-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut-support-carrier-v1-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.1 independent checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_cut_support_carrier.independent_checker_v1_1 | tee /tmp/cut-support-v11.json
      - name: Assert v1.1 scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/cut-support-v11.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_OVERWIDTH_CUT_SUPPORT_INTERSECTION_CARRIER_V1_1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN'
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO'
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'structural_lemma':z['structural_lemma'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY
      - name: Preserve v1 first-run failure
        run: |
          set +e
          python -m research.tools.apma_cut_support_carrier.independent_checker >/tmp/cut-support-v1.json
          code=$?
          set -e
          test $code -ne 0
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/cut-support-v1.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='FAIL_OR_OPEN_BICAMERAL_CUT_SUPPORT_CARRIER'
          print('V1_FAILURE_PRESERVED')
          PY
      - name: Parent canonical mincut v1.1 regression
        run: python -m research.tools.apma_bicameral_mincut.independent_checker_v1_1
      - name: Exact interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker
      - name: Parent pair separator regression
        run: python -m research.tools.apma_bicameral_pair_separator.independent_checker
      - name: Raw compositional basis regression
        run: python -m research.tools.apma_unseen_basis.compositional_independent_checker
      - name: Authority notice
        run: |
          echo 'V1_FAIL_PRESERVED'
          echo 'V1_1_FROZEN_CANDIDATE_UNCHANGED'
          echo 'CUT_SUPPORT_INTERSECTION_SCOPED_ONLY'
          echo 'RAW_2_TO_K_ENUMERATION=0'
          echo 'GENERAL_OVERWIDTH_COMPRESSION=NOT_PROVED'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
