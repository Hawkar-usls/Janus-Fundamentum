name: BABEL-21 deep modular source rank and independently exact Q replay
on:
  push:
    branches: ['research/babel21-*']
    paths: ['.github/workflows/babel21-deep-source-37.yml']
  pull_request:
    paths: ['.github/workflows/babel21-deep-source-37.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-rank-four-remaining-directions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source exact-arithmetic prerequisites
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore frozen source and exact validators
        run: |
          mkdir -p /tmp/b21deep
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/b21deep
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel20/exact_cokernel.py experiments/babel20/source_koszul.py experiments/babel20/equal_source_syzygies.py experiments/babel21/source_kernel_probe.py experiments/babel21/modloc_exactQ.py experiments/babel21/independent_source_verify.py /tmp/b21deep/
      - name: Reconstruct full exact Q cokernel and known source syzygies
        working-directory: /tmp/b21deep
        run: |
          python crossbase_rank2.py --base-name SCL126_flip16 --seed 37 --prime 65521 --passes 4
          python exact_cokernel.py --base SCL126_flip16 --seed 37
          python source_koszul.py --base SCL126_flip16 --seed 37
          python equal_source_syzygies.py --base SCL126_flip16 --seed 37
      - name: Search deeper general source kernel relations over mod P and verify every rational hit
        working-directory: /tmp/b21deep
        run: python modloc_exactQ.py --seed 37 --maxcols 65000 --maxpivots 29000 --maxnnz 2200 --bound 512
      - name: Independently replay any exact Q source syzygies
        working-directory: /tmp/b21deep
        run: python independent_source_verify.py --seed 37
      - name: Preserve exact Q source witness or honest diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel21-deep-general-Q-seed37
          path: |
            /tmp/b21deep/babel21_*_modloc_exactQ.json
            /tmp/b21deep/babel21_*_independent_Q_replay.json
          retention-days: 7
