name: TRUMP E8 transversal-minor support obstruction

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_TRANSVERSAL_MINOR_SUPPORT_OBSTRUCTION_2026-09-26_v0.4.json'
      - 'research/tools/e8_transversal_minor_support_obstruction/checker.py'
      - '.github/workflows/trump-e8-transversal-minor-support-obstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent symbolic and finite-field replay
        run: python research/tools/e8_transversal_minor_support_obstruction/checker.py
