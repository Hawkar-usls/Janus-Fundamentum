name: validate-c025-pirc-decision-core-v0-4

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'experiments/direct/janus_pirc_decision_core_v0_4.py'
      - 'experiments/direct/janus_theorem_input_normal_form.py'
      - 'research/C025_TOTALITY_REDUCTION_LOW_VOLUME_AND_EXTENSION_BUDGET_2026-08-27.json'
      - 'research/C025_PIRC_DECISION_CORE_V0_4_FREEZE_2026-08-27.json'
      - '.github/workflows/validate-c025-pirc-decision-core-v0-4.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_pirc_decision_core_v0_4.py'
      - 'experiments/direct/janus_theorem_input_normal_form.py'
      - 'research/C025_TOTALITY_REDUCTION_LOW_VOLUME_AND_EXTENSION_BUDGET_2026-08-27.json'
      - 'research/C025_PIRC_DECISION_CORE_V0_4_FREEZE_2026-08-27.json'
      - '.github/workflows/validate-c025-pirc-decision-core-v0-4.yml'

jobs:
  v0-4-theorem-firewalls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dense input normal-form self-test
        run: python -m experiments.direct.janus_theorem_input_normal_form
      - name: PIRC decision core v0.4 self-test
        run: python -m experiments.direct.janus_pirc_decision_core_v0_4
      - name: Verify structural sublemmas and claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('research/C025_TOTALITY_REDUCTION_LOW_VOLUME_AND_EXTENSION_BUDGET_2026-08-27.json').read_text())
          freeze = json.loads(Path('research/C025_PIRC_DECISION_CORE_V0_4_FREEZE_2026-08-27.json').read_text())
          assert proof['lemma_1']['status'] == 'PROVED_ELEMENTARY'
          assert proof['lemma_2']['status'] == 'PROVED_FROM_FROZEN_V2_V3_GUARDS'
          assert proof['remaining_totality_region']['status'] == 'OPEN_CENTRAL_REDUCED'
          assert proof['P_VS_NP'] == 'OPEN'
          assert freeze['status'] == 'FIXED_POLYNOMIAL_PARTIAL_DECISION_MACHINE_FROZEN__HIGH_VOLUME_TOTALITY_OPEN'
          assert freeze['remaining_central_theorem']['status'] == 'OPEN_CENTRAL'
          assert freeze['conditional_consequence']['status'] == 'CONDITIONAL_NOT_PROMOTED'
          assert freeze['P_VS_NP'] == 'OPEN'
          print('LOW_VOLUME_ELIMINATION_ALWAYS_FITS=PROVED_ELEMENTARY')
          print('N2_EXTENSION_CAP_NONBINDING=PROVED')
          print('HIGH_VOLUME_RESCUE_TOTALITY=OPEN_CENTRAL')
          print('P_VS_NP=OPEN')
          PY
