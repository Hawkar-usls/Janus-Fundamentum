name: Validate C024 Abstract Singleton Branch Same Cut

on:
  push:
    paths:
      - "experiments/direct/janus_tear_abstract_singleton_branch_same_cut.py"
      - "proof_attempts/C024/GT_SINGLETON_BRANCH_SAME_CUT_PRESERVATION.md"
      - ".github/workflows/validate-c024-abstract-singleton-branch-same-cut.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_abstract_singleton_branch_same_cut.py"
      - "proof_attempts/C024/GT_SINGLETON_BRANCH_SAME_CUT_PRESERVATION.md"
      - ".github/workflows/validate-c024-abstract-singleton-branch-same-cut.yml"

permissions:
  contents: read

jobs:
  abstract-singleton-branch-same-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust singleton-branch preservation on small legal clauses
        run: python experiments/direct/janus_tear_abstract_singleton_branch_same_cut.py
