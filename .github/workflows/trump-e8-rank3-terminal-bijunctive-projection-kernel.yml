name: TRUMP E8 Rank3 Terminal Bijunctive Projection Kernel

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RANK3_TERMINAL_BIJUNCTIVE_PROJECTION_KERNEL_2026-09-30_v3.7.json'
      - 'research/tools/e8_rank3_terminal_bijunctive_projection_kernel/checker.py'
      - '.github/workflows/trump-e8-rank3-terminal-bijunctive-projection-kernel.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact terminal projection kernel regression
        run: python research/tools/e8_rank3_terminal_bijunctive_projection_kernel/checker.py
