name: R5 E9 Exact Graphic Kernel Network Matrix Recognition Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_GRAPHIC_KERNEL_NETWORK_MATRIX_RECOGNITION_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exact_graphic_kernel_network_matrix_recognition_router.py'
      - '.github/workflows/r5-e9-exact-graphic-kernel-network-matrix-recognition-router.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact graphic-kernel network-router regression
        run: python experiments/r5_e9_exact_graphic_kernel_network_matrix_recognition_router.py
