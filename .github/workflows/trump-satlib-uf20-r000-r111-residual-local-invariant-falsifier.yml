name: TRUMP SATLIB UF20 R000 R111 Residual Local Invariant Falsifier

on:
  push:
    branches:
      - research/trump-external-satlib-uf20-01-source-acquisition-2026-09-16
    paths:
      - 'research/TRUMP_SATLIB_UF20_R000_R111_RESIDUAL_LOCAL_INVARIANT_FALSIFIER_PREREGISTRATION_2026-09-16.json'
      - 'research/TRUMP_SATLIB_UF20_R000_R111_RESIDUAL_LOCAL_INVARIANT_FALSIFIER_PREREGISTRATION_REVIEW_2026-09-16.json'
      - 'research/tools/apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier/**'
      - '.github/workflows/trump-satlib-uf20-r000-r111-residual-local-invariant-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen preregistration and implementation bindings
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_RESIDUAL_LOCAL_INVARIANT_FALSIFIER_PREREGISTRATION_2026-09-16.json)" = "55c2a314900c5518bbd4fbeb41db74629e478911"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_RESIDUAL_LOCAL_INVARIANT_FALSIFIER_PREREGISTRATION_REVIEW_2026-09-16.json)" = "dd6d08e7c519f3a39483f93d812f15484b11b390"
          test "$(git hash-object research/TRUMP_SATLIB_UF20_R000_R111_FOUR_UNADMITTED_EXISTING_EVIDENCE_RESIDUAL_MATRIX_RESULT_2026-09-16.json)" = "f6209a9b97c8f270ff915ba5c813922b5a8e3bb3"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_projected_core_replay/projection_identity.py)" = "2ef48e73974a5f43d3f4fb4809ebd0c09c0f5be4"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier/candidate.py)" = "4ec02d6d42e6cad7d91f16b1acfdcbe51dbd65df"
          test "$(git hash-object research/tools/apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier/independent_checker.py)" = "364e0170d3dd71383fc593a93f6e2240be8c6032"
          test "$(git hash-object research/source_data/SATLIB_UF20_01_2026-09-16.cnf)" = "8330041b292e0501f8d74c1b1d32ca96c4498864"
          test "$(git hash-object research/source_data/SATLIB_UF20_02_2026-09-16.cnf)" = "f924caaef0d868bf62b1658e83e030ad8daee865"
          test "$(git hash-object research/source_data/SATLIB_UF20_03_2026-09-16.cnf)" = "8f3d15154515457281f49201b843f2a7134dfa9f"
          test "$(git hash-object research/source_data/SATLIB_UF20_04_2026-09-16.cnf)" = "34ced5c169f967b2dc44ef5e42f2ee2c924813e1"
          test "$(git hash-object research/source_data/SATLIB_UF20_05_2026-09-16.cnf)" = "3b04eff26ee37bdd0bc21b1066486974f92a2c9b"
      - name: Evaluate every and only frozen L1-L4 candidate
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier.candidate > /tmp/local-falsifier.json
      - name: Independently recompute all four candidates
        run: |
          set -euo pipefail
          python -m research.tools.apma_satlib_uf20_r000_r111_residual_local_invariant_falsifier.independent_checker --candidate-json /tmp/local-falsifier.json > /tmp/local-falsifier-independent.json
      - name: Assert frozen outcome partition and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/local-falsifier.json').read_text().strip().splitlines()[-1])
          i=json.loads(Path('/tmp/local-falsifier-independent.json').read_text().strip().splitlines()[-1])
          allowed={'PASS_SCOPED_AT_LEAST_ONE_PREREGISTERED_LOCAL_CANDIDATE_SURVIVES_FALSIFIER','FAIL_NO_PREREGISTERED_LOCAL_CANDIDATE_SURVIVES_FALSIFIER'}
          assert c['verdict'] in allowed,c
          assert c['source_guard']['ok'] is True,c['source_guard']
          assert i['verified'] is True and i['candidate_imported'] is False,i
          assert len(c['candidate_results'])==4,c
          assert [x['candidate_id'] for x in c['candidate_results']]==[
            'L1_ROOT_PAIR_MULTIPLICITY_MULTISET',
            'L2_ROOT_INCIDENT_HYPEREDGE_NEIGHBOR_PROFILE',
            'L3_THREE_ROUND_INCIDENCE_WL_ROOT_COLOR',
            'L4_ROOT_SIMPLE_INCIDENCE_6CYCLE_PROFILE'],c
          rr=c['resource_receipt']
          assert rr['candidate_count']==4 and rr['candidate_value_families_computed']==20,rr
          assert rr['full_assignment_cube_enumerations']==0 and rr['solver_invocations']==0 and rr['group_searches']==0,rr
          assert rr['new_solver_mechanisms']==0 and rr['new_carrier_mechanisms']==0 and rr['new_adapters']==0 and rr['new_quotients']==0 and rr['budget_raise'] is False,rr
          sf=c['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN' and sf['GENERAL_SAT_IN_P']=='NOT_PROVED' and sf['CONNECTED_MIXED_CORE_SOLVED']=='NO',sf
          print(json.dumps({
            'verdict':c['verdict'],
            'surviving_candidates':c['surviving_candidates'],
            'candidate_summary':[{
              'candidate_id':x['candidate_id'],
              'survives':x['survives'],
              'control_pair_class':x['control_pair_class'],
              'panel_all_singleton':x['panel_all_singleton'],
              'panel_nontrivial':{r['source']:r['nontrivial_classes'] for r in x['rows'] if r['source']!='UF20_01'}
            } for x in c['candidate_results']],
            'independent_verified':i['verified']
          },sort_keys=True))
          PY
      - name: Upload falsifier receipt
        uses: actions/upload-artifact@v4
        with:
          name: satlib-uf20-r000-r111-residual-local-invariant-falsifier-receipt
          path: |
            /tmp/local-falsifier.json
            /tmp/local-falsifier-independent.json
          if-no-files-found: error
      - name: Authority notice
        run: |
          echo 'AUTHORITY=DIAGNOSTIC_FROZEN_FOUR_CANDIDATE_EVALUATION_ONLY'
          echo 'NEW_SOLVER_MECHANISMS=0'
          echo 'NEW_CARRIER_MECHANISMS=0'
          echo 'GROUP_SEARCHES=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
