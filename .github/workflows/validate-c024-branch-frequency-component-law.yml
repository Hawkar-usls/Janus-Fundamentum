name: Validate C024 Branch Frequency Component Law

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_branch_frequency_component_law.py"
      - ".github/workflows/validate-c024-branch-frequency-component-law.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_branch_frequency_component_law.py"
      - ".github/workflows/validate-c024-branch-frequency-component-law.yml"

permissions:
  contents: read

jobs:
  branch-frequency-component-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit quotient-component factorization of branch frequencies
        run: python experiments/direct/janus_tear_gt_branch_frequency_component_law.py
