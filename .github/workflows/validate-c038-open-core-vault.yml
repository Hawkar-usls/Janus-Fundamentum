name: Validate C038 Proof-Carrying Open-Core Vault

on:
  push:
    paths:
      - "experiments/direct/janus_c038_open_core_vault.py"
      - "schemas/c038-open-core-vault.sql"
      - "schemas/c038-open-core-vault-v1.schema.json"
      - "docs/C038_PROOF_CARRYING_OPEN_CORE_VAULT.md"
      - "proposals/C038-PROOF-CARRYING-OPEN-CORE-VAULT.json"
      - "registry/c038-source-map.json"
      - ".github/workflows/validate-c038-open-core-vault.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c038_open_core_vault.py"
      - "schemas/c038-open-core-vault.sql"
      - "schemas/c038-open-core-vault-v1.schema.json"
      - "docs/C038_PROOF_CARRYING_OPEN_CORE_VAULT.md"
      - "proposals/C038-PROOF-CARRYING-OPEN-CORE-VAULT.json"
      - "registry/c038-source-map.json"
      - ".github/workflows/validate-c038-open-core-vault.yml"

permissions:
  contents: read

jobs:
  exact-open-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c038_open_core_vault.py --self-test
      - run: python -m json.tool proposals/C038-PROOF-CARRYING-OPEN-CORE-VAULT.json >/dev/null
      - run: python -m json.tool registry/c038-source-map.json >/dev/null
      - run: python -m json.tool schemas/c038-open-core-vault-v1.schema.json >/dev/null
      - run: sqlite3 :memory: < schemas/c038-open-core-vault.sql
