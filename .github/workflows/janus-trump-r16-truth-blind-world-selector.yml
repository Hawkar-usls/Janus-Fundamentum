name: JANUS TRUMP R16 Truth Blind World Selector

on:
  push:
    branches:
      - research/janus-trump-r16-prospective-unseen-factored-bridge-holdout-2026-09-02
    paths:
      - 'research/JANUS_TRUMP_R16_WORLD_SELECTOR_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r16_truth_blind_world_selector.py'
      - '.github/workflows/janus-trump-r16-truth-blind-world-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r16-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify selector preregistration and candidate freeze
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.load(open('research/JANUS_TRUMP_R16_WORLD_SELECTOR_PREREGISTRATION_2026-09-02.json'))
          assert p['status']=='FROZEN_BEFORE_R16_WORLD_SELECTION'
          assert p['truth_firewall']=='WORLD_SELECTION_BEFORE_TRUTH__WORLD_SELECTION_BEFORE_CANDIDATE__NO_CHERRY_PICKING_BY_OUTCOME'
          got=subprocess.check_output(['git','hash-object',p['frozen_candidate']['path']],text=True).strip()
          assert got==p['frozen_candidate']['blob_sha'],(got,p['frozen_candidate']['blob_sha'])
          assert p['P_VS_NP']=='OPEN'
          print('R16_SELECTOR_FREEZE_OK',got)
          PY

      - name: Compile selector
        run: PYTHONPATH=experiments:. python -m py_compile experiments/janus_trump_r16_truth_blind_world_selector.py

      - name: Select worlds without truth or candidate access
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r16_truth_blind_world_selector.py \
            --output artifacts/JANUS_TRUMP_R16_TRUTH_BLIND_WORLD_SELECTION_RESULT_2026-09-02.json

      - name: Selector integrity gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R16_TRUTH_BLIND_WORLD_SELECTION_RESULT_2026-09-02.json'))
          assert d['status']=='SELECTOR_PASS',d
          assert d['selected_world_count']==8
          assert d['selector_firewall']['pass'] is True
          assert d['truth_accessed'] is False
          assert d['candidate_accessed'] is False
          assert len({w['frame_sha256'] for w in d['selected_worlds']})==8
          assert all(w['frame_type']=='GENERAL_CNF' for w in d['selected_worlds'])
          assert all(6 <= w['bridge_variable_count'] <= 16 for w in d['selected_worlds'])
          assert d['P_VS_NP']=='OPEN'
          print('R16_SELECTOR_PASS')
          PY

      - name: Upload immutable selector evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r16-truth-blind-world-selection
          path: artifacts/JANUS_TRUMP_R16_TRUTH_BLIND_WORLD_SELECTION_RESULT_2026-09-02.json
          if-no-files-found: error
