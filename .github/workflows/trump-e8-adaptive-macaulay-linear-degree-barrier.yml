name: TRUMP E8 Adaptive Macaulay Linear Degree Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_ADAPTIVE_MACAULAY_LINEAR_DEGREE_EXPONENTIAL_BARRIER_2026-09-30_v4.5.json'
      - 'research/tools/e8_adaptive_macaulay_linear_degree_barrier/checker.py'
      - '.github/workflows/trump-e8-adaptive-macaulay-linear-degree-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact adaptive Macaulay dimension regression
        run: python research/tools/e8_adaptive_macaulay_linear_degree_barrier/checker.py
