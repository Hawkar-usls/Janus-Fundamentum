name: TRUMP UF20 076-175 corrected dual-mirror source acquisition v2

on:
  push:
    branches:
      - research/trump-uf20-076-175-prospective-wl-orbit-bridge-2026-09-17
    paths:
      - .github/workflows/trump-uf20-076-175-corrected-source-acquisition-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-corrected:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen erratum and v2 implementation blobs
        run: |
          set -euo pipefail
          test "$(git hash-object research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_PANEL_RESERVATION_PREREGISTRATION_2026-09-17_v1.0.json)" = "a242cb6b60b0f9531a0b942706145417f349aca8"
          test "$(git hash-object research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_SOURCE_ACQUISITION_PREREGISTRATION_2026-09-17_v1.0.json)" = "67f4ddc9704d38816ab126000b503f3302fafa10"
          test "$(git hash-object research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_SOURCE_ACQUISITION_REVIEW_2026-09-17_v1.0.json)" = "e94025710ccd23691ecddbfe03ef70ccf4a0fbf6"
          test "$(git hash-object research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_SOURCE_ACQUISITION_FILENAME_ERRATUM_2026-09-17_v1.0.json)" = "d40007eda2cc480c6ba8ba3fb4d95de2d5df7f0f"
          test "$(git hash-object research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_SOURCE_ACQUISITION_FILENAME_ERRATUM_REVIEW_2026-09-17_v1.0.json)" = "8528779730c38171e36400bc7e5427a7b3538886"
          test "$(git hash-object research/tools/apma_uf20_076_175_second_prospective_source_acquisition/candidate_v2.py)" = "e2bc4dffced201d3c0194055d7602dd774e44c34"
          test "$(git hash-object research/tools/apma_uf20_076_175_second_prospective_source_acquisition/independent_check_v2.py)" = "7933b3479ea7cacea022b567dcfc2b2914673425"

      - name: Execute corrected acquisition from UF20_076 through UF20_175
        run: |
          set -euo pipefail
          python research/tools/apma_uf20_076_175_second_prospective_source_acquisition/candidate_v2.py > /tmp/acquire-v2.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/acquire-v2.json'))
          print('candidate verdict:',x['verdict'],'rows:',len(x.get('source_receipts',[])))
          assert x['verdict']=='PASS_UF20_076_175_DUAL_MIRROR_SOURCE_ACQUISITION_AND_FORMULA_FREEZE',x
          assert len(x['source_receipts'])==100
          assert x['source_receipts'][0]['source']=='UF20_076'
          assert x['source_receipts'][-1]['source']=='UF20_175'
          assert x['source_receipts'][24]['source']=='UF20_100'
          assert x['source_receipts'][24]['remote_filename']=='uf20-0100.cnf'
          assert x['source_receipts'][-1]['remote_filename']=='uf20-0175.cnf'
          r=x['resource_receipt']
          assert r['remote_source_fetches']==200
          assert r['projected_raw_computations']==0
          assert r['pendant_target_computations']==0
          assert r['wl_computations']==0
          assert r['direct_transposition_checks']==0
          assert r['portfolio_replays']==0
          assert r['e3_witness_computations']==0
          assert r['solver_invocations']==0
          PY

      - name: Independently refetch and verify all one hundred corrected sources
        run: |
          set -euo pipefail
          python research/tools/apma_uf20_076_175_second_prospective_source_acquisition/independent_check_v2.py --candidate /tmp/acquire-v2.json > /tmp/independent-v2.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/independent-v2.json'))
          print('independent verdict:',x['verdict'],'verified:',x.get('sources_verified'))
          assert x['candidate_imported'] is False
          assert x['verdict']=='PASS_INDEPENDENT_UF20_076_175_SOURCE_FREEZE_VERIFICATION',x
          assert x['sources_verified']==100
          assert len(x['verified_rows'])==100
          assert all(r['independent_verified'] for r in x['verified_rows'])
          rr=x['resource_receipt']
          assert rr['remote_source_fetches']==200
          assert rr['projected_raw_computations']==rr['wl_computations']==rr['portfolio_replays']==rr['e3_witness_computations']==0
          PY

      - name: Build frozen corrected source acquisition result
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          c=json.load(open('/tmp/acquire-v2.json'))
          k=json.load(open('/tmp/independent-v2.json'))
          verified={r['source']:r for r in k['verified_rows']}
          rows=[]
          for row in c['source_receipts']:
              v=verified[row['source']]
              assert v['independent_verified']
              assert v['committed_git_blob']==row['computed_committed_git_blob']
              assert v['canonical_formula_sha256']==row['canonical_formula_sha256']
              rr=dict(row)
              rr['independent_verified']=True
              rr['status']='SOURCE_FROZEN'
              rr['committed_git_blob']=v['committed_git_blob']
              rows.append(rr)
          def h(path):return subprocess.check_output(['git','hash-object',path],text=True).strip()
          result={
            'artifact_id':'JANUS-TRUMP-UF20-076-175-SECOND-PROSPECTIVE-WL-ORBIT-BRIDGE-CORRECTED-SOURCE-ACQUISITION-RESULT-2026-09-17-v1.0',
            'date':'2026-09-17',
            'status':'FROZEN_SECOND_PROSPECTIVE_BLIND_SOURCE_ACQUISITION_RESULT_AFTER_FILENAME_ERRATUM',
            'verdict':'PASS_UF20_076_175_DUAL_MIRROR_SOURCE_ACQUISITION_AND_FORMULA_FREEZE',
            'implementation_correction':'REMOTE_FILENAME_ENCODING_ONLY__NUMERIC_IDENTITIES_PANEL_MIRRORS_AND_FORMULA_CONTRACT_UNCHANGED',
            'source_receipts':rows,
            'execution':{'run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT']),'independent_verdict':k['verdict'],'sources_verified':100,'candidate_imported_by_independent_checker':False},
            'authorities':{
              'reservation_commit':'844a4907874b6630ca4a43a728e8c3ef12b378e0',
              'original_acquisition_prereg_commit':'98c3a18844e4e8cafd5d2738b0430ed44166c8a9',
              'original_acquisition_review_commit':'caeab8a42838cff16e5d0518e1e6b4149f3e1bea',
              'filename_erratum_commit':'903d92dcdfc31048972dbbbade75389849684230',
              'filename_erratum_review_commit':'be3de8381f6e708e89392513fdb7f1f744051af8',
              'candidate_v2_commit':'fd64975867e3a5937f92559a91039a827f2790f5',
              'candidate_v2_blob':'e2bc4dffced201d3c0194055d7602dd774e44c34',
              'independent_checker_v2_commit':'69d9f058119454edf36a54b74777b0501ec73003',
              'independent_checker_v2_blob':'7933b3479ea7cacea022b567dcfc2b2914673425',
              'workflow_head':os.environ['WORKFLOW_HEAD'],
              'workflow_blob':h('.github/workflows/trump-uf20-076-175-corrected-source-acquisition-v2.yml')
            },
            'failed_original_attempt':{'run_id':35268385810,'first_failed_reserved_identity':'UF20_100','failure_class':'REMOTE_FILENAME_ENCODING_BUG_ONLY','structural_values_computed':0},
            'blind_barrier_receipt':{'projected_raw_computations':0,'pendant_target_computations':0,'wl_computations':0,'direct_transposition_checks':0,'portfolio_replays':0,'e3_witness_computations':0,'solver_invocations':0},
            'claim_ceiling':'SOURCE_PROVENANCE_AND_DUAL_MIRROR_FORMULA_FREEZE_ONLY',
            'next_step':'PREREGISTER_SECOND_PROSPECTIVE_WL_FIRST_THEN_EXISTING_E1_E2_E3_GROUND_TRUTH_EVALUATION_ON_THE_ENTIRE_FIXED_ONE_HUNDRED_SOURCE_PANEL',
            'scientific_firewall':{'P_VS_NP':'OPEN','GENERAL_SAT_IN_P':'NOT_PROVED','GENERAL_RESIDUAL_SEPARATOR_TRACTABILITY':'NOT_PROVED','WL_SUFFICIENCY_FOR_ORBIT_CLOSURE':'NOT_PROVED'}
          }
          Path('research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_CORRECTED_SOURCE_ACQUISITION_RESULT_2026-09-17_v1.0.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload corrected acquisition receipts
        uses: actions/upload-artifact@v4
        with:
          name: uf20-076-175-corrected-source-acquisition-v2-receipt
          path: |
            /tmp/acquire-v2.json
            /tmp/independent-v2.json
            research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_CORRECTED_SOURCE_ACQUISITION_RESULT_2026-09-17_v1.0.json

      - name: Atomically freeze all one hundred sources and result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/source_data/SATLIB_UF20_*_2026-09-17.cnf
          git add research/TRUMP_UF20_076_175_SECOND_PROSPECTIVE_WL_ORBIT_BRIDGE_CORRECTED_SOURCE_ACQUISITION_RESULT_2026-09-17_v1.0.json
          git diff --cached --check
          count=$(git diff --cached --name-only | wc -l)
          echo "staged file count: $count"
          test "$count" -eq 101
          git commit -m 'TRUMP freeze corrected prospective UF20 076-175 dual-mirror source panel'
          git push origin HEAD:${GITHUB_REF_NAME}
