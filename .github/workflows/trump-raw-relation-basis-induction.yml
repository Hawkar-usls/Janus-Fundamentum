name: TRUMP Raw Relation Basis Induction

on:
  push:
    branches:
      - research/trump-unseen-exact-basis-induction-2026-09-15
    paths:
      - 'research/TRUMP_UNSEEN_BASIS_HARVEST_LEDGER_2026-09-15.json'
      - 'research/TRUMP_RAW_RELATION_SCHAEFER_BASIS_INDUCTION_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_unseen_basis/**'
      - '.github/workflows/trump-raw-relation-basis-induction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-basis-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent raw relation basis checker
        shell: bash
        run: |
          set -euo pipefail
          python -m research.tools.apma_unseen_basis.independent_checker | tee /tmp/raw-basis.json

      - name: Assert scoped verdict and firewalls
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/raw-basis.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_RAW_RELATION_SCHAEFER_BASIS_INDUCTION', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN', sf
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED', sf
          assert sf['ARBITRARY_UNSEEN_INVARIANT_DISCOVERY']=='NOT_PROVED', sf
          assert sf['GLOBAL_APMA_FRONTIER_ADVANCE']=='NONE_PENDING_HQ_REVIEW', sf
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Inverted Pyramid regression
        run: python -m research.tools.apma_inverted_pyramid.independent_checker

      - name: Schaefer mixed-carrier barrier regression
        run: python research/tools/apma_mixed_carrier_barrier/check_schaefer_barrier.py

      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker

      - name: Log alien transfer regression
        run: python -m research.tools.apma_log_alien_transfer.independent_checker

      - name: Authority notice
        run: |
          echo 'SCOPED_RAW_RELATION_BASIS_INDUCTION_ONLY'
          echo 'SOLVER_EXECUTION_IN_GATE=ZERO'
          echo 'ARBITRARY_UNSEEN_INVARIANT_DISCOVERY=NOT_PROVED'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
