name: Validate C025 Factorized Resolution Holdout Search

on:
  push:
    branches:
      - research/c025-unified-proof-carrying-akinator-jec
    paths:
      - 'experiments/direct/janus_factorized_resolution_product_holdout_search.py'
      - 'research/C025_FACTORIZED_RESOLUTION_PRODUCT_HOLDOUT_SEARCH_PREREGISTRATION_2026-08-26.json'
      - '.github/workflows/validate-c025-factorized-resolution-holdout-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-holdout-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile holdout selector
        run: python -m py_compile experiments/direct/janus_factorized_resolution_product_holdout_search.py
      - name: Enforce no future factorizer dependency
        run: |
          if grep -Eqi 'import .*factorized|from .*factorized' experiments/direct/janus_factorized_resolution_product_holdout_search.py; then
            echo 'forbidden factorizer dependency detected'
            exit 1
          fi
      - name: Execute preregistered blind holdout search
        run: python experiments/direct/janus_factorized_resolution_product_holdout_search.py
