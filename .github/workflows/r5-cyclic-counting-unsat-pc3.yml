name: R5 Cyclic Counting UNSAT vs PC3 Universal Thesis
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_cyclic_not3div_pc3_arithmetic_challenge.py'
      - '.github/workflows/r5-cyclic-counting-unsat-pc3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counting-unsat-pc3:
    name: 'Odd Cn legal SCL with n mod3 nonzero: exact invariant PC3'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Arithmetic forced UNSAT vs complete GF2 degree-3 polynomial calculus
        run: python -u experiments/r5_universal_cyclic_not3div_pc3_arithmetic_challenge.py
