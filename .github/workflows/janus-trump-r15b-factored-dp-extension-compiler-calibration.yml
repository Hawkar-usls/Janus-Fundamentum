name: JANUS TRUMP R15B Factored DP Extension Compiler Calibration

on:
  push:
    branches:
      - research/janus-trump-r15b-factored-dp-extension-compiler-calibration-2026-09-02
    paths:
      - 'research/JANUS_TRUMP_R15B_FACTORED_DP_EXTENSION_COMPILER_CALIBRATION_PREREGISTRATION_2026-09-02.json'
      - 'experiments/janus_trump_r15b_factored_dp_extension_compiler_calibration.py'
      - 'tests/test_janus_trump_r15b_factored_dp_extension_compiler_calibration.py'
      - '.github/workflows/janus-trump-r15b-factored-dp-extension-compiler-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r15b-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen R15B preregistration
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/JANUS_TRUMP_R15B_FACTORED_DP_EXTENSION_COMPILER_CALIBRATION_PREREGISTRATION_2026-09-02.json'))
          assert p['status']=='FROZEN_BEFORE_R15B_IMPLEMENTATION_AND_EXECUTION'
          assert p['parent_R15A_result_summary_commit']=='c25440cd546046a22be098676fd8d70d83447676'
          assert p['resource_envelope']['wall_seconds']==600
          assert p['P_VS_NP']=='OPEN'
          print('R15B_FREEZE_OK')
          PY
      - name: Compile R15B
        run: |
          PYTHONPATH=experiments:. python -m py_compile \
            experiments/janus_trump_r15b_factored_dp_extension_compiler_calibration.py \
            tests/test_janus_trump_r15b_factored_dp_extension_compiler_calibration.py
      - name: R15B unit controls
        run: |
          PYTHONPATH=experiments:. python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('r15btests','tests/test_janus_trump_r15b_factored_dp_extension_compiler_calibration.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          tests=[getattr(m,n) for n in dir(m) if n.startswith('test_r15b')]
          for t in tests: t()
          print('R15B_TESTS_PASS',len(tests))
          PY
      - name: Run frozen R15B calibration
        run: |
          mkdir -p artifacts
          PYTHONPATH=experiments:. python experiments/janus_trump_r15b_factored_dp_extension_compiler_calibration.py \
            --output artifacts/JANUS_TRUMP_R15B_FACTORED_DP_EXTENSION_COMPILER_CALIBRATION_RESULT_2026-09-02.json
      - name: R15B scientific integrity gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/JANUS_TRUMP_R15B_FACTORED_DP_EXTENSION_COMPILER_CALIBRATION_RESULT_2026-09-02.json'))
          assert d['P_VS_NP']=='OPEN'
          assert all(d['gates'].values()), d['gates']
          assert d['verdict']!='FAIL_INTEGRITY'
          if d['candidate']['status'].startswith('COMPLETE'):
              assert d['post_candidate_control']['mismatch_count']==0
          else:
              assert d['candidate']['status']=='OPEN_RESOURCE_LIMIT'
              assert d['post_candidate_control']['not_run'] is True
          print(d['verdict'])
          PY
      - name: Upload immutable R15B evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r15b-factored-dp-extension-compiler-calibration
          path: artifacts/JANUS_TRUMP_R15B_FACTORED_DP_EXTENSION_COMPILER_CALIBRATION_RESULT_2026-09-02.json
          if-no-files-found: error
