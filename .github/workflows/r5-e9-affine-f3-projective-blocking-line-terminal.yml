name: R5 E9 Affine F3 Projective Blocking Line Terminal

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PROJECTIVE_BLOCKING_LINE_TERMINAL_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_projective_blocking_line_terminal.py'
      - '.github/workflows/r5-e9-affine-f3-projective-blocking-line-terminal.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact projective blocking-line regression
        run: python experiments/r5_e9_affine_f3_projective_blocking_line_terminal.py
