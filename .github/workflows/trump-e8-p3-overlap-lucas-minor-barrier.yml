name: TRUMP E8 P3-overlap Lucas minor barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P3_OVERLAP_EXPONENTIAL_MINOR_LUCAS_BARRIER_2026-09-30_v2.5.json'
      - 'research/tools/e8_p3_overlap_lucas_minor_barrier/checker.py'
      - '.github/workflows/trump-e8-p3-overlap-lucas-minor-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Lucas determinant regression
        run: python research/tools/e8_p3_overlap_lucas_minor_barrier/checker.py
