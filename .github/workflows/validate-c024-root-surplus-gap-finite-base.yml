name: Validate C024 Root Surplus Gap Finite Base

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_surplus_gap_finite_base.py"
      - ".github/workflows/validate-c024-root-surplus-gap-finite-base.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_surplus_gap_finite_base.py"
      - ".github/workflows/validate-c024-root-surplus-gap-finite-base.yml"

permissions:
  contents: read

jobs:
  root-surplus-gap-finite-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certify exact root surplus gap through GT_47
        run: python experiments/direct/janus_tear_gt_root_surplus_gap_finite_base.py
