name: Validate C024 Spanning Cycle Resolution Closure

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_spanning_cycle_resolution_closure.py"
      - "proof_attempts/C024/GT_SPANNING_CYCLE_RESOLUTION_CLOSURE.md"
      - ".github/workflows/validate-c024-spanning-cycle-resolution-closure.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_spanning_cycle_resolution_closure.py"
      - "proof_attempts/C024/GT_SPANNING_CYCLE_RESOLUTION_CLOSURE.md"
      - ".github/workflows/validate-c024-spanning-cycle-resolution-closure.yml"

permissions:
  contents: read

jobs:
  spanning-cycle-resolution-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust abstract mixed-parent resolutions
        run: python experiments/direct/janus_tear_gt_spanning_cycle_resolution_closure.py
