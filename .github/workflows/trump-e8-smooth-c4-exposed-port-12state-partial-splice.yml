    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_EXPOSED_PORT_12STATE_PARTIAL_SPLICE_QUOTIENT_2026-09-30_v8.2.json'
      - 'research/tools/e8_smooth_c4_exposed_port_12state_partial_splice/checker.py'
      - '.github/workflows/trump-e8-smooth-c4-exposed-port-12state-partial-splice.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_SMOOTH_C4_EXPOSED_PORT_12STATE_PARTIAL_SPLICE_QUOTIENT_2026-09-30_v8.2.json'
      - 'research/tools/e8_smooth_c4_exposed_port_12state_partial_splice/checker.py'
