name: JANUS TRUMP R44D Obstruction Consumption

on:
  push:
    branches:
      - research/r44-exact-representation-switchboard-coverage-counterexample-2026-09-03
  pull_request:
    paths:
      - 'research/janus_trump_r44_exact_representation_switchboard.py'
      - 'research/janus_trump_r44d_obstruction_consumption.py'
      - 'research/JANUS_TRUMP_R44D_OBSTRUCTION_CONSUMPTION_2026-09-03.json'
      - '.github/workflows/janus-trump-r44d-obstruction-consumption.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay R44D
        run: python research/janus_trump_r44d_obstruction_consumption.py
