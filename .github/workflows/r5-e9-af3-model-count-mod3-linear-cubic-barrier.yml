name: R5 E9 AF3 Model Count Mod3 Linear Cubic Barrier

on:
  pull_request:
    paths:
      - 'research/R5_E9_AF3_MODEL_COUNT_MOD3_LINEAR_CUBIC_BARRIER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_af3_model_count_mod3_linear_cubic_barrier.py'
      - '.github/workflows/r5-e9-af3-model-count-mod3-linear-cubic-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact AF3 mod-3 count barrier regression
        run: python experiments/r5_e9_af3_model_count_mod3_linear_cubic_barrier.py
