name: R5 N14 Anchored Physical Colour Independent Source Control
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_n14_anchor_rejection_independent_control.py'
      - '.github/workflows/r5-n14-anchor-independent-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    name: Compare all physical boundary signatures and optimised anchored pruning on n14
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full non-anchored source replay independent of exact n14 census
        run: python -u experiments/r5_universal_n14_anchor_rejection_independent_control.py
