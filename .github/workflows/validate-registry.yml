name: Validate JANUS registry

on:
  push:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate machine-readable laboratory
        run: python tools/validate_registry.py

      - name: Validate hypothesis inheritance
        run: python tools/validate_lineage.py
