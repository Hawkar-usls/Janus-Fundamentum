name: Validate JANUS registry

on:
  push:
    branches:
      - authority/trump-k5-two-factor-v3.17-2026-09-15
    paths:
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authority branch
        uses: actions/checkout@v4
        with:
          ref: authority/trump-k5-two-factor-v3.17-2026-09-15
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync pointers
        run: python tools/tmp_trump_v317_pointer_sync.py

      - name: Validate updated registry
        run: python tools/validate_registry.py

      - name: Commit clean authority pointers
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate-registry.yml
          git rm -f tools/tmp_trump_v317_pointer_sync.py
          git add START_HERE_TRUMP_CONTEXT.md registry/TRUMP_CONTEXT_MANIFEST.json .github/workflows/validate-registry.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "authority: sync TRUMP context pointers to v3.17"
          git push origin HEAD:authority/trump-k5-two-factor-v3.17-2026-09-15
