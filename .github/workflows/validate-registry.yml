name: Validate JANUS registry

on:
  push:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - "tools/validate_inversion_matrix.py"
      - "tools/validate_cycle_pressure.py"
      - "experiments/theta/**"
      - "proof_attempts/**"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - "tools/validate_inversion_matrix.py"
      - "tools/validate_cycle_pressure.py"
      - "experiments/theta/**"
      - "proof_attempts/**"
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate machine-readable laboratory
        run: python tools/validate_registry.py

      - name: Validate hypothesis inheritance
        run: python tools/validate_lineage.py

      - name: Validate inversion matrix
        run: python tools/validate_inversion_matrix.py

      - name: Validate current-cycle attack pressure
        run: python tools/validate_cycle_pressure.py

      - name: Test DIMACS and conflict graph semantics
        run: python experiments/theta/conflict_graph.py --self-test

      - name: Test canonical theta profile
        run: python experiments/theta/canonical_profile.py --self-test

      - name: Test signed-coordinate transport
        run: python experiments/theta/symmetry_transport.py --self-test

      - name: Test rational Gram verifier
        run: python experiments/theta/rational_gram_verifier.py --self-test

      - name: Test rational LDL certificates
        run: python experiments/theta/rational_ldl.py --self-test

      - name: Test exact Lovasz theta certificates
        run: python experiments/theta/lovasz_theta_certificate.py --self-test

      - name: Test disjoint-union amplification fixtures
        run: python experiments/theta/disjoint_union.py --self-test

      - name: Test exact theta collision bundles
        run: python experiments/theta/theta_collision_bundle.py --self-test
