name: Validate JANUS registry

on:
  push:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - "tools/validate_inversion_matrix.py"
      - "tools/validate_cycle_pressure.py"
      - "tools/validate_total_attack_sweep.py"
      - "experiments/theta/**"
      - "experiments/direct/**"
      - "proof_attempts/**"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "registry/**"
      - "tools/validate_registry.py"
      - "tools/validate_lineage.py"
      - "tools/validate_inversion_matrix.py"
      - "tools/validate_cycle_pressure.py"
      - "tools/validate_total_attack_sweep.py"
      - "experiments/theta/**"
      - "experiments/direct/**"
      - "proof_attempts/**"
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate machine-readable laboratory
        run: python tools/validate_registry.py

      - name: Validate hypothesis inheritance
        run: python tools/validate_lineage.py

      - name: Validate inversion matrix
        run: python tools/validate_inversion_matrix.py

      - name: Validate latest hypothesis-generation pressure
        run: python tools/validate_cycle_pressure.py

      - name: Validate historical total-attack snapshot
        run: python tools/validate_total_attack_sweep.py

      - name: Test DIMACS and conflict graph semantics
        run: python experiments/theta/conflict_graph.py --self-test

      - name: Test canonical theta profile
        run: python experiments/theta/canonical_profile.py --self-test

      - name: Test signed-coordinate transport
        run: python experiments/theta/symmetry_transport.py --self-test

      - name: Test rational Gram verifier
        run: python experiments/theta/rational_gram_verifier.py --self-test

      - name: Test rational LDL certificates
        run: python experiments/theta/rational_ldl.py --self-test

      - name: Test exact Lovasz theta certificates
        run: python experiments/theta/lovasz_theta_certificate.py --self-test

      - name: Test disjoint-union amplification fixtures
        run: python experiments/theta/disjoint_union.py --self-test

      - name: Test exact theta collision bundles
        run: python experiments/theta/theta_collision_bundle.py --self-test

      - name: Verify complete-3CNF exact theta collision
        run: python experiments/theta/complete_3cnf_collision.py --self-test

      - name: Verify amplified exact theta family
        run: python experiments/theta/complete_3cnf_family.py --self-test

      - name: Verify seed-9379992 connected theta arches
        run: python experiments/theta/seeded_arches.py --self-test

      - name: Stress exact LDL with seed 9379992
        run: python experiments/theta/seeded_ldl_stress.py --self-test

      - name: Audit one-sided SAT error certificates
        run: python experiments/direct/sat_error_audit.py --self-test

      - name: Audit finite circuit rewrite chains
        run: python experiments/direct/rewrite_chain_audit.py --self-test

      - name: Audit signed local neighborhoods
        run: python experiments/direct/local_neighborhood_audit.py --self-test

      - name: Verify positive-only anti-checker obstruction
        run: python experiments/direct/positive_only_antichecker_obstruction.py --self-test

      - name: Audit contextual Circuit-Frege upper bound
        run: python experiments/direct/contextual_ef_upper_bound.py --self-test

      - name: Verify exact XOR-cycle local twins
        run: python experiments/direct/xor_cycle_local_twins.py --self-test

      - name: Verify SAT-sound witness cover
        run: python experiments/direct/sound_witness_cover.py --self-test

      - name: Verify high-treewidth toroidal Tseitin twins
        run: python experiments/direct/toroidal_tseitin_twins.py --self-test

      - name: Audit anti-checker length normalization
        run: python experiments/direct/length_parameter_audit.py --self-test

      - name: Verify connected toroidal Tseitin twins
        run: python experiments/direct/connected_toroidal_tseitin_twins.py --self-test

      - name: Verify exact-list SAT-sound cover
        run: python experiments/direct/exact_list_sound_cover.py --self-test

      - name: Audit JANUS Tear connector and 2-SAT certificates
        run: python experiments/direct/janus_tear_adversarial_audit.py --self-test

      - name: Reject marginal JANUS Tear signature language
        run: python experiments/direct/janus_tear_marginal_collision.py

      - name: Reject universal continuation-complete Tear quotient
        run: python experiments/direct/janus_tear_congruence_explosion.py --self-test

      - name: Audit policy-selected Tear frontier width
        run: python experiments/direct/janus_tear_policy_frontier.py --self-test

      - name: Audit strong 2-SAT backdoor Tear policy
        run: python experiments/direct/janus_tear_backdoor_policy.py --self-test

      - name: Audit Observer effects, oracles and collapse
        run: python experiments/direct/janus_observer_effect_audit.py --self-test

      - name: Audit Infinite Oracle proof-carrying bridge
        run: python experiments/direct/infinite_oracle_bridge_audit.py --self-test
