name: validate-c025-root-anchored-iteration

on:
  push:
    branches:
      - research/c025-pirc-gpei-2026-08-27
    paths:
      - 'experiments/direct/janus_unified_macro_restore_v2.py'
      - 'experiments/direct/janus_unified_macro_restore_v3.py'
      - 'experiments/direct/janus_second_stage4_root_anchored_probe.py'
      - 'experiments/direct/janus_stage4_root_anchored_depth_probe.py'
      - '.github/workflows/validate-c025-root-anchored-iteration.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_unified_macro_restore_v2.py'
      - 'experiments/direct/janus_unified_macro_restore_v3.py'
      - 'experiments/direct/janus_second_stage4_root_anchored_probe.py'
      - 'experiments/direct/janus_stage4_root_anchored_depth_probe.py'
      - '.github/workflows/validate-c025-root-anchored-iteration.yml'

jobs:
  root-anchored-iteration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: v2 historical extension freshness
        run: python -m experiments.direct.janus_unified_macro_restore_v2
      - name: v3 extension-tail regression
        run: python -m experiments.direct.janus_unified_macro_restore_v3
      - name: Run root-anchored second Stage4 probe
        run: |
          python -m experiments.direct.janus_second_stage4_root_anchored_probe \
            | tee second-stage4-root-anchored.json
      - name: Print exact second-step result and enforce boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('second-stage4-root-anchored.json').read_text())
          b = data['scientific_boundary']
          assert b['finite_specimen_only'] is True
          assert b['universal_GPEI_preservation'] == 'OPEN'
          assert b['P_VS_NP'] == 'OPEN'
          print('SECOND_STAGE4_STATUS=' + data['status'])
          print('ROOT_FINGERPRINT=' + data['root_fingerprint'])
          print('ROOT_N=' + str(data['root_N']))
          print('ROOT_STATE_CAP=' + str(data['root_state_cap']))
          if data.get('second_stage4') is not None:
              assert b['root_budget_rebased'] is False
              ids = data['historical_extension_ids']
              assert ids == sorted(set(ids))
              r = data['resource_observation']
              assert r['within_root_state_cap'] is True
              print('SECOND_MODE=' + data['second_stage4']['mode'])
              print('EXTENSIONS=' + ','.join(map(str, ids)))
              print('SECOND_REENTRY=' + data['second_reentry']['status'])
              print('SECOND_REENTRY_MODE=' + str(data['second_reentry']['mode']))
              print('MAX_STATE_UNITS=' + str(r['max_state_units_seen']))
              print('CUMULATIVE_PROOF_BYTES=' + str(r['cumulative_proof_bytes']))
          print('UNIVERSAL_GPEI_PRESERVATION=OPEN')
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-second-stage4-root-anchored-latest
          path: second-stage4-root-anchored.json
      - name: Run root-anchored Stage4 depth probe on frozen R1 enumeration
        run: |
          python -m experiments.direct.janus_stage4_root_anchored_depth_probe \
            --nvars 4 --clauses 5 --min-width 3 --max-width 3 \
            --cap-exponent 2 --extension-exponent 1 --limit 5000 \
            | tee stage4-root-anchored-depth-r1.json
      - name: Print R1 depth profile and enforce scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('stage4-root-anchored-depth-r1.json').read_text())
          b = data['scientific_boundary']
          assert b['bounded_finite_probe_only'] is True
          assert b['root_budget_rebased'] is False
          assert b['grammar_changed_during_probe'] is False
          assert b['absence_of_open_is_not_universal_totality'] is True
          assert b['universal_stage4_iterability'] == 'OPEN'
          assert b['universal_GPEI_preservation'] == 'OPEN'
          assert b['P_VS_NP'] == 'OPEN'
          t = data['totals']
          print('R1_DEPTH_STATUS=' + data['status'])
          print('R1_OPEN3=' + str(t['open3']))
          print('R1_EVENTUALLY_DECIDED=' + str(t['eventually_decided']))
          print('R1_REMAINING_OPEN=' + str(t['remaining_open']))
          print('R1_DEPTH_HISTOGRAM=' + json.dumps(data['stage4_depth_histogram'], sort_keys=True))
          if data['first_remaining_open'] is not None:
              print('R1_FIRST_REMAINING_OPEN=' + data['first_remaining_open']['source_fingerprint'])
              print('R1_FIRST_REMAINING_BARRIER=' + data['first_remaining_open']['result']['barrier'])
          print('P_VS_NP=OPEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c025-stage4-root-anchored-depth-r1
          path: stage4-root-anchored-depth-r1.json
