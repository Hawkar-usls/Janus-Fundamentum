name: TRUMP Stage4 Public Tool Acquisition

on:
  push:
    branches:
      - research/general-sat-universal-coverage-map-2026-09-19
    paths:
      - ".github/workflows/trump-stage4-public-tool-acquisition.yml"
      - "research/tools/trump_r50g25x_external_incidence_td_harness.py"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backdoor-dnf-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Acquire authors' Zenodo record and bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage4/dnf/files stage4/dnf/unpacked
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile, urllib.request, zipfile

          api = "https://zenodo.org/api/records/11259842"
          req = urllib.request.Request(api, headers={"User-Agent":"JANUS-public-artifact-replay/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              record = json.load(r)
          pathlib.Path("stage4/dnf/zenodo_record.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          rows = []
          for f in record.get("files", []):
              name = f.get("key") or f.get("filename")
              links = f.get("links", {})
              url = links.get("self") or links.get("content")
              if not name or not url:
                  continue
              dst = pathlib.Path("stage4/dnf/files") / pathlib.Path(name).name
              req = urllib.request.Request(url, headers={"User-Agent":"JANUS-public-artifact-replay/1.0"})
              with urllib.request.urlopen(req, timeout=180) as r, open(dst, "wb") as o:
                  shutil.copyfileobj(r, o)
              raw = dst.read_bytes()
              rows.append({
                  "name": dst.name,
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "source_url": url,
              })
              try:
                  if zipfile.is_zipfile(dst):
                      target = pathlib.Path("stage4/dnf/unpacked") / dst.stem
                      target.mkdir(parents=True, exist_ok=True)
                      with zipfile.ZipFile(dst) as z:
                          z.extractall(target)
                  elif tarfile.is_tarfile(dst):
                      target = pathlib.Path("stage4/dnf/unpacked") / dst.stem
                      target.mkdir(parents=True, exist_ok=True)
                      with tarfile.open(dst) as t:
                          t.extractall(target, filter="data")
              except Exception as e:
                  rows[-1]["unpack_error"] = repr(e)

          out = {
              "schema":"janus.trump.backdoor_dnf_zenodo_acquisition.v1",
              "record_id": record.get("id"),
              "doi": record.get("doi"),
              "title": record.get("metadata",{}).get("title"),
              "files": rows,
              "acquired_file_count": len(rows),
          }
          pathlib.Path("stage4/dnf/acquisition.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if not rows:
              raise SystemExit("ZENODO_RECORD_RETURNED_NO_DOWNLOADABLE_FILES")
          PY
          find stage4/dnf -maxdepth 5 -type f -printf '%P\n' | sort > stage4/dnf/file_listing.txt
          grep -RIlE 'usage|argparse|click|pysat|cadical|backdoor' stage4/dnf/unpacked             > stage4/dnf/likely_code_or_docs.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: trump-stage4-backdoor-dnf-authors-artifact
          path: stage4/dnf/
          if-no-files-found: error
          retention-days: 30

  incidence-treewidth-public-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen R50G25X source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage4/source
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9992845123/zip"             -o stage4/source/r50g25x.zip
          unzip -q stage4/source/r50g25x.zip -d stage4/source/unpacked
          test -f stage4/source/unpacked/JANUS_TRUMP_R50G25X_ADVERSARIAL_STALL_SEARCH.json

      - name: Emit source-bound PACE incidence graphs
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/trump_r50g25x_external_incidence_td_harness.py emit             stage4/source/unpacked/JANUS_TRUMP_R50G25X_ADVERSARIAL_STALL_SEARCH.json             stage4/graphs

      - name: Acquire and build public TD finder and validator
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kit-algo/flow-cutter-pace17.git stage4/flow-cutter
          git clone --depth=1 https://github.com/holgerdell/td-validate.git stage4/td-validate
          git -C stage4/flow-cutter rev-parse HEAD > stage4/flowcutter.commit
          git -C stage4/td-validate rev-parse HEAD > stage4/tdvalidate.commit
          (cd stage4/flow-cutter && ./build.sh)
          (cd stage4/td-validate && make)

      - name: Find and independently validate decompositions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage4/td stage4/validation
          for g in stage4/graphs/*.gr; do
            base="$(basename "$g" .gr)"
            td="stage4/td/${base}.td"
            set +e
            timeout --signal=TERM --kill-after=3s 6s               stage4/flow-cutter/flow_cutter_pace17 "$g" > "$td" 2>"stage4/validation/${base}.finder.log"
            finder_rc=$?
            set -e
            echo "$finder_rc" > "stage4/validation/${base}.finder_rc"
            if stage4/td-validate/td-validate "$g" "$td"                  >"stage4/validation/${base}.log" 2>&1; then
              echo PASS > "stage4/validation/${base}.status"
            else
              echo FAIL > "stage4/validation/${base}.status"
            fi
          done
          FLOW_COMMIT="$(cat stage4/flowcutter.commit)"
          VAL_COMMIT="$(cat stage4/tdvalidate.commit)"
          python research/tools/trump_r50g25x_external_incidence_td_harness.py summarize             stage4/graphs stage4/td stage4/validation             stage4/TRUMP_R50G25X_EXTERNAL_INCIDENCE_TD_RESULTS.json             --flow-commit "$FLOW_COMMIT" --validator-commit "$VAL_COMMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: trump-stage4-external-incidence-treewidth
          path: |
            stage4/TRUMP_R50G25X_EXTERNAL_INCIDENCE_TD_RESULTS.json
            stage4/graphs/
            stage4/td/
            stage4/validation/
            stage4/flowcutter.commit
            stage4/tdvalidate.commit
            stage4/source/unpacked/JANUS_TRUMP_R50G25X_ADVERSARIAL_STALL_SEARCH.json
          if-no-files-found: error
          retention-days: 30


  backdoor-dnf-execution:
    needs:
      - backdoor-dnf-acquisition
      - incidence-treewidth-public-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download authors and frozen-source artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: trump-stage4-*
          path: stage4/incoming

      - name: Locate inputs and install authors' declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(find stage4/incoming -type f -name runner.py | head -1)"
          SOURCE="$(find stage4/incoming -type f -name JANUS_TRUMP_R50G25X_ADVERSARIAL_STALL_SEARCH.json | head -1)"
          test -n "$RUNNER"
          test -n "$SOURCE"
          SRC="$(dirname "$RUNNER")"
          chmod +x "$SRC/bin/muser-2"
          echo "AUTHORS_SRC=$SRC" >> "$GITHUB_ENV"
          echo "FROZEN_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          python -m pip install -r research/tools/backdoor_dnf_compat_requirements.txt
          python - <<'PY'
          from pysat.solvers import Cadical153
          with Cadical153() as s:
              assert s.solve()
          print("AUTHORS_DECLARED_PYSAT_STACK_OK")
          PY

      - name: Execute authors' detector and independent JANUS replay
        shell: bash
        run: |
          set -euo pipefail
          python research/tools/trump_r50g25x_run_authors_backdoor_dnf.py \
            "$FROZEN_SOURCE" \
            "$AUTHORS_SRC" \
            research/tools/trump_verify_authors_backdoor_dnf.py \
            stage4/dnf_execution \
            --timeout 20

      - uses: actions/upload-artifact@v4
        with:
          name: trump-stage4-backdoor-dnf-execution
          path: stage4/dnf_execution/
          if-no-files-found: error
          retention-days: 30
