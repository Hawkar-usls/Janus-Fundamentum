name: R5 E9 Paley Free-Orbit Post-RKPR Linear Nullity Barrier

on:
  push:
    paths:
      - 'research/R5_E9_PALEY_FREE_ORBIT_POST_RKPR_LINEAR_NULLITY_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_free_orbit_post_rkpr_linear_nullity_barrier.py'
      - '.github/workflows/r5-e9-paley-free-orbit-post-rkpr-linear-nullity-barrier.yml'
  pull_request:
    paths:
      - 'research/R5_E9_PALEY_FREE_ORBIT_POST_RKPR_LINEAR_NULLITY_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley_free_orbit_post_rkpr_linear_nullity_barrier.py'
      - '.github/workflows/r5-e9-paley-free-orbit-post-rkpr-linear-nullity-barrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-structural-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley free-orbit checker
        run: python experiments/r5_e9_paley_free_orbit_post_rkpr_linear_nullity_barrier.py
