name: JANUS TIME-SAT-004D3B two-new-source specialized XOR vs CDCL
on:
  push:
    branches:
      - research/time-sat-004d3b-fair-new-lightsout-20261101
    paths:
      - experiments/direct/janus_time_sat_004d3_compare.py
      - tests/test_time_sat_004d3_compare.py
      - .github/workflows/validate-time-sat-004d3b-compare.yml
permissions:
  contents: read
concurrency:
  group: janus-time-sat-004d3b-comparison
  cancel-in-progress: true
jobs:
  source-bound-five-arm-benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact PySAT and CryptoMiniSat package version pins
        run: >-
          python -m pip install --only-binary=:all: --disable-pip-version-check
          'python-sat==1.9.dev17' 'pycryptosat==5.15.0'
      - name: Show installed solver versions
        run: python -m pip show python-sat pycryptosat
      - name: SHA-verified original new SAT and UNSAT + specialized native XOR correctness
        run: python -m unittest discover -s tests -p 'test_time_sat_004d3_compare.py' -v
      - name: Preserve original C023 independent serialized verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Five-arm matched full-process comparison of two NEW original public instances
        run: >-
          python experiments/direct/janus_time_sat_004d3_compare.py
          --out evidence/time_sat_004d3b
      - name: Preserve all successes, UNKNOWN CPU timeouts and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-sat-004d3b-${{ matrix.runner }}
          path: evidence/time_sat_004d3b/comparison.json
          if-no-files-found: warn
          retention-days: 30
