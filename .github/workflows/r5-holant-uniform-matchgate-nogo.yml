name: R5 Original Holant Uniform Matchgate Parity No-Go
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_holant_matchgate_uniform_basis_nogo.py'
      - '.github/workflows/r5-holant-uniform-matchgate-nogo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holant-basis:
    name: 'Original SCL W-GHZ tensor and global GL2 parity certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact ternary tensor identity, symbolic no-go, finite source controls and tamper rejection
        run: python -u experiments/r5_universal_holant_matchgate_uniform_basis_nogo.py
