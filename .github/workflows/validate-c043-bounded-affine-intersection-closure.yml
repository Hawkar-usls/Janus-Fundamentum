name: Validate C043 Bounded Affine Intersection Closure

on:
  push:
    paths:
      - "experiments/direct/janus_c043_bounded_affine_intersection_closure.py"
      - "docs/C043_BOUNDED_AFFINE_INTERSECTION_CLOSURE.md"
      - "proposals/C043-JANUS-BOUNDED-AFFINE-INTERSECTION-CLOSURE.json"
      - "registry/c043-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c043-bounded-affine-intersection-closure.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_c043_bounded_affine_intersection_closure.py"
      - "docs/C043_BOUNDED_AFFINE_INTERSECTION_CLOSURE.md"
      - "proposals/C043-JANUS-BOUNDED-AFFINE-INTERSECTION-CLOSURE.json"
      - "registry/c043-source-map.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c043-bounded-affine-intersection-closure.yml"

permissions:
  contents: read

jobs:
  bounded-affine-intersection-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile experiments/direct/janus_c043_bounded_affine_intersection_closure.py
      - run: python experiments/direct/janus_c043_bounded_affine_intersection_closure.py --self-test
      - run: python -m json.tool proposals/C043-JANUS-BOUNDED-AFFINE-INTERSECTION-CLOSURE.json >/dev/null
      - run: python -m json.tool registry/c043-source-map.json >/dev/null
