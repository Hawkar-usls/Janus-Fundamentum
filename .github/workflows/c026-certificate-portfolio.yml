name: C026 Certificate Portfolio

on:
  push:
    paths:
      - "experiments/direct/janus_certificate_portfolio.py"
      - "proposals/C026-JANUS-CERTIFICATE-PORTFOLIO.json"
      - "docs/C026_JANUS_CERTIFICATE_PORTFOLIO.md"
      - ".github/workflows/c026-certificate-portfolio.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_certificate_portfolio.py"
      - "proposals/C026-JANUS-CERTIFICATE-PORTFOLIO.json"
      - "docs/C026_JANUS_CERTIFICATE_PORTFOLIO.md"
      - ".github/workflows/c026-certificate-portfolio.yml"

permissions:
  contents: read

jobs:
  certificate-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run proof-carrying certificate portfolio audit
        run: python experiments/direct/janus_certificate_portfolio.py
