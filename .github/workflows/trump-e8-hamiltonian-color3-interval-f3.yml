name: TRUMP E8 Hamiltonian Color3 Interval F3 Carrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_HAMILTONIAN_COLOR3_BOOLEAN_INTERVAL_F3_AVOIDANCE_CARRIER_2026-09-30_v5.1.json'
      - 'research/tools/e8_hamiltonian_color3_interval_f3/checker.py'
      - '.github/workflows/trump-e8-hamiltonian-color3-interval-f3.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Hamiltonian COLOR3 interval-F3 regression
        run: python research/tools/e8_hamiltonian_color3_interval_f3/checker.py
