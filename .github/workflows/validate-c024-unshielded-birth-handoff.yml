name: Validate C024 Unshielded Birth Handoff

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-unshielded-birth-handoff.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - "experiments/direct/janus_tear_gt_root_unshielded_handoff_probe.py"
      - ".github/workflows/validate-c024-unshielded-birth-handoff.yml"

permissions:
  contents: read

jobs:
  unshielded-birth-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay every P-to-K-prime unshielded local lineage
        run: python experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py
