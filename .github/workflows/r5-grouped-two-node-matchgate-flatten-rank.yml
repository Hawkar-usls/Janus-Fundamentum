name: R5 Grouped Two Node Matchgate Flattening Rank No-Go
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_grouped_two_node_matchgate_flatten_rank_nogo.py'
      - '.github/workflows/r5-grouped-two-node-matchgate-flatten-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-cell-rank:
    name: Exact W-GHZ 4-wire flatten ranks and 24-order source no-go
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original SCL source auth, arity4 MGI rank proof and 625 heterogeneous GL2 controls
        run: python -u experiments/r5_universal_grouped_two_node_matchgate_flatten_rank_nogo.py
