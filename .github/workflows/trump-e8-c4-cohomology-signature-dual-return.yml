name: TRUMP E8 C4 Cohomology Signature Dual Return

on:
  pull_request:
    paths:
      - 'research/tools/e8_c4_cohomology_signature_explosion_dual_return/checker.py'
      - 'research/R5_B1B1C5B2B2_E8_C4_COHOMOLOGY_SIGNATURE_EXPLOSION_DUAL_RETURN_2026-10-01_v8.5.5.json'
      - '.github/workflows/trump-e8-c4-cohomology-signature-dual-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-signature-dual-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact cohomology signature and dual-return checker
        run: python3 research/tools/e8_c4_cohomology_signature_explosion_dual_return/checker.py
