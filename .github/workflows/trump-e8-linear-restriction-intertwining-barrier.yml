name: TRUMP E8 linear restriction-intertwining barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_LINEAR_RESTRICTION_INTERTWINING_DIMENSION_BARRIER_2026-09-26_v0.2.json'
      - 'research/tools/e8_linear_restriction_intertwining_barrier/checker.py'
      - '.github/workflows/trump-e8-linear-restriction-intertwining-barrier.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_linear_restriction_intertwining_barrier/checker.py
