name: Validate C025 Akinator PF1 PF2

on:
  push:
    branches: [c025-policy0b-fair-reason]
    paths:
      - 'proof_attempts/C025/C025_AKINATOR_PF1_PF2_PREBIRTH_FACTOR_RELATION_BOUNDARY.md'
      - 'experiments/direct/janus_akinator_pf1_pf2_prebirth_relation.py'
      - '.github/workflows/validate-c025-akinator-pf1-pf2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay PF1/PF2 finite mechanics
        run: python experiments/direct/janus_akinator_pf1_pf2_prebirth_relation.py
      - name: Claim ceiling
        run: |
          echo 'Provider validates finite mechanics only.'
          echo 'UNIVERSAL_POLY_BOUNDARY_QUOTIENT = OPEN'
          echo 'P_VS_NP = OPEN'
