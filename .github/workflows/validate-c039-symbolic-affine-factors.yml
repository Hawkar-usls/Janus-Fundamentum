name: Validate C039 Symbolic Affine Factors

on:
  push:
    paths:
      - "experiments/direct/c039_affine_core.py"
      - "experiments/direct/c039_affine_compile.py"
      - "experiments/direct/c039_affine_verify.py"
      - "experiments/direct/janus_c039_symbolic_affine_factor_compiler.py"
      - "docs/C039_PROOF_CARRYING_SYMBOLIC_AFFINE_FACTORS.md"
      - "proposals/C039-PROOF-CARRYING-SYMBOLIC-AFFINE-FACTORS.json"
      - "registry/c039-source-map.json"
      - "schemas/c039-symbolic-affine-factor-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c039-symbolic-affine-factors.yml"
  pull_request:
    paths:
      - "experiments/direct/c039_affine_core.py"
      - "experiments/direct/c039_affine_compile.py"
      - "experiments/direct/c039_affine_verify.py"
      - "experiments/direct/janus_c039_symbolic_affine_factor_compiler.py"
      - "docs/C039_PROOF_CARRYING_SYMBOLIC_AFFINE_FACTORS.md"
      - "proposals/C039-PROOF-CARRYING-SYMBOLIC-AFFINE-FACTORS.json"
      - "registry/c039-source-map.json"
      - "schemas/c039-symbolic-affine-factor-v1.schema.json"
      - "docs/ACTIVE_PROOF_ROUTE_MATRIX.md"
      - ".github/workflows/validate-c039-symbolic-affine-factors.yml"

permissions:
  contents: read

jobs:
  symbolic-affine-factors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiments/direct/janus_c039_symbolic_affine_factor_compiler.py --self-test
      - run: >-
          python -m py_compile
          experiments/direct/c039_affine_core.py
          experiments/direct/c039_affine_compile.py
          experiments/direct/c039_affine_verify.py
          experiments/direct/janus_c039_symbolic_affine_factor_compiler.py
      - run: python -m json.tool proposals/C039-PROOF-CARRYING-SYMBOLIC-AFFINE-FACTORS.json >/dev/null
      - run: python -m json.tool registry/c039-source-map.json >/dev/null
      - run: python -m json.tool schemas/c039-symbolic-affine-factor-v1.schema.json >/dev/null
