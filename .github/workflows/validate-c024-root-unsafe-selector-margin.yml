name: Validate C024 Root Unsafe Selector Margin

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - "experiments/direct/janus_tear_gt_root_all_variable_handoff.py"
      - ".github/workflows/validate-c024-root-unsafe-selector-margin.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py"
      - "experiments/direct/janus_tear_gt_root_all_variable_handoff.py"
      - ".github/workflows/validate-c024-root-unsafe-selector-margin.yml"

permissions:
  contents: read

jobs:
  root-unsafe-selector-margin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure selected-versus-unsafe lexicographic margins
        run: python experiments/direct/janus_tear_gt_root_unsafe_selector_margin.py
