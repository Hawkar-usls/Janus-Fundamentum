name: R5 ExactSupport Focused Audit

on:
  pull_request:
    paths:
      - '.github/workflows/r5-exact-support-focused-audit.yml'
      - 'experiments/r5_universal_exact_support_pinned_oracle_attack.py'
      - 'experiments/r5_universal_quadratic_gauss_mod4_attack.py'
      - 'experiments/r5_universal_e118_tropical_defect_variable_elimination.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-support:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ExactSupport pinned decision and independent fixture replay
        run: python experiments/r5_universal_exact_support_pinned_oracle_attack.py
