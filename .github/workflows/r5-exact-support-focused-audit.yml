name: R5 ExactSupport Focused Audit

on:
  pull_request:
    paths:
      - '.github/workflows/r5-exact-support-focused-audit.yml'
      - 'experiments/r5_universal_exact_support_pinned_oracle_attack.py'
      - 'experiments/r5_universal_exact_support_residual_dag_attack.py'
      - 'experiments/r5_universal_exact_support_exponential_reachable_residual_firewall.py'
      - 'experiments/r5_universal_exact_support_2lift_visited_dag_frontier.py'
      - 'experiments/r5_universal_exact_support_unsat_andor_certificate.py'
      - 'experiments/r5_universal_exact_support_e129_cover_tower_visited_attack.py'
      - 'experiments/r5_universal_quadratic_gauss_mod4_attack.py'
      - 'experiments/r5_universal_e118_tropical_defect_variable_elimination.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-support:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ExactSupport pinned decision and independent fixture replay
        run: python experiments/r5_universal_exact_support_pinned_oracle_attack.py
      - name: ExactSupport residual-DAG symbolic compression and linked SCL E125 stress
        run: python experiments/r5_universal_exact_support_residual_dag_attack.py
      - name: ExactSupport all-SAT exponential reachable-state theorem and torus firewall
        run: python experiments/r5_universal_exact_support_exponential_reachable_residual_firewall.py
      - name: ExactSupport actual visited states E123 two-lift hierarchy
        run: python experiments/r5_universal_exact_support_2lift_visited_dag_frontier.py
      - name: ExactSupport independently verifiable AND-OR UNSAT proof certificate
        run: python experiments/r5_universal_exact_support_unsat_andor_certificate.py
      - name: E129 globally UNSAT cover towers actual residual DAG visited stress
        run: python experiments/r5_universal_exact_support_e129_cover_tower_visited_attack.py
