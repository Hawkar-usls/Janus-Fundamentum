name: R5 E9 Paley19 Gradient-Kernel Post-RKPR Control

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY19_GRADIENT_KERNEL_POST_RKPR_CONTROL_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_paley19_gradient_kernel_post_rkpr_control.py'
      - '.github/workflows/r5-e9-paley19-gradient-kernel-post-rkpr-control.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley19 post-RKPR regression
        run: python experiments/r5_e9_paley19_gradient_kernel_post_rkpr_control.py
