name: TRUMP Guarded Bounded-Output Elimination

on:
  push:
    branches:
      - research/trump-guarded-bounded-output-elimination-v1-2026-09-15
    paths:
      - 'research/TRUMP_BICAMERAL_GUARDED_BOUNDED_OUTPUT_ELIMINATION_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_guarded_elimination/**'
      - '.github/workflows/trump-guarded-bounded-output-elimination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-bounded-output-elimination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent guarded elimination checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_guarded_elimination.independent_checker | tee /tmp/guarded-elimination.json

      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/guarded-elimination.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_GUARDED_BOUNDED_OUTPUT_ELIMINATION_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN'
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO'
          assert sf['GENERAL_BUCKET_ELIMINATION_POLYNOMIAL']=='NOT_PROVED'
          assert sf['OVERBUDGET_BUCKETS']=='OPEN_NOT_NEGATIVE_EVIDENCE'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'firewall':sf},sort_keys=True))
          PY

      - name: Canonical mincut v1.1 regression
        run: python -m research.tools.apma_bicameral_mincut.independent_checker_v1_1

      - name: Cut-support v1.1 regression
        run: python -m research.tools.apma_cut_support_carrier.independent_checker_v1_1

      - name: Component join-tree v1.3 regression
        run: python -m research.tools.apma_component_join_carrier.independent_checker_v1_3

      - name: Derived two-relation v1.1 regression
        run: python -m research.tools.apma_derived_boundary_factor.independent_checker_v1_1

      - name: Exact interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker

      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker

      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier

      - name: Authority notice
        run: |
          echo 'SCOPED_GUARDED_BUCKET_ELIMINATION_ONLY'
          echo 'EVERY_BUCKET_PRECHECKED_AGAINST_L2'
          echo 'OVERBUDGET=OPEN_NOT_NEGATIVE_EVIDENCE'
          echo 'RAW_2_TO_K_ENUMERATION=0'
          echo 'ALTERNATIVE_ORDER_RETRIES=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
