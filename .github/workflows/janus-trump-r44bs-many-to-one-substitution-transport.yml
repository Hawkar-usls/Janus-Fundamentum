name: JANUS TRUMP R44BS Many-to-One Substitution Transport

on:
  pull_request:
    paths:
      - 'research/JANUS_TRUMP_R44BS_MANY_TO_ONE_SUBSTITUTION_MODEL_TRANSPORT_2026-09-03.json'
      - 'research/janus_trump_r44bs_verify_many_to_one_transport.py'
      - '.github/workflows/janus-trump-r44bs-many-to-one-substitution-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-substitution-transport-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay JSON-bound many-to-one transport theorem
        run: python research/janus_trump_r44bs_verify_many_to_one_transport.py
      - name: Enforce theorem boundary
        run: |
          grep -q '"TRUMP_finished": false' research/JANUS_TRUMP_R44BS_MANY_TO_ONE_SUBSTITUTION_MODEL_TRANSPORT_2026-09-03.json
          grep -q '"SAT_IN_P": "NOT_PROVED"' research/JANUS_TRUMP_R44BS_MANY_TO_ONE_SUBSTITUTION_MODEL_TRANSPORT_2026-09-03.json
          grep -q '"P_VS_NP": "OPEN"' research/JANUS_TRUMP_R44BS_MANY_TO_ONE_SUBSTITUTION_MODEL_TRANSPORT_2026-09-03.json
