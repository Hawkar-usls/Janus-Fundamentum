name: JANUS TRUMP R50G25BA3 two-polarity completion

on:
  push:
    branches:
      - research/r50g25ba3-frozen-positive-bridge-impossibility-two-polarity-completion-2026-09-08
  workflow_dispatch:

jobs:
  ba3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen BA3 scientific audit
        working-directory: experiments
        run: |
          python janus_trump_r50g25ba3_frozen_positive_bridge_impossibility_two_polarity_completion.py --out ../JANUS_TRUMP_R50G25BA3_RESULT.json
      - name: Independent fail-closed verification
        working-directory: experiments
        run: |
          python verify_janus_trump_r50g25ba3_frozen_positive_bridge_impossibility_two_polarity_completion.py --result ../JANUS_TRUMP_R50G25BA3_RESULT.json --out ../JANUS_TRUMP_R50G25BA3_VERIFY.json
      - name: Print immutable identities
        run: |
          sha256sum JANUS_TRUMP_R50G25BA3_RESULT.json JANUS_TRUMP_R50G25BA3_VERIFY.json
          python - <<'PY'
          import json
          x=json.load(open('JANUS_TRUMP_R50G25BA3_RESULT.json'))
          v=json.load(open('JANUS_TRUMP_R50G25BA3_VERIFY.json'))
          assert x['outcome']=='BA3-A_PERSISTENT_TWO_POLARITY_BOOLEAN_CHANNEL_CERTIFIED'
          assert x['failure_count']==0 and not x['falsifiers']
          assert all(x['BA3_6_realization_gates'].values())
          assert x['BA3_11_minimality']['minimum_additional_clause_cost_beyond_BA2']==2
          assert x['BA3_11_minimality']['unique_expected_cost2_solution'] is True
          assert v['status']=='PASS' and v['error_count']==0
          print('BA3 fail-closed identity PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25ba3-result
          path: |
            JANUS_TRUMP_R50G25BA3_RESULT.json
            JANUS_TRUMP_R50G25BA3_VERIFY.json
          if-no-files-found: error
