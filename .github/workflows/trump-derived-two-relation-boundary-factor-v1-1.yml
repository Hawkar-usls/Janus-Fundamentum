name: TRUMP Derived Two-Relation Boundary Factor v1.1

on:
  push:
    branches:
      - research/trump-derived-boundary-factor-v1-1-2026-09-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-two-relation-boundary-factor-v1-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.1 independent checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_derived_boundary_factor.independent_checker_v1_1 | tee /tmp/derived-two-relation-v11.json
      - name: Assert v1.1 scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/derived-two-relation-v11.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_OVERWIDTH_DERIVED_TWO_RELATION_BOUNDARY_FACTOR_V1_1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN'
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert sf['CONNECTED_MIXED_CORE_SOLVED']=='NO'
          assert sf['GENERAL_MULTI_RELATION_BOUNDARY_COMPRESSION']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'complexity':z['complexity'],'repair':z['repair'],'firewall':sf},sort_keys=True))
          PY
      - name: Parent canonical mincut v1.1 regression
        run: python -m research.tools.apma_bicameral_mincut.independent_checker_v1_1
      - name: Parent cut-support carrier v1.1 regression
        run: python -m research.tools.apma_cut_support_carrier.independent_checker_v1_1
      - name: Parent component join-tree v1.3 regression
        run: python -m research.tools.apma_component_join_carrier.independent_checker_v1_3
      - name: Exact interface quotient regression
        run: python -m research.tools.apma_interface_quotient.independent_checker
      - name: Factorized feedback regression
        run: python -m research.tools.apma_factorized_feedback.independent_checker
      - name: Authority notice
        run: |
          echo 'V1_FAILURE_PRESERVED'
          echo 'V1_CANDIDATE_UNCHANGED=1047351df47ed5f326eef2650da0c9f5ee0f2fda'
          echo 'REPAIR=JSON_SAFE_PROVENANCE_SERIALIZATION_ONLY'
          echo 'RAW_2_TO_K_ENUMERATION=0'
          echo 'UNBOUNDED_JOIN_CHAIN=0'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
