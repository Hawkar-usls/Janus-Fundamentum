name: Validate C024 Nonroot Unshielded Wing

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_unshielded_wing_profile.py"
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - ".github/workflows/validate-c024-nonroot-unshielded-wing.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_nonroot_unshielded_wing_profile.py"
      - "experiments/direct/janus_tear_gt_unshielded_birth_handoff_census.py"
      - ".github/workflows/validate-c024-nonroot-unshielded-wing.yml"

permissions:
  contents: read

jobs:
  nonroot-unshielded-wing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract two-node tail-wing handoff template
        run: python experiments/direct/janus_tear_gt_nonroot_unshielded_wing_profile.py
