name: TRUMP Bucket Common-Core Semijoin Prefilter

on:
  push:
    branches: [main]
    paths:
      - 'research/TRUMP_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_PREREGISTRATION_2026-09-15.json'
      - 'research/tools/apma_bucket_common_core/**'
      - '.github/workflows/trump-bucket-common-core-semijoin-prefilter.yml'
  workflow_dispatch:

jobs:
  common-core-semijoin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent common-core semijoin checker
        run: |
          set -euo pipefail
          python -m research.tools.apma_bucket_common_core.independent_checker | tee /tmp/common-core.json
      - name: Assert scoped verdict and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/common-core.json').read_text().strip().splitlines()[-1])
          assert z['verdict']=='PASS_SCOPED_BICAMERAL_BUCKET_COMMON_CORE_SEMIJOIN_PREFILTER_V1', z
          assert all(z['checks'].values()), {k:v for k,v in z['checks'].items() if not v}
          sf=z['scientific_firewall']
          assert sf['P_VS_NP']=='OPEN'
          assert sf['GENERAL_SAT_IN_P']=='NOT_PROVED'
          assert sf['GENERAL_EFFECTIVE_BUCKET_COMPRESSION']=='NOT_PROVED'
          print(json.dumps({'verdict':z['verdict'],'controls':z['controls'],'firewall':sf},sort_keys=True))
          PY
      - name: Guarded elimination v3.2 regression
        run: python -m research.tools.apma_guarded_elimination.independent_checker
      - name: Captain forensic diagnostic regression
        run: python -m research.tools.apma_bucket_forensic.independent_checker
      - name: Schaefer mixed-carrier barrier regression
        run: python -m research.tools.apma_mixed_carrier_barrier.check_schaefer_barrier
      - name: Authority notice
        run: |
          echo 'SCOPED_COMMON_CORE_SEMIJOIN_PREFILTER_ONLY'
          echo 'NO_BUDGET_RAISE'
          echo 'NO_RAW_BUCKET_CARTESIAN_PREFILTER'
          echo 'NO_ALTERNATIVE_ORDER_SEARCH'
          echo 'P_VS_NP=OPEN'
          echo 'GENERAL_SAT_IN_P=NOT_PROVED'
