name: R5 JANUS Shared Certified Proof State
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_certified_shared_proof_state.py'
      - '.github/workflows/r5-certified-shared-proof-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-proof-state:
    name: GF2 proof ledger, monotone potential, cross-expert exact handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify chronological nogood identities and bounded descent
        run: python -u experiments/r5_universal_certified_shared_proof_state.py
