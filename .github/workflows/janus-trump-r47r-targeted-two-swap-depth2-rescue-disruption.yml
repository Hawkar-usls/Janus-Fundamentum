name: JANUS TRUMP R47R Targeted Two Swap Depth2 Rescue Disruption

on:
  push:
    branches:
      - research/r47r-targeted-two-swap-depth2-rescue-disruption-2026-09-03

jobs:
  r47r-targeted-depth2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration
        run: |
          python - <<'PY'
          import json, subprocess
          parent='9df9cdd1f3f2fe32614d8f9bd5112c00bcc4d240'
          subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'], check=True)
          d=json.load(open('research/JANUS_TRUMP_R47R_TARGETED_TWO_SWAP_DEPTH2_RESCUE_DISRUPTION_PREREGISTRATION_2026-09-03.json'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['parent']['commit']==parent
          assert d['sealed_base']['R47K_residual_hash']=='9a84c02f1570e752ac0c017037b8a4a40c2599b53faf51bcd6d957f40aa81dde'
          assert d['sealed_base']['R47L_first_depth2_rescue_pair']==[11,20]
          assert d['resource_contract']['depth']==2
          assert d['epistemic_firewall']['O4_UNIVERSAL_COVERAGE_FOR_FIXED_DEPTH2_GRAMMAR']=='OPEN'
          assert d['epistemic_firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['epistemic_firewall']['P_VS_NP']=='OPEN'
          PY
      - name: Compile
        run: python -m py_compile experiments/janus_trump_r47r_targeted_two_swap_depth2_rescue_disruption.py
      - name: Execute targeted rescue-disruption hunt
        run: |
          PYTHONPATH=experiments python experiments/janus_trump_r47r_targeted_two_swap_depth2_rescue_disruption.py | tee /tmp/r47r.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r47r.json'))
          assert d['gate']=='JANUS_TRUMP_R47R_TARGETED_TWO_SWAP_DEPTH2_RESCUE_DISRUPTION'
          assert d['verdict'] in {
              'EXPLICIT_REACHABLE_TARGETED_TWO_SWAP_DEPTH2_COUNTEREXAMPLE_FOUND',
              'NO_DEPTH2_COUNTEREXAMPLE_IN_FROZEN_RESCUE_DISRUPTION_FRONTIER__O4_OPEN',
          }
          b=d['baseline_regression']
          assert b['base_residual_hash']=='9a84c02f1570e752ac0c017037b8a4a40c2599b53faf51bcd6d957f40aa81dde'
          assert b['base_depth1_dead'] is True
          assert b['base_depth2_selected_pair']==[11,20]
          assert d['firewall']['O4_UNIVERSAL_COVERAGE_FOR_FIXED_DEPTH2_GRAMMAR']=='OPEN'
          assert d['firewall']['UNIVERSAL_CONSTANT_K_EXISTS']=='NOT_PROVED'
          assert d['firewall']['SAT_IN_P']=='NOT_PROVED'
          assert d['firewall']['P_VS_NP']=='OPEN'
          if d['first_counterexample'] is not None:
              c=d['first_counterexample']
              assert d['metrics']['depth2_dead']>=1
              assert c['certified_lower_bound']=='d(F)>2_WITHIN_FROZEN_GRAMMAR'
              assert c['all_depth2_failed_pairs']
              assert not any(x['accepted'] for x in c['all_depth2_failed_pairs'])
              assert c['mutated_original_formula'] and c['residual_formula']
          print('R47R_GATE=PASS')
          print('R47R_VERDICT=',d['verdict'])
          print('R47R_METRICS=',json.dumps(d['metrics'],sort_keys=True))
          if d['first_counterexample'] is not None:
              print('R47R_COUNTEREXAMPLE=',json.dumps(d['first_counterexample'],sort_keys=True))
          else:
              print('R47R_HARDEST=',json.dumps(d['hardest_depth2_rescue_if_none'],sort_keys=True))
          PY
