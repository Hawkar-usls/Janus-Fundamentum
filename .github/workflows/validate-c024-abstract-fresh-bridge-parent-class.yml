name: Validate C024 Abstract Fresh Bridge Parent Class

on:
  push:
    paths:
      - "experiments/direct/janus_tear_abstract_fresh_bridge_parent_class.py"
      - ".github/workflows/validate-c024-abstract-fresh-bridge-parent-class.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_abstract_fresh_bridge_parent_class.py"
      - ".github/workflows/validate-c024-abstract-fresh-bridge-parent-class.yml"

permissions:
  contents: read

jobs:
  abstract-fresh-bridge-parent-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify abstract fresh bridge parent pairs
        run: python experiments/direct/janus_tear_abstract_fresh_bridge_parent_class.py
