name: TRUMP E8 Rigid C4 Source Geometry Holonomy Tree

on:
  push:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RIGID_C4_SOURCE_GEOMETRY_HOLONOMY_TREE_FRONTIER_2026-09-30_v7.4.json'
      - 'research/tools/e8_rigid_c4_source_geometry_holonomy_tree/checker.py'
      - '.github/workflows/trump-e8-rigid-c4-source-geometry-holonomy-tree.yml'
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_RIGID_C4_SOURCE_GEOMETRY_HOLONOMY_TREE_FRONTIER_2026-09-30_v7.4.json'
      - 'research/tools/e8_rigid_c4_source_geometry_holonomy_tree/checker.py'
      - '.github/workflows/trump-e8-rigid-c4-source-geometry-holonomy-tree.yml'

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay rigid C4 source geometry and holonomy frontier
        run: python research/tools/e8_rigid_c4_source_geometry_holonomy_tree/checker.py
