name: R5 E9 Prime-tower projective escape-radius recurrence

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_PRIME_TOWER_PROJECTIVE_ESCAPE_RADIUS_RECURRENCE_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_prime_tower_projective_escape_radius_recurrence.py'
      - 'experiments/r5_e9_prime_tower_geometric_tope_radius_stress.py'
      - '.github/workflows/r5-e9-prime-tower-projective-escape-radius-recurrence.yml'

permissions:
  contents: read

jobs:
  exact-recurrence-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile recurrence checker
        run: python -m py_compile experiments/r5_e9_prime_tower_projective_escape_radius_recurrence.py
      - name: Replay exact base through n120
        run: python experiments/r5_e9_prime_tower_projective_escape_radius_recurrence.py
