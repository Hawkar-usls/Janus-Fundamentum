name: TRUMP APMA exact dense bipartite grid carrier gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run corrected frozen independent checker
        run: python research/tools/apma_dense_bipartite_grid/independent_checker.py
