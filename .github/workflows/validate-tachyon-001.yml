name: Validate JANUS-TACHYON-001 retrograde hypothesis research

on:
  push:
    paths:
      - 'experiments/direct/janus_tachyon_001*.py'
      - 'tests/test_tachyon_001.py'
      - 'docs/TACHYON_001_RESEARCH.md'
      - '.github/workflows/validate-tachyon-001.yml'
  pull_request:
    paths:
      - 'experiments/direct/janus_tachyon_001*.py'
      - 'tests/test_tachyon_001.py'
      - 'docs/TACHYON_001_RESEARCH.md'
      - '.github/workflows/validate-tachyon-001.yml'

permissions:
  contents: read

jobs:
  independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded false-echo completeness and sound local support
        run: python -m unittest discover -s tests -p 'test_tachyon_001.py' -v
      - name: Compare forward and retrograde hypotheses on identical SAT/Exact-One cases
        run: python experiments/direct/janus_tachyon_001_benchmark.py --out evidence/tachyon-001.json
      - name: Keep unchanged independent C023 certificate verifier
        run: python experiments/direct/janus_tear_policy0a_fc_serialized_verifier.py
      - name: Upload research evidence without changing C023 or UFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-001-finite-hypothesis-evidence
          path: evidence/tachyon-001.json
          if-no-files-found: warn
          retention-days: 30
