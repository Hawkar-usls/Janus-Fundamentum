name: R5 E9 Paley5419 Diamond Macro BFS Exact Order10

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_PALEY5419_DIAMOND_MACRO_BFS_EXACT_ORDER10_4CRITICAL_COVER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley5419_diamond_macro_bfs_exact_order10_4critical_cover.py'
      - 'experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py'
      - '.github/workflows/r5-e9-paley5419-diamond-macro-bfs-exact-order10.yml'
  pull_request:
    paths:
      - 'research/R5_E9_PALEY5419_DIAMOND_MACRO_BFS_EXACT_ORDER10_4CRITICAL_COVER_2026-10-01_v1.0.md'
      - 'experiments/r5_e9_paley5419_diamond_macro_bfs_exact_order10_4critical_cover.py'
      - 'experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py'
      - '.github/workflows/r5-e9-paley5419-diamond-macro-bfs-exact-order10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-lower-and-upper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact regressions
        run: |
          python -m py_compile experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py
          python -m py_compile experiments/r5_e9_paley5419_diamond_macro_bfs_exact_order10_4critical_cover.py
      - name: Recheck complete lower bound through order 9
        run: python experiments/r5_e9_paley5419_balanced_4critical_order_gt9.py
      - name: Construct and verify order-10 certificates by diamond macro BFS
        run: python experiments/r5_e9_paley5419_diamond_macro_bfs_exact_order10_4critical_cover.py
