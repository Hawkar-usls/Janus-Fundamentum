name: Validate C024 Abstract Post Unit Same Cut Birth Two Step N4

on:
  push:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_two_step_n4.py"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth-two-step-n4.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_two_step_n4.py"
      - ".github/workflows/validate-c024-abstract-post-unit-same-cut-birth-two-step-n4.yml"

permissions:
  contents: read

jobs:
  abstract-post-unit-same-cut-birth-two-step-n4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust two-step same-cut births on four vertices
        run: python experiments/direct/janus_tear_abstract_post_unit_same_cut_birth_two_step_n4.py
