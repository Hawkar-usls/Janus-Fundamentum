name: R5 E9 Exact-One3 projection polymorphism barrier

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_EXACTONE3_PROJECTION_POLYMORPHISM_BOUNDED_WIDTH_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exactone3_projection_polymorphism_bounded_width.py'
      - '.github/workflows/r5-e9-exactone3-projection-polymorphism-bounded-width.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_exactone3_projection_polymorphism_bounded_width.py
      - name: Replay exact finite controls
        run: python experiments/r5_e9_exactone3_projection_polymorphism_bounded_width.py
