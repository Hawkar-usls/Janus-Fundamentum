name: R5 E9 Paley11 Gradient Kernel Post-RKPR UNSAT Terminal

on:
  pull_request:
    paths:
      - 'research/R5_E9_PALEY11_GRADIENT_KERNEL_POST_RKPR_UNSAT_TERMINAL_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_paley11_gradient_kernel_post_rkpr_unsat_terminal.py'
      - '.github/workflows/r5-e9-paley11-gradient-kernel-post-rkpr-unsat-terminal.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact Paley11 gradient-kernel terminal replay
        run: python experiments/r5_e9_paley11_gradient_kernel_post_rkpr_unsat_terminal.py
