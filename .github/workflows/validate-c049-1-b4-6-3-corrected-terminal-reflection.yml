name: Validate C049.1 B4.6.3 corrected terminal reflection

on:
  push:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_TERMINAL_REFLECTION_SPEC_V1_1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-terminal-reflection.yml'
  pull_request:
    paths:
      - 'experiments/direct/C049_1_B4_6_3_CORRECTED_TERMINAL_REFLECTION_SPEC_V1_1.json'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection.py'
      - 'experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier.py'
      - '.github/workflows/validate-c049-1-b4-6-3-corrected-terminal-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-terminal-reflection:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: experiments/direct
      ROOT_EMPTY_PROOF_SUBJECT: 6178edbb8d10c3c508ded82ea03d84af9bd594bd
      CANONICAL_AUDIT_SUBJECT: a170e5aa269627364f7de7789caebce6e1863961
      LOCAL_AUDIT_MIRROR_SUBJECT: 00f82983e3468fc823d3547cfb4c34de3313641d
      TERMINAL_SPEC_SUBJECT: e94468a1e834fe3aabe6f0f24184a288d5a4da9b
      TERMINAL_PRODUCER_SUBJECT: d4580a09378d16f2666bd77da5be01bccbbd43c4
      TERMINAL_VERIFIER_SUBJECT: cf87f7663e89303cec964075e898183bb3d276d1
      EMPTY_SPEC_SUBJECT: 824a0eede4435584f9d2ff2f9272b7ee5dc69280
      EMPTY_PRODUCER_SUBJECT: ecf42d04163be5c652af49186606646833529477
      EMPTY_VERIFIER_SUBJECT: b1afd3fa5b776f0514f5b844b77df57430d21f54
      ROOT_SPEC_SUBJECT: 6af061d6381a0d2a95cfcff4dc4c283998d7ffc8
      ROOT_PRODUCER_SUBJECT: 42823c7761463f02bedcac8a53fca1ef5a00a0d6
      ROOT_VERIFIER_SUBJECT: 245e76770723aacd081a27955a5ab9d405572a1f
      UPK_SPEC_SUBJECT: 1107992ce268a5f17bcbfb1f39fe2f83d2469529
      UPK_PRODUCER_SUBJECT: 0134dd99c6bf42d222b0044d216113174b9ebd11
      UPK_VERIFIER_SUBJECT: b34c3e1031150fcd65f29757c67bb2919b4234a0
      RESIDUAL_SPEC_SUBJECT: 51cd557386f7e46838116ea144acd961302d349b
      RESIDUAL_PRODUCER_SUBJECT: 6fc069b6525be01dc73fc01cd59cd1d728db29e8
      SCALAR_SPEC_SUBJECT: 0b6a472d43096d4508a217c938a2988a3315bddc
      SCALAR_PRODUCER_SUBJECT: 74d1d6fd02a7c45578b6ba79891ca93796e701b6
      NODE8_SUBJECT: 0fcdaa168dde2aef27603d51ff547c07860a9fd1
      LEAF5_SUBJECT: c354d56bf3ac0bb77136b96e869dc95a6b9ba07f
      Q80_SUBJECT: 97a57154b4fdeed8cbc7ba40fa71b2008757c8f1
      STRUCT_SPEC_SUBJECT: f942dffdd5ba1b2c4fa4a61da722e0c7c4a18d15
      TERMINAL_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_TERMINAL_REFLECTION_SPEC_V1_1.json
      TERMINAL_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection.py
      TERMINAL_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier.py
      AUDIT_RECEIPT: experiments/direct/audits/C049_1_B4_6_3_CORRECTED_ROOT_EMPTY_UP_K_INDEPENDENT_SEMANTIC_AUDIT_6178EDBB.json
      EMPTY_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_ROOT_EMPTY_UP_K_SPEC_V1.json
      EMPTY_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_root_empty_up_k.py
      EMPTY_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_root_empty_up_k_verifier.py
      ROOT_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_ROOT_FULL_REFINEMENT_SPEC_V1.json
      ROOT_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_root_full_refinement.py
      ROOT_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_root_full_refinement_verifier.py
      UPK_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_UP_K_SPEC_V1.json
      UPK_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k.py
      UPK_VERIFIER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_up_k_verifier.py
      RESIDUAL_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RESIDUAL_COMPACT_FRONTIER_SPEC_V1.json
      RESIDUAL_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_residual_compact_frontier.py
      SCALAR_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_SCALAR_SYMBOLIC_AUTOMATON_SPEC_V1_2.json
      SCALAR_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_scalar_symbolic_automaton.py
      NODE8_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node8_twenty_generator_up_k.py
      LEAF5: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_RIGHT_LEAF5_CANDIDATE_V1.json
      STRUCT_SPEC: experiments/direct/C049_1_B4_6_3_CORRECTED_NODE9_PARENT_FRONTIER_STRUCTURAL_COMPRESSION_SPEC_V1.json
      Q80_PRODUCER: experiments/direct/janus_c049_1_b4_6_3_corrected_node9_quotient_skeleton_stability_analysis.py

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind immutable proof and terminal subjects
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ROOT_EMPTY_PROOF_SUBJECT" HEAD
          bind_blob(){ test "$(git rev-parse "$1:$2")" = "$(git hash-object "$2")"; }
          bind_blob "$TERMINAL_SPEC_SUBJECT" "$TERMINAL_SPEC"
          bind_blob "$TERMINAL_PRODUCER_SUBJECT" "$TERMINAL_PRODUCER"
          bind_blob "$TERMINAL_VERIFIER_SUBJECT" "$TERMINAL_VERIFIER"
          bind_blob "$CANONICAL_AUDIT_SUBJECT" "$AUDIT_RECEIPT"
          bind_blob "$LOCAL_AUDIT_MIRROR_SUBJECT" "$AUDIT_RECEIPT"
          bind_blob "$EMPTY_SPEC_SUBJECT" "$EMPTY_SPEC"
          bind_blob "$EMPTY_PRODUCER_SUBJECT" "$EMPTY_PRODUCER"
          bind_blob "$EMPTY_VERIFIER_SUBJECT" "$EMPTY_VERIFIER"
          bind_blob "$ROOT_SPEC_SUBJECT" "$ROOT_SPEC"
          bind_blob "$ROOT_PRODUCER_SUBJECT" "$ROOT_PRODUCER"
          bind_blob "$ROOT_VERIFIER_SUBJECT" "$ROOT_VERIFIER"
          bind_blob "$UPK_SPEC_SUBJECT" "$UPK_SPEC"
          bind_blob "$UPK_PRODUCER_SUBJECT" "$UPK_PRODUCER"
          bind_blob "$UPK_VERIFIER_SUBJECT" "$UPK_VERIFIER"
          bind_blob "$RESIDUAL_SPEC_SUBJECT" "$RESIDUAL_SPEC"
          bind_blob "$RESIDUAL_PRODUCER_SUBJECT" "$RESIDUAL_PRODUCER"
          bind_blob "$SCALAR_SPEC_SUBJECT" "$SCALAR_SPEC"
          bind_blob "$SCALAR_PRODUCER_SUBJECT" "$SCALAR_PRODUCER"
          bind_blob "$NODE8_SUBJECT" "$NODE8_PRODUCER"
          bind_blob "$LEAF5_SUBJECT" "$LEAF5"
          bind_blob "$STRUCT_SPEC_SUBJECT" "$STRUCT_SPEC"
          bind_blob "$Q80_SUBJECT" "$Q80_PRODUCER"
          python -m py_compile "$TERMINAL_PRODUCER" "$TERMINAL_VERIFIER" "$EMPTY_PRODUCER" "$EMPTY_VERIFIER" "$ROOT_PRODUCER" "$ROOT_VERIFIER" "$UPK_PRODUCER" "$UPK_VERIFIER" "$RESIDUAL_PRODUCER" "$SCALAR_PRODUCER" "$Q80_PRODUCER" "$NODE8_PRODUCER"
          test "$(git hash-object "$TERMINAL_SPEC")" = "f45356b9065ad1d9e7e38f8c08d7e2031b5efa89"
          test "$(git hash-object "$TERMINAL_PRODUCER")" = "26ff26561febc4a5467d21bd230ad20847616389"
          test "$(git hash-object "$TERMINAL_VERIFIER")" = "fb8c7e21d1be73db8951a2443984d361238d57fb"
          test "$(git hash-object "$AUDIT_RECEIPT")" = "80c7b68945fc58c9e2110bd7f94fdf24b9240248"
          test "$(sha256sum "$AUDIT_RECEIPT" | cut -d' ' -f1)" = "dbbbcaaee12dfcbaf073f0e11e182c0c530fe54acb0c05b2996c21a92fa68897"
          python - <<'PY'
          import ast
          from pathlib import Path
          p=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection.py').read_text())
          v=ast.parse(Path('experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier.py').read_text())
          def mods(t):
              z=[]
              for n in ast.walk(t):
                  if isinstance(n,ast.Import): z.extend(a.name for a in n.names)
                  elif isinstance(n,ast.ImportFrom): z.append(n.module or '')
              return z
          assert not any(x.endswith('janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier') for x in mods(p))
          assert not any(x.endswith('janus_c049_1_b4_6_3_corrected_terminal_reflection') for x in mods(v))
          print('TERMINAL_REFLECTION_IMPLEMENTATION_DECOUPLING_STATIC_CHECK = PASS')
          PY

      - name: Reconstruct admitted corrected root-empty proof subject
        run: |
          set -euo pipefail
          cat experiments/direct/.cn8_frozen_b64/part* | base64 -d > /tmp/node8-source.json
          python "$NODE8_PRODUCER" /tmp/node8-source.json --entry-order original --output /tmp/node8.json > /tmp/node8.log
          test "$(sha256sum /tmp/node8.json | cut -d' ' -f1)" = "80b74b500ae82639e51568a9a6dc70a72668f32991add42bc5ffac05b3f9537f"
          python "$Q80_PRODUCER" --spec "$STRUCT_SPEC" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --output /tmp/q80.json --order-mode ORIGINAL > /tmp/q80.log
          test "$(sha256sum /tmp/q80.json | cut -d' ' -f1)" = "fa21c129ad7c03cad0f46c5a5baeb3941d0c94baadea54718d8059652f3a3375"
          python "$SCALAR_PRODUCER" --spec "$SCALAR_SPEC" --node8-artifact /tmp/node8.json --leaf5-artifact "$LEAF5" --q80-artifact /tmp/q80.json --output /tmp/scalar.json --order-mode ORIGINAL > /tmp/scalar.log
          test "$(sha256sum /tmp/scalar.json | cut -d' ' -f1)" = "b953c89f95f3deee18fe92080b0988846603a46c17e0f51bcfa2eef50d325aca"
          python "$RESIDUAL_PRODUCER" --spec "$RESIDUAL_SPEC" --scalar-artifact /tmp/scalar.json --q80-artifact /tmp/q80.json --output /tmp/residual.json --order-mode ORIGINAL > /tmp/residual.log
          test "$(sha256sum /tmp/residual.json | cut -d' ' -f1)" = "4d81196e48b75d0f138e97fc2c72ef8984581cb0bb42ea0fd187dcb881a0b62f"
          python "$UPK_PRODUCER" --spec "$UPK_SPEC" --residual-artifact /tmp/residual.json --output /tmp/upk.json --order-mode ORIGINAL > /tmp/upk.log
          test "$(sha256sum /tmp/upk.json | cut -d' ' -f1)" = "33aa00a538818b90ccaa0506071d579cf02ca49177b7875833c9625356ffc27f"
          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$ROOT_PRODUCER" --spec "$ROOT_SPEC" --up-k-artifact /tmp/upk.json --output "/tmp/root-$mode.json" --order-mode "$mode" > "/tmp/root-$mode.log"
          done
          cmp /tmp/root-ORIGINAL.json /tmp/root-REVERSED.json
          cmp /tmp/root-ORIGINAL.json /tmp/root-SEEDED_SHUFFLE.json
          test "$(sha256sum /tmp/root-ORIGINAL.json | cut -d' ' -f1)" = "74b734c8fc64a789dc4f0e40588956f93ad35ac799dea16417b1180ee5a83900"
          python "$ROOT_VERIFIER" --spec "$ROOT_SPEC" --producer-source "$ROOT_PRODUCER" --up-k-artifact /tmp/upk.json --candidate-original /tmp/root-ORIGINAL.json --candidate-reversed /tmp/root-REVERSED.json --candidate-seeded-shuffle /tmp/root-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/root-verifier.log
          grep -F 'JANUS_CORRECTED_ROOT_FULL_REFINEMENT_INDEPENDENT_VERIFIER = PASS' /tmp/root-verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/root-verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/root-verifier.log
          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$EMPTY_PRODUCER" --spec "$EMPTY_SPEC" --root-refinement-artifact /tmp/root-ORIGINAL.json --output "/tmp/empty-$mode.json" --order-mode "$mode" > "/tmp/empty-$mode.log"
          done
          cmp /tmp/empty-ORIGINAL.json /tmp/empty-REVERSED.json
          cmp /tmp/empty-ORIGINAL.json /tmp/empty-SEEDED_SHUFFLE.json
          test "$(sha256sum /tmp/empty-ORIGINAL.json | cut -d' ' -f1)" = "b82fced138820d028898889eb59d059aaa023616ad774e6f31e0dc290fa492ab"
          python "$EMPTY_VERIFIER" --spec "$EMPTY_SPEC" --producer-source "$EMPTY_PRODUCER" --root-refinement-artifact /tmp/root-ORIGINAL.json --candidate-original /tmp/empty-ORIGINAL.json --candidate-reversed /tmp/empty-REVERSED.json --candidate-seeded-shuffle /tmp/empty-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/empty-verifier.log
          grep -F 'JANUS_CORRECTED_ROOT_EMPTY_UP_K_INDEPENDENT_VERIFIER = PASS' /tmp/empty-verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/empty-verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/empty-verifier.log

      - name: Build terminal pointwise crosscheck in three deterministic modes
        run: |
          set -euo pipefail
          for mode in ORIGINAL REVERSED SEEDED_SHUFFLE; do
            python "$TERMINAL_PRODUCER" --spec "$TERMINAL_SPEC" --root-spec "$ROOT_SPEC" --root-empty-artifact /tmp/empty-ORIGINAL.json --audit-receipt "$AUDIT_RECEIPT" --output "/tmp/terminal-$mode.json" --order-mode "$mode" | tee "/tmp/terminal-$mode.log"
          done
          cmp /tmp/terminal-ORIGINAL.json /tmp/terminal-REVERSED.json
          cmp /tmp/terminal-ORIGINAL.json /tmp/terminal-SEEDED_SHUFFLE.json
          echo 'TERMINAL_REFLECTION_THREE_MODE_BYTE_IDENTITY = PASS'
          echo "TERMINAL_REFLECTION_ARTIFACT_SHA256=$(sha256sum /tmp/terminal-ORIGINAL.json | cut -d' ' -f1)"

      - name: Independent terminal reflection replay and tamper rejection
        run: |
          set -euo pipefail
          python "$TERMINAL_VERIFIER" --spec "$TERMINAL_SPEC" --producer-source "$TERMINAL_PRODUCER" --root-spec "$ROOT_SPEC" --root-empty-artifact /tmp/empty-ORIGINAL.json --audit-receipt "$AUDIT_RECEIPT" --candidate-original /tmp/terminal-ORIGINAL.json --candidate-reversed /tmp/terminal-REVERSED.json --candidate-seeded-shuffle /tmp/terminal-SEEDED_SHUFFLE.json --tamper-suite | tee /tmp/terminal-verifier.log
          grep -F 'JANUS_CORRECTED_TERMINAL_REFLECTION_INDEPENDENT_VERIFIER = PASS' /tmp/terminal-verifier.log
          grep -F 'PRODUCER_IMPORT = FORBIDDEN_AND_NOT_USED' /tmp/terminal-verifier.log
          grep -F 'INVARIANTS = 12/12' /tmp/terminal-verifier.log
          grep -F 'DIGEST_REPAIRED_TAMPERS_REJECTED = 12/12' /tmp/terminal-verifier.log

      - name: Non-oracular finite-instance and strict boundary audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          a=json.loads(Path('/tmp/terminal-ORIGINAL.json').read_text()); p=a['proof_payload']; o=p['whole_factor_layout_oracle']; x=p['frozen_instance_crosscheck']; b=p['strict_boundary']
          assert hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()==a['semantic_digest']
          assert o['permutation_count']==math.factorial(p['derived_scaffold']['factor_count'])
          assert len({tuple(r['order']) for r in o['records']})==o['permutation_count']
          assert o['expected_permutation_count_used'] is False and o['expected_minimum_width_used'] is False and o['expected_accepting_count_used'] is False
          assert p['admitted_root_empty_observation']['expected_root_empty_used'] is False
          assert p['source_binding']['historical_layout_oracle_consumed'] is False
          assert p['source_binding']['easter_egg_consumed_as_proof_input'] is False
          assert x['root_empty_equals_no_width_le_k_layout']==(p['admitted_root_empty_observation']['derived_root_empty']==x['no_width_le_k_layout'])
          assert x['structural_induction_proved'] is False and x['engine_terminal_completeness_proved'] is False
          assert p['structural_reflection_gap']['unresolved_obligations']==p['structural_reflection_gap']['required_obligations']
          assert b['frozen_six_factor_no_layout_at_cap'] is False and b['frozen_instance_root_layout_pointwise_equivalence'] is False
          assert b['terminal_completeness_proved'] is False and b['global_engine_no_layout_at_cap']=='FORBIDDEN'
          assert b['formal_admission']=='BLOCKED' and b['next_gate']=='CLOSED' and b['p_vs_np']=='OPEN'
          print('NON_ORACULAR_TERMINAL_POINTWISE_CROSSCHECK = PASS')
          print('DERIVED_PERMUTATIONS =',o['permutation_count'])
          print('DERIVED_MINIMUM_LAYOUT_WIDTH =',o['minimum_layout_width'])
          print('DERIVED_ACCEPTING_LAYOUTS =',o['accepting_layout_count'])
          print('DERIVED_ROOT_EMPTY =',p['admitted_root_empty_observation']['derived_root_empty'])
          print('DERIVED_POINTWISE_EQUIVALENCE =',x['root_empty_equals_no_width_le_k_layout'])
          print('STRUCTURAL_INDUCTION_PROVED = FALSE')
          print('TERMINAL_COMPLETENESS_PROVED = FALSE')
          print('P_VS_NP = OPEN')
          PY

      - name: Build exact-head terminal evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/terminal-exact-head-receipt.txt
          import hashlib,json,os
          from pathlib import Path
          a=json.loads(Path('/tmp/terminal-ORIGINAL.json').read_text()); p=a['proof_payload']; o=p['whole_factor_layout_oracle']; x=p['frozen_instance_crosscheck']
          print('GITHUB_SHA='+os.environ['GITHUB_SHA'])
          print('ROOT_EMPTY_PROOF_SUBJECT='+os.environ['ROOT_EMPTY_PROOF_SUBJECT'])
          print('CANONICAL_AUDIT_SUBJECT='+os.environ['CANONICAL_AUDIT_SUBJECT'])
          print('TERMINAL_ARTIFACT_SHA256='+hashlib.sha256(Path('/tmp/terminal-ORIGINAL.json').read_bytes()).hexdigest())
          print('TERMINAL_SEMANTIC_DIGEST='+a['semantic_digest'])
          print('WHOLE_FACTOR_PERMUTATIONS='+str(o['permutation_count']))
          print('MINIMUM_LAYOUT_WIDTH='+str(o['minimum_layout_width']))
          print('ACCEPTING_LAYOUTS='+str(o['accepting_layout_count']))
          print('ROOT_EMPTY='+str(p['admitted_root_empty_observation']['derived_root_empty']).upper())
          print('POINTWISE_ROOT_LAYOUT_EQUIVALENCE='+str(x['root_empty_equals_no_width_le_k_layout']).upper())
          print('THREE_MODE_BYTE_IDENTITY=PASS')
          print('INVARIANTS=12/12')
          print('DIGEST_REPAIRED_TAMPERS_REJECTED=12/12')
          print('STRUCTURAL_INDUCTION_PROVED=FALSE')
          print('TERMINAL_COMPLETENESS_PROVED=FALSE')
          print('GLOBAL_ENGINE_NO_LAYOUT_AT_CAP=FORBIDDEN')
          print('P_VS_NP=OPEN')
          PY

      - name: Export terminal reflection evidence package
        uses: actions/upload-artifact@v4
        with:
          name: c049-b4-6-3-corrected-terminal-reflection
          retention-days: 7
          compression-level: 9
          path: |
            /tmp/terminal-exact-head-receipt.txt
            /tmp/terminal-ORIGINAL.json
            /tmp/terminal-REVERSED.json
            /tmp/terminal-SEEDED_SHUFFLE.json
            /tmp/terminal-ORIGINAL.log
            /tmp/terminal-REVERSED.log
            /tmp/terminal-SEEDED_SHUFFLE.log
            /tmp/terminal-verifier.log
            /tmp/empty-ORIGINAL.json
            /tmp/empty-verifier.log
            experiments/direct/C049_1_B4_6_3_CORRECTED_TERMINAL_REFLECTION_SPEC_V1_1.json
            experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection.py
            experiments/direct/janus_c049_1_b4_6_3_corrected_terminal_reflection_verifier.py
            experiments/direct/audits/C049_1_B4_6_3_CORRECTED_ROOT_EMPTY_UP_K_INDEPENDENT_SEMANTIC_AUDIT_6178EDBB.json
