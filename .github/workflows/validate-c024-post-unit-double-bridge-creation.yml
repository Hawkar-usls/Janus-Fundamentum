name: Validate C024 Post Unit Double Bridge Creation

on:
  push:
    paths:
      - "experiments/direct/janus_tear_gt_post_unit_double_bridge_creation.py"
      - ".github/workflows/validate-c024-post-unit-double-bridge-creation.yml"
  pull_request:
    paths:
      - "experiments/direct/janus_tear_gt_post_unit_double_bridge_creation.py"
      - ".github/workflows/validate-c024-post-unit-double-bridge-creation.yml"

permissions:
  contents: read

jobs:
  post-unit-double-bridge-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify post-unit double-bridge creation
        run: python experiments/direct/janus_tear_gt_post_unit_double_bridge_creation.py
