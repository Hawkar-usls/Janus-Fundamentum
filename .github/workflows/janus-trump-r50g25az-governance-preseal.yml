name: JANUS TRUMP R50G25AZ governance pre-seal

on:
  push:
    branches:
      - research/r50g25az-arbitrary-g-chain-composition-theorem-2026-09-08
    paths:
      - 'governance/R50G25AZ_PROMOTION_MANIFEST.json'
      - '.github/workflows/janus-trump-r50g25az-governance-preseal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governance-pre-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact immutable governance authority
        run: |
          mkdir -p governance-authority artifacts az-artifact
          git fetch --no-tags origin b0d4ed74afa98e49f3738244c4ede490ebfa95da ba7d5d927b1fd0bb4517123168c295f8d5e7c061
          git show b0d4ed74afa98e49f3738244c4ede490ebfa95da:governance/TRUMP_PROOF_STATE_MACHINE_v1.0.json > governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json
          git show ba7d5d927b1fd0bb4517123168c295f8d5e7c061:governance/trump_proof_state_machine_validator_v1.py > governance-authority/trump_proof_state_machine_validator_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json')
          got=hashlib.sha256(p.read_bytes()).hexdigest(); exp='ece56525f6affb8860fbb4628d96630478a854bfbf2f62f39fa017112badbb25'
          assert got==exp,(got,exp); print('POLICY_SHA256='+got)
          PY
      - name: Download exact hardened AZ artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Fundamentum
          run-id: 34185475330
          name: janus-trump-r50g25az-theorem-hardened
          path: az-artifact
      - name: Verify exact AZ theorem and generic-hardening identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected={
            'JANUS_TRUMP_R50G25AZ_THEOREM.json':'887819fdc9e6b3f048e30490dabfb4407a729bc468c1abbc315da9c0b65d0549',
            'JANUS_TRUMP_R50G25AZ_VERIFY.json':'d14a5d4ed0a20bed3ba36525108f714cea328e7f8e9fc24a9d8abc3ea28295f6',
            'JANUS_TRUMP_R50G25AZ_GENERIC_HARDENING.json':'32023777c86d38b200292c033a48b223a77d66008e0e77930042008c497a7df6',
            'JANUS_TRUMP_R50G25AZ_GENERIC_VERIFY.json':'f4ad6b9b70c6ffbc38c39008b7cf414d36f8b686824e92dd96af212f242233e1'}
          docs={}
          for name,want in expected.items():
              hits=list(Path('az-artifact').rglob(name)); assert len(hits)==1,(name,hits)
              b=hits[0].read_bytes(); got=hashlib.sha256(b).hexdigest(); assert got==want,(name,got,want); docs[name]=json.loads(b)
          T=docs['JANUS_TRUMP_R50G25AZ_THEOREM.json'];V=docs['JANUS_TRUMP_R50G25AZ_VERIFY.json'];H=docs['JANUS_TRUMP_R50G25AZ_GENERIC_HARDENING.json'];G=docs['JANUS_TRUMP_R50G25AZ_GENERIC_VERIFY.json']
          assert T['verdict']=='AZ_RESTRICTED_CHAIN_FAMILY_POLYNOMIAL_RELATION_THEOREM_PROVED' and T['failure_count']==0
          assert V['status']=='PASS' and V['failure_count']==0
          assert H['status']=='AZ_GENERIC_OBLIGATION_HARDENING_PASS' and H['failure_count']==0
          assert G['status']=='PASS' and G['failure_count']==0
          assert H['generic_policy_identity']['result'] is True
          assert H['lemma_status']=={'AZ_1':'PASS','AZ_2':'PASS','AZ_3':'PASS','AZ_4':'PASS','AZ_5':'PASS'}
          assert H['COMP']['certificate_composition']['formula']=='C_(g+1)=COMPOSE_CERT(C_g,C_bridge,C_1)'
          assert H['recurrences']['relation_rows']['closed']=='s_g=4577*g-4'
          assert H['recurrences']['evaluation_attempts']['closed']=='t_g=49242*g-2'
          assert G['classification']=='69_GENERIC_FAMILY_HARDENING_VERIFIED_PENDING_PROOF_STATE_MACHINE'
          print('AZ_HARDENED_EVIDENCE_IDENTITY=PASS')
          PY
      - name: Validate AZ promotion manifest fail-closed
        run: |
          python governance-authority/trump_proof_state_machine_validator_v1.py \
            --policy governance-authority/TRUMP_PROOF_STATE_MACHINE_v1.0.json \
            --manifest governance/R50G25AZ_PROMOTION_MANIFEST.json \
            --out artifacts/JANUS_TRUMP_R50G25AZ_GOVERNANCE_RECEIPT.json
      - name: Verify exact restricted-family promotions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/JANUS_TRUMP_R50G25AZ_GOVERNANCE_RECEIPT.json');x=json.loads(p.read_text())
          assert x['status']=='PASS',x
          assert x['violation_count']==0,x
          assert x['promotion_count_requested']==5 and x['promotion_count_passed']==5,x
          got={(q['from'],q['to'],q['scope']) for q in x['passed_promotions']}
          scope='EXACT_F_G_CHAIN_FAMILY_FOR_ALL_INTEGER_G_GE_1_ONLY'
          exp={
            ('UNIVERSAL_DOMAIN_SPECIFIED','UNIVERSAL_COVERAGE_PROVED',scope),
            ('RECONSTRUCTION_VERIFIED','GLOBAL_EXACTNESS_PROVED',scope),
            ('LOCAL_POLY_BOUND','ASYMPTOTIC_POLYNOMIAL_BOUND_PROVED',scope),
            ('PROOF_CANDIDATE','POLYNOMIAL_DOOR_PROVED',scope),
            ('HYPOTHESIS','PROOF_CANDIDATE','R50G25AZ_RESTRICTED_CHAIN_FAMILY_THEOREM_ONLY')}
          assert got==exp,(got,exp)
          print('AZ_GOVERNANCE_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-trump-r50g25az-governance-receipt
          path: artifacts/JANUS_TRUMP_R50G25AZ_GOVERNANCE_RECEIPT.json
          if-no-files-found: error
