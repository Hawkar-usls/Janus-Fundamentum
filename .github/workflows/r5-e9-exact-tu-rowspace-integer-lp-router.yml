name: R5 E9 Exact TU Row-Space Integer LP Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_TU_ROWSPACE_INTEGER_LP_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_exact_tu_rowspace_integer_lp_router.py'
      - '.github/workflows/r5-e9-exact-tu-rowspace-integer-lp-router.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact TU row-space regression
        run: python experiments/r5_e9_exact_tu_rowspace_integer_lp_router.py
