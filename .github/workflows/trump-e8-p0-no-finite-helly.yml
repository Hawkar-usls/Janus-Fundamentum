name: TRUMP E8 P0 No Finite Helly Coefficient Positivity

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_P0_NO_FINITE_HELLY_COEFFICIENT_POSITIVITY_2026-09-30_v3.3.json'
      - 'research/tools/e8_p0_no_finite_helly/checker.py'
      - '.github/workflows/trump-e8-p0-no-finite-helly.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact no-Helly regression
        run: python research/tools/e8_p0_no_finite_helly/checker.py
