name: JANUS TRUMP Osiris R3 Evidence Recovery

on:
  push:
    branches:
      - research/janus-trump-osiris-r3-natural-residuals-2026-09-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-trump-osiris-r3-evidence-recovery
  cancel-in-progress: false

jobs:
  recover-receipt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen specification unchanged
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/JANUS_TRUMP_OSIRIS_R3_NATURAL_RESIDUALS_PREREGISTRATION_2026-09-01.json'))
          f=json.load(open('research/JANUS_TRUMP_OSIRIS_R3_NATURAL_RESIDUALS_PRE_HOLDOUT_FREEZE_2026-09-01.json'))
          assert p['status']=='FROZEN_BEFORE_EXECUTION'
          assert f['status']=='SEALED_BEFORE_HOLDOUT'
          assert p['residual_acquisition_freeze']['selection_may_use_truth'] is False
          print('FROZEN_SPEC_UNCHANGED')
          PY
      - name: Compile implementation
        run: |
          python -m py_compile experiments/janus_trump_p_vs_np_direct_challenge_r0.py experiments/janus_trump_osiris_r3_natural_residuals.py experiments/janus_trump_osiris_r3_natural_residuals_runner.py
      - name: Run unit tests for diagnostics
        continue-on-error: true
        run: python -m unittest tests.test_janus_trump_osiris_r3_natural_residuals -v
      - name: Execute frozen runner regardless of hypothesis gate
        if: always()
        run: |
          mkdir -p artifacts
          python experiments/janus_trump_osiris_r3_natural_residuals_runner.py --output artifacts/JANUS_TRUMP_OSIRIS_R3_NATURAL_RESIDUALS_RESULT_2026-09-01.json
      - name: Print receipt summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifacts/JANUS_TRUMP_OSIRIS_R3_NATURAL_RESIDUALS_RESULT_2026-09-01.json')
          if not p.exists():
              raise SystemExit('receipt missing')
          d=json.load(open(p))
          print(json.dumps({'status':d['status'],'gates':d['gates']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-trump-osiris-r3-natural-residuals-recovered
          path: artifacts/JANUS_TRUMP_OSIRIS_R3_NATURAL_RESIDUALS_RESULT_2026-09-01.json
          if-no-files-found: error
