name: R5 E9 Kernel Walsh moment global augmentation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_KERNEL_WALSH_MOMENT_GLOBAL_AUGMENTATION_ROUTER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_kernel_walsh_moment_global_augmentation.py'
      - '.github/workflows/r5-e9-kernel-walsh-moment-global-augmentation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_kernel_walsh_moment_global_augmentation.py
      - name: Replay exact finite controls
        run: python experiments/r5_e9_kernel_walsh_moment_global_augmentation.py
