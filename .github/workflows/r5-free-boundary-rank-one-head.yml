name: R5 Free Boundary Rank One HEAD Scientific Gate
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py'
      - 'research/R5_ALL_SCL_EXPONENTIAL_FREE_BOUNDARY_LINEAR_RANK_2026-10-13.md'
      - '.github/workflows/r5-free-boundary-rank-one-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rank:
    name: Source-matched exact flat boundary 3-power exponential rank and SAT-UNSAT control
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 4x4 and Kronecker ranks, independent SCL SAT UNSAT source matrices, SCL1134
        run: python -u experiments/r5_universal_loop_free_boundary_exponential_flat_rank.py
