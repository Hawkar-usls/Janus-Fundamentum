name: R5 Atomic Two-Port Signature NP-Hardness Graft
on:
  push:
    branches:
      - research/r5-cubic-flow-smith-pair-20261011
    paths:
      - 'experiments/r5_universal_two_port_atomic_signature_nphard_graft.py'
      - '.github/workflows/r5-two-port-atomic-hardness-graft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graft:
    name: 'Strict connected SCL to irregular atomic port feasibility reduction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original SAT iff 2-port equal-diagonal SAT on all controls
        run: python -u experiments/r5_universal_two_port_atomic_signature_nphard_graft.py
