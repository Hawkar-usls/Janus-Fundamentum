name: TRUMP E8 C4 Diagonal Boolean Clone Barrier

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_C4_DIAGONAL_SWITCH_BOOLEAN_CLONE_BARRIER_2026-09-30_v5.4.json'
      - 'research/tools/e8_c4_diagonal_boolean_clone_barrier/checker.py'
      - '.github/workflows/trump-e8-c4-diagonal-boolean-clone-barrier.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact C4 diagonal Boolean-clone regression
        run: python research/tools/e8_c4_diagonal_boolean_clone_barrier/checker.py
