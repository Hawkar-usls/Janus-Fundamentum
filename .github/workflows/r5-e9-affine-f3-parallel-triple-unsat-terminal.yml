name: R5 E9 Affine F3 Parallel Triple UNSAT Terminal

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_PARALLEL_TRIPLE_UNSAT_TERMINAL_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_parallel_triple_unsat_terminal.py'
      - '.github/workflows/r5-e9-affine-f3-parallel-triple-unsat-terminal.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact affine F3 parallel-triple regression
        run: python experiments/r5_e9_affine_f3_parallel_triple_unsat_terminal.py
