name: BABEL-19 source Koszul repair of exact seed16 kerT cokernel
on:
  push:
    branches: ['research/babel19-scout-*']
    paths: ['experiments/babel19-scout/seed16_koszul_response.py','.github/workflows/babel19-seed16-koszul.yml']
  pull_request:
    paths: ['experiments/babel19-scout/seed16_koszul_response.py','.github/workflows/babel19-seed16-koszul.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-syzygy-response:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen source dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore source and stage-three exact reconstruction
        run: |
          mkdir -p /tmp/babel19koszul
          unzip -q experiments/babel14/BABEL14_SEED2_COMPACT_PROOF_BUNDLE_20261020.zip -d /tmp/babel19koszul
          cp experiments/babel18/rank2_geometry.py experiments/babel18b/full_kerT_sparse.py experiments/babel19-scout/crossbase_rank2.py experiments/babel19-scout/seed16_exact_cokernel.py experiments/babel19-scout/seed16_koszul_response.py /tmp/babel19koszul/
      - name: Build modular pivot candidates and exact rational cokernel
        working-directory: /tmp/babel19koszul
        run: |
          python crossbase_rank2.py --base-name SCL126_flip68 --seed 16 --prime 65521 --passes 6
          python seed16_exact_cokernel.py
      - name: Test lifted source-zero Koszul syzygies on the one remaining direction
        working-directory: /tmp/babel19koszul
        run: python seed16_koszul_response.py
      - name: Archive exact status and witness
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: babel19-seed16-exact-koszul-source-response
          path: /tmp/babel19koszul/babel19_seed16_koszul_response.json
          retention-days: 7
