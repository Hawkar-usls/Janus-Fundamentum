name: JANUS E12C4 internal proof generator and safe-abstention unit tests
on:
  push:
    branches:
      - research/time-sat-004e12c4-profit-aware-dev-20261102
    paths:
      - experiments/direct/janus_time_sat_004e12c4_profit_aware_dev.py
      - experiments/direct/janus_time_sat_004e12c4_autopilot_cycle.py
      - tests/test_time_sat_004e12c4_profit_aware_dev.py
      - tests/test_time_sat_004e12c4_autopilot_cycle.py
      - experiments/time_sat_004_external/E12C4_INTERNAL_DEV_README.md
      - .github/workflows/test-time-sat-004e12c4-internal-dev.yml
permissions:
  contents: read
concurrency:
  group: janus-e12c4-internal-dev-no-holdout-timing
  cancel-in-progress: false
jobs:
  certify-internal-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proof, split and abstention tests (no SAT solver, no holdout timing)
        run: python -m unittest discover -s tests -p 'test_time_sat_004e12c4*.py' -v
      - name: Write new internal original source SHA and transformed source manifest
        run: python experiments/direct/janus_time_sat_004e12c4_profit_aware_dev.py --write-cohort-lock evidence/e12c4-development/COHORT_LOCK.json
      - name: Fit only E12C3 exposed SHA-grouped full-cold development receipts
        run: python experiments/direct/janus_time_sat_004e12c4_profit_aware_dev.py --write-development-fit evidence/e12c4-development/DEV_FIT.json
      - name: Archive internal cohort SHA lock, not a scientific trial
        uses: actions/upload-artifact@v4
        with:
          name: sat-e12c4-internal-dev-cohort-lock-not-timed
          path: |
            evidence/e12c4-development/COHORT_LOCK.*
            evidence/e12c4-development/DEV_FIT.*
          retention-days: 7
          if-no-files-found: error
