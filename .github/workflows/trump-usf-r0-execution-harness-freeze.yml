name: TRUMP USF R0 execution harness freeze verification

on:
  push:
    branches:
      - research/trump-universal-structural-funnel-adversarial-family-preregistration-2026-09-10
    paths:
      - research/trump_usf_r0_frozen_generators.py
      - research/trump_usf_r0_execution_harness.py
      - research/trump_usf_r0_execution_harness_frozen_entrypoint.py
      - research/verify_trump_usf_r0_execution_harness_freeze.py
      - .github/workflows/trump-usf-r0-execution-harness-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-harness-freeze-verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert freeze verifier identity and zero execution counters
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/verify_trump_usf_r0_execution_harness_freeze.py)" = "78a175aafb6a3094d26dd9e8a9f035c21f94f15d"
          printf '%s\n' \
            'generated_real_USF_instances=0' \
            'generated_lane_A_instances=0' \
            'generated_lane_B_instances=0' \
            'generated_lane_C_instances=0' \
            'USF_DISCOVERY_EXECUTION_STARTED=false' \
            'HOLDOUT_EXECUTION_STARTED=false'

      - name: Run independent synthetic freeze verifier only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/TRUMP_USF_R0_EXECUTION_HARNESS_FREEZE_VERIFICATION.json"
          python3 research/verify_trump_usf_r0_execution_harness_freeze.py --output "$OUT"
          python3 - "$OUT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'EXECUTION_HARNESS_FREEZE_SYNTHETIC_VERIFICATION_PASS'
          assert data['generated_real_USF_instances'] == 0
          assert data['generated_lane_A_instances'] == 0
          assert data['generated_lane_B_instances'] == 0
          assert data['generated_lane_C_instances'] == 0
          assert data['discovery_execution_started'] is False
          assert data['holdout_execution_started'] is False
          assert data['truth_oracle_invoked_by_freeze_verifier'] is False
          assert data['finite_experiment_is_asymptotic_authority'] is False
          assert data['H1'] == 'OPEN'
          assert data['H2'] == 'OPEN'
          assert data['H3'] == 'OPEN'
          assert data['SAT_IN_P'] == 'NOT_PROVED'
          assert data['P_VS_NP'] == 'OPEN'
          assert data['BA26_STARTED'] is False
          raw = path.read_bytes()
          print('EXECUTION_HARNESS_FREEZE_VERIFICATION_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('DISCOVERY_SCHEDULE_COUNT=' + str(data['discovery_schedule_count']))
          print('HOLDOUT_SCHEDULE_COUNT_FROZEN_BUT_UNOPENED=' + str(data['holdout_schedule_count_frozen_but_unopened']))
          print('EMPTY_GRAPH_WIDTH_BINDING_VERIFIED=' + str(data['implementation_binding_empty_graph_width_minus_one_verified']).lower())
          print('A5_HISTORICAL_REPLAY_BINDING_AST_VERIFIED=' + str(data['A5_historical_replay_binding_ast_verified']).lower())
          print('EXECUTION_HARNESS_FREEZE_SYNTHETIC_VERIFICATION_PASS=true')
          PY

      - name: Run pinned truth-oracle harness integration on synthetic micro-fixtures
        shell: bash
        env:
          CADICAL_PACKAGE_SHA256: d25649a8bb30bede6af5b5d81cc9fce4017197640940863283df722eff88f88d
          LRAT_PACKAGE_SHA256: a2613ed11f3b2ee1a183ed64ba265a7d88b9b892cef1a40a9097132ccabcc31f
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/trump-usf-r0-harness-truth-synthetic"
          mkdir -p "$ROOT/cad" "$ROOT/lrat"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/c/cadical/cadical_1.7.4-1+b1_amd64.deb' -o "$ROOT/cadical.deb"
          curl -fsSL 'https://ftp.debian.org/debian/pool/main/d/drat-trim/drat-trim_0.0~git20240428.effa1dc-2_amd64.deb' -o "$ROOT/lrat.deb"
          printf '%s  %s\n' "$CADICAL_PACKAGE_SHA256" "$ROOT/cadical.deb" | sha256sum -c -
          printf '%s  %s\n' "$LRAT_PACKAGE_SHA256" "$ROOT/lrat.deb" | sha256sum -c -
          dpkg-deb -x "$ROOT/cadical.deb" "$ROOT/cad"
          dpkg-deb -x "$ROOT/lrat.deb" "$ROOT/lrat"
          test "$(sha256sum "$ROOT/cad/usr/bin/cadical" | cut -d' ' -f1)" = 'd258dc72e4ec52d434a29f3b2c44dcfd800c10f898cce783f2bf6755b711fb39'
          test "$(sha256sum "$ROOT/lrat/usr/bin/lrat-check" | cut -d' ' -f1)" = '35caa09cb09bc24178ccbddafaedac1f5774190e3ac3d8c9f03cf11e133dee8c'
          sudo install -m 0755 "$ROOT/cad/usr/bin/cadical" /usr/bin/cadical
          sudo install -m 0755 "$ROOT/lrat/usr/bin/lrat-check" /usr/bin/lrat-check
          printf 'CADICAL_RUNTIME_VERSION=%s\n' "$(/usr/bin/cadical --version)"
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path('.').resolve()
          sys.path.insert(0, str(root / 'research'))
          import trump_usf_r0_execution_harness as core
          assert core.git_blob_sha1(root / 'research/trump_usf_r0_execution_harness.py') == 'ed4203bac76349ab377bb97f67bf1054d837bc96'
          _assertions, gen, *_ = core.load_modules(root)
          sat = core.truth_oracle(gen, ((1,), (-1, 2)))
          unsat = core.truth_oracle(gen, ((1,), (-1,)))
          assert sat['truth_state'] == 'SAT_WITNESS_VERIFIED', sat
          assert sat['direct_original_cnf_validation']['pass'] is True
          assert unsat['truth_state'] == 'UNSAT_PROOF_VERIFIED', unsat
          assert unsat['checker_exit_code'] == 0
          result = {
              'schema': 'TRUMP_USF_R0_HARNESS_TRUTH_ORACLE_SYNTHETIC_INTEGRATION',
              'scientific_role': 'INFRASTRUCTURE_ONLY_NOT_LANE_A_B_C_EVIDENCE',
              'SAT_fixture_truth_state': sat['truth_state'],
              'SAT_direct_original_validation': sat['direct_original_cnf_validation']['pass'],
              'UNSAT_fixture_truth_state': unsat['truth_state'],
              'UNSAT_checker_exit_code': unsat['checker_exit_code'],
              'generated_real_USF_instances': 0,
              'discovery_execution_started': False,
              'finite_experiment_is_asymptotic_authority': False,
          }
          raw = (json.dumps(result, sort_keys=True, separators=(',', ':')) + '\n').encode()
          print('HARNESS_TRUTH_SYNTHETIC_RESULT=' + raw.decode().strip())
          print('HARNESS_TRUTH_SYNTHETIC_RESULT_SHA256=' + hashlib.sha256(raw).hexdigest())
          PY

      - name: Reassert scientific firewall and STOP boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'TRUTH_ORACLE_READY_FOR_FAMILY_EXECUTION=true' \
            'USF_DISCOVERY_EXECUTION_STARTED=false' \
            'generated_real_USF_instances=0' \
            'H1=OPEN' \
            'H2=OPEN' \
            'H3=OPEN' \
            'SAT_IN_P=NOT_PROVED' \
            'P_VS_NP=OPEN' \
            'BA26_STARTED=false' \
            'STOP_AFTER_EXECUTION_HARNESS_FREEZE_BEFORE_FIRST_REAL_USF_INSTANCE=true'
