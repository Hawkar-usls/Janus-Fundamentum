name: TRUMP general SAT uniform Gaussian closure audit

on:
  push:
    branches:
      - research/general-sat-uniform-gaussian-closure-audit-2026-10-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Uniform Gaussian implication closure audit
        run: python research/tools/general_sat_uniform_closure/uniform_gaussian_implication_audit.py
      - name: Bidirectional Gaussian probe closure
        run: python research/tools/general_sat_uniform_closure/bidirectional_gaussian_probe_closure.py
      - name: Two-sided Gaussian probe closure
        run: python research/tools/general_sat_uniform_closure/two_sided_gaussian_probe_closure.py
      - name: Scalable PHP OPEN-family firewall
        run: python research/tools/general_sat_uniform_closure/php_scalable_open_firewall.py
      - name: Choice-resource Hall terminal
        run: python research/tools/general_sat_uniform_closure/choice_resource_hall_terminal.py
      - name: Bit-PHP high-rank OPEN firewall
        run: python research/tools/general_sat_uniform_closure/bit_php_open_firewall.py
      - name: Binary AllDifferent capacity terminal
        run: python research/tools/general_sat_uniform_closure/binary_alldifferent_capacity_terminal.py
      - name: Basis-invariant subspace AllDifferent terminal
        run: python research/tools/general_sat_uniform_closure/subspace_alldifferent_capacity_terminal.py
      - name: Graph 4-coloring quotient firewall
        run: python research/tools/general_sat_uniform_closure/graph4color_2xnf_firewall.py
      - name: Preserve scientific claim ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/TRUMP_GENERAL_SAT_UNIFORM_GAUSSIAN_CLOSURE_AUDIT_2026-10-08_v1.0.md")
          s=p.read_text(encoding="utf-8")
          assert "GENERAL_SAT_IN_P = NOT_PROVED" in s
          assert "P_VS_NP = OPEN" in s
          assert "HIGH_RANK_CONNECTED_RESIDUE = OPEN" in s
          print("CLAIM_CEILING_OK")
          PY
