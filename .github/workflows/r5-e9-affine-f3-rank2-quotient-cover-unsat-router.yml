name: R5 E9 Affine F3 Rank2 Quotient Cover UNSAT Router

on:
  pull_request:
    paths:
      - 'research/R5_E9_AFFINE_F3_RANK2_QUOTIENT_COVER_UNSAT_ROUTER_2026-09-30_v1.0.md'
      - 'experiments/r5_e9_affine_f3_rank2_quotient_cover_unsat_router.py'
      - '.github/workflows/r5-e9-affine-f3-rank2-quotient-cover-unsat-router.yml'
  workflow_dispatch:

jobs:
  exact-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact rank-2 quotient-cover regression
        run: python experiments/r5_e9_affine_f3_rank2_quotient_cover_unsat_router.py
