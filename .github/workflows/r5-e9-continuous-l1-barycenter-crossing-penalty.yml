name: R5 E9 Continuous L1 barycenter crossing penalty

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/R5_E9_CONTINUOUS_L1_BARYCENTER_AND_CROSSING_PENALTY_BARRIER_2026-09-29_v1.0.md'
      - 'experiments/r5_e9_continuous_l1_barycenter_crossing_penalty.py'
      - '.github/workflows/r5-e9-continuous-l1-barycenter-crossing-penalty.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile experiments/r5_e9_continuous_l1_barycenter_crossing_penalty.py
      - name: Replay exact finite control
        run: python experiments/r5_e9_continuous_l1_barycenter_crossing_penalty.py
