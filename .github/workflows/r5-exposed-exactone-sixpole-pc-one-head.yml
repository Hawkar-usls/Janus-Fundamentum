name: R5 Exposed Exact-One Sixpole and GF3 PC Back-Transfer One HEAD
on:
  push:
    branches: [research/r5-cubic-flow-smith-pair-20261011]
    paths:
      - 'experiments/r5_universal_open_sixpole_2175_108000_signature_composition.py'
      - 'experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py'
      - 'experiments/r5_universal_boolean_pair_xor6_tseitin_saturation_falsifier.py'
      - 'experiments/r5_universal_petersen_6pole_boolean_atmostone_exact_source.py'
      - 'research/R5_EXPOSED_EXACTONE_SIXPOLE_EXHAUSTIVE_AND_GF3_PC_DECODER_2026-10-13.md'
      - '.github/workflows/r5-exposed-exactone-sixpole-pc-one-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-multipole-source:
    name: Exact sixpole 40k+2175+108k gates, GF3 identities and native source controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive small simple sixpoles Petersen cuts and 3-wire compositions
        run: python -u experiments/r5_universal_open_sixpole_2175_108000_signature_composition.py
      - name: Native GF3 degree-four Boolean equality decoder and signed charge obstruction
        run: python -u experiments/r5_universal_boolean_pair_gf3_decoder_charge_gauge.py
      - name: Recheck source C4 wire C6 odd XOR and global SAT saturation falsifier
        run: python -u experiments/r5_universal_boolean_pair_xor6_tseitin_saturation_falsifier.py
      - name: Recheck Petersen AT-MOST-ONE and closed legal SCL72
        run: python -u experiments/r5_universal_petersen_6pole_boolean_atmostone_exact_source.py
