name: R5 E9 Exact Matching Toggle Pair Exchange

on:
  push:
    branches:
      - codex/r5-e8-direct-contract-20260921-82493a57
    paths:
      - 'research/R5_E9_EXACT_MATCHING_TOGGLE_PAIR_EXCHANGE_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_exact_matching_toggle_pair_exchange.py'
      - '.github/workflows/r5-e9-exact-matching-toggle-pair-exchange.yml'
  pull_request:
    paths:
      - 'research/R5_E9_EXACT_MATCHING_TOGGLE_PAIR_EXCHANGE_BARRIER_2026-09-28_v1.0.md'
      - 'experiments/r5_e9_exact_matching_toggle_pair_exchange.py'
      - '.github/workflows/r5-e9-exact-matching-toggle-pair-exchange.yml'

permissions:
  contents: read

jobs:
  exact-matching-toggle-pair-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact toggle pair-exchange barrier
        run: python experiments/r5_e9_exact_matching_toggle_pair_exchange.py
