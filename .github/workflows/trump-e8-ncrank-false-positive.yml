name: TRUMP E8 noncommutative-rank false positive

on:
  pull_request:
    paths:
      - 'research/R5_B1B1C5B2B2_E8_NONCOMMUTATIVE_RANK_FALSE_POSITIVE_2026-09-26_v1.5.json'
      - 'research/tools/e8_ncrank_false_positive/checker.py'
      - '.github/workflows/trump-e8-ncrank-false-positive.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite replay
        run: python research/tools/e8_ncrank_false_positive/checker.py
