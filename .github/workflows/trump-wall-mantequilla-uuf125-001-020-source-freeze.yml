name: TRUMP WALL Mantequilla UUF125 001-020 source freeze

on:
  push:
    branches:
      - research/TRUMP_WALL-MANTEQUILLA-unseen-UUF125-active-eligibility-2026-09-18
    paths:
      - .github/workflows/trump-wall-mantequilla-uuf125-001-020-source-freeze.yml

permissions:
  contents: write

concurrency:
  group: trump-wall-mantequilla-uuf125-001-020-source-freeze
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    env:
      BRANCH: research/TRUMP_WALL-MANTEQUILLA-unseen-UUF125-active-eligibility-2026-09-18
      ARCHIVE_URL: https://www.cs.ubc.ca/~hoos/SATLIB/Benchmarks/SAT/RND3SAT/uuf125-538.tar.gz
      ARCHIVE_SHA1: fa80526091a284bdeff9a62f145edc443ce3ffc8
      MANIFEST: research/TRUMP_WALL_MANTEQUILLA_UUF125_001_020_SOURCE_FREEZE_AUTHORITY_2026-09-18_v1.0.json

    steps:
      - name: Checkout exact acquisition head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify superseding acquisition authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "research/TRUMP_WALL_MANTEQUILLA_UUF125_001_020_ACTIVE_EXACT_SYMMETRY_PANEL_RESERVATION_2026-09-18_v1.1.json": "878480712bd6cd38929fdbfc17082b72cf0ccc1b",
            "research/TRUMP_WALL_MANTEQUILLA_UUF125_001_020_SOURCE_ACQUISITION_REVIEW_2026-09-18_v1.1.json": "a69e35b674d7305251ff70700fdfbca9890452cf",
          }
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          bad={p:{"expected":h,"observed":blob(p)} for p,h in expected.items() if blob(p)!=h}
          if bad:
              raise SystemExit(f"UUF125_ACQUISITION_AUTHORITY_BIND_FAILURE:{bad}")
          print("UUF125_ACQUISITION_AUTHORITIES_OK")
          PY

      - name: Download and verify canonical SATLIB archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uuf125
          curl -L --fail --retry 3 --connect-timeout 20 "$ARCHIVE_URL" -o /tmp/uuf125/uuf125-538.tar.gz
          OBS="$(sha1sum /tmp/uuf125/uuf125-538.tar.gz | awk '{print $1}')"
          echo "archive_sha1=$OBS"
          test "$OBS" = "$ARCHIVE_SHA1"
          sha256sum /tmp/uuf125/uuf125-538.tar.gz
          mkdir -p /tmp/uuf125/extract
          tar -xzf /tmp/uuf125/uuf125-538.tar.gz -C /tmp/uuf125/extract

      - name: Freeze exact 001-020 raw sources and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/source_data
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path("/tmp/uuf125/extract")
          outdir=Path("research/source_data")
          archive=Path("/tmp/uuf125/uuf125-538.tar.gz")

          def git_blob_bytes(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          def parse_dimacs(path: Path):
              nvars=nclauses=None
              clauses=[]
              buf=[]
              terminated=False
              for raw in path.read_text(encoding="ascii").splitlines():
                  s=raw.strip()
                  if not s or s.startswith("c"):
                      continue
                  if terminated:
                      continue
                  if s=="%":
                      terminated=True
                      continue
                  if s.startswith("p "):
                      parts=s.split()
                      if len(parts)!=4 or parts[0]!="p" or parts[1]!="cnf":
                          raise ValueError(f"BAD_HEADER:{path.name}:{s}")
                      nvars,nclauses=int(parts[2]),int(parts[3])
                      continue
                  if s=="0" and not buf and nclauses is not None and len(clauses)==nclauses:
                      terminated=True
                      continue
                  for z in map(int,s.split()):
                      if z==0:
                          if not buf:
                              raise ValueError(f"EMPTY_CLAUSE_OR_BAD_TERMINATOR:{path.name}")
                          clauses.append(tuple(buf))
                          buf=[]
                      else:
                          buf.append(z)
              if buf:
                  raise ValueError(f"UNTERMINATED_CLAUSE:{path.name}")
              if (nvars,nclauses)!=(125,538):
                  raise ValueError(f"BAD_SHAPE:{path.name}:{nvars}:{nclauses}")
              if len(clauses)!=538:
                  raise ValueError(f"BAD_CLAUSE_COUNT:{path.name}:{len(clauses)}")
              for c in clauses:
                  if len(c)!=3 or len({abs(x) for x in c})!=3:
                      raise ValueError(f"NON_CANONICAL_3CNF:{path.name}:{c}")
                  if any(abs(x)<1 or abs(x)>125 for x in c):
                      raise ValueError(f"VARIABLE_RANGE:{path.name}:{c}")
              canonical="".join(" ".join(map(str,c))+" 0\n" for c in clauses).encode("ascii")
              return clauses, hashlib.sha256(canonical).hexdigest()

          receipts=[]
          for idx in range(1,21):
              basename=f"uuf125-0{idx}.cnf"
              matches=list(root.rglob(basename))
              if len(matches)!=1:
                  raise SystemExit(f"EXPECTED_EXACTLY_ONE_SOURCE:{basename}:FOUND={len(matches)}")
              src=matches[0]
              clauses, canonical_sha=parse_dimacs(src)
              data=src.read_bytes()
              internal=f"SATLIB_UUF125_{idx:03d}_2026-09-18.cnf"
              dest=outdir/internal
              dest.write_bytes(data)
              receipts.append({
                  "source":f"UUF125_{idx:03d}",
                  "satlib_basename":basename,
                  "archive_member":str(src.relative_to(root)),
                  "committed_path":str(dest),
                  "raw_sha256":hashlib.sha256(data).hexdigest(),
                  "git_blob":git_blob_bytes(data),
                  "canonical_formula_sha256":canonical_sha,
                  "variables":125,
                  "clauses":538,
                  "clause_width":3,
              })

          manifest={
              "artifact_id":"JANUS-TRUMP-WALL-MANTEQUILLA-UUF125-001-020-SOURCE-FREEZE-AUTHORITY-2026-09-18-v1.0",
              "date":"2026-09-18",
              "family":"SATLIB_UUF125.538.100",
              "reservation_authority":{
                  "version":"v1.1",
                  "commit":"378574bfe274f4082a62d6ee0552385653179fae",
                  "blob":"878480712bd6cd38929fdbfc17082b72cf0ccc1b"
              },
              "panel":["UUF125_%03d"%i for i in range(1,21)],
              "archive":{
                  "url":os.environ["ARCHIVE_URL"],
                  "sha1":hashlib.sha1(archive.read_bytes()).hexdigest(),
                  "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "expected_sha1":os.environ["ARCHIVE_SHA1"],
              },
              "source_receipts":receipts,
              "acquisition_scope":{
                  "structural_metrics_read":False,
                  "WL_run":False,
                  "symmetry_detection_run":False,
                  "local_boundary_read":False,
                  "Mantequilla_run":False,
                  "SAT_solver_invocations":0,
              },
              "verdict":"PASS_UUF125_001_020_CANONICAL_SATLIB_SOURCE_ACQUISITION",
          }
          Path(os.environ["MANIFEST"]).write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({
              "verdict":manifest["verdict"],
              "archive_sha1":manifest["archive"]["sha1"],
              "source_count":len(receipts),
              "canonical_formula_sha256":[r["canonical_formula_sha256"] for r in receipts],
          },sort_keys=True))
          PY

      - name: Independent source freeze verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          assert len(m["source_receipts"])==20
          assert m["panel"]==[f"UUF125_{i:03d}" for i in range(1,21)]
          assert m["archive"]["sha1"]==os.environ["ARCHIVE_SHA1"]
          seen=set()
          for i,r in enumerate(m["source_receipts"],1):
              assert r["source"]==f"UUF125_{i:03d}"
              p=Path(r["committed_path"])
              data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==r["raw_sha256"]
              assert hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()==r["git_blob"]
              hdr=[x.strip() for x in p.read_text(encoding="ascii").splitlines() if x.strip().startswith("p ")]
              assert hdr==["p cnf 125 538"]
              assert r["canonical_formula_sha256"] not in seen
              seen.add(r["canonical_formula_sha256"])
          assert len(seen)==20
          m["independent_verification"]="PASS_INDEPENDENT_UUF125_001_020_SOURCE_FREEZE_VERIFICATION"
          Path(os.environ["MANIFEST"]).write_text(json.dumps(m,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(m["independent_verification"])
          PY

      - name: Upload acquisition receipt
        uses: actions/upload-artifact@v4
        with:
          name: trump-wall-mantequilla-uuf125-source-freeze-${{ github.run_id }}
          path: |
            research/TRUMP_WALL_MANTEQUILLA_UUF125_001_020_SOURCE_FREEZE_AUTHORITY_2026-09-18_v1.0.json
            research/source_data/SATLIB_UUF125_*_2026-09-18.cnf
          if-no-files-found: error
          retention-days: 90

      - name: Freeze raw sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" research/source_data/SATLIB_UUF125_*_2026-09-18.cnf
          git commit -m "TRUMP WALL freeze UUF125 001-020 SATLIB sources"
          git push origin "HEAD:$BRANCH"

      - name: Enforce acquisition PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          assert x["verdict"]=="PASS_UUF125_001_020_CANONICAL_SATLIB_SOURCE_ACQUISITION"
          assert x["independent_verification"]=="PASS_INDEPENDENT_UUF125_001_020_SOURCE_FREEZE_VERIFICATION"
          assert len(x["source_receipts"])==20
          print("UUF125_SOURCE_FREEZE_PASS")
          PY
