name: Independent replication
description: Report a clean-room or otherwise independent reproduction attempt.
title: "[Replication] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Independent reproduction is especially valuable for the A3 publication track. Please distinguish a new implementation from another execution of the existing implementation.

  - type: input
    id: target
    attributes:
      label: Target theorem / publication object
      placeholder: A3 endpoint DP / publication target 811d... / ...
    validations:
      required: true

  - type: input
    id: target_sha
    attributes:
      label: Exact target SHA
      placeholder: 40-character Git SHA
    validations:
      required: true

  - type: dropdown
    id: independence
    attributes:
      label: Independence level
      options:
        - Clean-room implementation from theorem/specification
        - Independent implementation with limited reference to existing code
        - Independent environment, same implementation
        - Same implementation, repeated execution
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Implementation and environment
      description: Language, runtime, OS, dependencies, hardware where relevant.
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: Reproduction method
      description: Explain what you reimplemented or replayed and what data/fixtures were used.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results
      description: Report exact state counts, transitions, endpoint values, hashes, discrepancies, or other relevant outputs.
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Public artifacts / repository
      description: Link to code, frozen outputs, or archived artifacts if available.
    validations:
      required: false

  - type: dropdown
    id: verdict
    attributes:
      label: Reproduction verdict
      options:
        - Reproduced in declared scope
        - Partial reproduction
        - Discrepancy found
        - Unable to reproduce
        - Inconclusive
    validations:
      required: true

  - type: checkboxes
    id: ceiling
    attributes:
      label: Scope acknowledgment
      options:
        - label: I will not describe same-implementation reruns as an independent implementation.
          required: true
        - label: I understand that external replication does not by itself establish world novelty or resolve P vs NP.
          required: true
