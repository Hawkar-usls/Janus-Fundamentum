name: Counterexample / proof defect
description: Report a concrete mathematical, verifier, or provenance counterexample.
title: "[Counterexample] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying to break JANUS. A minimal reproducible counterexample is one of the highest-value contributions to this repository.

  - type: input
    id: target_claim
    attributes:
      label: Target claim or gate
      description: Name the exact theorem, hypothesis, verifier gate, or publication statement.
      placeholder: A3 endpoint sufficiency / C023 cache rule / verifier binding / ...
    validations:
      required: true

  - type: input
    id: target_sha
    attributes:
      label: Exact commit / publication SHA
      description: Provide the exact Git commit or immutable publication target you tested.
      placeholder: 40-character Git SHA
    validations:
      required: true

  - type: textarea
    id: instance
    attributes:
      label: Minimal counterexample or failing instance
      description: Include the smallest explicit object you can provide.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the claim predicts
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What actually happens
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction commands
      description: Include commands, scripts, fixtures, and environment details when applicable.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Suspected impact
      options:
        - Mathematical theorem / proof
        - Verifier semantics
        - Provenance / evidence binding
        - Reproducibility only
        - Publication / documentation only
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: ceiling
    attributes:
      label: Claim-ceiling acknowledgment
      options:
        - label: I understand that P vs NP is currently OPEN in this repository.
          required: true
