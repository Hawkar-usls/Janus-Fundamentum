name: Prior art / earlier theorem
description: Report literature that may subsume or materially narrow a JANUS novelty claim.
title: "[Prior art] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Prior-art reports are welcome. The current A3 ceiling is N3_NOVELTY_CANDIDATE, not historical world priority.

  - type: input
    id: citation
    attributes:
      label: Full citation
      description: Authors, title, venue/year.
    validations:
      required: true

  - type: input
    id: identifier
    attributes:
      label: Stable identifier
      description: DOI, arXiv ID, journal URL, book ISBN/theorem number, or other stable locator.
    validations:
      required: true

  - type: dropdown
    id: relation
    attributes:
      label: Claimed relation to JANUS result
      options:
        - Exact equivalent
        - Direct definitional corollary
        - Strictly stronger
        - Strictly weaker
        - Near-neighbor / structurally related
        - Search lead only
    validations:
      required: true

  - type: textarea
    id: mapping
    attributes:
      label: Exact mapping
      description: Identify the theorem/definition in the source and explain how its hypotheses and conclusion map to the JANUS claim.
    validations:
      required: true

  - type: textarea
    id: differences
    attributes:
      label: Important differences
      description: Field assumptions, multiplicities, parameterization, algorithmic output, complexity bound, or other scope differences.
    validations:
      required: false

  - type: checkboxes
    id: ceiling
    attributes:
      label: Novelty-ceiling acknowledgment
      options:
        - label: I understand that the repository does not currently claim historical world priority or N4 novelty.
          required: true
